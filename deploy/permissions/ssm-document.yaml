# kubegap read-only node inspection, as an SSM Command document.
# Generated by `scripts/kubegap node-commands --ssm-document` from collectors/*/collect.yaml and lib/collection/node.py; tests/test_node_commands.py fails when it is stale.
# The IAM policy (deploy/permissions/iam-policy.json) allows ssm:SendCommand on this document only, so the commands below are all a key with that policy can run on a node.
# Install once per account and region (needs ssm:CreateDocument, ssm:UpdateDocument, ssm:UpdateDocumentDefaultVersion and ssm:ListDocumentVersions; none of these is in the read-only policy):
#   aws ssm create-document --name kubegap-node-read --document-type Command --document-format YAML --content file://deploy/permissions/ssm-document.yaml
# After a kubegap update that changes this file:
#   aws ssm update-document --name kubegap-node-read --document-version '$LATEST' --document-format YAML --content file://deploy/permissions/ssm-document.yaml
#   aws ssm update-document-default-version --name kubegap-node-read --document-version <new version>
# `kubegap setup --install-ssm-document` runs these for you with the current AWS credentials.
schemaVersion: "2.2"
description: kubegap read-only node inspection. step selects one of 27 fixed read commands; podIp (an IPv4 address) and port (digits) are the only free values. Generated from the kubegap repository, do not edit by hand.
parameters:
  step:
    type: String
    description: Which fixed read command to run.
    allowedValues:
      - probe
      - capabilities
      - alb-controller/controller-metrics
      - argocd/application-controller-metrics
      - argocd/repo-server-metrics
      - argocd/server-metrics
      - cert-manager/controller-metrics
      - core/node-os
      - eks-platform/kubelet-journal
      - eks-platform/containerd-journal
      - external-secrets/controller-metrics
      - grafana/self-metrics
      - k3s-platform/k3s-journal-errors
      - k3s-platform/k3s-journal-stats
      - k3s-platform/k3s-scheduler-unschedulable
      - k3s-platform/k3s-webhook-failures
      - k3s-platform/k3s-etcd-slow
      - k3s-platform/kubelet-pleg
      - k3s-platform/k3s-node
      - k3s-platform/containerd-log
      - karpenter/controller-metrics
      - keda/metrics-apiserver-metrics
      - keda/operator-metrics
      - kube-proxy/proxy-mode
      - metallb/metallb-speaker-metrics
      - vpc-cni/ipamd-metrics
      - vpc-cni/ipamd-log
  podIp:
    type: String
    description: Pod IP for the pod-metrics curl steps. Ignored by the other steps.
    default: 127.0.0.1
    allowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
  port:
    type: String
    description: Metrics port for the pod-metrics curl steps, found at discovery from the component's container port (lib/foundations/podmetrics.discover_targets). Ignored by the other steps.
    default: '0'
    allowedPattern: '^[0-9]{1,5}$'
  executionTimeout:
    type: String
    description: Seconds before the command is stopped.
    default: '600'
    allowedPattern: '^[0-9]{1,4}$'
mainSteps:
  - action: aws:runShellScript
    name: kubegapRead
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '{{ executionTimeout }}'
      runCommand:
        - |
          case "{{ step }}" in
          probe)
            echo kubegap-ok; uname -r; hostname
            ;;
          capabilities)
            echo cap:journal=$( journalctl -n1 -q -u k3s -u k3s-agent -u kubelet -u containerd >/dev/null 2>&1 && echo yes || echo no );echo cap:kernlog=$( [ -r /var/log/kern.log ] && echo yes || echo no );echo cap:dmesg=$( dmesg -T >/dev/null 2>&1 && echo yes || ( sudo -n dmesg -T >/dev/null 2>&1 && echo sudo || echo no ) );echo cap:k3s-db=$( ls /var/lib/rancher/k3s/server/db >/dev/null 2>&1 && echo yes || ( sudo -n ls -la /var/lib/rancher/k3s/server/db >/dev/null 2>&1 && echo sudo || echo no ) );echo cap:k3s-config=$( cat /etc/rancher/k3s/config.yaml >/dev/null 2>&1 && echo yes || ( sudo -n cat /etc/rancher/k3s/config.yaml >/dev/null 2>&1 && echo sudo || ( [ -e /etc/rancher/k3s/config.yaml ] && echo no || echo absent ) ) );echo cap:crictl=$( (command -v crictl >/dev/null && crictl info >/dev/null 2>&1) && echo yes || ( sudo -n /usr/local/bin/k3s crictl info >/dev/null 2>&1 && echo sudo || echo no ) );echo cap:sudo-any=$( sudo -n true >/dev/null 2>&1 && echo yes || echo no );echo cap:k3s-role=$( systemctl is-active k3s >/dev/null 2>&1 && echo server || ( systemctl is-active k3s-agent >/dev/null 2>&1 && echo agent || echo none ) );echo cap:cgroup=$( stat -fc %T /sys/fs/cgroup/ 2>/dev/null )
            ;;
          alb-controller/controller-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(aws_api_call_duration_seconds_(sum|count)|aws_api_call_retries_(sum|count)|controller_runtime_(reconcile|webhook_requests_total|max_concurrent)|leader_election|rest_client_requests_total|workqueue_depth|process_(resident_memory_bytes|start_time))'
            ;;
          argocd/application-controller-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(argocd_app_(sync_total|reconcile_(sum|count))|argocd_app_k8s_request_total\{.*response_code="[45][0-9][0-9]"|argocd_cluster_(cache_age_seconds|api_resource_objects|api_resources|connection_status|events_total|info)|argocd_redis_request_total|argocd_kubectl_exec_(total|pending)|process_(start_time|resident_memory_bytes))'
            ;;
          argocd/repo-server-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(argocd_git_(request_total|lsremote_fail_total|fetch_fail_total|request_duration_seconds_(sum|count))|argocd_repo_pending_request_total|argocd_redis_request_total|process_(start_time|resident_memory_bytes))'
            ;;
          argocd/server-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(grpc_server_handled_total\{.*\} [1-9]|argocd_redis_request_total|argocd_info|process_(start_time|resident_memory_bytes))'
            ;;
          cert-manager/controller-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(certmanager_(certificate_(expiration_timestamp_seconds|renewal_timestamp_seconds|ready_status)|http_acme_client_request_count|controller_sync_(error_count|call_count)|clock_time_seconds)|process_(start_time|resident_memory_bytes))'
            ;;
          core/node-os)
            #!/bin/sh
            # kubegap node OS read-only inspection. Writes nothing to the node.
            # On EKS it runs via SSM (root); over SSH it runs as the login user and only the read-only commands allowed by deploy/node-access/kubegap-sudoers via sudo -n.
            # Output is a sequence of sections split by "### <section>" and is parsed by lib/summaries/nodeos.py. SSM truncates stdout at 24,000 characters, so every section caps its line count.
            S() { echo "### $1"; }
            if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            K3S=/usr/local/bin/k3s

            S meta
            echo "uid=$(id -u)"
            echo "hostname=$(hostname 2>/dev/null)"
            echo "kernel=$(uname -r)"
            echo "os=$(. /etc/os-release 2>/dev/null; echo "$PRETTY_NAME")"
            echo "uptime_s=$(cut -d' ' -f1 /proc/uptime)"
            echo "loadavg=$(cut -d' ' -f1-3 /proc/loadavg)"
            echo "nproc=$(nproc 2>/dev/null)"
            echo "mem_total_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
            echo "containerd=$(containerd --version 2>/dev/null)"
            echo "k3s=$([ -x $K3S ] && $K3S --version 2>/dev/null | head -1)"
            echo "dmesg_restrict=$(cat /proc/sys/kernel/dmesg_restrict 2>/dev/null)"
            echo "zombies=$(ps -eo stat= 2>/dev/null | grep -c '^Z')"
            echo "kubelet_rss_kb=$(ps -o rss= -C kubelet 2>/dev/null | head -1 | tr -d ' ')"
            echo "containerd_rss_kb=$(ps -o rss= -C containerd 2>/dev/null | head -1 | tr -d ' ')"
            echo "k3s_rss_kb=$(ps -o rss= -C k3s-server,k3s-agent,k3s 2>/dev/null | head -1 | tr -d ' ')"

            S kernel
            # Kernel log for 24h. If journalctl -k is empty (non-persistent journald, permissions) fall back to dmesg -T (everything since boot) and record it in source.
            KSRC=journalctl
            # If the boot was within 24h, skip the first 300s after boot (SATA scans and link-down lines from the boot sequence) — otherwise a reboot shows up as a NIC-event fail
            KSINCE="-24h"; BOOT_S=$(date -d "$(uptime -s 2>/dev/null)" +%s 2>/dev/null); NOW_S=$(date +%s)
            if [ -n "$BOOT_S" ] && [ $((NOW_S - BOOT_S)) -lt 86400 ]; then KSINCE=$(date -d "@$((BOOT_S + 300))" '+%Y-%m-%d %H:%M:%S'); echo "boot_window_excluded=$KSINCE"; fi
            KLOG=$(journalctl -k --since "$KSINCE" -o short-iso --no-pager -q 2>/dev/null)
            if [ -z "$KLOG" ]; then
              KSRC=dmesg
              KLOG=$(dmesg -T 2>/dev/null || $SUDO /usr/bin/dmesg -T 2>/dev/null)
              [ -z "$KLOG" ] && KSRC=none
            fi
            echo "source=$KSRC"
            echo "lines=$(printf '%s\n' "$KLOG" | grep -c .)"
            # C <class> <pattern> [<exclude>]: count the lines of one class. <exclude> drops lines another class owns (a soft lockup also says `BUG:`).
            C() { echo "c:$1=$(printf '%s\n' "$KLOG" | grep -E "$2" | grep -vE "${3:-^$}" | grep -c .)"; }
            # Classification patterns (case sensitive), each cited in the kernel source that prints the line (references/sources.md, #127; read at v5.10, v5.15, v6.1, v6.8 and v6.12).
            # Match the exact message shape so boot messages like nvme_core.io_timeout on the kernel command line are not caught.
            # source: torvalds/linux mm/oom_kill.c:891, 1115@v5.10; :949, 1173@v6.12 (`Out of memory: Killed process %d (%s)`; the pattern also takes the older `Kill process` wording)
            P_OOM_NODE='Out of memory: Kill'
            # source: torvalds/linux mm/oom_kill.c:891, 1116@v5.10; :949, 1174@v6.12 (`Memory cgroup out of memory: Killed process`)
            P_OOM_CG='Memory cgroup out of memory'
            # source: torvalds/linux mm/oom_kill.c:891-892@v5.10; :949-950@v6.12; include/linux/sched.h:213@v5.10; :306@v6.12 (the victim is task->comm, at most 15 characters, so containerd-shim-runc-v2 prints as containerd-shim)
            P_OOM_SYS='Out of memory: Kill(ed)? process [0-9]+ \((kubelet|containerd|k3s|dockerd|systemd|sshd)'
            # source: torvalds/linux kernel/watchdog.c:13, 412@v5.10; :13, 752@v6.12 (`watchdog: BUG: soft lockup - CPU#%d stuck`); kernel/watchdog_hld.c:13, 138@v5.10; kernel/watchdog.c:193@v6.12 (`Watchdog detected hard LOCKUP`); kernel/hung_task.c:129@v5.10; :133@v6.12 (`INFO: task %s:%d blocked for more than %ld seconds`); kernel/rcu/tree_stall.h:485, 551@v5.10; :620, 696@v6.12 (`rcu: INFO: %s detected stalls` / `self-detected stall`, %s = rcu_sched or rcu_preempt)
            P_LOCKUP='soft lockup|hard LOCKUP|blocked for more than|rcu_sched detected|rcu_preempt detected|rcu: INFO'
            # source: torvalds/linux block/blk-core.c:194, 229-231, 1453@v5.10 (`blk_update_request: I/O error, dev`); block/blk-mq.c:779@v6.12 (`I/O error, dev` without prefix since v5.16); fs/buffer.c:130@v5.10; :131@v6.12 (`Buffer I/O error on dev`); drivers/nvme/host/pci.c:1262, 1279, 1297@v5.10; :1354, 1371, 1390@v6.12 (`nvme nvme%d: I/O %d QID %d timeout, reset controller` / `aborting`); block/blk-core.c:180@v5.10; :146@v6.12 (`critical medium error`)
            P_IO='I/O error|nvme nvme[0-9]+: .*(timeout|reset|Abort|abort)|critical medium error'
            # source: torvalds/linux fs/ext4/super.c:721, 745, 948, 688@v5.10; :824, 849, 1016, 736@v6.12 (`EXT4-fs error (device %s)`, `EXT4-fs warning`, `Remounting filesystem read-only`); fs/xfs/xfs_message.c:24@v5.10; :24@v6.12 (`XFS (%s): `) with fs/xfs/xfs_error.c:344, 362@v5.10; :405, 423@v6.12 (`Corruption detected`, `Corruption of in-memory data`, `Metadata corruption detected at`); fs/btrfs/super.c:152, 190-195@v5.10; fs/btrfs/messages.c:148, 190@v6.12 (`BTRFS error (device %s)` and `BTRFS: error (device %s) in`)
            P_FS='EXT4-fs error|EXT4-fs warning|XFS \([a-z0-9-]+\): .*(error|Corruption|Metadata)|Remounting filesystem read-only|BTRFS error|BTRFS: error'
            # source: torvalds/linux drivers/net/ethernet/amazon/ena/ena_netdev.c:3655, 3790, 3882@v5.10; :3466, 3603, 3691@v6.12 (`Keep alive watchdog timeout`, `Trigger reset is on`, `Found a Tx that wasn't completed on time` / v6.12 `TX hasn't completed`, printed as `ena <bus id> <ifname>: `); drivers/net/phy/phy.c:111@v5.10; :126@v6.12 (`Link is Down`); drivers/net/ethernet/intel/igb/igb_main.c:8150@v5.10; :8348@v6.12 (`Detected Tx Unit Hang`); net/sched/sch_generic.c:442@v5.10; :535@v6.12 (`NETDEV WATCHDOG`); `link down`, `Tx timeout` and `went down` have no producer in the drivers read (unverified, kept)
            P_NIC='ena [0-9a-f:.]+ (eth|ens|enp|enX)[0-9a-z]+: .*(reset|timeout|hang|[Kk]eep alive|completed on time|TX hasn.t completed)|Link is Down|link down|Tx timeout|Unit Hang|NETDEV WATCHDOG|(eth|ens|enp|enX)[0-9a-z]+: .*(reset|went down)'
            # source: torvalds/linux net/netfilter/nf_conntrack_core.c:12, 1488@v5.10; :12, 1668@v6.12 (`nf_conntrack: nf_conntrack: table full, dropping packet`, the module name twice through pr_fmt)
            P_CT='nf_conntrack: .*table full'
            # source: torvalds/linux net/ipv4/tcp.c:244, 2404, 2402@v5.10; :244, 3042, 3040@v6.12 (`TCP: out of memory -- consider tuning tcp_mem`, `TCP: too many orphaned sockets`); net/core/neighbour.c:14, 393@v5.10; :14, 486@v6.12 (`neighbour: %s: neighbor table overflow!`); net/ipv4/tcp_input.c:65, 6676@v5.10; :65, 7103@v6.12 (`Possible SYN flooding on port`)
            P_NET='TCP: out of memory|neighbou?r.*table overflow|SYN flooding|TCP: too many orphaned'
            # source: torvalds/linux mm/page_alloc.c:4862@v5.10; :4483@v6.12 (`%s: page allocation failure: order:%u`); mm/oom_kill.c:1105@v5.10; :1163@v6.12 (`Out of memory and no killable processes...`)
            P_MEM='page allocation failure|Out of memory and no killable'
            # source: torvalds/linux arch/x86/mm/fault.c:533, 536@v5.10; :538, 541@v6.12 (`BUG: kernel NULL pointer dereference`, `BUG: unable to handle page fault`); arch/x86/kernel/dumpstack.c:405, 195@v5.10; :408, 195@v6.12 (`Oops: %04lx`, `Call Trace:`); arch/arm64/kernel/stacktrace.c:173@v5.10; :318@v6.12 (`Call trace:` with a lowercase t on arm64); arch/x86/kernel/traps.c:523@v5.10; :580@v6.12 (`general protection fault`)
            P_BUG='BUG: |Oops: |Call [Tt]race:|general protection fault'
            # source: torvalds/linux arch/x86/mm/fault.c:766@v5.10; :759@v6.12 (`%s[%d]: segfault at %lx ip %px sp %px error %lx`; x86 only, arm64 reports a user fault only through the signal, so the count stays 0 on Graviton nodes)
            P_SEG='segfault at'
            # source: torvalds/linux kernel/time/clocksource.c:8, 239@v5.10; :8, 284@v6.12 (`clocksource: timekeeping watchdog on CPU%d: Marking clocksource '%s' as unstable`); arch/x86/kernel/tsc.c:2, 1106, 1172@v5.10; :2, 1144, 1214@v6.12 (`tsc: Marking TSC unstable due to %s`)
            P_CLK='clocksource.*unstable|TSC.*unstable'
            C oom_node "$P_OOM_NODE"
            C oom_cgroup "$P_OOM_CG"
            C oom_system_victim "$P_OOM_SYS"
            C lockup "$P_LOCKUP"
            C io_error "$P_IO"
            C fs_error "$P_FS"
            C nic "$P_NIC"
            C conntrack_full "$P_CT"
            C net_pressure "$P_NET"
            C mem_pressure "$P_MEM"
            C bug "$P_BUG" "$P_LOCKUP"
            C segfault "$P_SEG"
            C clock "$P_CLK"
            echo "samples:"
            printf '%s\n' "$KLOG" | grep -E "$P_OOM_NODE|$P_OOM_CG|$P_LOCKUP|$P_IO|$P_FS|$P_NIC|$P_CT|$P_NET|$P_MEM|$P_BUG|$P_SEG|$P_CLK" \
              | grep -v '^$' | cut -c1-200 | tail -n 40
            # OOM lines in full, up to 400 characters: the kernel's oom-kill line carries the pod uid in oom_memcg (…kubepods-burstable-pod<uid>.slice), which is past column 200, and lib/summaries/resilience.py maps it to the workload
            echo "oom_samples:"
            printf '%s\n' "$KLOG" | grep -E "oom-kill:|$P_OOM_CG|$P_OOM_NODE" | grep -v '^$' | cut -c1-400 | tail -n 60

            S sysctl
            P() { v=$(cat "/proc/sys/$2" 2>/dev/null | tr '\t' ' '); echo "$1=${v:-absent}"; }
            P net.netfilter.nf_conntrack_max net/netfilter/nf_conntrack_max
            P net.netfilter.nf_conntrack_count net/netfilter/nf_conntrack_count
            P net.netfilter.nf_conntrack_tcp_timeout_established net/netfilter/nf_conntrack_tcp_timeout_established
            P fs.inotify.max_user_watches fs/inotify/max_user_watches
            P fs.inotify.max_user_instances fs/inotify/max_user_instances
            P fs.file-max fs/file-max
            P fs.file-nr fs/file-nr
            P fs.aio-max-nr fs/aio-max-nr
            P net.core.somaxconn net/core/somaxconn
            P net.core.netdev_max_backlog net/core/netdev_max_backlog
            P net.ipv4.ip_local_port_range net/ipv4/ip_local_port_range
            P net.ipv4.tcp_max_syn_backlog net/ipv4/tcp_max_syn_backlog
            P net.ipv4.tcp_tw_reuse net/ipv4/tcp_tw_reuse
            P net.ipv4.ip_forward net/ipv4/ip_forward
            P net.bridge.bridge-nf-call-iptables net/bridge/bridge-nf-call-iptables
            P net.ipv4.neigh.default.gc_thresh3 net/ipv4/neigh/default/gc_thresh3
            P vm.max_map_count vm/max_map_count
            P vm.swappiness vm/swappiness
            P vm.overcommit_memory vm/overcommit_memory
            P vm.panic_on_oom vm/panic_on_oom
            P kernel.panic kernel/panic
            P kernel.panic_on_oops kernel/panic_on_oops
            P kernel.pid_max kernel/pid_max
            P kernel.threads-max kernel/threads-max
            P kernel.dmesg_restrict kernel/dmesg_restrict

            S cri
            # Container runtime: use crictl directly if it works (EKS root), otherwise the k3s built-in crictl through the sudoers allowance.
            if crictl info >/dev/null 2>&1; then CRI="crictl"
            elif [ -x $K3S ] && $SUDO $K3S crictl info >/dev/null 2>&1; then CRI="$SUDO $K3S crictl"
            else CRI=""; fi
            echo "cmd=${CRI:-none}"
            if [ -n "$CRI" ]; then
              echo "version=$($CRI version 2>/dev/null | tr '\n' ' ' | tr -s ' ')"
              # The crictl binary version (`crictl version <tag>`); `crictl version` above prints the CRI API version 0.1.0, not the binary's
              echo "crictl=$($CRI --version 2>/dev/null | head -1)"
              # Container states from the STATE column of `crictl ps -a` (Running, Exited, Created, Unknown), cut at the header's column so a pod or container called "running-x" is not counted
              PS=$($CRI ps -a 2>/dev/null)
              for st in Running Exited Created Unknown; do echo "state:$st=$(printf '%s\n' "$PS" | awk -v s="$st" 'NR==1 {c=index($0,"STATE"); next} c>0 && index(substr($0,c), s)==1' | grep -c .)"; done
              echo "images=$($CRI images 2>/dev/null | tail -n +2 | grep -c .)"
              # Top 15 images by size. Table columns: IMAGE TAG IMAGE_ID SIZE — SIZE is a human unit like "1.23GB", hence sort -h
              echo "images_top:"
              $CRI images 2>/dev/null | tail -n +2 | awk 'NF>=4 {print $4 "\t" $1 ":" $2}' | sort -h -r | head -15
              # 1,000 characters: the JSON lists containerFilesystems (empty on most nodes, one entry when the runtime splits them) before imageFilesystems, which the parser reads
              echo "imagefs=$($CRI imagefsinfo 2>/dev/null | tr -d ' \n' | cut -c1-1000)"
              INFO=$($CRI info 2>/dev/null | tr -d ' \n')
              # crictl re-marshals the status with encoding/json, which sorts the keys: "status" comes before "type"
              echo "conditions=$(printf '%s' "$INFO" | grep -oE '"status":(true|false),"type":"[A-Za-z]+"' | tr '\n' ' ')"
              echo "systemd_cgroup=$(printf '%s' "$INFO" | grep -oE '"SystemdCgroup":(true|false)' | head -1 | cut -d: -f2)"
              # containerd 1.7 puts the global snapshotter and sandboxImage in the config `crictl info` prints; containerd 2.x moved both to the images plugin, which `crictl info` does not print,
              # so these two are empty there (the parser takes the snapshotter from the imagefs mount point instead) — references/sources.md (#127)
              echo "snapshotter=$(printf '%s' "$INFO" | grep -oE '"snapshotter":"[a-z0-9]+"' | head -1 | cut -d: -f2 | tr -d '"')"
              echo "sandbox_image=$(printf '%s' "$INFO" | grep -oE '"sandboxImage":"[^"]+"' | head -1 | cut -d: -f2- | tr -d '"')"
              echo "cni_error=$(printf '%s' "$INFO" | grep -oE '"lastCNILoadStatus(\.default)?":"[^"]{1,160}"' | head -1 | cut -d: -f2- | tr -d '"')"
              # Top 10 containers by writable layer (DISK column) — on a node whose disk is filling up this pins down "which container writes to the node disk".
              # Table output (crictl stats -a / ps -a) is cut by header column positions (JSON would exceed the 24,000-character SSM cap). Without `crictl stats -a` in sudoers this shows as permission.
              # crictl stats prefixes its first line with clear-screen escapes (ESC[2J ESC[H) — that shifts the header positions by 7, so strip everything before CONTAINER.
              if STATS=$($CRI stats -a 2>/dev/null | sed '1s/^.*CONTAINER /CONTAINER /') && [ -n "$STATS" ]; then
                echo "writable_layers:"
                PSA=$($CRI ps -a 2>/dev/null | sed '1s/^.*CONTAINER /CONTAINER /')
                printf '%s\n' "$STATS" | awk -v ps="$PSA" '
                  function tok(s) { sub(/^ +/, "", s); split(s, t, " "); return t[1] }
                  function mb(v) { u=v; gsub(/[0-9.]/, "", u); n=v+0; if (u=="kB"||u=="KB"||u=="KiB") return n/1024; if (u=="MB"||u=="MiB") return n; if (u=="GB"||u=="GiB") return n*1024; if (u=="TB"||u=="TiB") return n*1048576; return n/1048576 }
                  BEGIN { n=split(ps, L, "\n"); h=L[1]; hn=index(h,"NAME"); hpi=index(h,"POD ID"); rest=substr(h,hpi+6); hp=hpi+5+index(rest,"POD"); hns=index(h,"NAMESPACE");
                          for (i=2;i<=n;i++) { id=substr(L[i],1,13); if (id=="") continue; CN[id]=tok(substr(L[i],hn)); PD[id]=tok(substr(L[i],hp)); NS[id]=(hns>0)?tok(substr(L[i],hns)):"?" } }
                  NR==1 { hd=index($0,"DISK"); next }
                  { id=substr($0,1,13); d=tok(substr($0,hd)); if (d=="" || !(id in PD)) next; printf "%d\t%s/%s/%s\n", mb(d), NS[id], PD[id], CN[id] }' | sort -rn | head -10
              else
                echo "writable_layers_error=$($CRI stats -a 2>&1 | head -1 | cut -c1-120)"
              fi
            fi

            S cgroup
            echo "fs=$(stat -fc %T /sys/fs/cgroup/ 2>/dev/null)"
            echo "controllers=$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null)"

            S time
            timedatectl status 2>/dev/null | sed 's/^ *//' | grep -iE 'synchronized|NTP|Time zone' | head -4
            echo "chrony=$(chronyc tracking 2>/dev/null | grep -E 'Stratum|System time|Leap' | tr -s ' ' | tr '\n' ';')"

            S disk
            # Filesystem usage per path (capacity and inodes). The parser merges paths on the same filesystem.
            for p in / /var/lib/containerd /var/lib/rancher /var/lib/kubelet /var/log /run /tmp; do
              [ -d "$p" ] || continue
              df -P -k "$p" 2>/dev/null | tail -1 | awk -v p="$p" '{print "fs:" p " dev=" $1 " size_kb=" $2 " used_kb=" $3 " avail_kb=" $4 " use=" $5 " mount=" $6}'
              df -P -i "$p" 2>/dev/null | tail -1 | awk -v p="$p" '{print "inode:" p " inodes=" $2 " iused=" $3 " iuse=" $5}'
            done
            echo "pod_logs_mb:"
            $SUDO /usr/bin/du -m -d 1 /var/log/pods 2>/dev/null | sort -rn | head -12
            echo "emptydir_mb:"
            # Only /var/lib/kubelet/pods/<uid>/volumes/kubernetes.io~empty-dir. ~csi and ~local-volume are PV bind mounts, not node disk usage.
            $SUDO /usr/bin/du -m -d 3 /var/lib/kubelet/pods 2>/dev/null | grep -E 'kubernetes\.io~empty-dir$' | sort -rn | head -10
            # No directory existence test ([ -d ]): it is false for a normal user when the parent is root-only (0700), so just try du.
            if systemctl is-active docker >/dev/null 2>&1; then
              DM=$($SUDO /usr/bin/du -sm /var/lib/docker 2>/dev/null | cut -f1); echo "docker_mb=${DM:-?}"
            fi
            echo "containerd_mb=$( ( $SUDO /usr/bin/du -sm /var/lib/containerd 2>/dev/null; $SUDO /usr/bin/du -sm /var/lib/rancher/k3s/agent/containerd 2>/dev/null ) | cut -f1 | head -1)"

            S services
            for u in kubelet containerd k3s k3s-agent docker crio; do
              a=$(systemctl is-active "$u" 2>/dev/null)
              case "$a" in ""|unknown|inactive) [ "$u" = kubelet ] || [ "$u" = containerd ] || continue;; esac
              n=$(systemctl show -p NRestarts "$u" 2>/dev/null | cut -d= -f2)
              s=$(systemctl show -p ActiveEnterTimestamp "$u" 2>/dev/null | cut -d= -f2-)
              echo "$u active=$a restarts=${n:-?} since=$s"
            done

            S updates
            echo "reboot_required=$([ -e /var/run/reboot-required ] && echo yes || echo no)"
            echo "ubuntu_updates=$(grep -hoE '[0-9]+ (updates? can be applied|of these updates (are|is) (a )?standard security)' /var/lib/update-notifier/updates-available 2>/dev/null | tr '\n' ';')"
            if command -v needs-restarting >/dev/null 2>&1; then
              needs-restarting -r >/dev/null 2>&1; rc=$?
              echo "needs_restarting_rc=$rc"
            fi
            # The AMI build writes BASE_AMI_ID and BUILD_TIME (and BUILD_KERNEL, ARCH); there is no RELEASE_VERSION line
            echo "ami_release=$(cat /etc/eks/release 2>/dev/null | grep -E 'BASE_AMI_ID|BUILD_TIME' | tr '\n' ';')"

            S end
            ;;
          eks-platform/kubelet-journal)
            journalctl -u kubelet --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E ' [EW][0-9]{4} [0-9:.]+ ' | tail -n 3000; journalctl -u kubelet --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E '"(Eviction manager: |Container runtime network not ready)' | tail -n 200
            ;;
          eks-platform/containerd-journal)
            journalctl -u containerd --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E 'level=(warn|error|fatal)' | tail -n 2000
            ;;
          external-secrets/controller-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(externalsecret_(sync_calls_total|sync_calls_error|provider_api_calls_count)|clustersecretstore_status_condition|secretstore_status_condition|controller_runtime_reconcile_(errors_total|total)|controller_runtime_reconcile_time_seconds_(sum|count)|process_(start_time|resident_memory_bytes))'
            ;;
          grafana/self-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(grafana_(build_info|datasource_request_total|api_response_status_total|alerting_(active_alerts|rule_evaluation_failures_total|notification_failed_total|active_configurations)|stat_totals_(dashboard|datasource|alert_rules)|stat_total_users|stat_active_users|db_datasource_query_by_id_total|plugin_build_info)|process_(start_time|resident_memory_bytes))'
            ;;
          k3s-platform/k3s-journal-errors)
            journalctl -u k3s -u k3s-agent --since -24h --no-pager -q -o short-iso 2>/dev/null | sed -E 's/^[^ ]+ [^ ]+ k3s(-agent)?\[[0-9]+\]: //' | grep -E '^[EW][0-9]{4}|"level":"(warn|error|fatal)"|level=(warning|error|fatal)' | tail -n 3000; journalctl -u k3s -u k3s-agent --since -24h --no-pager -q -o short-iso 2>/dev/null | sed -E 's/^[^ ]+ [^ ]+ k3s(-agent)?\[[0-9]+\]: //' | grep -E '"(Eviction manager: |Container runtime network not ready)' | tail -n 200
            ;;
          k3s-platform/k3s-journal-stats)
            journalctl -u k3s -u k3s-agent --since -24h --no-pager -q 2>/dev/null | sed -E 's/^[A-Z][a-z]{2} [0-9 ]+[0-9:]+ [^ ]+ k3s(-agent)?\[[0-9]+\]: //' | sed -E 's/^([EIWF])[0-9]{4} [0-9:.]+ +[0-9]+ ([^ ]+\.go):[0-9]+\].*/klog \1 \2/; s/^\{"level":"([a-z]+)".*/etcd-json \1/; s/^time="[^"]+" level=([a-z]+).*/logrus \1/' | cut -c1-60 | sort | uniq -c | sort -rn | head -40
            ;;
          k3s-platform/k3s-scheduler-unschedulable)
            journalctl -u k3s --since -24h --no-pager -q 2>/dev/null | grep -E 'Unschedulable|FailedScheduling|Insufficient' | tail -n 200
            ;;
          k3s-platform/k3s-webhook-failures)
            journalctl -u k3s --since -24h --no-pager -q 2>/dev/null | grep -E 'failed calling webhook|webhook.*context deadline' | tail -n 200
            ;;
          k3s-platform/k3s-etcd-slow)
            journalctl -u k3s --since -24h --no-pager -q 2>/dev/null | grep -E '"level":"warn".*(apply request took too long|slow fdatasync|leader changed|request stats|took too long)' | awk '{h=substr($0,1,9)} c[h]++<15'
            ;;
          k3s-platform/kubelet-pleg)
            journalctl -u k3s -u k3s-agent --since -24h --no-pager -q 2>/dev/null | grep -iE 'PLEG|not healthy|eviction|image garbage|imageGC|OOMKilling|SystemOOM' | tail -n 200
            ;;
          k3s-platform/k3s-node)
            #!/bin/sh
            # kubegap k3s node platform read-only inspection. Writes nothing to the node.
            # Runs as the SSH login user; anything needing root is attempted only through the commands allowed by deploy/node-access/kubegap-sudoers via sudo -n. If that fails the section is empty and the parser records "no node access".
            # Output is a sequence of "### <section>" sections parsed by lib/summaries/k3s.py. Tokens and secrets are never printed (the --token value in the systemd unit and K10... tokens are removed with sed).
            S() { echo "### $1"; }
            if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            K3S=/usr/local/bin/k3s
            # install.sh writes every argument of ExecStart on its own quoted line, so the value of --token / --agent-token is the line after the flag; the inline forms (--token=x, K3S_TOKEN=x) and the K10... token shape are masked too
            REDACT="/^[[:space:]]*'--\(agent-\)\{0,1\}token' /{n;s/'[^']*'/'<redacted>'/;}; s/K10[0-9a-f]\{20,\}::[a-z]*:[0-9a-f]*/<token>/g; s/\(--\(agent-\)\{0,1\}token[= ]\)[^ ']*/\1<redacted>/g; s/\(K3S_TOKEN=\)[^ ]*/\1<redacted>/g"

            S meta
            echo "role=$( systemctl is-active k3s >/dev/null 2>&1 && echo server || ( systemctl is-active k3s-agent >/dev/null 2>&1 && echo agent || echo none ) )"
            echo "version=$([ -x $K3S ] && $K3S --version 2>/dev/null | head -1)"
            echo "config_file=$([ -e /etc/rancher/k3s/config.yaml ] && echo present || echo absent)"
            echo "smartctl=$(command -v smartctl >/dev/null 2>&1 && echo yes || echo no)"
            echo "sensors=$(command -v sensors >/dev/null 2>&1 && echo yes || echo no)"

            S unit
            # ExecStart arguments of the systemd unit. Tokens are removed. (The same data is in the node annotation k3s.io/node-args, which the parser prefers)
            for u in k3s k3s-agent; do
              systemctl cat "$u" 2>/dev/null | sed -n '/^ExecStart=/,/^$/p' | sed -e "$REDACT" | head -40
            done
            for u in k3s k3s-agent; do
              systemctl is-active "$u" >/dev/null 2>&1 && echo "unit:$u $(systemctl show -p ActiveEnterTimestamp,NRestarts "$u" 2>/dev/null | tr '\n' ' ')"
            done

            S check-config
            # Kernel config check. Strip color codes; keep only missing entries and the final STATUS.
            [ -x $K3S ] && $K3S check-config 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -E 'missing|STATUS' | sed 's/^ *//' | head -20

            S ports
            # Which addresses 6443 (apiserver and supervisor, one listener), 6444 (the loopback apiserver, https-listen-port + 1), 2379/2380/2381 (etcd client, peer, metrics), 10250 (kubelet), 10257/10259 (controller-manager, scheduler), 7946 (MetalLB memberlist), 179 (BGP) and the NodePort range listen on; 8472 (vxlan) is UDP so not in ss -l. Process names need root.
            ( $SUDO /usr/bin/ss -ltnp 2>/dev/null || ss -ltn 2>/dev/null ) | awk 'NR>1 {print $4, $6}' | grep -E ':(6443|6444|2379|2380|2381|10250|10257|10259|7946|179|80|443|30[0-9]{3}|31[0-9]{3}|32[0-9]{3}) ' | sed -E 's/users:\(\("([^"]+)".*/\1/' | sort -u | head -40

            S flannel
            echo "mtu=$(ip -d link show flannel.1 2>/dev/null | grep -oE 'mtu [0-9]+' | head -1 | cut -d' ' -f2)"
            echo "vxlan=$(ip -d link show flannel.1 2>/dev/null | grep -oE 'vxlan id [0-9]+ local [0-9.]+ dev [a-z0-9]+' | head -1)"
            echo "stats=$(ip -s link show flannel.1 2>/dev/null | awk '/RX:/{getline; rx=$0} /TX:/{getline; tx=$0} END{print "rx:" rx " tx:" tx}' | tr -s ' ')"
            echo "underlay_mtu=$(d=$(ip -d link show flannel.1 2>/dev/null | grep -oE 'dev [a-z0-9]+' | head -1 | cut -d' ' -f2); [ -n "$d" ] && ip link show "$d" 2>/dev/null | grep -oE 'mtu [0-9]+' | cut -d' ' -f2)"
            echo "addrs=$(ip -o -4 addr show 2>/dev/null | grep -vE ' lo | veth| cni| docker| br-[0-9a-f]' | awk '{print $2 "=" $4}' | tr '\n' ' ')"
            echo "ip_forward=$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null)"
            echo "br_netfilter=$(cat /proc/sys/net/bridge/bridge-nf-call-iptables 2>/dev/null || echo absent)"

            S journald
            # systemd's format_bytes: one decimal and K/M/G/T, or bare bytes with a B under 1 KiB (`336.0M`, `1.2G`, `800B`)
            echo "disk=$(journalctl --disk-usage 2>/dev/null | grep -oE '[0-9.]+[KMGTB]?' | head -1)"
            echo "conf=$(grep -hE '^(SystemMaxUse|SystemKeepFree|MaxRetentionSec|Storage|RuntimeMaxUse)=' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf 2>/dev/null | tr '\n' ';')"
            echo "k3s_lines_24h=$(journalctl -u k3s -u k3s-agent --since -24h -q 2>/dev/null | wc -l | tr -d ' ')"

            S server
            # Only meaningful on server nodes. On agents the command is missing or not permitted, so the section is empty.
            if systemctl is-active k3s >/dev/null 2>&1; then
              echo "secrets_encrypt=$($SUDO $K3S secrets-encrypt status 2>/dev/null | grep -E 'Encryption Status' | sed 's/Encryption Status: //')"
              echo "etcd_snapshots:"
              $SUDO $K3S etcd-snapshot ls 2>/dev/null | tail -n +2 | awk '{print $1, $2, $3, $4}' | tail -n 30
              echo "db_mb=$($SUDO /usr/bin/du -sm /var/lib/rancher/k3s/server/db 2>/dev/null | cut -f1)"
              echo "db_ls:"
              $SUDO /usr/bin/ls -la /var/lib/rancher/k3s/server/db 2>/dev/null | tail -n +2 | awk '{print $1, $5, $6, $7, $9}' | head -12
              echo "db_kind=$( $SUDO /usr/bin/ls -la /var/lib/rancher/k3s/server/db 2>/dev/null | grep -q ' etcd$' && echo etcd || ( $SUDO /usr/bin/ls -la /var/lib/rancher/k3s/server/db 2>/dev/null | grep -q state.db && echo sqlite || echo unknown ) )"
              echo "certificates:"
              # one logrus line per certificate: `<file>: certificate <name> (<usages>) is ok, expires at <ts>` / `will expire within N days at <ts>` / `expired at <ts>` / `is not valid before <ts>`
              $SUDO $K3S certificate check 2>&1 | grep -E ': certificate .* \(|WARN|warning' | sed -E 's/\x1b\[[0-9;]*m//g' | head -60
            fi

            S registries
            $SUDO /usr/bin/cat /etc/rancher/k3s/registries.yaml 2>/dev/null | grep -vE 'password|token|username' | head -30

            S containerd
            # The keys k3s's templates write for containerd 1.x (sandbox_image, registry.configs) and 2.x (`sandbox =` under pinned_images, config_path for certs.d); registry mirrors are never in this file, they are in certs.d from registries.yaml (section registries)
            $SUDO /usr/bin/cat /var/lib/rancher/k3s/agent/etc/containerd/config.toml 2>/dev/null | grep -E 'SystemdCgroup|sandbox_image|sandbox =|snapshotter|registry\.configs|config_path|disable_cgroup' | sed 's/^ *//' | head -20

            S local-path
            # local-path-provisioner volume directories (default /var/lib/rancher/k3s/storage). The PVC name is part of the directory name.
            echo "total_mb=$($SUDO /usr/bin/du -sm /var/lib/rancher/k3s/storage 2>/dev/null | cut -f1)"
            echo "volumes_mb:"
            $SUDO /usr/bin/du -m -d 1 /var/lib/rancher/k3s/storage 2>/dev/null | grep -v 'storage$' | sort -rn | head -30

            S disks
            lsblk -d -o NAME,TYPE,SIZE,ROTA,MODEL 2>/dev/null | grep -vE 'loop|NAME' | tr -s ' ' | head -8
            if command -v smartctl >/dev/null 2>&1; then
              for d in $(lsblk -d -n -o NAME,TYPE 2>/dev/null | awk '$2=="disk"{print "/dev/" $1}'); do
                echo "smart:$d health=$($SUDO /usr/sbin/smartctl -H $d 2>/dev/null | grep -iE 'overall-health|SMART Health Status' | sed 's/.*: *//') attrs=$($SUDO /usr/sbin/smartctl -A $d 2>/dev/null | grep -iE 'Percentage Used|Media and Data Integrity|Reallocated_Sector_Ct|Wear_Leveling|Power_On_Hours|Temperature' | tr -s ' ' | cut -c1-80 | tr '\n' ';')"
              done
            fi

            S thermal
            for z in /sys/class/thermal/thermal_zone*; do [ -e "$z/temp" ] && echo "zone:$(cat $z/type 2>/dev/null)=$(cat $z/temp 2>/dev/null)"; done 2>/dev/null | head -8
            command -v sensors >/dev/null 2>&1 && sensors 2>/dev/null | grep -E '^(Package|Core|Tctl|temp1|Composite)' | tr -s ' ' | head -6

            S end
            ;;
          k3s-platform/containerd-log)
            sudo -n /usr/bin/tail -n 2000 /var/lib/rancher/k3s/agent/containerd/containerd.log 2>/dev/null | grep -E 'level=(warn|error|fatal)' | tail -n 1500
            ;;
          karpenter/controller-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(karpenter_(nodepools?_|nodeclaims_|nodes_(created|terminated|eviction_requests_total|termination_(time|duration)_seconds_(sum|count))|interruption_|cloudprovider_(errors_total|duration_seconds_(sum|count))|cluster_state_synced|consistency_errors|pods_startup_(time|duration)_seconds_(sum|count)|pods_eviction_requests_total|disruption_(eligible_nodes|budgets_allowed_disruptions|nodes_disrupted_total|pods_disrupted_total|actions_performed_total|queue_depth)|voluntary_disruption_(eligible_nodes|decisions_total|queue_failures_total)|provisioner_scheduling_(queue_depth|duration_seconds_(sum|count))|scheduler_(queue_depth|scheduling_duration_seconds_(sum|count))|nodes_eviction_queue_depth)|controller_runtime_reconcile_errors_total|leader_election|process_(start_time|resident_memory_bytes))'
            ;;
          keda/metrics-apiserver-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(apiserver_request_total|keda_internal_metricsservice_grpc_client_(handled|started)_total|registered_metrics_total|apiserver_current_inflight_requests|process_(start_time|resident_memory_bytes))'
            ;;
          keda/operator-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(keda_|controller_runtime_reconcile_errors_total|leader_election|process_(start_time|resident_memory_bytes))'
            ;;
          kube-proxy/proxy-mode)
            echo "mode=$(curl -s -m 3 http://127.0.0.1:10249/proxyMode)"; echo "healthz=$(curl -s -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:10256/healthz)"; echo "metrics_local=$(curl -s -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:10249/metrics)"
            ;;
          metallb/metallb-speaker-metrics)
            curl -s -m 8 http://{{ podIp }}:{{ port }}/metrics | grep -vE '^#|_bucket\{' | grep -E '^(metallb_(speaker_announced|k8s_client_(config_loaded_bool|config_stale_bool|update_errors_total|updates_total)|layer2_(gratuitous_sent|requests_received|responses_sent)|bgp_session_up|bgp_updates_total|allocator_)|process_(start_time|resident_memory_bytes))'
            ;;
          vpc-cni/ipamd-metrics)
            curl -s -m 5 http://127.0.0.1:61678/metrics | grep -E '^awscni_' | grep -vE 'per_cidr|_bucket'
            ;;
          vpc-cni/ipamd-log)
            F=/var/log/aws-routed-eni/ipamd.log; if [ ! -r "$F" ]; then echo "ipamd log not readable: $F" >&2; exit 0; fi; SINCE=$(date -u -d '-24 hours' '+%Y-%m-%dT%H:%M:%S'); grep -E '"level":"(warn|error|dpanic|panic|fatal)"' "$F" | awk -v s="$SINCE" 'match($0, /"ts":"[^"]*"/) { if (substr($0, RSTART + 6, 19) >= s) print }' | tail -n 3000
            ;;
          *)
            echo "kubegap: unknown step {{ step }}" >&2; exit 2
            ;;
          esac
