# Permission for the DaemonSet node backend only (deploy/node-access/daemonset.yaml). Apply it in addition to clusterrole.yaml when nodes are
# read through the kubegap-node-reader pods; leave it out on SSM or SSH. Apply daemonset.yaml first: it creates the `kubegap` namespace
# this Role lives in.
# kubegap reaches those pods with `kubectl exec`. The API server authorizes exec on the subresource `pods/exec`: as `create` over the SPDY
# transport, as `get` over the WebSocket transport that kubectl 1.30 and newer try first. The verb create does not create anything: it opens
# a shell in a pod that kubegap itself deployed, in which the read-only node scripts run with `chroot /host`. No cluster object is written.
# This is a namespaced Role, not a ClusterRole, so the permission covers pods in the `kubegap` namespace only and cannot be used to exec
# into any other pod. `get` on the pod object itself, which exec also needs, comes from clusterrole.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubegap-node-reader-exec
  namespace: kubegap
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubegap-node-reader-exec
  namespace: kubegap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubegap-node-reader-exec
subjects:
  - kind: User            # the same subject as in clusterrole.yaml
    name: kubegap
