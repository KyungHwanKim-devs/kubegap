# kubegap read-only ClusterRole.
# get, list and watch on every resource. Secrets are excluded: list returns the values, so kubegap never reads Secrets through kubectl
# and only sees names and types via kube-state-metrics kube_secret_info. nodes/proxy is for kubelet configz and metrics, nodes/metrics for node metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubegap-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "nodes", "nodes/proxy", "nodes/metrics", "nodes/status", "services", "endpoints", "events", "namespaces", "configmaps", "persistentvolumes", "persistentvolumeclaims", "resourcequotas", "limitranges", "serviceaccounts", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "batch", "autoscaling", "policy", "networking.k8s.io", "storage.k8s.io", "rbac.authorization.k8s.io", "admissionregistration.k8s.io", "apiextensions.k8s.io", "discovery.k8s.io", "scheduling.k8s.io", "coordination.k8s.io", "metrics.k8s.io", "apiregistration.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Component CRDs (only installed ones are read; missing groups are ignored)
  - apiGroups: ["monitoring.coreos.com", "karpenter.sh", "karpenter.k8s.aws", "keda.sh", "external-secrets.io", "argoproj.io", "cert-manager.io", "acme.cert-manager.io", "metallb.io", "elbv2.k8s.aws", "networking.k8s.aws", "crd.k8s.amazonaws.com", "vpcresources.k8s.aws", "snapshot.storage.k8s.io", "helm.cattle.io", "k3s.cattle.io", "actions.github.com", "actions.summerwind.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/readyz", "/livez", "/version", "/api", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubegap-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubegap-readonly
subjects:
  - kind: User            # EKS: the IAM principal name mapped through aws-auth or an access entry. k3s: the user in the kubeconfig
    name: kubegap
