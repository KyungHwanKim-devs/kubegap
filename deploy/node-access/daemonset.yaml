# kubegap node-reader DaemonSet (third backend, for environments with neither SSM nor SSH: GKE, AKS, kubeadm, managed nodes with no other access path).
# Applied by the user: kubectl apply -f deploy/node-access/daemonset.yaml
# kubegap uses the pods automatically when they are Running (detected by discover, or forced with config.yaml node_access: daemonset) and runs `kubectl exec ... chroot /host /bin/sh -c <read-only script>` on each node.
# The kubeconfig user needs `get` and `create` on pods/exec in this namespace: deploy/permissions/role-daemonset-exec.yaml, applied after this file (it creates the namespace), in addition to clusterrole.yaml.
# Privileged, hostPID and a host root mount are required (journalctl, dmesg, crictl and du run as host binaries). Delete it after the audit if you like: kubectl delete -f deploy/node-access/daemonset.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kubegap
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubegap-node-reader
  namespace: kubegap
  labels:
    app.kubernetes.io/name: kubegap-node-reader
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubegap-node-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubegap-node-reader
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: reader
          # Pinned by the digest of the multi-architecture image index behind the tag (not one platform's manifest, so amd64 and arm64 nodes
          # pull the same content). This pod is privileged with the host root mounted, so a moved tag must not be able to change what runs.
          # The same index is docker.io/library/busybox:1.36. To bump the digest: run one of these and replace the digest below (the registry's
          # Docker-Content-Digest header is the index digest when the Accept header asks for the index). To move the tag as well, change it
          # here, in the command and in tests/test_node_commands.py, which pins the tag too.
          #   curl -sI -H "Authorization: Bearer $(curl -s 'https://public.ecr.aws/token/?scope=repository:docker/library/busybox:pull' | jq -r .token)" -H 'Accept: application/vnd.oci.image.index.v1+json' https://public.ecr.aws/v2/docker/library/busybox/manifests/1.36 | grep -i docker-content-digest
          #   crane digest public.ecr.aws/docker/library/busybox:1.36
          image: public.ecr.aws/docker/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
