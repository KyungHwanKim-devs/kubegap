# Log signature catalog. The version is in signatures/version.
# Fields: id (<component>.<name>), name, component, area (one of the 12 areas), severity (critical|high|medium|low), sources (glob list relative to the snapshot),
#        pattern (regex, case sensitive; use (?i) to ignore case), meaning (what it means), cause (usual causes), verify (command to confirm), warn_at (default 1), fail_at (default 10).
# source: list of "<owner>/<repo> <path>:<line>@<tag>" naming the component's logging call at each version the pattern was read at (references/sources.md, #129). Not the same as sources, which lists snapshot files.
#        tests/test_sources.py requires it on every signature of this file and of every collectors/*/signatures.yaml, and tests/test_signature_lines.py matches each pattern against lines built from the cited format strings.
# The summary (lib/logs.py) scans the files in sources once and writes count, first/last timestamp and 5 sample lines per signature to summary.logs.signatures;
# the evaluation (type: signature checks) emits a finding: fail when count >= fail_at, warn when >= warn_at. Finding id = logs.signatures.<signature id>.
# Error lines matching no signature are normalized and the top 30 patterns go to summary.logs.unclassified_errors (candidates for new signatures).
# Source layout: logs/pods/<component>/<ns>_<workload>.log (kubectl logs, 24h, 1500 lines per pod, --prefix --timestamps),
#            logs/node/<node>/kubelet-24h.log and containerd-24h.log (EKS SSM journalctl), logs/node/<node>/k3s-errors-24h.log (the single k3s process: kubelet, apiserver, flannel included).

# ---------------- kubelet ----------------
# Group K (issue #129): kubelet, containerd, metrics-server, flannel, k3s and the common.* signatures from signatures/catalog.yaml, plus kube-proxy.iptables-restore-failed
# from collectors/kube-proxy/signatures.yaml. Every phrase was read in the component source at the versions named in references/sources.md (kubernetes v1.32.13 /
# v1.33.5 / v1.37.2, containerd v1.7.29 / v2.1.5 / k3s v2.1.4-k3s1 / v2.4.2, k3s v1.33.5+k3s1 / v1.37.2+k3s1, flannel v0.27.0 / v0.28.10, metrics-server v0.8.0 / v0.9.1,
# Go go1.24.13 / go1.24.6 / go1.26.10). `source:` names the logging call at each version.
# The two journal collectors keep klog E/W lines, logrus/zap warn+error+fatal lines and, since kubegap 0.1.78, the klog I lines "Eviction manager: ",
# "Container runtime network not ready" and "Probe failed"; every other I line never reaches logs/node/*/kubelet-24h.log or k3s-errors-24h.log.
# kubelet.system-oom was removed: both of its phrases are the SystemOOM Event (reason and message), which the events summary (lib/events.py TRACKED: SystemOOM, OOMKilling) already covers.
- id: kubelet.pleg-not-healthy
  name: kubelet PLEG not healthy
  component: kubelet
  area: node
  severity: high
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'PLEG is not healthy'
  meaning: The kubelet could not get pod status from the container runtime within 3 minutes, so the node goes NotReady. The text is the err value of the E line "Skipping pod synchronization" (klog V0 at every version read).
  cause: Node CPU or disk I/O overload, containerd latency, too many pods or containers.
  verify: "journalctl -u kubelet --since -24h | grep PLEG; crictl ps -a | wc -l"
  source:
    - "kubernetes/kubernetes pkg/kubelet/runtime.go:128@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/runtime.go:128@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/runtime.go:133@v1.37.2"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:816,2406@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:870,2460@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:903,2697@v1.37.2"
    - "kubernetes/kubernetes pkg/kubelet/pleg/generic.go:191@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/pleg/generic.go:191@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/pleg/generic.go:244@v1.37.2"
# The source spells it "Eviction manager:" and prints the first three phrases with InfoS (I lines), which the journal collectors keep since kubegap 0.1.78.
# "Evicted pod" and "evicting pod" were dropped: the kubelet never prints them (kubectl drain stdout only); the Evicted reason is in the events summary.
- id: kubelet.eviction
  name: kubelet evicted pods under node pressure
  component: kubelet
  area: node
  severity: medium
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Eviction manager: (must evict|attempting to reclaim|pods ranked for eviction|pod failed to evict)'
  meaning: Memory, disk or inodes fell below evictionHard and the kubelet killed pods. Those pods remain in Evicted state. The first three phrases are klog I lines (kept by the collectors since kubegap 0.1.78), "pod failed to evict" is an E line; all four print at klog V0 at every version read.
  cause: emptyDir or logs filling the node disk, memory of pods without limits, sluggish image GC.
  verify: "kubectl get pods -A --field-selector status.phase=Failed | grep Evicted; df -h /var/lib/kubelet"
  source:
    - "kubernetes/kubernetes pkg/kubelet/eviction/eviction_manager.go:376,387,405,625@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/eviction/eviction_manager.go:376,387,405,627@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/eviction/eviction_manager.go:389,400,418,656@v1.37.2"
# "failed to garbage collect required amount of images" was lowercase in the catalog; the source says "Failed to ..." up to v1.34 and from v1.35 the err text is
# "Insufficient free disk space ... Failed to free sufficient space by deleting unused images ...". ImageGCFailed (Event reason) was dropped: the events summary covers it.
- id: kubelet.image-gc-failed
  name: Image garbage collection failed
  component: kubelet
  area: node
  severity: medium
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Image garbage collection failed|Failed to garbage collect required amount of images|Failed to free sufficient space by deleting unused images'
  meaning: imagefs is above the threshold (85% by default) but there are not enough removable images. Disk-pressure eviction is imminent. The E line is "Image garbage collection failed once/multiple times in a row"; its err value reads "Failed to garbage collect required amount of images" up to kubernetes 1.34 and "Insufficient free disk space ... Failed to free sufficient space by deleting unused images" from 1.35.
  cause: Only in-use images remain, or images are too large. Exited containers are holding on to images.
  verify: "crictl imagefsinfo; crictl images | wc -l"
  source:
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:1551,1555@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:1596,1600@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:1750,1754@v1.37.2"
    - "kubernetes/kubernetes pkg/kubelet/images/image_gc_manager.go:390@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/images/image_gc_manager.go:400@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/images/image_gc_manager.go:401@v1.34.13"
    - "kubernetes/kubernetes pkg/kubelet/images/image_gc_manager.go:408,413@v1.35.10"
    - "kubernetes/kubernetes pkg/kubelet/images/image_gc_manager.go:408,413@v1.37.2"
# All three phrases are on one kubelet line, ErrorS up to v1.35 and logger.Info (I line) from v1.36; the collectors keep that I line since kubegap 0.1.78.
- id: kubelet.runtime-network-not-ready
  name: Container runtime network not ready (CNI)
  component: kubelet
  area: traffic
  severity: high
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Container runtime network not ready|NetworkPluginNotReady|cni plugin not initialized'
  meaning: No CNI config, so new pods are stuck in ContainerCreating. The node is NotReady. One kubelet line carries all three phrases (the containerd CRI reason and the go-cni error are in its networkReady value); it is an E line up to kubernetes 1.35 and an I line from 1.36 (kept by the collectors since kubegap 0.1.78), and drops to V(4) while the runtime is not yet expected to be ready after boot.
  cause: The aws-node or flannel pod is not running on that node, /etc/cni/net.d is empty.
  verify: "crictl info | jq .status; ls /etc/cni/net.d"
  source:
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:2996,2998,3002@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:3111,3113,3117@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:3129,3135@v1.35.10"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:3256,3262@v1.36.6"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:3337,3339,3343@v1.37.2"
    - "kubernetes/kubernetes pkg/kubelet/container/runtime.go:627@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/container/runtime.go:642@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/container/runtime.go:680@v1.37.2"
    - "containerd/containerd pkg/cri/server/status.go:32,52@v1.7.29"
    - "containerd/containerd internal/cri/server/status.go:34,54@v2.1.5"
    - "k3s-io/containerd internal/cri/server/status.go:34,54@v2.1.4-k3s1"
    - "containerd/containerd internal/cri/server/status.go:34,54@v2.4.2"
    - "containerd/go-cni errors.go:24@v1.1.9"
    - "containerd/go-cni errors.go:24@v1.1.12"
    - "containerd/go-cni errors.go:24@v1.1.14"
# FailedMount (Event reason) was dropped: the events summary covers it, and the kubelet logs it only through the V(3) "Event occurred" line.
- id: kubelet.volume-mount-failed
  name: Volume attach/mount failed
  component: kubelet
  area: storage
  severity: medium
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Unable to attach or mount volumes|MountVolume\.(SetUp|MountDevice|WaitForAttach) failed'
  meaning: The pod cannot attach its volume and stays in ContainerCreating. "Unable to attach or mount volumes for pod; skipping pod" is an E line; "MountVolume.SetUp failed for volume ..." is the text of the unstructured E lines the volume operation executor writes after each failed attempt.
  cause: EBS attach limit, volume still attached to another node (Multi-Attach), PVC Pending, missing ConfigMap/Secret.
  verify: "kubectl describe pod -n <ns> <pod> | grep -A5 Events"
  source:
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:2005@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/kubelet.go:2050@v1.33.5"
