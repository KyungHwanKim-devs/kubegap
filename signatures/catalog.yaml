# "shim reaped" (runtime v1, Info, gone in 2.x) and "ttrpc: closed.*shim" (the words come in the other order and containerd suppresses ErrClosed) were dropped.
- id: containerd.shim-error
  name: containerd shim crashed
  component: containerd
  area: node
  severity: medium
  sources: ["logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'shim disconnected|failed to delete task|shim.*ttrpc: closed'
  meaning: The shim wrapping the container process died. The container state may be left as Unknown. "cleaning up after shim disconnected" is level=warning only up to containerd 2.1.0 (1.7.x, 2.0.x); from 2.1.1 it is level=info and not collected, so on those versions only "failed to clean up after shim disconnected" (warning) and "failed to delete task" (level=error from 2.2.0, otherwise inside CRI error= values) are visible.
  cause: OOM (including the shim), runtime bugs, node reboot.
  verify: "crictl ps -a | grep -i unknown"
  warn_at: 5
  fail_at: 50
  source:
    - "containerd/containerd runtime/v2/shim.go:153,156,459@v1.7.29"
    - "containerd/containerd runtime/v2/manager.go:512@v1.7.29"
    - "containerd/containerd core/runtime/v2/shim.go:141@v2.1.0"
    - "containerd/containerd core/runtime/v2/shim.go:141@v2.1.1"
    - "containerd/containerd core/runtime/v2/shim.go:141,144,530@v2.1.5"
    - "containerd/containerd core/runtime/v2/task_manager.go:243@v2.1.5"
    - "k3s-io/containerd core/runtime/v2/shim.go:141,144,530@v2.1.4-k3s1"
