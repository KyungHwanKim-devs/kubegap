- id: kubelet.orphaned-pod
  name: Orphaned pod directories
  component: kubelet
  area: hygiene
  severity: low
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'orphaned pod .* found, but'
  meaning: Directories of pods unknown to the apiserver remain under /var/lib/kubelet/pods and the kubelet cannot remove them. They eat disk and fill the log. The text is the err value of the E line "Failed cleaning up orphaned pod directories" (the pod UID inside it is quoted as \"uid\" by klog).
  cause: Volume unmount failure (subPath, CSI), deletion during a kubelet restart.
  verify: "ls /var/lib/kubelet/pods | wc -l"
  warn_at: 20
  fail_at: 500
  source:
    - "kubernetes/kubernetes pkg/kubelet/kubelet_volumes.go:127,133,143,150,161,225,245@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/kubelet_volumes.go:127,133,143,150,161,225,245@v1.33.5"
