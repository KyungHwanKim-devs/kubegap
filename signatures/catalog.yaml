# ---------------- Loki ----------------
# Loki logs its own 429/400 push responses at Debug only; every match at the default level is promtail's "error sending batch, will retry" (Warn) / "final error sending batch" (Error) line carrying the first line of Loki's response body. Loki v3.6.0 lower-cased the texts, hence (?i). "too many outstanding requests" (query path) is answered to Grafana and never logged here.
- id: loki.rate-limited
  name: Loki ingestion rate limited
  component: loki
  area: observability
  severity: medium
  sources: ["logs/pods/loki/*.log", "logs/pods/promtail/*.log"]
  pattern: '(?i)ingestion rate limit exceeded|per stream rate limit exceeded|dropping batch due to rate limiting|429 Too Many Requests|server returned HTTP status 429'
  meaning: Some logs are being dropped. During an incident the most verbose logs are dropped first. The lines are promtail's, with Loki's 429 body ("ingestion rate limit exceeded for user ..." or "Per stream rate limit exceeded ...") inside error=; Loki itself logs the rejection at Debug only, so a silent Loki log is not evidence.
  cause: Small limits_config.ingestion_rate_mb (default 4MB/s), a pod flooding logs.
  verify: "kubectl logs -n monitoring -l app=promtail --since=1h | grep -c 429"
  source:
    - "grafana/loki pkg/validation/validate.go:23,63@v2.6.1"
