# ---------------- flannel (including the k3s built-in) ----------------
# k3s does not run flannel's main.go: it wraps the backend errors as "failed to register flannel network" / "failed to create the SubnetManager" and logs them with logrus;
# "failed to retrieve lease" and "lease expired" exist in neither flannel version and were dropped.
- id: flannel.lease-failed
  name: flannel subnet lease failed
  component: flannel
  area: traffic
  severity: high
  sources: ["logs/pods/flannel/*.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'failed to acquire lease|failed to register flannel network|failed to create the SubnetManager|Error registering network|Failed to create SubnetManager'
  meaning: The node did not get a pod CIDR, so pod networking on that node does not work. A standalone flannel pod logs "Error registering network: failed to acquire lease: ..." (klog E); inside k3s the same failure is "flannel exited: failed to register flannel network: failed to acquire lease: ..." (logrus level=error; from k3s 1.37 "Shutdown request received: ...").
  cause: No podCIDR assigned to the node, apiserver access, cluster CIDR exhausted.
  verify: "kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'"
  source:
