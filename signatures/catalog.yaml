- id: k3s.cert-expired
  name: k3s certificate expired
  component: k3s
  area: security
  severity: critical
  sources: ["logs/node/*/k3s-errors-24h.log"]
  pattern: 'certificate has expired or is not yet valid'
  meaning: Authentication between components breaks and the cluster stops. k3s renews certificates expiring within 90 days at startup, so this happens after more than a year without a restart. The phrase is Go's x509 verification error inside any component's err=/error= value (apiserver, kubelet, k3s supervisor); k3s's own certmonitor reports expiry only as the CertificateExpirationWarning Event.
