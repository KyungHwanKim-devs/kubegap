# Node logs added: containerd and the k3s journal print the same Go EMFILE text (seen on the k3s containerd log as "failed to create inotify fd: too many open files").
- id: common.too-many-open-files
  name: too many open files
  component: any
  area: node
  severity: high
  sources: ["logs/pods/*/*.log", "logs/node/*/kubelet-24h.log", "logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'too many open files'
  meaning: A file descriptor or inotify limit was hit. Whatever the component, it behaves erratically afterwards. The text is Go's EMFILE message inside error values; node logs (kubelet, containerd, k3s journal) are scanned too.
  cause: ulimit, fs.inotify.max_user_instances (default 128), fd leaks.
  verify: "sysctl fs.inotify.max_user_instances fs.file-nr"
  source:
    - "golang/go src/syscall/zerrors_linux_amd64.go:1381@go1.24.13"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1381@go1.24.6"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1381@go1.26.10"
- id: common.no-space
  name: no space left on device
  component: any
  area: node
  severity: high
  sources: ["logs/pods/*/*.log", "logs/node/*/kubelet-24h.log", "logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'no space left on device'
  meaning: The volume (or node disk) used by that container is full. The text is Go's ENOSPC message inside error values; node logs are scanned too (a containerd line is counted once, under containerd.no-space).
  cause: PVC size, emptyDir, no log rotation.
  verify: "kubectl exec -n <ns> <pod> -- df -h"
  source:
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.24.13"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.24.6"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.26.10"
- id: common.cert-expired
  name: Certificate expired (x509)
  component: any
  area: security
  severity: critical
  sources: ["logs/pods/*/*.log"]
  pattern: 'x509: certificate has expired or is not yet valid'
  meaning: Some TLS connection fails because of an expired certificate. Webhooks, metrics or API calls break. The text is Go's CertificateInvalid error (reason Expired), followed by the validity window, inside the component's error value.
  cause: cert-manager renewal failure, a neglected manually issued certificate, clock skew.
  verify: "kubectl get certificates -A; kubectl get secrets -A --field-selector type=kubernetes.io/tls -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name'"
  source:
    - "golang/go src/crypto/x509/verify.go:79@go1.24.13"
    - "golang/go src/crypto/x509/verify.go:79@go1.24.6"
    - "golang/go src/crypto/x509/verify.go:79@go1.26.10"
- id: common.connection-refused
  name: Repeated connection refused
  component: any
  area: traffic
  severity: low
  sources: ["logs/pods/*/*.log"]
  pattern: 'connection refused'
  meaning: Some dependency is not listening on its port. The samples show which component tried to connect where. The text is Go's ECONNREFUSED message inside error values.
  cause: Target pod down or restarting, Service port mismatch, network policy.
  verify: "kubectl logs -n <ns> <pod> --since=1h | grep 'connection refused' | head"
  warn_at: 50
  fail_at: 2000
  source:
    - "golang/go src/syscall/zerrors_linux_amd64.go:1466@go1.24.13"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1466@go1.24.6"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1466@go1.26.10"
- id: common.context-deadline
  name: Repeated context deadline exceeded
  component: any
  area: traffic
  severity: low
  sources: ["logs/pods/*/*.log"]
  pattern: 'context deadline exceeded|i/o timeout'
  meaning: Some call timed out. A high frequency means a dependency or the apiserver is slow. The texts are Go's context.DeadlineExceeded and the net poller's deadline error inside error values.
  cause: apiserver latency (controlplane.*), external API latency, DNS.
  verify: "kubectl logs -n <ns> <pod> --since=1h | grep -c 'context deadline exceeded'"
  warn_at: 100
  fail_at: 5000
  source:
    - "golang/go src/context/context.go:175@go1.24.13"
    - "golang/go src/context/context.go:175@go1.24.6"
    - "golang/go src/context/context.go:175@go1.26.10"
    - "golang/go src/internal/poll/fd.go:60@go1.24.13"
    - "golang/go src/internal/poll/fd.go:60@go1.24.6"
    - "golang/go src/internal/poll/fd.go:60@go1.26.10"
# ---------------- Promoted from unclassified errors seen on a small k3s cluster ----------------
- id: k3s.etcd-request-stats
  name: k3s embedded etcd slow request stats (aggregated by controlplane.etcd-slow)
  component: k3s
  area: platform
  severity: low
  sources: ["logs/node/*/k3s-errors-24h.log"]
  pattern: '"msg":"request stats"|apply request took too long|slow fdatasync'
  meaning: etcd logged a warning for requests taking over 100ms. Aggregation and judgement are done by the controlplane.etcd-slow check; this signature counts them only to keep them out of unclassified errors. The lines are etcd's zap JSON warnings ("level":"warn") written to the k3s journal.
  cause: Disk fsync latency (disk shared with PVs and logs), large objects, CPU contention.
  verify: "journalctl -u k3s --since -24h | grep -c 'request stats'"
  warn_at: 100000
  fail_at: 1000000
