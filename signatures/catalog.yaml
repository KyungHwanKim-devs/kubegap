# ---------------- Alertmanager ----------------
# "Error on notify" is printed by no version; "failed to send" is the Debug-only cluster channel line. "Notify attempt failed, will retry later" (Warn) is printed per retry before the final Error.
- id: alertmanager.notify-failed
  name: Alertmanager notification failed
  component: alertmanager
  area: observability
  severity: high
  sources: ["logs/pods/alertmanager/*.log"]
  pattern: 'Notify for alerts failed|Notify attempt failed|notify retry canceled'
  meaning: The alert fired but never reached Slack, Discord or PagerDuty. Nobody knows. "Notify attempt failed, will retry later" (Warn) is printed per retry; "Notify for alerts failed" (Error) once the retries are exhausted, with err="...notify retry canceled after N attempts".
