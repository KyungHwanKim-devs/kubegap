# ---------------- containerd ----------------
- id: containerd.no-space
  name: containerd out of disk space
  component: containerd
  area: node
  severity: high
  sources: ["logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'no space left on device'
  meaning: Image pulls and container creation fail. The node is effectively unusable. The text is Go's ENOSPC message, relayed inside the error= value of containerd's warning/error lines and the err= value of kubelet E lines.
  cause: Images, logs or emptyDir filling the node disk.
  verify: "df -h /var/lib/containerd /var/lib/rancher; crictl imagefsinfo"
  source:
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.24.13"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.24.6"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1385@go1.26.10"
# The registry status error reads "unexpected status from <METHOD> request to <url>: <status>" for every method (containerd 1.7 also had "unexpected status code"); "from HEAD request" covered only HEAD.
- id: containerd.image-pull-failed
  name: Image pull failed
  component: containerd
  area: resilience
  severity: medium
  sources: ["logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'failed to pull (and unpack )?image|PullImage .* failed|failed to resolve reference|unexpected status (from \w+ request|code)[^"]*\b(401|403|404|429)\b'
  meaning: The image cannot be pulled from the registry and the pod stays in ImagePullBackOff. containerd writes level=error msg="PullImage \"<ref>\" failed" with the CRI error in error=; the kubelet relays the same text in its W line "Failed to pull image" (E from kubernetes 1.37) and in "Error syncing pod" err values, which is where the k3s journal shows it.
  cause: Missing tag, expired registry credentials (ECR token, imagePullSecret), rate limiting (Docker Hub 429), network.
  verify: "kubectl get events -A --field-selector reason=Failed | grep -i pull"
  source:
