# ---------------- Elasticsearch / OpenSearch ----------------
# The block texts are the REST response (ClusterBlockException "blocked by: [TOO_MANY_REQUESTS/12/disk usage exceeded ...]"); the server logs the block only at Debug, so they appear in fluent-bit's log (HTTP status=429 ... response: body, or "error: Output" with trace_error). "FORBIDDEN/12/index read-only / allow delete (api)" is the pre-7.4 wording of block 12; since 7.4 block 12 is TOO_MANY_REQUESTS with "disk usage exceeded flood-stage watermark".
- id: elasticsearch.read-only-flood
  name: Elasticsearch indices read-only (disk flood stage)
  component: elasticsearch-opensearch
  area: observability
  severity: critical
  sources: ["logs/pods/elasticsearch-opensearch/*.log", "logs/pods/fluent-bit/*.log"]
  pattern: 'flood stage disk watermark|cluster_block_exception|TOO_MANY_REQUESTS/12/disk usage exceeded'
  meaning: Disk went past 95% and all indices became read-only. No more logs come in. Even after freeing disk the block must be lifted by hand (automatic on 7.4+). The server line is the Warn "flood stage disk watermark [95%] exceeded on ..."; "cluster_block_exception" and "TOO_MANY_REQUESTS/12/disk usage exceeded flood-stage watermark" are the response body that fluent-bit prints after "HTTP status=429".
  cause: No retention (ILM), a small PV.
  verify: "curl -s <es>/_cluster/allocation/explain; curl -s <es>/_cat/allocation?v"
  source:
    - "elastic/elasticsearch server/src/main/java/org/elasticsearch/cluster/routing/allocation/DiskThresholdMonitor.java:171@v7.10.2"
    - "elastic/elasticsearch server/src/main/java/org/elasticsearch/cluster/routing/allocation/DiskThresholdMonitor.java:194,218@v8.19.24"
    - "elastic/elasticsearch server/src/main/java/org/elasticsearch/cluster/routing/allocation/DiskThresholdMonitor.java:204,227@v9.5.6"
    - "opensearch-project/OpenSearch server/src/main/java/org/opensearch/cluster/routing/allocation/DiskThresholdMonitor.java:229@3.9.0"
