# ---------------- Promoted from top unclassified errors seen on EKS and k3s clusters ----------------
# (signatures/catalog.yaml) The csi-snapshotter sidecar's reflector line. client-go v0.31.0 prints two lines per failed list (a W "failed to list" line and the E "Unhandled Error" line that wraps it);
# client-go v0.37.0 prints only the E line ("Failed to watch" err="failed to list ..."), so counts halve on newer sidecars.
- id: ebs-csi.snapshot-crd-missing
  name: EBS CSI cannot find the VolumeSnapshot CRD (snapshot controller not installed)
  component: ebs-csi
  area: storage
  severity: medium
  sources: ["logs/pods/ebs-csi/*.log"]
  pattern: 'failed to list \*v1\.VolumeSnapshot(Class|Content)?: the server could not find the requested resource'
  meaning: external-snapshotter (CRD + snapshot-controller) is missing, so VolumeSnapshots cannot be created. Velero/CSI snapshot backups are impossible and the csi-snapshotter sidecar logs the reflector error on every list retry (two lines per retry with client-go 0.31, one with 0.37).
  cause: Only the EBS CSI add-on was installed, without the snapshot-controller (separate add-on or kubernetes-csi/external-snapshotter).
  verify: "kubectl get crd volumesnapshotclasses.snapshot.storage.k8s.io; kubectl get deploy -n kube-system snapshot-controller"
  warn_at: 1
  fail_at: 100
  source:
    - "kubernetes/client-go tools/cache/reflector.go:158,561,562@v0.31.0"
    - "kubernetes/client-go tools/cache/reflector.go:227,747@v0.37.0"
