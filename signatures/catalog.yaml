# ---------------- ingress-nginx ----------------
# `nginx: [emerg]` (the `nginx -t` form, ngx_log.c:207) is a subset of `[emerg]` (the error-log form, ngx_log.c:77,112); one alternative covers both.
- id: ingress-nginx.emerg
  name: nginx [emerg] configuration error
  component: ingress-nginx
  area: traffic
  severity: critical
  sources: ["logs/pods/ingress-nginx/*.log"]
  pattern: '\[emerg\]'
  meaning: The config reload failed and the old config keeps running. New Ingresses are not applied. The line is either the nginx master's error log (`YYYY/MM/DD HH:MM:SS [emerg] pid#tid:`) or the `nginx -t` output that the controller prints inside its "Unexpected failure reloading the backend" error (`nginx: [emerg] ...`).
