# FailedCreatePodSandBox (Event reason) was dropped for the kubelet E line "CreatePodSandbox for pod failed", which carries the containerd error into the k3s journal.
- id: containerd.sandbox-failed
  name: Pod sandbox creation failed
  component: containerd
  area: resilience
  severity: medium
  sources: ["logs/node/*/containerd-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'RunPodSandbox .* failed|CreatePodSandbox for pod failed|failed to (setup network for|create containerd task|reserve sandbox name|start sandbox)'
  meaning: The pod network namespace or pause container cannot be created. Most often the CNI cannot hand out an IP. containerd writes level=error msg="RunPodSandbox for &PodSandboxMetadata{...} failed, error" with the cause in error=; the kubelet writes the E line "CreatePodSandbox for pod failed" with the same cause in err=.
  cause: aws-node IP exhaustion, CNI plugin errors, runtime resource shortage.
  verify: "kubectl get events -A --field-selector reason=FailedCreatePodSandBox"
  source:
