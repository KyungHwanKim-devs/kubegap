- id: promtail.send-failed
  name: promtail push failed
  component: promtail
  area: observability
  severity: medium
  sources: ["logs/pods/promtail/*.log"]
  pattern: 'error sending batch|server returned HTTP status 5\d\d|final error sending batch|connection refused|context deadline exceeded'
  meaning: Logs are not reaching Loki. Once dropped after retries, that window is a permanent gap. "error sending batch, will retry" (Warn) is one line per retry; "final error sending batch" (Error) is the drop.
  cause: Loki down or OOM, network policy, a changed Loki address.
  verify: "kubectl logs -n monitoring -l app=promtail --since=1h | grep -c 'error sending batch'"
