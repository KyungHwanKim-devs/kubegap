# kubernetes 1.36 made the line structured: "Error proxying data from client to backend" err="websocket: ..."; the pattern accepts both forms.
- id: k3s.proxy-websocket-closed
  name: k3s tunnel websocket closed abnormally (kubectl exec/logs/port-forward dropped)
  component: k3s
  area: platform
  severity: low
  sources: ["logs/node/*/k3s-errors-24h.log"]
  pattern: 'Error proxying data from (client to backend|backend to client)(: |" err=")websocket'
  meaning: Records of exec/logs/port-forward connections over the apiserver-kubelet tunnel being dropped. Many are normal closes by the user. Hundreds or more mean an unstable network or a flaky port-forward client. The line is apimachinery's klog E line, unstructured up to kubernetes 1.35 and structured (err= value) from 1.36.
  cause: Client closed first (normal), unstable agent-server network, long port-forward sessions.
  verify: "journalctl -u k3s --since -24h | grep -c 'Error proxying data'"
  warn_at: 500
  fail_at: 10000
  source:
    - "kubernetes/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:397,427,441@v1.33.5"
    - "k3s-io/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:397,427,441@v1.33.5-k3s1"
    - "kubernetes/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:427@v1.35.10"
    - "kubernetes/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:428@v1.36.6"
    - "kubernetes/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:398,428,442@v1.37.2"
    - "k3s-io/kubernetes staging/src/k8s.io/apimachinery/pkg/util/proxy/upgradeaware.go:398,428,442@v1.37.2-k3s1"
# "Failed to get cgroup stats" was capitalised in the catalog; the kubelet prints it lowercase inside the err value of "Failed to get system container stats".
- id: kubelet.cadvisor-partial
  name: kubelet cAdvisor partial container stats failure
  component: kubelet
  area: node
  severity: low
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Partial failure issuing cadvisor.ContainerInfoV2|failed to get cgroup stats for|cgroup stats not found for'
  meaning: The cgroup of a just-terminated container vanished before its stats could be read. Occasional is normal; many means container churn is very high. "Partial failure issuing cadvisor.ContainerInfoV2" is an E line whose err value is cAdvisor's "partial failures: ..."; the other two phrases are the err value of the E line "Failed to get system container stats".
  cause: CrashLoop pods, a flood of short Jobs.
  verify: "journalctl -u kubelet --since -1h | grep -c cadvisor"
  warn_at: 100
  fail_at: 5000
  source:
    - "kubernetes/kubernetes pkg/kubelet/stats/cadvisor_stats_provider.go:522@v1.32.13"
