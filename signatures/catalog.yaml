# ---------------- Common to all components ----------------
# Go never prints "segmentation fault" (it prints "SIGSEGV: segmentation violation"); glibc/bash print "Segmentation fault".
- id: common.panic
  name: Process panic/fatal
  component: any
  area: resilience
  severity: critical
  sources: ["logs/pods/*/*.log"]
  pattern: '^(\S+ )?(\[[^\]]+\] )?\S* ?(panic: |fatal error: |runtime error: |goroutine \d+ \[running\]|SIGSEGV|[Ss]egmentation (fault|violation))'
