    - "kubernetes/kubernetes pkg/kubelet/kubelet_pods.go:1333@v1.37.2"
# klog quotes the err value, so the line reads failed to \"StartContainer\"; the pattern now expects the backslashes.
- id: kubelet.pod-sync-error
  name: Repeated pod sync errors
  component: kubelet
  area: resilience
  severity: low
  sources: ["logs/node/*/kubelet-24h.log", "logs/node/*/k3s-errors-24h.log"]
  pattern: 'Error syncing pod|failed to \\"StartContainer\\"|CreateContainerConfigError|CreateContainerError'
  meaning: The kubelet cannot bring the pod to its desired state. The samples name the pod and reason. The E line is "Error syncing pod, skipping"; the other three phrases are inside its err value.
  cause: CrashLoopBackOff back-off, missing image, missing ConfigMap/Secret key, runtime errors.
  verify: "kubectl get pods -A | grep -vE 'Running|Completed'"
  warn_at: 50
  fail_at: 1000
  source:
    - "kubernetes/kubernetes pkg/kubelet/pod_workers.go:1301@v1.32.13"
    - "kubernetes/kubernetes pkg/kubelet/pod_workers.go:1301@v1.33.5"
    - "kubernetes/kubernetes pkg/kubelet/pod_workers.go:1338@v1.37.2"
