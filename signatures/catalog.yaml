# flannel's messages start with "Error"/"Failed" (klog Errorf) and the file name is in the klog header, so the whole pattern is case-insensitive; the iptables
# alternatives name flannel's own messages so that kube-proxy's iptables-restore errors in the same k3s journal stay with kube-proxy.iptables-restore-failed.
# "failed to set up IPMasq" and "Failed to (add|remove) route" are not printed by any version (the source says "Failed to setup masq rules" and "Error adding/deleting route").
- id: flannel.vxlan-error
  name: flannel vxlan/iptables errors
  component: flannel
  area: traffic
  severity: medium
  sources: ["logs/pods/flannel/*.log", "logs/node/*/k3s-errors-24h.log"]
