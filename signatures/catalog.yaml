# "per-user streams limit ..." is the limiter's text, replaced by StreamLimitErrorMsg before the ingester answers; it never reaches a log. Loki v3.6.0 lower-cased the text.
- id: loki.stream-limit
  name: Loki active stream limit exceeded
  component: loki
  area: observability
  severity: medium
  sources: ["logs/pods/loki/*.log", "logs/pods/promtail/*.log"]
  pattern: '(?i)maximum active stream limit exceeded'
  meaning: Too many label combinations (streams), so new streams are rejected. High-cardinality labels (pod name, request id) are the cause. The text is Loki's 429 body inside promtail's "error sending batch" error=; Loki logs it at Debug only.
