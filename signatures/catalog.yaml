    - "kubernetes/klog internal/serialize/keyvalues.go:276@v2.140.0"
- id: cert-manager.orphan-tls-secret
  name: TLS Secret without an owning Certificate (not managed by cert-manager)
  component: cert-manager
  area: hygiene
  severity: low
  sources: ["logs/pods/cert-manager/*.log"]
  # The cainjector indexer logs this for any Get error (source TODO "check for not found error?"), once per Secret event; `.*not found` keeps the orphan case
  # (apimachinery NewNotFound: `<resource> "<name>" not found` in err=) and drops transient apiserver errors.
  pattern: 'unable to fetch certificate that owns the secret.*not found'
  meaning: A TLS Secret carries cert-manager annotations but its Certificate resource is gone. An Ingress may be serving a certificate that will never renew (discovered at expiry). The cainjector prints the line on every event of such a Secret, so the count is events, not Secrets; the verify command lists the Secrets.
  cause: Certificate deleted but Secret left behind, a namespace move, a hand-made Secret.
  verify: "kubectl get secrets -A --field-selector type=kubernetes.io/tls -o json | jq -r '.items[] | select(.metadata.annotations[\"cert-manager.io/certificate-name\"]) | .metadata.namespace+\"/\"+.metadata.name' ; kubectl get certificates -A"
  warn_at: 1
  fail_at: 1000
  source:
    - "cert-manager/cert-manager pkg/controller/cainjector/indexers.go:61@v1.14.4"
    - "cert-manager/cert-manager pkg/controller/cainjector/indexers.go:67@v1.21.3"
    - "kubernetes/apimachinery pkg/api/errors/errors.go:154@v0.29.0"
    - "kubernetes/apimachinery pkg/api/errors/errors.go:155@v0.36.2"
    - "kubernetes/klog klog.go:809@v2.110.1"
    - "kubernetes/klog klog.go:848@v2.140.0"
