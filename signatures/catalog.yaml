  meaning: The inter-node pod traffic tunnel or NAT rules are broken. The lines are flannel klog E lines ("vxlan_network.go:NNN] Error adding route to ...", "iptables.go:NNN] Failed to ensure iptables rules: ...", "Failed to setup IPTables. ...", "Failed to bootstrap IPTables: ...") and, inside k3s, the logrus error "flannel exited: failed to setup masq rules: ...". The iptables phrases are flannel's own, so kube-proxy's iptables-restore errors in the same k3s journal do not count here.
  cause: Kernel modules, interface selection (--flannel-iface), another firewall wiping the rules.
