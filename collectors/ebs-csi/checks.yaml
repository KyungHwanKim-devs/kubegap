- id: ebscsi.storageclass-unencrypted
  name: EBS StorageClass without encrypted (new volumes are not encrypted)
  area: security
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "len(item['classes_unencrypted']) > 0 and item['default_class'] in item['classes_unencrypted']"
    warn_expr: "len(item['classes_unencrypted']) > 0"
  target: "'cluster'"
  evidence: "f\"ebs.csi.aws.com StorageClasses {item['classes']}, without encrypted {item['classes_unencrypted']} (default class {item['default_class']}), in-tree leftovers {item['classes_intree']}, without allowVolumeExpansion {item['classes_no_expansion']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    storage.ebs-unencrypted reports the result — existing volumes that are not encrypted. This check reports the cause: without encrypted: "true" in the StorageClass parameters, future volumes will be the same. Enabling account-level "EBS encryption by default" removes the need to fix the class, but clusters have been observed with neither.
  suggest: "Set parameters.encrypted \"true\" on the gp3 class (+ optional kmsKeyId). Or aws ec2 enable-ebs-encryption-by-default (per region). Existing volumes only change via snapshot → encrypted copy."
  verify:
    - "kubectl get sc -o custom-columns=NAME:.metadata.name,PROV:.provisioner,ENC:.parameters.encrypted,EXP:.allowVolumeExpansion ; aws ec2 get-ebs-encryption-by-default"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.37.0"
