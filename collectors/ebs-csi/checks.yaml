- id: ebscsi.node-ops-errors
  name: kubelet → EBS CSI node plugin calls failing (mount or attach confirmation failed)
  area: storage
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "item['kubelet_metrics_available'] and ((item['node_ops_errors_24h'] or 0) >= 10 or (item['storage_ops_failures_24h'] or 0) >= 10)"
    warn_expr: "item['kubelet_metrics_available'] and ((item['node_ops_errors_24h'] or 0) > 0 or (item['storage_ops_failures_24h'] or 0) > 0 or (item['events_failures_24h'] or 0) > 0)"
