- id: ebscsi.stage-latency
  name: Volume attach→mount (NodeStageVolume) p99 is slow (StatefulSet recovery time)
  area: storage
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "(item['stage_p99_s'] or 0) >= 120"
    warn_expr: "(item['stage_p99_s'] or 0) >= 30 or (item['publish_p99_s'] or 0) >= 30"
  target: "'cluster'"
  evidence: "f\"24h p99: NodeStageVolume {item['stage_p99_s']}s, NodePublishVolume {item['publish_p99_s']}s (no value means no attach happened in that window)\""
  severity_default: medium
  symptom_linked: true
  why: >
    After node replacement or a spot reclaim, the time for a StatefulSet pod to come up on a new node is "EBS detach + attach + Stage (mount)". A Stage p99 above 30 seconds delays DB recovery by tens of seconds per node; above 2 minutes the attach itself is being retried.
    Measured on a real EKS cluster: no Stage calls within 24h, so no value (the pods moved by that day's spot reclaim did not use EBS).
  suggest: "If slow, check the controller --batching (enabled) and EC2 API throttling (visible only when ebscsi.controller-metrics is enabled). With many nodes, raise attacher --worker-threads."
  verify:
    - "histogram_quantile(0.99, sum by (method_name, le) (rate(csi_operations_seconds_bucket{driver_name=\"ebs.csi.aws.com\"}[24h])))"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
