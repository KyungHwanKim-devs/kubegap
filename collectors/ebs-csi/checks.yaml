- id: ebscsi.volumeattachment-stuck
  name: VolumeAttachment stuck unattached for a long time or carrying an attach/detach error
  area: storage
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "len(item['va_stuck']) > 0"
    warn_expr: "len(item['va_orphan']) > 0"
  target: "'cluster'"
  evidence: "f\"VolumeAttachments {item['volume_attachments']}, incomplete or errored {item['va_stuck']} ({[(d['pv'], d['node'], d['age_min'], d['error']) for d in item['va_stuck_detail']][:3]}), orphans whose PV or node is gone {item['va_orphan']}\""
  severity_default: high
  symptom_linked: true
  why: >
    A VolumeAttachment is the request object for "attach this PV to this node". If it stays attached false for more than 10 minutes, that pod is sitting in ContainerCreating with "Multi-Attach error" or "timed out waiting for volume". The attachError message is the direct cause (limit exceeded, attached to another node, IAM). One left behind after its node disappeared is an orphan whose detach never finished.
  suggest: "Follow the attachError message: AttachmentLimitExceeded → the node attach limit (storage.node-attach-limit); 'already attached' → force detach from the old node (aws ec2 detach-volume --force risks data — first confirm the pod is not running on another node)."
  verify:
    - "kubectl get volumeattachments -o custom-columns=NAME:.metadata.name,PV:.spec.source.persistentVolumeName,NODE:.spec.nodeName,ATTACHED:.status.attached,ERR:.status.attachError.message"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.37.0"
          addon_version: "v1.37.0-eksbuild.1"
          addon_latest: "v1.67.2-eksbuild.1"
          addon_managed: true
          controller_replicas: 2
          controller_ready: 2
          controller_all_same_node: false
          controller_present: true
          node_desired: 7
          node_ready: 7
          windows_daemonset_desired: 0
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/my-cluster-eks-ebs-csi-role"
          pod_identity: false
          batching: true
          sidecar_timeouts:
            csi-provisioner: "60s"
            csi-attacher: "60s"
            csi-snapshotter: null
            csi-resizer: "60s"
          volume_attachments: 17
          va_stuck:
            - "csi-abc"
          va_stuck_detail:
            - name: "csi-abc"
              node: "n1"
              pv: "pvc-1"
              attached: false
              age_min: 45.0
              error: "AttachmentLimitExceeded"
              pv_missing: false
              node_missing: false
              deleting: false
          va_orphan: []
          classes: 4
          classes_unencrypted:
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_no_expansion:
            - "gp2"
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_intree:
            - "gp2"
          default_class: "gp3"
          kubelet_metrics_available: true
          node_ops_errors_24h: 0
          node_ops_errors_detail: {}
          stage_p99_s: null
          publish_p99_s: null
          storage_ops_failures_24h: 0
          controller_metrics_enabled: false
          api_errors_24h: {}
          api_throttles_24h: null
          events_24h: {}
          events_failures_24h: 0
          fs_group_policy: "ReadWriteOnceWithFSType"
      - expect: "warn"
        item:
