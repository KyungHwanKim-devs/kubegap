- id: ebscsi.sidecar-timeout-default
  name: CSI sidecar (attacher, provisioner, resizer) timeout at the default 60s or unset
  area: storage
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    warn_expr: "item['controller_present'] and item['sidecar_timeouts'] is not None and any((v in (None, '15s', '60s')) for v in item['sidecar_timeouts'].values()) and (item['stage_p99_s'] or 0) >= 30"
  target: "'cluster'"
  evidence: "f\"sidecar --timeout {item['sidecar_timeouts']}, batching {item['batching']}, Stage p99 {item['stage_p99_s']}s\""
  severity_default: low
  symptom_linked: false
  why: >
    The attacher and provisioner --timeout is the wait limit for a single EC2 call. With large volumes or throttling, exceeding 60 seconds makes the sidecars retry repeatedly and delays attach further. It only matters when latency is actually present (Stage p99 of 30s or more), so it warns only then.
  suggest: "In the add-on values, sidecars.attacher.additionalArgs --timeout=300s and similar. batching is already enabled."
  verify:
    - "kubectl get deploy -n kube-system ebs-csi-controller -o jsonpath='{.spec.template.spec.containers[*].args}' | tr ' ' '\\n' | grep timeout"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "1.37.0"
          addon_version: "v1.37.0-eksbuild.1"
          addon_latest: "v1.67.2-eksbuild.1"
          addon_managed: true
          controller_replicas: 2
          controller_ready: 2
          controller_all_same_node: false
          controller_present: true
          node_desired: 7
          node_ready: 7
          windows_daemonset_desired: 0
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/my-cluster-eks-ebs-csi-role"
          pod_identity: false
          batching: true
          sidecar_timeouts:
            csi-attacher: "60s"
            csi-provisioner: "60s"
          volume_attachments: 17
          va_stuck: []
          va_stuck_detail: []
          va_orphan: []
          classes: 4
          classes_unencrypted:
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_no_expansion:
            - "gp2"
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_intree:
            - "gp2"
          default_class: "gp3"
          kubelet_metrics_available: true
          node_ops_errors_24h: 0
          node_ops_errors_detail: {}
          stage_p99_s: 45.0
          publish_p99_s: null
          storage_ops_failures_24h: 0
          controller_metrics_enabled: false
          api_errors_24h: {}
          api_throttles_24h: null
