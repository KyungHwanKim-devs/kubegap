- id: ebscsi.no-dedicated-role
  name: EBS CSI controller has no dedicated IAM role (IRSA or Pod Identity) (shares the node role permissions)
  area: security
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "item['controller_present'] and not item['has_dedicated_role']"
  target: "'cluster'"
  evidence: "f\"ServiceAccount ebs-csi-controller-sa: IRSA role {item['irsa_role']}, Pod Identity {item['pod_identity']}, add-on serviceAccountRoleArn present {item['has_dedicated_role']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Without a dedicated role the controller uses the node instance role's EC2 volume permissions (CreateVolume, AttachVolume, DeleteVolume, CreateSnapshot). Those permissions then have to live on the node role, and on nodes with IMDS hop limit 2 (security.imds-hop-limit) every pod can create and delete volumes.
    Measured on a real EKS cluster: a dedicated IRSA role for the EBS CSI driver was present — pass.
  suggest: "Set a role with AmazonEBSCSIDriverPolicy as the add-on serviceAccountRoleArn and remove EBS permissions from the node role."
  verify:
    - "kubectl get sa -n kube-system ebs-csi-controller-sa -o jsonpath='{.metadata.annotations}' ; aws eks describe-addon --addon-name aws-ebs-csi-driver --query addon.serviceAccountRoleArn"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.37.0"
          addon_version: "v1.37.0-eksbuild.1"
          addon_latest: "v1.67.2-eksbuild.1"
          addon_managed: true
          controller_replicas: 2
          controller_ready: 2
          controller_all_same_node: false
          controller_present: true
          node_desired: 7
          node_ready: 7
          windows_daemonset_desired: 0
          has_dedicated_role: false
          irsa_role: null
          pod_identity: false
          batching: true
          sidecar_timeouts:
            csi-provisioner: "60s"
            csi-attacher: "60s"
            csi-snapshotter: null
            csi-resizer: "60s"
          volume_attachments: 17
          va_stuck: []
          va_stuck_detail: []
          va_orphan: []
          classes: 4
          classes_unencrypted:
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_no_expansion:
            - "gp2"
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_intree:
            - "gp2"
          default_class: "gp3"
          kubelet_metrics_available: true
          node_ops_errors_24h: 0
          node_ops_errors_detail: {}
          stage_p99_s: null
          publish_p99_s: null
          storage_ops_failures_24h: 0
          controller_metrics_enabled: false
          api_errors_24h: {}
          api_throttles_24h: null
          events_24h: {}
          events_failures_24h: 0
          fs_group_policy: "ReadWriteOnceWithFSType"
      - expect: "pass"
        item:
