# EBS CSI checks. summary.ebscsi.summary — lib/ebscsi.py. Attach limits, EBS volumes and snapshots are covered by the core storage section (storage.*).
- id: ebscsi.controller-availability
  name: EBS CSI controller has 1 replica or all replicas on one node (single point where volume attach and provisioning stop)
  area: storage
  type: summary
  each: ebscsi.summary
  cluster_level: true
  rule:
    expr: "item['controller_present'] and ((item['controller_ready'] or 0) < (item['controller_replicas'] or 0) or (item['controller_replicas'] or 0) < 2)"
    warn_expr: "item['controller_present'] and item['controller_all_same_node']"
  target: "'cluster'"
  evidence: "f\"ebs-csi-controller replicas {item['controller_replicas']} / ready {item['controller_ready']}, all on one node {item['controller_all_same_node']}, node plugin {item['node_ready']}/{item['node_desired']}, version {item['version']} (add-on {item['addon_version']}, latest {item['addon_latest']})\""
  severity_default: high
  symptom_linked: true
  why: >
    Without the controller, new PVC provisioning, attach after node replacement, snapshots and expansion all stop — when a node dies and a StatefulSet moves, the PV cannot attach to the new node and the pod stays Pending. The default is 2 replicas with leader election; if both are on the same node, both disappear when that node fails.
    Measured on a real EKS cluster: 2/2 on different nodes (both system nodes without SSM registration).
  suggest: "Keep replicas 2 and confirm podAntiAffinity (present in the defaults). Also check that the node plugin (ebs-csi-node) is Ready on every node."
  verify:
    - "kubectl get deploy -n kube-system ebs-csi-controller -o wide ; kubectl get ds -n kube-system ebs-csi-node"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.37.0"
          addon_version: "v1.37.0-eksbuild.1"
          addon_latest: "v1.67.2-eksbuild.1"
          addon_managed: true
          controller_replicas: 2
          controller_ready: 1
          controller_all_same_node: false
          controller_present: true
          node_desired: 7
          node_ready: 7
          windows_daemonset_desired: 0
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/my-cluster-eks-ebs-csi-role"
          pod_identity: false
          batching: true
          sidecar_timeouts:
            csi-provisioner: "60s"
            csi-attacher: "60s"
            csi-snapshotter: null
            csi-resizer: "60s"
          volume_attachments: 17
          va_stuck: []
          va_stuck_detail: []
          va_orphan: []
          classes: 4
          classes_unencrypted:
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_no_expansion:
            - "gp2"
            - "gp3"
            - "gp3-2a"
            - "gp3-2c"
          classes_intree:
            - "gp2"
          default_class: "gp3"
          kubelet_metrics_available: true
          node_ops_errors_24h: 0
          node_ops_errors_detail: {}
          stage_p99_s: null
          publish_p99_s: null
          storage_ops_failures_24h: 0
          controller_metrics_enabled: false
          api_errors_24h: {}
          api_throttles_24h: null
          events_24h: {}
          events_failures_24h: 0
          fs_group_policy: "ReadWriteOnceWithFSType"
