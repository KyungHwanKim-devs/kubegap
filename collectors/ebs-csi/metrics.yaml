# EBS CSI PromQL. Window is 24 hours — attach and stage only happen on node replacement and deploys, so 1 hour is usually empty.
# source: per name, read in kubernetes-sigs/aws-ebs-csi-driver at v1.37.0 (EKS, the last release with the cloudprovider_aws_ names), v1.38.0 and v1.38.1 (the aws_ebs_csi_ names arrive,
# the old ones stay behind --deprecated-metrics, default true), v1.41.0 (--deprecated-metrics default false), v1.53.0 (the request histogram is initialized at start), v1.67.2 (newest),
# and for the kubelet names in kubernetes/kubernetes at the eleven versions of kube-proxy/metrics.yaml; the format is the one of #121 (core/metrics.yaml header). The controller
# queries read each counter under its new name or its old one.
- id: ebscsi_controller_metrics_series
  # Counts the controller's EC2 request histogram under its new (v1.38.1 and later) or old name; a count over aws_ebs_csi_.* also counted the node plugin's NVMe series since v1.38.1 and nothing at all before it.
  why: Number of EC2 API request series the ebs-plugin controller serves (either metric name generation). 0 means controller metrics are off (--http-endpoint unset, chart controller.enableMetrics false) and EC2 API errors, throttling and latency are invisible; before driver v1.53.0 also 0 until the first EC2 call
  query: count({__name__=~"(aws_ebs_csi|cloudprovider_aws)_api_request_duration_seconds_count"})
  source:
    - "aws_ebs_csi_api_request_duration_seconds_count: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:60@v1.38.0, :60@v1.38.1, :61@v1.41.0, :60@v1.67.2 (the _count series of the histogram aws_ebs_csi_api_request_duration_seconds, label request; the constant APIRequestDuration pkg/metrics/constants.go:19@v1.41.0, :19@v1.67.2; since v1.53.0 the series are created at start for the 16 known request values, pkg/metrics/metrics.go:270@v1.53.0, :287@v1.67.2, called from cmd/main.go:243@v1.67.2, so they exist as soon as the controller serves metrics; before v1.53.0 a series appears after the first EC2 call of that request type. The controller registry is a fresh prometheus.NewRegistry, pkg/metrics/metrics.go:47@v1.37.0, :51@v1.38.1, :69@v1.41.0, :74@v1.67.2, so the endpoint has no go_ or process_ series to count instead, and the node plugin's NVMe metrics carry the same aws_ebs_csi_ prefix since v1.38.1, pkg/metrics/nvme.go:41-60@v1.38.1, :41-60@v1.67.2 with pkg/metrics/metrics.go:28@v1.38.1, :29@v1.67.2, so a count over aws_ebs_csi_.* is not a controller signal)"
    - "cloudprovider_aws_api_request_duration_seconds_count: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:54@v1.37.0, :62@v1.38.0, :62@v1.38.1, :63@v1.41.0, :62@v1.67.2 (the histogram's name up to v1.38.0 and, with --deprecated-metrics, after; label request; the only controller series a release before v1.38.1 has, so the count query names it next to the new one)"
- id: ebscsi_api_errors_24h
  why: Errors of EC2 API calls made by the controller (24h, when metrics are enabled), by request type; reads the metric under its v1.38.1+ name or the older cloudprovider_aws_ name
  query: sum by (request) (increase(aws_ebs_csi_api_request_errors_total[24h]) or increase(cloudprovider_aws_api_request_errors[24h]))
  source:
    - "aws_ebs_csi_api_request_errors_total: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:52@v1.38.0, :52@v1.38.1, :53@v1.41.0, :52@v1.67.2 (counter; a literal at v1.38.1 and the constant APIRequestErrors pkg/metrics/constants.go:20@v1.41.0, :20@v1.67.2 later; label request from createLabels pkg/cloud/handlers.go:102@v1.38.0, :102@v1.38.1, :103@v1.41.0, :101@v1.67.2; the name exists since v1.38.1, CHANGELOG.md section v1.38.1@v1.67.2, and before it the counter is cloudprovider_aws_api_request_errors; the controller serves metrics only with --http-endpoint, pkg/driver/options.go:101@v1.37.0, :103@v1.38.1, :103@v1.41.0, :112@v1.67.2, cmd/main.go:157@v1.37.0, :139@v1.67.2, which the chart sets from controller.enableMetrics, false by default, charts/aws-ebs-csi-driver/values.yaml:231@v1.37.0, :231@v1.38.1, :236@v1.41.0, :254@v1.67.2, templates/controller.yaml:86@v1.37.0, :86@v1.38.1, :86@v1.41.0, :91@v1.67.2)"
    - "cloudprovider_aws_api_request_errors: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:49@v1.37.0, :54@v1.38.0, :54@v1.38.1, :55@v1.41.0, :54@v1.67.2 (the counter's name up to v1.38.0; label request; from v1.38.1 emitted next to aws_ebs_csi_api_request_errors_total only with --deprecated-metrics, default true at v1.38.1 pkg/driver/options.go:118@v1.38.1 and false since v1.41.0, :118@v1.41.0, :132@v1.67.2, CHANGELOG.md section v1.41.0@v1.67.2; the query reads the new name or this one, and increase() drops __name__ so a release that emits both counts each request once)"
- id: ebscsi_api_throttles_24h
  why: EC2 API throttles (24h, when metrics are enabled); reads the metric under its v1.38.1+ name or the older cloudprovider_aws_ name
  query: sum(increase(aws_ebs_csi_api_request_throttles_total[24h]) or increase(cloudprovider_aws_api_throttled_requests_total[24h]))
  source:
    - "aws_ebs_csi_api_request_throttles_total: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:47@v1.38.0, :47@v1.38.1, :47@v1.41.0, :46@v1.67.2 (counter; the constant APIRequestThrottles pkg/metrics/constants.go:21@v1.41.0, :21@v1.67.2; its label is operation_name, not request, pkg/cloud/handlers.go:45@v1.38.0, :45@v1.38.1, :45@v1.41.0, :44@v1.67.2, so the query sums without a label; exists since v1.38.1, before it cloudprovider_aws_api_throttled_requests_total; served only with --http-endpoint as for the errors counter)"
    - "cloudprovider_aws_api_throttled_requests_total: kubernetes-sigs/aws-ebs-csi-driver pkg/cloud/handlers.go:47@v1.37.0, :49@v1.38.0, :49@v1.38.1, :49@v1.41.0, :48@v1.67.2 (the throttle counter's name up to v1.38.0, label operation_name pkg/cloud/handlers.go:45@v1.37.0; from v1.38.1 only with --deprecated-metrics, default false since v1.41.0, pkg/driver/options.go:118@v1.41.0)"
- id: ebscsi_node_ops_by_status_24h
  why: gRPC calls kubelet sent to the EBS CSI node plugin (Stage, Publish, Unstage, VolumeStats...) by method and result code (24h). Any non-OK code means a mount or attach failure
  query: sum by (method_name, grpc_status_code) (increase(csi_operations_seconds_count{driver_name="ebs.csi.aws.com"}[24h]))
  source:
    - "csi_operations_seconds_count: kubernetes/kubernetes pkg/volume/util/metrics.go:69@v1.30.14, :69@v1.31.14, :69@v1.32.0, :69@v1.32.13, :69@v1.33.0, :69@v1.33.5, :69@v1.33.13, :69@v1.34.13, :69@v1.35.10, :69@v1.36.6, :70@v1.37.2 (the _count series of the histogram above, same labels driver_name, method_name, grpc_status_code, migrated)"
- id: ebscsi_node_ops_p99_24h
  why: p99 seconds per method (24h). NodeStageVolume above 30s means attach→mount is slow and StatefulSet recovery is delayed
  query: histogram_quantile(0.99, sum by (method_name, le) (rate(csi_operations_seconds_bucket{driver_name="ebs.csi.aws.com"}[24h])))
  source:
    - "csi_operations_seconds_bucket: kubernetes/kubernetes pkg/volume/util/metrics.go:69@v1.30.14, :69@v1.31.14, :69@v1.32.0, :69@v1.32.13, :69@v1.33.0, :69@v1.33.5, :69@v1.33.13, :69@v1.34.13, :69@v1.35.10, :69@v1.36.6, :70@v1.37.2 (ALPHA histogram csi_operations_seconds, subsystem csi pkg/volume/util/metrics.go:68@v1.30.14 to v1.36.6, :69@v1.37.2; labels driver_name, method_name, grpc_status_code, migrated pkg/volume/util/metrics.go:74@v1.30.14 to v1.36.6, :75@v1.37.2; written by RecordCSIOperationLatencyMetrics pkg/volume/util/metrics.go:140-145@v1.30.14 to v1.36.6, :148-154@v1.37.2 with method_name the full gRPC method such as /csi.v1.Node/NodeStageVolume and grpc_status_code OK or the gRPC code of the error; a kubelet series, so the kubelet's job label and the node label of #121 apply; the query reads _bucket with le)"
- id: ebscsi_storage_ops_by_status_24h
  why: kubelet volume operations (mount, unmount, attach confirmation) by status (24h) for the EBS CSI driver only. fail-unknown means a pod was stuck in ContainerCreating
  query: sum by (operation_name, status) (increase(storage_operation_duration_seconds_count{volume_plugin="kubernetes.io/csi:ebs.csi.aws.com"}[24h]))
  source:
    - "storage_operation_duration_seconds_count: kubernetes/kubernetes pkg/volume/util/metrics.go:48@v1.30.14, :48@v1.31.14, :48@v1.32.0, :48@v1.32.13, :48@v1.33.0, :48@v1.33.5, :48@v1.33.13, :48@v1.34.13, :48@v1.35.10, :48@v1.36.6, :49@v1.37.2 (the _count series of the histogram above; status is success or fail-<reason>; volume_plugin kubernetes.io/csi:<driver> from GetFullQualifiedPluginNameForVolume pkg/volume/util/metrics.go:120-129@v1.30.14 to v1.36.6, :127-136@v1.37.2)"
- id: ebscsi_storage_ops_p99_24h
  why: kubelet volume operation p99 seconds (24h) for the EBS CSI driver only
  query: histogram_quantile(0.99, sum by (operation_name, le) (rate(storage_operation_duration_seconds_bucket{volume_plugin="kubernetes.io/csi:ebs.csi.aws.com"}[24h])))
  source:
    - "storage_operation_duration_seconds_bucket: kubernetes/kubernetes pkg/volume/util/metrics.go:48@v1.30.14, :48@v1.31.14, :48@v1.32.0, :48@v1.32.13, :48@v1.33.0, :48@v1.33.5, :48@v1.33.13, :48@v1.34.13, :48@v1.35.10, :48@v1.36.6, :49@v1.37.2 (histogram storage_operation_duration_seconds; labels volume_plugin, operation_name, status, migrated pkg/volume/util/metrics.go:53@v1.30.14 to v1.36.6, :54@v1.37.2; for a CSI volume volume_plugin is kubernetes.io/csi:<driver>, GetFullQualifiedPluginNameForVolume pkg/volume/util/metrics.go:120-129@v1.30.14 to v1.36.6, :127-136@v1.37.2 with CSIPluginName pkg/volume/csi/csi_plugin.go:52@v1.30.14, :52@v1.31.14, :52@v1.32.0, :52@v1.32.13, :54@v1.33.0 to v1.37.2, so the query matches the EBS driver exactly; a kubernetes.io/csi.* pattern would count every CSI driver; the query reads _bucket with le)"
