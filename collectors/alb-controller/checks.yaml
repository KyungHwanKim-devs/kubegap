- id: albctl.aws-api-churn
  name: Controller makes many AWS API calls (repeated target register/deregister, Describe storms → throttling risk)
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    warn_expr: "item['metrics_available'] and ((item['aws_api_retries_avg'] or 0) >= 0.1 or (item['rest_client_429_503'] or 0) >= 100)"
  target: "'cluster'"
  evidence: "f\"AWS API calls since leader start {item['aws_api_calls_total']}, top {item['aws_api_top_ops'][:5] if item['aws_api_top_ops'] else None}, average retries per call {item['aws_api_retries_avg']}, slowest by average latency {item['aws_api_slow_ops_avg_s'][:3] if item['aws_api_slow_ops_avg_s'] else None}, apiserver 429/503 {item['rest_client_429_503']}\""
  severity_default: low
  symptom_linked: false
  why: >
    The controller runs DescribeTargetHealth for every target group and calls Register/DeregisterTargets every time a pod changes. Rising retries per call mean the ELB API limit is being hit; apiserver 429s mean the controller's LIST/WATCH hit the apiserver priority limits.
    Measured on a real EKS cluster: 232,463 calls since leader start (DescribeTargetHealth 73,740, DescribeTargetGroupAttributes 40,600, DescribeInstances 36,913, Register/Deregister about 11k each), average retries 0, apiserver 429/503 total 123 — warn.
  suggest: "Reduce the number of target groups (ALB group sharing may already be in place) or the pod churn rate (HPA flapping, CronJob pods). If retries rise, tune the --aws-api-throttle argument and look for Throttling in the controller logs."
  verify:
    - "aws_api_call_duration_seconds_count and aws_api_call_retries_sum from the pod /metrics (metrics/pod/alb-controller/)"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
