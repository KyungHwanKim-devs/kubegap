- id: albctl.tgb-stale-or-orphan
  name: TargetGroupBinding not applied or its target Service is missing
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    expr: "len(item['tgb_stale']) > 0 or len(item['tgb_service_missing']) > 0"
    warn_expr: "item['traffic_target_groups_without_tgb'] > 0"
  target: "'cluster'"
  evidence: "f\"TargetGroupBindings {item['tgb_count']} (targetType {item['tgb_by_target_type']}), generation lagging {item['tgb_stale']}, Service missing {item['tgb_service_missing']}, hand-made TGBs {len(item['tgb_manual'])}, target groups without a binding (traffic section) {item['traffic_target_groups_without_tgb']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    A TargetGroupBinding says "register this Service's pods into this target group". If observedGeneration lags behind generation the controller could not process that binding, and if the Service is missing the target group is empty and returns 503. Hand-made TGBs (the pattern of exposing a DB through an NLB) leave the target group behind when deleted, unlike an Ingress.
    Measured on a real EKS cluster: all 51 applied, 10 hand-made TGBs (DB NLBs — the same targets as traffic.db-exposed).
  suggest: "If stale, look for that TGB's reconcile error in the controller logs. Delete TGBs whose Service is missing and clean up the target group on the AWS side too."
  verify:
    - "kubectl get targetgroupbindings -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SVC:.spec.serviceRef.name,GEN:.metadata.generation,OBS:.status.observedGeneration"
