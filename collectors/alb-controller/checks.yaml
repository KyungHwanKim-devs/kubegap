- id: albctl.ingress-without-lb
  name: Ingress of class ALB has no load balancer address (provisioning failed)
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    expr: "len(item['ingresses_without_lb']) > 0"
  target: "'cluster'"
  evidence: "f\"ALB Ingresses {item['alb_ingresses']}, with empty status.loadBalancer {item['ingresses_without_lb']}. IngressClass {item['ingress_classes']} (default class {item['ingress_class_default']}), most used annotations {item['ingress_annotations_top']}\""
  severity_default: high
  symptom_linked: true
  why: >
    If an Ingress was created but no ALB appeared, that service is not reachable from outside at all. Causes are missing subnet tags (kubernetes.io/role/elb), a typo in the certificate ARN, security group limits or permissions, and they show up as reconcile errors in the controller logs.
  suggest: "Read the Events in kubectl describe ingress and the controller logs. Subnet tags, ACM certificates and group name conflicts are the common causes."
