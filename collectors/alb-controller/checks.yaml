- id: albctl.reconcile-errors
  name: Controller reconcile errors and requeues accumulating (an Ingress is not applied or is retried repeatedly)
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and item['leader_found'] and (item['reconcile_errors_total'] or 0) >= 100"
    warn_expr: "item['metrics_available'] and item['leader_found'] and (item['reconcile_errors_total'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"reconcile errors since leader start {item['reconcile_errors_total']}, apiserver 429/503 responses {item['rest_client_429_503']}, max workqueue depth {item['workqueue_depth_max']}, Ingresses without an LB address {item['ingresses_without_lb']}, stale TargetGroupBindings {item['tgb_stale']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A reconcile error means the controller failed to make one Ingress, Service or TargetGroupBinding match AWS (permissions, bad annotation, missing certificate, limits). The counter accumulates since the leader process started, so a small number may be a past event — read it together with the log signature alb-controller.reconcile-error (24 hours).
    Measured on a real EKS cluster: 41 errors (ingress controller), 34,713 requeues — close to the pattern of one Ingress with a bad annotation being retried forever (0 errors in the 24-hour logs, so a past event).
  suggest: "Run kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller | grep -i 'reconciler error' to find which Ingress it is, then fix the annotation, certificate or security group."
  verify:
    - "kubectl describe ingress -A | grep -A3 Events | grep -i fail"
