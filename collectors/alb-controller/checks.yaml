- id: albctl.no-dedicated-role
  name: Controller ServiceAccount has no IRSA or Pod Identity role (ELB and EC2 are manipulated through the node role)
  area: security
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    expr: "not item['has_dedicated_role']"
  target: "'cluster'"
  evidence: "f\"ServiceAccount aws-load-balancer-controller: IRSA role {item['irsa_role']}, Pod Identity {item['pod_identity']}\""
  severity_default: high
  symptom_linked: false
  why: >
    The controller needs permission to create and delete ELBs, change security group rules and look up ACM certificates. Without a dedicated role those permissions must live on the node instance role, and on nodes with IMDS hop limit 2 every pod can delete load balancers and open security groups.
    Measured on a real EKS cluster: a dedicated load balancer controller role was present — pass.
  suggest: "Attach a dedicated role with AWSLoadBalancerControllerIAMPolicy via IRSA or Pod Identity and remove ELB permissions from the node role."
  verify:
    - "kubectl get sa -n kube-system aws-load-balancer-controller -o jsonpath='{.metadata.annotations}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.7.2"
          replicas: 2
          ready: 2
          all_same_node: false
          has_pdb: true
          anti_affinity: true
          has_dedicated_role: false
          irsa_role: null
          pod_identity: false
          nodes_total: 7
          webhooks: 6
          webhooks_fail_policy: 6
          webhook_pod_scope_fail: false
          webhook_no_endpoints: []
          webhook_5xx: 0
          ingress_classes:
