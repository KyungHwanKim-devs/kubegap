  evidence: "f\"webhooks {item['webhooks']} (Fail policy {item['webhooks_fail_policy']}), pod creation intercepted with Fail and no selector {item['webhook_pod_scope_fail']}, webhooks without endpoints {item['webhook_no_endpoints']}, webhook 5xx responses {item['webhook_5xx']}\""
  severity_default: high
  symptom_linked: true
  why: >
    mpod.elbv2.k8s.aws is a mutating webhook that injects readiness gates at pod creation. With failurePolicy Fail and no namespaceSelector/objectSelector, the moment all controller pods are gone **every pod creation in the cluster is rejected** (the controller itself cannot start — a deadlock, same conclusion as operators.webhook-self-lock). The default chart scopes it with the `elbv2.k8s.aws/pod-readiness-gate-inject: enabled` namespace selector.
    Measured on a real EKS cluster: the mpod webhook had a namespaceSelector and objectSelector, 2 endpoints, 0 5xx — pass.
  suggest: "Keep the namespaceSelector on the mpod webhook and use a controller PDB so both replicas do not go down at once. Keep a runbook step for switching failurePolicy to Ignore in an emergency."
