- id: albctl.lb-service-intree
  name: LoadBalancer Service created through the in-tree (legacy) path instead of the controller
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['lb_services_intree']) > 0"
  target: "'cluster'"
  evidence: "f\"LoadBalancer Services {item['lb_services']}, created via the in-tree path without aws-load-balancer-type external or loadBalancerClass {item['lb_services_intree']}\""
  severity_default: low
  symptom_linked: false
  why: >
    A LoadBalancer Service without annotations gets a Classic LB from the in-tree AWS provider in kube-controller-manager. It is legacy: no NLB features (IP targets, TLS termination, PROXY protocol) and on the removal path from 1.27+. With the controller present, switch to `service.beta.kubernetes.io/aws-load-balancer-type: external` or `loadBalancerClass: service.k8s.aws/nlb`.
    Measured on a real EKS cluster: the single LB Service (an external kafka listener) was controller-owned — pass.
  suggest: "Set loadBalancerClass service.k8s.aws/nlb on the Service (a new LB is created and the DNS name changes, so plan the cutover)."
  verify:
    - "kubectl get svc -A -o json | jq -r '.items[] | select(.spec.type==\"LoadBalancer\") | \"\\(.metadata.namespace)/\\(.metadata.name) \\(.spec.loadBalancerClass) \\(.metadata.annotations[\"service.beta.kubernetes.io/aws-load-balancer-type\"])\"'"
