# AWS Load Balancer Controller checks. summary.albctl.summary — lib/albctl.py. ALB and target group CloudWatch metrics are covered by the core traffic section (traffic.alb-*).
- id: albctl.controller-availability
  name: AWS Load Balancer Controller replicas, spread and PDB (if the controller dies, Ingress and TargetGroup changes stop)
  area: traffic
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    expr: "(item['ready'] or 0) < (item['replicas'] or 0) or (item['replicas'] or 0) < 2 or item['all_same_node']"
    warn_expr: "not item['has_pdb'] or not item['anti_affinity']"
  target: "'cluster'"
  evidence: "f\"aws-load-balancer-controller v{item['version']}: replicas {item['replicas']} / ready {item['ready']}, all on one node {item['all_same_node']}, PDB {item['has_pdb']}, podAntiAffinity {item['anti_affinity']}, leader pod found {item['leader_found']}\""
  severity_default: high
  symptom_linked: false
  why: >
    Even when the controller stops, the ALBs and target groups it already created keep serving traffic. But targets are no longer registered or deregistered as pods change (RegisterTargets/DeregisterTargets), so after a rolling deploy traffic goes to dead pod IPs or new pods never receive traffic, and new Ingress or certificate changes are not applied.
    Measured on a real EKS cluster: 2/2 replicas on different nodes with PDB and antiAffinity — pass.
  suggest: "Keep replicas 2 + podAntiAffinity + PDB (minAvailable 1). Check that both replicas do not land on the same node during node replacement (Karpenter)."
  verify:
    - "kubectl get deploy -n kube-system aws-load-balancer-controller -o wide ; kubectl get pdb -n kube-system"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.7.2"
          replicas: 2
          ready: 1
          all_same_node: false
          has_pdb: true
          anti_affinity: true
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/AmazonEKSLoadBalancerControllerRole-my-cluster-eks"
          pod_identity: false
          nodes_total: 7
          webhooks: 6
          webhooks_fail_policy: 6
          webhook_pod_scope_fail: false
          webhook_no_endpoints: []
          webhook_5xx: 0
          ingress_classes:
            - "alb"
          ingress_class_default: false
          ingress_class_params: 1
          alb_ingresses: 40
          ingresses_without_lb: []
          ingress_annotations_top:
            group.name: 40
            listen-ports: 40
            scheme: 40
            target-type: 40
            healthcheck-path: 21
            healthy-threshold-count: 12
            success-codes: 12
            unhealthy-threshold-count: 12
          tgb_count: 51
