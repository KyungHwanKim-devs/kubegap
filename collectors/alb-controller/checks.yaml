- id: albctl.metrics-unreadable
  name: Controller metrics (:8080/metrics) could not be read (reconcile and AWS API state not visible)
  area: observability
  type: summary
  each: albctl.summary
  cluster_level: true
  rule:
    warn_expr: "not item['metrics_available'] or not item['leader_found']"
  target: "'cluster'"
  evidence: "f\"controller metrics read {item['metrics_available']}, leader pod identified {item['leader_found']}. Prometheus does not scrape this controller (no ServiceMonitor), so it is read through the pod proxy or curl from inside a node\""
  severity_default: low
  symptom_linked: false
  why: >
    The controller exposes the standard controller-runtime metrics (reconcile, webhook, workqueue) plus AWS API call latency and retries on :8080. kube-prometheus-stack does not scrape it by default. If the pod proxy is blocked by a security group (seen on a real EKS cluster) it is read from inside a node via the pod IP, which also fails when neither SSM nor SSH works.
  suggest: "Enable the ServiceMonitor (serviceMonitor.enabled true) so Prometheus scrapes it and kubegap uses that. Otherwise prepare node access (SSM registration)."
  verify:
    - "kubectl get --raw /api/v1/namespaces/kube-system/pods/<pod>:8080/proxy/metrics | head"
