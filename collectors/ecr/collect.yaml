# ECR collection. Read-only calls throughout (describe/get). The repository list was saved by detection to aws/ecr-repositories.json (eks.ecr_repositories).
# Only image metadata (size, push/pull times, tags, scan summary) is collected; layer and manifest contents are not. Repository policies (get-repository-policy) contain principal ARNs and are not collected.
# kubelet's PullImage metrics (kubelet_runtime_operations_*) are dropped by the default kube-prometheus-stack configuration and were absent on both clusters observed — pull failures are read from events (ErrImagePull, BackOff).
- id: registry
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ecr DescribeRegistry: output DescribeRegistryResponse awscli/botocore/data/ecr/2015-09-21/service-2.json:2087@2.39.3, input DescribeRegistryRequest :2083; fields in references/sources.md (#125)"
  args: [ecr, describe-registry]
  out: aws/ecr-registry.json
  timeout: 60
- id: scanning-configuration
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ecr GetRegistryScanningConfiguration: output GetRegistryScanningConfigurationResponse awscli/botocore/data/ecr/2015-09-21/service-2.json:2617@2.39.3, input GetRegistryScanningConfigurationRequest :2613; fields in references/sources.md (#125)"
  args: [ecr, get-registry-scanning-configuration]
  out: aws/ecr-scanning-configuration.json
  timeout: 60
- id: pull-through-cache
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ecr DescribePullThroughCacheRules: output DescribePullThroughCacheRulesResponse awscli/botocore/data/ecr/2015-09-21/service-2.json:2070@2.39.3, input DescribePullThroughCacheRulesRequest :2049; fields in references/sources.md (#125)"
  args: [ecr, describe-pull-through-cache-rules]
  out: aws/ecr-pull-through-cache-rules.json
  timeout: 60
- id: images
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ecr DescribeImages: output DescribeImagesResponse awscli/botocore/data/ecr/2015-09-21/service-2.json:2036@2.39.3, input DescribeImagesRequest :2006; fields in references/sources.md (#125)"
  for_each: eks.ecr_repositories
  args: [ecr, describe-images, --repository-name, "{item}", --max-items, "1000"]
  out: aws/ecr-images/{item_safe}.json
  timeout: 120
- id: lifecycle-policy
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ecr GetLifecyclePolicy: output GetLifecyclePolicyResponse awscli/botocore/data/ecr/2015-09-21/service-2.json:2575@2.39.3, input GetLifecyclePolicyRequest :2561; fields in references/sources.md (#125)"
  for_each: eks.ecr_repositories
  tolerate_errors: true
  args: [ecr, get-lifecycle-policy, --repository-name, "{item}"]
  out: aws/ecr-lifecycle/{item_safe}.json
  timeout: 60
