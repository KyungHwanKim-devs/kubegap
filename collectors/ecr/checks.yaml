- id: ecr.untagged-images
  name: Untagged images accumulating (no lifecycle untagged rule, or too loose)
  area: cost
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    warn_expr: "(item['untagged'] or 0) >= 100"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"untagged images {item['untagged']}/{item['images']} (excluding {item['attestations']} BuildKit attestation manifests), repositories {item['repositories']}\""
  severity_default: low
  symptom_linked: false
  why: >
    Re-pushing the same tag leaves the previous image behind without a tag (untagged) — nobody can pull it, but it uses space. The provenance/SBOM attestation manifests BuildKit uploads alongside (1-2KB) also appear untagged but have no size, so they are excluded here. Even with a lifecycle "delete untagged after 1 day", the child manifests referenced by a multi-architecture index are not deleted, so a count may remain.
    Measured on a real cluster: 226/783 untagged (mostly per-platform child manifests of multi-arch indexes), 150 attestations.
  suggest: "Confirm the lifecycle untagged rule, and note in the report that multi-arch child manifests are normal. Judge actual space by GiB per repository."
  verify:
    - "aws ecr list-images --repository-name <r> --filter tagStatus=UNTAGGED --query 'length(imageIds)'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
