- id: ecr.pull-failures
  name: Image pull failure events (ErrImagePull, BackOff)
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    expr: "(item['pull_failure_events'] or 0) >= 20"
    warn_expr: "(item['pull_failure_events'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"image pull failure events within the event retention window {item['pull_failure_events']}, targets {item['pull_failure_targets']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    A pull failure is one of four things: registry authentication (ECR token expiring after 12 hours, IRSA permissions), missing tag (CI has not pushed yet), rate limit (Docker Hub) or network (NAT, no VPC endpoint). kubelet's PullImage metrics are dropped by the default kube-prometheus-stack configuration, so only events (1-hour retention) are used — 0 does not mean "none happened".
    Measured on real clusters: 0 on both EKS and the small k3s cluster.
  suggest: "Classify by the message in the Events of kubectl describe pod <pod> (401 Unauthorized, manifest unknown, toomanyrequests, i/o timeout)."
  verify:
    - "kubectl get events -A --field-selector reason=Failed | grep -i pull"
  profiles: [prod]  # ECR is an EKS-only collector (the selftest caught this during clone validation)
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          account: "<account>"
          repositories: 43
          images: 783
          attestations: 150
          untagged: 226
