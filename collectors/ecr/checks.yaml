- id: ecr.dockerhub-dependency
  name: Cluster pulls Docker Hub images directly with no pull-through cache (rate limits, outage propagation)
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    warn_expr: "(item['dockerhub_images'] or 0) >= 5 and len(item['pull_through_cache_rules']) == 0"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"registry distribution of container images {item['images_by_registry']}, docker.io images {item['dockerhub_images']} (e.g. {item['dockerhub_sample'][:4]}), pull-through cache rules {item['pull_through_cache_rules']}, replication rules {item['replication_rules']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Docker Hub limits anonymous pulls to 100 per IP per hour (stricter since 2024-12). When nodes are replaced (Karpenter) or many pods start on one node, the pulls pouring through the same NAT IP get 429 and pods land in ImagePullBackOff — the Docker Hub outages (2020, 2023) caused restart failures of this shape (Datadog 2019). An ECR pull-through cache rule caches docker.io, quay.io and ghcr.io in ECR so pulls stay inside the VPC.
    Measured on a real EKS cluster: docker.io 31, quay.io 23, ghcr.io 9 containers, 0 pull-through rules.
  suggest: "aws ecr create-pull-through-cache-rule --ecr-repository-prefix docker-hub --upstream-registry-url registry-1.docker.io --credential-arn <Docker Hub credentials in Secrets Manager>, then point image references at <acct>.dkr.ecr.<region>.amazonaws.com/docker-hub/<img>. Or use global.imageRegistry in Helm values."
  verify:
    - "aws ecr describe-pull-through-cache-rules"
    - "kubectl get pods -A -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{\"\\n\"}{end}{end}' | grep -vE '^[0-9]+\\.dkr\\.ecr|^public\\.ecr|^registry\\.k8s|^quay|^ghcr' | sort -u"
  profiles: [prod]
  test:
    cases:
