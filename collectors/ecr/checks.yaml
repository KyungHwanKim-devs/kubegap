- id: ecr.tag-mutable-prod
  name: ECR repositories used by prod have mutable tags (a different image can be pushed under the same tag)
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['repos_mutable_prod']) > 0"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"MUTABLE repositories {len(item['repos_mutable'])}/{item['repositories']}, used by prod {len(item['repos_mutable_prod'])}: {item['repos_mutable_prod'][:8]}…, digest-pinned containers {item['digest_pinned']}/{item['images_in_use']}, repositories with a latest tag {item['repos_with_latest_tag']}\""
  severity_default: low
  symptom_linked: false
  why: >
    With IMMUTABLE, a tag once pushed cannot be overwritten with a different image — the "v1.2.3 is different from yesterday" incident (accidental re-push, CI rerun, supply chain attack) is prevented and no node ends up running a different binary. When Argo CD deploys by tag, tag immutability is the precondition for rollback. Digest pinning is stronger but more cumbersome to operate.
    Measured on a real cluster: 42/43 MUTABLE (a single immutable repository), digest-pinned 2/205, no repositories with a latest tag.
  suggest: "aws ecr put-image-tag-mutability --repository-name <r> --image-tag-mutability IMMUTABLE (CI re-pushing the same tag will fail, so put the git sha in the tag). In Terraform, image_tag_mutability."
  verify:
    - "aws ecr describe-repositories --query 'repositories[?imageTagMutability==`MUTABLE`].repositoryName'"
  profiles: [prod]
  test:
    cases:
