# ECR checks. summary.ecr.summary — lib/ecr.py. All EKS only (aws step), except pull-failures, which is event-based and also runs on a small k3s cluster. Repository and registry policies are never read.
- id: ecr.scan-disabled
  name: ECR image vulnerability scanning disabled (no scanOnPush, no registry scan rules)
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    expr: "len(item['repos_scan_off_prod']) > 0 and not item['registry_scan_on_push']"
    warn_expr: "len(item['repos_scan_off']) > 0 and not item['registry_scan_on_push']"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"registry scanning {item['scan_type']} (rules {item['scan_rules']}), repositories with scanOnPush off {len(item['repos_scan_off'])}/{item['repositories']} (used by prod {len(item['repos_scan_off_prod'])}: {item['repos_scan_off_prod'][:6]}…), scanned images {item['images_scanned']}/{item['images']}, CRITICAL+HIGH {item['critical_high_findings']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Without scanning, nobody knows how many known CVEs the images running in prod carry. ECR basic scanning (BASIC, Clair-based) is free and needs a single scanOnPush line, but if it is off on every repository and there is no registry-level rule, the number of scanned images is 0. Enhanced scanning (Inspector) keeps rescanning OS and language packages (paid).
    Measured on a real cluster: 39 of 43 repositories had scanOnPush off (including 25 used by prod), scanned images 0/783.
  suggest: "aws ecr put-registry-scanning-configuration --scan-type ENHANCED --rules '[{\"scanFrequency\":\"SCAN_ON_PUSH\",\"repositoryFilters\":[{\"filter\":\"*\",\"filterType\":\"WILDCARD\"}]}]' or --image-scanning-configuration scanOnPush=true per repository. Results via describe-image-scan-findings."
  verify:
    - "aws ecr get-registry-scanning-configuration"
    - "aws ecr describe-repositories --query 'repositories[?imageScanningConfiguration.scanOnPush==`false`].repositoryName'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          account: "<account>"
          repositories: 43
          images: 783
          attestations: 150
          untagged: 226
          total_gib: 398.5
          monthly_usd: 42.8
          largest:
            - "('ecr-app-a-embedding-eks-prod', 96.59)"
            - "('ecr-app-a-backend-eks-prod', 75.34)"
            - "('ecr-app-h-frontend-eks-prod', 31.03)"
            - "('ecr-app-d-ai-prod', 29.75)"
            - "('ecr-app-d-ai-dev', 28.88)"
          scan_type: "BASIC"
          scan_rules: 0
          registry_scan_on_push: false
          repos_scan_off:
            - "ecr-app-h-frontend-eks-prod"
            - "ecr-app-d-admin-dev"
            - "ecr-app-f-eks-prod"
            - "bitnami/kafka"
            - "ecr-app-e-backend-eks-prod"
