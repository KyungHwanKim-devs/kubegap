- id: ecr.stale-storage
  name: Images accumulating in repositories not pulled for more than 90 days (storage that only costs money)
  area: cost
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    expr: "(item['stale_pull_gib'] or 0) >= 100"
    warn_expr: "(item['stale_pull_gib'] or 0) >= 10 or (item['unused_gib'] or 0) >= 10"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"repositories with no pull for more than {item['stale_pull_days']} days {item['repos_stale_pull'][:8]} (name, GiB, days since last pull) (total {item['stale_pull_gib']}GiB), repositories not used by the cluster {item['repos_unused_by_cluster']} (total {item['unused_gib']}GiB), empty repositories {item['repos_empty']}, largest repository {item['largest']}\""
  severity_default: low
  symptom_linked: false
  why: >
    If lastRecordedPullTime is 90 days ago, no node pulled any image from that repository for three months — space that nothing would miss if deleted. Repositories the cluster does not use (absent from pod images) are the same. But other clusters or CI may pull them, so the report should say "confirm, then delete".
    Measured on a real cluster: an abandoned app repository of 8.8GiB (885 days), a prod repository of 29.8GiB with no push for months. The largest repositories were two ML image repositories of 96.6GiB and 75.3GiB (lifecycle keeping 30 × large ML images).
  suggest: "Confirm with the owner and delete repositories with no pull history, or cut their lifecycle to 'latest 5 only'. For large repositories such as ML images, reduce the retained count from 30 to 10."
  verify:
    - "aws ecr describe-images --repository-name <r> --query 'max_by(imageDetails, &lastRecordedPullTime).lastRecordedPullTime'"
  profiles: [prod]
  test:
    cases:
