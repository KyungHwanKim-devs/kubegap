- id: ecr.no-replication
  name: No ECR replication rules (a region outage takes the images with it)
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    warn_expr: "(item['replication_rules'] or 0) == 0 and len(item['repos_mutable_prod']) + len(item['repos_scan_off_prod']) > 0"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"replication rules {item['replication_rules']}, repositories used by prod {len(set(item['repos_mutable_prod']) | set(item['repos_scan_off_prod']))}, total {item['total_gib']}GiB\""
  severity_default: low
  symptom_linked: false
  why: >
    ECR is a regional service. If ECR in the cluster's region is down, every node replacement and restart fails to pull (a fresh node with no image cache cannot start anything), and in a regional recovery (DR) the manifests alone deploy nothing without the images. Cross-region replication is automatic with one rule and only doubles storage cost. For a single-region, single-cluster organization, "we know" is enough — low.
    Measured on a real cluster: 0 replication rules.
  suggest: "If a DR region is defined, replicate only the prod repositories with aws ecr put-replication-configuration (repositoryFilters). Otherwise write 'single-region dependency' in the report."
  verify:
    - "aws ecr describe-registry"
