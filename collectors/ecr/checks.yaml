- id: ecr.no-lifecycle-policy
  name: ECR repositories without a lifecycle policy (images accumulate forever)
  area: cost
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: ecr.summary
  cluster_level: true
  rule:
    expr: "len(item['repos_no_lifecycle']) > 0 and (item['repos_no_lifecycle_gib'] or 0) >= 20"
    warn_expr: "len(item['repos_no_lifecycle']) > 0"
  target: "'ecr/registry/' + str(item['account'])"
  evidence: "f\"repositories without a lifecycle policy {item['repos_no_lifecycle']} (total {item['repos_no_lifecycle_gib']}GiB), overall {item['repositories']} repositories, {item['images']} images, {item['total_gib']}GiB ≈ {item['monthly_usd']} USD/month, untagged images {item['untagged']} (excluding {item['attestations']} attestations)\""
  severity_default: low
  symptom_linked: false
  why: >
    ECR keeps everything forever unless deleted and bills per GB-month. A repository without a lifecycle policy ("delete untagged after 1 day, keep only the latest 30 tagged") grows with every CI run. A single repository above 100GiB alone costs 10 USD a month.
    Measured on a real cluster: 39/43 had a policy (untagged 1 day, tagged 30). The 4 without: one abandoned app repository (8.8GiB, no push or pull for over a year), two mirrored base images and one database image. Total 398.5GiB ≈ 42.8 USD/month.
  suggest: "Attach the same policy to those repositories (aws ecr put-lifecycle-policy). With a Terraform module, make lifecycle_policy the default."
  verify:
    - "for r in $(aws ecr describe-repositories --query 'repositories[].repositoryName' --output text); do aws ecr get-lifecycle-policy --repository-name $r >/dev/null 2>&1 || echo no-policy $r; done"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          account: "<account>"
          repositories: 43
          images: 783
          attestations: 150
          untagged: 226
          total_gib: 398.5
          monthly_usd: 42.8
          largest:
            - "('ecr-app-a-embedding-eks-prod', 96.59)"
            - "('ecr-app-a-backend-eks-prod', 75.34)"
            - "('ecr-app-h-frontend-eks-prod', 31.03)"
            - "('ecr-app-d-ai-prod', 29.75)"
            - "('ecr-app-d-ai-dev', 28.88)"
