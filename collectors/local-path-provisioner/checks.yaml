# local-path-provisioner checks. summary.local_path — lib/localpath.py (directory usage comes from the local-path section of the k3s-platform node script). The first two were moved from k3s-platform with their ids unchanged.
- id: storage.local-path-over-capacity
  name: local-path volume usage exceeds the PVC capacity (capacity is not enforced)
  area: storage
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.over_capacity
  profiles: [lab]
  rule:
    expr: "True"
  target: "item['namespace'] + '/' + item['pvc']"
  evidence: "f\"node {item['node']} uses {item['used_mb']}MB / capacity {item['capacity_mb']}MB ({item['used_ratio']}x). workloads {item['workloads']}\""
  severity_default: high
  symptom_linked: false
  why: local-path-provisioner only creates a directory; it does not enforce capacity. A PVC that says 5Gi can write until the node disk is full. Every plan built on the stated capacity (backup retention, disk sizing) is wrong, and when the node disk fills up every pod on that node is evicted.
  suggest: Reduce the data or raise the PVC capacity to match reality (the capacity is documentation only). Read together with node disk usage (node.disk-usage).
  verify:
    - "sudo du -sm /var/lib/rancher/k3s/storage/*"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          namespace: "logging"
          pvc: "es-data"
          node: "node-b"
          capacity_mb: 20480
          used_mb: 105000
          used_ratio: 5.1
          workloads:
            - "statefulset/elasticsearch"
      - expect: "none"
- id: storage.local-path-node-pinned
  name: Workloads pinned to a node by a local-path PV (cannot start if that node dies)
  area: storage
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.summary
  cluster_level: true
  profiles: [lab]
  rule:
    warn_expr: "(item.get('pv_count') or 0) > 0"
  target: "'cluster'"
  evidence: "f\"{item.get('pv_count')} local-path PVs, by node {item.get('by_node')}, node disk used {item.get('node_total_mb')}MB. top: {[(p['namespace'], p['pvc'], p['node'], p['used_mb'], p['workloads'][:1]) for p in (item.get('pinned') or [])[:8]]}\""
  severity_default: low
  symptom_linked: false
  why: A local-path volume is a node directory and cannot move. If that node dies, the StatefulSet or DB using it cannot start on another node. This is the small k3s cluster's "N+1" list. The longer the list, the larger the blast radius of a single node.
  suggest: Move important DBs to external or replicated storage (Longhorn, NFS, external Postgres), spread backup PVCs across other nodes, and record this list in the recovery runbook.
  verify:
    - "kubectl get pv -o custom-columns=NAME:.metadata.name,CLAIM:.spec.claimRef.name,NODE:.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]"
  test:
    profile: "k3s"
    cases:
      - expect: "warn"
        item:
          pv_count: 26
          by_node:
            node-b: 19
            node-a: 7
          node_total_mb: 150000
          pinned:
            - namespace: "a"
              pvc: "b"
              node: "node-b"
              used_mb: 10
              workloads:
                - "x"
          over_capacity: []
      - expect: "pass"
        item:
          pv_count: 0
          by_node: {}
          node_total_mb: 0
          pinned: []
          over_capacity: []
- id: storage.local-path-fs-near-full
  name: Node filesystem hosting local-path volumes has little free space (volumes have no capacity limit)
  area: storage
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and ((item['fs_min_avail_ratio'] if item['fs_min_avail_ratio'] is not None else 1) < 0.1 or (item['fs_min_days_to_full'] is not None and item['fs_min_days_to_full'] < 14))"
    warn_expr: "item['metrics_available'] and ((item['fs_min_avail_ratio'] if item['fs_min_avail_ratio'] is not None else 1) < 0.25 or (item['fs_min_days_to_full'] is not None and item['fs_min_days_to_full'] < 60) or item['over_capacity_count'] > 0)"
  target: "'cluster'"
  evidence: "f\"root filesystem per node {item['fs']} (avail_ratio = free ratio, volumes_gib = sum of local-path directories, days_to_full = day it fills at the 7-day trend), over-capacity PVCs {item['over_capacity_count']}, PVs {item['pv_count']} by node {item['by_node']}\""
  severity_default: high
  symptom_linked: false
  why: >
    A local-path volume is a node directory, so the PVC capacity is a label only and the kernel does not enforce it — Elasticsearch writing 100GiB into a 20GiB PVC (measured on a small k3s cluster node) raises no error; instead the node root filesystem fills up. When root is full, kubelet evicts pods for DiskPressure and k3s SQLite (state.db) writes fail, stopping the whole cluster — what would be a single full volume on EBS becomes a node failure.
    Measured on a 2-node k3s k3s: node A 21.9% free (not trending down), node B 50.1% free (+0.34GiB/day -> 670 days). Two over-capacity PVCs (Elasticsearch 5.0x, a backup PVC 1.3x) -> warn.
  suggest: "On the tight node, clean up the largest directories first (du -sm /var/lib/rancher/k3s/storage/*) or shorten backup PVC retention. To actually enforce capacity, use Longhorn or NFS instead of local-path, or mount a separate disk via nodePathMap to keep volumes off the OS disk."
  verify:
    - "ssh <node> df -h / && sudo du -sm /var/lib/rancher/k3s/storage/* | sort -rn | head"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          provisioner_ready: 1
          provisioner_replicas: 1
          provisioner_version: "0.0.31"
          node_path_map:
            DEFAULT_PATH_FOR_NON_LISTED_NODES:
              - "/var/lib/rancher/k3s/storage"
          storage_classes:
            - "local-path"
            - "local-path-node-b"
          default_class: "local-path"
          reclaim_policies:
            local-path: "Delete"
            local-path-node-b: "Delete"
          pv_count: 26
          by_node:
            node-a: 7
            node-b: 19
          node_total_mb:
            node-a: 7163
            node-b: 139342
          pinned:
            - pv: "pvc-db50eb33-8393-45cd-93b3-042e019e1186"
              namespace: "logging"
              pvc: "data-elasticsearch-0"
              node: "node-b"
              storage_class: "local-path-node-b"
              capacity_mb: 20480
              used_mb: 102588
              used_ratio: 5.01
              workloads:
                - "logging/elasticsearch-0"
              phase: "Bound"
            - pv: "pvc-1a2c9674-3fcb-4205-85f2-3f2d08fd1c92"
