- id: storage.local-path-provisioner-unhealthy
  name: local-path-provisioner is not ready or its configuration is empty
  area: storage
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.summary
  cluster_level: true
  rule:
    expr: "(item['provisioner_ready'] or 0) < 1 and (item['provisioner_replicas'] or 0) >= 1"
    warn_expr: "not item['node_path_map'] or item['default_class'] is None"
  target: "'cluster'"
  evidence: "f\"provisioner ready {item['provisioner_ready']}/{item['provisioner_replicas']} (version {item['provisioner_version']}), nodePathMap {item['node_path_map']}, StorageClasses {item['storage_classes']} (default {item['default_class']})\""
  severity_default: medium
  symptom_linked: true
  why: >
    If the provisioner is down, new PVCs stay Pending (existing volumes are directories and keep working); if there is no default StorageClass, PVCs without storageClassName stay Pending forever. An empty nodePathMap falls back to the DEFAULT path (/opt/local-path-provisioner; on k3s /var/lib/rancher/k3s/storage).
    Measured on a k3s k3s: 1/1 ready, v0.0.31, default class local-path -> pass.
  suggest: "kubectl -n kube-system logs deploy/local-path-provisioner. The default class is set by the storageclass.kubernetes.io/is-default-class annotation."
