- id: storage.local-path-orphan-dirs
  name: local-path directories without a PV remain (leftover data from deleted PVCs)
  area: storage
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['orphan_dirs']) > 0 or len(item['released']) > 0"
  target: "'cluster'"
  evidence: "f\"directories without a PV {[(o['node'], o['dir'], o['mb']) for o in item['orphan_dirs']][:8]} (total {item['orphan_mb']}MB), Released/Failed PVs {item['released']}, directories per node {item['node_dirs']} vs PVs {item['by_node']}\""
  severity_default: low
  symptom_linked: false
  why: >
    When a PVC is deleted, the provisioner's helper pod (teardown) removes the directory. If the helper pod failed (node down, image pull failure) or reclaimPolicy is Retain, the directory stays, consumes space, and keeps old DB data in plaintext. A Released PV, whose claim is gone while the PV remains, has the same root cause.
    Measured on a 2-node k3s k3s: 26 node directories = 26 PVs, 0 orphans, 0 Released -> pass (du reads only the top 30 entries, so with more than 30 directories some are not visible).
  suggest: "Confirm from the directory name (pvc-<uid>_<ns>_<pvc>) that the PVC really is gone, then delete it. Released PVs: kubectl delete pv."
  verify:
    - "ssh <node> sudo ls /var/lib/rancher/k3s/storage | sed 's/_.*//' | sort > /tmp/dirs; kubectl get pv -o name | sed 's#.*/##' | sort > /tmp/pvs; comm -23 /tmp/dirs /tmp/pvs"
