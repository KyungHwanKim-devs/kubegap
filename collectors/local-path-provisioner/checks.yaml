            local-path-node-b: "Delete"
          pv_count: 26
          by_node:
            node-a: 7
            node-b: 19
          node_total_mb:
            node-a: 7163
            node-b: 139342
          pinned:
            - pv: "pvc-db50eb33-8393-45cd-93b3-042e019e1186"
              namespace: "logging"
              pvc: "data-elasticsearch-0"
              node: "node-b"
              storage_class: "local-path-node-b"
              capacity_mb: 20480
              used_mb: 102588
              used_ratio: 5.01
              workloads:
                - "logging/elasticsearch-0"
