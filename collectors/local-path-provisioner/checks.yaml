- id: storage.local-path-prod-delete-reclaim
  name: prod local-path PVs have reclaimPolicy Delete (deleting the PVC deletes the data immediately, no snapshot)
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: local_path.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_pvs_delete_reclaim']) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item['prod_pvs_delete_reclaim'])} of {item['prod_pvs']} prod PVs are Delete {item['prod_pvs_delete_reclaim'][:10]}, StorageClass reclaim {item['reclaim_policies']}, default class {item['default_class']}\""
  severity_default: low
  symptom_linked: false
  why: >
    EBS with Delete still has snapshots (DLM) and asynchronous volume deletion, which leaves room to recover; local-path Delete is an rm of the directory — the moment a StatefulSet is deleted by mistake or Argo CD prune removes the PVC, the DB data is gone (the same failure path as the Argo CD check argocd.prune-manages-namespace-or-crd). Read together with the resilience backup check (backup_locality) as "is the backup on another node or outside the cluster?".
    Measured on a 2-node k3s k3s: all 19 prod PVs were Delete (both StorageClasses default to Delete). The backup PVCs were local-path on the same node as well.
  suggest: "For DB and backup PVCs, create a second StorageClass with reclaimPolicy Retain (local-path-retain), or patch existing PVs with kubectl patch pv <pv> -p '{\"spec\":{\"persistentVolumeReclaimPolicy\":\"Retain\"}}'. Keep backups on another node or outside the cluster (S3, NAS)."
  verify:
    - "kubectl get pv -o custom-columns=PV:.metadata.name,NS:.spec.claimRef.namespace,PVC:.spec.claimRef.name,RECLAIM:.spec.persistentVolumeReclaimPolicy,NODE:.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]"
  profiles: [lab]
  test:
    cases:
      - expect: "warn"
