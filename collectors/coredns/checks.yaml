- id: coredns.metrics-unavailable
  name: CoreDNS metrics missing from Prometheus (queries, cache and latency not visible)
  area: observability
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    warn_expr: "not item['metrics_available']"
  target: "'cluster'"
  evidence: "f\"no coredns_* series. replicas {item['replicas']}, version {item['version']}. Even with the prometheus plugin in the Corefile, nothing is scraped without a ServiceMonitor\""
  severity_default: low
  symptom_linked: false
  why: >
    CoreDNS exposes metrics on :9153, but if Prometheus does not scrape them the NXDOMAIN ratio, cache, latency and upstream errors are all invisible. kube-prometheus-stack creates a coredns ServiceMonitor by default (present on both clusters observed).
  suggest: "Set coreDns.enabled true in the kube-prometheus-stack values, or attach a ServiceMonitor to the kube-dns Service in kube-system (port metrics 9153)."
  verify:
    - "count({__name__=~\"coredns_.*\"})"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
