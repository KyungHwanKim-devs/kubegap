- id: coredns.panic-or-reload-failed
  name: CoreDNS plugin panic or Corefile reload failure
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and ((item['panics_1h'] or 0) > 0 or (item['reload_failed_1h'] or 0) > 0)"
  target: "'cluster'"
  evidence: "f\"panics in 1h {item['panics_1h']}, reload failures {item['reload_failed_1h']}, restarts total {item['restarts_total']}\""
