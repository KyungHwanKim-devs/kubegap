- id: coredns.aaaa-noise
  name: AAAA queries equal A queries in a cluster without IPv6
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    warn_expr: "item['metrics_available'] and not item['cluster_ipv6'] and (item['qps_total'] or 0) >= 5 and (item['aaaa_ratio'] or 0) >= 0.4"
  target: "'cluster'"
  evidence: "f\"AAAA share of request types {item['aaaa_ratio']}, cluster IPv6 {item['cluster_ipv6']}, queries per second {item['qps_total']}. The glibc resolver always asks A and AAAA as a pair\""
  severity_default: low
  symptom_linked: false
  why: >
    The glibc resolver asks A and AAAA at the same time in getaddrinfo. In a cluster without IPv6 every AAAA query has an empty answer, so half of all DNS queries are wasted. Multiplied with search path noise (ndots), the query count reaches 8× the real name count. Measured on real clusters: AAAA 50% on both EKS and the small k3s cluster.
    Not a risk, only a cost and latency factor, so it never goes beyond warn.
  suggest: "Answer AAAA immediately with an empty NOERROR via the CoreDNS template plugin (template IN AAAA . { rcode NOERROR }), or do IPv4-only lookups on the app side (single-request-reopen option). NodeLocal DNSCache also mitigates it."
  verify:
    - "sum by (type) (increase(coredns_dns_requests_total[1h]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
