- id: coredns.cache-hit-low
  name: CoreDNS cache hit ratio is low
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['qps_total'] or 0) >= 5 and (item['cache_hit_ratio'] or 1) < 0.3"
    warn_expr: "item['metrics_available'] and (item['qps_total'] or 0) >= 5 and (item['cache_hit_ratio'] or 1) < 0.5"
  target: "'cluster'"
  evidence: "f\"cache hit ratio {item['cache_hit_ratio']} (1h), cache TTL {item['cache_ttl']}s, queries per second {item['qps_total']}, NXDOMAIN share of queries forwarded upstream {item['forward_nxdomain_ratio']}\""
  severity_default: low
  symptom_linked: false
  why: >
    A low hit ratio means every query hits the kubernetes plugin or the upstream. Common causes are a short cache TTL (default cap 30s) or names that differ every time (search path noise also lands in the cache as NXDOMAIN). Measured on real clusters: EKS 0.90, small k3s cluster 0.85 — both normal.
  suggest: "Raise the success and denial TTLs in the Corefile cache block (e.g. cache 300 { success 9984 300 / denial 9984 60 }) and reduce ndots noise (coredns.nxdomain-ratio-high)."
  verify:
    - "sum(rate(coredns_cache_hits_total[1h])) / (sum(rate(coredns_cache_hits_total[1h])) + sum(rate(coredns_cache_misses_total[1h])))"
