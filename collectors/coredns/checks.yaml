# CoreDNS checks. summary.coredns.summary — lib/coredns.py. SERVFAIL ratio and p99 are covered by core traffic.coredns-servfail and coredns-latency.
- id: coredns.nxdomain-ratio-high
  name: More than half of DNS responses are NXDOMAIN (ndots:5 search path noise)
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['qps_total'] or 0) >= 5 and (item['nxdomain_ratio'] or 0) >= 0.6"
    warn_expr: "item['metrics_available'] and (item['qps_total'] or 0) >= 5 and (item['nxdomain_ratio'] or 0) >= 0.4"
  target: "'cluster'"
  evidence: "f\"NXDOMAIN share of responses in 1h {item['nxdomain_ratio']}, queries per second {item['qps_total']}, NXDOMAIN share of queries forwarded upstream {item['forward_nxdomain_ratio']} (upstreams {item['upstreams']}), pods with default ndots (5) {item['pods_default_ndots']}, autopath {item['autopath']}, cache hit ratio {item['cache_hit_ratio']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Pod resolv.conf has ndots:5. A name with fewer than 5 dots (api.example.com) is first queried with the search domains appended (<ns>.svc.cluster.local → svc.cluster.local → cluster.local → VPC domain), so one real name drags 3-4 NXDOMAINs along. CoreDNS answers the cluster.local suffixes directly, but the VPC domain suffix goes all the way upstream — on a real small k3s cluster 83% of upstream queries were NXDOMAIN.
    The query count becomes a multiple of the real name count, and upstream calls (Route 53 Resolver, external resolvers) grow, causing latency, cost and throttling. Measured on real clusters: EKS NXDOMAIN 50% (60 queries per second), small k3s cluster 70%.
  suggest: "(1) Write external names in apps as FQDNs (trailing dot) or set dnsConfig options ndots:2. (2) Enable the autopath plugin in CoreDNS (+ kubernetes plugin pods verified) so the search path is handled server-side in one step. (3) Put a cache on each node with NodeLocal DNSCache."
  verify:
    - "sum by (rcode) (increase(coredns_dns_responses_total[1h]))"
    - "kubectl exec -n <ns> <pod> -- cat /etc/resolv.conf  (the user checks ndots and search)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.12.3"
          replicas: 1
          nodes_total: 2
          nodes_with_pods: 1
          all_same_node: false
          single_replica: true
          has_pdb: false
          spread_declared: true
          autoscaler: null
          node_local_dns: false
          metrics_available: true
          qps_total: 31.2
          nxdomain_ratio: 0.697
          servfail_ratio: 0.0
          aaaa_ratio: 0.487
          cache_hit_ratio: 0.8528
          p50_s: 0.0001
          p99_s: 0.0855
          forward_nxdomain_ratio: 0.832
          forward_servfail_1h: 0
          forward_servfail_ratio: 0.0
          forward_healthcheck_failures_1h: 0.0
          max_concurrent_rejects_1h: 0.0
          upstreams:
            - "1.1.1.1:53"
            - "8.8.8.8:53"
          panics_1h: 0.0
          reload_failed_1h: 0.0
          rest_client_errors_total_1h: 0
          qps_skew: null
          qps_by_pod:
            coredns-59d4d457d-qjng8: 31.21
          cache_ttl: 30
          autopath: false
          cluster_ipv6: false
          pods_default_ndots: 149
          restarts_total: 1
          memory_limit: "170Mi"
          pods_by_node:
            node-b: 1
          pdb: []
          forward_to:
            - "/etc/resolv.conf"
      - expect: "warn"
        item:
