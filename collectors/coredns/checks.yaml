- id: coredns.node-local-dns-absent
  name: No NodeLocal DNSCache (with many nodes or high DNS p99)
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    warn_expr: "not item['node_local_dns'] and item['nodes_total'] >= 5 and ((item['p99_s'] or 0) >= 0.05 or (item['qps_total'] or 0) >= 200)"
  target: "'cluster'"
  evidence: "f\"no NodeLocal DNSCache, nodes {item['nodes_total']}, queries per second {item['qps_total']}, p99 {item['p99_s']}s, p50 {item['p50_s']}s\""
  severity_default: low
  symptom_linked: false
  why: >
    NodeLocal DNSCache runs a cache daemon on every node and talks to the upstream (CoreDNS) over TCP, removing the UDP conntrack race (5-second delay) and CoreDNS hotspots. With few nodes and a low p99 it is unnecessary. Measured on real clusters: EKS p99 1.1ms (not needed), small k3s cluster p99 86ms with 2 nodes (below the node threshold).
  suggest: "With 5 or more nodes and p99 over 50ms or more than 200 queries per second, deploy the node-local-dns DaemonSet (point kubelet --cluster-dns at the link-local IP)."
  verify:
    - "kubectl get ds -n kube-system node-local-dns"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
