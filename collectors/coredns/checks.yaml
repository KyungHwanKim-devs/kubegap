- id: coredns.forward-upstream-errors
  name: Upstream resolver errors (SERVFAIL, health check failures, concurrency rejections)
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and ((item['forward_servfail_ratio'] or 0) >= 0.2 or (item['max_concurrent_rejects_1h'] or 0) > 0)"
    warn_expr: "item['metrics_available'] and ((item['forward_servfail_ratio'] or 0) >= 0.05 or (item['forward_healthcheck_failures_1h'] or 0) > 0 or (item['forward_servfail_1h'] or 0) > 0)"
  target: "'cluster'"
  evidence: "f\"upstreams {item['upstreams']}: SERVFAIL in 1h {item['forward_servfail_1h']} ({item['forward_servfail_ratio']}), health check failures {item['forward_healthcheck_failures_1h']}, max_concurrent rejections {item['max_concurrent_rejects_1h']}, overall SERVFAIL ratio {item['servfail_ratio']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    If the forward target (the VPC resolver on EKS, public resolvers such as 1.1.1.1 or 8.8.8.8 on a small k3s cluster) fails, external name resolution returns SERVFAIL and apps see "connection failed". Health check failures are intermittent disconnects; max_concurrent rejections are CoreDNS itself being overloaded. Core traffic.coredns-servfail looks at the overall ratio; this check isolates the upstream side.
  suggest: "Use two or more upstreams (policy sequential/random). With the VPC resolver, check the Route 53 Resolver query limit (1,024 per second per ENI). With external resolvers, pick trustworthy ones."
  verify:
    - "sum by (to, rcode) (increase(coredns_proxy_request_duration_seconds_count{proxy_name=\"forward\"}[1h]))"
