- id: coredns.no-autoscaler
  name: Many nodes but a fixed CoreDNS replica count (no cluster-proportional-autoscaler)
  area: scaling
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['nodes_total'] >= 16 and not item['autoscaler']"
    warn_expr: "item['nodes_total'] >= 8 and not item['autoscaler'] and (item['replicas'] or 0) < item['nodes_total'] / 8"
  target: "'cluster'"
  evidence: "f\"nodes {item['nodes_total']}, CoreDNS replicas {item['replicas']}, autoscaler {item['autoscaler']}, queries per second {item['qps_total']}, p99 {item['p99_s']}s\""
  severity_default: medium
  symptom_linked: false
  why: >
    The default 2 replicas become a bottleneck as nodes grow. The convention is cluster-proportional-autoscaler (proportional to node or core count, e.g. "1 per 16 nodes or 1 per 256 cores") or an HPA. The EKS add-on has an autoScaling option.
    Under 8 nodes, 2 replicas are enough and this is not evaluated. Measured on real clusters: EKS 7 nodes / 2 replicas, small k3s cluster 2 nodes / 1 replica (the availability check's job).
  suggest: "EKS: autoScaling in the coredns add-on configurationValues (enabled true, minReplicas 2, maxReplicas 10). Elsewhere: deploy cluster-proportional-autoscaler."
  verify:
    - "kubectl get deploy -n kube-system | grep -i dns ; aws eks describe-addon --addon-name coredns --query addon.configurationValues"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.11.3"
          replicas: 2
          nodes_total: 20
