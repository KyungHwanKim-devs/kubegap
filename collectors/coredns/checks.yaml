- id: coredns.pod-imbalance
  name: Large query skew between CoreDNS pods
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    warn_expr: "item['metrics_available'] and (item['qps_skew'] or 1) >= 3 and (item['qps_total'] or 0) >= 10"
  target: "'cluster'"
  evidence: "f\"queries per second by pod {item['qps_by_pod']}, max/min {item['qps_skew']}×\""
  severity_default: low
  symptom_linked: false
  why: >
    The kube-dns Service is UDP, so conntrack pins the client → pod mapping for a long time. If the queries of a few large nodes land on one pod, only that pod saturates and p99 spikes. Measured on a real EKS cluster: 1.01 — even.
