- id: coredns.availability
  name: CoreDNS has 1 replica or all replicas on one node (one node down = cluster-wide DNS outage)
  area: traffic
  type: summary
  each: coredns.summary
  cluster_level: true
  rule:
    expr: "item['nodes_total'] >= 2 and (item['single_replica'] or item['all_same_node'])"
    warn_expr: "item['nodes_total'] >= 2 and (not item['has_pdb'] or not item['spread_declared'])"
  target: "'cluster'"
  evidence: "f\"replicas {item['replicas']}, nodes with pods {item['nodes_with_pods']} of {item['nodes_total']} ({item['pods_by_node']}), PDB {item['pdb']}, spread declared (antiAffinity/topologySpread) {item['spread_declared']}, restarts total {item['restarts_total']}\""
  severity_default: high
  symptom_linked: true
  why: >
    When CoreDNS stops, service names stop resolving and every app fails at once — the user symptom is "everything is slow, everything errors". With 1 replica, DNS is gone for seconds to tens of seconds whenever that pod's node dies or the pod restarts or redeploys. Two replicas on the same node give no protection.
    Measured on real clusters: the small k3s cluster had 1 replica and no PDB — had the other node been the one powered off, DNS would have been down cluster-wide. EKS had 2 replicas on different nodes with a PDB.
  suggest: "replicas 2 or more + podAntiAffinity (hostname) or topologySpread + PDB (minAvailable 1). On k3s, override the coredns Deployment with HelmChartConfig/kustomize."
  verify:
    - "kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide ; kubectl get pdb -n kube-system"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.12.3"
          replicas: 1
          nodes_total: 2
