# CoreDNS log signatures. The first edition lived in signatures/catalog.yaml and was moved into this collector. Field descriptions are in the header of catalog.yaml.
# Every phrase below was read in the CoreDNS source at v1.11.3 (EKS add-on v1.11.3-eksbuild.1), v1.12.3 (k3s v1.33.5+k3s1 manifests/coredns.yaml) and v1.15.0 (newest release);
# `source:` names the logging call at each version and references/sources.md records what each signature relies on (#129).
# All four hold for the default text log format only: CoreDNS v1.15.0 added -log-format json (coremain/run.go:33@v1.15.0), which moves the plugin name into a "plugin" field (plugin/pkg/log/json.go:105@v1.15.0), so "plugin/<name>: " is no longer in the line.
- id: coredns.servfail
  name: CoreDNS SERVFAIL from a plugin-chain error (or in the query log when the log plugin is on)
  component: coredns
  area: traffic
  severity: medium
  sources: ["logs/pods/coredns/*.log"]
  # `plugin/errors: 2 ` is written only when the plugin chain returned an error with rcode 2 (plugin/errors/errors.go:84-97@v1.11.3). Timeouts and unreachable
  # upstreams are the same event seen by coredns.upstream-timeout, so they are excluded here and one outage is one finding. A SERVFAIL that an upstream resolver
  # answered (forward writes it and returns 0, nil: plugin/forward/forward.go:198-199@v1.11.3) or that the kubernetes plugin returns before its cache synced
  # (plugin/kubernetes/handler.go:71 -> plugin/backend_lookup.go:493-501@v1.11.3, returns RcodeSuccess, nil) never reaches the errors line; only the log
  # plugin's query log shows those, and coredns.summary.query_log says whether it is on.
  pattern: ' SERVFAIL |plugin/errors: 2 (?!.*(?:timeout|unreachable))'
  meaning: CoreDNS answered SERVFAIL because a plugin returned an error (every upstream down, "no healthy proxies", refused or broken forward). Apps see "no such host". Upstream timeouts and unreachable upstreams count under coredns.upstream-timeout instead. SERVFAILs answered by the upstream resolver itself, or by the kubernetes plugin before its cache synced, are not in this line; without the log plugin (coredns.summary.query_log false) they are not observable in the logs.
  cause: Upstream (VPC resolver, external DNS) down or refusing, forward configuration, conntrack drops.
  verify: "kubectl logs -n kube-system -l k8s-app=kube-dns --since=1h | grep -E ' SERVFAIL |plugin/errors: 2 ' | grep -vcE 'timeout|unreachable'"
  warn_at: 20
  fail_at: 500
  source:
    - "coredns/coredns plugin/errors/errors.go:97@v1.11.3"
    - "coredns/coredns plugin/errors/errors.go:97@v1.12.3"
    - "coredns/coredns plugin/errors/errors.go:118@v1.15.0"
    - "coredns/coredns plugin/forward/forward.go:202@v1.11.3"
    - "coredns/coredns plugin/forward/forward.go:223@v1.12.3"
    - "coredns/coredns plugin/forward/forward.go:294@v1.15.0"
    - "coredns/coredns plugin/pkg/replacer/replacer.go:67@v1.11.3"
    - "coredns/coredns plugin/pkg/replacer/replacer.go:67@v1.12.3"
    - "coredns/coredns plugin/pkg/replacer/replacer.go:67@v1.15.0"
    - "coredns/coredns plugin/errors/errors.go:84@v1.11.3"
    - "coredns/coredns plugin/forward/forward.go:198@v1.11.3"
    - "coredns/coredns plugin/kubernetes/handler.go:71@v1.11.3"
    - "coredns/coredns plugin/backend_lookup.go:493@v1.11.3"
- id: coredns.upstream-timeout
  name: CoreDNS upstream i/o timeout
  component: coredns
  area: traffic
  severity: medium
  sources: ["logs/pods/coredns/*.log"]
  pattern: 'i/o timeout|read udp .* timeout|plugin/errors.*(timeout|unreachable)'
  meaning: CoreDNS received no answer from the upstream DNS. External domain resolution slows down or fails.
  cause: Node conntrack drops, VPC resolver limit (1024 pps per ENI), network policy.
  verify: "kubectl logs -n kube-system -l k8s-app=kube-dns --since=1h | grep -c 'i/o timeout'"
  warn_at: 10
  fail_at: 200
  source:
    - "coredns/coredns plugin/errors/errors.go:97@v1.11.3"
    - "coredns/coredns plugin/errors/errors.go:97@v1.12.3"
    - "coredns/coredns plugin/errors/errors.go:118@v1.15.0"
    - "coredns/coredns plugin/forward/forward.go:202@v1.11.3"
    - "coredns/coredns plugin/forward/forward.go:223@v1.12.3"
    - "coredns/coredns plugin/forward/forward.go:294@v1.15.0"
    - "golang/go src/internal/poll/fd.go:60@go1.21.0"
    - "golang/go src/internal/poll/fd.go:60@go1.26.0"
    - "golang/go src/net/net.go:469@go1.21.0"
    - "golang/go src/net/net.go:501@go1.26.0"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1458@go1.21.0"
    - "golang/go src/syscall/zerrors_linux_amd64.go:1456@go1.26.0"
- id: coredns.loop
  name: CoreDNS forwarding loop
  component: coredns
  area: traffic
  severity: critical
  sources: ["logs/pods/coredns/*.log"]
  pattern: 'plugin/loop: Loop'
  meaning: CoreDNS sends queries to itself. The pod CrashLoops and cluster DNS stops.
  cause: Node /etc/resolv.conf points at 127.0.0.53 (systemd-resolved). Common with k3s on Ubuntu.
  verify: "kubectl logs -n kube-system -l k8s-app=kube-dns | grep -i loop"
  source:
    - "coredns/coredns plugin/loop/loop.go:53@v1.11.3"
    - "coredns/coredns plugin/loop/loop.go:53@v1.12.3"
    - "coredns/coredns plugin/loop/loop.go:52@v1.15.0"
    - "coredns/coredns plugin/pkg/log/plugin.go:15@v1.11.3"
    - "coredns/coredns plugin/pkg/log/plugin.go:15@v1.12.3"
    - "coredns/coredns plugin/pkg/log/plugin.go:16@v1.15.0"
- id: coredns.reload-failed
  name: CoreDNS Corefile reload failed
  component: coredns
  area: traffic
  severity: medium
  sources: ["logs/pods/coredns/*.log"]
  pattern: 'Corefile changed|reload.*(failed|error)|Error during parsing'
  meaning: The ConfigMap change was not applied and CoreDNS runs on the old configuration.
  cause: Corefile syntax error.
  verify: "kubectl get cm -n kube-system coredns -o yaml"
  warn_at: 1
  fail_at: 1
  source:
    - "coredns/coredns plugin/reload/reload.go:97@v1.11.3"
    - "coredns/coredns plugin/reload/reload.go:111@v1.11.3"
    - "coredns/coredns plugin/reload/reload.go:97@v1.12.3"
    - "coredns/coredns plugin/reload/reload.go:111@v1.12.3"
    - "coredns/coredns plugin/reload/reload.go:116@v1.15.0"
    - "coredns/coredns plugin/reload/reload.go:134@v1.15.0"
    - "coredns/caddy caddyfile/dispenser.go:229@v1.1.1"
    - "coredns/caddy caddyfile/dispenser.go:229@8de985351a98"
    - "coredns/caddy caddyfile/dispenser.go:238@v1.1.4"
