- id: prometheus.cardinality
  name: Many active series, or one metric dominates cardinality
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and (item['head_series'] or 0) >= 2000000"
    warn_expr: "item['present'] and ((item['head_series'] or 0) >= 1000000 or (item['top_metric_share'] or 0) >= 0.25)"
  target: "item['target']"
  evidence: "f\"active series {item['head_series']} (label pairs {item['label_pairs']}), top metrics {[(x['name'], x['series']) for x in (item['top_metrics'] or [])[:5]]}, share of the top metric {item['top_metric_share']}, histogram bucket series among the top 10 {item['top10_bucket_series']}, labels with many values {item['top_labels_by_values']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The series count determines memory, compaction time and query latency. Past 1 million a single Prometheus struggles (8GiB+ memory), and when one metric holds 1/4 of the series, dropping that one metric (usually apiserver/etcd histogram buckets, or an app metric with IDs or paths in labels) alone cuts it substantially.
    Measured on a real EKS cluster: 157k series; a k3s: 140k. In both, all top 10 were apiserver/etcd histogram buckets (61k = 39% on EKS) — control-plane metrics scraped by the kube-prometheus-stack defaults, so dropping the buckets with metricRelabelings removes about 1/3.
  suggest: "Drop unused _bucket series with metricRelabelings on the ServiceMonitors (kube-apiserver, kube-etcd). If an app metric is at the top, remove IDs and URLs from its labels. Check the top metrics each time via /api/v1/status/tsdb."
  verify:
    - "kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090 & curl -s localhost:9090/api/v1/status/tsdb | jq '.data.seriesCountByMetricName[:10]'"
  profiles: [prod, lab]
  test:
    cases:
