- id: prometheus.scrape-slow-or-limited
  name: Scrapes are slow, or whole scrapes are dropped for exceeding sampleLimit
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and len(item['sample_limit_exceeded_1h'] or {}) > 0"
    warn_expr: "item['present'] and len(item['slow_scrape_jobs'] or []) > 0"
  target: "item['target']"
  evidence: "f\"scrape interval {round(item['scrape_interval_s'] or 0)}s, jobs exceeding half the interval {item['slow_scrape_jobs']}, slowest {item['scrape_top']}, jobs exceeding sampleLimit in the last hour {item['sample_limit_exceeded_1h']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A scrape that exceeds sampleLimit drops all metrics of that target (not a partial store) — alerts for that job go silent. A scrape that takes more than half the interval means the target is overloaded or the response is too large, and it will soon hit the timeout (10s by default).
    Measured on a real EKS cluster: slowest jobs kafka-metrics 0.5s and apiserver 0.43s (30s interval) → pass; a k3s: apiserver 1.6s, kubelet 1.4s → pass. No sampleLimit exceeded.
  suggest: "For slow targets, check the response size (curl -w %{size_download}) and trim with metricRelabelings or raise scrapeTimeout. For sampleLimit exceeded, raise sampleLimit on that ServiceMonitor or reduce the metrics."
  verify:
    - "curl -s localhost:9090/api/v1/query --data-urlencode 'query=topk(10, scrape_duration_seconds)'"
