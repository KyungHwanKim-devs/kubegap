- id: prometheus.version-old
  name: Prometheus version is old (non-LTS 2.x)
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    warn_expr: "item['present'] and item['version'] is not None and (item['major'] or 0) < 3 and int(str(item['version']).split('.')[1]) < 53"
  target: "item['target']"
  evidence: "f\"Prometheus {item['version']} — 2.53 is the last 2.x LTS (2024-07), 3.0 was released 2024-11\""
  severity_default: low
  symptom_linked: false
  why: >
    Prometheus only patches the LTS (2.53) and the latest 3.x. Intermediate versions such as 2.49 (2024-01) get no security or bug fixes. 3.x makes UTF-8 metric names, OTLP ingestion and native histograms the default (the upgrade notes list a few flag changes).
    Measured on a real EKS cluster: 2.49.1 → warn; a k3s: 3.7.3 → pass.
  suggest: "Upgrade the kube-prometheus-stack chart (Prometheus 3.x needs chart 66+). If staying on 2.x, at least 2.53 LTS."
  verify:
    - "curl -s localhost:9090/api/v1/status/buildinfo | jq .data.version"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
