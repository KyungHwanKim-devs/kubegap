# Prometheus self-health checks. summary.stackhealth.prometheus — lib/stackhealth.py. Observability coverage (rules, alerts, targets) is handled by core observability.*. The baseline checks stay in core (evaluated as absence even without Prometheus).
- id: prometheus.memory-pressure
  name: Prometheus memory is close to its limit or has an OOMKilled history
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and ((item['rss_vs_limit'] or 0) >= 0.9)"
    warn_expr: "item['present'] and ((item['rss_vs_limit'] or 0) >= 0.75 or item['oomkilled_last'] or len(item['monitoring_oomkilled'] or []) > 0)"
  target: "item['target']"
  evidence: "f\"working set / limit {item['rss_vs_limit']} (limit {item['memory_limit']}), active series {item['head_series']}, Prometheus container last terminated OOMKilled {item['oomkilled_last']} ({item['oomkilled_at']}), restarts {item['restarts']}, OOMKilled containers in the monitoring namespace {item['monitoring_oomkilled']}, restarts over 7 days {item['monitoring_restarts_7d']}\""
  severity_default: high
  symptom_linked: true
  why: >
    Prometheus keeps every active (head) series in memory and briefly uses more during the 2-hour compaction. Near the limit it gets OOMKilled during compaction or a large query (a 30-day Grafana panel) — alert evaluation stops at that moment, and after the restart there is a metrics gap for several minutes while the WAL replays. If Prometheus is unhealthy, every other check runs on wrong data.
    Measured on a real EKS cluster: working set 0.57 of a 1.5GiB limit (RSS 1.34GiB), last termination reason OOMKilled with one restart; Loki was also OOMKilled because of a 24-hour query from this skill (since fixed to a 1-hour window). A 2-node k3s k3s: 0.59, no OOM.
  suggest: "Raise the limit (head series × about 8KB + compaction headroom) or reduce cardinality (prometheus.cardinality). Precompute long-range Grafana panels with recording rules."
  verify:
    - "kubectl -n monitoring top pod -l app.kubernetes.io/name=prometheus --containers"
    - "kubectl -n monitoring get pod -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[*].status.containerStatuses[?(@.name==\"prometheus\")].lastState}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.49.1"
          major: 2
          start_time: "2026-10-06T12:32:07.180790214Z"
          reload_success: true
          last_config_time: "2026-10-23T04:45:17Z"
          corruption_count: 0
