- id: prometheus.rule-evaluation-lag
  name: Rule evaluation exceeds its interval or skips iterations (alerts are late or missing)
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and ((item['rule_iterations_missed_1d'] or 0) > 0 or (item['rule_eval_ratio_max'] or 0) >= 0.8)"
    warn_expr: "item['present'] and (item['rule_eval_ratio_max'] or 0) >= 0.5"
  target: "item['target']"
  evidence: "f\"top evaluation duration / interval {item['rule_eval_ratio_top']}, skipped evaluations over 24 hours {item['rule_iterations_missed_1d']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    Rule groups are evaluated in order every interval (usually 30s). When one group approaches the interval, the next evaluation is delayed; when it exceeds it, an evaluation is skipped (iterations_missed) — an alert with for: 5m has its pending state reset when an evaluation is missed and may never fire. The heavy group is usually the apiserver burnrate (histogram sums).
    Measured on a real EKS cluster: max 0.13; a 2-node k3s: kube-apiserver-burnrate 0.33 (CPU is tight with two nodes). Skipped: 0.
  suggest: "For heavy groups, raise the interval (1m) or split the query into recording rules. If the CPU limit is tight (500m), raise it."
  verify:
    - "curl -s localhost:9090/api/v1/rules | jq '[.data.groups[] | {name, interval, lastEvaluation, evaluationTime}] | sort_by(-.evaluationTime)[:5]'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
