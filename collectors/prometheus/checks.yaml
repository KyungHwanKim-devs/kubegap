- id: prometheus.alert-delivery-errors
  name: Prometheus → Alertmanager notification failures, or config reload failure
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and ((item['notifications_dropped_1d'] or 0) > 0 or item['reload_success'] is False)"
    warn_expr: "item['present'] and len(item['notifications_errors_1d'] or {}) > 0"
  target: "item['target']"
  evidence: "f\"notifications dropped over 24 hours {item['notifications_dropped_1d']}, send errors per Alertmanager address {item['notifications_errors_1d']}, last config reload successful {item['reload_success']} (config time {item['last_config_time']})\""
  severity_default: high
  symptom_linked: false
  why: >
    If a firing rule cannot reach Alertmanager, nobody finds out. dropped means the send queue overflowed (Alertmanager was down for a long time); errors means failures to a specific Alertmanager address (an Alertmanager restart, the network, or one of the configured addresses is dead). A reload failure means a new PrometheusRule has a syntax error and the old rules keep running.
    Measured on a real EKS cluster and a k3s: both 0, reload successful.
  suggest: "Check the Alertmanager pod status and the 'Error sending alert' lines in the Prometheus log. For reload failures, check the rule validation errors in the prometheus-operator log."
  verify:
    - "curl -s localhost:9090/api/v1/alertmanagers | jq '.data'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
