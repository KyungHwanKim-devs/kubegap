- id: prometheus.single-replica
  name: Single Prometheus replica (single point of failure, gaps during upgrades)
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    warn_expr: "item['present'] and (item['replicas'] or 0) <= 1"
  target: "item['target']"
  evidence: "f\"Prometheus StatefulSet replicas {item['replicas']} (ready {item['ready']}), restarts {item['restarts']}, started {item['start_time']}\""
  severity_default: low
  symptom_linked: false
  why: >
    While a single Prometheus restarts (OOM, node replacement, upgrade), scraping and alert evaluation stop for several minutes. With replicas 2, kube-prometheus-stack has both instances scrape the same targets and Alertmanager deduplicates (availability without Thanos). This matters more on EKS clusters with frequent node replacement (Karpenter consolidation).
    Measured on a real EKS cluster and a k3s: both 1. On a 2-node small k3s cluster it matters little — low.
  suggest: "prometheus.prometheusSpec.replicas: 2 + podAntiAffinity. For long-term retention, a Thanos sidecar."
  verify:
    - "kubectl -n monitoring get prometheus -o jsonpath='{.items[*].spec.replicas}'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
