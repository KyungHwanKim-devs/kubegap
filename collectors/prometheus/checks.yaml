- id: prometheus.storage-risk
  name: Prometheus storage risk (PVC saturation, emptyDir, failed compactions, WAL corruption)
  area: observability
  type: summary
  each: stackhealth.prometheus
  cluster_level: true
  rule:
    expr: "item['present'] and ((item['pvc_used_ratio'] or 0) >= 0.85 or (item['compactions_failed_7d'] or 0) > 0 or (item['wal_corruptions'] or 0) > 0)"
    warn_expr: "item['present'] and ((item['pvc_used_ratio'] or 0) >= 0.7 or item['retention_shortfall'] or item['storage'] == 'emptyDir' or (item['corruption_count'] or 0) > 0)"
  target: "item['target']"
  evidence: "f\"storage {item['storage']} (PVC {item['pvc_size']}), PVC usage {item['pvc_used_ratio']}, TSDB {round((item['tsdb_bytes'] or 0)/1024**3, 1)}GiB, retention {item['retention_time']} (size cap {item['retention_size']}), actual oldest sample {item['oldest_sample_days']} days, failed compactions over 7 days {item['compactions_failed_7d']}, WAL corruptions {item['wal_corruptions']}, corruptions at startup {item['corruption_count']}\""
  severity_default: high
  symptom_linked: false
  why: >
    With retention.size at 0B Prometheus only trims by time, so as series grow the disk fills first — once the disk is full, compaction fails and eventually writes stop. With emptyDir, the moment the pod moves to another node or the node is replaced, the whole retention window of metrics is gone (measured on a k3s: 30 days, 23.7GiB on emptyDir). If the actual oldest sample is much younger than the retention period, data has already been cut.
    Measured on a real EKS cluster: a 20GiB PVC at 43% (8.3GiB, 15-day retention, no size cap) → pass; the small k3s cluster on emptyDir → warn (the same fact as core observability.stack-storage-emptydir).
  suggest: "Set retention.size to 80-85% of the PVC (--storage.tsdb.retention.size=16GB). Replace emptyDir with a PVC (StorageClass). For failed compactions and WAL corruption, read the compaction failed / wal corruption lines in the Prometheus log."
  verify:
    - "kubectl -n monitoring exec prometheus-kube-prometheus-stack-prometheus-0 -c prometheus -- df -h /prometheus"
    - "kubectl -n monitoring get pvc"
  profiles: [prod, lab]
  test:
