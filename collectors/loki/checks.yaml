- id: loki.version-old
  name: Loki major version is end of life (2.x)
  area: observability
  type: summary
  each: stackhealth.loki
  cluster_level: true
  rule:
    warn_expr: "item['present'] and item['major'] is not None and item['major'] < 3"
  target: "item['target']"
  evidence: "f\"Loki {item['version']}, storage {item['storage']}, retention applied {item['retention_applied']}(compactor {item['compactor_running']})\""
  severity_default: low
  symptom_linked: false
  why: >
    Since Loki 3.0 (2024-04) the 2.x line receives no patches. 2.6 (2022-07) uses the boltdb-shipper index and single-binary defaults, so it lacks the 3.x TSDB index, structured metadata and bloom filters, and the loki-stack chart itself is no longer maintained (moved to the grafana/loki chart).
    Measured on a real EKS cluster: 2.6.1 (loki-stack chart) -> warn. The small k3s cluster has no Loki.
  suggest: "Migrate to the grafana/loki chart (SingleBinary mode) and set up 3.x, the tsdb index and retention in one go. Keep the existing boltdb-shipper data as a separate period in schema_config."
  verify:
    - "curl -s localhost:3100/loki/api/v1/status/buildinfo"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.6.1"
          major: 2
          metrics_available: true
          storage: "emptyDir"
          memory_limit: "512Mi"
          oomkilled_last: true
          oomkilled_at: "2026-10-25T00:15:41Z"
          restarts: 1
          requests_total: 273468
          requests_5xx: 1
          requests_5xx_by_route:
            loki_api_v1_series: 1
          discarded_by_reason: {}
          discarded_total: 0
          wal_disk_full_failures: 0
          panics: 0
          log_error_messages: 11
          rss_mib: 222
          rss_vs_limit: 0.434
          memory_streams: 52
          retention_applied: false
          compactor_running: 1.0
          lines_received: 10511098
          bytes_received: 865278447
          ready_endpoint: true
          replicas: 1
          ready: 1
          target: "monitoring/statefulset/loki-stack"
      - expect: "pass"
        item:
          present: true
          version: "3.3.2"
          major: 3
          metrics_available: true
          storage: "emptyDir"
          memory_limit: "512Mi"
          oomkilled_last: true
          oomkilled_at: "2026-10-25T00:15:41Z"
          restarts: 1
          requests_total: 273468
          requests_5xx: 1
          requests_5xx_by_route:
            loki_api_v1_series: 1
          discarded_by_reason: {}
          discarded_total: 0
          wal_disk_full_failures: 0
          panics: 0
          log_error_messages: 11
          rss_mib: 222
          rss_vs_limit: 0.434
          memory_streams: 52
          retention_applied: false
          compactor_running: 1.0
          lines_received: 10511098
          bytes_received: 865278447
          ready_endpoint: true
          replicas: 1
          ready: 1
          target: "monitoring/statefulset/loki-stack"
- id: loki.metrics-unreadable
  name: Loki self metrics (/metrics) could not be read
  area: observability
  type: summary
  each: stackhealth.loki
  cluster_level: true
  rule:
    warn_expr: "item['present'] and not item['metrics_available']"
  target: "item['target']"
  evidence: "f\"loki/metrics.txt missing - Loki {item['version']}, ready {item['ready_endpoint']}\""
  severity_default: low
  symptom_linked: false
  why: >
    Without Loki /metrics we cannot see 5xx, rejections, WAL or memory. Usually the port-forward failed (pod not ready).
  suggest: "Check the loki pod status and collect again. Enable a ServiceMonitor so Prometheus scrapes Loki."
  verify:
    - "kubectl -n monitoring port-forward svc/loki-stack 3100 & curl -s localhost:3100/metrics | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.6.1"
          major: 2
          metrics_available: false
          storage: "emptyDir"
          memory_limit: "512Mi"
          oomkilled_last: true
          oomkilled_at: "2026-10-25T00:15:41Z"
          restarts: 1
          requests_total: 273468
          requests_5xx: 1
          requests_5xx_by_route:
            loki_api_v1_series: 1
          discarded_by_reason: {}
          discarded_total: 0
          wal_disk_full_failures: 0
          panics: 0
          log_error_messages: 11
          rss_mib: 222
          rss_vs_limit: 0.434
          memory_streams: 52
          retention_applied: false
          compactor_running: 1.0
          lines_received: 10511098
          bytes_received: 865278447
          ready_endpoint: true
          replicas: 1
          ready: 1
          target: "monitoring/statefulset/loki-stack"
      - expect: "pass"
        item:
