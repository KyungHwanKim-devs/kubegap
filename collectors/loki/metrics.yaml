# Loki and promtail metrics (when Prometheus scrapes them). Output metrics/<id>.json. Read by summary.logs.agents.
- id: promtail_dropped_1h
  why: Log lines promtail dropped in 1h (retries exhausted, rate limited). Anything above 0 is a permanent gap in the logs
  query: sum(increase(promtail_dropped_entries_total[1h]))
  source:
    - "promtail_dropped_entries_total: grafana/loki clients/pkg/promtail/client/client.go:82@v2.6.1, :93@v2.9.2, :93@v3.5.12, :93@v3.7.9 (label host :84@v2.6.1; labels host, tenant, reason :95@v2.9.2, :95@v3.5.12, :95@v3.7.9; promtail is end of life since 2026-03-02 docs/sources/send-data/promtail/_index.md:12@v3.7.9)"
- id: promtail_targets_active
  why: Files being tailed per promtail instance (node). A node at 0 is not shipping its logs
  query: sum by (instance) (promtail_targets_active_total)
  source:
    - "promtail_targets_active_total: grafana/loki clients/pkg/promtail/targets/file/metrics.go:56@v2.6.1, :56@v2.9.2, :56@v3.5.12, :56@v3.7.9 (gauge without labels, one per promtail process: the file targets being tailed)"
    - "label instance on promtail series: prometheus/prometheus scrape/target.go:508-509@v2.49.1, :520-521@v3.7.3, :700-701@v3.15.1 (Prometheus sets instance to the target address when the target has no instance label: the pod IP and port of each promtail, so a sum by instance is per node)"
- id: promtail_request_errors_1h
  why: Non-2xx responses (429, 5xx) from promtail → Loki pushes
  query: sum by (status_code) (increase(promtail_request_duration_seconds_count{status_code!~"2.."}[1h]))
  source:
    - "promtail_request_duration_seconds_count: grafana/loki clients/pkg/promtail/client/client.go:87@v2.6.1, :108@v2.9.2, :108@v3.5.12, :108@v3.7.9 (the _count of the push histogram, labels status_code, host :89@v2.6.1, :110@v2.9.2, :110@v3.5.12, :110@v3.7.9)"
- id: loki_discarded_1h
  why: Samples Loki rejected in 1h by reason (rate_limited, per_stream_rate_limit, line_too_long, too_far_behind, stream_limit)
  query: sum by (reason) (increase(loki_discarded_samples_total[1h])) > 0
  source:
    - "loki_discarded_samples_total: grafana/loki pkg/validation/validate.go:103@v2.6.1, :114@v2.9.2, :119@v3.0.0, :131@v3.7.9 (namespace loki; labels reason, tenant :106@v2.6.1, :117@v2.9.2, :122@v3.0.0, and retention_hours, policy, format too :134@v3.7.9; a counter vector, so a reason has a series only after its first rejection)"
- id: loki_5xx_1h
  why: 5xx Loki requests. Query or ingest failures
  query: sum by (route) (increase(loki_request_duration_seconds_count{status_code=~"5.."}[1h])) > 0
  source:
    - "loki_request_duration_seconds_count: weaveworks/common server/server.go:258-262@e3b70df0f08b (grafana/loki go.mod:95@v2.6.1), :321-328@334485600903 (go.mod:97@v2.9.2), grafana/dskit server/metrics.go:41-48@ea101a3b86eb (go.mod:53@v3.0.0), :57-64@8d1c6d34bb5a (go.mod:55@v3.7.9) (the _count of the server's request histogram, labels method, route, status_code, ws, under the namespace loki grafana/loki pkg/loki/loki.go:91@v2.6.1, :113@v2.9.2, :121@v3.0.0, :145@v3.7.9)"
