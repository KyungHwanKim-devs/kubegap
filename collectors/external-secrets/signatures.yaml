- id: external-secrets.update-failed
  name: External Secrets cannot update the Secret
  component: external-secrets
  area: security
  severity: medium
  sources: ["logs/pods/external-secrets/*.log"]
  # `could not update Secret` is logged only up to v0.10.0 (v2.x spells it `could not update secret` in the condition only); `error patching` and `could not create Secret`
  # are printed by nothing (v0.9.x says `unable to patch status`); `Operation cannot be fulfilled` is apimachinery's conflict text, inside the Reconciler error field when the
  # Secret update conflicts (status conflicts are requeued at V(1) in v2.x).
  pattern: 'could not update Secret|unable to patch status|Operation cannot be fulfilled'
  meaning: The value was fetched but cannot be written to the cluster Secret. From 0.11.0 the operator logs nothing of its own for this stage; the apiserver's error text reaches controller-runtime's Reconciler error line (counted by external-secrets.provider-error, which takes every reconcile failure), and only a write conflict is told apart there by apimachinery's `Operation cannot be fulfilled`. The operator's own `could not update Secret` and `unable to patch status` lines exist up to 0.10.0 only.
  cause: Another controller manages the same Secret (ownership conflict), RBAC.
  verify: "kubectl describe externalsecret -n <ns> <name>"
  warn_at: 1
  fail_at: 50
  source:
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:329@v0.17.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:495@v0.23.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:497@v0.25.2"
