# External Secrets Operator prints controller-runtime zap JSON (`"level":"error"`, epoch `ts`) at every version. `markAsFailed` logged `could not get secret data from
# provider` / `could not update Secret` up to v0.10.0 (pkg/controllers/externalsecret/externalsecret_controller.go:357@v0.10.0); from v0.11.0 (:577) it only sets the
# condition and the event, and the only log line is controller-runtime's `"msg":"Reconciler error"` with the provider or apiserver error in `"error"`.
- id: external-secrets.provider-error
  name: External Secrets cannot fetch a value from the secret store
  component: external-secrets
  area: security
  severity: high
  sources: ["logs/pods/external-secrets/*.log"]
  # `SecretSyncedError` is a condition reason, never logged. `AccessDenied`, `ExpiredToken`, `ResourceNotFoundException`, `AccessDeniedException` are AWS codes that only
  # reach the `"error"` field of the Reconciler error line (which matches anyway); `Unable to assume role` and `unable to get session` exist nowhere; `could not fetch`
  # names a missing auth Secret and is also inside that field.
  pattern: '"msg":"Reconciler error"(?!.*Operation cannot be fulfilled).*"controller":"externalsecret"|"controller":"externalsecret"(?!.*Operation cannot be fulfilled).*"msg":"Reconciler error"|could not get secret data from provider|unable to create session|Secret does not exist'
  meaning: The ExternalSecret has SecretSynced=False. New pods use the old Secret, or there is no Secret at all and they fail to start. The line is controller-runtime's Reconciler error for the externalsecret controller (every version; the provider error is in its "error" field), plus the operator's own `could not get secret data from provider` line that only versions up to 0.10.0 print. Both signatures of this collector count the Reconciler error line; this one adds the AWS session and missing-secret texts.
  cause: IRSA role permissions, secret renamed or deleted, region mismatch, expired token.
  verify: "kubectl get externalsecrets -A | grep -v SecretSynced"
  source:
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:329@v0.17.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:495@v0.23.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:497@v0.25.2"
    - "kubernetes-sigs/controller-runtime pkg/builder/controller.go:339@v0.17.1"
    - "kubernetes-sigs/controller-runtime pkg/builder/controller.go:387@v0.23.1"
    - "kubernetes-sigs/controller-runtime pkg/builder/controller.go:387@v0.25.2"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:64,209,210,333,632@v0.9.13"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:357@v0.10.0"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:577@v0.11.0"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:84,401,402,802,1271@v2.1.0"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:86,417,418,800,1424@v2.14.0"
    - "external-secrets/external-secrets pkg/provider/aws/provider.go:46,166@v0.9.13"
