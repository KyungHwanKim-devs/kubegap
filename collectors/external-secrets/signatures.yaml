    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:87,378,379,602,603,802@v2.1.0"
    - "external-secrets/external-secrets pkg/controllers/externalsecret/externalsecret_controller.go:89,394,395,582,583,800@v2.14.0"
    - "kubernetes/apimachinery pkg/api/errors/errors.go:241@v0.29.1"
