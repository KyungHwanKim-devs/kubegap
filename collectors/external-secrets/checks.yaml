- id: eso.controller-single-replica
  name: External Secrets controller and webhook at 1 replica with a webhook Fail policy
  area: resilience
  type: summary
  each: esoctl.summary
  cluster_level: true
  rule:
    expr: "(item['controller_ready'] or 0) < (item['controller_replicas'] or 1) or (item['webhook_ready'] or 0) < (item['webhook_replicas'] or 1)"
    warn_expr: "len(item['webhook_fail_policy']) > 0 and (item['webhook_replicas'] or 1) < 2"
  target: "'cluster'"
  evidence: "f\"controller {item['controller_ready']}/{item['controller_replicas']}, webhook {item['webhook_ready']}/{item['webhook_replicas']} (Fail policy {item['webhook_fail_policy']}), cert-controller {item['cert_controller_ready']}/{item['cert_controller_replicas']}, --concurrent {item['concurrent']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If the controller dies, Secrets already created remain (no app impact). But with a webhook at Fail policy and 1 replica, no ExternalSecret or SecretStore can be created or changed while the webhook pod is down — Argo CD syncs stall on those resources. cert-controller renews the webhook TLS, so if it is dead the whole webhook fails after the certificate expires.
    Measured on real clusters: 1 replica everywhere on both clusters, webhook Fail policy → warn.
  suggest: "webhook.replicaCount 2 or failurePolicy Ignore. One controller is enough (leader election)."
  verify:
    - "kubectl get deploy -n external-secrets ; kubectl get validatingwebhookconfiguration externalsecret-validate -o jsonpath='{.webhooks[*].failurePolicy}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.9.13"
          controller_replicas: 1
          controller_ready: 0
          webhook_replicas: 1
          webhook_ready: 1
          cert_controller_ready: 1
          cert_controller_replicas: 1
          concurrent: "1"
          irsa_role: "arn:aws:iam::<account>:role/ExternalSecretsRole-my-cluster-eks"
          stores: 1
          stores_not_ready: []
