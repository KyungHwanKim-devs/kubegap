- id: eso.store-static-credentials
  name: SecretStore authenticates with static cloud credentials (an access key in a Secret)
  area: security
  type: summary
  each: esoctl.summary
  cluster_level: true
  rule:
    expr: "len(item['stores_static_key']) > 0 and item['externalsecrets_prod'] > 0"
    warn_expr: "len(item['stores_static_key']) > 0"
  target: "'cluster'"
  evidence: "f\"stores with static key auth {item['stores_static_key']} (all auth methods {item['stores_auth']}), providers {item['providers']}, ExternalSecrets {item['externalsecrets']} (prod {item['externalsecrets_prod']})\""
  severity_default: medium
  symptom_linked: false
  why: >
    auth.secretRef on a (Cluster)SecretStore keeps a long-lived access key in a cluster Secret. If the key leaks, every secret in the store is exposed, and rotation is manual. EKS uses short-lived credentials via IRSA/Pod Identity (jwt) — on a real EKS cluster the ClusterSecretStore used jwt auth (pass). A small k3s cluster outside AWS may have no alternative to a static key, but then narrow that key's IAM policy to secretsmanager:GetSecretValue + specific ARNs and set a rotation schedule.
    Measured on a real k3s: the ClusterSecretStore authenticated with an access key from a Secret, 33 prod ExternalSecrets → fail.
  suggest: "EKS: IRSA/Pod Identity. Outside the cluster (small k3s cluster): minimize the IAM user policy to GetSecretValue + a resource ARN prefix with 90-day rotation, or consider OIDC federation (IAM Roles Anywhere, GitHub-style OIDC)."
  verify:
    - "kubectl get clustersecretstore -o jsonpath='{.items[*].spec.provider.aws.auth}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.9.13"
          controller_replicas: 1
          controller_ready: 1
          webhook_replicas: 1
          webhook_ready: 1
          cert_controller_ready: 1
          cert_controller_replicas: 1
          concurrent: "1"
          irsa_role: "arn:aws:iam::<account>:role/ExternalSecretsRole-my-cluster-eks"
          stores: 1
          stores_not_ready: []
          stores_static_key:
            - "ClusterSecretStore/aws-secret-store"
