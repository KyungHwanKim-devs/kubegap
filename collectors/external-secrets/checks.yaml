          deletion_policy_delete: []
          orphan_creation: []
          pushsecrets: 0
          webhook_fail_policy:
            - "validate.externalsecret.external-secrets.io"
            - "validate.secretstore.external-secrets.io"
            - "validate.clustersecretstore.external-secrets.io"
