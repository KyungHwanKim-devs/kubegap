# External Secrets Operator checks. summary.esoctl.summary — lib/esoctl.py. The ExternalSecret Ready False list is covered by core security.externalsecret-not-ready. Secret values are never read anywhere.
- id: eso.provider-api-errors
  name: Secret store (provider) API call failures accumulating (an ExternalSecret fails every cycle)
  area: security
  type: summary
  each: esoctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['api_error_ratio'] or 0) >= 0.05 and (item['api_errors'] or 0) >= 100"
    warn_expr: "item['metrics_available'] and (item['api_errors'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"provider API calls since controller start: success {item['api_success']} / errors {item['api_errors']} (ratio {item['api_error_ratio']}), sync failures {item['sync_calls_error']}/{item['sync_calls_total']}, reconcile errors {item['reconcile_errors_total']}, ExternalSecrets not Ready {item['not_ready']} (oldest refresh {item['not_ready_oldest_refresh_h']} hours ago)\""
  severity_default: medium
  symptom_linked: false
  why: >
    If the secret an ExternalSecret points to was deleted from the store or its permissions changed, the controller fails again every refreshInterval (default 1 hour) — API call cost and log/event noise accumulate, and that Secret is frozen at the last successful value.
    Measured on a real EKS cluster: 1,566 failures / 18,078 successes (7.97%), all from a single ExternalSecret in a database namespace that had failed every hour for 10 months (the same incident as 1,552 UpdateFailed events in an earlier report).
  suggest: "Follow the message of the ExternalSecret that is not Ready (ResourceNotFound, AccessDenied): restore the secret in the store, or delete the ExternalSecret if it is unused. Group with security.externalsecret-not-ready as one item."
  verify:
    - "kubectl get externalsecret -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[0].status,REASON:.status.conditions[0].reason"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.9.13"
          controller_replicas: 1
          controller_ready: 1
          webhook_replicas: 1
          webhook_ready: 1
          cert_controller_ready: 1
          cert_controller_replicas: 1
          concurrent: "1"
          irsa_role: "arn:aws:iam::<account>:role/ExternalSecretsRole-my-cluster-eks"
          stores: 1
          stores_not_ready: []
          stores_static_key: []
          stores_auth:
            ClusterSecretStore/aws-secrets-manager: "irsa/jwt(ServiceAccount)"
          providers:
            - "aws"
          externalsecrets: 47
          externalsecrets_prod: 27
          not_ready:
            - "database/externalsecret/mysql-app-c-secret"
          not_ready_prod: []
          stale: []
          stale_detail: []
          refresh_intervals:
            1h: 47
          deletion_policy_delete: []
          orphan_creation: []
          pushsecrets: 0
          webhook_fail_policy:
            - "validate.externalsecret.external-secrets.io"
            - "validate.secretstore.external-secrets.io"
            - "validate.clustersecretstore.external-secrets.io"
          webhooks: 3
          metrics_available: true
          api_errors: 1566
          api_success: 18078
          api_error_ratio: 0.0797
          reconcile_errors_total: 1566
          sync_calls_error: 1566
          sync_calls_total: 41311
          not_ready_oldest_refresh_h: 7495.4
      - expect: "warn"
