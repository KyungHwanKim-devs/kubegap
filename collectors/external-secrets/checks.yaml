- id: eso.externalsecret-stale
  name: ExternalSecret Ready but not refreshed for more than 3× its refreshInterval
  area: security
  type: summary
  each: esoctl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['stale']) > 0"
  target: "'cluster'"
  evidence: "f\"refresh delays {item['stale_detail']}, refreshInterval distribution {item['refresh_intervals']}, --concurrent {item['concurrent']}\""
  severity_default: low
  symptom_linked: false
  why: >
    If refreshTime is several intervals old while Ready, the controller is not getting to that item (too few workers with --concurrent=1, provider limits, leader change). Rotated secrets reach the cluster late. Measured on real clusters: 0 on both.
  suggest: "Raise --concurrent (default 1), and with many items lengthen refreshInterval to reduce calls."
  verify:
    - "kubectl get externalsecret -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,INTERVAL:.spec.refreshInterval,REFRESH:.status.refreshTime"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "0.9.13"
          controller_replicas: 1
          controller_ready: 1
          webhook_replicas: 1
          webhook_ready: 1
          cert_controller_ready: 1
