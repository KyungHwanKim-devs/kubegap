- id: eso.deletion-policy-delete
  name: ExternalSecret deletionPolicy Delete (deleted from the store = cluster Secret disappears)
  area: resilience
  type: summary
  each: esoctl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['deletion_policy_delete']) > 0"
  target: "'cluster'"
  evidence: "f\"deletionPolicy Delete {item['deletion_policy_delete']}, creationPolicy Orphan {item['orphan_creation']}\""
  severity_default: low
  symptom_linked: true
  why: >
    The default Retain keeps the cluster Secret even when the store's secret disappears (the app keeps running on the last value). Delete removes the Secret the moment it is deleted from the store, so the next pod restart fails to start. It may be an intentional security policy, so warn at most. Measured on real clusters: 0 on both.
  suggest: "Retain (default) for prod. Delete only where secret revocation must take effect immediately."
  verify:
    - "kubectl get externalsecret -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name} {.spec.target.deletionPolicy}{\"\\n\"}{end}' | grep Delete"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "0.9.13"
          controller_replicas: 1
          controller_ready: 1
          webhook_replicas: 1
          webhook_ready: 1
          cert_controller_ready: 1
          cert_controller_replicas: 1
