# KEDA collection. All read-only.
# ScaledObject Ready/Active/Fallback, HPA ownership and external.metrics APIService availability are covered by the scaling section (summary.scaling.keda, metrics_api). Here: the KEDA components themselves —
# replicas/version/PDB of operator, metrics-apiserver and webhooks; existence of Secrets referenced by trigger authentication; ScaledObject fallback, pollingInterval and last active time; external metrics API request errors; the operator Prometheus metrics flag.
# The operator exposes no Prometheus metrics when --enable-prometheus-metrics=false. The metrics-apiserver (:8080) always exposes apiserver_request_total and gRPC client metrics.
- id: metrics-apiserver-metrics
  unit: metrics
  type: pod-metrics
  namespace: keda
  selector: app.kubernetes.io/name=keda-operator-metrics-apiserver
  port: 8080
  discover: { kind: deployment, name: "*/*keda-operator-metrics-apiserver", port_names: [metrics] }
  path: /metrics
  out: metrics/pod/keda-metrics-apiserver
  source: "names and their definitions per version: collectors/keda/pod-metrics.yaml. Port 8080 is the metrics API server's --port default (kedacore/keda cmd/adapter/main.go:239@v2.21.0) and the chart's prometheus.metricServer.port, container port metrics (kedacore/charts keda/values.yaml:735-742@v2.21.0, keda/templates/metrics-server/deployment.yaml:133-134,153-159); the pod label app.kubernetes.io/name=keda-operator-metrics-apiserver is the chart's (templates/metrics-server/deployment.yaml:25-30@v2.21.0); namespace keda is the install convention"
  keep: '^(apiserver_request_total|keda_internal_metricsservice_grpc_client_(handled|started)_total|registered_metrics_total|apiserver_current_inflight_requests|process_(start_time|resident_memory_bytes))'
  timeout: 30
- id: operator-metrics
  unit: metrics
  type: pod-metrics
  namespace: keda
  selector: app.kubernetes.io/name=keda-operator
  skip_if_container_arg: "--enable-prometheus-metrics=false"
  port: 8080
  discover: { kind: deployment, name: "*/*keda-operator", port_names: [metrics] }   # <fullname>; the metrics-apiserver and admission-webhooks carry a suffix
  path: /metrics
  out: metrics/pod/keda-operator
  source: "names and their definitions per version: collectors/keda/pod-metrics.yaml. The operator serves /metrics on --metrics-bind-address, default :8080, only when --enable-prometheus-metrics is true (kedacore/keda cmd/operator/main.go:104,107,200@v2.21.0; the flag exists since v2.12.0, cmd/operator/main.go:82-84@v2.12.0); the chart passes --enable-prometheus-metrics=false by default (kedacore/charts keda/values.yaml:793-797@v2.21.0, keda/templates/manager/deployment.yaml:113-116,163-171), so the skip below is the chart's normal case, not an exception; the pod label app.kubernetes.io/name=keda-operator is the chart's (templates/manager/deployment.yaml:31-37@v2.21.0)"
  keep: '^(keda_|controller_runtime_reconcile_errors_total|leader_election|process_(start_time|resident_memory_bytes))'
  timeout: 30
