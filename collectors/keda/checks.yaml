- id: keda.components-single-replica
  name: KEDA operator and metrics-apiserver run a single replica (if it dies, external-metric HPAs stop)
  area: scaling
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    expr: "not item['unused'] and ((item['metrics_apiserver_ready'] or 0) < (item['metrics_apiserver_replicas'] or 1) or (item['operator_ready'] or 0) < (item['operator_replicas'] or 1) or not item['apiservice_available'])"
    warn_expr: "not item['unused'] and item['scaledobjects_prod'] > 0 and ((item['metrics_apiserver_replicas'] or 1) < 2 or not item['has_pdb'])"
  target: "'cluster'"
  evidence: "f\"operator {item['operator_ready']}/{item['operator_replicas']}, metrics-apiserver {item['metrics_apiserver_ready']}/{item['metrics_apiserver_replicas']}, APIService v1beta1.external.metrics Available {item['apiservice_available']}, PDB {item['has_pdb']}, prod ScaledObject {item['scaledobjects_prod']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    The path an HPA uses to read external metrics (kafka lag, queue length) is kube-apiserver → external.metrics APIService → keda-operator-metrics-apiserver → keda-operator (gRPC). If any of them dies, the HPA stops scaling with "unable to get external metric" (keeping the current replicas), does not grow on a spike and does not shrink after a surge. The default install has both at 1 replica with no PDB.
    Measured on a real EKS cluster: all 1/1, no PDB, 3 prod ScaledObjects → warn.
  suggest: "metrics-apiserver replicas 2 (active-active is possible) + PDB; the operator uses leader election, so 2 gives a standby replica. With few nodes, at least a PDB."
  verify:
    - "kubectl get deploy -n keda ; kubectl get apiservice v1beta1.external.metrics.k8s.io"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
          metrics_apiserver_ready: 0
          webhooks_replicas: 1
          webhooks_ready: 1
          has_pdb: false
          operator_prometheus_metrics: false
          apiservice_available: true
          apiservice_keda_owned: true
          webhook_fail_policy: []
          scaledobjects: 4
          scaledjobs: 0
          unused: false
          scaledobjects_prod: 3
          trigger_types:
            kafka: 4
            metrics-api: 2
          scale_to_zero:
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          never_active_14d:
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          not_ready: []
          fallback_active: []
          prod_external_without_fallback:
            - "prod-app-d/scaledobject/app-d-ai-kafka-lag"
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          auth_missing: []
