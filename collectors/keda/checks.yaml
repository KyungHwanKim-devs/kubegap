- id: keda.scaledobject-never-active
  name: ScaledObject has not been Active for more than 14 days (trigger threshold wrong or useless)
  area: scaling
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['never_active_14d']) > 0"
  target: "'cluster'"
  evidence: "f\"inactive for more than 14 days {item['never_active_14d']}, not Ready {item['not_ready']}, fallback active {item['fallback_active']}, scale-to-zero targets {item['scale_to_zero']}\""
  severity_default: low
  symptom_linked: false
  why: >
    Active means "the trigger crossed its threshold and there is a reason to scale", and lastActiveTime is the last time that happened. If it was never crossed for weeks, the threshold (kafka lagThreshold 1 should be crossed almost always) or the metric path is wrong, or the workload is unused. This is the KEDA counterpart of scaling.hpa-never-scaled.
    Measured on a real EKS cluster: one worker inactive for 30.8 days (min 0, so it sat at 0 pods — possibly intended).
  suggest: "Query the trigger metric directly (the URL for metrics-api, the consumer group lag for kafka) and see whether values arrive. If the worker is unused, delete the ScaledObject and the Deployment."
  verify:
    - "kubectl get scaledobject -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,ACTIVE:.status.conditions[1].status,LAST:.status.lastActiveTime"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
