# KEDA checks. summary.kedactl.summary — lib/kedactl.py. ScaledObject Ready/Fallback and metrics API availability are covered by core scaling.keda-* and metrics-api-unavailable.
- id: keda.unused
  name: KEDA is installed but there is no ScaledObject or ScaledJob at all
  area: hygiene
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    warn_expr: "item['unused']"
  target: "'cluster'"
  evidence: "f\"KEDA v{item['version']} operator {item['operator_ready']}/{item['operator_replicas']}, metrics-apiserver {item['metrics_apiserver_ready']}/{item['metrics_apiserver_replicas']}, webhooks {item['webhooks_ready']}/{item['webhooks_replicas']} — ScaledObject {item['scaledobjects']}, ScaledJob {item['scaledjobs']}\""
  severity_default: low
  symptom_linked: false
  why: >
    KEDA takes up three pods and one external.metrics.k8s.io APIService, and places a webhook and 7 CRDs in the cluster. With no ScaledObject in use, only the resources and the attack surface remain. Measured on a real k3s k3s: 2.19.0 installed, 0 ScaledObjects → warn.
  suggest: "If there is no plan to use it, helm uninstall keda (including CRDs). If there is, move HPAs to ScaledObjects."
  verify:
    - "kubectl get scaledobjects,scaledjobs -A"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
          metrics_apiserver_ready: 1
          webhooks_replicas: 1
          webhooks_ready: 1
          has_pdb: false
          operator_prometheus_metrics: false
          apiservice_available: true
          apiservice_keda_owned: true
          webhook_fail_policy: []
          scaledobjects: 0
          scaledjobs: 0
          unused: true
          scaledobjects_prod: 3
          trigger_types:
            kafka: 4
            metrics-api: 2
          scale_to_zero:
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          never_active_14d:
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          not_ready: []
          fallback_active: []
          prod_external_without_fallback:
            - "prod-app-d/scaledobject/app-d-ai-kafka-lag"
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          auth_missing: []
          secret_missing: []
          secrets_known: true
          triggerauths: 2
          polling_interval_min_s: 15
          api_metrics_available: true
          api_requests_non_2xx: 18
          api_grpc_non_ok: 18
          api_requests_by_code:
            200: 1027247
            304: 58774
            500: 18
          operator_metrics_present: false
          scaler_errors_total: 0
          scaler_errors_24h_logs: 0
      - expect: "pass"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
          metrics_apiserver_ready: 1
          webhooks_replicas: 1
          webhooks_ready: 1
          has_pdb: false
          operator_prometheus_metrics: false
          apiservice_available: true
          apiservice_keda_owned: true
          webhook_fail_policy: []
          scaledobjects: 4
          scaledjobs: 0
          unused: false
          scaledobjects_prod: 3
          trigger_types:
            kafka: 4
            metrics-api: 2
          scale_to_zero:
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          never_active_14d:
