- id: keda.auth-or-secret-missing
  name: ScaledObject's TriggerAuthentication or its Secret is missing
  area: scaling
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    expr: "len(item['auth_missing']) > 0 or len(item['secret_missing']) > 0"
  target: "'cluster'"
  evidence: "f\"TriggerAuthentication referenced by authenticationRef missing {item['auth_missing']}, Secret referenced by TriggerAuthentication missing {item['secret_missing']} (Secrets checked by name only via kube_secret_info, {item['triggerauths']} total)\""
  severity_default: high
  symptom_linked: true
  why: >
    With a broken authentication reference the scaler cannot reach the broker, repeats "error getting metrics" and the HPA freezes. A common cause of the log signature keda.scaler-error. Measured on a real EKS cluster: both had their Secret — pass.
