    The KEDA webhook validates only ScaledObject and TriggerAuthentication (unrelated to pod creation). The default is Ignore, so the impact is small, but in an install switched to Fail with a single webhook pod, ScaledObjects cannot be fixed while that pod is down. Measured on real clusters: Ignore on both — pass.
