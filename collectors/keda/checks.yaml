- id: keda.prod-external-trigger-no-fallback
  name: prod ScaledObject with an external trigger (kafka, metrics-api) has no fallback
  area: scaling
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_external_without_fallback']) > 0"
  target: "'cluster'"
  evidence: "f\"prod external-trigger ScaledObjects without fallback {item['prod_external_without_fallback']}, trigger types {item['trigger_types']}, minimum pollingInterval {item['polling_interval_min_s']}s\""
  severity_default: medium
  symptom_linked: true
  why: >
    The kafka and metrics-api triggers read an external system (broker, app endpoint). When that system dies the scaler errors and the HPA freezes at its last value — consumers do not grow at the very moment the queue piles up. spec.fallback{failureThreshold, replicas} moves to a fixed replica count after N consecutive errors.
    Measured on a real EKS cluster: all 3 prod ScaledObjects had no fallback (one kafka lag, two metrics-api).
  suggest: "Add fallback: {failureThreshold: 3, replicas: <usual peak count>} to the ScaledObject. For metrics-api triggers, consumers then stay up even when the app endpoint dies."
  verify:
    - "kubectl get scaledobject -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name} {.spec.fallback}{\"\\n\"}{end}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
          metrics_apiserver_ready: 1
          webhooks_replicas: 1
          webhooks_ready: 1
          has_pdb: false
          operator_prometheus_metrics: false
          apiservice_available: true
          apiservice_keda_owned: true
          webhook_fail_policy: []
          scaledobjects: 4
          scaledjobs: 0
          unused: false
          scaledobjects_prod: 3
          trigger_types:
            kafka: 4
            metrics-api: 2
          scale_to_zero:
            - "prod-app-a-backend/scaledobject/app-a-file-worker"
            - "prod-app-a-backend/scaledobject/app-a-graph-worker"
          never_active_14d:
