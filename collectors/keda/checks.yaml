- id: keda.external-metrics-api-errors
  name: External metrics API request errors (times the HPA failed to get a metric)
  area: scaling
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    expr: "item['api_metrics_available'] and ((item['api_grpc_non_ok'] or 0) >= 1000 or (item['api_requests_non_2xx'] or 0) >= 1000 or (item['api_requests_non_2xx'] or 0) / max(sum((item.get('api_requests_by_code') or {}).values()), 1) >= 0.01)"
    warn_expr: "item['api_metrics_available'] and ((item['api_requests_non_2xx'] or 0) >= 100 or (item['api_grpc_non_ok'] or 0) >= 100 or (item['api_requests_non_2xx'] or 0) / max(sum((item.get('api_requests_by_code') or {}).values()), 1) >= 0.001)"  # 18 of 1.1M (0.002%) is noise — from 100 requests or 0.1%
  target: "'cluster'"
  evidence: "f\"request codes since metrics-apiserver start {item['api_requests_by_code']}, non-2xx/3xx responses {item['api_requests_non_2xx']}, operator gRPC GetMetrics failures {item['api_grpc_non_ok']}, scaler errors in logs (24h) {item['scaler_errors_24h_logs']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    For every external metric request from the HPA controller, metrics-apiserver fetches the value from the operator over gRPC and answers. A 500 or gRPC Unknown means the HPA got no value at that moment. The counters are cumulative since process start, so they are judged as a ratio (measured on a real EKS cluster: 18 failures out of 390,734 = 0.005%).
  suggest: "Match the times failures cluster with scaler errors in the operator log (logs/pods/keda/). Availability of the trigger target (broker, app URL) is the cause in most cases."
  verify:
    - "apiserver_request_total{component=\"external-metrics\"} from the pod /metrics (metrics/pod/keda-metrics-apiserver/)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.17.2"
          operator_replicas: 1
          operator_ready: 1
          metrics_apiserver_replicas: 1
