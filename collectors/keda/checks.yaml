- id: keda.webhook-fail-policy
  name: KEDA admission webhook uses the Fail policy (if the webhook pod dies, ScaledObjects cannot be changed)
  area: resilience
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['webhook_fail_policy']) > 0 and (item['webhooks_replicas'] or 1) < 2"
  target: "'cluster'"
  evidence: "f\"Fail-policy webhooks {item['webhook_fail_policy']}, webhooks replicas {item['webhooks_replicas']}\""
  severity_default: low
  symptom_linked: false
