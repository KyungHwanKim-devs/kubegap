- id: keda.operator-metrics-disabled
  name: KEDA operator Prometheus metrics are off (scaler errors, latency and values not visible)
  area: observability
  type: summary
  each: kedactl.summary
  cluster_level: true
  rule:
    warn_expr: "not item['unused'] and (item['operator_prometheus_metrics'] is False or not item['operator_metrics_present'])"
  target: "'cluster'"
  evidence: "f\"--enable-prometheus-metrics {item['operator_prometheus_metrics']}, operator keda_* metrics exposed {item['operator_metrics_present']}, scaler errors in logs (24h) {item['scaler_errors_24h_logs']}\""
  severity_default: low
  symptom_linked: false
  why: >
    When enabled the operator exposes keda_scaler_errors_total, keda_scaler_metrics_value (the value the trigger read), keda_scaler_metrics_latency and keda_internal_scale_loop_latency. When off, neither kubegap nor Grafana can see "what is the kafka lag right now" and errors are counted only from log signatures. Measured on real clusters: false on both.
