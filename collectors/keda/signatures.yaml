# KEDA's binary defaults to zap JSON, but every shipped install passes --zap-encoder=console --zap-time-encoding=rfc3339 --zap-log-level=info (config/manager/manager.yaml
# and the chart), so a line is `<rfc3339>\tERROR\t<logger>\t<msg>\t{"key": "value", "error": "…"}`; the level is the uppercase second column.
- id: keda.scaler-error
  name: KEDA scaler failed to fetch metrics
  component: keda
  area: scaling
  severity: medium
  sources: ["logs/pods/keda/*.log"]
  # `Failed to get metrics` and `Error getting scale decision` are lowercase in source. `unauthorized` is printed only by the Datadog scaler from v2.19.0; IBM MQ and
  # Elasticsearch say `authentication failed` / `HTTP 401`. `scaler.*error` is anchored to the console ERROR column so the V(1) lines `scaler error encountered, clearing
  # scaler cache` and `Getting metrics and activity from scaler … scalerError` (debug only) cannot count; `TriggerAuthentication` is narrowed to the two error lines.
  pattern: 'error getting (scaler|metric)|error getting scale decision|failed to get metrics|\tERROR\t.*scaler|[Uu]nauthorized|authentication failed|HTTP 401|Failed to get (Cluster)?TriggerAuthentication|TriggerAuthentication Not Found'
  meaning: A ScaledObject cannot read its external metric (queue length, Prometheus), so scaling stops. Without a fallback it is pinned at the current replica count. The lines are the scale handler's ERROR lines (the scaler error is in the trailing "error" field) and the status updater's lines when the referenced TriggerAuthentication is missing.
  cause: Expired trigger authentication, external system down, query error.
  verify: "kubectl get scaledobjects -A | grep -v True"
  warn_at: 5
  fail_at: 200
  source:
