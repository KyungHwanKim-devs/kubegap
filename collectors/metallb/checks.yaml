- id: traffic.metallb-config-stale
  name: Speaker MetalLB config is stale or failed to load, or k8s update errors
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and len(item['config_stale_pods']) > 0"
    warn_expr: "item['metrics_available'] and (item['update_errors_total'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"speakers with stale/unloaded config {item['config_stale_pods']}, k8s client update errors {item['update_errors_total']}, ARP requests/responses {item['arp_requests_total']}/{item['arp_responses_total']}, gratuitous ARP {item['gratuitous_total']}, BGP sessions up {item['bgp_sessions_up']}/{item['bgp_sessions']}\""
  severity_default: high
  symptom_linked: true
  why: >
    metallb_k8s_client_config_stale_bool=1 means the speaker rejected a new IPAddressPool or L2Advertisement (validation failed) and keeps running on the old config — you widened the pool but it never applied, and "no free IPs" still fires. config_loaded 0 means the config was never read. update_errors counts failures of the speaker writing Service status.
    Measured on a 2-node k3s k3s: both speakers loaded 1, stale 0, errors 0; the leader speaker had 5,020 gratuitous ARPs (failover and periodic re-announcement) -> pass.
  suggest: "kubectl -n metallb-system logs ds/speaker | grep -i 'config\\|error'. Rejected CRs have the validation reason in the controller log."
  verify:
    - "kubectl get --raw /api/v1/namespaces/metallb-system/pods/<speaker-pod>:7472/proxy/metrics | grep metallb_k8s_client"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          mode: "layer2"
          version: "0.14.5"
          namespace: "metallb-system"
          speaker_desired: 2
          speaker_ready: 2
          speaker_all_nodes: true
          nodes_total: 2
          controller_replicas: 1
          controller_ready: 1
          pools: 1
          total_ips: 10
