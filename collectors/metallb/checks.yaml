- id: traffic.metallb-version-old
  name: MetalLB version is old
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    warn_expr: "item['version'] is not None and (int(str(item['version']).split('.')[0]) == 0 and int(str(item['version']).split('.')[1]) < 14)"
  target: "'cluster'"
