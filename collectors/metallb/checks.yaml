- id: traffic.metallb-config-stale
  name: Speaker MetalLB config is stale or failed to load, or k8s update errors
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    needs: "item.get('config_read')"
    needs_reason: "neither speaker metrics nor ConfigurationState read"
    expr: "len(item['config_stale_pods']) > 0"
    warn_expr: "(item['update_errors_total'] or 0) > 0 or len(item.get('config_not_reported') or []) > 0"
  target: "'cluster'"
  evidence: "f\"source {item['config_source']}: components with stale/unloaded config {item['config_stale_pods']}, errors {item['config_errors']}, not reported {item['config_not_reported']}, k8s client update errors {item['update_errors_total'] if item['update_errors_read'] else 'not read'}, ARP requests/responses {item['arp_requests_total'] if item['update_errors_read'] else 'not read'}/{item['arp_responses_total'] if item['update_errors_read'] else 'not read'}, gratuitous ARP {item['gratuitous_total'] if item['update_errors_read'] else 'not read'}, BGP sessions up {item['bgp_sessions_up'] if item['bgp_sessions'] is not None else 'not read'}/{item['bgp_sessions'] if item['bgp_sessions'] is not None else 'not read'}\""
  severity_default: high
  symptom_linked: true
  why: >
    metallb_k8s_client_config_stale_bool=1 means the speaker rejected a new IPAddressPool or L2Advertisement (validation failed) and keeps running on the old config — you widened the pool but it never applied, and "no free IPs" still fires. config_loaded 0 means the config was never read. update_errors counts failures of the speaker writing Service status.
    From 0.16 /metrics demands TLS with authentication, so the same fact is read from ConfigurationState (result Invalid, with errorSummary), which covers the controller too. The update error counter exists only in /metrics, so on 0.16+ this check cannot warn on it.
  measured: >
    Measured on a 2-node k3s cluster: both speakers loaded 1, stale 0, errors 0; the leader speaker had 5,020 gratuitous ARPs (failover and periodic re-announcement) -> pass.
  suggest: "kubectl -n metallb-system get configurationstates.metallb.io (0.15.3+), or kubectl -n metallb-system logs ds/speaker | grep -i 'config\\|error'. Rejected CRs have the validation reason in the controller log."
