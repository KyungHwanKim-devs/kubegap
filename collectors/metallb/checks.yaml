- id: traffic.metallb-version-old
  name: MetalLB version is old
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    warn_expr: "item['version'] is not None and (int(str(item['version']).split('.')[0]) == 0 and int(str(item['version']).split('.')[1]) < 14)"
  target: "'cluster'"
  evidence: "f\"MetalLB {item['version']} (mode {item['mode']}, webhooks Fail {len(item['webhooks_fail'])})\""
  severity_default: low
  symptom_linked: false
  why: >
    0.13 moved configuration from a ConfigMap to CRDs (IPAddressPool, L2Advertisement), and 0.14 added FRR-K8s and L2 interface selection among others. 0.13 and below receive no patches.
