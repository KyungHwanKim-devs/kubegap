          metrics_not_read: []
          config_read: true
          config_source: "metrics"
          config_errors: []
          config_not_reported: []
          update_errors_read: true
      - expect: "fail"
        item:
          present: true
          mode: "layer2"
          version: "0.14.5"
          namespace: "metallb-system"
          speaker_desired: 2
          speaker_ready: 2
          speaker_all_nodes: true
          nodes_total: 2
