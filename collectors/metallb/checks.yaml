- id: traffic.metallb-single-lb-service
  name: LoadBalancer services concentrated on a single ingress controller (L2 mode, one node carries all external traffic)
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    needs: "item['mode'] != 'layer2' or not item['lb_services'] or (item['l2_available'] is True and not item.get('l2_partial'))"
    needs_reason: "L2 leaders not read, or read from only some speakers"
    warn_expr: "item['mode'] == 'layer2' and (item['lb_services'] or 0) >= 1 and (item['nodes_total'] or 0) >= 2 and (item['leader_share'] or 0) >= 1.0 and not item['pinned_by_selector'] and (item['l2_available'] is True)"
  target: "'cluster'"
  evidence: "f\"mode {item['mode']}, {item['lb_services']} LoadBalancer services, pool used {item['used']}/{item['total_ips']}, leader {item['leader_node']} ({item['leader_share']}), pinned by nodeSelectors {item['pinned_by_selector']}, {item['nodes_total']} nodes\""
  severity_default: low
  symptom_linked: false
  why: >
    L2 mode is failover, not load balancing — a service IP enters through one node's NIC only. If a single ingress controller is the only LoadBalancer, all external traffic passes through the leader node's NIC and then rides vxlan again to pods on other nodes. When the leader dies, traffic is down for about 10 seconds of ARP relearning. On a 2-node small k3s cluster this is a known trade-off, hence low — traffic.metallb-l2-leader-concentration looks at the same fact as a leader share.
  measured: >
    Measured on a 2-node k3s cluster: 1 LoadBalancer (ingress-nginx) with the leader on one node; the traffic it passed on to pods on the other node was part of that cluster's overlay traffic.
  suggest: "BGP mode (if the router supports it), or externalTrafficPolicy Local plus one service IP per node. For a small k3s cluster, record 'leader node = X, about 10 s outage if it dies' in the report."
  verify:
    - "kubectl get svc -A --field-selector spec.type=LoadBalancer; kubectl -n metallb-system get servicel2statuses.metallb.io -o wide"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          mode: "layer2"
          version: "0.14.5"
          namespace: "metallb-system"
          speaker_desired: 2
          speaker_ready: 2
          speaker_all_nodes: true
          nodes_total: 2
          controller_replicas: 1
          controller_ready: 1
          pools: 1
          total_ips: 10
          used: 1
          free: 9
          pending: []
          lb_services: 1
          l2_available: true
          speakers_read: 2
          speakers_unreadable: []
          leader_node: "node-b"
          leader_share: 1.0
          pinned_by_selector: false
          config_stale_pods: []
          update_errors_total: 0
          arp_requests_total: 27
          arp_responses_total: 27
          gratuitous_total: 5020
          bgp_sessions: 0
          bgp_sessions_up: 0
          bgp_peers: 0
          webhooks_fail:
            - "bgppeersvalidationwebhook.metallb.io"
            - "bfdprofilevalidationwebhook.metallb.io"
            - "bgpadvertisementvalidationwebhook.metallb.io"
