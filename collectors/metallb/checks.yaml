# MetalLB checks. summary.metallb — lib/metallbctl.py, on every platform. The first two were moved from k3s-platform with their ids unchanged.
- id: traffic.metallb-pool-near-full
  name: MetalLB IP pool running out of free addresses
  area: traffic
  type: summary
  each: metallb.pools
  cluster_level: true
  profiles: [prod, lab]
  rule:
    needs: "item.get('present')"
    needs_reason: "pools not present"
    expr: "((item.get('free') or 0) <= 1 or len(item.get('pending') or []) > 0)"
    warn_expr: "(item.get('free') or 0) <= 3"
  target: "'cluster'"
  evidence: "f\"pools {[(p['name'], p['addresses'], p['size']) for p in item.get('pools') or []]}, used {item.get('used')}/{item.get('total_ips')}, free {item.get('free')}, Pending Services {[(s['namespace'], s['name']) for s in item.get('pending') or []]}\""
  severity_default: medium
  symptom_linked: true
  why: When the pool is empty, new LoadBalancer Services stay at EXTERNAL-IP Pending. The EKS equivalent is subnet free IPs and the ELB quota.
  suggest: Widen the IPAddressPool range or let Services share an IP (`metallb.universe.tf/allow-shared-ip`). Consolidating behind one ingress is usually the answer.
  verify:
    - "kubectl get ipaddresspools -A -o yaml; kubectl get svc -A --field-selector spec.type=LoadBalancer"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          present: true
          pools:
            - name: "p"
              addresses:
                - "192.0.2.200-192.0.2.209"
              size: 10
          total_ips: 10
          used: 9
          free: 1
          pending: []
      - expect: "fail"
        item:
          present: true
          pools:
            - name: "p"
              addresses:
                - "192.0.2.200-192.0.2.209"
              size: 10
          total_ips: 10
          used: 1
          free: 9
          pending:
            - namespace: "a"
              name: "b"
      - expect: "warn"
        item:
          present: true
          pools:
            - name: "p"
              addresses:
                - "192.0.2.200-192.0.2.209"
              size: 10
          total_ips: 10
          used: 7
          free: 3
          pending: []
      - expect: "pass"
        item:
          present: true
          pools:
            - name: "p"
              addresses:
                - "192.0.2.200-192.0.2.209"
              size: 10
          total_ips: 10
          used: 1
          free: 9
          pending: []
      - expect: "skip"
        item:
          present: false
- id: traffic.metallb-l2-leader-concentration
  name: MetalLB L2 — service IP announcements (leader) concentrated on one node
  area: traffic
  type: summary
  each: metallb.l2
  cluster_level: true
  profiles: [prod, lab]
  rule:
    needs: "item.get('available') or not item.get('metrics_tls_only')"
    needs_reason: "L2 leaders not read (metrics over TLS with authentication and no status resources)"
    expr: "item['available'] and item['nodes_total'] >= 2 and item['announced_total'] >= 2 and (item['leader_share'] or 0) >= 1.0 and not item['pinned_by_selector']"
    warn_expr: "(item['available'] and item['nodes_total'] >= 2 and item['announced_total'] >= 2 and (item['leader_share'] or 0) >= 0.8 and not item['pinned_by_selector']) or (not item['available'] and item['lb_services'] > 0)"
  target: "'cluster'"
  evidence: "f\"read from {item['source'] or 'nothing'} ({item['speakers']} speakers with metrics, available {item['available']}): {item['announced_total']} IPs announced (LoadBalancer services {item['lb_services']}), by node {item['by_node']}, leader {item['leader_node']} ({item['leader_share']}), pinned by nodeSelectors {item['pinned_by_selector']}, {item['nodes_total']} nodes\" + ('' if item['available'] else ' — could not read speaker /metrics (pod proxy failed or no speaker)')"
  severity_default: low
  symptom_linked: false
  why: >
    In MetalLB L2 mode one node announces each service IP via ARP (the leader). If one node announces every IP, all external traffic passes through that node's NIC, and when it dies everything is down for the roughly 10 seconds it takes another node to take over.
    With a single IP, concentration is expected (fail requires 2 or more IPs). If pinned with L2Advertisement nodeSelectors it is a deliberate design and is excluded. Prometheus usually does not scrape the speaker, so /metrics is read directly through the pod proxy (read-only GET); from 0.16 that endpoint demands TLS with authentication and the announcing node is read from ServiceL2Status and ServiceBGPStatus instead.
  suggest: "With several service IPs, MetalLB spreads announcements across nodes by default — if they all sit on one node, either the speaker runs on only one node (DaemonSet nodeSelector or taints) or the other nodes' NICs are missing from L2Advertisement interfaces. BGP mode spreads traffic with ECMP."
  verify:
    - "Up to 0.15: kubectl get --raw /api/v1/namespaces/metallb-system/pods/<speaker-pod>:7472/proxy/metrics | grep metallb_speaker_announced"
    - "From 0.16: kubectl get servicel2statuses.metallb.io,servicebgpstatuses.metallb.io -n metallb-system"
    - "kubectl get l2advertisements -n metallb-system -o yaml"
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          metrics_tls_only: false
          source: null
          speakers: 2
          announced: []
          announced_total: 3
          lb_services: 1
          by_node:
            node-b: 3
          leader_node: "node-b"
          leader_share: 1.0
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "warn"
        item:
          available: true
          metrics_tls_only: false
          source: null
          speakers: 2
          announced: []
          announced_total: 5
          lb_services: 1
          by_node:
            node-b: 4
            node-a: 1
          leader_node: "node-b"
          leader_share: 0.8
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "warn"
        item:
          available: false
          metrics_tls_only: false
          source: null
          speakers: 0
          announced: []
          announced_total: 0
          lb_services: 1
          by_node: {}
          leader_node: null
          leader_share: null
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "pass"
        item:
          available: true
          metrics_tls_only: false
          source: null
          speakers: 2
          announced: []
          announced_total: 1
          lb_services: 1
          by_node:
            node-b: 1
          leader_node: "node-b"
          leader_share: 1.0
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "pass"
        item:
          available: true
          metrics_tls_only: false
          source: null
          speakers: 2
          announced: []
          announced_total: 3
          lb_services: 1
          by_node:
            node-b: 3
          leader_node: "node-b"
          leader_share: 1.0
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: true
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "pass"
        item:
          available: false
          metrics_tls_only: false
          source: null
          speakers: 0
          announced: []
          announced_total: 0
          lb_services: 0
          by_node: {}
          leader_node: null
          leader_share: null
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "fail"
        item:
          available: true
          metrics_tls_only: true
          source: "objects/servicel2statuses.metallb.io.json, servicebgpstatuses.metallb.io.json"
          speakers: 0
          announced: []
          announced_total: 3
          lb_services: 1
          by_node:
            node-b: 3
          leader_node: "node-b"
          leader_share: 1.0
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."
      - expect: "skip"
        item:
          available: false
          metrics_tls_only: true
          source: null
          speakers: 2
          announced: []
          announced_total: 0
          lb_services: 1
          by_node:
            node-b: 3
          leader_node: "node-b"
          leader_share: 1.0
          nodes_total: 2
          advertisements:
            - name: "default-advertisement"
              pools:
                - "primary-pool"
              node_selectors: null
              interfaces: null
          pinned_by_selector: false
          note: "L2 mode advertises each service IP from one node. If one node advertises all IPs, its NIC carries all external traffic and everything drops during failover (about 10 s) if that node dies."

- id: traffic.metallb-speaker-not-ready
  name: MetalLB speaker is not running on every node or its metrics cannot be read
  area: traffic
  type: summary
  each: metallb.summary
  cluster_level: true
  rule:
    expr: "(item['speaker_ready'] or 0) < (item['speaker_desired'] or 0) or (item['controller_ready'] or 0) < (item['controller_replicas'] or 0)"
    warn_expr: "(item['speaker_all_nodes'] is False and not item.get('speakers_pinned')) or len(item['speakers_unreadable']) > 0 or (item['metrics_available'] is False and not item.get('metrics_tls_only') and (item['lb_services'] or 0) > 0)"
  target: "'cluster'"
  evidence: "f\"speaker ready {item['speaker_ready']}/{item['speaker_desired']} ({item['nodes_total']} nodes, all nodes {item['speaker_all_nodes']}, pinned by nodeSelector or affinity {item.get('speakers_pinned')}), controller {item['controller_ready']}/{item['controller_replicas']}, speakers with metrics read {item['speakers_read']}, unreadable {item['speakers_unreadable']}, version {item['version']}, mode {item['mode']}\""
  severity_default: high
  symptom_linked: true
  why: >
    In L2 mode a node without a speaker cannot announce any service IP — when the leader node dies, failover to that node does not happen, and an externalTrafficPolicy Local service that lives only on that node is never reachable. If the controller is down, new LoadBalancer services get no IP and stay Pending (existing IPs keep being announced by the speakers).
  measured: >
    Measured on a 2-node k3s cluster: speaker 2/2 (2 nodes), controller 1/1, metrics 2/2 -> pass.
  suggest: "kubectl -n metallb-system get ds speaker; check node taints (the speaker needs tolerations) and nodeSelector. Speakers kept off tainted nodes on purpose read as a warn here: say so in the report."
  verify:
    - "kubectl -n metallb-system get pods -o wide"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          mode: "layer2"
          version: "0.14.5"
          namespace: "metallb-system"
          speaker_desired: 2
          speaker_ready: 1
          speaker_all_nodes: true
          speakers_pinned: false
          nodes_total: 2
          controller_replicas: 1
          controller_ready: 1
          pools: 1
          total_ips: 10
          used: 1
          free: 9
          pending: []
          lb_services: 1
          l2_available: true
          speakers_read: 2
          speakers_unreadable: []
          leader_node: "node-b"
          leader_share: 1.0
          pinned_by_selector: false
          config_stale_pods: []
          update_errors_total: 0
          arp_requests_total: 27
