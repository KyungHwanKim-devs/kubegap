# Alertmanager HTTP API (alert routing). config.original in status is the whole route tree and receiver list. Webhook URLs and tokens inside receiver settings are not copied into the report (masked).
- id: status
  type: http
  store: alertmanager
  path: /api/v2/status
  out: alertmanager/status.json
  timeout: 30
  source: "prometheus/alertmanager api/v2/openapi.yaml:21,259@v0.26.0, :21,266@v0.29.0, :21,297@v0.34.2 (GET /api/v2/status; alertmanagerStatus with cluster, versionInfo, config, uptime; clusterStatus :276-283@v0.26.0, :283-290@v0.29.0, :314-321@v0.34.2 with name, status (ready, settling, disabled) and peers[]; alertmanagerConfig.original :290-293@v0.26.0, :297-300@v0.29.0, :328-331@v0.34.2 is the loaded configuration as YAML text, which lib/stackhealth.py and lib/observability.py read for receivers, the route's receiver, inhibit_rules with source_matchers and target_matchers, and time_intervals, the keys of prometheus/alertmanager config/config.go:300-308,777-778,849-865@v0.26.0, :341-349,885-886,957-973@v0.29.0, :284-292,887-888@v0.34.2 and config/common/inhibitrule.go:27,37,45@v0.34.2; versionInfo api/v2/openapi.yaml:297-299@v0.26.0, :304-306@v0.29.0, :335-337@v0.34.2 with version; lib/monitoring.py reads version and cluster.status at setup)"
- id: silences
  type: http
  store: alertmanager
  path: /api/v2/silences
  out: alertmanager/silences.json
  timeout: 30
  source: "prometheus/alertmanager api/v2/openapi.yaml:45,350@v0.26.0, :45,357@v0.29.0, :49,390@v0.34.2 (GET /api/v2/silences; a gettableSilence with id, status silenceStatus :373-378@v0.26.0, :380-385@v0.29.0, :414-419@v0.34.2 whose state is expired, active or pending, and the silence's matchers[] of matcher :390-397@v0.26.0, :397-404@v0.29.0, :431-438@v0.34.2 with name, value, isRegex, startsAt, endsAt :334@v0.26.0, :341@v0.29.0, :372@v0.34.2, createdBy, comment; lib/observability.py reads them)"
- id: alerts
  type: http
  store: alertmanager
  path: /api/v2/alerts?active=true&silenced=true&inhibited=true
  out: alertmanager/alerts.json
  timeout: 30
  source: "prometheus/alertmanager api/v2/openapi.yaml:134,420@v0.26.0, :136,427@v0.29.0, :155,461@v0.34.2 (GET /api/v2/alerts?active=true&silenced=true&inhibited=true; a gettableAlert with labels, annotations, startsAt, endsAt, updatedAt, fingerprint, receivers[] of receiver :426@v0.26.0, :433@v0.29.0, :467@v0.34.2 and status alertStatus :488-493@v0.26.0, :495-500@v0.29.0, :532-537@v0.34.2 with state (unprocessed, active, suppressed), silencedBy[], inhibitedBy[], and mutedBy[] since 0.29.0 :509@v0.29.0, :546@v0.34.2, absent at 0.26.0; lib/observability.py reads labels.alertname, status and receivers[].name)"
- id: receivers
  type: http
  store: alertmanager
  path: /api/v2/receivers
  out: alertmanager/receivers.json
  timeout: 30
  source: "prometheus/alertmanager api/v2/openapi.yaml:32,506@v0.26.0, :32,518@v0.29.0, :32,555@v0.34.2 (GET /api/v2/receivers; receiver with name; lib/stackhealth.py reads the names as the declared receivers)"
