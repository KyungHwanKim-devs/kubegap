# Commands run by the core collector.
# Item types (type):
#   kubectl-dump-all : dump every kind listable via `kubectl api-resources --verbs=list` into objects/<kind>.json per kind.
#                      Kinds in exclude are not fetched. Secrets are never fetched. Kinds already fetched by detection are skipped.
#   kubectl          : run args as given and save to out
#   promql           : send the query list in file to Prometheus as instant queries and save to metrics/<id>.json
#   aws              : aws CLI (used by the eks-platform collector)
# Common: timeout (seconds), on_fail (skip|abort, default skip)
- id: objects.dump-all
  unit: cluster-objects
  adds: [app-settings]
  type: kubectl-dump-all
  timeout: 120
  exclude:
    - secrets                        # never fetched, values would come along. Metadata via the kube_secret_info metric
    - events                         # fetched separately by the events item below
    - events.events.k8s.io
    - componentstatuses              # deprecated, always errors
    - bindings
    - localsubjectaccessreviews.authorization.k8s.io
    - selfsubjectaccessreviews.authorization.k8s.io
    - selfsubjectrulesreviews.authorization.k8s.io
    - subjectaccessreviews.authorization.k8s.io
    - tokenreviews.authentication.k8s.io
    - selfsubjectreviews.authentication.k8s.io
    - pods.metrics.k8s.io            # metrics-server instant values. Fetched separately via top below
    - nodes.metrics.k8s.io
    - packagerevisions.*             # very large
- id: events
  unit: events
  type: kubectl
  args: [get, events, -A, -o, json]
  out: events.json
  timeout: 120
- id: top.nodes
  unit: live-usage
  type: kubectl
  args: [top, nodes, --no-headers]
  out: metrics/top-nodes.txt
  timeout: 30
- id: top.pods
  unit: live-usage
  type: kubectl
  args: [top, pods, -A, --no-headers, --containers]
  out: metrics/top-pods.txt
  timeout: 60
- id: metrics.core
  unit: metrics
  type: promql
  file: metrics.yaml
  timeout: 30
# ---- Node OS ----
# node item: script ships a file from collectors/core/ to the node and runs it (EKS = SSM as root, SSH = login user plus kubegap-sudoers read-only commands).
# No requires: the script leaves sections it has no permission for empty and the parser (lib/summaries/nodeos.py) records them as "no permission". Output logs/node/<node>/os.txt.
- id: node-os
  unit: node-os
  type: node
  nodes: all
  script: node-os.sh
  out: logs/node/{node}/os.txt
  timeout: 120
# Effective kubelet config (eviction thresholds, reserved resources, log rotation, maxPods). Read through the apiserver node proxy without node access (all platforms).
- id: kubelet-configz
  unit: kubelet-config
  type: kubectl
  for_each: nodes
  args: [get, --raw, "/api/v1/nodes/{item}/proxy/configz"]
  out: logs/node/{item}/kubelet-configz.json
  timeout: 30
# ---- Component pod logs (for signatures) ----
# component-logs: kubectl logs (--all-containers --prefix --timestamps) for each workload of a detected component (components_present). User application logs are not fetched (that is Loki's job).
# Output logs/pods/<component>/<ns>_<workload>.log. Signatures (signatures/catalog.yaml) read these files. No file is written for an empty log.
- id: component-logs
  unit: component-log-counts
  adds: [component-log-samples]
  type: component-logs
  since: 24h
  tail: 1500
  tail_daemonset: 600
  exclude: [kube-state-metrics, node-exporter, victoria-metrics, eks-managed-addons, k3s]
  timeout: 120
# KRR (Robusta): per-container request/limit recommendations from 7 days of Prometheus history. Read-only (kube API list + PromQL). Output tools/krr.json → summary.resources.krr.
# Skipped when the tool is missing (report section "tool missing"); the check resources.krr-recommendation becomes tool-missing. Takes about 3 minutes on a small 2-node cluster. Reuses the Prometheus port-forward opened by Stores.
- id: krr
  unit: workload-tools
  type: tool
  tool: krr
  cmd: [krr, simple, -c, "{context}", -p, "{prometheus_url}", -f, json, -q, --logtostderr, --fileoutput, "{out}", --max-workers, "4"]
  source: "krr: robusta_krr/main.py:78-80@v1.31.1 (-c/--context), :113-114 (-p), :249-250 (-f), :269-270 (-q), :272-273 (--logtostderr), :282-283 (--fileoutput), :217-218 (--max-workers); core/runner.py:121-135 writes the formatted result to --fileoutput; shape in references/sources.md"
  writes_out: true
  out: tools/krr.json
  timeout: 900
# ---- Structure and hygiene tools. All read-only. polaris, kubent and helm read the cluster (Polaris cannot read List objects from snapshot files); pluto reads what objects.dump-all saved. Typical runtime on a 7-node EKS cluster: polaris ~4s, pluto <1s, kubent ~10s, helm <1s ----
- id: polaris
  unit: workload-tools
  type: tool
  tool: polaris
  # Not --only-show-failed-tests: it drops every controller whose only failures are controller-level checks (missingPodDisruptionBudget, deploymentMissingReplicas …),
  # because the filter keeps a controller only when its PodResult is non-empty (pkg/validator/output.go:180-185@v10.2.6; schema.go:245-249 always sets PodResult).
  # lib/summaries/hygiene skips the Success entries itself.
  cmd: [polaris, audit, --context, "{context}", --format, json]
  source: "polaris: cmd/polaris/root.go:47@v10.2.6 (--context), cmd/polaris/audit.go:62 (--format); exit 0 unless --set-exit-code-* (audit.go:127-134); shape in references/sources.md"
  out: tools/polaris.json
  timeout: 300
- id: pluto
  unit: workload-tools
  type: tool
  tool: pluto
  # `detect -` reads a manifest List on stdin and contacts nothing. The List is built by lib/foundations/lastapplied.py from the objects saved above, so this step depends on objects.dump-all
  # and fails when that step saved no kind. Not detect-api-resources or detect-all-in-cluster: both List every resource the server advertises, Secrets included when the identity
  # may (pkg/discovery-api/discovery_api.go:83,115@v5.24.5, no flag excludes one, cmd/root.go:87-114), which is the read the README rules out; the second also reads Helm's release Secrets.
  # The three --ignore-* flags keep the exit code 0 when pluto finds something: without them it exits 2 (deprecated), 3 (removed) or 4 (no replacement)
  # (pkg/api/output.go:333-341@v5.24.5, cmd/root.go:353); lib/foundations/shell.py writes the output file only on exit 0, so the items were never saved and the
  # check passed with nothing to judge. The flags do not filter the items (FilterOutput, pkg/api/output.go:159-181 does not read them).
  stdin: last-applied
  cmd: [pluto, detect, "-", -o, json, --target-versions, "k8s={k8s_next_minor}", --ignore-deprecations, --ignore-removals, --ignore-unavailable-replacements]
  source: "pluto: cmd/root.go:387@v5.24.5 (detect), :403-411 (- reads stdin), :94 (-o), :93 (--target-versions), :87-89 (--ignore-*); exit codes pkg/api/output.go:333-341; shape in references/sources.md"
  out: tools/pluto.json
  timeout: 60
- id: kubent
  unit: workload-tools
  type: tool
  tool: kubent
  # --log-level=debug: the per-List lines `Retrieving: <gvr>` and `Failed to retrieve: <gvr>: <err>` (pkg/collector/cluster.go:121,124@0.7.3) are Debug, the default level is Info
  # (pkg/config/config.go:38); their difference is the read evidence lib/collection/collect counts (#132). The Helm v3 collector lists release Secrets, which the ClusterRole forbids; the cluster collector is enough.
  cmd: [kubent, --context, "{context}", -o, json, -t, "{k8s_next_minor_short}", --helm3=false, --log-level=debug]
  source: "kubent: pkg/config/config.go:45@0.7.3 (--context), :51 (-o), :54 (-t), :48 (--helm3), :53 (--log-level); exit 0 with [] when nothing is found or read (cmd/kubent/main.go:49-56, pkg/collector/cluster.go:119-125); shape in references/sources.md"
  out: tools/kubent.json
  timeout: 300
# Helm keeps each release record in a Secret (sh.helm.release.v1.<name>.v<n>), so `helm list` reads Secrets. kubegap stores only what list prints: name, namespace, status, revision, chart and app version, updated. User values (`helm get values`) are not collected: they often hold credentials. The shipped ClusterRole has no secrets permission, so with it this step fails and the Helm checks are skipped (lib/summaries/hygiene says why).
- id: helm-list
  unit: helm-releases
  type: tool
  tool: helm
  cmd: [helm, list, -A, -o, json, --kube-context, "{context}", --deployed, --failed, --pending, --uninstalling, --uninstalled]
  source: "helm: pkg/cmd/list.go:126-132@v4.3.1 (-A, --deployed, --failed, --pending, --uninstalling, --uninstalled), pkg/cli/environment.go:155 (--kube-context); the same flags in helm v3.22.1 cmd/helm/list.go:119-125; shape in references/sources.md"
  out: tools/helm-list.json
  timeout: 120
