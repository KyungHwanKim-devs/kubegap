# ---- Log agent fluent-bit. For clusters shipping to a non-Loki store (Elasticsearch, CloudWatch). No series when absent ----
- id: fluentbit_output_errors_1h
  why: Errors from fluent-bit outputs (ES, Loki, CloudWatch) in 1h. Logs are not being written to the store
  query: sum by (name) (increase(fluentbit_output_errors_total[1h])) > 0
  source:
    - "fluentbit_output_errors_total: fluent/fluent-bit src/flb_output.c:1141-1144@v3.0.4, :1651-1654@v5.1.5 (cmetrics counter, namespace fluentbit, subsystem output, label name = the output instance name, set to 0 at creation)"
- id: fluentbit_retries_failed_1h
  why: Chunks dropped after retries also failed. Those logs are a permanent gap
  query: sum by (name) (increase(fluentbit_output_retries_failed_total[1h])) > 0
  source:
    - "fluentbit_output_retries_failed_total: fluent/fluent-bit src/flb_output.c:1156-1161@v3.0.4, :1666-1671@v5.1.5 (label name; batches abandoned after the retry limit)"
- id: fluentbit_input_records_1h
  why: Log records read in 1h. 0 means the agent has stopped
  query: sum(increase(fluentbit_input_records_total[1h]))
  source:
    - "fluentbit_input_records_total: fluent/fluent-bit src/flb_input.c:968-970@v3.0.4, :1622-1624@v5.1.5 (cmetrics counter, namespace fluentbit, subsystem input, label name = the input instance name; served under the HTTP server's /api/v2/metrics/prometheus path src/http_server/api/v2/metrics.c:253@v3.0.4, :125@v5.1.5 only with the HTTP server on, which is off by default src/flb_config.c:251@v3.0.4, :354@v5.1.5)"
- id: fluentbit_dropped_records_1h
  why: Records dropped at the output stage
  query: sum by (name) (increase(fluentbit_output_dropped_records_total[1h])) > 0
  source:
    - "fluentbit_output_dropped_records_total: fluent/fluent-bit src/flb_output.c:1166-1169@v3.0.4, :1676-1679@v5.1.5 (label name)"

# ---------- 7-day p95 vs request/limit (measuring the gap between requests and actual usage) ----------
# The subquery [7d:15m] samples 7 days at 15-minute steps (672 points). Takes roughly 2-12 seconds on clusters with ~150k series. Pods younger than a day (kube_pod_created) are excluded.
- id: cpu_request_p95_ratio_7d
  why: Container 7-day CPU p95 usage / request. Below 0.3 is over-allocation (node cost); only requests >= 100m and pods older than 1 day
  query: >
    topk(300, quantile_over_time(0.95, (sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])))[7d:15m])
      / on (namespace, pod, container) (kube_pod_container_resource_requests{resource="cpu"} >= 0.1)
      and on (namespace, pod) (time() - kube_pod_created > 86400))
  source:
    - "container_cpu_usage_seconds_total: google/cadvisor metrics/prometheus.go:164@v0.51.0, :169@v0.52.1, :169@v0.53.0, lib/metrics/prometheus.go:180@v0.60.5 (the versions kubernetes/kubernetes go.mod pins: :38@v1.32.13 v0.51.0, :35@v1.33.5 v0.52.1, :32@v1.37.2 lib v0.60.5; served by the kubelet at /metrics/cadvisor pkg/kubelet/server/server.go:98@v1.32.13, :102@v1.33.5, :112@v1.37.2)"
    - "kube_pod_container_resource_requests: kubernetes/kube-state-metrics internal/store/pod.go:231@v2.10.1, :234@v2.17.0, :243@v2.20.0 (labels container, node, resource, unit :282@v2.10.1, :285@v2.17.0, :294@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "kube_pod_created: kubernetes/kube-state-metrics internal/store/pod.go:554@v2.10.1, :583@v2.17.0, :592@v2.20.0 (default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "label container, pod, namespace, id on container_* series: kubernetes/kubernetes pkg/kubelet/server/server.go:1162,1189-1194@v1.32.13, :1199,1226-1231@v1.33.5, :1462,1489-1494@v1.37.2 (the kubelet's container label function, not cAdvisor, sets pod, namespace and container from the pod the cgroup belongs to; id is cAdvisor's LabelID, google/cadvisor metrics/prometheus.go:1789@v0.51.0, :1842@v0.52.1, lib/metrics/prometheus.go:2205@v0.60.5; the kubelet serves these names because it includes the CPU, memory, network and OOM metric sets, pkg/kubelet/cadvisor/cadvisor_linux.go:85-93@v1.32.13, :87-95@v1.33.5, :94-100@v1.37.2, and cAdvisor emits each name inside the matching includedMetrics.Has block, google/cadvisor metrics/prometheus.go:137,371,772,1738@v0.51.0, :142,376,777,1743@v0.52.1, :142,376,777,1743@v0.53.0, lib/metrics/prometheus.go:147,444,1063,2086@v0.60.5)"
