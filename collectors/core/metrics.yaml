# core PromQL list (the basic queries plus supporting ones). Output metrics/<id>.json.
# Each item: id, query, why (for humans), limit (topk cap, optional), source (see below). Queries are instant queries.
# source: one entry per metric name the query reads, `<name>: <owner>/<repo> <file>:<line>@<tag>, :<line>@<tag>, ... (labels, default state)`, read in that
# project's source, plus one entry per label that the scrape configuration sets rather than the exporter (instance, node on kubelet series, the pod labels on
# cAdvisor series). Versions read (#121): node-exporter v1.7.0, v1.10.2, v1.12.1; kube-state-metrics v2.10.1, v2.11.0 to v2.16.0 (endpoint.go), v2.17.0, v2.20.0;
# kubelet v1.32.13, v1.33.5, v1.37.2; cAdvisor v0.51.0, v0.52.1, v0.53.0, lib v0.60.5. Every cited name exists with the labels the query filters on at every
# version read unless its entry says otherwise. tests/test_sources.py requires the list on every query that reads a node_, container_, kubelet_ or kube_ name.
# #122 added the apiserver names, read at kubernetes/kubernetes v1.30.14, v1.31.14, v1.32.0, v1.32.13, v1.33.0, v1.33.5, v1.33.13, v1.34.13, v1.35.10, v1.36.6, v1.37.2, and the two
# CoreDNS names of this file (CoreDNS v1.10.1, v1.11.0, v1.11.1, v1.11.3, v1.12.3, v1.14.6, v1.15.0). Every apiserver query filters job="{apiserver_job}": on k3s the kubelet scrape serves the
# same apiserver series a second time (one process, one registry), so a sum without the filter doubled. The Prometheus, Alertmanager, Loki, Promtail, Fluent Bit, Grafana (#123) names are not read yet.
- id: cpu_throttle_ratio_5m
  why: CFS throttling ratio: the share of 100ms periods in which a container with a limit was stalled. Above 0.25 latency spikes (Buffer and Omio postmortems). The usual formula aggregates by (namespace, pod); here it is split down to container, because telling sidecars from app containers is what says which limit to fix. The first-pass evaluation judges this per container as is
  query: >
    topk(200, sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m]))
      / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=""}[5m])) > 0.01)
  source:
    - "container_cpu_cfs_throttled_periods_total: google/cadvisor metrics/prometheus.go:203@v0.51.0, :208@v0.52.1, :208@v0.53.0, lib/metrics/prometheus.go:225@v0.60.5 (the versions kubernetes/kubernetes go.mod pins: :38@v1.32.13 v0.51.0, :35@v1.33.5 v0.52.1, :32@v1.37.2 lib v0.60.5; served by the kubelet at /metrics/cadvisor pkg/kubelet/server/server.go:98@v1.32.13, :102@v1.33.5, :112@v1.37.2)"
    - "container_cpu_cfs_periods_total: google/cadvisor metrics/prometheus.go:191@v0.51.0, :196@v0.52.1, :196@v0.53.0, lib/metrics/prometheus.go:210@v0.60.5 (the versions kubernetes/kubernetes go.mod pins: :38@v1.32.13 v0.51.0, :35@v1.33.5 v0.52.1, :32@v1.37.2 lib v0.60.5; served by the kubelet at /metrics/cadvisor pkg/kubelet/server/server.go:98@v1.32.13, :102@v1.33.5, :112@v1.37.2)"
    - "label container, pod, namespace, id on container_* series: kubernetes/kubernetes pkg/kubelet/server/server.go:1162,1189-1194@v1.32.13, :1199,1226-1231@v1.33.5, :1462,1489-1494@v1.37.2 (the kubelet's container label function, not cAdvisor, sets pod, namespace and container from the pod the cgroup belongs to; id is cAdvisor's LabelID, google/cadvisor metrics/prometheus.go:1789@v0.51.0, :1842@v0.52.1, lib/metrics/prometheus.go:2205@v0.60.5; the kubelet serves these names because it includes the CPU, memory, network and OOM metric sets, pkg/kubelet/cadvisor/cadvisor_linux.go:85-93@v1.32.13, :87-95@v1.33.5, :94-100@v1.37.2, and cAdvisor emits each name inside the matching includedMetrics.Has block, google/cadvisor metrics/prometheus.go:137,371,772,1738@v0.51.0, :142,376,777,1743@v0.52.1, :142,376,777,1743@v0.53.0, lib/metrics/prometheus.go:147,444,1063,2086@v0.60.5)"
- id: cpu_throttle_ratio_24h
  why: The same ratio over 24 hours, weighted by the periods each hour ran. The 5-minute value says "now", this one says "through the day"; resources.cpu-throttling fails only on this one and warns on a 5-minute spike alone
  query: >
    topk(500, sum by (namespace, pod, container) (increase(container_cpu_cfs_throttled_periods_total{container!=""}[24h]))
      / sum by (namespace, pod, container) (increase(container_cpu_cfs_periods_total{container!=""}[24h])) > 0.001)
  source:
