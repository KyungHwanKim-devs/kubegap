    sum by (node) (kube_pod_container_resource_requests{resource="cpu"} * on (namespace, pod) group_left() max by (namespace, pod) (kube_pod_status_phase{phase="Running"}))
      / sum by (node) (kube_node_status_allocatable{resource="cpu"})
