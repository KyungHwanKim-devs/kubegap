    - "nginx_ingress_controller_request_duration_seconds_bucket: kubernetes/ingress-nginx internal/ingress/metric/collectors/socket.go:199@controller-v1.14.0, :199@controller-v1.15.1 (the histogram's _bucket series, labels status, method, path, namespace, ingress, service, canary socket.go:89-99, host when enabled :133, and le; namespace internal/ingress/metric/collectors/main.go:20; the exporter's namespace arrives as exported_namespace, prometheus/prometheus scrape/scrape.go:592,605@v2.49.1, :716,729@v3.7.3, :690,703@v3.15.1)"
- id: coredns_servfail_ratio_1h
  # A rate of a series that never existed is empty, so without `or vector(0)` a cluster that never answered SERVFAIL had no ratio at all instead of 0; the result is still empty when there are no CoreDNS metrics (empty denominator).
  why: CoreDNS SERVFAIL ratio (1h). Upstream or plugin trouble. Above 0.01 applications see DNS delays and failures
  query: (sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[1h])) or vector(0)) / sum(rate(coredns_dns_responses_total[1h]))
  source:
    - "coredns_dns_responses_total: coredns/coredns plugin/metrics/vars/vars.go:53@v1.10.1, :53@v1.11.0, :53@v1.11.1, :56@v1.11.3, :56@v1.12.3, :56@v1.14.6, :56@v1.15.0 (counter; labels server, zone, view, rcode, plugin plugin/metrics/vars/vars.go:55@v1.10.1, :55@v1.11.0, :55@v1.11.1, :58@v1.11.3, :58@v1.12.3, :58@v1.14.6, :58@v1.15.0; a sum over rcode collapses the plugin label; a rate of an rcode that never occurred is empty, so the SERVFAIL ratio query adds or vector(0) to its numerator)"
- id: coredns_p99_1h
  why: CoreDNS request p99 (seconds, 1h). Near 5s is the UDP conntrack race; above 0.1s is CoreDNS overload or upstream latency
  query: histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket[1h])))
  source:
    - "coredns_dns_request_duration_seconds_bucket: coredns/coredns plugin/metrics/vars/vars.go:22@v1.10.1, :22@v1.11.0, :22@v1.11.1, :22@v1.11.3, :22@v1.12.3, :22@v1.14.6, :22@v1.15.0 (histogram coredns_dns_request_duration_seconds; labels server, zone, view plugin/metrics/vars/vars.go:25@v1.10.1, :25@v1.11.0, :25@v1.11.1, :26@v1.11.3, :26@v1.12.3, :26@v1.14.6, :26@v1.15.0; the query reads _bucket with le)"
- id: endpoint_not_ready_addresses
  # kube_endpoint_address_not_ready existed until kube-state-metrics 2.13 (internal/store/endpoint.go:148@v2.13.0) and is gone since 2.14.0; the ready="false" series of kube_endpoint_address list the same addresses at every version read, except that since 2.14.0 there is one series per address and port (none for a subset without ports), so the inner count collapses the ports. The old gauge was addresses times ports too (endpoint.go:155-157@v2.10.1).
  why: Endpoints with not-ready addresses behind a Service (pods failing readiness are out of traffic)
  query: count by (namespace, endpoint) (count by (namespace, endpoint, ip) (kube_endpoint_address{ready="false"}))
  source:
    - "kube_endpoint_address: kubernetes/kube-state-metrics internal/store/endpoint.go:168@v2.10.1, :168@v2.13.0, :127@v2.14.0, :127@v2.17.0, :127@v2.20.0 (label ready is true for the subset's ready addresses and false for its notReadyAddresses :176-188@v2.10.1, :134-153@v2.14.0; label ip at every version read; since 2.14.0 there is one series per address and port, :136-153@v2.14.0, with port_protocol, port_number, port_name, so an address count has to count distinct ip, and a subset without ports has no series at all while 2.10.1 to 2.13.0 emit one per address; default labels namespace, endpoint internal/store/endpoint.go:40@v2.10.1, :40@v2.14.0, :40@v2.17.0, :40@v2.20.0)"

# ---------- Structure and hygiene ----------
- id: apiserver_requested_deprecated_apis
  why: Deprecated APIs still being called (group, version, resource, removal release). Pluto looks at stored objects; this metric looks at calls
  query: sum by (group, version, resource, removed_release) (apiserver_requested_deprecated_apis{job="{apiserver_job}"})
  source:
    - "apiserver_requested_deprecated_apis: kubernetes/kubernetes staging/src/k8s.io/apiserver/pkg/endpoints/metrics/metrics.go:69@v1.30.14, :69@v1.31.14, :69@v1.32.0, :69@v1.32.13, :69@v1.33.0, :69@v1.33.5, :69@v1.33.13, :69@v1.34.13, :69@v1.35.10, :67@v1.36.6, :67@v1.37.2 (STABLE gauge, 1 for every deprecated API called since the apiserver started; labels group, version, resource, subresource, removed_release staging/src/k8s.io/apiserver/pkg/endpoints/metrics/metrics.go:73@v1.30.14 to v1.35.10, :71@v1.36.6, :71@v1.37.2; removed_release is empty for an API deprecated without a removal release; name prefix from APIServerComponent = "apiserver" staging/src/k8s.io/apiserver/pkg/endpoints/metrics/metrics.go:53@v1.30.14, :51@v1.36.6, :51@v1.37.2)"
    - "label job on apiserver series: prometheus-community/helm-charts charts/kube-prometheus-stack/templates/exporters/kube-api-server/servicemonitor.yaml:41@kube-prometheus-stack-56.0.0, :41@kube-prometheus-stack-79.5.0 (jobLabel component, charts/kube-prometheus-stack/values.yaml:1163@kube-prometheus-stack-56.0.0, :1561@kube-prometheus-stack-79.5.0, read from the kubernetes Service of the default namespace, whose component=apiserver label the apiserver writes itself, kubernetes/kubernetes pkg/controlplane/controller/kubernetesservice/controller.go:226@v1.30.14, :230@v1.33.5, :230@v1.37.2; the prometheus-operator turns a ServiceMonitor jobLabel into the job label, prometheus-operator/prometheus-operator pkg/prometheus/promcfg.go:1373-1376@v0.71.0, :2063-2066@v0.86.2; on k3s the apiserver, kubelet and kube-proxy run in one process with one metrics registry, k3s-io/k3s pkg/daemons/executor/embed.go:77,99,126@v1.33.5+k3s1, so the kubelet scrape (job=kubelet) serves every apiserver series a second time and a sum without the job filter doubles; since #140 the name is read from config.yaml (apiserver_job) or detected per run from apiserver_request_total, so another job name is found rather than leaving these queries empty)"
