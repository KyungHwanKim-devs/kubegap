    - "label container, pod, namespace, id on container_* series: kubernetes/kubernetes pkg/kubelet/server/server.go:1162,1189-1194@v1.32.13, :1199,1226-1231@v1.33.5, :1462,1489-1494@v1.37.2 (the kubelet's container label function, not cAdvisor, sets pod, namespace and container from the pod the cgroup belongs to; id is cAdvisor's LabelID, google/cadvisor metrics/prometheus.go:1789@v0.51.0, :1842@v0.52.1, lib/metrics/prometheus.go:2205@v0.60.5; the kubelet serves these names because it includes the CPU, memory, network and OOM metric sets, pkg/kubelet/cadvisor/cadvisor_linux.go:85-93@v1.32.13, :87-95@v1.33.5, :94-100@v1.37.2, and cAdvisor emits each name inside the matching includedMetrics.Has block, google/cadvisor metrics/prometheus.go:137,371,772,1738@v0.51.0, :142,376,777,1743@v0.52.1, :142,376,777,1743@v0.53.0, lib/metrics/prometheus.go:147,444,1063,2086@v0.60.5)"
- id: oomkilled_last_terminated
  why: Containers whose last termination reason was OOMKilled. Memory limit too small or a leak
  query: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
  source:
    - "kube_pod_container_status_last_terminated_reason: kubernetes/kube-state-metrics internal/store/pod.go:327@v2.10.1, :330@v2.17.0, :339@v2.20.0 (labels container, reason :337@v2.10.1, :340@v2.17.0, :349@v2.20.0, a series only while the container has a last terminated state; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: oom_events_7d
  why: How many times a container was OOM-killed in 7 days (increase of cAdvisor container_oom_events_total). "Last termination reason" shows only one event; this is the frequency
  # For runtimes where the cAdvisor counter is empty (cgroup v1 etc.), also count 7-day restarts of containers whose last termination reason is OOMKilled
  query: >
    (sum by (namespace, pod, container) (increase(container_oom_events_total{container!="", container!="POD"}[7d])) > 0)
      or (sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[7d])) and on (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1))
  source:
    - "container_oom_events_total: google/cadvisor metrics/prometheus.go:1740@v0.51.0, :1745@v0.52.1, :1745@v0.53.0, lib/metrics/prometheus.go:2088@v0.60.5 (the versions kubernetes/kubernetes go.mod pins: :38@v1.32.13 v0.51.0, :35@v1.33.5 v0.52.1, :32@v1.37.2 lib v0.60.5; served by the kubelet at /metrics/cadvisor pkg/kubelet/server/server.go:98@v1.32.13, :102@v1.33.5, :112@v1.37.2)"
    - "kube_pod_container_status_restarts_total: kubernetes/kube-state-metrics internal/store/pod.go:403@v2.10.1, :432@v2.17.0, :441@v2.20.0 (label container :412@v2.10.1, :441@v2.17.0, :450@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "kube_pod_container_status_last_terminated_reason: kubernetes/kube-state-metrics internal/store/pod.go:327@v2.10.1, :330@v2.17.0, :339@v2.20.0 (labels container, reason :337@v2.10.1, :340@v2.17.0, :349@v2.20.0, a series only while the container has a last terminated state; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "label container, pod, namespace, id on container_* series: kubernetes/kubernetes pkg/kubelet/server/server.go:1162,1189-1194@v1.32.13, :1199,1226-1231@v1.33.5, :1462,1489-1494@v1.37.2 (the kubelet's container label function, not cAdvisor, sets pod, namespace and container from the pod the cgroup belongs to; id is cAdvisor's LabelID, google/cadvisor metrics/prometheus.go:1789@v0.51.0, :1842@v0.52.1, lib/metrics/prometheus.go:2205@v0.60.5; the kubelet serves these names because it includes the CPU, memory, network and OOM metric sets, pkg/kubelet/cadvisor/cadvisor_linux.go:85-93@v1.32.13, :87-95@v1.33.5, :94-100@v1.37.2, and cAdvisor emits each name inside the matching includedMetrics.Has block, google/cadvisor metrics/prometheus.go:137,371,772,1738@v0.51.0, :142,376,777,1743@v0.52.1, :142,376,777,1743@v0.53.0, lib/metrics/prometheus.go:147,444,1063,2086@v0.60.5)"
- id: oom_pods_7d
  why: Every container that ended with OOMKilled at any time in 7 days and restarted in the window, including pods a rollout has since replaced, with the 7-day restart increase of that pod; a pod whose last OOM is older than the window keeps the reason label but has no restart in it and is left out. resources.oomkilled-repeated counts a workload's OOM history from this, not from the pods alive at collection time
  query: >
    (sum by (namespace, pod, uid, container) (increase(kube_pod_container_status_restarts_total[7d])) > 0.5)
      and on (namespace, pod, uid, container) (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[7d]) == 1)
  source:
    - "kube_pod_container_status_restarts_total: kubernetes/kube-state-metrics internal/store/pod.go:403@v2.10.1, :432@v2.17.0, :441@v2.20.0 (label container :412@v2.10.1, :441@v2.17.0, :450@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "kube_pod_container_status_last_terminated_reason: kubernetes/kube-state-metrics internal/store/pod.go:327@v2.10.1, :330@v2.17.0, :339@v2.20.0 (labels container, reason :337@v2.10.1, :340@v2.17.0, :349@v2.20.0, a series only while the container has a last terminated state; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: pod_info_7d
  why: uid, node and owner of the pods in oom_pods_7d, replaced ones included. The kernel's oom-kill line names the pod by uid, and this is how a uid of a pod that no longer exists is mapped back to its workload
  query: >
    last_over_time(kube_pod_info[7d])
      and on (namespace, pod) (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[7d]) == 1)
  source:
    - "kube_pod_info: kubernetes/kube-state-metrics internal/store/pod.go:604@v2.10.1, :633@v2.17.0, :642@v2.20.0 (labels host_ip, pod_ip, node, created_by_kind, created_by_name, priority_class, host_network :623@v2.10.1, :652@v2.17.0, :661@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "kube_pod_container_status_last_terminated_reason: kubernetes/kube-state-metrics internal/store/pod.go:327@v2.10.1, :330@v2.17.0, :339@v2.20.0 (labels container, reason :337@v2.10.1, :340@v2.17.0, :349@v2.20.0, a series only while the container has a last terminated state; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: nodes_seen_1d
  why: Every node-exporter instance seen in the last 24 hours with its node name and the time of its last sample. A node here but not in inventory.json left the cluster within the window; its remaining series are not judged by the node checks and the summary lists it under nodes.gone_24h
  query: last_over_time(timestamp(node_uname_info)[1d:1m])   # timestamp() of each sample, then the last one in the day: the time the node was last scraped. timestamp(last_over_time(...)) would return the evaluation time
  source:
    - "node_uname_info: prometheus/node_exporter collector/uname.go:26@v1.7.0, :27@v1.10.2, :25@v1.12.1 (label nodename :33@v1.7.0, :34@v1.10.2, :32@v1.12.1; uname collector, on by default: collector/uname.go:52@v1.7.0, :53@v1.10.2, :51@v1.12.1)"
- id: restarts_24h
  why: Top restart counts over 24h. A combined signal of CrashLoop, OOM and probe failures
  query: topk(50, sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[24h])) > 0)
  source:
    - "kube_pod_container_status_restarts_total: kubernetes/kube-state-metrics internal/store/pod.go:403@v2.10.1, :432@v2.17.0, :441@v2.20.0 (label container :412@v2.10.1, :441@v2.17.0, :450@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: restarts_7d
  why: Top restart counts over 7d. Intermittent restarts do not show in a 24h window
  query: topk(50, sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[7d])) > 0)
  source:
    - "kube_pod_container_status_restarts_total: kubernetes/kube-state-metrics internal/store/pod.go:403@v2.10.1, :432@v2.17.0, :441@v2.20.0 (label container :412@v2.10.1, :441@v2.17.0, :450@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: qos_class_counts
  why: Pod count per QoS class. BestEffort pods in production die first under node pressure
  query: sum by (qos_class) (kube_pod_status_qos_class == 1)
  source:
