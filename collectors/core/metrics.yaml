    - "kubelet_pleg_relist_duration_seconds_bucket: kubernetes/kubernetes pkg/kubelet/metrics/metrics.go:50,322@v1.32.13, :50,330@v1.33.5, :52,414@v1.37.2 (histogram PLEGRelistDuration, so _bucket with le; subsystem kubelet pkg/kubelet/metrics/metrics.go:34@v1.32.13, :34@v1.33.5, :36@v1.37.2)"
    - "label node on kubelet_* series: prometheus-operator/prometheus-operator pkg/prometheus/promcfg.go:1310-1314@v0.71.0, :2000-2004@v0.86.2 (for every ServiceMonitor target the operator relabels __meta_kubernetes_endpoint_address_target_kind;name = Node;<name> into node), the meta labels come from Prometheus's endpoints discovery, prometheus/prometheus discovery/kubernetes/endpoints.go:254,285-287@v2.49.1, :331,366-368@v3.7.3 (set from the address's targetRef), and pkg/kubelet/controller.go:155@v0.71.0, :290,303@v0.86.2 (the kubelet Endpoints the operator writes carry targetRef kind Node); the two operator versions are what kube-prometheus-stack 56.0.0 and 79.5.0 pin, prometheus-community/helm-charts charts/kube-prometheus-stack/Chart.yaml:27@kube-prometheus-stack-56.0.0, :36@kube-prometheus-stack-79.5.0; a scrape configuration that does not set node leaves the on (node) match with nothing to match, so the query is empty"
- id: node_network_errors_5m
  why: NIC receive errors and transmit drops. Non-zero means driver, MTU or overlay trouble
  query: >
    (sum by (instance, device) (rate(node_network_receive_errs_total{device!~"lo|veth.*|cali.*|flannel.*|cni.*|docker.*"}[5m]))
      + sum by (instance, device) (rate(node_network_transmit_drop_total{device!~"lo|veth.*|cali.*|flannel.*|cni.*|docker.*"}[5m]))) > 0
  source:
    - "node_network_receive_errs_total: prometheus/node_exporter collector/netdev_linux.go:112,168@v1.7.0, :113,169@v1.10.2, :112,168@v1.12.1 (reader key receive_errors; legacy() renames it to receive_errs at collector/netdev_common.go:194-195@v1.7.0, :209-210@v1.10.2, :211-212@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "node_network_transmit_drop_total: prometheus/node_exporter collector/netdev_linux.go:115,177@v1.7.0, :116,178@v1.10.2, :115,177@v1.12.1 (reader key transmit_dropped; legacy() renames it to transmit_drop at collector/netdev_common.go:212-213@v1.7.0, :227-228@v1.10.2, :229-230@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "label instance: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none, so on node-exporter series it is <node IP>:9100, which lib/judgement/evaluate and the summaries map to the node by IP; a scrape config that relabels instance changes this)"
