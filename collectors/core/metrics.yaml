# ---------- Scaling ----------
- id: hpa_at_min_ratio_15d
  why: Share of the last 15 days the current replicas sat at min. Above 0.99 with max > min the HPA never moved (wrong target or over-requesting)
  query: >
    avg_over_time((kube_horizontalpodautoscaler_status_current_replicas == bool on (namespace, horizontalpodautoscaler) kube_horizontalpodautoscaler_spec_min_replicas)[15d:5m])
  source:
    - "kube_horizontalpodautoscaler_status_current_replicas: kubernetes/kube-state-metrics internal/store/horizontalpodautoscaler.go:303@v2.10.1, :305@v2.17.0, :335@v2.20.0 (default labels namespace, horizontalpodautoscaler internal/store/horizontalpodautoscaler.go:51@v2.10.1, :51@v2.17.0, :51@v2.20.0)"
    - "kube_horizontalpodautoscaler_spec_min_replicas: kubernetes/kube-state-metrics internal/store/horizontalpodautoscaler.go:166@v2.10.1, :168@v2.17.0, :170@v2.20.0 (default labels namespace, horizontalpodautoscaler internal/store/horizontalpodautoscaler.go:51@v2.10.1, :51@v2.17.0, :51@v2.20.0)"
- id: hpa_desired_changes_7d
  why: How often desired replicas changed in 7 days. Dozens means flapping (up and down in short cycles). Happens without behavior stabilization
  query: changes(kube_horizontalpodautoscaler_status_desired_replicas[7d])
  source:
    - "kube_horizontalpodautoscaler_status_desired_replicas: kubernetes/kube-state-metrics internal/store/horizontalpodautoscaler.go:322@v2.10.1, :324@v2.17.0, :354@v2.20.0 (default labels namespace, horizontalpodautoscaler internal/store/horizontalpodautoscaler.go:51@v2.10.1, :51@v2.17.0, :51@v2.20.0)"
- id: pod_pending_seconds
  why: Seconds since creation for pods Pending right now. Only above 60s. A sign that the node autoscaler is not making room
  query: >
    (time() - kube_pod_created) * on (namespace, pod) group_left() (kube_pod_status_phase{phase="Pending"} == 1) > 60
  source:
    - "kube_pod_created: kubernetes/kube-state-metrics internal/store/pod.go:554@v2.10.1, :583@v2.17.0, :592@v2.20.0 (default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
    - "kube_pod_status_phase: kubernetes/kube-state-metrics internal/store/pod.go:1305@v2.10.1, :1339@v2.17.0, :1504@v2.20.0 (label phase :1334@v2.10.1, :1368@v2.17.0, :1533@v2.20.0; default labels namespace, pod, uid internal/store/pod.go:39@v2.10.1, :39@v2.17.0, :41@v2.20.0)"
- id: keda_scaler_errors_24h
  # keda_scaler_detail_errors_total exists since KEDA 2.14.0 with namespace and scaledObject; the older keda_scaler_errors_total (gone in 2.17.0) is a total with no labels at any version, so the `or` branch that read it could never name a ScaledObject and, on 2.14 to 2.16, added one unattributable row.
  why: KEDA scaler (trigger) failures reading external metrics per ScaledObject (24h), KEDA 2.14.0 and later. No series when KEDA is not scraped by Prometheus or older than 2.14
  query: sum by (namespace, scaledObject) (increase(keda_scaler_detail_errors_total[24h]) > 0)
  source:
    - "keda_scaler_detail_errors_total: kedacore/keda pkg/metricscollector/prommetrics.go:116@v2.14.0, :116@v2.16.0, :84@v2.17.2, :85@v2.21.0 (labels namespace, metric, scaledObject, scaler, triggerIndex, type; since 2.14.0; collectors/keda/pod-metrics.yaml)"

