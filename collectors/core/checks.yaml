- id: resilience.cronjob-runtime-exceeds-interval
  name: CronJob run time is close to or exceeds its interval (overlap or slippage)
  area: resilience
  type: summary
  each: resilience.cronjobs.rows
  rule:
    expr: "(item['runtime_over_interval'] or 0) >= 1.0 and item['concurrency_policy'] == 'Allow' and not item['suspend']"
    warn_expr: "(item['runtime_over_interval'] or 0) >= 0.5 and not item['suspend']"
  target: "item['target']"
  evidence: "f\"{item['target']}: schedule '{item['schedule']}' (about {item['interval_h']}h), recent Job max {item['max_job_duration_s']}s / median {item['median_job_duration_s']}s = {item['runtime_over_interval']}x the interval ({item['jobs_timed']} measured), concurrencyPolicy {item['concurrency_policy']}, active Jobs {item['active_jobs']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If one run takes longer than the interval it overlaps the next. With concurrencyPolicy Allow, Jobs pile up (two DB dumps eating disk and CPU at once) and pressure the node; with Forbid, runs are skipped quietly and "the hourly job" runs every two hours.
    Measured on a k3s k3s: a watchdog CronJob on a 1-minute schedule ran for 52s (0.87) — any slowdown makes it overlap.
  suggest: "Lengthen the interval or split the work. If Allow, switch to Forbid or Replace and set activeDeadlineSeconds."
  verify:
    - "kubectl get jobs -n <ns> -l <cronjob label> -o custom-columns=NAME:.metadata.name,START:.status.startTime,END:.status.completionTime"
