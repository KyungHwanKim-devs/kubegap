- id: node.cri-exited-containers
  name: Many exited containers piled up (repeated restarts or lagging GC)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "(item['cri'].get('states') or {}).get('Exited', 0) >= 100"
    warn_expr: "(item['cri'].get('states') or {}).get('Exited', 0) >= 30"
  target: "item['node']"
  evidence: "f\"crictl ps -a: Running {(item['cri'].get('states') or {}).get('Running')}, Exited {(item['cri'].get('states') or {}).get('Exited')}, Unknown {(item['cri'].get('states') or {}).get('Unknown')}. {item['cri'].get('images')} images, {item['cri'].get('imagefs_used_gb')}GB\""
  severity_default: medium
  symptom_linked: false
  why: The kubelet keeps only one exited container per pod (maxPerPodContainer) and deletes the rest. Dozens piled up means many CrashLooping pods or GC falling behind, and they eat disk and inodes.
