- id: tenancy.tenant-without-limitrange
  name: Tenant namespace has no LimitRange and has containers without requests
  area: tenancy
  type: summary
  each: tenancy.namespaces.rows
  rule:
    expr: "(item['prod'] and not item['has_limitrange'] and item['containers_without_requests'] > 0) and (item['multi_org'] or item['cluster_saturated_7d'])"
    warn_expr: "(item['kind'] in ('prod', 'dev', 'ci') and not item['has_limitrange'] and item['containers_without_requests'] > 0) or (item['prod'] and not item['has_limitrange'] and item['containers_without_requests'] > 0)"
  target: "item['namespace']"
  evidence: "f\"{item['namespace']} ({item['kind']}): no LimitRange, containers without requests {item['containers_without_requests']} / without a memory limit {item['containers_without_memory_limit']} (pods {item['pods']}). 7d CPU p95 {item['cpu_p95_7d']} cores, memory p95 {item['memory_p95_7d_gb']}GB\""
  severity_default: medium
  symptom_linked: false
  why: >
    If all tenants belong to one organization (a single human owner) and there was no node saturation in 7 days, it is not urgent, so warn. With signs of multiple organizations (two or more Users/Groups in RoleBindings) or node saturation, fail.
    A container without requests is BestEffort: first to be evicted under node pressure, and the scheduler treats the pod as weighing 0 and packs it onto one node. A LimitRange per tenant lets the namespace fill in the requests and limits developers forgot.
    Unlike the resources-area checks that look at each container, this check asks whether the tenant enforces that discipline.
  suggest: "Put one LimitRange (defaultRequest, default, max) into the tenant namespace template (Argo CD ApplicationSet, shared Helm chart)."
  verify:
    - "kubectl get limitrange -A ; kubectl get pods -n <ns> -o json | jq '[.items[].spec.containers[] | select(.resources.requests == null)] | length'"
