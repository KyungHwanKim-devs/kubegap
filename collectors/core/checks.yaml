- id: storage.pvc-inode-high
  name: PVC inode usage high
  area: storage
  type: summary
  each: storage.pvcs.rows
  rule:
    expr: "item['metrics'] and not item['host_fs'] and (item['inode_ratio'] or 0) >= 0.85"
    warn_expr: "item['metrics'] and not item['host_fs'] and (item['inode_ratio'] or 0) >= 0.75"
  target: "item['target']"
  evidence: "f\"inode usage {item['inode_ratio']} (capacity usage {item['used_ratio']}), workloads {item['workloads']}\""
