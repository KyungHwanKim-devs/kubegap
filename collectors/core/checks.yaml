- id: traffic.alb-unhealthy-targets
  name: ALB/NLB target group has unhealthy targets (health check failing)
  area: traffic
  type: summary
  each: traffic.alb.unhealthy_target_groups
  rule:
    expr: "bool(item['targets_unhealthy']) and (item.get('targets_healthy') or 0) == 0"
    warn_expr: "True"
  target: "item['target']"
  evidence: "f\"Target group {item['name']} ({item['lb_type']}, port {item['port']}): healthy {item.get('targets_healthy')} of {item.get('targets_total')} targets, unhealthy {item['unhealthy_reasons']}, 24h UnHealthyHostCount max {item.get('unhealthy_max_24h')}, health check {item.get('health_check', {}).get('path')} expected codes {item.get('health_check', {}).get('matcher')}, backends {item.get('workloads')}\""
  severity_default: high
  symptom_linked: true
  why: >
    The ALB does not route to targets its own health check marks unhealthy. If some are unhealthy, load piles onto the rest; **if all are unhealthy it fails open and routes to all of them** (not a 503 — measured on a real EKS cluster, a frontend whose targets were all unhealthy still served 17,213 requests. So this is not "an outage" but "a health check that filters nothing"). It is separate from Kubernetes readiness, so a pod can be Ready yet excluded by the ALB.
    Measured on a real EKS cluster: 6 target groups with Target.ResponseCodeMismatch — the health check path returned 404 or 307 (no healthcheck-path annotation, so '/', and the app redirects to login). With a single replica the service stops when that one target is excluded.
  suggest: "Add `alb.ingress.kubernetes.io/healthcheck-path: /healthz` (a path that returns 200) and `success-codes: 200-399` to the Ingress. If the app has no health endpoint, create one."
  verify:
    - "aws elbv2 describe-target-health --target-group-arn <arn>"
    - "kubectl get ingress -n <ns> <name> -o jsonpath='{.metadata.annotations}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          name: "k8s-tg"
          lb: "k8s-alb"
          lb_type: "application"
          port: 8080
          protocol: "HTTP"
          target_type: "ip"
          namespace: "prod-a"
          service: "web"
          workloads:
            - "deployment/web"
          health_check:
            path: "/"
            matcher: "200"
          deregistration_delay_s: 300
          slow_start_s: 0
          backend_grace_s: 30
          backend_prestop: false
          targets_total: 1
          targets_healthy: 0
          targets_unhealthy:
            - id: "10.0.0.1"
              state: "unhealthy"
              reason: "Target.ResponseCodeMismatch"
              description: "404"
          unhealthy_reasons:
            Target.ResponseCodeMismatch: 404: 1
          requests_24h: 100
          target_5xx_24h: 0
          target_4xx_24h: 0
          target_5xx_ratio_24h: 0.0
          p95_s_max_1h: 0.2
          p95_s_avg: 0.1
          unhealthy_max_24h: 1
          healthy_min_24h: 1
          requests_per_target_24h: 100
          target: "prod-a/web"
          prod: true
      - expect: "warn"
        item:
          name: "k8s-tg"
          lb: "k8s-alb"
          lb_type: "application"
          port: 8080
          protocol: "HTTP"
          target_type: "ip"
          namespace: "prod-a"
          service: "web"
          workloads:
            - "deployment/web"
          health_check:
            path: "/"
            matcher: "200"
          deregistration_delay_s: 300
          slow_start_s: 0
          backend_grace_s: 30
          backend_prestop: false
          targets_total: 2
          targets_healthy: 1
          targets_unhealthy:
            - id: "10.0.0.1"
              state: "unhealthy"
              reason: "Target.Timeout"
              description: "t"
          unhealthy_reasons:
            Target.Timeout: t: 1
          requests_24h: 100
          target_5xx_24h: 0
          target_4xx_24h: 0
          target_5xx_ratio_24h: 0.0
          p95_s_max_1h: 0.2
          p95_s_avg: 0.1
          unhealthy_max_24h: 1
          healthy_min_24h: 1
          requests_per_target_24h: 100
          target: "prod-a/web"
          prod: true
      - expect: "none"

- id: traffic.alb-deregistration-vs-grace
  name: Target group deregistration delay is longer than the backend's termination grace (routing to terminating pods)
  area: traffic
  type: summary
  each: traffic.alb.target_groups
  rule:
    warn_expr: "item.get('backend_grace_s') is not None and (item.get('deregistration_delay_s') or 0) > item['backend_grace_s'] and item.get('backend_prestop') is False and item['lb_type'] == 'application'"
  target: "item['target']"
  evidence: "f\"Target group {item['name']}: deregistration_delay {item.get('deregistration_delay_s')}s, backends {item.get('workloads')} terminationGracePeriod {item.get('backend_grace_s')}s, no preStop\""
  severity_default: medium
  symptom_linked: true
  why: >
    When a pod is deleted the ALB controller takes a few seconds to deregister the target, and the ALB keeps sending to that pod meanwhile. If the pod closes its listener on SIGTERM immediately, those requests become 502s.
    The deregistration delay (default 300s) is how long the ALB keeps the target "draining"; the pod dies within terminationGracePeriod (default 30s). A preStop sleep of 5-10s plus the app finishing existing connections after SIGTERM is needed to make the two line up. The classic cause of a handful of 502s on every deploy.
  suggest: "On the Deployment: `lifecycle.preStop.exec.command: [sleep, \"10\"]` and terminationGracePeriodSeconds 45 or more. Target group annotation `alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30`."
  verify:
    - "aws elbv2 describe-target-group-attributes --target-group-arn <arn> | grep deregistration"
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds} {.spec.template.spec.containers[*].lifecycle}'"
  notes: warn only. The fail comes from resilience.no-prestop on the same workload (do not count twice — measured on an EKS cluster, all 18 production hits overlapped). This check adds the ALB-side number (deregistration delay) to the evidence
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          name: "k8s-tg"
          lb: "k8s-alb"
          lb_type: "application"
          port: 8080
          protocol: "HTTP"
          target_type: "ip"
          namespace: "prod-a"
          service: "web"
          workloads:
            - "deployment/web"
          health_check:
            path: "/"
            matcher: "200"
          deregistration_delay_s: 300
          slow_start_s: 0
          backend_grace_s: 30
          backend_prestop: false
          targets_total: 1
          targets_healthy: 1
          targets_unhealthy: []
          unhealthy_reasons: {}
          requests_24h: 100
          target_5xx_24h: 0
          target_4xx_24h: 0
          target_5xx_ratio_24h: 0.0
          p95_s_max_1h: 0.2
          p95_s_avg: 0.1
          unhealthy_max_24h: 0
          healthy_min_24h: 1
          requests_per_target_24h: 100
          target: "prod-a/web"
          prod: true
      - expect: "pass"
        item:
          name: "k8s-tg"
          lb: "k8s-alb"
          lb_type: "application"
          port: 8080
          protocol: "HTTP"
          target_type: "ip"
          namespace: "prod-a"
          service: "web"
          workloads:
            - "deployment/web"
          health_check:
            path: "/"
            matcher: "200"
          deregistration_delay_s: 300
          slow_start_s: 0
          backend_grace_s: 30
          backend_prestop: true
          targets_total: 1
          targets_healthy: 1
          targets_unhealthy: []
          unhealthy_reasons: {}
          requests_24h: 100
          target_5xx_24h: 0
          target_4xx_24h: 0
          target_5xx_ratio_24h: 0.0
          p95_s_max_1h: 0.2
          p95_s_avg: 0.1
          unhealthy_max_24h: 0
          healthy_min_24h: 1
          requests_per_target_24h: 100
          target: "prod-a/web"
          prod: true
      - expect: "pass"
        item:
          name: "k8s-tg"
          lb: "k8s-alb"
          lb_type: "application"
          port: 8080
          protocol: "HTTP"
          target_type: "ip"
          namespace: "prod-a"
          service: "web"
          workloads: []
          health_check:
            path: "/"
            matcher: "200"
          deregistration_delay_s: 300
          slow_start_s: 0
          backend_grace_s: null
          backend_prestop: false
          targets_total: 1
