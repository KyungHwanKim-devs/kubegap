      - expect: "none"

- id: resilience.single-replica-in-prod
  name: Production Deployments with replicas 1
  area: resilience
  type: object
  inputs: [objects/deployments.json]
  rule:
    expr: "prod and (spec.get('replicas') == 1) and not hpa_covers(obj)"
  evidence: "'replicas 1, no HPA'"
  severity_default: medium
  symptom_linked: true
  why: During rolling updates and node replacement (Karpenter consolidation, upgrades) the service disappears for that moment. If the node dies, it is down until recovery.
  suggest: replicas 2 or more plus a PDB with minAvailable 1. If it holds state, move to a StatefulSet with external storage.
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.replicas}'"
