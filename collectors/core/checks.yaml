- id: node.pod-logs-large
  name: Large pod log directory (relative to the log rotation cap)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.pod_logs
  rule:
    expr: "item['mb'] >= 1024"
    warn_expr: "item['mb'] >= 256"
  target: "item['workload']"
  evidence: "f\"node {item['node']} /var/log/pods/{item['namespace']}_{item['pod']} {item['mb']}MB (kubelet per-container cap {item['log_cap_mb']}MB = containerLogMaxSize x containerLogMaxFiles)\""
  severity_default: medium
  symptom_linked: false
  why: A directory far above the per-container log cap (default 10Mi x 5 = 50MB) means many containers or files left behind on every restart. It fills the node disk (nodefs) and triggers eviction. A high log volume also raises collector (Loki) cost.
  suggest: Reduce the log level or volume of that workload, or adjust containerLogMaxSize/Files. If the app also writes logs to files, unify on stdout.
  verify:
    - "sudo du -m -d 1 /var/log/pods | sort -rn | head"
  test:
    cases:
      - expect: "fail"
        item:
          node: "n1"
          namespace: "prod-a"
          pod: "web-1"
          workload: "prod-a/web"
          mb: 2048
          log_cap_mb: 50
      - expect: "warn"
        item:
          node: "n1"
          namespace: "prod-a"
          pod: "web-1"
          workload: "prod-a/web"
          mb: 300
          log_cap_mb: 50
      - expect: "pass"
        item:
          node: "n1"
          namespace: "prod-a"
          pod: "web-1"
          workload: "prod-a/web"
          mb: 10
          log_cap_mb: 50

- id: node.pod-dir-large
  name: Pod directories (emptyDir, ephemeral volumes) using much node disk
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.pod_dirs
  rule:
    expr: "item['mb'] >= 10240"
    warn_expr: "item['mb'] >= 2048"
  target: "item['workload'] if item.get('workload') else item['node'] + '/uid:' + item['uid'][:8]"
  evidence: "f\"node {item['node']} /var/lib/kubelet/pods/{item['uid']}/volumes/kubernetes.io~empty-dir {item['mb']}MB ({item.get('pod') or 'uid not in the current pod list = leftover that was not cleaned up'})\""
  severity_default: medium
  symptom_linked: false
  why: emptyDir uses the node root disk and is unbounded without sizeLimit. Model files, caches and uploads in emptyDir fill the node disk and get other pods evicted. A uid absent from the pod list is a leftover the kubelet could not delete.
  suggest: "Set sizeLimit on emptyDir and put large data in a PVC or in the image. For leftover uids, check the orphaned pod warnings in the kubelet log."
  verify:
    - "sudo du -m -d 1 /var/lib/kubelet/pods | sort -rn | head"
    - "kubectl get pods -A -o json | jq -r '.items[] | select(.metadata.uid==\"<uid>\") | .metadata.namespace+\"/\"+.metadata.name'"
  test:
    cases:
      - expect: "fail"
        item:
          node: "n1"
          uid: "2575bb27-aaaa-bbbb"
          namespace: "monitoring"
          pod: "prometheus-0"
          workload: "monitoring/prometheus"
          mb: 22530
      - expect: "warn"
        item:
          node: "n1"
          uid: "2575bb27-aaaa-bbbb"
          namespace: null
          pod: null
          workload: null
          mb: 3000
      - expect: "pass"
        item:
          node: "n1"
          uid: "x"
          namespace: "a"
          pod: "b"
          workload: "a/b"
          mb: 100

- id: node.service-restarts
  name: kubelet, containerd or k3s restarted automatically
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['service_restarts_max'] >= 10"
    warn_expr: "item['service_restarts_max'] >= 3"
  target: "item['node']"
  evidence: "f\"systemd NRestarts {item['service_restarts']} (uptime {item['meta']['uptime_days']} days, automatic restarts only. Unit states {[(s['unit'], s['active'], s['since']) for s in item['services']]})\""
