  symptom_linked: false
  why: >
    Only the name and type from the kube_secret_info and kube_secret_type metrics are used (values are never read by any path). Secrets not pointed at by a pod, ServiceAccount, Ingress TLS, ExternalSecret, Certificate, TriggerAuthentication or Issuer, and not a service-account-token, helm release or operator-prefixed secret.
