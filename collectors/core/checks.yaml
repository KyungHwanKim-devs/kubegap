- id: storage.default-storageclass-count
  name: Default StorageClass missing or more than one
  area: storage
  type: summary
  each: storage.classes
  cluster_level: true
  rule:
    expr: "item['count'] > 0 and item['default_count'] != 1"
  target: "'cluster'"
  evidence: "f\"{item['count']} StorageClasses, {item['default_count']} marked default {item['default']}\""
  severity_default: medium
  symptom_linked: false
  why: A PVC without storageClassName goes to the default class. With no default that PVC stays Pending forever; with more than one it is undefined which one wins (the most recently created). Chart default PVCs commonly leave storageClassName empty.
  suggest: "`storageclass.kubernetes.io/is-default-class: \"true\"` on exactly one."
  verify:
    - "kubectl get sc"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          rows: []
          count: 2
          default_count: 0
          default: []
          intree: []
          no_expansion: []
          immediate_multi_az: []
          zones:
            - "a"
            - "c"
      - expect: "fail"
        item:
          rows: []
          count: 2
          default_count: 2
          default:
            - "gp3"
            - "gp2"
          intree: []
          no_expansion: []
          immediate_multi_az: []
          zones:
            - "a"
            - "c"
      - expect: "pass"
        item:
          rows: []
          count: 2
          default_count: 1
          default:
            - "gp3"
          intree: []
          no_expansion: []
          immediate_multi_az: []
          zones:
            - "a"
            - "c"

- id: storage.binding-immediate-multi-az
  name: EBS StorageClass with volumeBindingMode Immediate in a multi-AZ cluster
  area: storage
  type: summary
  each: storage.classes.rows
  rule:
    warn_expr: "item['immediate_multi_az'] and item['pvcs'] > 0"
  target: "item['name']"
  evidence: "f\"StorageClass {item['name']}: provisioner {item['provisioner']}, volumeBindingMode {item['binding_mode']}, {item['pvcs']} PVCs\""
  severity_default: medium
  symptom_linked: false
  why: Immediate creates the EBS volume in some AZ the moment the PVC is created. If the pod is scheduled to a node in another AZ, the volume cannot attach and the pod stays Pending. WaitForFirstConsumer creates it in the pod's AZ after the pod is placed. Only relevant when nodes span two or more AZs.
  suggest: "volumeBindingMode WaitForFirstConsumer (a StorageClass is immutable, so create a new one and switch)."
  verify:
    - "kubectl get sc -o custom-columns=NAME:.metadata.name,BINDING:.volumeBindingMode,PROV:.provisioner"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          name: "gp3-imm"
          provisioner: "ebs.csi.aws.com"
          reclaim_policy: "Delete"
          binding_mode: "Immediate"
          allow_expansion: true
          default: false
          parameters: {}
          pvcs: 2
          intree: false
          immediate_multi_az: true
      - expect: "pass"
        item:
          name: "gp3-imm"
          provisioner: "ebs.csi.aws.com"
          reclaim_policy: "Delete"
          binding_mode: "WaitForFirstConsumer"
          allow_expansion: true
          default: false
          parameters: {}
          pvcs: 2
          intree: false
          immediate_multi_az: false
      - expect: "pass"
        item:
          name: "gp3-imm"
          provisioner: "ebs.csi.aws.com"
          reclaim_policy: "Delete"
          binding_mode: "Immediate"
          allow_expansion: true
          default: false
          parameters: {}
          pvcs: 0
          intree: false
          immediate_multi_az: true

- id: storage.prod-db-reclaim-delete
  name: prod DB volumes with reclaimPolicy Delete (deleting the PVC deletes the data)
  area: storage
  type: summary
  each: storage.pvcs
  cluster_level: true
  rule:
    warn_expr: "bool(item['prod_db_delete_reclaim'])"
  target: "'cluster'"
  evidence: "f\"DB-like prod PVCs whose PV reclaimPolicy is Delete: {item['prod_db_delete_reclaim'][:12]} ({len(item['prod_db_delete_reclaim'])} in total / {sum(1 for r in item['rows'] if r['prod'])} prod PVCs)\""
  severity_default: medium
  symptom_linked: false
  why: >
    Delete is the default, so deleting the PVC (namespace deletion, Argo CD prune, a StatefulSet recreation mistake) removes the EBS volume or disk immediately. With a backup it is a recovery-time problem; without one it is final (read with resilience.no-backup and eks.no-backup-policy).
    Measured on a real EKS cluster: a dozen "pre-delete backup of orphan PVC" snapshots -- someone took manual snapshots before deleting PVCs. reclaimPolicy Retain replaces that procedure.
  suggest: "Keep a separate StorageClass with reclaimPolicy Retain for DBs, or patch existing PVs with `kubectl patch pv <pv> -p '{\"spec\":{\"persistentVolumeReclaimPolicy\":\"Retain\"}}'` (suggestion only). Exclude PVCs from Argo CD prune."
  verify:
    - "kubectl get pv -o custom-columns=NAME:.metadata.name,CLAIM:.spec.claimRef.name,RECLAIM:.spec.persistentVolumeReclaimPolicy"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          count: 17
          with_metrics: 17
          rows:
            - namespace: "prod-a"
              name: "data-db-0"
              target: "prod-a/data-db-0"
              prod: true
              phase: "Bound"
              storage_class: "gp3"
              requested_gb: 10.0
              capacity_gb: 9.7
              used_ratio: 0.3
              inode_ratio: 0.01
              growth_gb_per_day: 0.01
              days_to_full: 600
              metrics: true
              host_fs: false
              workloads:
                - "statefulset/db"
              db_like: true
              pv: "pvc-x"
              zone: "us-east-1a"
              reclaim_policy: "Delete"
              access_modes:
                - "ReadWriteOnce"
          high_usage: []
          filling: []
          unbound: []
          prod_db_delete_reclaim:
            - "prod-a/data-db-0"
          by_class:
            gp3: 17
      - expect: "pass"
        item:
          count: 17
          with_metrics: 17
          rows: []
          high_usage: []
          filling: []
          unbound: []
          prod_db_delete_reclaim: []
          by_class:
            gp3: 17

- id: storage.ebs-unattached
  name: EBS volumes attached to nothing (cost only)
  area: storage
  type: summary
  each: storage.ebs
  cluster_level: true
  rule:
    expr: "item.get('available') and len(item.get('unattached') or []) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item.get('unattached') or [])} volumes in available state, {item.get('unattached_gb')}GB, about ${item.get('unattached_monthly_usd_est')}/month: {[(v['id'], v['size_gb'], v['type'], v['age_days'], v['name']) for v in (item.get('unattached') or [])[:8]]}\""
  severity_default: medium
  symptom_linked: false
  why: A PVC deleted with reclaim Retain, a volume left after a node disappeared, or a volume created by hand and forgotten. gp3 keeps costing about 0.09 USD per GB-month. There may be data inside, so snapshot before deleting.
  suggest: "Check each volume's origin via tags (kubernetes.io/created-for/pv/name) -> snapshot -> delete. This is an account-wide query, so volumes outside this cluster are mixed in (separate them by the KubernetesCluster tag)."
  verify:
    - "aws ec2 describe-volumes --filters Name=status,Values=available --query 'Volumes[].[VolumeId,Size,VolumeType,CreateTime]' --output table"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 17
          by_state:
            in-use: 17
          gb_total: 280
          gp2: []
          unencrypted: []
          iops_above_default: []
          unattached:
            - id: "vol-1"
              size_gb: 20
              type: "gp3"
              age_days: 30
              az: "a"
              name: "pvc-x"
              cluster: "c"
          unattached_gb: 20
          unattached_monthly_usd_est: 1.82
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12
      - expect: "pass"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 17
          by_state:
            in-use: 17
          gb_total: 280
          gp2: []
          unencrypted: []
          iops_above_default: []
          unattached: []
          unattached_gb: 0
          unattached_monthly_usd_est: 0.0
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12
      - expect: "pass"
        item:
          available: false

- id: storage.ebs-gp2-volumes
  name: gp2 EBS volumes remain (gp3 is cheaper and faster)
  area: storage
  type: summary
  each: storage.ebs
  cluster_level: true
  rule:
    warn_expr: "item.get('available') and len(item.get('gp2') or []) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item.get('gp2') or [])} gp2 volumes: {[(v['id'], v['size_gb'], v['namespace'], v['pvc']) for v in (item.get('gp2') or [])[:8]]}. All {item.get('by_type')}\""
  severity_default: low
  symptom_linked: false
  why: gp3 is 20% cheaper per GB than gp2 and guarantees a baseline 3000 IOPS and 125MB/s regardless of size (gp2 gives 3 IOPS per GB, so small volumes are slow). Changing the volume type is online (ModifyVolume).
  suggest: "`aws ec2 modify-volume --volume-id <id> --volume-type gp3` (online, suggestion only). The gp2 StorageClass itself is storage.legacy-intree-storageclass."
  verify:
    - "aws ec2 describe-volumes --filters Name=volume-type,Values=gp2 Name=tag:KubernetesCluster,Values=<cluster> --query 'length(Volumes)'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 16
            gp2: 1
          by_state:
            in-use: 17
          gb_total: 280
          gp2:
            - id: "vol-2"
              size_gb: 8
              pvc: "data"
              namespace: "prod-a"
          unencrypted: []
          iops_above_default: []
          unattached: []
          unattached_gb: 0
          unattached_monthly_usd_est: 0.0
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12
      - expect: "pass"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 17
          by_state:
            in-use: 17
          gb_total: 280
          gp2: []
          unencrypted: []
          iops_above_default: []
          unattached: []
          unattached_gb: 0
          unattached_monthly_usd_est: 0.0
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12

- id: storage.ebs-unencrypted
  name: Unencrypted EBS volumes
  area: storage
  type: summary
  each: storage.ebs
  cluster_level: true
  rule:
    warn_expr: "item.get('available') and len(item.get('unencrypted') or []) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item.get('unencrypted') or [])} of {item.get('volumes')} volumes unencrypted: {(item.get('unencrypted') or [])[:8]}\""
  severity_default: medium
  symptom_linked: false
  why: EBS encryption has no performance cost and carries over to snapshots and copies. Enabling account default encryption (ebs encryption-by-default) makes new volumes automatic; existing volumes can only be converted by snapshot -> encrypted copy. Enforce with StorageClass parameters.encrypted "true".
  suggest: "`aws ec2 enable-ebs-encryption-by-default` (account setting, suggestion only), StorageClass parameters.encrypted: \"true\"."
  verify:
    - "aws ec2 get-ebs-encryption-by-default"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 17
          by_state:
            in-use: 17
          gb_total: 280
          gp2: []
          unencrypted:
            - "vol-3"
          iops_above_default: []
          unattached: []
          unattached_gb: 0
          unattached_monthly_usd_est: 0.0
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12
      - expect: "pass"
        item:
          available: true
          volumes: 17
          by_type:
            gp3: 17
          by_state:
            in-use: 17
          gb_total: 280
          gp2: []
          unencrypted: []
          iops_above_default: []
          unattached: []
          unattached_gb: 0
          unattached_monthly_usd_est: 0.0
          snapshots_30d: 12
          snapshots_30d_gb: 96
          snapshot_descriptions: {}
          snapshot_latest: "x"
          snapshotted_volumes: 12

- id: storage.node-attach-limit
  name: Node EBS attachment count near the limit
  area: storage
  type: summary
  each: storage.attach.nodes
  rule:
    expr: "(item['ratio'] or 0) >= 0.8"
    warn_expr: "(item['ratio'] or 0) >= 0.6"
  target: "item['node']"
  evidence: "f\"Node {item['node']}: attached {item['attached']}/{item['limit']} ({item['ratio']}), pods using PVCs {item['pvc_pods']}, driver {item['driver']}\""
  severity_default: high
  symptom_linked: true
  why: Each instance type has a fixed number of attachable volumes (CSINode allocatable.count, usually 25-28, shared with ENIs). At the limit, PVC pods scheduled to that node stay Pending with FailedAttachVolume. It happens on nodes where StatefulSets concentrate.
  suggest: "Spread PVC pods across nodes with topologySpread, use larger instances or add nodes. VPC CNI prefix delegation reduces ENI consumption and raises the limit."
  verify:
    - "kubectl get csinodes -o custom-columns=NODE:.metadata.name,LIMIT:.spec.drivers[0].allocatable.count; kubectl get volumeattachments | awk '{print $4}' | sort | uniq -c"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-a"
          driver: "ebs.csi.aws.com"
          limit: 26
          attached: 22
          pvc_pods: 5.0
          ratio: 0.85
      - expect: "warn"
        item:
          node: "node-a"
          driver: "ebs.csi.aws.com"
          limit: 26
          attached: 17
          pvc_pods: 5.0
          ratio: 0.65
      - expect: "pass"
        item:
          node: "node-a"
          driver: "ebs.csi.aws.com"
          limit: 26
          attached: 5
          pvc_pods: 5.0
          ratio: 0.19

- id: storage.volume-attach-errors
  name: Volume attach, mount and provisioning failure events
  area: storage
  type: summary
  each: storage.attach
  cluster_level: true
  rule:
    expr: "sum((item.get('events') or {}).values()) >= 5 or bool(item.get('errors'))"
    warn_expr: "sum((item.get('events') or {}).values()) >= 1"
  target: "'cluster'"
  evidence: "f\"Events {item.get('events')}, samples {item.get('event_samples')}, VolumeAttachment errors {item.get('errors')}\""
  severity_default: high
  symptom_linked: true
  why: FailedAttachVolume means the volume is still attached to the old node (6-minute detach wait after a node dies), an AZ mismatch or the attach limit; FailedMount is filesystem or permissions; ProvisioningFailed is StorageClass, quota or AZ. All of them show up as pods stuck in ContainerCreating.
  suggest: "Event messages in `kubectl describe pod`, `kubectl get volumeattachments`, EBS CSI controller logs."
  verify:
    - "kubectl get events -A --field-selector reason=FailedAttachVolume; kubectl get events -A --field-selector reason=FailedMount"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          nodes: []
          errors: []
          events:
            FailedAttachVolume: 6
          event_samples:
            FailedAttachVolume: "prod-a/db-0: Multi-Attach error"
          volumeattachments: 17
          near_limit: []
      - expect: "fail"
        item:
          nodes: []
          errors:
            - node: "n1"
              pv: "pvc-x"
              error: "rpc error"
          events: {}
          event_samples: {}
          volumeattachments: 17
          near_limit: []
      - expect: "warn"
        item:
          nodes: []
          errors: []
          events:
            FailedMount: 2
          event_samples: {}
          volumeattachments: 17
          near_limit: []
      - expect: "pass"
        item:
          nodes: []
          errors: []
          events: {}
          event_samples: {}
          volumeattachments: 17
          near_limit: []

- id: storage.csi-snapshot-unavailable
  name: CSI VolumeSnapshot unavailable (no CRD or snapshot-controller)
  area: storage
  type: summary
  each: storage.snapshots
  cluster_level: true
  rule:
    expr: "item.get('platform') == 'eks' and not item['volumesnapshot_crd']"
    warn_expr: "item.get('platform') == 'eks' and item['volumesnapshot_crd'] and item['volumesnapshots'] == 0 and (item.get('prod_pvcs') or 0) > 0"
  target: "'cluster'"
  evidence: "f\"VolumeSnapshot CRD {item['volumesnapshot_crd']}, VolumeSnapshots {item['volumesnapshots']} ({item['recent_7d']} in 7 days), VolumeSnapshotClasses {item['volumesnapshotclasses']}, EBS snapshots in 30 days {item.get('ebs_snapshots_30d')} {item.get('ebs_snapshot_descriptions')}, prod PVCs {item.get('prod_pvcs')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    On EKS the standard way to back up PVs from inside Kubernetes is CSI VolumeSnapshot (snapshot-controller add-on + VolumeSnapshotClass), and Velero uses it too. Without the CRD, the ebs-csi controller logs "VolumeSnapshotContent not found" about 1,500 times a day (log signature ebs-csi.snapshot-crd-missing) and backups depend solely on manual console/CLI snapshots (measured: a dozen "pre-delete backup" snapshots).
    If the CRD exists but there are 0 snapshots, it is installed and unused.
  suggest: "Install the EKS snapshot-controller add-on -> VolumeSnapshotClass (ebs.csi.aws.com) -> daily snapshots of prod PVCs on a DLM or Velero schedule."
  verify:
    - "kubectl get crd volumesnapshots.snapshot.storage.k8s.io; kubectl get volumesnapshotclasses; aws eks describe-addon --cluster-name <c> --addon-name snapshot-controller"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          volumesnapshot_crd: false
          volumesnapshots: 0
          volumesnapshotclasses: 0
          recent_7d: 0
          ebs_snapshots_30d: 12
          ebs_snapshot_descriptions:
            "pre-delete backup": 12
          pvcs_total: 17
          prod_pvcs: 7
          prod_db_pvcs_without_snapshot_path: []
          platform: "eks"
      - expect: "warn"
        item:
          volumesnapshot_crd: true
          volumesnapshots: 0
          volumesnapshotclasses: 1
          recent_7d: 0
          ebs_snapshots_30d: 12
          ebs_snapshot_descriptions:
            "pre-delete backup": 12
          pvcs_total: 17
          prod_pvcs: 7
          prod_db_pvcs_without_snapshot_path: []
          platform: "eks"
      - expect: "pass"
        item:
          volumesnapshot_crd: true
          volumesnapshots: 20
          volumesnapshotclasses: 0
          recent_7d: 7
          ebs_snapshots_30d: 12
          ebs_snapshot_descriptions:
            "pre-delete backup": 12
          pvcs_total: 17
          prod_pvcs: 7
          prod_db_pvcs_without_snapshot_path: []
          platform: "eks"
      - expect: "pass"
        item:
          volumesnapshot_crd: false
          volumesnapshots: 0
          volumesnapshotclasses: 0
          recent_7d: 0
          ebs_snapshots_30d: 12
          ebs_snapshot_descriptions:
            "pre-delete backup": 12
          pvcs_total: 17
          prod_pvcs: 7
          prod_db_pvcs_without_snapshot_path: []
          platform: "k3s"

# ---------- Structure and hygiene. Source: summary.hygiene (lib/hygiene.py) ----------
- id: hygiene.polaris-reliability-danger
  name: Polaris reliability/efficiency danger items (untagged images, hostPath, missing probes, etc.)
  area: hygiene
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: hygiene.polaris.workloads
  requires_tool: polaris
  rule:
    expr: "bool(item['non_security_danger']) and item['prod']"
    warn_expr: "bool(item['non_security_danger'])"
  target: "item['target']"
  evidence: "f\"Polaris danger (Reliability, Efficiency) {item['non_security_danger']}, warning {item['non_security_warning'][:6]}. Security-category danger {item['security_danger']} is in the security section\""
  severity_default: medium
  symptom_linked: false
  why: >
    Polaris (Fairwinds) statically inspects manifests and rates danger/warning across three categories: Security, Reliability and Efficiency. Only the latter two are considered here (the Security category belongs to security.polaris-*).
    danger covers untagged images, hostPath, hostNetwork, missing probes (depending on config), missing memory limits and other things that lead directly to operational incidents. Where it overlaps with kubegap's own checks (mutable-image-tag, single-node-dependency, no-readiness-probe), one action resolves both.
  suggest: "Follow the fix in the Polaris docs for each check (polaris.docs.fairwinds.com/checks). Fix it in the chart template so it applies to every workload."
  verify:
    - "polaris audit --context <ctx> --format pretty --only-show-failed-tests --severity danger"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          kind: "Deployment"
          target: "prod-a/deployment/web"
          prod: true
          danger: 1
          warning: 3
          danger_checks:
            - "tagNotSpecified"
          non_security_danger:
            - "tagNotSpecified"
          non_security_warning:
            - "livenessProbeMissing"
          security_danger: []
          security_warning:
            - "runAsRootAllowed"
          failed:
            - check: "tagNotSpecified"
              severity: "danger"
              category: "Reliability"
              where: "container:app"
              message: "Image tag should be specified"
      - expect: "warn"
        item:
          namespace: "dev-a"
          name: "web"
          kind: "Deployment"
          target: "prod-a/deployment/web"
          prod: false
          danger: 1
          warning: 3
          danger_checks:
            - "tagNotSpecified"
          non_security_danger:
            - "tagNotSpecified"
          non_security_warning:
            - "livenessProbeMissing"
          security_danger: []
          security_warning:
            - "runAsRootAllowed"
          failed:
            - check: "tagNotSpecified"
              severity: "danger"
              category: "Reliability"
              where: "container:app"
              message: "Image tag should be specified"
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "web"
          kind: "Deployment"
          target: "prod-a/deployment/web"
          prod: true
          danger: 0
          warning: 3
          danger_checks:
            - "tagNotSpecified"
          non_security_danger: []
          non_security_warning:
            - "livenessProbeMissing"
          security_danger: []
          security_warning:
            - "runAsRootAllowed"
          failed:
            - check: "tagNotSpecified"
              severity: "danger"
              category: "Reliability"
              where: "container:app"
              message: "Image tag should be specified"

- id: hygiene.deprecated-api
  name: Objects using APIs removed in the next minor version (Pluto, kubent)
  area: hygiene
  type: summary
  each: hygiene.deprecated.items
  rule:
    expr: "item['removed']"
    warn_expr: "item['deprecated']"
  target: "(item['namespace'] + '/' if item['namespace'] else '') + str(item['kind']).lower() + '/' + str(item['name'])"
  evidence: "f\"{item['kind']} {item['name']}: {item['api']} (deprecated {item['deprecated_in']}, removed {item['removed_in']}) -> {item['replacement']} [{item['source']}]\""
  severity_default: high
  symptom_linked: false
  why: >
    Kubernetes removes APIs every minor version. Objects stored under a removed API disappear after the upgrade or fail to deploy. Pluto inspects in-cluster objects and Helm release manifests; kubent does the same with different rules.
    target is the next minor after the cluster server version (collect fills in `{k8s_next_minor}`). The call-based view is the metric apiserver_requested_deprecated_apis (summary.hygiene.deprecated.called_deprecated_apis).
  suggest: "Move manifests and charts to the replacement API. Before the upgrade (platform.k8s-version-eol)."
  verify:
    - "pluto detect-all-in-cluster -o wide --target-versions k8s=v<next minor>"
    - "kubent -t <next minor>"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          source: "pluto"
          kind: "Ingress"
          name: "web"
          namespace: "prod-a"
          api: "networking.k8s.io/v1beta1"
          deprecated_in: "v1.19.0"
          removed_in: "v1.22.0"
          replacement: "networking.k8s.io/v1"
          deprecated: true
          removed: true
      - expect: "warn"
        item:
          source: "pluto"
          kind: "Ingress"
          name: "web"
          namespace: "prod-a"
          api: "networking.k8s.io/v1beta1"
          deprecated_in: "v1.19.0"
          removed_in: "v1.22.0"
          replacement: "networking.k8s.io/v1"
          deprecated: true
          removed: false
      - expect: "none"

- id: hygiene.eks-upgrade-insight
  name: EKS Upgrade Insights with ERROR or WARNING items
  area: hygiene
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: hygiene.deprecated.eks_insights_failing
  rule:
    expr: "item['status'] == 'ERROR'"
    warn_expr: "True"
  target: "item['name']"
  evidence: "f\"{item['name']} ({item['category']}, k8s {item['k8s_version']}): {item['status']} — {item['reason']}\""
  severity_default: medium
  symptom_linked: false
  why: Upgrade Insights is EKS inspecting its own cluster and warning in advance about what will block the next version upgrade (deprecated API use, kubelet/kube-proxy version skew, AL2 AMI end of life, add-on compatibility). ERROR items must be resolved before upgrading.
  suggest: "`aws eks describe-insight --cluster-name <c> --id <id>` for details (which resources are affected)."
  verify:
    - "aws eks list-insights --cluster-name <c> --query 'insights[?insightStatus.status!=`PASSING`].[name,insightStatus.status]'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          name: "Amazon Linux 2 compatibility"
          category: "UPGRADE_READINESS"
          status: "ERROR"
          reason: "AL2 AMIs end"
          k8s_version: "1.33"
          last_transition: "x"
      - expect: "warn"
        item:
          name: "Amazon Linux 2 compatibility"
          category: "UPGRADE_READINESS"
          status: "WARNING"
          reason: "AL2 AMIs end"
          k8s_version: "1.33"
          last_transition: "x"
      - expect: "none"

- id: hygiene.helm-release-not-deployed
  name: Helm release left in a non-deployed state (pending, failed)
  area: hygiene
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: hygiene.helm.releases
  requires_tool: helm
  rule:
    expr: "item['status'] not in ('deployed', 'superseded')"
  target: "item['target']"
  evidence: "f\"Release {item['namespace']}/{item['name']}: status {item['status']}, revision {item['revision']}, chart {item['chart']}, last changed {item['age_days']} days ago\""
  severity_default: medium
  symptom_linked: false
  why: pending-upgrade and pending-install mean a previous helm operation was interrupted and the next upgrade is blocked. failed means not even rolled back. When Argo CD renders and applies Helm charts (argocd+helm) there is no helm release object, so those do not appear here.
  suggest: "`helm history <release> -n <ns>` to find the last good revision -> `helm rollback`, or clean up the pending secret and upgrade."
  verify:
    - "helm list -A --failed --pending"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          status: "pending-upgrade"
          revision: "3"
          chart: "web-1.2.0"
          chart_name: "web"
          chart_version: "1.2.0"
          app_version: "1.2.0"
          updated: "x"
          age_days: 30
          prod: true
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          status: "failed"
          revision: "3"
          chart: "web-1.2.0"
          chart_name: "web"
          chart_version: "1.2.0"
          app_version: "1.2.0"
          updated: "x"
          age_days: 30
          prod: true
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          status: "deployed"
          revision: "3"
          chart: "web-1.2.0"
          chart_name: "web"
          chart_version: "1.2.0"
          app_version: "1.2.0"
          updated: "x"
          age_days: 30
          prod: true

- id: hygiene.helm-release-stale
  name: Helm release not updated for over a year
  area: hygiene
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: hygiene.helm.releases
  requires_tool: helm
  rule:
    warn_expr: "(item['age_days'] or 0) >= 365"
  target: "item['target']"
  evidence: "f\"Release {item['namespace']}/{item['name']}: chart {item['chart']} (app {item['app_version']}), last changed {item['age_days']} days ago\""
  severity_default: low
  symptom_linked: false
  why: A chart untouched for over a year is very likely behind on both security patches and Kubernetes version compatibility (deprecated APIs). Especially platform components such as ingress controllers, cert-manager and CSI.
  suggest: "Compare with `helm search repo <chart> --versions | head`, read the changelog and go one step at a time."
  verify:
    - "helm list -A -o json | jq -r '.[] | .updated+\" \"+.namespace+\"/\"+.name+\" \"+.chart'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          status: "deployed"
          revision: "3"
          chart: "web-1.2.0"
          chart_name: "web"
          chart_version: "1.2.0"
          app_version: "1.2.0"
          updated: "x"
          age_days: 400
          prod: true
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          status: "deployed"
          revision: "3"
          chart: "web-1.2.0"
          chart_name: "web"
          chart_version: "1.2.0"
          app_version: "1.2.0"
          updated: "x"
          age_days: 30
          prod: true

- id: hygiene.mutable-image-tag
  name: Image tag is latest or missing (unknown version running)
  area: hygiene
  type: summary
  each: hygiene.images.rows
  rule:
    expr: "item['mutable'] and item['prod'] and not item.get('holder')"  # prepull holder (sleep) containers use latest intentionally, so warn
    warn_expr: "item['mutable']"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"image {item['image']} (tag {item['tag_kind']}, imagePullPolicy {item['pull_policy']}, registry {item['registry']})\""
  severity_default: medium
  symptom_linked: false
  why: >
    An image with :latest or no tag can come up as a different binary on restart or node replacement, and rollback is impossible (there is no record of which version it was). Measured on a k3s: a TURN server on `coturn/coturn:latest` crashed for 27 days -- the image changing after a reboot was the likely cause.
    A pinned tag with imagePullPolicy Always goes to the registry on every start, so a registry outage becomes a start failure (warn).
  suggest: "Pin the tag to a version (or digest) and use imagePullPolicy IfNotPresent. CI bumps the tag and Argo CD applies it."
  verify:
    - "kubectl get deploy,sts,ds -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{\" \"}{.spec.template.spec.containers[*].image}{\"\\n\"}{end}' | grep -E ':latest|[^:]+$'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          image: "ghcr.io/x/web:latest"
          tag_kind: "latest"
          pull_policy: "Always"
          registry: "ghcr.io"
          mutable: true
          always_pull_with_tag: false
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          container: "app"
          image: "ghcr.io/x/web:latest"
          tag_kind: "latest"
          pull_policy: "Always"
          registry: "ghcr.io"
          mutable: true
          always_pull_with_tag: false
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          image: "ghcr.io/x/web:1.2"
          tag_kind: "tag"
          pull_policy: "Always"
          registry: "ghcr.io"
          mutable: false
          always_pull_with_tag: true
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          image: "ghcr.io/x/web:1.2"
          tag_kind: "tag"
          pull_policy: "IfNotPresent"
          registry: "ghcr.io"
          mutable: false
          always_pull_with_tag: false

- id: hygiene.always-pull-with-tag
  name: Pinned tag with imagePullPolicy Always (registry outage = start failure)
  area: hygiene
  type: summary
  each: hygiene.images.rows
  rule:
    warn_expr: "item['always_pull_with_tag']"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"image {item['image']} (tag {item['tag_kind']}, imagePullPolicy {item['pull_policy']}, registry {item['registry']})\""
  severity_default: low
  symptom_linked: false
  why: >
    With a pinned tag the image already on the node could be used, but Always checks with the registry on every start. A registry outage (ghcr, ECR, Docker Hub rate limits) becomes a restart failure.
    Separated from hygiene.mutable-image-tag because it is a different problem with a different severity than `:latest`.
  suggest: "imagePullPolicy IfNotPresent. Deployments change the tag, so Always is not needed."
  verify:
    - "kubectl get deploy -A -o json | jq -r '.items[] | .spec.template.spec.containers[] | select(.imagePullPolicy==\"Always\") | .image'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          image: "ghcr.io/x/web:1.2.3"
          tag_kind: "tag"
          pull_policy: "Always"
          registry: "ghcr.io"
          mutable: false
          always_pull_with_tag: true
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          image: "ghcr.io/x/web:1.2.3"
          tag_kind: "tag"
          pull_policy: "IfNotPresent"
          registry: "ghcr.io"
          mutable: false
          always_pull_with_tag: false

- id: hygiene.no-standard-labels
  name: Low use of standard labels (app.kubernetes.io/*)
  area: hygiene
  type: summary
  each: hygiene.labels
  cluster_level: true
  rule:
    expr: "item['standard_label_ratio'] is not None and item['standard_label_ratio'] < 0.5"
    warn_expr: "item['standard_label_ratio'] is not None and item['standard_label_ratio'] < 0.8"
  target: "'cluster'"
  evidence: "f\"Of {item['workloads']} workloads, share with standard labels {item['standard_label_ratio']}. prod workloads without: {[w['workload'] for w in item['without_standard_labels'] if w['prod']][:12]} ({len(item['without_standard_labels'])} in total)\""
  severity_default: low
  symptom_linked: false
  why: >
    Standard app.kubernetes.io/* labels let dashboards, alerts, cost aggregation, NetworkPolicy and PDB selectors pick workloads consistently. Without them every monitoring tool ends up using a different label; Polaris metadataAndInstanceMismatched points at the same thing.
    Measured: 23% on a small k3s cluster, 91% on an EKS cluster. A finding per workload would be dozens of items, so one cluster-level ratio is reported and the list goes into the evidence.
  suggest: "Put app.kubernetes.io/name, instance, version, part-of and managed-by into the chart or kustomize base common labels (commonLabels)."
  verify:
    - "kubectl get deploy -A -o json | jq -r '.items[] | select((.metadata.labels // {} | keys | map(startswith(\"app.kubernetes.io/\")) | any) | not) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workloads: 100
          standard_label_ratio: 0.23
          without_standard_labels:
            - workload: "prod-a/deployment/web"
              namespace: "prod-a"
              prod: true
              labels: {}
          default_namespace_workloads: []
      - expect: "warn"
        item:
          workloads: 100
          standard_label_ratio: 0.7
          without_standard_labels: []
          default_namespace_workloads: []
      - expect: "pass"
        item:
          workloads: 100
          standard_label_ratio: 0.91
          without_standard_labels: []
          default_namespace_workloads: []
- id: hygiene.default-namespace-workloads
  name: Workloads in the default namespace
  area: hygiene
  type: summary
  each: hygiene.labels.default_namespace_workloads
  rule:
    expr: "True"
  target: "item['workload']"
  evidence: "f\"Workload in the default namespace {item['workload']}\""
  severity_default: low
  symptom_linked: false
  why: default is covered by no RBAC, NetworkPolicy, quota or Argo CD project. It is the typical path by which an experiment becomes prod and stays.
  suggest: "Move to a dedicated namespace and block creation in default with a ResourceQuota of 0 or a Kyverno policy."
  verify:
    - "kubectl get all -n default"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "default/deployment/quiz"
          prod: false
      - expect: "none"

- id: hygiene.orphan-configmaps
  name: Many ConfigMaps referenced by nothing
  area: hygiene
  type: summary
  each: hygiene.orphans
  cluster_level: true
  rule:
    expr: "len(item['orphan_configmaps']) >= 50"
    warn_expr: "len(item['orphan_configmaps']) >= 5"
  target: "'cluster'"
