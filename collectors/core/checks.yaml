- id: tenancy.prod-without-quota
  name: Production tenant namespace has no ResourceQuota (one tenant can eat all the nodes)
  area: tenancy
  type: summary
  each: tenancy.namespaces.rows
  rule:
    expr: "(item['prod'] and not item['has_quota'] and item['tenants_total'] > 1 and item['pods'] > 0) and (item['multi_org'] or item['cluster_saturated_7d'])"
    warn_expr: "(item['kind'] in ('ci', 'dev') and not item['has_quota'] and item['tenants_total'] > 1 and (item['pods'] > 0 or item['kind'] == 'ci')) or (item['prod'] and not item['has_quota'] and item['tenants_total'] > 1 and item['pods'] > 0)"
  target: "item['namespace']"
  evidence: "f\"{item['namespace']} ({item['kind']}): no ResourceQuota. Pods {item['pods']}, CPU requests total {item['cpu_requests']} cores, memory requests total {item['memory_requests_gb']}GB, 7d CPU p95 {item['cpu_p95_7d']} cores (cluster share {item['cpu_share_of_cluster_p95']}), memory p95 {item['memory_p95_7d_gb']}GB, 7d max/median {item['burst_ratio_7d']}x. Tenants in this cluster {item['tenants_total']}, shares nodes with prod {item['shares_nodes_with_prod']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If all tenants belong to one organization (a single human owner) and there was no node saturation in 7 days, it is not urgent, so warn. With signs of multiple organizations (two or more Users/Groups in RoleBindings) or node saturation, fail.
    In a cluster with several tenants (a namespace per client), without ResourceQuota one tenant's deployment mistake (replicas 100, no memory limit, a runaway CronJob) eats the other tenants' nodes.
    If Karpenter launches more nodes it becomes a bill instead of an outage; if NodePool limits are hit, it becomes other tenants' Pending pods. CI runners (ci) and dev burst heavily, so they warn even when not prod.
    Measured on a real EKS cluster: none of the 8 production namespaces had a quota. On a k3s: only 3 of 7 production namespaces did.
  suggest: "Give each tenant namespace a ResourceQuota (requests.cpu, requests.memory, limits.memory, count/pods) at 2-3x the 7-day p95. A quota rejects pods without requests, so pair it with LimitRange defaults (tenancy.quota-without-limitrange)."
