- id: traffic.ingress-5xx-ratio
  name: Ingress 5xx ratio is high (ALB CloudWatch or ingress-nginx)
  area: traffic
  type: summary
  each: traffic.ingresses
  rule:
    expr: "(item['metrics'].get('errors_ratio') or 0) >= 0.01 and (item['metrics'].get('requests') or 0) >= 100"
    warn_expr: "(item['metrics'].get('errors_ratio') or 0) >= 0.001 and (item['metrics'].get('requests') or 0) >= 100"
  target: "item['target']"
  evidence: "f\"{item['hosts'][:2]}: {item['metrics'].get('window')} 5xx {item['metrics'].get('errors_5xx')} of {item['metrics'].get('requests')} requests = {(item['metrics'].get('errors_ratio') or 0)*100:.2f}% (source {item['metrics'].get('source')}), p95 max {item['metrics'].get('p95_s_max_1h')}s\""
  severity_default: medium  # lowered because warns (0.1-1%) all landed as high. Fails above 1% are raised by the LLM based on traffic volume
  symptom_linked: true
  why: >
    5xx is the user-facing symptom itself (page on symptoms). Above 1% a 99% SLO is already broken, and even 0.1% is dozens of failures a day at a few thousand requests.
    On EKS the source is the ALB's HTTPCode_Target_5XX_Count (5xx produced by targets); on a small k3s cluster it is ingress-nginx metrics. Under 100 requests the ratio is too noisy and is skipped.
