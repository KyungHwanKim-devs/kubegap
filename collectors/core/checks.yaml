          history_limits:
            - 3
            - 1
          last_schedule: "x"
          last_success: "x"
          hours_since_success: 3.0
          active_jobs: 0
          jobs_total: 3
          failed_jobs: []
          stale: false
          policy_gaps:
            - "x"
          prod: false
      - expect: "pass"
