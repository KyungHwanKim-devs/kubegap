- id: node.os-not-collected
  name: Nodes where the OS inspection could not run
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.not_collected
  rule:
    expr: "True"
  target: "item['node']"
  evidence: "f\"{item['reason']}\""
  severity_default: low
  symptom_linked: false
  why: Kernel logs, sysctl and containerd state could not be seen. On EKS this means the node is not registered in SSM (eks.ssm-unregistered); over SSH it is a connectivity, key or permission problem. All node.* checks for this node are empty.
  suggest: "EKS: attach AmazonSSMManagedInstanceCore to the node IAM role. SSH: config.yaml ssh.hosts and deploy/node-access/README.md."
  verify:
    - "scripts/kubegap nodes --context <name>"

# ---- Logs (signatures, Loki). Source: summary.logs (lib/logs.py) ----
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-a"
          reason: "node not registered in SSM"
      - expect: "none"

- id: logs.signatures
  name: Log signature match (signatures/catalog.yaml)
  area: observability
  type: signature
  rule:
    expr: "True"
  severity_default: medium
  symptom_linked: false
  profiles: [prod, lab]
  why: Each finding carries the signature's area, severity, meaning and usual cause. The value of this check itself is a placeholder.
  notes: Finding id is logs.signatures.<signature id>. count >= fail_at means fail, >= warn_at means warn.
  test:
    cases:
      - expect: "fail"
        summary:
          logs:
            signatures:
              - id: "kubelet.pleg-not-healthy"
                name: "kubelet PLEG unhealthy"
                component: "kubelet"
                area: "node"
                severity: "high"
                sources: []
                pattern: "x"
                meaning: "m"
                cause: "c"
                verify: "v"
                warn_at: 1
                fail_at: 10
                count: 50
                first: "2026-10-25T00:00:00"
                last: "2026-10-25T01:00:00"
                files:
                  logs/node/n/kubelet-24h.log: 50
                samples:
                  - "PLEG is not healthy"
                status: "fail"
      - expect: "warn"
        summary:
          logs:
            signatures:
              - id: "kubelet.pleg-not-healthy"
                name: "kubelet PLEG unhealthy"
                component: "kubelet"
                area: "node"
                severity: "high"
                sources: []
                pattern: "x"
                meaning: "m"
                cause: "c"
                verify: "v"
                warn_at: 1
                fail_at: 10
                count: 3
                first: "2026-10-25T00:00:00"
                last: "2026-10-25T01:00:00"
                files:
                  logs/node/n/kubelet-24h.log: 3
                samples:
                  - "PLEG is not healthy"
                status: "warn"
      - expect: "pass"
        summary:
          logs:
            signatures:
              - id: "kubelet.pleg-not-healthy"
                name: "kubelet PLEG unhealthy"
                component: "kubelet"
                area: "node"
                severity: "high"
                sources: []
                pattern: "x"
                meaning: "m"
                cause: "c"
                verify: "v"
                warn_at: 1
                fail_at: 10
                count: 0
                first: "2026-10-25T00:00:00"
                last: "2026-10-25T01:00:00"
                files:
                  logs/node/n/kubelet-24h.log: 0
                samples:
                  - "PLEG is not healthy"
                status: "info"

- id: observability.unclassified-errors
  name: Error log lines matched by no signature (new signature candidates)
  area: observability
  type: summary
  each: logs
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "sum(e['count'] for e in item.get('unclassified_errors') or []) >= 2000"
    warn_expr: "len(item.get('unclassified_errors') or []) > 0"
  target: "'cluster'"
  evidence: "f\"{item.get('error_lines_unclassified')} unclassified error lines ({item.get('lines_scanned')} lines scanned, {len(item.get('files_scanned') or [])} files). Top: {[(e['pattern'][:100], e['count']) for e in (item.get('unclassified_errors') or [])[:6]]}\""
  severity_default: low
  symptom_linked: false
  why: Errors the signature catalog does not know. The LLM reads the top patterns and decides whether they are a problem or noise. Recurring real problems should be added to the catalog as signatures.
  suggest: Look at sample and files in summary.logs.unclassified_errors and open the raw logs (logs/pods/).
  verify:
    - "jq '.logs.unclassified_errors[:10]' summary.json"
  test:
    cases:
      - expect: "fail"
        item:
          error_lines_unclassified: 3000
          lines_scanned: 50000
          files_scanned:
            - "a"
          unclassified_errors:
            - pattern: "x"
              count: 2500
      - expect: "warn"
        item:
          error_lines_unclassified: 10
          lines_scanned: 500
          files_scanned:
            - "a"
          unclassified_errors:
            - pattern: "x"
              count: 10
      - expect: "pass"
        item:
          error_lines_unclassified: 0
          lines_scanned: 500
          files_scanned: []
          unclassified_errors: []

- id: observability.log-coverage-gap
  name: Running pods with no logs in Loki (collection gap)
  area: observability
  type: summary
  each: logs.loki.coverage
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "item.get('available') and (len(item.get('nodes_all_missing') or []) > 0 or (item.get('gap_ratio') or 0) > 0.5)"
    warn_expr: "item.get('available') and (item.get('gap_ratio') or 0) > 0.2"
  target: "'cluster'"
  evidence: "f\"Of {item.get('running_pods_over_1h')} pods Running for over 1h, {item.get('pods_without_logs_1h')} are absent from Loki pod labels (ratio {item.get('gap_ratio')}). Nodes with every pod missing: {item.get('nodes_all_missing')}. By namespace: {item.get('by_namespace_missing')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    During an incident you say "let's look at the logs" and only then discover that pod's logs are not in Loki. If a whole node is missing, that node's promtail is dead (too many open files, mount); if a whole namespace is missing, promtail excludes it from collection.
    Idle pods may write nothing for an hour, so the LLM decides from the list.
  suggest: Check promtail pod logs on the nodes in nodes_all_missing. For a whole namespace, check the drop rules in promtail scrape_configs.
  verify:
    - "kubectl logs -n monitoring -l app=promtail --since=1h | grep -iE 'error|too many' | head"
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          running_pods_over_1h: 100
          pods_without_logs_1h: 60
          gap_ratio: 0.6
          nodes_all_missing: []
          by_namespace_missing:
            a: 1
      - expect: "fail"
        item:
          available: true
          running_pods_over_1h: 100
          pods_without_logs_1h: 10
          gap_ratio: 0.1
          nodes_all_missing:
            - "n1"
          by_namespace_missing: {}
      - expect: "warn"
        item:
          available: true
          running_pods_over_1h: 100
          pods_without_logs_1h: 30
          gap_ratio: 0.3
          nodes_all_missing: []
          by_namespace_missing: {}
      - expect: "pass"
        item:
          available: false

- id: observability.loki-not-ready
  name: Loki /ready is not ready
  area: observability
  type: summary
  each: logs.loki
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "item.get('present') and item.get('ready') is False"
  target: "'cluster'"
  evidence: "f\"Loki {item.get('version')} /ready response is not ready. Pods {item.get('pods')}\""
  severity_default: high
  symptom_linked: false
  why: Ingest and queries do not work. Either it is starting up (ingester replaying WAL) or the storage has a problem.
  suggest: Check the Loki pod logs and restart reason.
  verify:
    - "kubectl exec -n monitoring loki-0 -- wget -qO- localhost:3100/ready"
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          ok: true
          ready: false
          version: "2.6.1"
          retention: {}
          pods:
            - pod: "loki-stack-0"
              restarts: 1
              last_reason: "OOMKilled"
              last_finished: "x"
          oomkilled: false
          storage:
            volumes:
              storage: "emptyDir"
          self_metrics:
            rss_mb: 200
      - expect: "pass"
        item:
          present: true
          ok: true
          ready: true
          version: "2.6.1"
          retention: {}
          pods:
            - pod: "loki-stack-0"
              restarts: 1
              last_reason: "OOMKilled"
              last_finished: "x"
          oomkilled: false
          storage:
            volumes:
              storage: "emptyDir"
          self_metrics:
            rss_mb: 200
      - expect: "pass"
        item:
          present: false

- id: observability.loki-oomkilled
  name: Loki has been OOMKilled
  area: observability
  type: summary
  each: logs.loki
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "item.get('oomkilled') is True"
  target: "'cluster'"
  evidence: "f\"Loki pods {[(p['pod'], p['restarts'], p['last_reason'], p['last_finished']) for p in item.get('pods') or []]}. Storage {(item.get('storage') or {}).get('volumes')}, memory RSS {(item.get('self_metrics') or {}).get('rss_mb')}MB\""
  severity_default: high
  symptom_linked: false
  why: >
    Single-binary Loki dies from a memory spike on one big query (count_over_time over a wide time range, many streams). Logs still in memory (chunks not yet flushed) are lost at that moment, and if the storage is emptyDir everything is lost.
    kubegap's own queries can be the cause, so it only uses a 1-hour window (measured: a 24-hour query caused an OOMKill).
  suggest: "Raise the memory limit (at least 1-2Gi), set max_query_length and max_entries_limit on the querier, and move storage to a PVC."
  verify:
    - "kubectl get pods -n monitoring -l app=loki -o jsonpath='{.items[*].status.containerStatuses[*].lastState}'"
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          ok: true
          ready: true
          version: "2.6.1"
          retention: {}
          pods:
            - pod: "loki-stack-0"
              restarts: 1
              last_reason: "OOMKilled"
              last_finished: "x"
          oomkilled: true
          storage:
            volumes:
              storage: "emptyDir"
          self_metrics:
            rss_mb: 200
      - expect: "pass"
        item:
          present: true
          ok: true
          ready: true
          version: "2.6.1"
          retention: {}
          pods:
            - pod: "loki-stack-0"
              restarts: 1
              last_reason: "OOMKilled"
              last_finished: "x"
          oomkilled: false
          storage:
            volumes:
              storage: "emptyDir"
          self_metrics:
            rss_mb: 200

- id: observability.loki-ingest-discarded
  name: Loki rejecting logs (rate limit, stream limit)
  area: observability
  type: summary
  each: logs.agents.loki_metrics
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "(item.get('discarded_1h') or 0) >= 10000"
    warn_expr: "(item.get('discarded_1h') or 0) > 0"
  target: "'cluster'"
  evidence: "f\"Samples discarded in 1h {item.get('discarded_1h')}, 5xx {item.get('requests_5xx_1h')} (per reason in metrics/loki_discarded_1h.json)\""
  severity_default: medium
  symptom_linked: false
  why: Rejected lines are not stored. rate_limited means limits_config.ingestion_rate_mb; per_stream_rate_limit means one pod is flooding; stream_limit means label cardinality.
  suggest: Look at the counts per reason and raise the matching limits_config value or fix the flooding pod.
  verify:
    - "jq '.result[] | [.metric.reason, .value[1]]' metrics/loki_discarded_1h.json"
  test:
    cases:
      - expect: "fail"
        item:
          discarded_1h: 20000
          requests_5xx_1h: 4
      - expect: "warn"
        item:
          discarded_1h: 5
          requests_5xx_1h: 0
      - expect: "pass"
        item:
          discarded_1h: 0
          requests_5xx_1h: 0

- id: observability.promtail-dropped
  name: promtail dropping logs
  area: observability
  type: summary
  each: logs.agents.promtail
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "(item.get('dropped_entries_1h') or 0) >= 1000"
    warn_expr: "(item.get('dropped_entries_1h') or 0) > 0 or (item.get('request_errors_1h') or 0) >= 10 or item.get('metrics_scraped') is False"
  target: "'cluster'"
  evidence: "f\"Lines dropped in 1h {item.get('dropped_entries_1h')}, non-2xx sends {item.get('request_errors_1h')}, active targets total {item.get('targets_active')}\" + ('' if item.get('metrics_scraped') is not False else ' -- promtail metrics are not in Prometheus (no ServiceMonitor). The numbers above were not measured')"
  severity_default: medium
  symptom_linked: false
  why: promtail retries when Loki rejects or is unreachable, then drops. Dropped lines exist nowhere.
  suggest: Look at the Loki-side rejection reasons (observability.loki-ingest-discarded) together with the promtail log signatures (promtail.*).
  verify:
    - "kubectl logs -n monitoring -l app=promtail --since=1h | grep -c 'error sending batch'"
  test:
    cases:
      - expect: "fail"
        item:
          dropped_entries_1h: 2000
          request_errors_1h: 0
          targets_active: 70
      - expect: "warn"
        item:
          dropped_entries_1h: 0
          request_errors_1h: 42
          targets_active: 70
      - expect: "warn"
        item:
          dropped_entries_1h: null
          request_errors_1h: null
          targets_active: null
          metrics_scraped: false
      - expect: "pass"
        item:
          dropped_entries_1h: 0
          request_errors_1h: 0
          targets_active: 70
          metrics_scraped: true

- id: observability.fluentbit-output-errors
  name: fluent-bit output errors and drops
  area: observability
  type: summary
  each: logs.agents.fluent-bit
  cluster_level: true
  profiles: [prod, lab]
  rule:
    expr: "(item.get('retries_failed_1h') or 0) > 0 or (item.get('dropped_records_1h') or 0) > 0 or (item.get('output_errors_1h') or 0) >= 100"
    warn_expr: "(item.get('output_errors_1h') or 0) > 0 or item.get('records_in_1h') == 0 or item.get('metrics_scraped') is False"
  target: "'cluster'"
  evidence: "f\"Output errors in 1h {item.get('output_errors_1h')}, failed retries (dropped) {item.get('retries_failed_1h')}, dropped records {item.get('dropped_records_1h')}, input records {item.get('records_in_1h')}\" + ('' if item.get('metrics_scraped') is not False else ' -- fluent-bit metrics are not in Prometheus (no ServiceMonitor). The numbers above were not measured, so they are not really 0')"
  severity_default: medium
  symptom_linked: false
  why: When fluent-bit cannot write to Elasticsearch etc. it retries and then drops. Zero input means the collector itself has stalled.
  suggest: Check the fluent-bit log signatures (fluent-bit.*) and the storage state (elasticsearch.*).
  verify:
    - "kubectl logs -n <ns> -l app.kubernetes.io/name=fluent-bit --since=1h | grep -E '\\[error\\]' | head"
  test:
    cases:
      - expect: "fail"
        item:
          output_errors_1h: 5
          retries_failed_1h: 3
          dropped_records_1h: 0
          records_in_1h: 1000
      - expect: "warn"
        item:
          output_errors_1h: 2
          retries_failed_1h: 0
          dropped_records_1h: 0
          records_in_1h: 1000
      - expect: "warn"
        item:
          output_errors_1h: 0
          retries_failed_1h: 0
          dropped_records_1h: 0
          records_in_1h: 0
      - expect: "warn"
        item:
          output_errors_1h: null
          retries_failed_1h: null
          dropped_records_1h: null
          records_in_1h: null
          metrics_scraped: false
      - expect: "pass"
        item:
          output_errors_1h: 0
          retries_failed_1h: 0
          dropped_records_1h: 0
          records_in_1h: 1000
          metrics_scraped: true

- id: observability.log-error-ratio-high
  name: High error ratio in a namespace's logs (Loki, 1h)
  area: observability
  type: summary
  each: logs.loki.namespaces_1h
  profiles: [prod, lab]
  rule:
    expr: "item['lines_1h'] >= 1000 and (item.get('error_ratio') or 0) >= 0.5"
    warn_expr: "item['lines_1h'] >= 1000 and (item.get('error_ratio') or 0) >= 0.2"
  target: "item['namespace']"
  evidence: "f\"Of {item['lines_1h']} log lines in 1h, {item['error_lines_1h']} contain error|exception|fatal ({item.get('error_ratio')})\""
  severity_default: medium
  symptom_linked: true
  why: If more than one in five log lines is an error, the apps in that namespace are failing continuously or are logging normal behavior at error level. Either way, logs cannot be used to find an incident.
  suggest: "Use LogQL `{namespace=\"<ns>\"} |~ \"(?i)error\"` to see the top messages; fix app bugs, lower the log level for noise."
  verify:
    - "logcli query --since=1h 'sum by (pod) (count_over_time({namespace=\"<ns>\"} |~ \"(?i)error\" [1h]))'"
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          lines_1h: 5000
          error_lines_1h: 3000
          error_ratio: 0.6
          json_lines_1h: 0
          json_ratio: 0.0
      - expect: "warn"
        item:
          namespace: "prod-a"
          lines_1h: 5000
          error_lines_1h: 1500
          error_ratio: 0.3
          json_lines_1h: 0
          json_ratio: 0.0
      - expect: "pass"
        item:
          namespace: "prod-a"
          lines_1h: 500
          error_lines_1h: 400
          error_ratio: 0.8
          json_lines_1h: 0
          json_ratio: 0.0

- id: observability.unstructured-logs
  name: Namespaces with a low share of structured (JSON) logs
  area: observability
  type: summary
  each: logs.loki.namespaces_1h
  profiles: [prod, lab]
  rule:
    warn_expr: "item['lines_1h'] >= 5000 and item.get('json_ratio') is not None and item['json_ratio'] < 0.2 and not item['namespace'].startswith('kube-')"
  target: "item['namespace']"
  evidence: "f\"Of {item['lines_1h']} lines in 1h, {item.get('json_lines_1h')} parse as JSON ({item.get('json_ratio')})\""
  severity_default: low
  symptom_linked: false
  why: Plain-text logs cannot be queried by field (such as only requests with status=500). During an incident grep is all you have. System namespaces are excluded.
  suggest: Switch the app logger to JSON output. If that cannot happen now, extract the key fields with a regex in promtail pipeline_stages.
  verify:
    - "logcli query --since=10m '{namespace=\"<ns>\"}' | head"
  test:
    cases:
      - expect: "warn"
        item:
          namespace: "shop-prod"
          lines_1h: 700000
          error_lines_1h: 100
          error_ratio: 0.0
          json_lines_1h: 0
          json_ratio: 0.0
      - expect: "pass"
        item:
          namespace: "kube-system"
          lines_1h: 700000
          error_lines_1h: 0
          error_ratio: 0.0
          json_lines_1h: 0
          json_ratio: 0.0
      - expect: "pass"
        item:
          namespace: "a"
          lines_1h: 7000
          error_lines_1h: 0
          error_ratio: 0.0
          json_lines_1h: 6000
          json_ratio: 0.86

- id: observability.stack-storage-emptydir
  name: Observability stack storage is emptyDir (data lost on restart)
  area: observability
  type: object
  inputs: [objects/statefulsets.json, objects/deployments.json]
  profiles: [prod, lab]
  rule:
    expr: "('prometheus' in name or 'grafana' in name or 'loki' in name or 'alertmanager' in name or 'thanos' in name or 'victoria' in name or 'tempo' in name or 'mimir' in name) and not spec.get('volumeClaimTemplates') and any(('emptyDir' in v) and (v['name'].endswith('-db') or v['name'] in ('storage', 'data', 'loki-data', 'grafana-storage', 'prometheus-data', 'alertmanager-data')) for v in (pod_spec(obj).get('volumes') or []))"
  evidence: "'emptyDir volumes: ' + ', '.join(v['name'] for v in (pod_spec(obj).get('volumes') or []) if 'emptyDir' in v) + f\", replicas {spec.get('replicas')}\""
  severity_default: high
  symptom_linked: false
  why: >
    Prometheus, Alertmanager, Loki and Grafana data disappears with the pod. When the pod moves to another node or restarts after an OOMKill, metric retention, alert silences, logs and dashboards start from zero.
    This is the kube-prometheus-stack default (no storageSpec) and the loki-stack default (persistence.enabled=false). Observed on the first real runs.
  suggest: "Prometheus: prometheusSpec.storageSpec.volumeClaimTemplate. Alertmanager: alertmanagerSpec.storage. Loki: persistence.enabled=true. Grafana: persistence.enabled=true (or an external DB)."
  verify:
    - "kubectl get sts,deploy -n monitoring -o json | jq -r '.items[] | select(.spec.template.spec.volumes[]? | has(\"emptyDir\")) | .metadata.name'"
  test:
    cases:
      - expect: "fail"
        objects:
          statefulsets:
            - kind: "StatefulSet"
              metadata:
                namespace: "monitoring"
                name: "prometheus-kube-prometheus-stack-prometheus"
              spec:
                replicas: 1
                volumeClaimTemplates: []
                template:
                  metadata:
                    labels:
                      app: "prom"
                  spec:
                    containers:
                      - name: "prometheus"
                        image: "x"
                    volumes:
                      - name: "prometheus-kube-prometheus-stack-prometheus-db"
                        emptyDir: {}
          deployments: []
      - expect: "pass"
        objects:
          statefulsets:
            - kind: "StatefulSet"
              metadata:
                namespace: "monitoring"
                name: "prometheus-kube-prometheus-stack-prometheus"
              spec:
                replicas: 1
                volumeClaimTemplates:
                  - metadata:
                      name: "db"
                template:
                  metadata:
                    labels:
                      app: "prom"
                  spec:
                    containers:
                      - name: "prometheus"
                        image: "x"
                    volumes: []
          deployments: []
      - expect: "pass"
        objects:
          statefulsets:
            - kind: "StatefulSet"
              metadata:
                namespace: "monitoring"
                name: "prometheus-kube-prometheus-stack-prometheus"
              spec:
                replicas: 1
                volumeClaimTemplates: []
                template:
                  metadata:
                    labels:
                      app: "prom"
                  spec:
                    containers:
                      - name: "prometheus"
                        image: "x"
                    volumes:
                      - name: "config"
                        emptyDir: {}
          deployments: []

- id: observability.alert-firing-stale
  name: Alert firing continuously for more than 3 days (no action)
  area: observability
  type: metric
  inputs: [alerts_firing_stale_days]
  profiles: [prod, lab]
  rule:
    expr: "value >= 7 and labels.get('alertname') not in ('Watchdog', 'InfoInhibitor')"  # these two are designed to fire always, so they are excluded
    warn_expr: "value >= 3 and labels.get('alertname') not in ('Watchdog', 'InfoInhibitor')"
  target: "labels.get('alertname') + ('/' + labels['namespace'] if labels.get('namespace') else '')"
  evidence: "f\"Firing for {value:.1f} days (ALERTS_FOR_STATE). Labels {dict((k, v) for k, v in labels.items() if k in ('severity', 'namespace', 'pod', 'job', 'node'))}\""
  severity_default: medium
  symptom_linked: false
  why: An alert that has fired for days is one of two things. Either nobody is looking (alert fatigue) or it is a false positive that cannot be fixed and was left alone. Both mean the alert should be removed or fixed. Real problems get buried in that noise.
  suggest: If it is a false positive, fix the rule or add a silence with an expiry and a reason; if it is real, act on it.
  verify:
    - "curl -s localhost:9090/api/v1/query --data-urlencode 'query=(time() - ALERTS_FOR_STATE)/86400 > 3' | jq '.data.result[] | [.metric.alertname, .value[1]]'"
  test:
    cases:
      - expect: "fail"
        metric:
          alerts_firing_stale_days:
            - labels:
                alertname: "KubePodCrashLooping"
                namespace: "prod-a"
                severity: "warning"
              value: 10.0
      - expect: "warn"
        metric:
          alerts_firing_stale_days:
            - labels:
                alertname: "X"
              value: 4.0
      - expect: "pass"
        metric:
          alerts_firing_stale_days:
            - labels:
                alertname: "X"
              value: 1.0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          alerts_firing_stale_days:
            - labels:
                alertname: "KubePodCrashLooping"
                namespace: "prod-a"
                severity: "warning"
              value: 7

# ---------- Cost and efficiency. Source: summary.cost (lib/cost.py). Prices are estimates (on-demand list price, current spot price); the actual bill is summary.cost.bill ----------
- id: cost.idle-compute-high
  name: Most of the compute cost is idle (7-day CPU p95)
  area: cost
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: cost.compute
  cluster_level: true
  rule:
    expr: "(item.get('idle_ratio') or 0) >= 0.8 and (item.get('idle_monthly_usd') or 0) >= 100"
    warn_expr: "(item.get('idle_ratio') or 0) >= 0.5 and (item.get('idle_monthly_usd') or 0) >= 50"
  target: "'cluster'"
  evidence: "f\"Node compute monthly estimate {item.get('monthly_usd')} USD (on-demand list price, current spot price), of which idle {item.get('idle_monthly_usd')} USD ({item.get('idle_ratio')}), by pool {item.get('by_pool')}, {item.get('usd_per_core_month')} USD per core-month. Spot node share {item.get('spot_node_share')}, spot savings {item.get('spot_savings_monthly_usd')} USD/month\""
  severity_default: medium
  symptom_linked: false
  why: >
    Idle cost = node hourly price x (1 - 7-day CPU p95 utilization). Nodes stay empty because requests exceed actual usage and the scheduler sees them as "full", so this pairs with cost.request-waste (request excess leads to node excess).
    On-demand uses the Pricing API list price, so Savings Plan and RI discounts are not reflected -- read it next to the actual Cost Explorer bill (summary.cost.bill). Measured on a 7-node EKS cluster: 0.71 of 15.5 cores used at p95 (4.6%), and most of the estimated 400 USD/month idle cost came from the system nodes (managed node group plus on-demand system pool).
  suggest: "(1) Lower requests to the p95 level (KRR) so nodes empty out and Karpenter consolidation removes them. (2) Move the system pool to smaller instances (t family). (3) Absorb the managed node group into a Karpenter pool."
  verify:
    - "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) / sum(kube_node_status_allocatable{resource=\"cpu\"})"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          monthly_usd: 421.95
          spot_monthly_usd: 95.41
          ondemand_monthly_usd: 326.54
          spot_node_share: 0.29
          spot_savings_monthly_usd: 256.77
          by_pool:
            default: 95.41
          usd_per_core_month: 27.22
          idle_monthly_usd: 399.6
          idle_ratio: 0.95
          idle_nodes: []
          on_demand_in_spot_pool: []
      - expect: "warn"
        item:
          monthly_usd: 421.95
          spot_monthly_usd: 95.41
          ondemand_monthly_usd: 326.54
          spot_node_share: 0.29
          spot_savings_monthly_usd: 256.77
          by_pool:
            default: 95.41
          usd_per_core_month: 27.22
          idle_monthly_usd: 80.0
          idle_ratio: 0.6
          idle_nodes: []
          on_demand_in_spot_pool: []
      - expect: "pass"
        item:
          monthly_usd: 421.95
          spot_monthly_usd: 95.41
          ondemand_monthly_usd: 326.54
          spot_node_share: 0.29
          spot_savings_monthly_usd: 256.77
          by_pool:
            default: 95.41
          usd_per_core_month: 27.22
          idle_monthly_usd: 20.0
          idle_ratio: 0.3
          idle_nodes: []
          on_demand_in_spot_pool: []

- id: cost.request-waste
  name: Cost of nodes left empty by request excess (KRR saved cores x core price)
  area: cost
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: cost.request_waste
  cluster_level: true
  rule:
    expr: "(item.get('monthly_usd_est') or 0) >= 100"
    warn_expr: "(item.get('monthly_usd_est') or 0) >= 30"
  target: "'cluster'"
  evidence: "f\"CPU request total {item.get('requests_cpu_total')} cores -> KRR recommendation {item.get('recommended_cpu_total')} cores, reducible {item.get('krr_saving_cores')} cores ~ {item.get('monthly_usd_est')} USD/month\""
  severity_default: medium
  symptom_linked: false
  why: Karpenter sizes the node count from the request total. Cutting 5 cores of requests removes that many nodes through consolidation. The per-core monthly price is the current node compute monthly estimate divided by allocatable cores. KRR recommendations are based on 14-day p95, so they are close to a safe lower bound.
  suggest: "Start lowering requests on the workloads from resources.cpu-request-overprovisioned and resources.krr-recommendation. Confirm the effect in the node count of the next snapshot (summary.cost.node_count_trend)."
  verify:
    - "Compare kubectl get nodes | wc -l before and after adjusting requests"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          krr_saving_cores: 5.23
          monthly_usd_est: 142.37
          requests_cpu_total: 6.68
          recommended_cpu_total: 1.45
      - expect: "warn"
        item:
          krr_saving_cores: 1.5
          monthly_usd_est: 40.0
          requests_cpu_total: 3.0
          recommended_cpu_total: 1.5
      - expect: "pass"
        item:
          krr_saving_cores: 0.2
          monthly_usd_est: 5.0
          requests_cpu_total: 2.0
          recommended_cpu_total: 1.8
      - expect: "pass"
        item:
          krr_saving_cores: null
          monthly_usd_est: null
          requests_cpu_total: null
          recommended_cpu_total: null

- id: cost.on-demand-in-spot-pool
  name: Nodes in a spot-capable NodePool running as on-demand
  area: cost
  type: summary
  each: cost.compute
  cluster_level: true
  rule:
    warn_expr: "len(item.get('on_demand_in_spot_pool') or []) > 0"
  target: "'cluster'"
  evidence: "f\"On-demand nodes in spot-capable pools {item.get('on_demand_in_spot_pool')}, spot node share {item.get('spot_node_share')}, spot savings {item.get('spot_savings_monthly_usd')} USD/month\""
  severity_default: low
  symptom_linked: false
  why: When capacity-type allows both spot and on-demand, Karpenter prefers spot but falls back to on-demand when spot capacity is unavailable, and it does not switch back automatically once spot returns (consolidation is spot-to-spot only). Nodes left on-demand pay list price.
  suggest: "Manually disrupt that node (`kubectl delete nodeclaim`, suggestion only) and Karpenter relaunches it as spot. If it keeps happening, spot supply for that instance family is short, so widen the requirements."
  verify:
    - "kubectl get nodes -L karpenter.sh/capacity-type,karpenter.sh/nodepool"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          monthly_usd: 421.95
          spot_monthly_usd: 95.41
          ondemand_monthly_usd: 326.54
          spot_node_share: 0.29
          spot_savings_monthly_usd: 256.77
          by_pool:
            default: 95.41
          usd_per_core_month: 27.22
          idle_monthly_usd: 399.6
          idle_ratio: 0.95
          idle_nodes: []
          on_demand_in_spot_pool:
            - "node-a"
      - expect: "pass"
        item:
          monthly_usd: 421.95
          spot_monthly_usd: 95.41
          ondemand_monthly_usd: 326.54
          spot_node_share: 0.29
          spot_savings_monthly_usd: 256.77
          by_pool:
            default: 95.41
          usd_per_core_month: 27.22
          idle_monthly_usd: 399.6
          idle_ratio: 0.95
          idle_nodes: []
          on_demand_in_spot_pool: []

- id: cost.unused-eip
  name: Elastic IPs attached to nothing
  area: cost
  type: summary
  each: cost.fixed
  cluster_level: true
  rule:
    expr: "(item.get('eip_unused') or 0) > 0"
  target: "'cluster'"
  evidence: "f\"{item.get('eip_unused')} of {item.get('eips_total')} EIPs unattached ~ {item.get('eip_unused_monthly_usd')} USD/month\""
  severity_default: low
  symptom_linked: false
  why: An unattached EIP costs 0.005 USD per hour (3.65 USD per month). Usually left behind after deleting an NLB or NAT gateway.
  suggest: "`aws ec2 release-address --allocation-id <id>` (suggestion only). First check whether DNS points at that IP."
  verify:
    - "aws ec2 describe-addresses --query 'Addresses[?AssociationId==null].PublicIp'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          eip_unused: 2
          eip_unused_monthly_usd: 7.3
          eips_total: 4
          nat_gateways: 1
          nat_monthly_usd_base: 43.07
          load_balancers: 3
          lb_monthly_usd_base: 49.28
          idle_load_balancers: []
          eks_cluster_monthly_usd: 73.0
          eks_support_type: "STANDARD"
          eks_extended_surcharge_monthly_usd: 0.0
      - expect: "pass"
        item:
          eip_unused: 0
          eip_unused_monthly_usd: 0.0
          eips_total: 4
          nat_gateways: 1
          nat_monthly_usd_base: 43.07
          load_balancers: 3
          lb_monthly_usd_base: 49.28
          idle_load_balancers: []
          eks_cluster_monthly_usd: 73.0
          eks_support_type: "STANDARD"
          eks_extended_surcharge_monthly_usd: 0.0

- id: cost.idle-load-balancer
  name: Load balancers with zero requests and traffic in 24h
  area: cost
  type: summary
  each: cost.fixed
  cluster_level: true
  rule:
    warn_expr: "len(item.get('idle_load_balancers') or []) > 0"
  target: "'cluster'"
  evidence: "f\"Of {item.get('load_balancers')} LBs (base charge {item.get('lb_monthly_usd_base')} USD/month), zero requests and bytes in 24h: {item.get('idle_load_balancers')}. NAT gateways {item.get('nat_gateways')} ({item.get('nat_monthly_usd_base')} USD/month + data)\""
  severity_default: low
  symptom_linked: false
  why: ALB and NLB cost 0.0225 USD per hour (16 USD per month) even with no requests. If 24-hour RequestCount (ALB) or ProcessedBytes (NLB) is 0, nobody uses it. Measured on a real EKS cluster: an internet-facing NLB in front of a DB port (the same target as traffic.db-exposed).
  suggest: "Delete it if unused (in Terraform if it is defined there). If it is in use and just quiet for 24 hours, leave it."
  verify:
    - "aws cloudwatch get-metric-statistics --namespace AWS/NetworkELB --metric-name ProcessedBytes --dimensions Name=LoadBalancer,Value=<dim> --statistics Sum --period 86400 --start-time <24h ago> --end-time <now>"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          eip_unused: 0
          eip_unused_monthly_usd: 0.0
          eips_total: 4
          nat_gateways: 1
          nat_monthly_usd_base: 43.07
          load_balancers: 3
          lb_monthly_usd_base: 49.28
          idle_load_balancers:
            - "db-shared-nlb"
          eks_cluster_monthly_usd: 73.0
          eks_support_type: "STANDARD"
          eks_extended_surcharge_monthly_usd: 0.0
      - expect: "pass"
        item:
          eip_unused: 0
          eip_unused_monthly_usd: 0.0
          eips_total: 4
          nat_gateways: 1
          nat_monthly_usd_base: 43.07
          load_balancers: 3
          lb_monthly_usd_base: 49.28
          idle_load_balancers: []
          eks_cluster_monthly_usd: 73.0
          eks_support_type: "STANDARD"
          eks_extended_surcharge_monthly_usd: 0.0

- id: cost.idle-node
  name: Nodes almost empty for 7 days (CPU p95 under 5%, memory under 30%, system pool excluded)
  area: cost
  type: summary
  each: cost.compute.idle_nodes
  rule:
    warn_expr: "True"
  target: "item['node']"
  evidence: "f\"Node {item['node']} ({item['instance_type']}, pool {item['pool']}): CPU p95 {item['cpu_p95_ratio']}, memory p95 {item['memory_p95_ratio']}, {item['monthly_usd']} USD/month\""
  severity_default: low
  symptom_linked: false
  why: With consolidation (WhenUnderutilized) enabled, such nodes should disappear. The reasons they remain are do-not-disrupt pods, PDBs, budgets or recent creation (measured: a node freshly launched after a spot reclaim that day). Read together with scaling.karpenter-expired-not-replaced.
  suggest: "Look through the node's pod list for the reason they cannot move (annotations, PDB, hostPath). If there is none, check the consolidation decisions in the Karpenter logs."
  verify:
    - "kubectl describe node <node> | grep -A20 'Non-terminated Pods'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          node: "node-b"
          instance_type: "r7g.large"
          pool: "default"
          cpu_p95_ratio: 0.034
          memory_p95_ratio: 0.18
          monthly_usd: 32.27
      - expect: "none"

- id: cost.k3s-node-efficiency
  name: Very low core efficiency (small k3s cluster -- efficiency instead of a bill)
  area: cost
  type: summary
  each: cost.efficiency
  cluster_level: true
  rule:
    warn_expr: "(item.get('p95_util_ratio') or 1) < 0.1 and (item.get('request_over_usage') or 0) >= 5"
  target: "'cluster'"
  evidence: "f\"{item.get('nodes')} nodes, allocatable {item.get('allocatable_cpu')} cores, 7-day p95 actual use {item.get('p95_used_cpu')} cores ({item.get('p95_util_ratio')}), request total {item.get('requested_cpu')} cores ({item.get('request_over_usage')}x actual use). Would requests still fit without the largest node: {item.get('can_drop_largest_node')}\""
  severity_default: low
  symptom_linked: false
  why: A small k3s cluster has no bill, so look at efficiency instead. Under 10% p95 utilization, most of the hardware is only burning electricity; when requests are over 5x actual use, "can one node be removed" comes out false because of requests -- lowering requests is the first step toward removing a node. Measured on a 2-node k3s k3s: 0.92 of 18 cores at p95 (5.1%), 6.42 cores requested (7x), N-1 not possible.
  suggest: "Lower requests to the p95 level (KRR). Once N-1 fits, power off one node or repurpose it."
  verify:
    - "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[1h])) / sum(kube_node_status_allocatable{resource=\"cpu\"})"
  profiles: [lab]
  test:
    cases:
      - expect: "warn"
        item:
          nodes: 2
          allocatable_cpu: 18.0
          p95_used_cpu: 0.92
          requested_cpu: 6.42
          p95_util_ratio: 0.051
          request_ratio: 0.357
          request_over_usage: 7.0
          can_drop_largest_node: false
      - expect: "pass"
        item:
          nodes: 2
          allocatable_cpu: 18.0
          p95_used_cpu: 0.92
          requested_cpu: 6.42
          p95_util_ratio: 0.3
          request_ratio: 0.357
          request_over_usage: 2.0
          can_drop_largest_node: false

# ---------- Security. Source: summary.security (lib/security.py). Secret values are never recorded anywhere ----------
- id: security.cluster-admin-bindings
  name: cluster-admin bound to non-system subjects
  area: security
  type: summary
  each: security.rbac
  cluster_level: true
  rule:
    expr: "bool(item['cluster_admin_non_system']) or bool(item['cluster_admin_namespace_bindings'])"
  target: "'cluster'"
  evidence: "f\"cluster-admin ClusterRoleBindings {[(b['binding'], b['non_system']) for b in item['cluster_admin_non_system']]}, namespace RoleBindings -> cluster-admin {item['cluster_admin_namespace_bindings'][:5]}. All cluster-admin bindings {[(b['binding'], [s['name'] for s in b['subjects']]) for b in item['cluster_admin_bindings']]}\""
  severity_default: high
  symptom_linked: false
  why: cluster-admin reads and changes every resource (Secrets included) in every namespace. The system:masters group and the EKS add-on manager are defaults; anything else bound to a user, group or ServiceAccount needs an individual reason. Bound to a CI runner or an ops tool SA, the whole cluster falls the moment that pod is compromised.
  suggest: "Replace with a least-privilege ClusterRole or narrow to a namespace Role. On EKS, use access entries with a policy per IAM principal."
  verify:
    - "kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name+\": \"+(.subjects|tostring)'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          clusterrolebindings: 60
          rolebindings: 40
          clusterroles: 80
          cluster_admin_bindings:
            - binding: "cluster-admin"
              subjects:
                - kind: "Group"
                  namespace: null
                  name: "system:masters"
              non_system: []
          cluster_admin_non_system:
            - binding: "ci-admin"
              subjects:
                - kind: "ServiceAccount"
                  namespace: "ci"
                  name: "runner"
              non_system:
                - kind: "ServiceAccount"
                  namespace: "ci"
                  name: "runner"
          cluster_admin_namespace_bindings: []
          wildcard_roles: []
          secret_readers: []
          bound_service_accounts: []
      - expect: "fail"
        item:
          clusterrolebindings: 60
          rolebindings: 40
          clusterroles: 80
          cluster_admin_bindings:
            - binding: "cluster-admin"
              subjects:
                - kind: "Group"
                  namespace: null
                  name: "system:masters"
              non_system: []
          cluster_admin_non_system: []
          cluster_admin_namespace_bindings:
            - binding: "prod-a/admin"
              subjects:
                - kind: "ServiceAccount"
                  namespace: "prod-a"
                  name: "deployer"
          wildcard_roles: []
          secret_readers: []
          bound_service_accounts: []
      - expect: "pass"
        item:
          clusterrolebindings: 60
          rolebindings: 40
          clusterroles: 80
          cluster_admin_bindings:
            - binding: "cluster-admin"
              subjects:
                - kind: "Group"
                  namespace: null
                  name: "system:masters"
              non_system: []
          cluster_admin_non_system: []
          cluster_admin_namespace_bindings: []
          wildcard_roles: []
          secret_readers: []
          bound_service_accounts: []

- id: security.rbac-wildcard
  name: Role/ClusterRole with wildcard (verbs and resources *) permissions is bound
  area: security
  type: summary
  each: security.rbac.wildcard_roles
  rule:
    expr: "item['bound'] and (item.get('prod') or item.get('clusterrole') is not None) and not any((sub.get('namespace') or '') in ('argocd', 'flux-system', 'kube-system', 'karpenter', 'cert-manager', 'external-secrets', 'monitoring', 'metallb-system') for sub in (item.get('bound_subjects') or []))"  # wildcards on platform controllers (e.g. Argo CD application-controller) are the upstream default -- warn
    warn_expr: "item['bound']"
  target: "item.get('clusterrole') or item.get('role')"
  evidence: "f\"{'ClusterRole ' + item['clusterrole'] if item.get('clusterrole') else 'Role ' + str(item.get('role'))}: * in verbs and resources, bound subjects {[(s.get('kind'), s.get('namespace'), s.get('name')) for s in item['bound_subjects'][:5]]}\""
  severity_default: medium
  symptom_linked: false
  why: >
    `verbs: ["*"]` + `resources: ["*"]` equals cluster-admin (cluster-wide for a ClusterRole, the whole namespace for a Role). Argo CD's application-controller uses it by design (it syncs every resource), but you must know that this SA is effectively a cluster administrator.
    Unbound wildcard Roles are not counted because they are not in use.
  suggest: "Leave what the operator design requires and state it in the report. For user workload SAs, list only the resources and verbs they need."
  verify:
    - "kubectl get clusterroles -o json | jq -r '.items[] | select(.rules[]? | (.verbs|index(\"*\")) and (.resources|index(\"*\"))) | .metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          clusterrole: "argocd-application-controller"
          role: null
          bound_subjects:
            - kind: "ServiceAccount"
              namespace: "prod-a"
              name: "argocd-application-controller"
          bound: true
          prod: false
      - expect: "fail"
        item:
          clusterrole: null
          role: "prod-a/god"
          bound_subjects:
            - kind: "ServiceAccount"
              namespace: "prod-a"
              name: "deployer"
          bound: true
          prod: true
      - expect: "warn"
        item:
          clusterrole: null
          role: "dev-a/god"
          bound_subjects:
            - kind: "ServiceAccount"
              namespace: "dev-a"
              name: "deployer"
          bound: true
          prod: false
      - expect: "pass"
        item:
          clusterrole: "argocd-application-controller"
          role: null
          bound_subjects: []
          bound: false
          prod: false

- id: security.secrets-read-permission
  name: User workload SA has cluster-wide Secret read permission
  area: security
  type: summary
  each: security.rbac.secret_readers
  rule:
    expr: "any(s.get('kind') == 'ServiceAccount' for s in item['bound_subjects'])"
    warn_expr: "True"
  target: "item['clusterrole']"
  evidence: "f\"ClusterRole {item['clusterrole']}: secrets get/list, bound subjects {[(s.get('kind'), s.get('namespace'), s.get('name')) for s in item['bound_subjects'][:5]]}\""
  severity_default: medium
  symptom_linked: false
  why: Cluster-wide `secrets list` can pull every secret in every namespace at once. Operators (Argo CD, External Secrets, cert-manager, KEDA) need it by design and are excluded; only SAs in user namespaces are considered.
  suggest: "Narrow to a namespace Role and restrict to specific Secrets with resourceNames."
  verify:
    - "kubectl auth can-i list secrets --all-namespaces --as=system:serviceaccount:<ns>:<sa>"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          clusterrole: "app-reader"
          bound_subjects:
            - kind: "ServiceAccount"
              namespace: "prod-a"
              name: "deployer"
      - expect: "warn"
        item:
          clusterrole: "app-reader"
          bound_subjects:
            - kind: "User"
              namespace: null
              name: "dev"
      - expect: "none"

- id: security.sa-token-mounted-without-rbac
  name: Token of an SA with no API permissions mounted in prod pods (automountServiceAccountToken)
  area: security
  type: summary
  each: security.service_accounts
  cluster_level: true
  rule:
    warn_expr: "len(item['token_mounted_without_rbac_prod']) > 0"
  target: "'cluster'"
  evidence: "f\"Workloads with token mounted {item['token_mounted']}/{item['workloads']}, of which {len(item['token_mounted_without_rbac_prod'])} prod workloads whose SA has no RoleBinding or ClusterRoleBinding at all: {item['token_mounted_without_rbac_prod'][:12]}. SAs with automount false {item['automount_false_sa']}/{item['service_accounts']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If the SA has no permissions, the token has no use, yet it sits inside the pod. When the app is compromised, the attacker can authenticate to the API server with that token (no permissions, but discovery and version info, and a foothold for privilege escalation attempts). Do not leave credentials around that are not used. Same item as Polaris automountServiceAccountToken.
  suggest: "Set `automountServiceAccountToken: false` on the Deployment (or on the SA). Only workloads that use the API keep true."
  verify:
    - "kubectl get pods -A -o json | jq -r '.items[] | select(.spec.automountServiceAccountToken!=false) | .metadata.namespace+\"/\"+.metadata.name' | wc -l"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          service_accounts: 100
          automount_false_sa: 5
          workloads: 80
          token_mounted: 75
          token_mounted_without_rbac: []
          token_mounted_without_rbac_prod:
            - "prod-a/deployment/web"
          irsa_service_accounts: []
      - expect: "pass"
        item:
          service_accounts: 100
          automount_false_sa: 5
          workloads: 80
          token_mounted: 75
          token_mounted_without_rbac: []
          token_mounted_without_rbac_prod: []
          irsa_service_accounts: []

- id: security.privileged-or-host-access
  name: Privileged containers, hostPID/IPC, dangerous capabilities (outside system namespaces)
  area: security
  type: summary
  each: security.pod_security.rows
  rule:
    expr: "item['severe'] and not item['system']"
    warn_expr: "item['host_access'] and not item['system']"
  target: "item['workload']"
  evidence: "f\"{item['flags']}, containers allowing root {item['root_allowed_containers']}\""
  severity_default: high
  symptom_linked: false
  why: >
    privileged, hostPID, hostIPC and SYS_ADMIN/NET_ADMIN remove container isolation. If that container is compromised, the node is compromised. System DaemonSets such as CNI, CSI and node-exporter need it by design and are kept separately as severe_system. hostNetwork and hostPath are rated one level lower (warn).
    Measured on real clusters: a VPN proxy with NET_ADMIN and hostPath /dev/net/tun on EKS; a TURN server with hostNetwork on the small k3s cluster.
  suggest: "Add only the capabilities that are truly needed, specific capabilities instead of privileged, CSI instead of hostPath. Prevent recurrence with a PSA baseline/restricted label on the namespace."
  verify:
    - "kubectl get pods -A -o json | jq -r '.items[] | select(.spec.containers[].securityContext.privileged==true or .spec.hostPID==true) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          prod: true
          system: false
          flags:
            - "privileged:app"
          root_allowed_containers:
            - "app"
          severe: true
          host_access: false
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          prod: true
          system: false
          flags:
            - "capabilities app:NET_ADMIN"
          root_allowed_containers:
            - "app"
          severe: true
          host_access: false
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          prod: true
          system: false
          flags:
            - "hostNetwork"
          root_allowed_containers:
            - "app"
          severe: false
          host_access: true
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "kube-system"
          prod: true
          system: true
          flags:
            - "privileged:x"
          root_allowed_containers:
            - "app"
          severe: true
          host_access: false
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          prod: true
          system: false
          flags: []
          root_allowed_containers:
            - "app"
          severe: false
          host_access: false

- id: security.psa-not-enforced
  name: prod namespaces without a Pod Security Admission label
  area: security
  type: summary
  each: security.pod_security
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_without_psa']) > 0"
  target: "'cluster'"
  evidence: "f\"Namespaces with an enforce label {item['psa_enforced_namespaces']}, prod without one {item['prod_without_psa']}. Share of containers allowing root {item['root_allowed_ratio']} ({len(item['root_allowed_prod'])} prod workloads)\""
  severity_default: medium
  symptom_linked: false
  why: PSA (`pod-security.kubernetes.io/enforce: baseline|restricted`) is the built-in mechanism that blocks settings like privileged, hostPath and root per namespace. Without the label nothing is blocked. Start with the `warn` and `audit` labels to see which pods would be caught, then raise to `enforce`.
  suggest: "On prod namespaces: `pod-security.kubernetes.io/warn: baseline` -> fix the violating pods -> `enforce: baseline`. System namespaces stay privileged."
  verify:
    - "kubectl get ns -o json | jq -r '.items[] | .metadata.name+\" \"+(.metadata.labels[\"pod-security.kubernetes.io/enforce\"] // \"none\")'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workloads: 80
          rows: []
          severe: []
          severe_system:
            - "kube-system/daemonset/aws-node"
          host_access_non_system: []
          root_allowed_prod: []
          root_allowed_ratio: 0.6
          psa: {}
          psa_enforced_namespaces: []
          prod_without_psa:
            - "prod-a"
      - expect: "pass"
        item:
          workloads: 80
          rows: []
          severe: []
          severe_system:
            - "kube-system/daemonset/aws-node"
          host_access_non_system: []
          root_allowed_prod: []
          root_allowed_ratio: 0.6
          psa: {}
          psa_enforced_namespaces:
            - "prod-a"
          prod_without_psa: []

- id: security.plaintext-secret-env
  name: Secret-looking environment variables set as plain-text values (variable names only are recorded)
  area: security
  type: summary
  each: security.secrets.plaintext_env
  rule:
    expr: "item['prod']"
    warn_expr: "True"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"Container {item['container']} env {item['env_names']} is a literal value rather than a secretKeyRef (value not recorded)\""
  severity_default: high
  symptom_linked: false
  why: >
    A literal value in the manifest is exposed in Git, kubectl describe pod, the Argo CD UI and crash dumps. Variables named PASSWORD, SECRET, TOKEN or API_KEY were selected; values that are numbers, booleans, short strings, paths or Reloader's STAKATER_* were excluded. It is still a name-based guess, so these are "candidates".
    Measured on a k3s: an Elasticsearch/Kibana ELASTIC_PASSWORD set in plain text in a Deployment, a StatefulSet and a CronJob.
  suggest: "Move to a Secret and use valueFrom.secretKeyRef. If there is an external store, pull it in with an ExternalSecret. Rotate the value (treat it as already exposed)."
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].env[?(@.value)].name}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          container: "app"
          env_names:
            - "DB_PASSWORD"
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          container: "app"
          env_names:
            - "DB_PASSWORD"
      - expect: "none"

- id: security.externalsecret-not-ready
  name: ExternalSecret not syncing (Ready False)
  area: security
  type: summary
  each: security.secrets.externalsecrets_not_ready
  rule:
    expr: "True"
  target: "item['namespace'] + '/' + item['name']"
  evidence: "f\"Ready False ({item['reason']}): {item['message']}\""
  severity_default: medium
  symptom_linked: true
  why: When an ExternalSecret is not Ready, the target Secret is either not created (a new app cannot start) or stops refreshing (secret rotation is not applied). Causes are external store permissions, paths, or IRSA expiry. Same target as operators.unhealthy-condition, but viewed again in the security section as "secret supply is broken".
  suggest: "kubectl describe externalsecret events, the SecretStore's authentication (IRSA role and policy), and whether the key exists in the external store."
  verify:
    - "kubectl get externalsecrets -A | grep -v SecretSynced"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "db-creds"
          reason: "SecretSyncedError"
          message: "could not get secret data from provider"
          prod: true
      - expect: "none"

- id: security.eks-secrets-encryption-off
  name: EKS Secret KMS envelope encryption is off
  area: security
  type: summary
  each: security.secrets
  cluster_level: true
  rule:
    expr: "item.get('platform') == 'eks' and item.get('kms_encryption') is not None and not item['kms_encryption'].get('enabled')"
  target: "'cluster'"
  evidence: "f\"describe-cluster encryptionConfig {item.get('kms_encryption')}\""
  severity_default: high
  symptom_linked: false
  why: Secrets in etcd are base64 by default (not encryption). EKS can enable envelope encryption with a KMS key; without it, secrets remain in plain text in etcd backups and snapshots. It can be enabled after creation (and cannot be disabled once on).
  suggest: "aws eks associate-encryption-config --cluster-name <c> --encryption-config '[{\"resources\":[\"secrets\"],\"provider\":{\"keyArn\":\"<kms>\"}}]' (suggestion only)."
  verify:
    - "aws eks describe-cluster --name <c> --query 'cluster.encryptionConfig'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          plaintext_env: []
          plaintext_env_prod: []
          externalsecrets: 40
          externalsecrets_not_ready: []
          secret_types:
            Opaque: 70
          kms_encryption:
            enabled: false
            resources: []
            key: null
          platform: "eks"
      - expect: "pass"
        item:
          plaintext_env: []
          plaintext_env_prod: []
          externalsecrets: 40
          externalsecrets_not_ready: []
          secret_types:
            Opaque: 70
          kms_encryption:
            enabled: true
            resources:
              - "secrets"
            key: "arn:x"
          platform: "eks"
      - expect: "pass"
        item:
          plaintext_env: []
          plaintext_env_prod: []
          externalsecrets: 40
          externalsecrets_not_ready: []
          secret_types:
            Opaque: 70
          kms_encryption: null
          platform: "k3s"

- id: security.networkpolicy-not-enforced
  name: NetworkPolicies exist but the CNI does not enforce them
  area: security
  type: summary
  each: security.networkpolicy
  cluster_level: true
  rule:
    expr: "item['policies_but_not_enforced']"
    warn_expr: "item['enforced'] is None and item['policies'] > 0"
  target: "'cluster'"
  evidence: "f\"{item['policies']} NetworkPolicies ({item['namespaces_with_policy']}), enforced {item['enforced']}: {item['enforcement']}\""
  severity_default: high
  symptom_linked: false
  why: >
    NetworkPolicy is implemented by the CNI. VPC CNI needs the add-on setting enableNetworkPolicy (aws-eks-nodeagent --enable-network-policy=true), and only then are PolicyEndpoint objects created. When it is off, policies are merely stored and all traffic passes. Whoever wrote the policy believes it is blocking.
    Measured on a real EKS cluster: 3 NetworkPolicies in production namespaces with --enable-network-policy=false and 0 PolicyEndpoints. k3s enforces by default through its built-in kube-router (unless --disable-network-policy).
  suggest: "VPC CNI add-on configurationValues {\"enableNetworkPolicy\": \"true\"} (aws eks update-addon, suggestion only) -> confirm PolicyEndpoints are created -> then default-deny."
  verify:
    - "kubectl -n kube-system get ds aws-node -o jsonpath='{.spec.template.spec.containers[?(@.name==\"aws-eks-nodeagent\")].args}'; kubectl get policyendpoints -A"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny: []
          enforced: false
          enforcement: "aws-eks-nodeagent --enable-network-policy=false, PolicyEndpoints 0"
          policies_but_not_enforced: true
      - expect: "warn"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny: []
          enforced: null
          enforcement: "CNI needs checking"
          policies_but_not_enforced: false
      - expect: "pass"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny: []
          enforced: true
          enforcement: "aws-eks-nodeagent --enable-network-policy=true, PolicyEndpoints 3"
          policies_but_not_enforced: false
      - expect: "pass"
        item:
          policies: 0
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny: []
          enforced: false
          enforcement: "aws-eks-nodeagent --enable-network-policy=true, PolicyEndpoints 3"
          policies_but_not_enforced: false

- id: security.no-default-deny
  name: prod namespaces without a default-deny ingress NetworkPolicy
  area: security
  type: summary
  each: security.networkpolicy
  cluster_level: true
  rule:
    warn_expr: "item['enforced'] is not False and len(item['prod_without_default_deny']) > 0"
  target: "'cluster'"
  evidence: "f\"Namespaces with default-deny (ingress, empty podSelector) {item['default_deny_ingress_namespaces']}, prod without one {item['prod_without_default_deny']}. Enforced {item['enforced']}\""
  severity_default: medium
  symptom_linked: false
  why: By default every pod can talk to every pod. Each namespace should have one "deny inbound by default" policy and open only the needed paths, so a compromised pod cannot spread sideways (security.networkpolicy-coverage asks "is there any policy"; this check asks "is there a default deny"). It is meaningless when the CNI does not enforce, so then only networkpolicy-not-enforced is reported.
  suggest: "Per namespace: a podSelector {} + policyTypes [Ingress] policy -> allow paths from the ingress controller and monitoring -> then the needed service-to-service paths."
  verify:
    - "kubectl get networkpolicies -A -o json | jq -r '.items[] | select(.spec.podSelector=={} and (.spec.ingress==null or .spec.ingress==[])) | .metadata.namespace'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces: []
          prod_without_default_deny:
            - "prod-a"
          enforced: true
          enforcement: "aws-eks-nodeagent --enable-network-policy=true, PolicyEndpoints 3"
          policies_but_not_enforced: false
      - expect: "pass"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny: []
          enforced: true
          enforcement: "aws-eks-nodeagent --enable-network-policy=true, PolicyEndpoints 3"
          policies_but_not_enforced: false
      - expect: "pass"
        item:
          policies: 3
          namespaces_with_policy:
            - "prod-a"
          default_deny_ingress_namespaces:
            - "prod-a"
          prod_without_default_deny:
            - "prod-a"
          enforced: false
          enforcement: "aws-eks-nodeagent --enable-network-policy=true, PolicyEndpoints 3"
          policies_but_not_enforced: true

- id: security.imds-hop-limit
  name: Node IMDS reachable from pods (hop limit 2 or more, or tokens optional)
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: security.aws
  cluster_level: true
  rule:
    expr: "item.get('applicable') and any(x.get('tokens') != 'required' for x in (item.get('imds_hop_limit_gt1') or []))"  # only IMDSv1 allowed (tokens optional) fails -- hop 2 + tokens required is the EKS managed node group default, so warn
    warn_expr: "item.get('applicable') and len(item.get('imds_hop_limit_gt1') or []) > 0"
  target: "'cluster'"
  evidence: "f\"Of {item.get('instances')} instances, {len(item.get('imds_hop_limit_gt1') or [])} with IMDS hop limit > 1 or tokens optional: {item.get('imds_by_setting')}. Examples {[(i['name'], i['type'], i['hop_limit'], i['tokens']) for i in (item.get('imds_hop_limit_gt1') or [])[:4]]}. EC2NodeClass metadataOptions {item.get('ec2nodeclass_metadata')}. IRSA SAs {len(item.get('irsa_service_accounts') or [])}, Pod Identity {item.get('pod_identity_associations')}\""
  severity_default: high
  symptom_linked: false
  why: >
    With a hop limit of 2, a pod network namespace can reach 169.254.169.254 and obtain the node instance role's credentials. Then every pod not using IRSA has the node role's permissions (the EKS node role covers ECR, CNI, EBS and more). With hop limit 1 only the node can reach it.
    Workloads using IRSA or Pod Identity do not need IMDS. Measured on a 7-node EKS cluster: all nodes at hop 2 (tokens required), 6 IRSA SAs.
  suggest: "Karpenter EC2NodeClass spec.metadataOptions.httpPutResponseHopLimit 1, and 1 in the managed node group launch template as well. Only hostNetwork pods (CNI, CSI) need IMDS and they work with hop 1."
  verify:
    - "aws ec2 describe-instances --filters Name=tag:kubernetes.io/cluster/<c>,Values=owned --query 'Reservations[].Instances[].MetadataOptions.HttpPutResponseHopLimit'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          applicable: true
          instances: 7
          imds_hop_limit_gt1:
            - id: "i-1"
              type: "m5.large"
              name: "n"
              hop_limit: 2
              tokens: "optional"
          imds_by_setting:
            "hop=2 tokens=required": 7
          ec2nodeclass_metadata: []
          irsa_service_accounts:
            - "kube-system/ebs-csi-controller-sa"
          pod_identity_associations: 0
          oidc_provider: true
          instances_source: "aws/ec2-instances-imds.json"
      - expect: "pass"
        item:
          applicable: true
          instances: 7
          imds_hop_limit_gt1: []
          imds_by_setting:
            "hop=1 tokens=required": 7
          ec2nodeclass_metadata: []
          irsa_service_accounts:
            - "kube-system/ebs-csi-controller-sa"
          pod_identity_associations: 0
          oidc_provider: true
          instances_source: "aws/ec2-instances-imds.json"
      - expect: "pass"
        item:
          applicable: false

- id: security.polaris-security-danger
  name: Workloads with Polaris security-category danger (root allowed, privilege escalation, privileged, host access)
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: security.polaris
  cluster_level: true
  requires_tool: polaris
  rule:
    expr: "item.get('present') and len(item.get('danger_workloads_prod') or []) > 0"
    warn_expr: "item.get('present') and len(item.get('danger_workloads') or []) > 0"
  target: "'cluster'"
  evidence: "f\"Polaris score {item.get('score')}. Security danger workloads {len(item.get('danger_workloads') or [])} (prod {len(item.get('danger_workloads_prod') or [])}): per check {item.get('danger_check_counts')}. prod list {(item.get('danger_workloads_prod') or [])[:12]}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The Polaris Security category rates runAsRootAllowed, privilegeEscalationAllowed, runAsPrivileged, hostNetwork/PID, dangerousCapabilities and sensitiveContainerEnvVar as danger. On both measured clusters more than half of user workloads allowed runAsRoot and privilegeEscalation -- the cause is chart defaults (no securityContext),
    so a finding per workload would be dozens of items (68 on the small k3s cluster); instead one cluster-level finding is reported and the list goes into the evidence and summary.security.polaris.workloads. What actually breaks isolation is reported separately as fail by privileged-or-host-access.
  suggest: "A shared chart securityContext: runAsNonRoot true, allowPrivilegeEscalation false, capabilities drop ALL, readOnlyRootFilesystem true (emptyDir for writable paths). PSA restricted enforces the same."
  verify:
    - "polaris audit --context <ctx> --format pretty --only-show-failed-tests --severity danger"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          score: 79
          danger_workloads: ["prod-a/deployment/web", "dev-a/deployment/x"]
          danger_workloads_prod: ["prod-a/deployment/web"]
          danger_check_counts:
            runAsRootAllowed: 2
      - expect: "warn"
        item:
          present: true
          score: 90
          danger_workloads: ["dev-a/deployment/x"]
          danger_workloads_prod: []
          danger_check_counts:
            runAsRootAllowed: 1
      - expect: "pass"
        item:
          present: true
          score: 100
          danger_workloads: []
          danger_workloads_prod: []
          danger_check_counts: {}
      - expect: "pass"
        item:
          present: false


