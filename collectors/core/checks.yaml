- id: node.kernel-lockup
  name: Kernel soft lockup / hung task / RCU stall
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('lockup', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) lockup/hung task/rcu stall {item['kernel']['counts'].get('lockup')} times. Samples: {[s[:140] for s in item['kernel']['samples'] if any(k in s for k in ('lockup','hung_task','blocked for','rcu'))][:3]}\""
  severity_default: high
  symptom_linked: true
  why: >
    When a CPU is stuck inside the kernel for over 20 seconds (soft lockup) or a task waiting on I/O stalls for over 120 seconds (hung task), the node's network and disk stall with it.
    GitHub's network stall incident was this. The symptom looks like timeouts and latency; the cause is in the kernel.
  suggest: Correlate with pod restarts and latency metrics at the same time. If it recurs, replace the kernel (AMI) or drain the node. Known cases were caused by the cAdvisor collection interval and cgroup memory statistics collection.
  verify:
    - "journalctl -k --since -24h | grep -E 'soft lockup|hung_task|blocked for more than|rcu'"
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-1"
          roles:
            - "worker"
          collected: true
          meta:
            root: true
            kernel: "5.15.0-100"
            os: "Ubuntu 22.04"
