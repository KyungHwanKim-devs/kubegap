- id: traffic.ingress-p95-latency
  name: Ingress p95 response time is high
  area: traffic
  type: summary
  each: traffic.ingresses
  rule:
    expr: "(item['metrics'].get('p95_s_avg') or 0) >= 2.0 and (item['metrics'].get('requests') or 0) >= 100"
    warn_expr: "(item['metrics'].get('p95_s_avg') or 0) >= 1.0 and (item['metrics'].get('requests') or 0) >= 100"
  target: "item['target']"
  evidence: "f\"{item['hosts'][:2]}: p95 avg {item['metrics'].get('p95_s_avg')}s, 1h max {item['metrics'].get('p95_s_max_1h')}s, {item['metrics'].get('requests')} requests/{item['metrics'].get('window')} (source {item['metrics'].get('source')})\""
  severity_default: medium
  symptom_linked: true
  why: >
    p95 response time is the latency signal of the four golden signals. ALB TargetResponseTime runs from the LB sending the request to the target until the first byte back, so it is app time without the network. An API above 1s feels slow to users; at 2s timeouts and retries begin.
    ALB gives a p95 over 1-hour statistics, so bursts inside the hour are hidden (check the 1-hour maximum alongside).
  suggest: "Identify slow endpoints (app metrics, logs), check DB query and external call timeouts, and CPU limit throttling (resources.cpu-throttling)."
  verify:
    - "aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB --metric-name TargetResponseTime --dimensions Name=LoadBalancer,Value=<dim> Name=TargetGroup,Value=<dim> --extended-statistics p95 --period 300 --start-time <1h ago> --end-time <now>"
