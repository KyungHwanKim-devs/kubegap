- id: resilience.cronjob-stale
  name: CronJob has not succeeded for much longer than its schedule (or failed Jobs remain)
  area: resilience
  type: summary
  each: resilience.cronjobs.rows
  rule:
    expr: "item['stale'] and not item['suspend']"
    warn_expr: "bool(item['failed_jobs'])"
  target: "item['target']"
  evidence: "f\"schedule '{item['schedule']}' (about every {item['interval_h']}h), last success {item['last_success']} ({item['hours_since_success']}h ago), last schedule {item['last_schedule']}, active Jobs {item['active_jobs']}, failed Jobs {item['failed_jobs']}, suspend {item['suspend']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    Backup, cleanup and sync CronJobs are only worth anything when they succeed. If the last success is more than 3 intervals ago, it has stopped quietly (image pull failure, expired secret, full disk). If failed Jobs remain, the reason is in the Job's conditions.
    Measured on a k3s k3s: 6 CronJobs with no success for days to weeks.
  suggest: "`kubectl get jobs -n <ns> -l <cronjob label>` and the pod logs of the failed Job. Check whether a KubeJobFailed alert had been firing (observability.alert-firing-stale)."
  verify:
    - "kubectl get cronjobs -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SCHEDULE:.spec.schedule,LAST:.status.lastScheduleTime,SUCCESS:.status.lastSuccessfulTime"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "backup"
          target: "prod-a/backup"
          schedule: "0 3 * * *"
          interval_h: 24.0
          suspend: false
          concurrency_policy: "Forbid"
          starting_deadline_s: null
          backoff_limit: 2
          active_deadline_s: 1800
          ttl_s: null
          pod_failure_policy: false
