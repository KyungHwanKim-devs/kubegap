- id: node.reboot-required
  name: Nodes needing a reboot (kernel or system updates not applied)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['updates']['reboot_required'] and item['meta']['uptime_days'] >= 180"
    warn_expr: "item['updates']['reboot_required'] or item['meta']['uptime_days'] >= 365"
  target: "item['node']"
  evidence: "f\"reboot-required {item['updates']['reboot_required']}, uptime {item['meta']['uptime_days']} days, running kernel {item['meta']['kernel']}, pending updates {item['updates'].get('updates_total')} (security {item['updates'].get('security_updates')})\""
  severity_default: low
  symptom_linked: false
  why: Installed, but the running kernel is the old one. Months pass with security patches not applied, and everything changes at once on the eventual reboot with unexpected behaviour. If the reboot sequence (drain, reboot, uncordon) is not in the runbook, nobody does it.
