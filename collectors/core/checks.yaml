- id: scaling.no-hpa-serving-prod
  name: Traffic-serving production Deployment has no HPA or ScaledObject
  area: scaling
  type: object
  inputs: [objects/deployments.json, objects/horizontalpodautoscalers.autoscaling.json, objects/services.json]
  rule:
    # warn-only (no expr): replicas 1 is already a fail in resilience single-replica, so no second fail here. Missing HPA alone is a low warn
    warn_expr: "prod and serves_traffic(obj) and not hpa_covers(obj) and not any(p.get('containerPort') in (5432, 3306, 6379, 27017, 9200, 5672, 9092, 11211, 7687, 2379) for c in containers(obj) for p in (c.get('ports') or []))"
  evidence: "f\"replicas {spec.get('replicas')}, has container ports and a Service, no HPA or ScaledObject\""
  severity_default: low
  symptom_linked: false
  why: >
    If other HPAs in the same namespace have sat at min for 15 days with CPU under half the target (summary.scaling.hpa.idle_namespaces), the answer is not "add an HPA" but that requests are oversized, so this is lowered to warn.
    Without an autoscaler on a traffic-serving production service, the current replica count is all the peak capacity there is. Conversely, keeping peak replicas running all the time costs money.
    With replicas 1, resilience.single-replica-in-prod points at the same workload for a different reason. fail is replicas 1 (no means to grow at peak at all); fixed replicas of 2 or more is warn.
    Containers that open DB ports (5432, 3306, 6379, 27017, 9200, 5672, 9092, 11211, 7687, 2379) are not horizontal scaling candidates and are excluded (e.g. Postgres run as a Deployment).
  suggest: "Start with one CPU HPA (min 2, max 4-6, target 60-70%). Requests must be p95-based for utilization to mean anything (together with resources.cpu-request-overprovisioned)."
  verify:
    - "kubectl get hpa,scaledobject -n <ns>"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"  # replicas 1 is also warn
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
          services:
            - kind: "Service"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                type: "ClusterIP"
                selector:
                  app: "web"
                ports:
                  - port: 80
                    targetPort: 8080
          horizontalpodautoscalers.autoscaling: []
      - expect: "warn"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 2
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
          services:
            - kind: "Service"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                type: "ClusterIP"
                selector:
                  app: "web"
                ports:
                  - port: 80
                    targetPort: 8080
          horizontalpodautoscalers.autoscaling: []
      - expect: "pass"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 5432
          services:
            - kind: "Service"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                type: "ClusterIP"
                selector:
                  app: "web"
                ports:
                  - port: 80
                    targetPort: 8080
          horizontalpodautoscalers.autoscaling: []
      - expect: "pass"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
          services:
            - kind: "Service"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                type: "ClusterIP"
                selector:
                  app: "web"
                ports:
                  - port: 80
                    targetPort: 8080
          horizontalpodautoscalers.autoscaling:
            - metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                scaleTargetRef:
                  kind: "Deployment"
                  name: "web"
                maxReplicas: 3

- id: scaling.keda-scaledobject-not-ready
  name: KEDA ScaledObject is not Ready or is in fallback
  area: scaling
  type: summary
  each: scaling.keda.scaledobjects
  rule:
    expr: "(not item['ready']) or item['paused']"
    warn_expr: "item['fallback_active'] or (item.get('scaler_errors_24h') or 0) > 0"
  target: "item['target']"
  evidence: "f\"ScaledObject {item['namespace']}/{item['name']}: ready {item['ready']}, active {item['active']}, fallback {item['fallback_active']}, paused {item['paused']}, triggers {item['triggers']}, 24h scaler errors {item.get('scaler_errors_24h')}. {item['ready_message']}\""
  severity_default: high
  symptom_linked: true
  why: >
    Ready=False means KEDA cannot read its trigger (Kafka lag, Prometheus, metrics-api) and the HPA has stopped (expired auth Secret, changed endpoint). fallback means it is holding at a fixed replica count in that state; if it lasts, peaks are missed.
    Active=False is the normal state where the trigger value is 0 and replicas went down to min.
  suggest: "Conditions and Events in `kubectl describe scaledobject -n <ns> <name>`, and `kubectl -n keda logs deploy/keda-operator | grep -iE 'error|auth'`."
  verify:
    - "kubectl get scaledobjects -A"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "so"
          target: "prod-a/worker"
          min: 1
          max: 5
          idle: null
          triggers:
            - "kafka"
          polling_s: 30
          cooldown_s: 300
          fallback: false
          ready: false
          active: false
          fallback_active: false
          paused: false
          ready_message: "auth failed"
          hpa: "keda-hpa-so"
          scaler_errors_24h: null
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "so"
          target: "prod-a/worker"
          min: 1
          max: 5
          idle: null
          triggers:
            - "kafka"
          polling_s: 30
          cooldown_s: 300
          fallback: false
          ready: true
          active: false
          fallback_active: true
          paused: false
          ready_message: "ok"
          hpa: "keda-hpa-so"
          scaler_errors_24h: null
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "so"
          target: "prod-a/worker"
          min: 1
          max: 5
          idle: null
          triggers:
            - "kafka"
          polling_s: 30
          cooldown_s: 300
          fallback: false
          ready: true
          active: false
          fallback_active: false
          paused: false
          ready_message: "ok"
          hpa: "keda-hpa-so"
          scaler_errors_24h: 5
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "so"
          target: "prod-a/worker"
          min: 1
          max: 5
          idle: null
          triggers:
            - "kafka"
          polling_s: 30
          cooldown_s: 300
          fallback: false
          ready: true
          active: false
          fallback_active: false
          paused: false
          ready_message: "ok"
          hpa: "keda-hpa-so"
          scaler_errors_24h: null

- id: scaling.pod-pending-long
  name: Pod has been Pending for a long time
  area: scaling
  type: metric
  inputs: [pod_pending_seconds]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 600, lab: 600 }
    warn_threshold: { prod: 120, lab: 120 }
  target: "workload(labels)"
  evidence: "f\"Pod {labels['pod']}: Pending for {value/60:.0f} min\""
  severity_default: high
  symptom_linked: true
  why: >
    Karpenter normally brings up a node within 1-2 minutes (measured on an EKS cluster: launched→initialized p50 62s). Pending for more than 10 minutes means room cannot be made: NodePool limits or requirement mismatch, capacity shortage (InsufficientInstanceCapacity), PVC binding, taints/affinity.
    A small k3s cluster has no node autoscaler, so Pending there means "cannot start once one node is gone".
  suggest: "Events in `kubectl describe pod` (FailedScheduling reason) and the Karpenter logs (`failed`, `insufficient`). summary.scaling.karpenter.launch_failures_24h."
  verify:
    - "kubectl get pods -A --field-selector status.phase=Pending"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          pod_pending_seconds:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
              value: 900
      - expect: "warn"
        metric:
          pod_pending_seconds:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
              value: 200
      - expect: "pass"
        metric:
          pod_pending_seconds:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
              value: 70
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          pod_pending_seconds:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
              value: 600

- id: scaling.karpenter-nodeclaim-slow
  name: Karpenter nodes take long to come up (launched → initialized)
  area: scaling
  type: summary
  each: scaling.karpenter.nodeclaims
  rule:
    expr: "(item.get('initialized_s') or 0) >= 300"
    warn_expr: "(item.get('initialized_s') or 0) >= 180"
  target: "item['name']"
  evidence: "f\"NodeClaim {item['name']} ({item['instance_type']} {item['capacity_type']} {item['zone']}): created → Launched {item['launched_s']}s, Registered {item['registered_s']}s, Initialized {item['initialized_s']}s\""
  severity_default: medium
  symptom_linked: true
  why: >
    Creation to Initialized is how long pending pods wait. Normally 60-90s (measured p50 62s). Over 3 minutes means a large AMI (mixed AL2 and AL2023 during a transition), slow bootstrap scripts or CNI init, or a large image pull delaying Initialized.
  suggest: "Look for a pattern (instance family, AZ) in summary.scaling.karpenter.latency_24h.slowest and check the node boot log (SSM) for the slow stage."
  verify:
    - "kubectl get nodeclaims -o custom-columns=NAME:.metadata.name,CREATED:.metadata.creationTimestamp,READY:.status.conditions[?(@.type==\"Ready\")].lastTransitionTime"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          name: "default-abc"
          pool: "default"
          node: "node-a"
          instance_type: "r7g.large"
          capacity_type: "spot"
          zone: "us-east-1a"
          arch: "arm64"
          created: "2026-10-25T00:00:00Z"
          age_h: 10.0
          launched_s: 5
          registered_s: 50
          initialized_s: 400
          ready: true
          expired: false
          drifted: false
          expire_after_h: 720.0
          hours_past_expiry: null
          disruption_blocked: {}
          allocatable_cpu: "1930m"
      - expect: "warn"
        item:
          name: "default-abc"
          pool: "default"
          node: "node-a"
          instance_type: "r7g.large"
          capacity_type: "spot"
          zone: "us-east-1a"
          arch: "arm64"
          created: "2026-10-25T00:00:00Z"
          age_h: 10.0
          launched_s: 5
          registered_s: 50
          initialized_s: 200
          ready: true
          expired: false
          drifted: false
          expire_after_h: 720.0
          hours_past_expiry: null
          disruption_blocked: {}
          allocatable_cpu: "1930m"
      - expect: "pass"
        item:
          name: "default-abc"
          pool: "default"
          node: "node-a"
          instance_type: "r7g.large"
          capacity_type: "spot"
          zone: "us-east-1a"
          arch: "arm64"
