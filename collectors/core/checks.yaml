- id: node.kubelet-eviction-memory-missing
  name: kubelet evictionHard has no memory.available
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kubelet'].get('available') and item['kubelet'].get('eviction_hard_empty')"
    warn_expr: "item['kubelet'].get('available') and item['kubelet'].get('eviction_memory_missing')"
  target: "item['node']"
  evidence: "f\"configz evictionHard {item['kubelet'].get('eviction_hard')}, evictionSoft {item['kubelet'].get('eviction_soft')}, imageGC {item['kubelet'].get('image_gc_low')}~{item['kubelet'].get('image_gc_high')}%\""
  severity_default: medium
  symptom_linked: false
  why: Without a memory.available threshold, kubelet cannot evict pods in an orderly way under memory pressure and the kernel OOM killer picks victims at random instead. The Kubernetes default is memory.available<100Mi, nodefs.available<10%, imagefs.available<15%. The k3s default only has nodefs/imagefs 5%.
