- id: resilience.prod-db-without-backup-cronjob
  name: Production DB workload has no backup CronJob
  area: resilience
  type: summary
  each: resilience.backup
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_db_without_backup_cronjob']) > 0"
  target: "'cluster'"
  evidence: "f\"Of {item['db_workloads_with_pvc']} DB workloads with a PVC, production DBs without a backup CronJob in the same namespace: {item['prod_db_without_backup_cronjob']}. Backup CronJobs {item['count']} (local only {len(item['local_only'])}, same node as source {len(item['same_node'])})\""
  severity_default: medium
  symptom_linked: false
  why: >
    resilience.no-backup asks whether the cluster has any backup mechanism (Velero, k8up, etcd snapshots, dump CronJobs). This check is one level down — does each DB have a dump. A CronJob with backup, dump or snapshot in its name in the same namespace counts as present (operator CR backups and external backups are invisible → warn at most).
    Measured: on an EKS cluster none of the 5 production DBs had one (nor EBS snapshots, storage section); on a small k3s cluster, 2 production Postgres instances.
  suggest: "A dump CronJob (pg_dump, mysqldump) per DB plus an off-node copy. On EKS an EBS snapshot policy (DLM) or Velero can replace it — then suppress this warning."
  verify:
    - "kubectl get cronjobs -A | grep -iE 'backup|dump|snapshot'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          count: 7
          local_only:
            - "prod-i/app-k-postgres-backup"
            - "prod-h/app-i-postgres-backup"
            - "prod-m/app-i-postgres-mx-backup"
            - "prod-n/app-i-postgres-vn-backup"
            - "app-o-api/app-o-postgres-backup"
            - "app-l-prod/app-l-mysql-backup"
            - "prod-k/app-m-postgres-backup"
          same_node:
            - "prod-h/app-i-postgres-backup"
            - "prod-m/app-i-postgres-vn-backup"
            - "app-o-api/app-o-postgres-backup"
            - "app-l-prod/app-l-mysql-backup"
            - "prod-k/app-m-postgres-backup"
          prod_db_without_backup_cronjob:
            - "prod-l/statefulset/app-n-postgres"
          db_workloads_with_pvc: 16
      - expect: "pass"
        item:
          count: 7
          local_only:
            - "prod-i/app-k-postgres-backup"
            - "prod-h/app-i-postgres-backup"
            - "prod-m/app-i-postgres-mx-backup"
            - "prod-n/app-i-postgres-vn-backup"
            - "app-o-api/app-o-postgres-backup"
            - "app-l-prod/app-l-mysql-backup"
            - "prod-k/app-m-postgres-backup"
          same_node:
            - "prod-h/app-i-postgres-backup"
            - "prod-m/app-i-postgres-vn-backup"
            - "app-o-api/app-o-postgres-backup"
            - "app-l-prod/app-l-mysql-backup"
            - "prod-k/app-m-postgres-backup"
          prod_db_without_backup_cronjob: []
          db_workloads_with_pvc: 16
- id: security.plaintext-configmap-secret
  name: Secret-like keys or config lines inside a ConfigMap (key names only are recorded)
  area: security
  type: summary
  each: security.secrets.plaintext_configmap
  rule:
    expr: "item['prod']"
    warn_expr: "True"
  target: "item['target']"
  evidence: "f\"{item['target']}: keys {item['keys']}, mounted/referenced by {item['mounted_by']}\""
  severity_default: high
  symptom_linked: false
  why: >
    Unlike a Secret, a ConfigMap is readable by anyone with configmaps get/list in RBAC and appears as-is in the Argo CD UI, kubectl describe and Git. A password line inside a config file (e.g. a fluent-bit `HTTP_Passwd`) is the same.
    Detection uses key names (PASSWORD, SECRET, TOKEN, API_KEY) and value shape (8+ characters; not a number, boolean, path or template), and **values are never recorded**. Being name-based, it is still a candidate.
    Measured on a k3s k3s: three ConfigMaps carrying an OAuth client secret, a JWT secret and third-party API tokens.
  suggest: "Move to a Secret and mount via envFrom secretRef or a volume. Pull hardcoded values out of scripts into env sourced from the Secret. Rotate anything already exposed."
  verify:
    - "kubectl get configmap -n <ns> <name> -o jsonpath='{.data}' | grep -oiE '(password|secret|token|api_key)[^,]{0,20}' | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-i"
          name: "batch-scripts"
          target: "prod-i/configmap/batch-scripts"
          prod: true
          keys:
            - "autopost.py:client_secret"
            - "autopost.py:resource_owner_secret"
          mounted_by:
            - "prod-i/cronjob/batch-autopost-en"
            - "prod-m/cronjob/batch-autopost-ja"
            - "prod-n/cronjob/batch-digest-day"
            - "prod-o/cronjob/batch-digest-month"
            - "prod-p/cronjob/batch-digest-week"
            - "prod-q/cronjob/batch-radar-global"
      - expect: "warn"
        item:
          namespace: "default"
          name: "batch-scripts"
          target: "default/configmap/x"
          prod: false
          keys:
            - "autopost.py:client_secret"
            - "autopost.py:resource_owner_secret"
          mounted_by:
            - "prod-i/cronjob/batch-autopost-en"
            - "prod-m/cronjob/batch-autopost-ja"
            - "prod-n/cronjob/batch-digest-day"
            - "prod-o/cronjob/batch-digest-month"
            - "prod-p/cronjob/batch-digest-week"
            - "prod-q/cronjob/batch-radar-global"
      - expect: "none"
- id: traffic.shared-alb-group
  name: One ALB group (group.name) shared by production and non-production ingresses
  area: traffic
  type: summary
  each: traffic.alb_groups
  rule:
    expr: "item['mixed_prod_nonprod'] and item['prod']"
    warn_expr: "item['namespace_count'] >= 2"
  target: "item['target']"
  evidence: "f\"ALB group {item['group']}: {item['ingress_count']} ingresses, {item['hosts']} hosts, {item['namespace_count']} namespaces {item['namespaces']}, kinds {item['kinds']}, LB {item['lb']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Ingresses grouped by group.name share one ALB, one listener rule set (limit 100), one security group and one access log. A bad rule on a dev ingress (overlapping path, certificate, group.order) or its deletion becomes a change to the production ALB, and one tenant's rule explosion hitting the limit blocks everyone.
    Merging for cost (about 16 USD per ALB per month) is a reasonable choice, so fail only when production and non-production are mixed.
    Measured on a real EKS cluster: one group with 40 ingresses, 47 hosts and 15 namespaces (8 prod, 4 dev, argocd, monitoring and a tools namespace).
  suggest: "Split a production group from a dev/internal-tools group (2 ALBs). Within a group, set group.order explicitly and always put a host on dev ingresses."
