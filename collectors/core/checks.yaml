- id: traffic.db-exposed
  name: DB or message queue port is open on an external address
  area: traffic
  type: summary
  each: traffic.db_exposed
  rule:
    expr: "True"
  target: "item['target']"
  evidence: "f\"{item['type']} {item.get('namespace') or ''}/{item['name']}: ports {item.get('ports')}, exposure {item.get('scheme')}, addresses {item.get('hosts')}, sourceRanges {item.get('source_ranges')}. {item.get('note') or ''}\""
  severity_default: high
  symptom_linked: false
  why: >
    If ports like 5432, 3306, 6379, 27017 or 9092 are open on an internet-facing LB or a NodePort (every node interface), a single password is all that stands in the way. A security group or sourceRanges may block it, so "open" is based on the LB/Service definition and actual reachability is verified manually (the tool does not curl).
    Measured on a real EKS cluster: an internet-facing NLB created outside Kubernetes received MySQL, Postgres, Redis and Neo4j ports through a TargetGroupBinding, and a Kafka 9094 NLB was also internet-facing. On a k3s: 4 DBs opened via NodePort.
  suggest: "Change the NLB scheme to internal or narrow the security group to office/VPN ranges. NodePort DBs: ClusterIP + port-forward (or a Tailscale-only interface)."
  verify:
    - "aws elbv2 describe-load-balancers --query 'LoadBalancers[?Scheme==`internet-facing`].[LoadBalancerName,Type,DNSName]'"
    - "kubectl get svc -A --field-selector spec.type=NodePort"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          type: "nodeport"
          namespace: "prod-a"
          name: "pg-external"
          target: "nodeport/prod-a/pg-external"
          hosts: []
          ports:
            - 5432
          node_ports:
            - 30432
          scheme: "node-ip (all node interfaces)"
          tls: false
          auth_hint: {}
          has_auth_hint: false
          admin_like: false
          db_port: true
          prod: true
          external_traffic_policy: null
          source_ranges: null
          note: "DB port open on an external address"
      - expect: "none"

- id: traffic.external-exposure
  name: Externally exposed admin console without an authentication annotation (manual check needed)
  area: traffic
  type: summary
  each: traffic.exposure
  rule:
    warn_expr: "item['admin_like'] and not item['has_auth_hint'] and item.get('scheme') not in ('internal', 'lan')"
  target: "item['target']"
  evidence: "f\"{item['type']} {item['hosts'][:2]}: exposure {item.get('scheme')}, TLS {item.get('tls')}, no auth annotation. Whether the app has its own login (Argo CD, Grafana etc.) needs a manual check\""
  severity_default: medium
  symptom_linked: false
  why: >
    If hosts like admin, argocd, grafana, kibana or registry are open to the internet without ingress-level auth (ALB auth-type OIDC/Cognito, nginx auth-url / whitelist-source-range, a Traefik tools), the app login is the only wall. An app login is fine; a default account is dangerous. The tool only infers from annotations.
    The full exposure list is in summary.traffic.exposure (Ingress, LoadBalancer, NodePort, NLBs outside the cluster).
  suggest: "Put admin consoles behind ALB OIDC auth (`alb.ingress.kubernetes.io/auth-type: oidc`) or IP restriction (`inbound-cidrs`, nginx `whitelist-source-range`), or behind Tailscale/VPN."
  verify:
    - "kubectl get ingress -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,HOSTS:.spec.rules[*].host,CLASS:.spec.ingressClassName"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          type: "ingress"
          namespace: "prod-a"
          name: "admin"
          target: "ingress/prod-a/admin"
          hosts:
            - "admin.example.com"
          ports:
            - 443
          node_ports: []
          scheme: "internet-facing"
          tls: true
          auth_hint: {}
          has_auth_hint: false
          admin_like: true
          db_port: false
          prod: true
          external_traffic_policy: null
          source_ranges: null
          note: null
      - expect: "pass"
        item:
          type: "ingress"
          namespace: "prod-a"
          name: "admin"
          target: "ingress/prod-a/admin"
          hosts:
