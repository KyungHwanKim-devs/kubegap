- id: resilience.no-readiness-probe
  name: Production workload containers without a readinessProbe
  area: resilience
  type: object
  inputs: [objects/deployments.json, objects/statefulsets.json]
  rule:
    expr: "prod and serves_traffic(obj) and any(not c.get('readinessProbe') for c in containers(obj))"
  evidence: "'containers without a readinessProbe: ' + ', '.join(c['name'] for c in containers(obj) if not c.get('readinessProbe'))"
  severity_default: medium
  symptom_linked: true
  why: Without readiness a container receives traffic the moment it starts. Pods that are still booting or have lost a dependency take requests and return 5xx.
  suggest: An httpGet or tcpSocket readinessProbe. exec forks a process every time and loads the node. Do not put a DB ping in liveness.
  verify:
