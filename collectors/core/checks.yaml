  evidence: "f\"Of {item['secrets_total']} Secrets (metric kube_secret_info), {len(item['orphan_secrets'])} unreferenced candidates: {[(s['namespace'], s['name'], s['type']) for s in item['orphan_secrets'][:10]]}\""
