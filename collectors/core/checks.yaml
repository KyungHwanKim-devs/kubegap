- id: resources.cpu-limit-near-p95
  name: 7-day CPU p95 above 90% of the limit (constant throttling)
  area: resources
  type: metric
  inputs: [cpu_limit_p95_ratio_7d]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.90, lab: 0.90 }
    warn_threshold: { prod: 0.75, lab: 0.75 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: 7d CPU p95 / limit = {value:.2f}\""
  severity_default: medium
  symptom_linked: true
  why: >
    When p95 touches the limit, CFS throttling (resources.cpu-throttling) is constant rather than momentary. The 5-minute throttling ratio varies with the measurement time; the 7-day p95 does not.
    The KRR simple strategy recommends no CPU limit at all (unlike memory, CPU is compressible, so a node does not die without a limit).
  suggest: "Remove the CPU limit or raise it to p95 x 2. Keep the request (scheduling basis). Before removing it, confirm that other pods on the node are protected by their requests from losing CPU."
  verify:
    - "quantile_over_time(0.95, rate(container_cpu_usage_seconds_total{namespace=\"<ns>\",container=\"<c>\"}[5m])[7d:15m]) / on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"cpu\"}"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          cpu_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.95
      - expect: "warn"
        metric:
          cpu_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.8
      - expect: "pass"
        metric:
          cpu_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.3
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          cpu_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.9

- id: resources.memory-request-overprovisioned
  name: Memory request more than 3x the 7-day p95 usage (over-allocated)
  area: resources
  type: metric
  inputs: [memory_request_p95_ratio_7d, memory_p95_7d_bytes, container_memory_request_bytes]
  join_on: [namespace, pod, container]
  exclude_transient: true  # exclude Job, CronJob and GitHub Actions runner pods
  rule:
    expr: "value <= threshold and v.get('container_memory_request_bytes', 0) >= 1073741824"
    warn_expr: "value <= warn_threshold"
    threshold: { prod: 0.20, lab: 0.20 }
    warn_threshold: { prod: 0.35, lab: 0.35 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: 7d memory working set p95 {v.get('memory_p95_7d_bytes', 0)/1048576:.0f} MB / request {v.get('container_memory_request_bytes', 0)/1048576:.0f} MB = {value:.2f}\""
  severity_default: low
  symptom_linked: false
  why: >
    Over-requested memory makes a node look "full" just like CPU. But memory is not compressible (shortage means OOM), so more headroom is normal, and for apps that pre-allocate a heap (JVM) the working set is the request.
    The severity is therefore one step below the CPU check. Only pods with a request of 256Mi or more that lived over a day are considered.
  suggest: "Lower the request to p95 x 1.3 (slightly more than the 15% memory buffer of KRR simple). Setting limit equal to request (Guaranteed) makes OOM behaviour predictable."
  verify:
    - "quantile_over_time(0.95, container_memory_working_set_bytes{namespace=\"<ns>\",container=\"<c>\"}[7d:15m])"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          memory_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.1
          memory_p95_7d_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 200000000.0
          container_memory_request_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 2147483648
      - expect: "warn"
        metric:
          memory_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.3
          memory_p95_7d_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 100000000.0
          container_memory_request_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 314572800
      - expect: "pass"
        metric:
          memory_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.9
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          memory_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.2
          memory_p95_7d_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 200000000
          container_memory_request_bytes:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 2147483648

- id: resources.memory-limit-near-p95
  name: 7-day memory p95 above 90% of the limit (about to be OOMKilled)
  area: resources
  type: metric
  inputs: [memory_limit_p95_ratio_7d]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.90, lab: 0.90 }
    warn_threshold: { prod: 0.80, lab: 0.80 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: 7d memory working set p95 / limit = {value:.2f}\""
  severity_default: high
  symptom_linked: true
  why: >
    The kernel kills the process the moment memory exceeds the limit (OOMKilled). If p95 is at 90% of the limit, p99 and the maximum have probably already touched it, and a small traffic increase means a restart.
    resources.oomkilled is the signal after the death; this check is the signal before it. Measured on a real EKS cluster: Loki (512Mi) and the Argo CD controller (768Mi) were OOMKilled this way.
  suggest: "Raise the limit to at least p95 x 1.5 (first check for a leak: a 7-day graph that only climbs in steps is a leak). Raise the request as well, to Guaranteed."
  verify:
    - "quantile_over_time(0.95, container_memory_working_set_bytes{namespace=\"<ns>\",container=\"<c>\"}[7d:15m]) / on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"memory\"}"
    - "kubectl get pod -n <ns> <pod> -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          memory_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.95
      - expect: "warn"
        metric:
          memory_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.85
      - expect: "pass"
        metric:
          memory_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.5
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          memory_limit_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.9

- id: resources.large-request-binpacking
  name: Containers requesting more than half of the median node allocatable (blocks bin packing)
  area: resources
  type: metric
  inputs: [large_request_containers]
  rule:
    expr: "value >= threshold"
    threshold: { prod: 0.5, lab: 0.5 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: request is {value*100:.0f}% of the median node allocatable\""
  severity_default: medium
  symptom_linked: false
  why: >
    A container that asks for half a node leaves almost no room for anything else on it, and Karpenter launches a large instance for that single pod.
    In a 2-node small k3s cluster that pod cannot move to the other node, so N+1 is broken.
  suggest: "Check that the request reflects real usage (p95). If it really needs that much, move it to a dedicated NodePool (large instances) or split the workload."
  verify:
    - "kubectl get pods -A -o custom-columns=NS:.metadata.namespace,POD:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory | sort -k3 -h | tail"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          large_request_containers:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.8
      - expect: "pass"
        metric:
          large_request_containers:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.3
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          large_request_containers:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.5

- id: resources.krr-recommendation
  name: Large gap between the KRR recommendation and the current request/limit
  area: resources
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: resources.krr.workloads
  requires_tool: krr
  rule:
    expr: "item.get('kubegap_level') == 'fail' and item.get('kind') not in ('Job', 'CronJob') and 'runner' not in str(item.get('name', '')).lower()"  # exclude Job, CronJob and runners
    warn_expr: "item.get('kubegap_level') == 'warn' and item.get('kind') not in ('Job', 'CronJob') and 'runner' not in str(item.get('name', '')).lower()"
  target: "item['target']"
  evidence: "f\"{item['kubegap_reason']}: {item['summary']}. KRR severity {item['severity']} (CPU req {item.get('cpu_request_sev')}, CPU limit {item.get('cpu_limit_sev')}, memory req {item.get('memory_request_sev')}, memory limit {item.get('memory_limit_sev')}){'. ' + ', '.join(f'{k}: {v}' for k, v in item['info'].items()) if item.get('info') else ''}\""
  severity_default: medium
  symptom_linked: false
  why: >
    KRR (Robusta) recommends per-container requests and limits from 14 days of Prometheus history (simple strategy: CPU request = p95, no CPU limit, memory request = limit = max + 15%).
    KRR CRITICAL also includes "memory limit larger than the recommendation (max + 15%)", which is noise if used as is (most of the 19 CRITICALs on a 2-node small k3s cluster), so kubegap re-grades on request differences only (lib/resources.py kubegap_level):
    fail = memory request below the recommendation (under-allocated: OOM, node overcommit) or CPU request over by 0.2 cores or more / memory request over by 512 MB or more. warn = a smaller difference. A limit-only difference is pass (the CPU limit removal advice is cpu_limit_remove_recommended in the summary).
    UNKNOWN means no data (short-lived pod or absent from Prometheus) or a CPU-based HPA target that KRR declines to recommend for.
    It asks the same question as the kubegap p95 checks (cpu/memory-*-p95) over a different window (14 days) with a different calculation, so a workload flagged by both is certain.
  suggest: "Look at the saved cores and MB in summary.resources.krr.totals first, then fix requests in top_over_cpu, top_under_memory order. Handle the CPU limit removal list (cpu_limit_remove_recommended) together with the throttling check."
  verify:
    - "krr simple -n <ns> -p http://localhost:9090"
  notes: tool-missing when krr is not installed. Install with `kubegap setup --install-only krr`
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          target: "prod-a/deployment/web:app"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          severity: "CRITICAL"
          kubegap_level: "fail"
          kubegap_reason: "memory request under by 843 MB"
          summary: "CPU request 0.5 → 0.01 cores"
          cpu_request_sev: "WARNING"
          cpu_limit_sev: "WARNING"
          memory_request_sev: "OK"
          memory_limit_sev: "CRITICAL"
          info:
            cpu: "HPA detected"
          warnings: []
          hpa: false
      - expect: "warn"
        item:
          target: "prod-a/deployment/web:app"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          severity: "CRITICAL"
          kubegap_level: "warn"
          kubegap_reason: "CPU request over by 0.12 cores"
          summary: "CPU request 0.5 → 0.01 cores"
          cpu_request_sev: "WARNING"
          cpu_limit_sev: "WARNING"
          memory_request_sev: "OK"
          memory_limit_sev: "CRITICAL"
          info:
            cpu: "HPA detected"
          warnings: []
          hpa: false
      - expect: "pass"
        item:
          target: "prod-a/deployment/web:app"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          severity: "CRITICAL"
          kubegap_level: null
          kubegap_reason: ""
          summary: "CPU request 0.5 → 0.01 cores"
          cpu_request_sev: "WARNING"
          cpu_limit_sev: "WARNING"
          memory_request_sev: "OK"
          memory_limit_sev: "CRITICAL"
          info:
            cpu: "HPA detected"
          warnings: []
          hpa: false

- id: traffic.endpoint-zero
  name: Services with a selector but no ready endpoints
  area: traffic
  type: summary
  each: objects.services.no_ready_endpoints
  rule:
    expr: "True"
  target: "item['namespace'] + '/' + item['service']"
  evidence: "f\"type {item['type']}, selector {item['selector']}, 0 ready endpoints\""
  severity_default: medium
  symptom_linked: true
  why: Requests to this Service have nowhere to go. A selector typo, all pods NotReady, or an unused Service. If unused it is cleanup; if used it is an outage.
  suggest: Compare the selector with the pod labels; if readiness fails, look at that pod. Delete it if unused.
  verify:
    - "kubectl get endpoints -n <ns> <service>"
    - "kubectl get pods -n <ns> -l <selector>"
  profiles: [prod, lab]

# ---------- Resilience ----------
  test:
