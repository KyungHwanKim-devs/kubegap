- id: resilience.cronjob-policy
  name: CronJob policy gaps (overlap allowed, no deadline, no failure policy) or Jobs piling up
  area: resilience
  type: summary
  each: resilience.cronjobs.rows
  rule:
    expr: "item['active_jobs'] >= 3"
    warn_expr: "item['prod'] and any(not g.startswith('startingDeadlineSeconds') for g in item['policy_gaps']) and not item['suspend']"  # a missing startingDeadlineSeconds alone is noise — only substantive gaps such as overlap allowed, no deadline, no failure policy
  target: "item['target']"
  evidence: "f\"schedule '{item['schedule']}', concurrencyPolicy {item['concurrency_policy']}, activeDeadlineSeconds {item['active_deadline_s']}, backoffLimit {item['backoff_limit']}, podFailurePolicy {item['pod_failure_policy']}, startingDeadlineSeconds {item['starting_deadline_s']}, ttl {item['ttl_s']}, active Jobs {item['active_jobs']}. Gaps: {item['policy_gaps']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    With concurrencyPolicy Allow a slow Job overlaps the next period and they pile up (3 or more active Jobs means they already have → fail). Without activeDeadlineSeconds a stuck Job holds resources forever. The default backoffLimit 6 counts platform causes such as eviction as failures and burns the budget (Uber solved this with podFailurePolicy).
    Without startingDeadlineSeconds, once the controller misses more than 100 schedules it stops that CronJob permanently.
  suggest: "concurrencyPolicy Forbid, activeDeadlineSeconds (normal run time × 3), startingDeadlineSeconds 300, and a podFailurePolicy that excludes eviction (DisruptionTarget) from the retry count."
  verify:
    - "kubectl get cronjobs -A -o json | jq -r '.items[] | select(.spec.concurrencyPolicy!=\"Forbid\") | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "backup"
          target: "prod-a/backup"
          schedule: "0 3 * * *"
          interval_h: 24.0
          suspend: false
          concurrency_policy: "Allow"
          starting_deadline_s: null
          backoff_limit: 2
          active_deadline_s: 1800
          ttl_s: null
          pod_failure_policy: false
          history_limits:
            - 3
            - 1
          last_schedule: "x"
          last_success: "x"
          hours_since_success: 3.0
          active_jobs: 4
          jobs_total: 3
          failed_jobs: []
          stale: false
          policy_gaps:
            - "concurrencyPolicy Allow (overlap allowed)"
          prod: true
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "backup"
          target: "prod-a/backup"
          schedule: "0 3 * * *"
          interval_h: 24.0
          suspend: false
          concurrency_policy: "Forbid"
          starting_deadline_s: null
          backoff_limit: 2
          active_deadline_s: null
          ttl_s: null
          pod_failure_policy: false
          history_limits:
            - 3
            - 1
          last_schedule: "x"
          last_success: "x"
          hours_since_success: 3.0
          active_jobs: 0
          jobs_total: 3
          failed_jobs: []
          stale: false
          policy_gaps:
            - "activeDeadlineSeconds missing (a stuck Job runs forever)"
          prod: true
      - expect: "pass"
        item:
          namespace: "dev-a"
          name: "backup"
          target: "prod-a/backup"
          schedule: "0 3 * * *"
          interval_h: 24.0
