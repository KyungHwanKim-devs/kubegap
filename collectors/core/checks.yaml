- id: node.kernel-nic-events
  name: NIC link down, reset or Tx timeout
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('nic', 0) >= 3"
    warn_expr: "item['kernel']['counts'].get('nic', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) NIC events {item['kernel']['counts'].get('nic')}. Samples: {[s[:140] for s in item['kernel']['samples'] if any(k in s for k in ('Link','link','Tx','ena','WATCHDOG','eth','ens'))][:3]}\""
  severity_default: medium
  symptom_linked: true
  why: A flapping link drops every connection on the node and spreads as readiness failures and reconnect storms. On EKS, an ENA driver reset (keep alive watchdog) is a precursor of instance hardware trouble.
