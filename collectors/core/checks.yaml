- id: traffic.alb-protection-off
  name: Shared ALB has deletion protection and access logs turned off
  area: traffic
  type: summary
  each: traffic.alb.lbs
  rule:
    warn_expr: "item.get('type') == 'application' and (not item.get('deletion_protection') or not item.get('access_logs'))"
  target: "item['name']"
  evidence: "f\"ALB {item['name']}: deletion_protection {item.get('deletion_protection')}, access_logs {item.get('access_logs')}, target groups in the ingress group {item.get('target_groups')}\""
  severity_default: low
  symptom_linked: false
  why: >
    When one ingress group (group.name) shares an ALB, dozens of Ingresses are one LB. Without deletion protection, deleting one Ingress by mistake does not remove it, but a controller bug or manual deletion is unguarded. Access logs are the only material for per-request causes of 5xx (which host, path, target).
