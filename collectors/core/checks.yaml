- id: resilience.finished-jobs-accumulating
  name: Completed and failed Jobs and their pods pile up (no ttlSecondsAfterFinished)
  area: resilience
  type: summary
  each: resilience.cronjobs.jobs
  cluster_level: true
  rule:
    expr: "(item['succeeded_pods'] + item['failed_pods']) >= 100 or item['finished_without_ttl'] >= 100"
    warn_expr: "(item['succeeded_pods'] + item['failed_pods']) >= 30 or item['finished_without_ttl'] >= 30"
  target: "'cluster'"
  evidence: "f\"{item['total']} Jobs ({item['failed']} failed), {item['finished_without_ttl']} finished Jobs without ttl, {item['succeeded_pods']} Succeeded pods, {item['failed_pods']} Failed pods\""
  severity_default: low
  symptom_linked: false
  why: >
    Finished Jobs and pods that are never deleted weigh on etcd and apiserver LIST calls (measured on a small k3s cluster as the cause of 8 rps of event LISTs) and make kubectl get pods hard to read. Pods that went Failed through eviction are not cleaned up by the ReplicaSet and keep KubePodNotReady firing (12 of them measured on an EKS cluster).
  suggest: "ttlSecondsAfterFinished 3600 on Jobs; successfulJobsHistoryLimit 3 and failedJobsHistoryLimit 3 on CronJobs. Failed pods: `kubectl delete pod --field-selector status.phase=Failed -A` (suggestion only)."
  verify:
    - "kubectl get pods -A --field-selector status.phase=Succeeded | wc -l; kubectl get pods -A --field-selector status.phase=Failed | wc -l"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          total: 6
          failed: 0
          finished_without_ttl: 120
          succeeded_pods: 110
          failed_pods: 0
      - expect: "warn"
        item:
          total: 6
          failed: 0
          finished_without_ttl: 56
          succeeded_pods: 53
          failed_pods: 3
      - expect: "pass"
        item:
          total: 6
          failed: 0
          finished_without_ttl: 6
          succeeded_pods: 6
          failed_pods: 0

- id: resilience.priority-inversion
  name: Non-critical workload has higher priority than production (or PriorityClass unused, or Preempted events)
  area: resilience
  type: summary
  each: resilience.priority
  cluster_level: true
  rule:
    expr: "bool(item['inversion']) or item['preempted_events'] >= 5"
    warn_expr: "item['no_user_classes_with_prod'] or item['preempted_events'] > 0"
  target: "'cluster'"
  evidence: "f\"User-defined PriorityClasses {item['user_classes']}, pod distribution {item['pods_by_class']}, prod pods without a class {item['prod_pods_without_class']} of {item['prod_pods']}, prod max priority {item['prod_max_priority']}, non-prod max {item['nonprod_max_priority']}, inversions {item['inversion'][:5]}, Preempted events {item['preempted_events']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    When nodes are full the scheduler evicts lower-priority pods to make room for higher ones. If non-critical pods (batch, dev) outrank production, production gets pushed out (Grafana Labs case). If everything is 0, eviction order is left to chance, and under node pressure the kubelet chooses by usage relative to request only.
    Measured on two clusters: zero user PriorityClasses, every user pod at priority 0.
  suggest: "Create two PriorityClasses (prod-critical 1000000, batch -10 or 100) and set priorityClassName on production Deployments. Batch and runners go low."
  verify:
    - "kubectl get priorityclasses; kubectl get pods -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PRIO:.spec.priority | sort -k3 -n -r | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          classes: []
          user_classes:
            - name: "batch"
              value: 500000
          pods_by_class:
            (none, 0): 100
          prod_pods: 40
          prod_pods_without_class: 40
          prod_max_priority: 0
          nonprod_max_priority: 0
          inversion:
            - namespace: "dev-a"
              pod: "x"
              priority: 500000
              class: "batch"
          preempted_events: 0
          no_user_classes_with_prod: false
      - expect: "fail"
        item:
          classes: []
          user_classes: []
          pods_by_class:
            (none, 0): 100
          prod_pods: 40
          prod_pods_without_class: 40
          prod_max_priority: 0
          nonprod_max_priority: 0
          inversion: []
          preempted_events: 7
          no_user_classes_with_prod: true
      - expect: "warn"
        item:
          classes: []
          user_classes: []
          pods_by_class:
            (none, 0): 100
          prod_pods: 40
          prod_pods_without_class: 40
          prod_max_priority: 0
          nonprod_max_priority: 0
          inversion: []
          preempted_events: 0
          no_user_classes_with_prod: true
      - expect: "pass"
        item:
          classes: []
          user_classes:
            - name: "prod-critical"
              value: 1000000
          pods_by_class:
            (none, 0): 100
          prod_pods: 40
          prod_pods_without_class: 40
          prod_max_priority: 1000000
          nonprod_max_priority: 0
          inversion: []
          preempted_events: 0
          no_user_classes_with_prod: false

