- id: node.kernel-net-mem-pressure
  name: Kernel network or memory pressure, or kernel BUG
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('bug', 0) >= 1 and item['kernel']['counts'].get('bug', 0) > item['kernel']['counts'].get('oom_cgroup', 0)"
    warn_expr: "item['kernel']['counts'].get('net_pressure', 0) + item['kernel']['counts'].get('mem_pressure', 0) + item['kernel']['counts'].get('clock', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) BUG/Oops/Call Trace {item['kernel']['counts'].get('bug')}, network pressure (TCP memory, SYN flooding, ARP table) {item['kernel']['counts'].get('net_pressure')}, memory pressure (page allocation failure) {item['kernel']['counts'].get('mem_pressure')}, unstable clocksource {item['kernel']['counts'].get('clock')}. Samples: {item['kernel']['samples'][-3:]}\""
  severity_default: medium
  symptom_linked: false
  why: Each is a precursor of a different resource running out. If the Call Trace count does not exceed the cgroup OOM count, they are the OOM killer's stack dumps, the same event as resources.oomkilled, and not counted as fail. SYN flooding is a too-small somaxconn or an attack, ARP table overflow is a too-small gc_thresh (nodes with many pods), page allocation failure is memory fragmentation, and a Call Trace is a kernel defect.
