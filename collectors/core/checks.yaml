- id: tenancy.cross-tenant-broad-rbac
  name: One subject has admin/edit in several tenant namespaces (shared tenant boundary)
  area: tenancy
  type: summary
  each: tenancy.rbac.cross_tenant_broad
  rule:
    expr: "item['prod_count'] >= 2"
    warn_expr: "len(item['namespaces']) >= 2"
  target: "item['target']"
  evidence: "f\"Subject {item['subject']} has admin/edit/cluster-admin RoleBindings in namespaces {item['namespaces']} (prod {item['prod_count']}: {item['prod_namespaces']})\""
  severity_default: high
  symptom_linked: false
  why: >
    A tenant boundary is drawn with four things: namespace, NetworkPolicy, RBAC and NodePool. If one person or one ServiceAccount has edit in two clients' production namespaces, a credential leak on one side becomes the other client's incident.
    ServiceAccounts in system namespaces (Argo CD, Helm controllers) and system: groups are operators and excluded.
  suggest: "Bind per-client groups (IAM roles, OIDC groups) to their namespace only. Keep shared operator permissions as per-namespace RoleBindings rather than a ClusterRole so they stay auditable."
  verify:
    - "kubectl get rolebindings -A -o json | jq -r '.items[] | select(.roleRef.name==\"admin\" or .roleRef.name==\"edit\") | \"\\(.metadata.namespace) \\(.subjects[]?.name)\"' | sort"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          subject: "User:dev@example.com"
          namespaces:
            - "prod-a"
            - "prod-b"
          prod_namespaces:
            - "prod-a"
            - "prod-b"
          prod_count: 2
          target: "User:dev@example.com"
      - expect: "warn"
        item:
          subject: "ServiceAccount:ci/deployer"
          namespaces:
            - "dev-a"
            - "prod-a"
          prod_namespaces:
            - "prod-a"
          prod_count: 1
          target: "ServiceAccount:ci/deployer"
      - expect: "none"
- id: tenancy.prod-boundary-missing
  name: Production tenant lacks all three boundaries (quota, NetworkPolicy, PSA)
  area: tenancy
  type: summary
  each: tenancy.namespaces.rows
  rule:
    expr: "item['prod'] and item['tenants_total'] > 1 and item['pods'] > 0 and not item['has_quota'] and item['networkpolicies'] == 0 and not item['psa_enforce']"
    warn_expr: "item['prod'] and item['tenants_total'] > 1 and item['pods'] > 0 and [not item['has_quota'], item['networkpolicies'] == 0, not item['psa_enforce']].count(True) >= 2"
  target: "item['namespace']"
  evidence: "f\"{item['namespace']}: ResourceQuota {item['has_quota']}, NetworkPolicies {item['networkpolicies']} (enforced by the cluster {item['networkpolicy_enforced']}), PSA enforce {item['psa_enforce']}, LimitRange {item['has_limitrange']}, RoleBinding subjects {item['rbac_subject_count']}. Other tenants on the same nodes: {item['shares_nodes_with_prod']}, tenants {item['tenants_total']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The quota (resource boundary), NetworkPolicy (network boundary) and PSA (privilege boundary) are each checked by a different area. This check takes the tenant view: does the namespace have any boundary at all — with none of the three, it is `default` under another name.
    It overlaps in targets with security.prod-no-default-deny and security.psa-missing in the security area, but the severity here is lower and the point is to read them together.
    Measured on a real EKS cluster: many of the 8 production namespaces had neither quota, NetworkPolicy nor PSA.
  suggest: "Create one tenant namespace template (ResourceQuota + LimitRange + default-deny NetworkPolicy + PSA restricted/baseline label) and apply it to every prod-* namespace through an Argo CD ApplicationSet."
  verify:
    - "kubectl get ns <ns> -o jsonpath='{.metadata.labels}' ; kubectl get netpol,quota,limitrange -n <ns>"
