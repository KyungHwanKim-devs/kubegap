- id: traffic.alb-elb-5xx
  name: 5xx generated by the ALB itself (no target, timeout, rejected connection)
  area: traffic
  type: summary
  each: traffic.alb.lbs
  rule:
    expr: "item.get('type') == 'application' and ((item.get('elb_5xx_24h') or 0) >= 100 or (item.get('rejected_connections_24h') or 0) > 0)"
    warn_expr: "item.get('type') == 'application' and ((item.get('elb_5xx_24h') or 0) >= 20 or (item.get('elb_5xx_24h') or 0) / max(item.get('requests_24h') or 1, 1) >= 0.0001)"  # 5 of 190k requests is noise — from 20 or 0.01%
  target: "item['name']"
  evidence: "f\"ALB {item['name']} ({item['scheme']}): 24h requests {item.get('requests_24h')}, ELB 5xx {item.get('elb_5xx_24h')}, target 5xx {item.get('target_5xx_24h')}, rejected connections {item.get('rejected_connections_24h')}, idle timeout {item.get('idle_timeout_s')}s, target groups {item.get('target_groups')}\""
  severity_default: medium
  symptom_linked: true
  why: >
    HTTPCode_ELB_5XX_Count is a response produced by the ALB, not the target. 502 means the target closed the connection (routing to a terminating pod, keep-alive mismatch), 503 means no healthy target, 504 means no response within the idle timeout.
    If they cluster around rolling deploys or node replacement it is a graceful-shutdown / deregistration delay problem (traffic.alb-deregistration-vs-grace). RejectedConnectionCount is the ALB connection limit.
  suggest: "Overlay hourly ELB 5xx with deploy and node replacement times. For 502, align the preStop sleep with the deregistration delay; for 504, check the idle timeout against the app timeout."
  verify:
    - "aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB --metric-name HTTPCode_ELB_5XX_Count --dimensions Name=LoadBalancer,Value=<dim> --statistics Sum --period 3600 --start-time <24h ago> --end-time <now>"
