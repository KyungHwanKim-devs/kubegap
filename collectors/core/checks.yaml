# Core check definitions.
#
# Common fields: id (<area>.<check-id>), name, area, type, inputs, rule, severity_default, symptom_linked, why, cases, suggest, verify, notes, profiles.
# rule.expr is a Python expression: true means fail; rule.warn_expr true means warn; both false means pass. The names available inside
# an expression depend on the type:
#   metric    : value, labels, threshold, warn_threshold, prod (is the namespace production-like), ctx. With two or more inputs and join_on: v["<id>"] and labels
#   object    : obj, ns, name, spec, prod, containers(obj), pod_spec(obj), pdb_covers(obj), hpa_covers(obj), ctx
#   summary   : item (an element of the `each` path), ctx
#   inventory : inv, item/key (when `each` is set), aws_file(name), k8s_eol(version), days_until(date), ctx
#   absence   : only `family` or `component` is needed (no expr)
#   llm       : no rule. The LLM judges from the raw data
# target is the tail of the finding id (<ns>/<resource> or cluster). evidence is an expression whose result goes into the report as the evidence.

# ---------- Resources ----------
- id: resources.cpu-throttling
  name: Containers with a high CPU throttling ratio
  area: resources
  type: metric
  inputs: [cpu_throttle_ratio_5m]
  exclude_transient: true  # exclude Job, CronJob and GitHub Actions runner pods
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.25, lab: 0.25 }
    warn_threshold: { prod: 0.10, lab: 0.10 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: 5m throttling ratio {value:.2f} (stalled for {value*100:.0f}% of periods)\""
  severity_default: high
  symptom_linked: true
  why: >
    The kernel CFS interprets a limit as "N ms per 100 ms period". A multi-threaded app that spends its quota early in the period stalls for the rest of it.
    Average CPU usage looks low while latency spikes. At 0.25 a quarter of all periods were stalled.
  cases:
    - { who: Buffer 2020, url: https://erickhun.com/posts/kubernetes-faster-services-no-cpu-limits/ }
    - { who: Omio 2020, url: https://medium.com/omio-engineering/cpu-limits-and-aggressive-throttling-in-kubernetes-c5b20bd8a718 }
  suggest: >
    Remove the CPU limit and keep only the request, or set request=limit (Guaranteed). For JVM and Go, first align the thread count (GOMAXPROCS) with the limit.
  verify:
    - "sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total[5m]))"
    - "On the node (SSM/SSH): nr_throttled and throttled_usec in cat /sys/fs/cgroup/<pod path>/cpu.stat"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          cpu_throttle_ratio_5m:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.5
      - expect: "warn"
        metric:
          cpu_throttle_ratio_5m:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.15
      - expect: "pass"
        metric:
          cpu_throttle_ratio_5m:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.02
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          cpu_throttle_ratio_5m:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.25

- id: resources.oomkilled
  name: Containers whose last termination reason is OOMKilled
  area: resources
  type: metric
  inputs: [oomkilled_last_terminated]
  rule:
    expr: "value == 1 and ((summary.get('resilience') or {}).get('restarts') or {}).get('oom_last', {}).get(labels['namespace'] + '/' + labels['pod'] + '/' + labels['container'], {}).get('age_days', 0) <= 7"
    warn_expr: "value == 1 and ((summary.get('resilience') or {}).get('restarts') or {}).get('oom_last', {}).get(labels['namespace'] + '/' + labels['pod'] + '/' + labels['container'], {}).get('age_days', 0) <= 30"  # a last OOM older than 30 days is dropped from findings (it stays in summary resilience.restarts.oom_last)
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: last termination reason OOMKilled, finished at {((summary.get('resilience') or {}).get('restarts') or {}).get('oom_last', {}).get(labels['namespace'] + '/' + labels['pod'] + '/' + labels['container'], {}).get('finished')} ({((summary.get('resilience') or {}).get('restarts') or {}).get('oom_last', {}).get(labels['namespace'] + '/' + labels['pod'] + '/' + labels['container'], {}).get('age_days')} days ago), {((summary.get('resilience') or {}).get('restarts') or {}).get('oom_last', {}).get(labels['namespace'] + '/' + labels['pod'] + '/' + labels['container'], {}).get('restarts')} restarts. An OOM older than 7 days is warn, older than 30 days is excluded\""
  severity_default: high
  symptom_linked: true
  why: >
    An OOM today and an OOM five months ago are different: fail if the last termination is within 7 days, warn if older (measured on a real EKS cluster: OOMs from five months and 19 days ago were reported as high).
    The container exceeded its memory limit and the cgroup OOM killer killed only that container. Either the limit is below real usage or there is a memory leak.
    This differs from SystemOOM, where the whole node runs out of memory (that is the node OS check).
  suggest: >
    Compare the 7-day p95 working set with the limit and raise the limit (KRR recommendation), or fix the app if it leaks. In production raise the request too, to lower the Burstable eviction rank.
  verify:
    - "kubectl get pods -A -o json | jq -r '.items[] | select(.status.containerStatuses[]?.lastState.terminated.reason==\"OOMKilled\") | .metadata.namespace+\"/\"+.metadata.name'"
    - "On the node: journalctl -k | grep -i oom"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          oomkilled_last_terminated:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 1
        summary:
          resilience:
            restarts:
              oom_last:
                prod-a/web-6d7ff4dcdb-abcde/app:
                  finished: "2026-10-25T01:00:00Z"
                  age_days: 0.5
                  restarts: 3
                  prod: true
      - expect: "warn"
        metric:
          oomkilled_last_terminated:
            - labels:
                namespace: "argocd"
                pod: "argocd-application-controller-0"
                container: "application-controller"
              value: 1
        summary:
          resilience:
            restarts:
              oom_last:
                argocd/argocd-application-controller-0/application-controller:
                  finished: "2026-10-05T08:27:27Z"
                  age_days: 20.4
                  restarts: 1
                  prod: false
      - expect: "pass"  # a last OOM older than 30 days is excluded
        metric:
          oomkilled_last_terminated:
            - labels:
                namespace: "argocd"
                pod: "argocd-application-controller-0"
                container: "application-controller"
              value: 1
        summary:
          resilience:
            restarts:
              oom_last:
                argocd/argocd-application-controller-0/application-controller:
                  finished: "2026-05-12T08:27:27Z"
                  age_days: 166.4
                  restarts: 41
                  prod: false
      - expect: "pass"
        metric:
          oomkilled_last_terminated:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0

- id: resources.oomkilled-repeated
  name: Containers repeatedly killed by OOM over 7 days
  area: resources
  type: metric
  inputs: [oom_events_7d]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= 1"
    threshold: { prod: 3, lab: 3 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']} container {labels['container']}: {value:.0f} OOMs in 7 days (increase of cAdvisor container_oom_events_total)\""
  severity_default: high
  symptom_linked: true
  why: >
    resources.oomkilled only asks "was the last death an OOM"; it cannot tell one death from several a day.
    cAdvisor container_oom_events_total counts OOM killer invocations in the container cgroup, so the 7-day increase is the frequency. More than 3 means the limit is too small or there is a leak, and requests are dropped between restarts.
  suggest: "Raise the limit using the 7-day memory p95 (the near-limit list in summary.resources and the KRR recommendation) or fix the leak. If the same container also appears in resources.memory-limit-near-p95, report them as one item."
  verify:
    - "sum by (namespace, pod, container) (increase(container_oom_events_total[7d])) > 0"
    - "kubectl get events -A --field-selector reason=OOMKilling"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          oom_events_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 5
      - expect: "warn"
        metric:
          oom_events_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 1
      - expect: "pass"
        metric:
          oom_events_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          oom_events_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 3

- id: resources.node-memory-request-usage-gap
  name: Node memory requests are full while real usage is low (over-requested)
  area: resources
  type: metric
  inputs: [node_memory_request_ratio, node_memory_usage_ratio_p95_7d, node_memory_usage_ratio]
  join_on: node
  rule:
    expr: "v.get('node_memory_request_ratio', 0) >= threshold and v.get('node_memory_usage_ratio_p95_7d', v.get('node_memory_usage_ratio', 1)) <= 0.35"
    warn_expr: "v.get('node_memory_request_ratio', 0) >= warn_threshold and v.get('node_memory_usage_ratio_p95_7d', v.get('node_memory_usage_ratio', 1)) <= 0.45"
    threshold: { prod: 0.80, lab: 0.80 }
    warn_threshold: { prod: 0.65, lab: 0.65 }
  target: "labels['node']"
  evidence: "f\"memory requests/allocatable {v.get('node_memory_request_ratio', 0):.2f}, working set/allocatable 7d p95 {v.get('node_memory_usage_ratio_p95_7d', float('nan')):.2f} (instant {v.get('node_memory_usage_ratio', float('nan')):.2f})\""
  severity_default: medium
  symptom_linked: false
  why: >
    The memory counterpart of resources.node-request-usage-gap. When memory requests make a node look "full", pods cannot be placed even though CPU is free, and another node is started. Memory is not compressible (exceeding it means eviction), so the threshold is a little more lenient (p95 35%).
    This fills in the memory half of "node allocation vs real usage"; the CPU half existed first.
  suggest: Start with the most over-requested workloads, using the KRR recommendation and the container list of resources.memory-request-overprovisioned. A memory request around 7-day p95 x 1.2 is safe.
  verify:
    - "sum(kube_pod_container_resource_requests{resource=\"memory\"}) by (node) / sum(kube_node_status_allocatable{resource=\"memory\"}) by (node)"
    - "kubectl top nodes"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          node_memory_request_ratio:
            - labels:
                node: "n1"
              value: 0.9
          node_memory_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.2
          node_memory_usage_ratio:
            - labels:
                node: "n1"
              value: 0.2
      - expect: "warn"
        metric:
          node_memory_request_ratio:
            - labels:
                node: "n1"
              value: 0.7
          node_memory_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.4
          node_memory_usage_ratio:
            - labels:
                node: "n1"
              value: 0.4
      - expect: "pass"
        metric:
          node_memory_request_ratio:
            - labels:
                node: "n1"
              value: 0.9
          node_memory_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.7
          node_memory_usage_ratio:
            - labels:
                node: "n1"
              value: 0.7
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          node_memory_request_ratio:
            - labels:
                node: "n1"
              value: 0.8
          node_memory_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.2
          node_memory_usage_ratio:
            - labels:
                node: "n1"
              value: 0.2

- id: resources.no-memory-limit
  name: Production workload containers without a memory limit
  area: resources
  type: object
  inputs: [objects/deployments.json, objects/statefulsets.json, objects/daemonsets.json]
  rule:
    expr: "prod and any(not (c.get('resources') or {}).get('limits', {}).get('memory') for c in containers(obj))"
  evidence: "'containers without a limit: ' + ', '.join(c['name'] for c in containers(obj) if not (c.get('resources') or {}).get('limits', {}).get('memory'))"
  severity_default: medium
  symptom_linked: false
  why: >
    Without a memory limit there is no wall. A leak eats the whole node and SystemOOM kills neighbouring pods or the kubelet.
    For CPU, dropping the limit is recommended (throttling); for memory the opposite holds, a limit must exist.
  suggest: Set the memory limit to 1.3-1.5x the 7-day p95 working set. Keep the request near p95.
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].resources}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "128Mi"
                        readinessProbe:
                          httpGet:
                            path: "/healthz"
                            port: 8080
          statefulsets: []
          daemonsets: []
      - expect: "pass"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "prod-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "128Mi"
                          limits:
                            memory: "256Mi"
                        readinessProbe:
                          httpGet:
                            path: "/healthz"
                            port: 8080
          statefulsets: []
          daemonsets: []
      - expect: "pass"
        objects:
          deployments:
            - kind: "Deployment"
              metadata:
                namespace: "dev-a"
                name: "web"
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: "web"
                template:
                  metadata:
                    labels:
                      app: "web"
                  spec:
                    containers:
                      - name: "app"
                        image: "x"
                        ports:
                          - containerPort: 8080
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "128Mi"
                        readinessProbe:
                          httpGet:
                            path: "/healthz"
                            port: 8080
          statefulsets: []
          daemonsets: []

- id: resources.besteffort-in-prod
  name: BestEffort pods in production namespaces
  area: resources
  type: metric
  inputs: [besteffort_pods]
  rule:
    expr: "prod"
  target: "workload(labels)"
  evidence: "f\"pod {labels['pod']}: QoS BestEffort (neither request nor limit)\""
  severity_default: medium
  symptom_linked: false
  why: Under memory pressure the kubelet evicts BestEffort first, then Burstable, then Guaranteed. A BestEffort production workload dies first.
  suggest: Set at least a request so the pod becomes Burstable.
  verify:
    - "kubectl get pods -n <ns> -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          besteffort_pods:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 1
      - expect: "pass"
        metric:
          besteffort_pods:
            - labels:
                namespace: "dev-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 1

- id: resources.node-request-usage-gap
  name: Node CPU requests are full while real usage is low (over-requested)
  area: resources
  type: metric
  inputs: [node_cpu_request_ratio, node_cpu_usage_ratio_p95_7d, node_cpu_usage_ratio_5m]
  join_on: node
  rule:
    expr: "v.get('node_cpu_request_ratio', 0) >= threshold and v.get('node_cpu_usage_ratio_p95_7d', v.get('node_cpu_usage_ratio_5m', 1)) <= 0.25"
    warn_expr: "v.get('node_cpu_request_ratio', 0) >= warn_threshold and v.get('node_cpu_usage_ratio_p95_7d', v.get('node_cpu_usage_ratio_5m', 1)) <= 0.30"
    threshold: { prod: 0.80, lab: 0.80 }
    warn_threshold: { prod: 0.65, lab: 0.65 }
  target: "labels['node']"
  evidence: "f\"CPU requests/allocatable {v.get('node_cpu_request_ratio', 0):.2f}, usage/allocatable 7d p95 {v.get('node_cpu_usage_ratio_p95_7d', float('nan')):.2f} (5m instant {v.get('node_cpu_usage_ratio_5m', float('nan')):.2f})\""
  severity_default: medium
  symptom_linked: false
  why: >
    The scheduler fills nodes by requests. When requests are far above real usage the node is idle yet looks "full", and a new node is started.
    On EKS Karpenter provisions nodes from requests, so this gap is the bill. Real usage is the 7-day p95 (the 5-minute instant value is for reference).
    Measured on a real EKS cluster: during a spot reclaim a node at 88% requested CPU was using 5%, and a production pod waited two minutes for a slot.
  suggest: Start with the most over-requested workloads, using the KRR recommendation (summary.resources.krr) and the container list of resources.cpu-request-overprovisioned.
  verify:
    - "sum(kube_pod_container_resource_requests{resource=\"cpu\"}) by (node) / sum(kube_node_status_allocatable{resource=\"cpu\"}) by (node)"
    - "kubectl top nodes"
  profiles: [prod, lab]

# ---------- Resources: 7-day p95 vs request/limit, KRR ----------
  test:
    cases:
      - expect: "fail"
        metric:
          node_cpu_request_ratio:
            - labels:
                node: "n1"
              value: 0.9
          node_cpu_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.1
          node_cpu_usage_ratio_5m:
            - labels:
                node: "n1"
              value: 0.05
      - expect: "warn"
        metric:
          node_cpu_request_ratio:
            - labels:
                node: "n1"
              value: 0.7
          node_cpu_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.2
          node_cpu_usage_ratio_5m:
            - labels:
                node: "n1"
              value: 0.2
      - expect: "fail"
        metric:
          node_cpu_request_ratio:
            - labels:
                node: "n1"
              value: 0.9
          node_cpu_usage_ratio_5m:
            - labels:
                node: "n1"
              value: 0.1
      - expect: "pass"
        metric:
          node_cpu_request_ratio:
            - labels:
                node: "n1"
              value: 0.3
          node_cpu_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.1
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          node_cpu_request_ratio:
            - labels:
                node: "n1"
              value: 0.8
          node_cpu_usage_ratio_p95_7d:
            - labels:
                node: "n1"
              value: 0.1
          node_cpu_usage_ratio_5m:
            - labels:
                node: "n1"
              value: 0.05

- id: resources.cpu-request-overprovisioned
  name: CPU request more than 3x the 7-day p95 usage (over-allocated)
  area: resources
  type: metric
  inputs: [cpu_request_p95_ratio_7d, cpu_p95_7d_cores, container_cpu_request_cores]
  join_on: [namespace, pod, container]
  exclude_transient: true  # exclude Job, CronJob and GitHub Actions runner pods
  rule:
    expr: "value <= threshold and v.get('container_cpu_request_cores', 0) >= 0.25"
    warn_expr: "value <= warn_threshold"
    threshold: { prod: 0.20, lab: 0.20 }
    warn_threshold: { prod: 0.35, lab: 0.35 }
  target: "workload(labels) + ':' + labels['container']"
  evidence: "f\"pod {labels['pod']}: 7d CPU p95 {v.get('cpu_p95_7d_cores', 0):.3f} cores / request {v.get('container_cpu_request_cores', 0):.2f} cores = {value:.2f}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The request is what the scheduler uses to reserve a slot on a node. When p95 usage is below 20% of the request, that difference is idle capacity counted as "full":
    new nodes start (a bill on EKS, lost N+1 headroom in a small k3s cluster) and other pods cannot be placed. Only pods with a request of 100m or more that lived over a day are considered (p95 is meaningless for short-lived pods).
    Over-allocation is safer than under-allocation, so when changing it set the new request to 1.5-2x p95.
  suggest: "Lower the request to p95 x 1.5. If an HPA scales on CPU, a lower request means more frequent scale-outs, so review targetUtilization together. Cross-check with the KRR recommendation (summary.resources.krr.workloads)."
  verify:
    - "quantile_over_time(0.95, rate(container_cpu_usage_seconds_total{namespace=\"<ns>\",container=\"<c>\"}[5m])[7d:15m])"
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].resources.requests.cpu}'"
  notes: Threshold 0.3 split into fail 0.2 and warn 0.35 to avoid flapping at the 0.3 boundary. fail only for requests of 250m or more (dozens of pods with the 100m default would otherwise all fail; measured as 18 such pods on a 2-node small k3s cluster).
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          cpu_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.05
          cpu_p95_7d_cores:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.02
          container_cpu_request_cores:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.5
      - expect: "warn"
        metric:
          cpu_request_p95_ratio_7d:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
              value: 0.1
          cpu_p95_7d_cores:
            - labels:
                namespace: "prod-a"
                pod: "web-6d7ff4dcdb-abcde"
                container: "app"
