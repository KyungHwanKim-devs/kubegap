          ports:
            - 443
          node_ports: []
          scheme: "internet-facing"
          tls: true
          auth_hint:
            auth-type: "oidc"
          has_auth_hint: true
          admin_like: true
          db_port: false
          prod: true
          external_traffic_policy: null
          source_ranges: null
          note: null
      - expect: "pass"
        item:
          type: "ingress"
          namespace: "prod-a"
