- id: hygiene.pvc-unbound-or-unused
  name: Pending PVCs, Released PVs, PVCs used by no pod
  area: hygiene
  type: summary
  each: hygiene.orphans
  cluster_level: true
  rule:
    expr: "any(p['prod'] for p in item['pvc_unbound']) or bool(item['pv_released'])"
    warn_expr: "bool(item['pvc_unbound']) or bool(item['pvc_unused'])"
  target: "'cluster'"
  evidence: "f\"Non-Bound PVCs {[(p['namespace'], p['name'], p['phase'], p['storage_class']) for p in item['pvc_unbound']]}, Released/Failed PVs {[(p['name'], p['capacity'], p['claim'], p['reclaim']) for p in item['pv_released']]}, Bound PVCs used by no pod {[(p['namespace'], p['name']) for p in item['pvc_unused'][:10]]}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A Pending PVC means no StorageClass or an AZ/capacity problem kept the volume from being created, so its pod is Pending too. A Released PV means the PVC was deleted but reclaim Retain kept the disk (EBS cost). A Bound PVC used by no pod is data from a deleted workload or a backup target (measured on a k3s: a leftover DB volume in default).
  suggest: "Pending: `kubectl describe pvc` events. Released PV: verify the data, then delete (EBS snapshot first). Unused PVC: back up, then delete."
  verify:
    - "kubectl get pvc -A | grep -v Bound; kubectl get pv | grep -E 'Released|Failed'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound:
            - namespace: "prod-a"
              name: "data"
              phase: "Pending"
              storage_class: "gp3-2a"
              prod: true
          pvc_unused: []
          pv_released: []
          services_without_pods: []
          replicasets_total: 100
          replicasets_zero: 50
          revision_history_limits:
            10: 20
      - expect: "fail"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused: []
          pv_released:
            - name: "pv-1"
              phase: "Released"
              capacity: "20Gi"
              claim: "old"
              reclaim: "Retain"
          services_without_pods: []
          replicasets_total: 100
          replicasets_zero: 50
          revision_history_limits:
            10: 20
      - expect: "warn"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused:
            - namespace: "default"
              name: "data-quiz-db-0"
              prod: false
          pv_released: []
          services_without_pods: []
          replicasets_total: 100
          replicasets_zero: 50
          revision_history_limits:
            10: 20
      - expect: "pass"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused: []
          pv_released: []
          services_without_pods: []
          replicasets_total: 100
          replicasets_zero: 50
          revision_history_limits:
            10: 20

- id: hygiene.old-replicasets
  name: Zero-replica ReplicaSets piling up (revisionHistoryLimit default 10)
  area: hygiene
  type: summary
  each: hygiene.orphans
  cluster_level: true
  rule:
    expr: "item['replicasets_zero'] >= 300"
    warn_expr: "item['replicasets_zero'] >= 100"
  target: "'cluster'"
  evidence: "f\"Of {item['replicasets_total']} ReplicaSets, {item['replicasets_zero']} have 0 replicas. Deployment revisionHistoryLimit distribution {item['revision_history_limits']}\""
  severity_default: low
  symptom_linked: false
  why: >
    A Deployment keeps revisionHistoryLimit (default 10) old ReplicaSets for rollback. With 60 Deployments, 600 ReplicaSets pile up in etcd and apiserver LIST and watch get heavier (measured on an EKS cluster: the most numerous etcd object type was ReplicaSets in kube-system, over 400).
    Rollback usually needs only the previous 1-2, and with GitOps, Git is the history.
  suggest: "Deployment spec.revisionHistoryLimit 3 (as a shared chart value)."
  verify:
    - "kubectl get rs -A | awk '$2==0' | wc -l"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused: []
          pv_released: []
          services_without_pods: []
          replicasets_total: 400
          replicasets_zero: 351
          revision_history_limits:
            10: 20
      - expect: "warn"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused: []
          pv_released: []
          services_without_pods: []
          replicasets_total: 200
          replicasets_zero: 150
          revision_history_limits:
            10: 20
      - expect: "pass"
        item:
          configmaps_total: 100
          orphan_configmaps: []
          secrets_total: 100
          orphan_secrets: []
          pvc_unbound: []
          pvc_unused: []
          pv_released: []
          services_without_pods: []
          replicasets_total: 100
          replicasets_zero: 50
          revision_history_limits:
            10: 20

- id: traffic.lb-idle-timeout-long
  name: Load balancer idle timeout very long (slow backends hold connections for a long time)
  area: traffic
  type: summary
  each: traffic.alb.lbs
  rule:
    warn_expr: "item.get('type') == 'application' and (item.get('idle_timeout_s') or 0) >= 600"
  target: "'alb/' + str(item.get('name'))"
  evidence: "f\"ALB {item.get('name')} ({item.get('scheme')}): idle_timeout {item.get('idle_timeout_s')}s (default 60), {item.get('target_groups')} target groups\""
  severity_default: low
  symptom_linked: false
  why: >
    The ALB idle timeout is "how long to wait on a connection with no request or response flowing". The default is 60s; when it is raised to 300-3600s because of slow backends, a stalled dependency makes clients and the ALB hold connections for that long and the incident spreads slowly. App-level timeouts cannot be seen from manifests, so only the ALB annotation (idle_timeout.timeout_seconds) is considered. Long is intentional for WebSocket and SSE -- the LLM decides from the hostname.
    Measured on a real EKS cluster: a shared ALB at 300s (5x the 60s default); not applicable to NLBs.
  suggest: "Split WebSocket and streaming ingresses into a separate ALB group and keep the rest at 60-120s. Set explicit timeouts in the app's HTTP clients and DB drivers."
  verify:
    - "kubectl get ingress -A -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name+\" \"+(.metadata.annotations[\"alb.ingress.kubernetes.io/load-balancer-attributes\"]//\"\")' | grep idle_timeout"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          name: "k8s-middlewa-kafkacon-31ecf1515b"
          type: "application"
          scheme: "internet-facing"
          idle_timeout_s: 3600
          target_groups: 2
      - expect: "pass"
        item:
          name: "k8s-middlewa-kafkacon-31ecf1515b"
          type: "application"
          scheme: "internet-facing"
          idle_timeout_s: 300
          target_groups: 2
      - expect: "pass"
        item:
          name: "k8s-middlewa-kafkacon-31ecf1515b"
          type: "network"
          scheme: "internet-facing"
          idle_timeout_s: null
          target_groups: 2
- id: traffic.alb-target-type-instance
  name: prod target group with target-type instance (via NodePort -- no per-pod distribution or readiness gates)
  area: traffic
  type: summary
  each: traffic.alb.target_groups
  rule:
    warn_expr: "item.get('target_type') == 'instance' and item.get('lb_type') == 'application' and prod"
  target: "'targetgroup/' + str(item.get('name'))"
  evidence: "f\"Target group {item.get('name')} (LB {item.get('lb')}, {item.get('lb_type')}): target-type {item.get('target_type')}, service {item.get('namespace')}/{item.get('service')}, workloads {item.get('workloads')}\""
  severity_default: low
  symptom_linked: false
  why: >
    target-type instance is two hops (ALB -> node NodePort -> kube-proxy -> pod), so there is no per-pod distribution (pods on one node get swamped, keep-alive skew) and pod readiness gates cannot guarantee "traffic only after target registration", producing 5xx during deployments. ip mode is recommended and works directly with VPC CNI.
    Measured on a real EKS cluster: all 52 target groups were ip -> pass.
  suggest: "Ingress annotation alb.ingress.kubernetes.io/target-type: ip (Service as ClusterIP). On the namespace, elbv2.k8s.aws/pod-readiness-gate-inject: enabled."
  verify:
    - "kubectl get targetgroupbindings -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.targetType"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          name: "k8s-middlewa-kafkacon-f50452776f"
          lb: "k8s-middlewa-kafkacon-31ecf1515b"
          lb_type: "application"
          target_type: "instance"
          namespace: "prod-a"
          service: "kafka-controller-0-external"
          workloads: []
        prod: true
      - expect: "pass"
        item:
          name: "k8s-middlewa-kafkacon-f50452776f"
          lb: "k8s-middlewa-kafkacon-31ecf1515b"
          lb_type: "application"
          target_type: "ip"
          namespace: "prod-a"
          service: "kafka-controller-0-external"
          workloads: []
        prod: true
      - expect: "pass"
        item:
          name: "k8s-middlewa-kafkacon-f50452776f"
          lb: "k8s-middlewa-kafkacon-31ecf1515b"
          lb_type: "application"
          target_type: "instance"
          namespace: "dev-a"
          service: "kafka-controller-0-external"
          workloads: []
        prod: false
- id: resilience.termination-grace-unusual
  name: Termination grace (terminationGracePeriodSeconds) of traffic-serving prod workloads too short or too long
  area: resilience
  type: summary
  each: resilience.graceful.rows
  rule:
    warn_expr: "item.get('prod') and item.get('grace_s') is not None and ((item['grace_s'] < 15) or (item['grace_s'] > 300))"
  target: "item['workload']"
  evidence: "f\"{item['workload']}: terminationGracePeriodSeconds {item.get('grace_s')} (default 30), preStop {item.get('prestop')}, strategy {item.get('strategy')}\""
  severity_default: low
  symptom_linked: false
  why: >
    On pod deletion, kubelet sends SIGTERM and SIGKILLs after the grace period. Under 15s, the pod dies before ALB deregistration (several seconds) and in-flight requests finish, so every deployment and drain produces 5xx; over 300s, drains, rolling updates and Karpenter consolidation stall for that long. Pairs with preStop presence (resilience.no-prestop) and PID 1 shells (shell-pid1-no-prestop).
    Measured: all prod serving workloads on both the EKS cluster and the small k3s cluster were at the default 30s -> pass.
  suggest: "Serving workloads: preStop sleep 5-10s + grace 30-60s. Batch and consumers (Kafka): extend to the unit of work, together with a PDB."
  verify:
    - "kubectl get deploy -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,GRACE:.spec.template.spec.terminationGracePeriodSeconds"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workload: "argocd/deployment/argocd-applicationset-controller"
          namespace: "argocd"
          prod: true
          recreate_justified: false
          recreate_reason: []
          prestop: false
          grace_s: 5
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "warn"
        item:
          workload: "argocd/deployment/argocd-applicationset-controller"
          namespace: "argocd"
          prod: true
          recreate_justified: false
          recreate_reason: []
          prestop: false
          grace_s: 900
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "pass"
        item:
          workload: "argocd/deployment/argocd-applicationset-controller"
          namespace: "argocd"
          prod: true
          recreate_justified: false
          recreate_reason: []
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "pass"
        item:
          workload: "argocd/deployment/argocd-applicationset-controller"
          namespace: "argocd"
          prod: false
          recreate_justified: false
          recreate_reason: []
          prestop: false
          grace_s: 5
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "RollingUpdate"
          max_unavailable: "25%"
- id: hygiene.revision-history-zero
  name: Workloads with revisionHistoryLimit 0 (kubectl rollout undo impossible)
  area: hygiene
  type: summary
  each: hygiene.orphans.revision_history_zero
  rule:
    expr: "item.get('prod') and item['namespace'] != 'kube-system'"
    warn_expr: "item['namespace'] != 'kube-system'"  # k3s built-in components (coredns, local-path-provisioner, metrics-server) ship with 0 and are managed by the distribution -- excluded (3 cases measured on a small k3s cluster)
  target: "item['workload']"
  evidence: "f\"{item['workload']}: revisionHistoryLimit 0 -- no previous ReplicaSet is kept, so rollback is impossible\""
  severity_default: medium
  symptom_linked: false
  why: >
    A Deployment keeps revisionHistoryLimit (default 10) previous ReplicaSets and `kubectl rollout undo` reverts to them. At 0 the old ReplicaSet is deleted right after the rollout and rollback is impossible -- even with GitOps, Git revert -> sync takes minutes. The opposite of hygiene.old-replicasets (too many piling up).
    Measured: no user workload at 0 (only the 3 k3s built-ins in the small k3s cluster's kube-system -- managed by the distribution, excluded).
  suggest: "revisionHistoryLimit 3-5. Even under Argo CD, rollout undo is the fastest emergency rollback."
  verify:
    - "kubectl get deploy,sts -A -o json | jq -r '.items[] | select(.spec.revisionHistoryLimit==0) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
      - expect: "warn"
        item:
          workload: "dev-a/deployment/web"
          namespace: "dev-a"
          prod: false
- id: hygiene.orphan-services
  name: Services whose selector matches no pod (remnants of deleted workloads)
  area: hygiene
  type: summary
  each: hygiene.orphans.services_without_pods
  rule:
    warn_expr: "True"
  target: "item['namespace'] + '/service/' + item['name']"
  evidence: "f\"Service {item['namespace']}/{item['name']} selector {item.get('selector')} -- 0 matching pods\""
  severity_default: low
  symptom_linked: false
  why: >
    A Service whose selector matches no pod is either (a) an orphan left after the workload was deleted or (b) a label typo or mismatch so traffic goes nowhere. traffic.endpoint-zero catches (b) as "no ready endpoints"; this check counts orphan resources (Services referenced by nothing). Control plane Services in kube-* namespaces (having no pods is normal on EKS and k3s) are excluded.
  suggest: "If the workload is really gone, delete the Service (in Git if Argo CD manages it). If it is a label mismatch, fix the selector."
  verify:
    - "kubectl get endpointslices -A -o json | jq -r '.items[] | select((.endpoints // []) | length == 0) | .metadata.namespace+\"/\"+.metadata.ownerReferences[0].name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          namespace: "dev-a"
          name: "old-svc"
          selector:
            app: "gone"
          prod: false
- id: hygiene.no-progressive-delivery
  name: No canary / progressive delivery tool (Argo Rollouts, Flagger)
  area: hygiene
  type: absence
  family: progressive-delivery
  rule:
  evidence: "f\"No progressive-delivery component (Argo Rollouts, Flagger). All deployments are rolling updates (replace everything) -- ALB weighted target groups are not used either\""
  severity_default: info
  symptom_linked: false
  why: >
    A rolling update is "replace everything", so a defect in the new version reaches all traffic immediately. Without a canary tool (some traffic -> check metrics -> expand), deployment verification depends on human eyes and rollback speed (SRE Workbook ch. 16). In an organization with few prod services it is normal not to have one, so this is recorded as info only.
  suggest: "As services grow, automate canary judgment with Argo Rollouts (same ecosystem as Argo CD) + AnalysisTemplate (ALB 5xx, p95 Prometheus queries)."
  verify:
    - "kubectl get crd rollouts.argoproj.io canaries.flagger.app 2>&1"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        inventory:
          families_present:
            - "metrics-store"
          components_present:
            - "prometheus"
        summary: {}
      - expect: "pass"
        inventory:
          families_present:
            - "progressive-delivery"
          components_present:
            - "argo-rollouts"
        summary: {}

- id: node.memory-available-low
  name: Node available memory (MemAvailable) low (real headroom, including use outside containers)
  area: node
  type: metric
  inputs: [node_memory_available_ratio]
  rule:
    expr: "value < 0.10"
    warn_expr: "value < 0.20"
  target: "labels.get('node') or labels.get('instance')"
  evidence: "f\"Node {labels.get('node') or labels.get('instance')}: MemAvailable/MemTotal {value:.2f}\""
  severity_default: high
  symptom_linked: true
  why: >
    Separate from the allocatable that kubelet sees, this is the real headroom including the kernel, page cache, host daemons and containers without limits. Below 10%, kubelet's memory.available eviction starts or the kernel OOM killer may kill kubelet or containerd (a precursor of node.kernel-oom-node-level). The metric (node_memory_available_ratio) had been collected without a check until now.
    Measured: lowest 0.38 on an EKS node, 0.65 on the small k3s cluster -> pass.
  suggest: "Look at containers without limits (resources.no-memory-limit) and the node disk cache, and check kubelet systemReserved (node.kubelet-reserved-missing). If it recurs, add node memory."
  verify:
    - "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
    - "On the node: free -m; cat /proc/meminfo | grep -E 'MemAvailable|Dirty'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          node_memory_available_ratio:
            - labels:
                instance: "node-a:9100"
              value: 0.05
      - expect: "warn"
        metric:
          node_memory_available_ratio:
            - labels:
                instance: "node-a:9100"
              value: 0.15
      - expect: "pass"
        metric:
          node_memory_available_ratio:
            - labels:
                instance: "node-a:9100"
              value: 0.38
      # boundary: value exactly at the fail threshold
      - expect: "warn"
        metric:
          node_memory_available_ratio:
            - labels:
                instance: "node-a:9100"
              value: 0.1
- id: node.network-errors
  name: RX/TX errors increasing on a physical NIC over 24h
  area: node
  type: metric
  inputs: [node_network_errors_1d]
  rule:
    expr: "value >= 1000"
    warn_expr: "value >= 1"
  target: "(labels.get('node') or labels.get('instance')) + ':' + labels.get('device', '?')"
  evidence: "f\"Node {labels.get('node') or labels.get('instance')} device {labels.get('device')}: {value:.0f} RX+TX errors in 24h\""
  severity_default: medium
  symptom_linked: true
  why: >
    NIC errors are corrupted packets being retransmitted, which apps only see as intermittent timeouts and slow responses. ENA driver errors and link flaps on EKS, cable and driver problems on bare metal are caught here. Virtual interfaces (veth, cni, flannel, tailscale) are excluded -- flannel is covered by traffic.flannel-*.
    Measured on a real EKS cluster: one node's eth0 had 1,705 errors in 24h while the others had 0. Small k3s cluster 0.
  suggest: "On the node, ethtool -S eth0 | grep -i err shows the kind (rx_crc, tx_timeout, bw_in_allowance_exceeded, etc.). ENA allowance exceeded means the instance network limit was hit, so use a larger instance type or split the traffic."
  verify:
    - "increase(node_network_receive_errs_total{device=\"eth0\"}[1d])"
    - "On the node: ethtool -S eth0 | grep -iE 'err|drop|exceeded'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          node_network_errors_1d:
            - labels:
                instance: "node-b:9100"
                device: "eth0"
              value: 1705
      - expect: "warn"
        metric:
          node_network_errors_1d:
            - labels:
                instance: "node-b:9100"
                device: "eth0"
              value: 3
      - expect: "pass"
        metric:
          node_network_errors_1d:
            - labels:
                instance: "node-b:9100"
                device: "eth0"
              value: 0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          node_network_errors_1d:
            - labels:
                instance: "node-b:9100"
                device: "eth0"
              value: 1000
- id: node.timewait-sockets-high
  name: Many TIME_WAIT sockets (precursor of SNAT source port exhaustion)
  area: node
  type: metric
  inputs: [node_tcp_timewait]
  rule:
    expr: "value >= 25000"
    warn_expr: "value >= 10000"
  target: "labels.get('node') or labels.get('instance')"
  evidence: "f\"Node {labels.get('node') or labels.get('instance')}: {value:.0f} TIME_WAIT sockets (default source port range about 28,000)\""
  severity_default: medium
  symptom_linked: true
  why: >
    Pods leaving the cluster are SNATed to the node IP, and many short connections tie up the source ports (net.ipv4.ip_local_port_range, about 28,000 by default) in TIME_WAIT until they run out -- new connections are delayed 1-3s or fail while node CPU and memory look normal, so it is hard to find (Prezi incident). node.sysctl-tuning covers the port range width; this check looks at the actual socket count.
    Measured: max 208 on the EKS cluster, 220 on the small k3s cluster -> pass.
  suggest: "Reuse connections with keep-alive (HTTP client pools), or widen net.ipv4.ip_local_port_range (1024 65535) and set tcp_tw_reuse=1. Spread workloads with many external calls across NAT gateways or egress."
  verify:
    - "node_sockstat_TCP_tw"
    - "On the node: ss -s; sysctl net.ipv4.ip_local_port_range"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          node_tcp_timewait:
            - labels:
                instance: "n1"
              value: 26000
      - expect: "warn"
        metric:
          node_tcp_timewait:
            - labels:
                instance: "n1"
              value: 12000
      - expect: "pass"
        metric:
          node_tcp_timewait:
            - labels:
                instance: "n1"
              value: 208
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          node_tcp_timewait:
            - labels:
                instance: "n1"
              value: 25000
- id: node.kubelet-pleg-slow
  name: kubelet PLEG (pod status relist) p99 slow (precursor of node NotReady)
  area: node
  type: metric
  inputs: [kubelet_pleg_p99_1h]
  rule:
    expr: "value >= 3"
    warn_expr: "value >= 1"
  target: "labels.get('node') or labels.get('instance')"
  evidence: "f\"Node {labels.get('node') or labels.get('instance')}: PLEG relist p99 {value:.2f}s (1h; over 3s means PLEG is not healthy)\""
  severity_default: high
  symptom_linked: true
  why: >
    kubelet periodically asks the container runtime for the status of all pods again (PLEG relist). With many containers or a slow runtime or disk this takes longer, and if it exceeds 3s for 3 minutes kubelet marks the node NotReady with "PLEG is not healthy" -- every pod on that node is evicted. The log signature kubelet.pleg-not-healthy looks after the event; this metric looks before it.
    Measured: p99 5ms on the EKS cluster, 17ms on the small k3s cluster -> pass.
  suggest: "Reduce containers per node (including exited containers from node.cri-exited-containers) and check containerd and disk I/O. Lowering maxPods is another option."
  verify:
    - "histogram_quantile(0.99, sum by (le, node) (rate(kubelet_pleg_relist_duration_seconds_bucket[1h])))"
    - "On the node: journalctl -u kubelet | grep -c 'PLEG is not healthy'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          kubelet_pleg_p99_1h:
            - labels:
                node: "n1"
              value: 4.0
      - expect: "warn"
        metric:
          kubelet_pleg_p99_1h:
            - labels:
                node: "n1"
              value: 1.5
      - expect: "pass"
        metric:
          kubelet_pleg_p99_1h:
            - labels:
                node: "n1"
              value: 0.005
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          kubelet_pleg_p99_1h:
            - labels:
                node: "n1"
              value: 3
- id: controlplane.watch-count-high
  name: Too many open WATCHes on the apiserver per node (controllers and agents overusing informers)
  area: platform
  type: metric
  inputs: [apiserver_watch_per_node]
  rule:
    expr: "value >= 1500"
    warn_expr: "value >= 500"
  target: "'cluster'"
  evidence: "f\"{value:.0f} open WATCHes per node (apiserver_longrunning_requests verb=WATCH / node count)\""
  severity_default: medium
  symptom_linked: false
  why: >
    Each WATCH occupies apiserver memory and etcd event fan-out. kubelet, kube-proxy and the CNI opening dozens per node is normal; beyond that means controllers, CI runners or dashboards creating a new informer per resource. Combined with a restart storm (informer resync) it spreads into apiserver latency and 429s.
    Measured: 108 per node on a 7-node EKS cluster, 637 on a 2-node small k3s cluster (some 20 controllers on 2 nodes -- fewer nodes means a higher per-node figure) -> small k3s cluster warn.
  suggest: "Break apiserver_longrunning_requests down by resource and client (user-agent if audit logs exist) and fix controllers to share informers. Terminals left on kubectl get --watch count too."
  verify:
    - "sum by (resource) (apiserver_longrunning_requests{verb=\"WATCH\"})"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_watch_per_node:
            - labels: {}
              value: 1600
      - expect: "warn"
        metric:
          apiserver_watch_per_node:
            - labels: {}
              value: 637
      - expect: "pass"
        metric:
          apiserver_watch_per_node:
            - labels: {}
              value: 108
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_watch_per_node:
            - labels: {}
              value: 1500
- id: controlplane.apiserver-401-rate
  name: Continuous apiserver authentication failures (401) (expired tokens or bad credentials called repeatedly)
  area: platform
  type: metric
  inputs: [apiserver_401_rate_1h]
  rule:
    expr: "value >= 1"
    warn_expr: "value >= 0.05"
  target: "'cluster'"
  evidence: "f\"1h average {value:.3f} 401s per second\""
  severity_default: medium
  symptom_linked: false
  why: >
    A 401 is a call with a wrong token or certificate. A steady rate above 0.05/s (180 per hour) means a pod with an expired ServiceAccount token, CI using a revoked user's kubeconfig, or a wrong Prometheus scrape config; a spike may be an intrusion attempt. On EKS, controlplane.authenticator-failures sees the same thing from logs.
    Measured: 0 on both the EKS cluster and the small k3s cluster.
  suggest: "Look at the sourceIP and user-agent of the 401s in the audit log (EKS CloudWatch authenticator and audit streams). Small k3s cluster: journalctl -u k3s | grep 'Unable to authenticate'."
  verify:
    - "sum(rate(apiserver_request_total{code=\"401\"}[1h]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_401_rate_1h:
            - labels: {}
              value: 2.0
      - expect: "warn"
        metric:
          apiserver_401_rate_1h:
            - labels: {}
              value: 0.1
      - expect: "pass"
        metric:
          apiserver_401_rate_1h:
            - labels: {}
              value: 0.0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_401_rate_1h:
            - labels: {}
              value: 1
- id: controlplane.etcd-db-size
  name: etcd database size large (EKS limit 8GiB)
  area: platform
  type: metric
  inputs: [apiserver_storage_size_bytes]
  rule:
    expr: "value >= 6 * 1024**3"
    warn_expr: "value >= 2 * 1024**3"
  target: "'cluster'"
  evidence: "f\"etcd DB {value / 1024**3:.2f} GiB (apiserver_storage_size_bytes; EKS limit 8 GiB, self-managed default quota 2 GiB)\""
  severity_default: high
  symptom_linked: false
  why: >
    EKS etcd is invisible, but the apiserver reports the DB size as apiserver_storage_size_bytes (exposed on EKS 1.32 as measured). EKS etcd becomes read-only at 8GiB and the cluster stops. Events, completed Jobs and CR status (Argo CD Application, cert-manager Order, etc.) are the usual culprits. For the small k3s cluster's embedded etcd, platform.k3s-datastore-large sees the same via du.
    Measured: 108 MiB on the EKS cluster, 38 MiB on the small k3s cluster -> pass.
  suggest: "Clean up the resources that pile up per summary.controlplane.apiserver_metrics.storage_objects_top (ttlSecondsAfterFinished, event TTL, CR retention count). If self-managed, etcdctl defrag."
  verify:
    - "apiserver_storage_size_bytes"
    - "topk(10, apiserver_storage_objects)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_storage_size_bytes:
            - labels: {}
              value: 7516192768
      - expect: "warn"
        metric:
          apiserver_storage_size_bytes:
            - labels: {}
              value: 3221225472
      - expect: "pass"
        metric:
          apiserver_storage_size_bytes:
            - labels: {}
              value: 108351488
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_storage_size_bytes:
            - labels: {}
              value: 6442450944
- id: hygiene.large-configmaps
  name: Large ConfigMaps (near the 1MiB etcd object limit; apiserver and LIST load)
  area: hygiene
  type: summary
  each: hygiene.orphans.large_configmaps
  rule:
    expr: "item['kib'] >= 900"
    warn_expr: "item['kib'] >= 256"
  target: "item['namespace'] + '/configmap/' + item['name']"
  evidence: "f\"ConfigMap {item['namespace']}/{item['name']}: about {item['kib']} KiB, {item['keys']} keys (etcd object limit 1 MiB)\""
  severity_default: low
  symptom_linked: false
  why: >
    etcd accepts an object of at most 1MiB (apiserver request limit 1.5MiB). A large ConfigMap (dashboard JSON, CA bundles, static files) is refused updates once it hits the limit, and before that it makes LIST configmaps responses and the watch cache heavy, slowing every client. The Grafana dashboard sidecar is a common cause.
  suggest: "Do not pile dashboards and static files into one ConfigMap; split them or move to a PVC or object storage. CA bundles via trust-manager."
  verify:
    - "kubectl get configmaps -A -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name+\" \"+(.data|tostring|length|tostring)' | sort -k2 -n -r | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "monitoring"
          name: "grafana-dashboards"
          kib: 950
          keys: 12
          prod: false
      - expect: "warn"
        item:
          namespace: "monitoring"
          name: "grafana-dashboards"
          kib: 400
          keys: 12
          prod: false

- id: resources.jvm-heap-vs-limit
  name: JVM heap (-Xmx, MaxRAMPercentage) large relative to the memory limit, or not set
  area: resources
  type: summary
  each: resources.containers.jvm
  rule:
    expr: "(item.get('heap_ratio') or 0) >= 1.0"
    warn_expr: "(item.get('heap_ratio') or 0) >= 0.85 or (item.get('heap_unset') and not item.get('no_limit') and item.get('prod'))"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"{item['workload']} container {item['container']} ({item['image']}): -Xmx {item.get('xmx_mib')}MiB, MaxRAMPercentage {item.get('max_ram_percentage')}, memory limit {item.get('limit_mib')}MiB -> heap/limit {item.get('heap_ratio')} (heap unset {item.get('heap_unset')})\""
  severity_default: medium
  symptom_linked: true
  why: >
    The JVM uses metaspace, thread stacks, direct memory and the code cache on top of the heap. If -Xmx equals the limit or exceeds 85% of it, the whole container is OOMKilled before the heap fills -- the app log has no OutOfMemoryError, so the cause is never found (Airbnb 2019). MaxRAMPercentage=100 is the same. Conversely, with no heap setting the JVM uses only its default (25% of the limit) and the other 75% is reserved and wasted (warn for prod only).
    Measured: Kafka with -Xmx1024m / limit 2Gi (0.5) passed; a jmx-exporter with MaxRAMPercentage=100 / limit 128Mi (heap = limit) -> fail; on the small k3s cluster an API server at 50% and Elasticsearch with -Xmx1g / 3Gi passed.
  suggest: "Set -XX:MaxRAMPercentage=60-75 (standalone container without sidecars) and drop -Xmx so it follows limit changes. Heap dumps and GC logs go with an ephemeral-storage request."
  verify:
    - "kubectl get deploy,sts -A -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name+\" \"+([.spec.template.spec.containers[].env[]?.value // \"\"]|join(\" \"))' | grep -E 'Xmx|MaxRAMPercentage'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          container: "kafka"
          prod: false
          image: "kafka:3.6.1"
          xmx_mib: 2048.0
          max_ram_percentage: null
          limit_mib: 2048.0
          heap_ratio: 1.0
          heap_unset: false
          no_limit: false
      - expect: "fail"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          container: "jmx-exporter"
          prod: false
          image: "kafka:3.6.1"
          xmx_mib: null
          max_ram_percentage: 100.0
          limit_mib: 128.0
          heap_ratio: 1.0
          heap_unset: false
          no_limit: false
      - expect: "warn"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          container: "kafka"
          prod: true
          image: "kafka:3.6.1"
          xmx_mib: null
          max_ram_percentage: null
          limit_mib: 2048.0
          heap_ratio: null
          heap_unset: true
          no_limit: false
      - expect: "pass"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          container: "kafka"
          prod: false
          image: "kafka:3.6.1"
          xmx_mib: 1024.0
          max_ram_percentage: null
          limit_mib: 2048.0
          heap_ratio: 0.5
          heap_unset: false
          no_limit: false
      - expect: "pass"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          container: "kafka"
          prod: false
          image: "kafka:3.6.1"
          xmx_mib: null
          max_ram_percentage: null
          limit_mib: 2048.0
          heap_ratio: null
          heap_unset: true
          no_limit: false
- id: resources.sidecar-resource-share
  name: Sidecars take more than half of the workload's requests
  area: resources
  type: summary
  each: resources.containers.sidecars
  rule:
    warn_expr: "(item.get('sidecar_share') or 0) >= 0.5 and (item.get('total_request_mib') or 0) >= 256"
  target: "item['workload']"
  evidence: "f\"{item['workload']}: main {item['main']}, sidecars {item['sidecars']} request {item['sidecar_request_mib']}/{item['total_request_mib']}MiB ({item.get('sidecar_share')})\""
  severity_default: low
  symptom_linked: false
  why: >
    Mesh proxies, log collectors and metrics exporter sidecars attach to every pod and multiply by the replica count. When the sidecar request total exceeds the main container's, half the node capacity goes to auxiliary functions (Airbnb 2019 KubeCon) and KRR recommendations and bin-packing math get blurred as much. The main container is the one with the largest request.
    Measured: all multi-container workloads on both clusters (7 on EKS, 4 on the small k3s cluster) had a sidecar share under 50% -> pass.
  suggest: "Cut sidecar requests to the 7-day p95 (resources.p95), and see whether exporters can move from pod sidecars to a single Deployment per namespace."
  verify:
    - "kubectl get pods -A -o json | jq -r '.items[] | select((.spec.containers|length)>1) | .metadata.namespace+\"/\"+.metadata.name+\" \"+([.spec.containers[] | .name+\"=\"+(.resources.requests.memory//\"-\")]|join(\",\"))'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          prod: false
          main: "kafka"
          sidecars:
            - "jmx-exporter"
          sidecar_request_mib: 600
          total_request_mib: 1000
          sidecar_share: 0.6
          sidecar_like_names: true
      - expect: "pass"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          prod: false
          main: "kafka"
          sidecars:
            - "jmx-exporter"
          sidecar_request_mib: 128
          total_request_mib: 1152
          sidecar_share: 0.11
          sidecar_like_names: true
      - expect: "pass"
        item:
          workload: "tools/statefulset/kafka-controller"
          namespace: "tools"
          prod: false
          main: "kafka"
          sidecars:
            - "jmx-exporter"
          sidecar_request_mib: 100
          total_request_mib: 150
          sidecar_share: 0.67
          sidecar_like_names: true
- id: traffic.wildcard-host-ingress
  name: Ingress rule with a wildcard host (*.example.com) or no host (accepts requests for any host)
  area: traffic
  type: summary
  each: traffic.ingresses
  rule:
    warn_expr: "any((h or '').startswith('*.') for h in (item.get('hosts') or [])) or (not item.get('hosts')) and item.get('scheme') == 'internet-facing'"
  target: "item['target']"
  evidence: "f\"Ingress {item['target']} ({item.get('class')}, {item.get('scheme')}): hosts {item.get('hosts')}, TLS {item.get('tls')}\""
  severity_default: low
  symptom_linked: false
  why: >
    A rule with no host accepts any Host header, and *.example.com accepts every subdomain -- scanners, typo domains and another team's new subdomain land on this backend, and path priority gets mixed with other ingresses on the same LB (shared ALB group) (Google "How NOT to do Kubernetes" 2018). Only internet-facing ingresses are considered.
    Measured: no public Ingress with a wildcard or missing host on either cluster -> pass.
  suggest: "Specify hosts explicitly; if a wildcard is needed (per-tenant subdomains), split that Ingress into a separate LB group."
  verify:
    - "kubectl get ingress -A -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name+\" \"+([.spec.rules[].host // \"<none>\"]|join(\",\"))' | grep -E '\\*\\.|<none>'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          namespace: "prod-shop"
          name: "shop-admin-frontend"
          target: "prod-shop/shop-admin-frontend"
          class: "alb"
          hosts:
            - "*.example.com"
          tls: true
          scheme: "internet-facing"
          prod: true
      - expect: "warn"
        item:
          namespace: "prod-shop"
          name: "shop-admin-frontend"
          target: "prod-shop/shop-admin-frontend"
          class: "alb"
          hosts: []
          tls: true
          scheme: "internet-facing"
          prod: true
      - expect: "pass"
        item:
          namespace: "prod-shop"
          name: "shop-admin-frontend"
          target: "prod-shop/shop-admin-frontend"
          class: "alb"
          hosts:
            - "admin.example.com"
          tls: true
          scheme: "internet-facing"
          prod: true
      - expect: "pass"
        item:
          namespace: "prod-shop"
          name: "shop-admin-frontend"
          target: "prod-shop/shop-admin-frontend"
          class: "alb"
          hosts: []
          tls: true
          scheme: "internal"
          prod: true

- id: node.kubelet-api-qps-low
  name: kubelet apiserver call limit (kubeAPIQPS) is at the old default level (status updates lag on nodes with many pods)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: nodeos.nodes
  rule:
    warn_expr: "(item.get('kubelet') or {}).get('available') and ((item['kubelet'].get('kube_api_qps') or 0) <= 5) and ((item['kubelet'].get('max_pods') or 0) >= 60)"
  target: "item['node']"
  evidence: "f\"Node {item['node']}: kubeAPIQPS {(item.get('kubelet') or {}).get('kube_api_qps')}, kubeAPIBurst {(item.get('kubelet') or {}).get('kube_api_burst')}, maxPods {(item.get('kubelet') or {}).get('max_pods')}\""
  severity_default: low
  symptom_linked: false
  why: >
    The kubelet rate-limits its writes of pod and node status to the apiserver with kubeAPIQPS (old default 5, default 50 since 1.27). With dozens of pods on a node, 5 QPS makes status updates lag after restarts or evictions, so Deployments sit in "progressing" for a long time and HPA/PDB decisions come late (Zalando 2019 kubelet QPS postmortem). On clusters with many nodes this compounds apiserver 429s.
    Measured: a small k3s cluster passes with 50/100 (k3s default); EKS AL2 nodes also default to 50.
  suggest: "Set kubeAPIQPS 50 and kubeAPIBurst 100 in the kubelet config (on EKS: kubelet-extra-args in the node group launch template, or EC2NodeClass.spec.kubelet)."
  verify:
    - "kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq '.kubeletconfig | {kubeAPIQPS, kubeAPIBurst, maxPods}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          node: "node-a"
          kubelet:
            available: true
            kube_api_qps: 5
            kube_api_burst: 10
            max_pods: 110
      - expect: "pass"
        item:
          node: "node-a"
          kubelet:
            available: true
            kube_api_qps: 50
            kube_api_burst: 100
            max_pods: 110
      - expect: "pass"
        item:
          node: "node-a"
          kubelet:
            available: false
- id: hygiene.change-correlation
  name: Time correlation between recent changes (deploys, ConfigMaps, ingresses) and metric degradation (LLM judgement)
  area: hygiene
  type: llm
  inputs: "summary.json recent_changes (workloads, namespaces, event_targets; 24h) · diff.json (objects.changed, findings.new, metrics.top_delta) · resilience.restarts.rows[].last_finished · traffic.ingresses[].metrics · events.reasons[].first/last"
  target: "'cluster'"
  severity_default: medium
  symptom_linked: true
  why: >
    Most outages are triggered by a change (Google SRE Book ch. 8; Cloudflare incident reports in general). The code only gathers the material: workloads and namespaces changed within 24 hours (recent_changes), objects changed and new findings versus the previous snapshot (diff), last termination times of restarts and OOMs, ingress 5xx and p95, first and last times of Warning events.
    The LLM asks whether restarts, 5xx or Unhealthy began on that workload (or that ingress) within ±30 minutes of a change. If they overlap, write "Y started after change X — rollback candidate"; if the material is instant values and times cannot be matched, write "correlation not verifiable (range query needed)". If nothing overlaps, finish in one line. Do not assert.
  suggest: "If they overlap, pin down the change with kubectl rollout history or Argo CD history for that workload, roll it back and watch whether the metrics recover. If it recurs: canary (hygiene.no-progressive-delivery) and a GitOps diff gate."
  verify:
    - "kubectl rollout history deploy/<name>; kubectl get events -A --sort-by=.lastTimestamp | tail -50"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "llm"

- id: hygiene.unused-crds
  name: Many CRDs with zero objects (installed but unused features)
  area: hygiene
  type: summary
  each: hygiene.crds
  cluster_level: true
  rule:
    warn_expr: "item['zero_object_count'] >= 20"
  target: "'cluster'"
  evidence: "f\"{item['zero_object_count']} of {item['count']} CRDs have zero objects (by group {item['zero_by_group']}), {item['webhooks']} webhooks\""
  severity_default: low
  symptom_linked: false
  why: >
    Each CRD is one apiserver API and usually brings a controller and a webhook. Many CRDs with zero objects means most features of the installed components are unused (a system you cannot understand cannot be trusted).
    A single component often installs a dozen CRDs (e.g. external-secrets generators), so this is not a defect in itself; it is material for finding whole unused components to remove.
  suggest: "If monitoring.coreos.com has zero ServiceMonitor/PodMonitor objects, kube-prometheus-stack only uses additional scrape configs — same root cause as the *-not-scraped findings (promtail, argocd, keda) in the observability section, so merge them into one item. If every CRD of a group has zero objects, consider removing that component. Otherwise leave it."
  verify:
    - "kubectl get crd -o name | while read c; do n=$(kubectl get ${c#*/} -A --no-headers 2>/dev/null | wc -l); echo \"$n $c\"; done | sort -n | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          count: 47
          groups: {}
          zero_object_crds:
            - "a"
          zero_object_count: 27
          not_dumped: []
          zero_by_group:
            generators.external-secrets.io: 7
          webhooks: 18
      - expect: "pass"
        item:
          count: 47
          groups: {}
          zero_object_crds: []
          zero_object_count: 0
          not_dumped: []
          zero_by_group: {}
          webhooks: 18

- id: hygiene.unmanaged-prod-workloads
  name: Production workload managed by neither Helm, Argo CD nor Flux (manually applied manifest)
  area: hygiene
  type: summary
  each: hygiene.templating.unmanaged
  rule:
    expr: "item['prod']"
  target: "item['workload']"
  evidence: "f\"No managed-by label, Argo CD tracking or Helm annotation. kubectl apply trace (last-applied-configuration) {item['last_applied']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A proxy for whether standard labels, probes, resources and PDBs are enforced by templating. A workload not managed by Helm or Argo CD has no source of truth in Git: no change history, rollback or reproduction, and it disappears when the cluster is rebuilt.
  suggest: "Move the manifest (or chart) into a Git repo and apply it with an Argo CD Application. Manual changes then show up as OutOfSync."
  verify:
    - "kubectl get deploy -A -o json | jq -r '.items[] | select(.metadata.labels[\"app.kubernetes.io/managed-by\"]==null and .metadata.annotations[\"argocd.argoproj.io/tracking-id\"]==null) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          managed_by: null
          last_applied: true
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          managed_by: null
          last_applied: true
      - expect: "none"

# ---------- Resilience. Material is summary.resilience (lib/resilience.py) ----------
- id: resilience.liveness-dependency-path
  name: liveness probe checks dependencies (DB, ready) or shares its path with readiness
  area: resilience
  type: summary
  each: resilience.probes.rows
  rule:
    expr: "item['dependency_liveness'] and item['prod']"
    warn_expr: "item['prod'] and (item['dependency_liveness'] or (item['same_path'] and item['serves_traffic']))"  # non-prod (including argocd/monitoring default manifests) is not checked
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"{item['flags']}. liveness {item['liveness']}, readiness {item['readiness']}, startup {'present' if item['startup'] else 'absent'}\""
  severity_default: low
  symptom_linked: true
  why: >
    liveness should only answer "is it dead, should it be restarted". If the path also checks DB, cache or upstream state (/health/db, ?full=true, the same path as /ready), a brief dependency slowdown makes the kubelet kill a healthy app,
    and the restarted app hammers the dependency again, amplifying the outage (retry storm). Sharing the readiness path is a warn because that path is likely to check dependencies.
    This is inferred from the path name, so it is a "suspicion" — confirm by reading the handler in the app code.
  suggest: "liveness checks process liveness only (/livez, tcpSocket); dependency checks go in readiness only. On a dependency outage the right response is removal from traffic, not a restart."
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].livenessProbe}'"
    - "kubectl get events -n <ns> --field-selector reason=Unhealthy"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags:
            - "liveness path looks like a dependency/ready check (suspect: /healthz?full=true)"
          dependency_liveness: true
          same_path: false
          suspect_liveness: true
          exec_probe: false
          aggressive_liveness: false
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags:
            - "liveness and readiness share the same path (/)"
          dependency_liveness: false
          same_path: true
          suspect_liveness: true
          exec_probe: false
          aggressive_liveness: false
      - expect: "pass"  # non-prod is not checked
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "dev-a"
          name: "web"
          container: "app"
          prod: false
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags:
            - "x"
          dependency_liveness: true
          same_path: false
          suspect_liveness: false
          exec_probe: false
          aggressive_liveness: false
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags: []
          dependency_liveness: false
          same_path: false
          suspect_liveness: false
          exec_probe: false
          aggressive_liveness: false

- id: resilience.exec-probe
  name: exec probe (forks a process every period; node load and false failures)
  area: resilience
  type: summary
  each: resilience.probes.rows
  rule:
    warn_expr: "item['exec_probe']"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"{[f for f in item['flags'] if 'exec' in f]}. liveness {item['liveness']}, readiness {item['readiness']}\""
  severity_default: low
  symptom_linked: false
  why: >
    An exec probe forks a process inside the container every period. With many pods it eats node CPU (Datadog case), and when the node is busy it does not finish within timeoutSeconds 1s, producing false failures and false restarts.
    Measured on a k3s k3s: a Postgres pg_isready exec probe hit the 1s timeout during CPU throttling and produced 15 Unhealthy events.
  suggest: "Use httpGet or tcpSocket. If exec is unavoidable, timeoutSeconds 3 or more and a lightweight command."
  verify:
    - "kubectl get deploy,sts -A -o json | jq -r '.items[] | select(.spec.template.spec.containers[].livenessProbe.exec or .spec.template.spec.containers[].readinessProbe.exec) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "exec"
            path: "pg_isready"
            port: null
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 0
          startup: null
          flags:
            - "readiness exec (forks a process every period, node load)"
          dependency_liveness: false
          same_path: false
          suspect_liveness: false
          exec_probe: true
          aggressive_liveness: false
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags: []
          dependency_liveness: false
          same_path: false
          suspect_liveness: false
          exec_probe: false
          aggressive_liveness: false

- id: resilience.aggressive-liveness
  name: liveness failure window is 15s or less and there is no startupProbe
  area: resilience
  type: summary
  each: resilience.probes.rows
  rule:
    warn_expr: "item['aggressive_liveness']"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"{[f for f in item['flags'] if 'failure window' in f]}. liveness {item['liveness']}\""
  severity_default: low
  symptom_linked: true
  why: If failureThreshold × periodSeconds is 15s or less, the container is killed by short stalls such as GC pauses, slow disks or CPU throttling. Protect slow-starting apps with a startupProbe and keep liveness generous.
  suggest: "liveness periodSeconds 10-30, failureThreshold 3 or more (window 30s+); for slow startup add a startupProbe (failureThreshold 30, period 10)."
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].livenessProbe}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/livez"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 2
            initial_delay_s: 0
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags:
            - "liveness failure window 10s (no startupProbe) — a short stall restarts the container"
          dependency_liveness: false
          same_path: false
          suspect_liveness: false
          exec_probe: false
          aggressive_liveness: true
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          kind: "Deployment"
          namespace: "prod-a"
          name: "web"
          container: "app"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/healthz"
            port: 8080
            timeout_s: 1
            period_s: 10
            failure_threshold: 3
            initial_delay_s: 10
          readiness:
            type: "httpGet"
            path: "/ready"
            port: 8080
            timeout_s: 1
            period_s: 5
            failure_threshold: 3
            initial_delay_s: 5
          startup: null
          flags: []
          dependency_liveness: false
          same_path: false
          suspect_liveness: false
          exec_probe: false
          aggressive_liveness: false

- id: resilience.pdb-blocks-drain
  name: PDB does not allow any disruption (ALLOWED DISRUPTIONS 0 — drain and node replacement stall)
  area: resilience
  type: summary
  each: resilience.pdbs.rows
  rule:
    expr: "item['blocks_drain'] or item['never_allows']"
    warn_expr: "item['orphan']"
  target: "item['target']"
  evidence: "f\"PDB {item['namespace']}/{item['name']}: minAvailable {item['min_available']}, maxUnavailable {item['max_unavailable']}, disruptions allowed {item['disruptions_allowed']}, currently healthy {item['current_healthy']}/expected {item['expected_pods']}, targets {item['covered_workloads']} (replicas {item['covered_replicas']}){' — selects no pods (orphan)' if item['orphan'] else ''}\""
  severity_default: high
  symptom_linked: false
  why: >
    With disruptionsAllowed 0, kubectl drain, Karpenter consolidation and node replacement can never evict that pod. If minAvailable equals replicas or maxUnavailable is 0, it is structurally always 0.
    Conversely, a PDB that selects no pods gives no protection while making you believe there is some.
  suggest: "Set minAvailable to replicas−1 or less (or maxUnavailable 1). To put a PDB on a single-replica workload, raise replicas to 2 first."
  verify:
    - "kubectl get pdb -A"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          min_available: 1
          max_unavailable: null
          selector:
            matchLabels:
              app: "web"
          covered_workloads:
            - "prod-a/deployment/web"
          covered_replicas: 2
          disruptions_allowed: 0
          current_healthy: 2
          desired_healthy: 1
          expected_pods: 2
          blocks_drain: true
          never_allows: false
          orphan: false
          prod: true
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          min_available: 2
          max_unavailable: null
          selector:
            matchLabels:
              app: "web"
          covered_workloads:
            - "prod-a/deployment/web"
          covered_replicas: 2
          disruptions_allowed: 1
          current_healthy: 2
          desired_healthy: 1
          expected_pods: 2
          blocks_drain: false
          never_allows: true
          orphan: false
          prod: true
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          min_available: 1
          max_unavailable: null
          selector:
            matchLabels:
              app: "web"
          covered_workloads: []
          covered_replicas: 2
          disruptions_allowed: 1
          current_healthy: 2
          desired_healthy: 1
          expected_pods: 0
          blocks_drain: false
          never_allows: false
          orphan: true
          prod: true
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/web"
          min_available: 1
          max_unavailable: null
          selector:
            matchLabels:
              app: "web"
          covered_workloads:
            - "prod-a/deployment/web"
          covered_replicas: 2
          disruptions_allowed: 1
          current_healthy: 2
          desired_healthy: 1
          expected_pods: 2
          blocks_drain: false
          never_allows: false
          orphan: false
          prod: true

- id: resilience.shell-pid1-no-prestop
  name: Container whose PID 1 is a shell has no preStop (SIGTERM never reaches the app)
  area: resilience
  type: summary
  each: resilience.graceful.rows
  rule:
    expr: "bool(item['shell_pid1_containers']) and not item['prestop'] and item['prod']"
    warn_expr: "bool(item['shell_pid1_containers']) and not item['prestop']"
  target: "item['workload']"
  evidence: "f\"Containers whose command is sh -c {item['shell_pid1_containers']}, no preStop, terminationGracePeriodSeconds {item['grace_s']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    In a container started with `sh -c "..."` the shell is PID 1, and the shell does not forward SIGTERM to its child. The app never learns it is being terminated until the grace period ends and SIGKILL arrives, so in-flight requests are cut off.
    Only the manifest's command is inspected, so a shell-form CMD in the Dockerfile is not caught.
  suggest: "Use exec-form command (run the binary directly, no shell) or tini as ENTRYPOINT. As a stopgap, a preStop sleep and a longer grace period."
  verify:
    - "kubectl exec -n <ns> <pod> -- cat /proc/1/cmdline | tr '\\0' ' '"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          prestop: false
          grace_s: 30
          shell_pid1_containers:
            - "app"
          readiness_gate: null
          replicas: 2
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          prestop: false
          grace_s: 30
          shell_pid1_containers:
            - "app"
          readiness_gate: null
          replicas: 2
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          prestop: true
          grace_s: 30
          shell_pid1_containers:
            - "app"
          readiness_gate: null
          replicas: 2
          strategy: "RollingUpdate"
          max_unavailable: "25%"
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 2
          strategy: "RollingUpdate"
          max_unavailable: "25%"

- id: resilience.recreate-strategy-serving
  name: Traffic-serving Deployment uses the Recreate strategy (downtime on every rollout)
  area: resilience
  type: summary
  each: resilience.graceful.rows
  rule:
    expr: "item['strategy'] == 'Recreate' and item['prod'] and not item['recreate_justified']"
    warn_expr: "item['strategy'] == 'Recreate' and not item['recreate_justified'] and item['namespace'] != 'kube-system'"  # single-leader controllers in kube-system (external-dns etc.) are correct with Recreate
  target: "item['workload']"
  evidence: "f\"strategy Recreate (justification {item['recreate_reason'] or 'none'}), replicas {item['replicas']}, preStop {item['prestop']}, grace {item['grace_s']}s\""
  severity_default: medium
  symptom_linked: true
  why: Recreate deletes all old pods before starting new ones, so every rollout causes a full outage regardless of replica count. Use it only when two instances cannot run at once (e.g. a ReadWriteOnce volume — and then a DB belongs in a StatefulSet).
  suggest: "RollingUpdate (maxSurge 1, maxUnavailable 0). If the volume is the reason, move to a StatefulSet or RWX storage."
  verify:
    - "kubectl get deploy -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,STRATEGY:.spec.strategy.type | grep Recreate"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "pass"
        item:
          workload: "prod-a/deployment/postgres"
          namespace: "prod-a"
          prod: true
          recreate_justified: true
          recreate_reason: ["RWO PVC ['postgres-data']"]
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "Recreate"
          max_unavailable: null
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 1
          strategy: "Recreate"
          recreate_justified: false
          recreate_reason: []
          max_unavailable: "25%"
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 2
          strategy: "Recreate"
          recreate_justified: false
          recreate_reason: []
          max_unavailable: "25%"
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          prestop: false
          grace_s: 30
          shell_pid1_containers: []
          readiness_gate: null
          replicas: 2
          strategy: "RollingUpdate"
          recreate_justified: false
          recreate_reason: []
          max_unavailable: "25%"

- id: resilience.replicas-same-node
  name: All replicas run on a single node (one node failure takes the service down)
  area: resilience
  type: summary
  each: resilience.placement.rows
  rule:
    expr: "item['all_same_node'] and item['prod']"
    warn_expr: "item['all_same_node'] or (item['prod'] and not item['spread_declared'])"
  target: "item['workload']"
  evidence: "f\"replicas {item['replicas']} (Running {item['running']}), node distribution {item['nodes']}, AZ distribution {item['zones']}, topologySpread {item['topology_spread']}, podAntiAffinity {item['anti_affinity']}, nodes eligible under scheduling constraints {item['eligible_nodes']}{' — only one eligible node, so a spread declaration still lands on the same node' if item['single_eligible_node'] else ''}\""
  severity_default: high
  symptom_linked: true
  why: >
    The point of 2 replicas is to survive one dying, but if both sit on the same node they vanish together the moment that node dies (Moonlight case). Without a spread declaration (topologySpreadConstraints, podAntiAffinity)
    the scheduler packs pods onto whichever node has room, and Karpenter consolidation actively gathers them onto one node. Measured on a real EKS cluster: all 4 production Deployments on a single node.
  suggest: "topologySpreadConstraints (topologyKey kubernetes.io/hostname, maxSkew 1, whenUnsatisfiable DoNotSchedule). On a 2-node small k3s cluster use ScheduleAnyway and accept the outage when one node is lost."
  verify:
    - "kubectl get pods -n <ns> -l app=<name> -o wide"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 2
          zones:
            a: 2
          all_same_node: true
          all_same_zone: true
          spread_declared: false
          topology_spread: []
          anti_affinity: null
          eligible_nodes: 2
          single_eligible_node: false
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          replicas: 2
          running: 2
          nodes:
            n1: 2
          zones:
            a: 1
            c: 1
          all_same_node: true
          all_same_zone: false
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null
          eligible_nodes: 2
          single_eligible_node: false
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 1
            n2: 1
          zones:
            a: 1
            c: 1
          all_same_node: false
          all_same_zone: false
          spread_declared: false
          topology_spread: []
          anti_affinity: null
          eligible_nodes: 2
          single_eligible_node: false
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 1
            n2: 1
          zones:
            a: 1
            c: 1
          all_same_node: false
          all_same_zone: false
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null
          eligible_nodes: 2
          single_eligible_node: false

- id: resilience.single-eligible-node
  name: Workload that can only land on one node because of scheduling constraints (nodeSelector, required nodeAffinity, taint)
  area: resilience
  type: summary
  each: resilience.placement.single_eligible_node
  rule:
    expr: "item['prod'] and item['nodes_total'] >= 3 and not item.get('unavoidable')"  # on a 2-node cluster, avoiding one node is a design choice, so warn
    warn_expr: "item['nodes_total'] >= 2"
  target: "item['workload']"
  evidence: "f\"{item['workload']}: eligible nodes {item['eligible_nodes']} (of {item['nodes_total']} nodes), constraints {item['constraints']}, unavoidable pin reasons {item.get('pin_reasons')}, replicas {item['replicas']}, serves traffic {item['serves_traffic']}\""
  severity_default: high
  symptom_linked: true
  why: >
    If there are two or more nodes but required nodeAffinity, nodeSelector or taints leave only one eligible node, every replica is on that node no matter the replica count or topologySpread declaration — and when that node dies the workload cannot come back anywhere.
    Measured on a 2-node k3s k3s: a required nodeAffinity avoiding the `role=observability` label (intent: keep apps off the observability node) combined with that label on node B pinned 15 production Deployments to node A, and when node A went down abruptly they were all unavailable for about 3 minutes.
    A hostname nodeSelector (resilience.single-node-dependency) is an explicit pin; this check catches label combinations that leave only one node as a side effect.
  suggest: "Change required to preferred (weight 100): the node is preferred normally and pods move elsewhere when it dies. Keep genuinely necessary pins (local-path PV, GPU) and record the reason."
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.affinity.nodeAffinity}' ; kubectl get nodes --show-labels"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          eligible_nodes: ["node-a"]
          nodes_total: 3
          constraints:
            - "required nodeAffinity role NotIn observability"
          serves_traffic: true
      - expect: "warn"
        item:
          workload: "default/deployment/tool"
          namespace: "default"
          prod: false
          replicas: 1
          eligible_nodes: ["node-b"]
          nodes_total: 2
          constraints:
            - "nodeSelector kubernetes.io/hostname=node-b"
          serves_traffic: false
      - expect: "none"

- id: resilience.replicas-same-zone
  name: All replicas run in a single availability zone (AZ)
  area: resilience
  type: summary
  each: resilience.placement.rows
  rule:
    expr: "item['all_same_zone'] and item['prod'] and not item['all_same_node']"
    warn_expr: "item['all_same_zone'] and not item['all_same_node']"
  target: "item['workload']"
  evidence: "f\"replicas {item['replicas']}, AZ distribution {item['zones']}, node distribution {item['nodes']}, topologySpread {item['topology_spread']}\""
  severity_default: medium
  symptom_linked: false
  why: On EKS a whole AZ occasionally slows down or becomes unreachable. If every replica is in one AZ the service disappears when that happens. Replicas packed onto one node are caught by the more urgent replicas-same-node.
  suggest: "Add a second topologySpreadConstraint with topologyKey topology.kubernetes.io/zone (maxSkew 1, ScheduleAnyway)."
  verify:
    - "kubectl get pods -n <ns> -l app=<name> -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 1
            n2: 1
          zones:
            a: 2
          all_same_node: false
          all_same_zone: true
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null
      - expect: "warn"
        item:
          workload: "prod-a/deployment/web"
          namespace: "dev-a"
          prod: false
          replicas: 2
          running: 2
          nodes:
            n1: 1
            n2: 1
          zones:
            a: 2
          all_same_node: false
          all_same_zone: true
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 2
          zones:
            a: 2
          all_same_node: true
          all_same_zone: true
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null
      - expect: "pass"
        item:
          workload: "prod-a/deployment/web"
          namespace: "prod-a"
          prod: true
          replicas: 2
          running: 2
          nodes:
            n1: 1
            n2: 1
          zones:
            a: 1
            c: 1
          all_same_node: false
          all_same_zone: false
          spread_declared: true
          topology_spread:
            - key: "kubernetes.io/hostname"
              max_skew: 1
              when: "DoNotSchedule"
          anti_affinity: null

- id: resilience.single-node-dependency
  name: Workload pinned to a specific node (nodeSelector hostname, nodeName, hostPath)
  area: resilience
  type: summary
  each: resilience.single_node.rows
  rule:
    expr: "item['prod']"
    warn_expr: "True"
  target: "item['workload']"
  evidence: "f\"{item['reasons']}, replicas {item['replicas']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A workload pinned by node name cannot start anywhere when that node dies. hostPath means the same thing: the data lives on that node's disk. The typical case is a small k3s cluster DB pinned because of a local-path volume (then it is the same target as storage.local-path-node-pinned).
    If the pin is intentional (GPU node, node with the disk), the purpose is to record in the report that this node is a single point of failure.
  suggest: "Switch to a nodeSelector on node labels (role, GPU) and move data to storage not tied to a node (EBS, Longhorn, NFS). For a small k3s cluster, externalizing backups is the realistic answer."
  verify:
    - "kubectl get deploy,sts -A -o json | jq -r '.items[] | select(.spec.template.spec.nodeSelector[\"kubernetes.io/hostname\"] or .spec.template.spec.nodeName) | .metadata.namespace+\"/\"+.metadata.name'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/statefulset/db"
          namespace: "prod-a"
          prod: true
          reasons:
            - "nodeSelector kubernetes.io/hostname=node-b"
          replicas: 1
      - expect: "warn"
        item:
          workload: "prod-a/statefulset/db"
          namespace: "dev-a"
          prod: false
          reasons:
            - "nodeSelector kubernetes.io/hostname=node-b"
          replicas: 1
      - expect: "none"

- id: resilience.az-volume-without-nodes
  name: AZ that an EBS volume is pinned to has no node or only one
  area: resilience
  type: summary
  each: resilience.az_volumes.rows
  rule:
    expr: "bool(item['zone_without_nodes'])"
    warn_expr: "item['prod'] and min(item['nodes_in_zone'].values() or [0]) <= 1"
  target: "item['workload']"
  evidence: "f\"PVC {item['claims']} → AZ {item['zones']}, nodes in that AZ {item['nodes_in_zone']}\""
  severity_default: high
  symptom_linked: true
  why: >
    EBS only attaches within the AZ it was created in. If that AZ has no node the pod stays Pending forever (Karpenter will launch one if the AZ is in the requirements, but spot capacity may be missing); if it has only one node, that node is a single point of failure.
    A StatefulSet DB is the typical case. After node replacement or a spot reclaim, "the volume is in 2a but the nodes only came up in 2c" is a common reason recovery is slow.
  suggest: "Include that AZ in the NodePool requirements and keep an on-demand fallback. Keep the DB in one AZ but keep at least 2 nodes there (or use EFS / Multi-AZ RDS)."
  verify:
    - "kubectl get pv -o custom-columns=NAME:.metadata.name,CLAIM:.spec.claimRef.name,ZONE:.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]"
    - "kubectl get nodes -L topology.kubernetes.io/zone"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/statefulset/mysql"
          namespace: "prod-a"
          prod: true
          claims:
            data-mysql-0: "us-east-1a"
          zones:
            - "us-east-1a"
          nodes_in_zone:
            us-east-1a: 0
          zone_without_nodes:
            - "us-east-1a"
      - expect: "warn"
        item:
          workload: "prod-a/statefulset/mysql"
          namespace: "prod-a"
          prod: true
          claims:
            data-mysql-0: "us-east-1a"
          zones:
            - "us-east-1a"
          nodes_in_zone:
            us-east-1a: 1
          zone_without_nodes: []
      - expect: "pass"
        item:
          workload: "prod-a/statefulset/mysql"
          namespace: "prod-a"
          prod: true
          claims:
            data-mysql-0: "us-east-1a"
          zones:
            - "us-east-1a"
          nodes_in_zone:
            us-east-1a: 3
          zone_without_nodes: []
      - expect: "pass"
        item:
          workload: "prod-a/statefulset/mysql"
          namespace: "dev-a"
          prod: false
          claims:
            data-mysql-0: "us-east-1a"
          zones:
            - "us-east-1a"
          nodes_in_zone:
            us-east-1a: 1
          zone_without_nodes: []

- id: resilience.n-plus-one
  name: Losing one node (the largest) would leave pods unschedulable (N+1 not met)
  area: resilience
  type: summary
  each: resilience.n_plus_one
  cluster_level: true
  rule:
    expr: "item.get('available') and not item['ok'] and not item['karpenter']"
    warn_expr: "item.get('available') and not item['ok']"
  target: "'cluster'"
  evidence: "f\"Allocatable without the largest node {item['largest_node']} ({item['largest_node_cpu']} cores, {item['largest_node_memory_gb']}GB): CPU {item['allocatable_cpu_without_largest']} cores vs total requests {item['requests_cpu_total']} ({'OK' if item['cpu_ok'] else 'short'}), memory {item['allocatable_memory_gb_without_largest']}GB vs {item['requests_memory_gb_total']}GB ({'OK' if item['memory_ok'] else 'short'}). Pods on that node {item['pods_on_largest_node']} (prod {item['prod_pods_on_largest_node']}). Pods that fit on no other node {item['cannot_fit_elsewhere']}. Node autoscaler {'present (delay until a new node)' if item['karpenter'] else 'absent (permanent)'}\""
  severity_default: high
  symptom_linked: true
  why: >
    If allocatable minus the largest node is smaller than the sum of all requests (excluding DaemonSets), some pods find no room when one node is lost. On a small k3s cluster without an autoscaler those pods never start again;
    with Karpenter they wait until a new node is up (measured p50 62s, longer without spot capacity). Measured on a real EKS cluster: 43.5GB of memory requests vs 40GB — a backend was Pending for 2 minutes during a spot reclaim that day.
    Unmet N+1 is a critical candidate regardless of profile — the LLM raises it based on production impact.
  suggest: "Reduce over-requesting first (resources.cpu-request-overprovisioned, KRR) — actual usage is often single-digit percent, so trimming requests alone usually restores N+1. Then add a node or an on-demand fallback in the Karpenter requirements."
  verify:
    - "sum(kube_node_status_allocatable{resource=\"memory\"}) - max(kube_node_status_allocatable{resource=\"memory\"})"
    - "sum(kube_pod_container_resource_requests{resource=\"memory\"})"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          nodes: 7
          largest_node: "n1"
          largest_node_cpu: 4.0
          largest_node_memory_gb: 31.0
          allocatable_cpu_total: 15.6
          allocatable_cpu_without_largest: 11.6
          requests_cpu_total: 10.4
          allocatable_memory_gb_total: 71.0
          allocatable_memory_gb_without_largest: 40.0
          requests_memory_gb_total: 43.5
          cpu_ok: true
          memory_ok: false
          ok: false
          pods_on_largest_node: 41
          prod_pods_on_largest_node: 27
          cannot_fit_elsewhere: []
          cannot_fit_prod: []
          karpenter: false
          note: "n"
      - expect: "warn"
        item:
          available: true
          nodes: 7
          largest_node: "n1"
          largest_node_cpu: 4.0
          largest_node_memory_gb: 31.0
          allocatable_cpu_total: 15.6
          allocatable_cpu_without_largest: 11.6
          requests_cpu_total: 10.4
          allocatable_memory_gb_total: 71.0
          allocatable_memory_gb_without_largest: 40.0
          requests_memory_gb_total: 43.5
          cpu_ok: true
          memory_ok: false
          ok: false
          pods_on_largest_node: 41
          prod_pods_on_largest_node: 27
          cannot_fit_elsewhere: []
          cannot_fit_prod: []
          karpenter: true
          note: "n"
      - expect: "pass"
        item:
          available: true
          nodes: 7
          largest_node: "n1"
          largest_node_cpu: 4.0
          largest_node_memory_gb: 31.0
          allocatable_cpu_total: 15.6
          allocatable_cpu_without_largest: 11.6
          requests_cpu_total: 10.4
          allocatable_memory_gb_total: 71.0
          allocatable_memory_gb_without_largest: 40.0
          requests_memory_gb_total: 30.0
          cpu_ok: true
          memory_ok: true
          ok: true
          pods_on_largest_node: 41
          prod_pods_on_largest_node: 27
          cannot_fit_elsewhere: []
          cannot_fit_prod: []
          karpenter: true
          note: "n"
      - expect: "pass"
        item:
          available: false

- id: resilience.restarts-crashloop
  name: Container restarts frequently (CrashLoopBackOff or accumulated restarts)
  area: resilience
  type: summary
  each: resilience.restarts.rows
  rule:
    expr: "not item['rebooted'] and (item['crashloop'] or (item['restarts'] >= 50 and item['prod']))"
    warn_expr: "not item['rebooted'] and item['restarts'] >= 10 and (not item.get('last_finished') or (days_until(item['last_finished']) or 0) >= -30)"  # if the last termination was more than 30 days ago (old accumulated restarts), drop it from findings
  target: "item['namespace'] + '/' + item['pod'] + ':' + item['container']"
  evidence: "f\"{item['restarts']} restarts, state {item['waiting'] or 'Running'}, last termination {item['last_reason']} (exit {item['exit_code']}) {item['last_finished']}, cause class {item['cause']}, Unhealthy events {item['unhealthy_events']}, node reboot time {item['node_rebooted_at']}\""
  severity_default: high
  symptom_linked: true
  why: >
    A restart has one of three causes: OOMKilled (memory limit), probe failure (liveness killed it — Unhealthy events accompany it), or a crash (exit code 1, 2, 255 etc.; the app itself). The action differs by cause (raise the limit / fix the probe / read logs).
    CrashLoopBackOff means it cannot start right now, so fail. The accumulated restart count resets to 0 when the pod is recreated, so it refers to the current pod (7-day trend is in metrics/restarts_7d.json).
  suggest: "By cause class: OOM → raise the limit together with resources.memory-limit-near-p95; probe → liveness-dependency-path / exec-probe; crash → `kubectl logs --previous`."
  verify:
    - "kubectl get pods -A --sort-by=.status.containerStatuses[0].restartCount | tail"
    - "kubectl logs -n <ns> <pod> --previous"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "pass"
        item:
          namespace: "ci-runners"
          pod: "runner-controller-6f8b4c9f8-abcde"
          container: "manager"
          restarts: 58
          waiting: null
          last_reason: "Unknown"
          exit_code: 255
          last_finished: "2026-10-25T04:23:35Z"
          unhealthy_events: 0
          unhealthy_by_probe: {}
          cause: "node reboot (container Unknown/255 — not a crash)"
          prod: false
          crashloop: false
          rebooted: true
          node_rebooted_at: "2026-10-25T04:21:18+00:00"
      - expect: "fail"
        item:
          namespace: "prod-a"
          pod: "web-6d7ff4dcdb-abcde"
          container: "app"
          restarts: 60
          waiting: "CrashLoopBackOff"
          last_reason: "Error"
          exit_code: 255
          last_finished: "x"
          unhealthy_events: 0
          cause: "crash (exit 255)"
          prod: true
          crashloop: true
          rebooted: false
          node_rebooted_at: null
      - expect: "fail"
        item:
          namespace: "prod-a"
          pod: "web-6d7ff4dcdb-abcde"
          container: "app"
          restarts: 60
          waiting: null
          last_reason: "Error"
          exit_code: 255
          last_finished: "x"
          unhealthy_events: 0
          cause: "crash (exit 255)"
          prod: true
