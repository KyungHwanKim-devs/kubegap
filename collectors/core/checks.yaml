  target: "item['node']"
  evidence: "f\"Node {item['node']} (pool {item['pool']}, {item['capacity_type']}) holds prod pods {item['prod_pods']}/{item['prod_total']} ({item['share']}), {item['workload_count']} workloads: {item['prod_workloads'][:10]}. Nodes {item['nodes_total']}, autoscaler {item['autoscaler']}\""
