- id: node.clock-unsynced-os
  name: Node clock not synchronized (timedatectl)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['time'].get('synchronized') is False"
  target: "item['node']"
  evidence: "f\"timedatectl synchronized={item['time'].get('synchronized')}, NTP {item['time'].get('ntp')}, chrony {item['time'].get('chrony')}\""
  severity_default: high
  symptom_linked: false
  why: A wrong clock breaks TLS certificate validation, token expiry, log ordering and etcd leader election. This asks the same question as node.ntp-unsynced (metric) directly at the OS.
  suggest: Enable chrony or systemd-timesyncd and verify the NTP servers are reachable.
  verify:
    - "timedatectl status; chronyc tracking"
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-1"
          roles:
            - "worker"
          collected: true
          meta:
            root: true
            kernel: "5.15.0-100"
            os: "Ubuntu 22.04"
            uptime_days: 30.0
            loadavg: "0.5"
