- id: node.conntrack-table-full
  name: conntrack table full (packets dropped)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('conntrack_full', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) 'nf_conntrack: table full, dropping packet' {item['kernel']['counts'].get('conntrack_full')} times. Current {item['sysctl']['values'].get('net.netfilter.nf_conntrack_count')}/{item['sysctl']['values'].get('net.netfilter.nf_conntrack_max')}\""
  severity_default: high
  symptom_linked: true
  why: When conntrack is full the kernel silently discards packets of new connections. Users see intermittent timeouts and nothing is logged anywhere. node.conntrack-usage (metric) measures usage; this check looks at the actual drop records.
  suggest: "Raise nf_conntrack_max (kube-proxy `--conntrack-max-per-core`) and find the pods that open many connections (DNS storms, clients without keep-alive)."
