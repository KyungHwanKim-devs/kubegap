- id: scaling.hpa-flapping
  name: HPA desired replicas changed often over 7 days (flapping)
  area: scaling
  type: metric
  inputs: [hpa_desired_changes_7d]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 56, lab: 56 }  # 8 per day (a day/night cycle of 2 per day = 14 per week is normal)
    warn_threshold: { prod: 28, lab: 28 }
  target: "labels['namespace'] + '/hpa/' + labels['horizontalpodautoscaler']"
  evidence: "f\"{value:.0f} desired changes over 7 days\""
  severity_default: medium
  symptom_linked: true
  why: >
    If desired goes up and down several times a day, pods start and die repeatedly. Each cycle brings a cold start (connection pools, caches) and rolling disruption.
    The default behavior has a 5-minute stabilization on scaleDown only; scaleUp is immediate. If the target utilization is too close to the actual average, it oscillates around the boundary.
  suggest: "behavior.scaleDown.stabilizationWindowSeconds 300-600, limit per-minute growth with scaleUp.policies, move the target utilization away from the average (e.g. 50 → 70). has_behavior in summary.scaling.hpa.rows shows whether behavior is set."
  verify:
    - "changes(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"<ns>\"}[7d])"
    - "kubectl get hpa -n <ns> <name> -o jsonpath='{.spec.behavior}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          hpa_desired_changes_7d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 60
      - expect: "warn"
        metric:
          hpa_desired_changes_7d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 30
      - expect: "pass"
        metric:
          hpa_desired_changes_7d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 3
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          hpa_desired_changes_7d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 56

- id: scaling.hpa-min-eq-max
  name: HPA min equals max (the HPA does nothing)
  area: scaling
  type: summary
  each: scaling.hpa.rows
  rule:
    expr: "item['min_eq_max'] and not item['keda_owned']"
    warn_expr: "item['min_eq_max'] and not item['keda_owned']"  # HPAs created by KEDA are covered by the ScaledObject checks (keda.*)
  target: "item['target']"
  evidence: "f\"HPA {item['namespace']}/{item['name']}: min {item['min']} = max {item['max']}\""
  severity_default: low
  symptom_linked: false
  why: With min equal to max the HPA cannot change replicas. Either a configuration slip (pinned temporarily and forgotten) or a workload that does not need an HPA. One created by KEDA with min 1 max 1 is an inactive scaler, so warn.
