- id: tenancy.quota-without-limitrange
  name: requests quota exists without LimitRange defaults (pods without requests are rejected)
  area: tenancy
  type: summary
  each: tenancy.quotas.rows
  rule:
    expr: "item['requires_requests'] and not item['limitrange_default_request'] and item['containers_without_requests'] > 0"
    warn_expr: "item['requires_requests'] and not item['limitrange_default_request']"
  target: "item['target']"
  evidence: "f\"{item['target']}: requests entries in hard {[k for k in item['hard'] if 'requests' in k or k in ('cpu', 'memory')]}, LimitRange {item['has_limitrange']} (default request {item['limitrange_default_request']}), containers without requests right now {item['containers_without_requests']}\""
  severity_default: high
  symptom_linked: true
  why: >
    In a namespace with requests.cpu / requests.memory quotas, a pod without requests is rejected by the API server with "must specify requests.cpu" (by design of ResourceQuota). A LimitRange defaultRequest closes that hole.
    Even if every container has requests today, the moment will come when the next Job, sidecar or Helm chart default is rejected.
  suggest: "Add a LimitRange in the same namespace (type Container, defaultRequest cpu 50m / memory 64Mi, default limit memory 256Mi)."
