- id: tenancy.ci-shares-prod-nodes
  name: CI runner pods run on the same nodes as production pods
  area: tenancy
  type: summary
  each: tenancy.isolation.nodes
  rule:
    expr: "item['shares_ci_prod'] and item['ci_heavy'] and item['separation_possible']"
    warn_expr: "item['shares_ci_prod']"
  target: "item['node']"
  evidence: "f\"Node {item['node']} (pool {item['pool']}): prod pods {item['prod_pods']} ({item['prod_namespaces']}) together with CI pods {item['ci_pods']} ({[c['pod'] for c in item['ci_pod_list']][:5]}). Heavy runners {item['ci_heavy']}, minutes above 90% node CPU in 7d {item['cpu_saturated_minutes_7d']}, memory limit total/allocatable {item['memory_limit_overcommit']}\""
  severity_default: high
  symptom_linked: true
  why: >
    CI runners use every core during a build and hammer disk and network (a tenant with large bursts). On the same node as production, production p99 spikes at build time, and under memory pressure BestEffort/Burstable production pods get evicted.
    The fix is a dedicated NodePool with a taint plus nodeSelector/toleration in the runner template. A small k3s cluster with fewer than 3 nodes and no Karpenter cannot separate at all, so it is a warning only.
    Measured on a real EKS cluster: ARC runners were separated onto a build pool (taint workload-type=build) and absent from production nodes — this check passed.
  suggest: "Taint (workload-type=build:NoSchedule) and label the runner pool, and add nodeSelector + toleration to the AutoscalingRunnerSet template. On a small k3s cluster, set explicit runner requests to avoid BestEffort."
  verify:
    - "kubectl get pods -A -o wide --field-selector status.phase=Running | grep -E 'runner|prod-'"
