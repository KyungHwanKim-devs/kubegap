- id: tenancy.quota-near-limit
  name: ResourceQuota usage is near its limit (the next deploy or PVC will be rejected)
  area: tenancy
  type: summary
  each: tenancy.quotas.rows
  rule:
    expr: "item['max_ratio'] >= 0.9"
    warn_expr: "item['max_ratio'] >= 0.8"
  target: "item['target']"
  evidence: "f\"{item['target']}: near limit {item['near_limit']} (max ratio {item['max_ratio']}). hard {item['hard']}, used {item['used']}\""
  severity_default: high
  symptom_linked: true
  why: >
    A quota rejects silently the moment it is exceeded — new pods only leave a ReplicaSet FailedCreate "exceeded quota" event, and a rolling update stalls because it cannot create the new replica. When the PVC count quota is full, StatefulSet scale-out goes Pending.
    Measured on a k3s k3s: a production namespace at persistentvolumeclaims 2/2.
  suggest: "Raise the quota (2x actual p95) or clean up the resource at its limit. Add an alert at 80% quota usage (kube_resourcequota{type=\"used\"} / kube_resourcequota{type=\"hard\"})."
  verify:
    - "kubectl describe quota -n <ns> <name> ; kubectl get events -n <ns> --field-selector reason=FailedCreate"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "prod-a-quota"
          target: "prod-a/prod-a-quota"
          hard:
            limits.cpu: "4"
            limits.memory: "8Gi"
            persistentvolumeclaims: "2"
            requests.cpu: "2"
            requests.memory: "4Gi"
            requests.storage: "30Gi"
          used:
            limits.cpu: "1800m"
            limits.memory: "2Gi"
            persistentvolumeclaims: "2"
            requests.cpu: "200m"
            requests.memory: "512Mi"
            requests.storage: "20Gi"
          ratios:
            limits.cpu: 0.45
            limits.memory: 0.25
            persistentvolumeclaims: 1.0
            requests.cpu: 0.1
            requests.memory: 0.125
            requests.storage: 0.667
          max_ratio: 1.0
          near_limit:
            - "persistentvolumeclaims"
          requires_requests: true
          requires_limits: true
          scopes: []
          prod: true
          kind: "prod"
          limitrange_default_request: false
          has_limitrange: false
          containers_without_requests: 0
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "prod-a-quota"
          target: "prod-a/prod-a-quota"
          hard:
            limits.cpu: "4"
            limits.memory: "8Gi"
            persistentvolumeclaims: "2"
            requests.cpu: "2"
            requests.memory: "4Gi"
            requests.storage: "30Gi"
          used:
            limits.cpu: "1800m"
            limits.memory: "2Gi"
            persistentvolumeclaims: "2"
            requests.cpu: "200m"
            requests.memory: "512Mi"
            requests.storage: "20Gi"
          ratios:
            limits.cpu: 0.45
            limits.memory: 0.25
            persistentvolumeclaims: 1.0
            requests.cpu: 0.1
            requests.memory: 0.125
            requests.storage: 0.667
          max_ratio: 0.85
          near_limit:
            - "requests.memory"
          requires_requests: true
          requires_limits: true
          scopes: []
          prod: true
          kind: "prod"
          limitrange_default_request: false
          has_limitrange: false
          containers_without_requests: 0
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "prod-a-quota"
          target: "prod-a/prod-a-quota"
          hard:
            limits.cpu: "4"
