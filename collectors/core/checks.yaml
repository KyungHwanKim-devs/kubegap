- id: storage.legacy-intree-storageclass
  name: Legacy in-tree provisioner StorageClass remains
  area: storage
  type: inventory
  each: storage_classes
  rule:
    expr: "str(item.get('provisioner') or '').startswith('kubernetes.io/')"
  target: "item['name']"
  evidence: "f\"provisioner {item.get('provisioner')}, default {item.get('default')}, parameters {item.get('parameters')}\""
  severity_default: low
  symptom_linked: false
  why: >
    In-tree provisioners such as kubernetes.io/aws-ebs were removed by the CSI migration from 1.27. PVs created from this StorageClass still work, translated to CSI,
    but a new PVC bound here is created as gp2 (IOPS tied to size, expensive) with limited volume expansion and snapshot features. Measured on a real EKS cluster: gp2 remained while the default was gp3.
  suggest: Delete the StorageClass if no PVC uses it; otherwise plan a migration to gp3 (ebs.csi.aws.com). Confirm that the default StorageClass is gp3.
  verify:
    - "kubectl get sc ; kubectl get pvc -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SC:.spec.storageClassName | grep gp2"
  profiles: [prod]
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        inventory:
          storage_classes:
            - name: "gp2"
              provisioner: "kubernetes.io/aws-ebs"
              default: false
              parameters:
                type: "gp2"
              expansion: false
      - expect: "pass"
        inventory:
          storage_classes:
            - name: "gp3"
              provisioner: "ebs.csi.aws.com"
              default: true
              parameters: {}
              expansion: true

- id: storage.no-volume-expansion
  name: StorageClass with volume expansion disabled
  area: storage
  type: inventory
  each: storage_classes
  rule:
    expr: "not item.get('expansion') and str(item.get('provisioner') or '').endswith(('ebs.csi.aws.com', 'disk.csi.azure.com', 'pd.csi.storage.gke.io', 'longhorn', 'driver.longhorn.io'))"
  target: "item['name']"
  evidence: "f\"allowVolumeExpansion {item.get('expansion')}, provisioner {item.get('provisioner')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    With allowVolumeExpansion false, a PVC cannot be grown when it fills up. A StatefulSet with a full disk (DB, Prometheus, Loki) has no option other than moving to a new volume, and the service stops meanwhile.
    EBS, Azure Disk, GCE PD and Longhorn support expansion, so there is no reason to leave it off. local-path has no expansion concept and is not a target.
  suggest: "Set allowVolumeExpansion: true on the StorageClass (applies to existing PVs too; it is not an immutable field)."
  verify:
    - "kubectl get sc -o custom-columns=NAME:.metadata.name,PROV:.provisioner,EXPAND:.allowVolumeExpansion"
  profiles: [prod, lab]

# ---------- Observability: retention ----------
  test:
    cases:
      - expect: "fail"
        inventory:
          storage_classes:
            - name: "gp3"
              provisioner: "ebs.csi.aws.com"
              default: true
              parameters: {}
              expansion: false
      - expect: "pass"
        inventory:
          storage_classes:
            - name: "gp3"
              provisioner: "ebs.csi.aws.com"
              default: true
              parameters: {}
              expansion: true
      - expect: "pass"
        inventory:
          storage_classes:
            - name: "local-path"
              provisioner: "rancher.io/local-path"
              default: true
              parameters: {}
              expansion: false

- id: observability.loki-retention-unbounded
  name: Loki retention disabled (unlimited)
  area: observability
  type: inventory
  cluster_level: true
  rule:
    expr: "bool((inv.get('stores') or {}).get('loki', {}).get('ok')) and str(((inv.get('stores') or {}).get('loki', {}).get('retention') or {}).get('enabled', 'true')).lower() == 'false'"
  evidence: "f\"Loki {inv['stores']['loki'].get('version')}, retention_period {inv['stores']['loki'].get('retention', {}).get('time')}, retention_enabled {inv['stores']['loki'].get('retention', {}).get('enabled')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    With retention_enabled false, nothing is deleted even if retention_period (31d) is set. When a single-pod Loki fills its disk, ingestion is refused and logs are lost wholesale.
    Measured on a real EKS cluster: configured 31d but enabled false, effectively unlimited.
  suggest: "Enable limits_config.retention_period and compactor.retention_enabled: true together. Review with the PVC usage check."
  verify:
    - "retention_enabled and retention_period in Loki /config (read by kubegap setup)"
  profiles: [prod, lab]

# ---------- Security ----------
  test:
    cases:
      - expect: "fail"
        inventory:
          stores:
            loki:
              ok: true
              version: "2.6.1"
              retention:
                time: "31d"
                enabled: "false"
      - expect: "pass"
        inventory:
          stores:
            loki:
              ok: true
              version: "2.6.1"
              retention:
                time: "31d"
                enabled: "true"
      - expect: "pass"
        inventory:
          stores: {}

- id: security.networkpolicy-coverage
  name: Namespaces without a NetworkPolicy
  area: security
  type: object
  inputs: [objects/networkpolicies.networking.k8s.io.json, objects/namespaces.json]
  cluster_level: true
  rule:
    expr: "len(netpol_coverage()['without_prod']) > 0"
    warn_expr: "len(netpol_coverage()['without']) > netpol_coverage()['total_user_ns'] // 2"
  evidence: "f\"{len(netpol_coverage()['without'])} of {netpol_coverage()['total_user_ns']} user namespaces have no NetworkPolicy, of which production {netpol_coverage()['without_prod']}; with: {netpol_coverage()['with']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Without NetworkPolicy every pod talks to every pod. A breach in one tenant (client namespace) goes straight to another tenant's DB.
    The minimal pattern is a per-namespace default-deny ingress plus the needed allows. The CNI is what actually enforces policy. EKS VPC CNI enforces only with ENABLE_NETWORK_POLICY=true (the vpc-cni collector checks this); k3s uses flannel as CNI but embeds the kube-router network policy controller and enforces by default (unless disabled with `--disable-network-policy`). Plain flannel (non-k3s) does not support it, so Cilium or Calico is needed.
  suggest: Start with production namespaces, a default-deny ingress policy plus allows for the same namespace and the ingress controller. Before applying, confirm that the CNI actually enforces policy.
  verify:
    - "kubectl get networkpolicy -A ; kubectl -n kube-system get ds aws-node -o jsonpath='{.spec.template.spec.containers[0].env}' | grep -o 'ENABLE_NETWORK_POLICY[^}]*'"
  profiles: [prod, lab]

# ---------- Events ----------
  test:
    cases:
      - expect: "fail"
        objects:
          namespaces:
            - metadata:
                name: "prod-a"
            - metadata:
                name: "dev-a"
            - metadata:
                name: "kube-system"
          networkpolicies.networking.k8s.io: []
      - expect: "warn"
        objects:
          namespaces:
            - metadata:
                name: "prod-a"
            - metadata:
                name: "dev-a"
            - metadata:
                name: "dev-b"
          networkpolicies.networking.k8s.io:
            - metadata:
                namespace: "prod-a"
                name: "default-deny"
              spec:
                podSelector: {}
      - expect: "pass"
        objects:
          namespaces:
            - metadata:
                name: "prod-a"
            - metadata:
                name: "dev-a"
          networkpolicies.networking.k8s.io:
            - metadata:
                namespace: "prod-a"
                name: "default-deny"
              spec:
                podSelector: {}
            - metadata:
                namespace: "dev-a"
                name: "default-deny"
              spec:
                podSelector: {}

- id: events.tracked-warning-reasons
  name: Tracked Warning events occurred
  area: resilience
  type: summary
  each: events.history.tracked_hits
  rule:
    expr: "item['type'] == 'Warning' and item['severity_hint'] in ('critical', 'high') and item['occurrences'] >= 3 and item.get('trend') != 'quiet'"
    warn_expr: "item['type'] == 'Warning' and item['occurrences'] >= 1 and item.get('trend') != 'quiet'"  # an event that stopped growing across recent snapshots (quiet) is history and does not even warn
  target: "item['reason']"
  evidence: "f\"{item['meaning']}. {item['occurrences']} occurrences total ({item['events']} events, trend over {len(item['per_snapshot'])} snapshots {item['per_snapshot']}, {item['trend']}), first {item['first']} last {item['last']}. Top objects: {[o['object'] for o in item['objects_top'][:3]]}\""
  severity_default: high
  symptom_linked: true
  why: >
    Events last only an hour and are not in Grafana. Reasons such as FailedScheduling, BackOff, Evicted, OOMKilling and FailedCreatePodSandBox are the first signals of blocked scaling, crash loops, node pressure,
    kernel OOM and VPC CNI IP exhaustion. The trend collected per snapshot lets you see "40 FailedScheduling last week". Severity starts from the per-Reason default (severity_hint) and the LLM adjusts it to the object and trend.
  suggest: Open the details of the target resource per Reason. Combine recurring ones with the cause checks (disk, memory, IPs, probes) into one problem. If there is no event retention tool, report together with that absence.
  verify:
    - "kubectl get events -A --field-selector reason=<Reason> --sort-by=.lastTimestamp"
    - "snapshots/<context>/events-history.json"
  notes: lib/events.py TRACKED
  profiles: [prod, lab]

# ---------- Operators in general ----------
  test:
    cases:
      - expect: "fail"
        item:
          reason: "FailedScheduling"
          type: "Warning"
          severity_hint: "high"
          meaning: "m"
          occurrences: 36
          events: 15
          per_snapshot:
            - 0
            - 36
          trend: "new"
          first: "x"
          last: "y"
          objects_top:
            - object: "Pod/prod-a/web"
              occurrences: 36
      - expect: "warn"
        item:
          reason: "Unhealthy"
          type: "Warning"
          severity_hint: "medium"
          meaning: "m"
          occurrences: 2
          events: 1
          per_snapshot:
            - 2
          trend: "flat"
          first: "x"
          last: "y"
          objects_top: []
      - expect: "pass"
        item:
          reason: "Killing"
          type: "Normal"
          severity_hint: "info"
          meaning: "m"
          occurrences: 50
          events: 10
          per_snapshot:
            - 50
          trend: "flat"
          first: "x"
          last: "y"
          objects_top: []

- id: operators.unhealthy-condition
  name: Unhealthy object status.conditions
  area: hygiene
  type: summary
  each: conditions.unhealthy
  rule:
    expr: "(item.get('age_hours') or 0) >= 1"
    warn_expr: "True"
  target: "item['kind'].split('.')[0] + '/' + (item['namespace'] + '/' if item['namespace'] else '') + item['name']"
  evidence: "f\"{item['condition']}={item['status']} ({item.get('reason')}) for {item.get('age_hours')} hours: {item.get('message')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Operators (cert-manager, External Secrets, Argo CD, Karpenter, KEDA, Prometheus Operator) write their state into status.conditions.
    Ready=False, Synced=False or Degraded=True lasting over an hour means the resource's declared and actual state have diverged. Components without a dedicated collector get baseline coverage from this generic scan.
    Under one minute it may still be reconciling, so that is only warn.
  suggest: "kubectl describe <kind> -n <ns> <name> for the full message and events, then open the operator's log. If several objects of the same kind are affected, look at the operator itself first (pod restarts, webhook)."
  verify:
    - "kubectl get <kind> -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:'.status.conditions[?(@.type==\"Ready\")].status'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          kind: "externalsecrets.external-secrets.io"
          namespace: "prod-a"
          name: "db"
          condition: "Ready"
          status: "False"
          reason: "SecretSyncedError"
          message: "x"
          age_hours: 300.0
      - expect: "warn"
        item:
          kind: "applications.argoproj.io"
          namespace: "argocd"
          name: "a"
          condition: "Synced"
          status: "False"
          reason: "r"
          message: "m"
          age_hours: 0.2
      - expect: "none"

- id: operators.webhook-no-endpoints
  name: Admission webhook service without ready endpoints
  area: hygiene
  type: summary
  each: webhooks.no_endpoints
  rule:
    expr: "item['failure_policy'] == 'Fail'"
    warn_expr: "True"
  target: "item['config'] + ':' + item['webhook']"
  evidence: "f\"{item['kind']} webhook, failurePolicy {item['failure_policy']}, service {item['service']} has 0 ready endpoints, targets {item['resources']}\""
  severity_default: critical
  symptom_linked: true
  why: >
    An admission webhook is a single point of failure. When the service behind a failurePolicy=Fail webhook dies, every create and update request it matches is rejected.
    Pods do not start and deployments stall, and because the cause is "webhook call failed" it is hard to find from the app side (Jetstack 2020 and Skyscanner 2021 incidents).
  suggest: Recover the webhook pods and consider switching failurePolicy to Ignore until they are back. Give the webhook pods a PDB and 2 replicas.
  verify:
    - "kubectl get endpoints -n <ns> <service> ; kubectl get validatingwebhookconfiguration,mutatingwebhookconfiguration -o yaml | grep -B2 -A2 failurePolicy"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          config: "kyverno"
          webhook: "validate"
          kind: "Validating"
          failure_policy: "Fail"
          service: "kyverno/svc"
          resources:
            - "pods"
      - expect: "warn"
        item:
          config: "x"
          webhook: "y"
          kind: "Mutating"
          failure_policy: "Ignore"
          service: "a/b"
          resources:
            - "pods"
      - expect: "none"

- id: operators.webhook-self-lock
  name: failurePolicy=Fail webhook that also targets its own namespace (self-lockout risk)
  area: hygiene
  type: summary
  each: webhooks.self_lock_risk
  rule:
    expr: "True"
  target: "item['config'] + ':' + item['webhook']"
  evidence: "f\"{item['kind']}, failurePolicy Fail, targets {item['resources']}, namespaceSelector {item['namespace_selector']} does not exclude its own namespace {item['service'].split('/')[0]}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If a webhook also matches pod creation in its own namespace and its failurePolicy is Fail, then once all webhook pods are gone it cannot recreate itself (self-lockout). This is the pattern where a cluster stalls forever after node replacement or an upgrade.
  suggest: "Exclude its own namespace in namespaceSelector (kubernetes.io/metadata.name NotIn [<ns>]), or use a separate webhook with Ignore policy for its own namespace."
  verify:
    - "kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration -o yaml | grep -A8 namespaceSelector"
  notes: Jetstack 2020
  profiles: [prod, lab]

# ---------- Control plane ----------
  test:
    cases:
      - expect: "fail"
        item:
          config: "kyverno"
          webhook: "validate"
          kind: "Validating"
          failure_policy: "Fail"
          service: "kyverno/svc"
          resources:
            - "deployments"
          namespace_selector: null
      - expect: "none"

- id: controlplane.scheduler-unschedulable
  name: Workloads with pods that could not be scheduled in the last 24 hours
  area: scaling
  type: summary
  each: controlplane.scheduler.by_workload
  rule:
    expr: "prod and item['count'] >= 5"
    warn_expr: "True"
  target: "item['workload']"
  evidence: "f\"24h 'Unable to schedule pod; no fit' {item['count']} times (control plane log). Top reason from summary.controlplane.scheduler.reasons: {(((summary.get('controlplane') or {}).get('scheduler') or {}).get('reasons') or [{}])[0].get('reason', '?')[:140]}\""
  severity_default: high
  symptom_linked: true
  why: >
    The scheduler found no node to place the pod (insufficient resources, taints, affinity, PVC node pinning). FailedScheduling events vanish after an hour, but the control plane log keeps them.
    On EKS this is either the delay until Karpenter launches a node, or a NodePool constraint or limit.
  suggest: Read the reason (err=...) and lower the request, widen the NodePool allowed types or limits, or relax affinity. If it recurs, check whether the workload's request is larger than the node size.
  verify:
    - "logs/cloudwatch/scheduler_unschedulable_samples.json or logs/node/<server>/k3s-scheduler-unschedulable-24h.log"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          count: 29
      - expect: "warn"
        item:
          workload: "dev-a/web"
          namespace: "dev-a"
          count: 29
      - expect: "warn"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          count: 2
      - expect: "none"

- id: controlplane.apiserver-429
  name: apiserver returning 429 (Too Many Requests)
  area: platform
  type: metric
  inputs: [apiserver_429_rate]
  rule:
    expr: "value >= 1"
    warn_expr: "value > 0"
  target: "'cluster'"
  evidence: "f\"429s per second {value:.3f} (apiserver_request_total)\""
  severity_default: medium
  symptom_linked: false
  why: The apiserver is rejecting requests under Priority and Fairness (APF) limits. See which client is flooding (top_clients) and lower its QPS or adjust the FlowSchema. Symptoms are a slow kubectl and controllers falling behind.
  suggest: Look at the top (resource, verb) pairs in summary.controlplane.apiserver_metrics.top_requests and lower the QPS of the controller or CI hammering that resource. Identifying the sender needs the audit log. For your own controllers, use informer caches.
  verify:
    - "sum(rate(apiserver_request_total{code=\"429\"}[5m])) ; topk(10, sum by (resource, verb) (rate(apiserver_request_total[5m])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_429_rate:
            - labels: {}
              value: 2.0
      - expect: "warn"
        metric:
          apiserver_429_rate:
            - labels: {}
              value: 0.5
      - expect: "pass"
        metric:
          apiserver_429_rate:
            - labels: {}
              value: 0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_429_rate:
            - labels: {}
              value: 1

- id: controlplane.apiserver-5xx
  name: apiserver returning 5xx responses
  area: platform
  type: metric
  inputs: [apiserver_5xx_rate]
  rule:
    expr: "value >= 0.1"
    warn_expr: "value > 0"
  target: "'cluster'"
  evidence: "f\"5xx per second {value:.3f} (code {labels.get('code')})\""
  severity_default: high
  symptom_linked: true
  why: Errors from the apiserver itself. etcd latency, webhook timeouts (shown as 500 Internal Error) or overload. Every controller and kubectl is affected.
  suggest: Correlate with webhook failure logs and etcd errors at the same time. EKS is managed, so some parts cannot be fixed; check AWS Support and Insights.
  verify:
    - "sum by (code) (rate(apiserver_request_total{code=~\"5..\"}[5m]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_5xx_rate:
            - labels:
                code: "500"
              value: 0.5
      - expect: "warn"
        metric:
          apiserver_5xx_rate:
            - labels:
                code: "503"
              value: 0.05
      - expect: "pass"
        metric:
          apiserver_5xx_rate:
            - labels:
                code: "500"
              value: 0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_5xx_rate:
            - labels:
                code: "500"
              value: 0.1

- id: controlplane.apiserver-latency
  name: High apiserver request p99 latency
  area: platform
  type: metric
  inputs: [apiserver_p99_latency_by_verb]
  rule:
    expr: "value == value and value >= threshold"
    warn_expr: "value == value and value >= warn_threshold"
    threshold: { prod: 1.0, lab: 1.0 }
    warn_threshold: { prod: 0.5, lab: 0.5 }
  target: "labels.get('verb', '?')"
  evidence: "f\"{labels.get('verb')} p99 {value:.3f}s\""
  severity_default: medium
  symptom_linked: false
  why: A per-verb p99 above one second makes kubectl and controllers visibly slow. A slow LIST means large resources have piled up (completed Jobs, events); if everything is slow, it is etcd.
  suggest: Clean up the resources piled up in storage_objects_top (ttlSecondsAfterFinished). Read the op in the Trace logs.
  verify:
    - "histogram_quantile(0.99, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket{verb!~\"WATCH|CONNECT\"}[5m])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_p99_latency_by_verb:
            - labels:
                verb: "LIST"
              value: 2.0
      - expect: "warn"
        metric:
          apiserver_p99_latency_by_verb:
            - labels:
                verb: "LIST"
              value: 0.7
      - expect: "pass"
        metric:
          apiserver_p99_latency_by_verb:
            - labels:
                verb: "GET"
              value: 0.1
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_p99_latency_by_verb:
            - labels:
                verb: "LIST"
              value: 1

- id: controlplane.webhook-latency
  name: High admission webhook p99 latency
  area: platform
  type: metric
  inputs: [apiserver_webhook_p99_by_name]
  rule:
    expr: "value == value and value >= 1.0"
    warn_expr: "value == value and value >= 0.3"
  target: "labels.get('name', '?')"
  evidence: "f\"webhook {labels.get('name')} p99 {value:.3f}s\""
  severity_default: medium
  symptom_linked: false
  why: A slow webhook slows every create and update request by that much. Near the timeout (default 10s), a failurePolicy=Fail webhook starts rejecting requests.
  suggest: Check the resources and replicas of that webhook's pods, and review timeoutSeconds and failurePolicy.
  verify:
    - "histogram_quantile(0.99, sum by (le, name) (rate(apiserver_admission_webhook_admission_duration_seconds_bucket[5m])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          apiserver_webhook_p99_by_name:
            - labels:
                name: "kyverno"
              value: 2.0
      - expect: "warn"
        metric:
          apiserver_webhook_p99_by_name:
            - labels:
                name: "kyverno"
              value: 0.5
      - expect: "pass"
        metric:
          apiserver_webhook_p99_by_name:
            - labels:
                name: "kyverno"
              value: 0.1
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          apiserver_webhook_p99_by_name:
            - labels:
                name: "kyverno"
              value: 1

- id: controlplane.webhook-call-failures
  name: apiserver logs of failed webhook calls
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: controlplane.apiserver.webhook_failures
  rule:
    expr: "item['count'] >= 1"
  target: "item['webhook'] or 'unknown'"
  evidence: "f\"24h 'failed calling webhook' {item['count']} times (CloudWatch kube-apiserver stream)\""
  severity_default: high
  symptom_linked: true
  why: The webhook service is dead or timing out. With failurePolicy=Fail every create and update of that resource is rejected and deployments stall (Jetstack 2020, Skyscanner 2021).
  suggest: Check the webhook pods and endpoints (operators.webhook-no-endpoints). Consider an Ignore policy until recovery.
  verify:
    - "logs/cloudwatch/apiserver_webhook_failures.json"
  profiles: [prod]
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        item:
          webhook: "kyverno.svc"
          count: 5
      - expect: "pass"
        item:
          webhook: "x"
          count: 0

- id: controlplane.controller-error-repeat
  name: controller-manager repeating the same error
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: controlplane.controller_manager.errors_by_source
  rule:
    expr: "item['level'] == 'E' and item['count'] >= 100"
    warn_expr: "item['count'] >= 1000 or (item['level'] == 'E' and item['count'] >= 5)"
  target: "item['source']"
  evidence: "f\"24h {item['level']} lines {item['count']} times ({item['source']}). Samples: summary.controlplane.controller_manager.top_errors\""
  severity_default: medium
  symptom_linked: false
  why: >
    A controller fails to reconcile and keeps requeuing (for example disruption.go = PDB sync failure, usually a selector matching no pods or overlapping PDBs).
    Tens of thousands of W-level lines are usually client compatibility warnings (watchlist feature gate): noise, but they cost log volume.
  suggest: Identify the resource from the top_errors messages and fix it. Reduce noise warnings by aligning component versions.
  verify:
    - "logs/cloudwatch/controller_manager_error_samples.json"
  profiles: [prod]
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        item:
          source: "disruption.go"
          level: "E"
          count: 150
      - expect: "warn"
        item:
          source: "type.go"
          level: "W"
          count: 5000
      - expect: "warn"
        item:
          source: "x.go"
          level: "E"
          count: 7
      - expect: "pass"
        item:
          source: "x.go"
          level: "W"
          count: 10

- id: controlplane.apiserver-slow-traces
  name: Many slow-request Traces in the apiserver
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: controlplane.apiserver
  cluster_level: true
  rule:
    expr: "item.get('slow_traces_total', 0) >= 1000"
    warn_expr: "item.get('slow_traces_total', 0) >= 100"
  target: "'cluster'"
  evidence: "f\"24h Traces (requests over 500ms) {item.get('slow_traces_total')}: {item.get('slow_traces')}\""
  severity_default: low
  symptom_linked: false
  why: The apiserver writes a Trace with per-step timings for requests over 500ms. Mostly List means large LISTs (clients without a cache, piled-up resources); 'Call conversion webhook' means a slow CRD conversion webhook.
  suggest: For List, have clients use informers and clean up resources; for conversion webhooks, check the version of that CRD's operator.
  verify:
    - "logs/cloudwatch/apiserver_slow_traces.json"
  profiles: [prod]
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        item:
          slow_traces_total: 1500
          slow_traces:
            List: 1400
      - expect: "warn"
        item:
          slow_traces_total: 148
          slow_traces:
            List: 140
      - expect: "pass"
        item:
          slow_traces_total: 3
          slow_traces: {}

- id: controlplane.authenticator-failures
  name: aws-iam-authenticator authentication failures
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: controlplane.authenticator
  cluster_level: true
  rule:
    expr: "item.get('failures_total', 0) >= 100"
    warn_expr: "item.get('failures_total', 0) >= 1"
  target: "'cluster'"
  evidence: "f\"24h authentication failures {item.get('failures_total')}: {item.get('failures')[:5]}\""
  severity_default: medium
  symptom_linked: false
  why: Expired tokens or wrong IAM mappings mean CI or a person is locked out; many unknown sources mean attempts arriving through the public endpoint (eks.public-endpoint-open).
  suggest: Check the source (ARN) per message and fix the mapping or close the endpoint.
  verify:
    - "logs/cloudwatch/authenticator_failures.json"
  profiles: [prod]
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        item:
          failures_total: 150
          failures:
            - "x"
      - expect: "warn"
        item:
          failures_total: 2
          failures:
            - "x"
      - expect: "pass"
        item:
          failures_total: 0
          failures: []

- id: controlplane.etcd-slow
  name: etcd slow request warnings (k3s embedded etcd)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: controlplane.etcd
  cluster_level: true
  rule:
    expr: "item.get('apply_took_too_long', 0) >= 100 or item.get('max_ms', 0) >= 1000"
    warn_expr: "item.get('apply_took_too_long', 0) >= 10 or item.get('request_stats_slow', 0) >= 10"
  target: "'cluster'"
  evidence: "f\"24h 'apply request took too long' {item.get('apply_took_too_long')} times, slow request stats {item.get('request_stats_slow')}, ReadIndex delays {item.get('readindex_slow')}, leader changes {item.get('leader_changed')}, max {item.get('max_ms', 0):.0f}ms (if the 200-line log cap was hit, the real count is higher)\""
  severity_default: medium
  symptom_linked: false
  why: >
    When etcd takes over 100ms for disk fsync or apply, every write slows down, and in bad cases the leader changes and the apiserver pauses. Typical in a small k3s cluster where PVs, logs and etcd share one SSD.
    On EKS etcd is invisible, so only apiserver-side etcd errors (apiserver_etcd_errors) are observed.
  suggest: Move the etcd data directory to a dedicated disk, check the fsync p99 metric (etcd_disk_wal_fsync_duration_seconds) against 10ms, and separate heavy PVs (DB, Elasticsearch) from the same disk.
  verify:
    - "logs/node/<server>/k3s-etcd-slow-24h.log ; histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))"
  profiles: [lab]

# ---------- Platform common ----------
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          apply_took_too_long: 112
          request_stats_slow: 86
          readindex_slow: 2
          leader_changed: 0
          max_ms: 714.0
      - expect: "warn"
        item:
          apply_took_too_long: 15
          request_stats_slow: 3
          readindex_slow: 0
          leader_changed: 0
          max_ms: 300.0
      - expect: "pass"
        item:
          apply_took_too_long: 0
          request_stats_slow: 0
          readindex_slow: 0
          leader_changed: 0
          max_ms: 0

- id: platform.k8s-version-eol
  name: Kubernetes minor version end of support
  area: platform
  type: inventory
  cluster_level: true
  rule:
    expr: "k8s_eol(inv['cluster'].get('server_version')) is not None and days_until(k8s_eol(inv['cluster'].get('server_version'))) < 0"
    warn_expr: "k8s_eol(inv['cluster'].get('server_version')) is not None and days_until(k8s_eol(inv['cluster'].get('server_version'))) < 90"
  evidence: "f\"server {inv['cluster'].get('server_version')}, end of support {eol_badge(inv['cluster'].get('server_version'))}\""
  severity_default: high
  symptom_linked: false
  why: An unsupported minor version gets no security patches. On EKS extended support billing starts; on k3s and kubeadm the upgrade path gets longer (no skipping more than one minor).
  suggest: Upgrade one minor at a time. First check the removed APIs with Pluto or kubent.
  verify:
    - "kubectl version ; rubric/k8s-versions.yaml ; (EKS) aws eks describe-cluster-versions"
  profiles: [prod, lab]

# ---- Node OS (area node). Material is summary.nodeos (lib/nodeos.py). Read from inside the node, so only what does not overlap with the node-exporter metric checks (node.conntrack-usage etc.) lives here. ----
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        inventory:
          cluster:
            platform: "k3s"
            server_version: "v1.31.2+k3s1"
      - expect: "warn"
        inventory:
          cluster:
            platform: "k3s"
            server_version: "v1.34.1+k3s1"
      - expect: "pass"
        inventory:
          cluster:
            platform: "k3s"
            server_version: "v1.36.0+k3s1"

- id: node.kernel-oom-node-level
  name: Node-level OOM killer invoked (different from container OOMKilled)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('oom_node', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) 'Out of memory: Kill' {item['kernel']['counts'].get('oom_node')} times, system process victims (kubelet, containerd, k3s) {item['kernel']['counts'].get('oom_system_victim', 0)}, cgroup OOM (container) {item['kernel']['counts'].get('oom_cgroup', 0)}. Samples: {[s[:120] for s in item['kernel']['samples'] if 'Out of memory' in s][:3]}\""
  severity_default: high
  symptom_linked: true
  why: >
    A container OOMKilled dies within its own limit; a node-level OOM means the whole node ran out of memory and the kernel picked any process.
    If the victim is kubelet or containerd, the node goes NotReady and every pod on it is affected. Causes are pods without limits (BestEffort), no system reservation (kubeReserved) and memory overcommit.
  suggest: Look at the victim process, then check the pods without limits on that node and the kubelet kubeReserved/systemReserved and evictionHard memory.available. evictionHard must act before the kernel OOM killer.
  verify:
    - "journalctl -k --since -24h | grep -E 'Out of memory|oom-kill'"
    - "kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig.evictionHard"
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-1"
          roles:
            - "worker"
          collected: true
          meta:
            root: true
            kernel: "5.15.0-100"
            os: "Ubuntu 22.04"
            uptime_days: 30.0
            loadavg: "0.5"
            nproc: 8
            mem_total_gb: 31.0
            containerd_version: "1.7.0"
            zombies: 0
            kubelet_rss_mb: 100
          kernel:
            source: "journalctl -k"
            window: "24h"
            lines: 100
            counts:
              oom_node: 2
              oom_cgroup: 0
              oom_system_victim: 1
              lockup: 0
              io_error: 0
              fs_error: 0
              nic: 0
              conntrack_full: 0
              net_pressure: 0
              mem_pressure: 0
              bug: 0
              segfault: 0
              clock: 0
            samples:
              - "Out of memory: Kill process 123 (kubelet)"
          sysctl:
            values:
              net.netfilter.nf_conntrack_count: "1000"
              net.netfilter.nf_conntrack_max: "262144"
            issues: []
          cri:
            available: true
            runtime: "containerd"
            version: "1.7.0"
            states:
              Running: 20
              Exited: 2
            images: 30
            imagefs_used_gb: 10.0
            conditions:
