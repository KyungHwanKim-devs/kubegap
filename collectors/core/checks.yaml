- id: node.kernel-io-fs-errors
  name: Disk I/O errors or filesystem errors
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kernel']['counts'].get('io_error', 0) + item['kernel']['counts'].get('fs_error', 0) >= 1"
  target: "item['node']"
  evidence: "f\"kernel log ({item['kernel']['window']}) I/O errors {item['kernel']['counts'].get('io_error')}, filesystem errors {item['kernel']['counts'].get('fs_error')}. Samples: {[s[:140] for s in item['kernel']['samples'] if any(k in s for k in ('I/O error','EXT4','XFS','nvme','read-only','Read-only'))][:3]}\""
  severity_default: high
  symptom_linked: true
  why: A sign of a dying disk. Next comes a read-only filesystem remount, and then etcd, container writes and logs all fail. In a small k3s cluster where etcd and PVs share one SSD, the whole cluster stops.
  suggest: "Check `smartctl -H` or the cloud volume status, back up the data (etcd, PVs) first, then replace the disk. On EKS, check the EBS volume status and replace the node."
  verify:
    - "journalctl -k --since -24h | grep -E 'I/O error|EXT4-fs|XFS'"
    - "sudo smartctl -H /dev/<disk>"
