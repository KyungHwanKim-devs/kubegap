- id: node.conntrack-usage
  name: conntrack table usage
  area: node
  type: metric
  inputs: [conntrack_ratio]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.80, lab: 0.80 }
    warn_threshold: { prod: 0.70, lab: 0.70 }
  target: "labels.get('instance')"
  evidence: "f\"conntrack usage {value:.2f}\""
  severity_default: high
  symptom_linked: true
  why: When the conntrack table is full, new connections are silently dropped. No error logs, only more timeouts. The kube-proxy default is 32768 per core, which is too small for network-heavy nodes.
  suggest: "Raise the node sysctl net.netfilter.nf_conntrack_max (kube-proxy --conntrack-max-per-core) and shorten timeouts."
  verify:
    - "node_nf_conntrack_entries / node_nf_conntrack_entries_limit"
    - "On the node: sysctl net.netfilter.nf_conntrack_max net.netfilter.nf_conntrack_count"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          conntrack_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.9
      - expect: "warn"
        metric:
          conntrack_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.75
      - expect: "pass"
        metric:
          conntrack_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.1
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          conntrack_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.8

- id: node.disk-usage
  name: Node filesystem usage
  area: node
  type: metric
  inputs: [disk_usage_ratio]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.85, lab: 0.80 }
    warn_threshold: { prod: 0.75, lab: 0.70 }
  target: "labels.get('instance', '') + ':' + labels.get('mountpoint', '')"
  evidence: "f\"usage {value:.2f}\""
  severity_default: high
  symptom_linked: false
  why: The kubelet raises DiskPressure and evicts pods at nodefs.available<10% and imagefs.available<15%. Container logs (/var/log/pods) and images are the usual culprits.
  suggest: "Log rotation (containerLogMaxSize), image GC thresholds, or a bigger disk. On the node: du -sh /var/log/pods/* | sort -rh | head"
  verify:
    - "1 - node_filesystem_avail_bytes / node_filesystem_size_bytes"
    - "On the node: df -h / /var/lib/containerd ; crictl imagefsinfo"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          disk_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.9
      - expect: "warn"
        metric:
          disk_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.78
      - expect: "pass"
        metric:
          disk_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.3
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          disk_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.85

- id: node.inode-usage
  name: Node inode usage
  area: node
  type: metric
  inputs: [inode_usage_ratio]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.85, lab: 0.85 }
    warn_threshold: { prod: 0.75, lab: 0.75 }
  target: "labels.get('instance', '') + ':' + labels.get('mountpoint', '')"
  evidence: "f\"inode usage {value:.2f}\""
  severity_default: high
  symptom_linked: false
  why: Disk space remains but files cannot be created. Images with many small files (node_modules) exhaust inodes.
  suggest: "On the node: df -i ; remove unused images (crictl rmi --prune is a suggestion only)"
  verify:
    - "1 - node_filesystem_files_free / node_filesystem_files"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          inode_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.9
      - expect: "warn"
        metric:
          inode_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.78
      - expect: "pass"
        metric:
          inode_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.1
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          inode_usage_ratio:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.85

- id: node.ntp-offset
  name: Node clock offset
  area: node
  type: metric
  inputs: [ntp_offset_seconds]
  rule:
    expr: "value >= threshold"
    threshold: { prod: 0.1, lab: 0.1 }
  target: "labels.get('instance')"
  evidence: "f\"clock offset {value:.3f}s\""
  severity_default: high
  symptom_linked: true
  why: When time drifts, TLS validation, JWT expiry, distributed locks and log ordering all break. The symptom shows up as "authentication failed", so nobody suspects the clock.
  suggest: "On the node: timedatectl status, chronyc tracking. EKS AMIs use chrony against 169.254.169.123."
  verify:
    - "abs(node_timex_offset_seconds) > 0.1"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          ntp_offset_seconds:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.5
      - expect: "pass"
        metric:
          ntp_offset_seconds:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.001
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          ntp_offset_seconds:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0.1

- id: node.ntp-unsynced
  name: Nodes with clock synchronization off
  area: node
  type: metric
  inputs: [ntp_sync_status]
  rule:
    expr: "value == 0"
  target: "labels.get('instance')"
  evidence: "'node_timex_sync_status 0 (not synchronized)'"
  severity_default: medium
  symptom_linked: false
  why: Even if the offset is small now, with synchronization off it grows over time.
  suggest: Check the chrony or systemd-timesyncd status.
  verify:
    - "node_timex_sync_status"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          ntp_sync_status:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0
      - expect: "pass"
        metric:
          ntp_sync_status:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 1

- id: node.swap-enabled
  name: Nodes with swap enabled
  area: node
  type: metric
  inputs: [node_swap_total_bytes]
  rule:
    expr: "value > 0"
  target: "labels.get('instance')"
  evidence: "f\"swap {value/1024**3:.1f} GiB\""
  severity_default: low
  symptom_linked: false
  why: The kubelet refuses swap by default (failSwapOn). If it is on, the kubelet configuration was changed, and memory pressure hides as swap latency instead of eviction, quietly degrading latency.
  suggest: "swapoff and clean up /etc/fstab, or confirm that swapBehavior (1.28+) is being used deliberately."
  verify:
    - "node_memory_SwapTotal_bytes"
    - "On the node: free -m ; cat /proc/meminfo | grep Swap"
  profiles: [prod, lab]

# ---------- Observability / absence ----------
  test:
    cases:
      - expect: "fail"
        metric:
          node_swap_total_bytes:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 8589934592
      - expect: "pass"
        metric:
          node_swap_total_bytes:
            - labels:
                instance: "10.0.0.1:9100"
                mountpoint: "/"
              value: 0

- id: observability.no-slo
  name: No SLO definition tool
  area: observability
  type: absence
  family: slo
  rule:
    # no tool (Sloth, Pyrra), but sli:/slo: recording rules, burn rate alerts or slo-labelled rules lower this to warn
    warn_expr: "bool((summary.get('observability') or {}).get('slo', {}).get('any_signal'))"
  evidence: "f\"no SLO tool. Signals: sli/slo recording rules {(summary.get('observability') or {}).get('slo', {}).get('sli_recording_rules')}, burn rate alerts {(summary.get('observability') or {}).get('slo', {}).get('burn_rate_alerts')}, slo-labelled rules {(summary.get('observability') or {}).get('slo', {}).get('slo_labelled_rules')}\""
  severity_default: critical
  symptom_linked: false
  why: Without an SLO there is no definition of "normal", and no basis for deciding which alerts matter or which finding comes first.
  suggest: Define per-service availability and latency SLOs as recording rules with Sloth or Pyrra. Start with one service that has an Ingress.
  verify:
    - "kubectl get crd | grep -E 'sloth|pyrra'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "backup"
            - "event-retention"
            - "secrets-manager"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []
        summary:
          observability:
            slo:
              any_signal: false
              sli_recording_rules: 0
              burn_rate_alerts: 0
              slo_labelled_rules: 0
      - expect: "warn"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "backup"
            - "event-retention"
            - "secrets-manager"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []
        summary:
          observability:
            slo:
              any_signal: true
              sli_recording_rules: 3
              burn_rate_alerts: 1
              slo_labelled_rules: 2
      - expect: "pass"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "backup"
            - "event-retention"
            - "secrets-manager"
            - "slo"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []

- id: observability.no-symptom-alerts
  name: Symptom-based alert rules missing or too few
  area: observability
  type: summary
  each: observability.rules
  cluster_level: true
  rule:
    expr: "item.get('alerting', 0) > 0 and item['by_class'].get('symptom', 0) + item['by_class'].get('app', 0) == 0"  # rules on the app's own metrics (success rate, latency) count as symptom rules; counting them as 0 produced a false critical fail on a real cluster
    warn_expr: "item.get('alerting', 0) > 0 and (item['by_class'].get('symptom', 0) + item['by_class'].get('app', 0)) / max(item.get('alerting', 1), 1) < 0.15"
  target: "'cluster'"
  evidence: "f\"{item['alerting']} alert rules: symptom {item['by_class'].get('symptom', 0)}, cause {item['by_class'].get('cause', 0)}, app metrics (assumed symptom) {item['by_class'].get('app', 0)}. Symptom ratio {item.get('symptom_ratio')}. Symptom rules: {item['symptom_rules'][:8]}\""
  severity_default: critical
  symptom_linked: false
  why: >
    "CPU 80%" is a cause; users do not know about CPU. "5xx ratio above 1% for 5 minutes" is a symptom. Without symptom alerts, outages are learned from user reports.
    Classification is a heuristic on the metric names in expr (http_*, grpc_*, ingress/ALB, sli:/slo:, burn rate = symptom; only container_*/node_*/kube_* = cause; other app metrics = assumed symptom), and the LLM reclassifies app rules from their name and description.
  suggest: Create a 5xx ratio and p99 latency alert for every traffic-receiving service. If the app has no http_* metrics, use the ingress controller or ALB CloudWatch as the source.
  verify:
    - "summary.json observability.rules.symptom_rules / app_rules ; kubectl get prometheusrules -A"
  notes: "Classification history: at first only http_*, grpc_*, ingress and SLO metrics counted as symptoms, so the app's own metrics (queue length, processing delay) were all classified as cause and a real cluster showed 0 symptoms as critical. Now only container_*, node_* and kube_* are cause; other app metrics are assumed symptoms (app) and the LLM reclassifies them from name and description. That is why expr counts symptom and app separately."
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          alerting: 100
          by_class:
            symptom: 0
            cause: 90
            app: 0
          symptom_ratio: 0.0
          symptom_rules: []
      - expect: "warn"
        item:
          alerting: 100
          by_class:
            symptom: 5
            cause: 90
            app: 5
          symptom_ratio: 0.05
          symptom_rules:
            - "HighErrorRate"
      - expect: "pass"
        item:
          alerting: 100
          by_class:
            symptom: 30
            cause: 60
            app: 10
          symptom_ratio: 0.3
          symptom_rules:
            - "HighErrorRate"

- id: observability.alerts-never-fired
  name: Alert rules that never fired in 15 days
  area: observability
  type: summary
  each: observability.alerts
  cluster_level: true
  rule:
    # warn-only (no expr): in a healthy cluster most rules do not fire within 15 days, which is normal; no fail by ratio
    warn_expr: "item['never_fired_count'] > 0"
  target: "'cluster'"
  evidence: "f\"{item['never_fired_count']} of {item['rules_total']} rules did not fire in 15 days ({item['never_fired_15d'][:12]}{'…' if item['never_fired_count'] > 12 else ''}). Fired: {item['fired_15d'][:10]}\""
  severity_default: low
  symptom_linked: false
  why: >
    A rule that never fired during the retention window (15 days) is one of two things: that failure really did not happen, or the threshold or metric name is wrong and the rule can never fire.
    The latter creates the illusion that "we have alerting". Do not treat them all as pass; if rules for core failure modes (5xx, CrashLoop, disk) are among them, the LLM checks whether the metrics in expr actually exist.
  suggest: For never-fired rules covering core failure modes, query the expr metric directly in Prometheus to confirm it exists. Delete useless rules.
  verify:
    - "count by (alertname) (count_over_time(ALERTS{alertstate=\"firing\"}[15d]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          rules_total: 100
          never_fired_count: 90
          never_fired_15d:
            - "A"
            - "B"
          fired_15d:
            - "C"
      - expect: "warn"
        item:
          rules_total: 100
          never_fired_count: 10
          never_fired_15d:
            - "A"
          fired_15d:
            - "C"
      - expect: "pass"
        item:
          rules_total: 100
          never_fired_count: 0
          never_fired_15d: []
          fired_15d:
            - "C"

- id: observability.alerts-always-firing
  name: Alerts firing continuously for 7 days (alert fatigue or false positives)
  area: observability
  type: summary
  each: observability.alerts.always_firing_7d
  rule:
    expr: "True"
  target: "item['alertname']"
  evidence: "f\"7d firing samples {item['samples_7d']:.0f} (same level as Watchdog = never stops firing)\""
  severity_default: medium
  symptom_linked: false
  why: >
    An alert that fires for 7 days straight is an alert nobody looks at, and real problems drown in that noise. On EKS, KubeControllerManagerDown and KubeSchedulerDown are false positives from kube-prometheus-stack default rules trying to see an invisible control plane,
    whereas KubePodNotReady firing continuously means a pod really is not coming up. Tell them apart: disable the former, fix the latter.
  suggest: Disable false-positive rules in values (for example kube-prometheus-stack kubeControllerManager.enabled=false). Fix the pod behind real problems; until then silence it with an expiry.
  verify:
    - "topk(20, sum by (alertname) (count_over_time(ALERTS{alertstate=\"firing\"}[7d])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          alertname: "KubePodNotReady"
          samples_7d: 2016.0
      - expect: "none"

- id: observability.alertmanager-default-null
  name: Alertmanager default receiver is empty (unrouted alerts vanish)
  area: observability
  type: summary
  each: observability.alertmanager
  cluster_level: true
  rule:
    expr: "bool(item.get('default_is_null'))"
    warn_expr: "bool(item.get('null_receivers')) and len(item.get('null_receivers', [])) > 1"
  target: "'cluster'"
  evidence: "f\"default receiver {item.get('default_receiver')} -> {item.get('default_receiver_kinds')}, receivers {item.get('receivers')}, {item.get('route_count')} routes, unused receivers {item.get('unused_receivers')}, severity routing {item.get('severity_routed')}\""
  severity_default: high
  symptom_linked: false
  why: Alerts that match no route in the tree go to the default receiver. If the default is null, they silently vanish. Nobody notices when a newly added rule does not match the route matchers.
  suggest: Point the default receiver at a channel humans read and send only Watchdog to null. Make per-severity channels explicit in routes (critical=page, warning=channel, info=null).
  verify:
    - "route.receiver and receivers in alertmanager/status.json config.original"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          default_is_null: true
          default_receiver: "null"
          default_receiver_kinds: []
          receivers:
            - "null"
          route_count: 1
          null_receivers:
            - "null"
          unused_receivers: []
          severity_routed: false
      - expect: "warn"
        item:
          default_is_null: false
          default_receiver: "slack"
          default_receiver_kinds:
            - "slack"
          receivers:
            - "slack"
            - "null"
            - "null2"
          route_count: 3
          null_receivers:
            - "null"
            - "null2"
          unused_receivers: []
          severity_routed: true
      - expect: "pass"
        item:
          default_is_null: false
          default_receiver: "slack"
          default_receiver_kinds:
            - "slack"
          receivers:
            - "slack"
          route_count: 2
          null_receivers: []
          unused_receivers: []
          severity_routed: true

- id: observability.alertmanager-notification-failed
  name: Alertmanager notification delivery failures
  area: observability
  type: metric
  inputs: [alertmanager_notifications_failed_1d]
  rule:
    expr: "value > 0"
  target: "labels.get('integration', 'unknown')"
  evidence: "f\"{value:.0f} delivery failures in 24h (integration {labels.get('integration')})\""
  severity_default: high
  symptom_linked: false
  why: Alerts that fired but never reached Slack or PagerDuty. Expired webhook URLs, rotated tokens or network policies are the usual causes. Everyone believes alerting exists while nobody actually receives anything.
  suggest: Check the Alertmanager log for per-integration errors and fix the receiver configuration.
  verify:
    - "sum by (integration) (increase(alertmanager_notifications_failed_total[1d]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          alertmanager_notifications_failed_1d:
            - labels:
                integration: "slack"
              value: 3
      - expect: "pass"
        metric:
          alertmanager_notifications_failed_1d:
            - labels:
                integration: "slack"
              value: 0

- id: observability.silence-forgotten
  name: Stale or overly long silences
  area: observability
  type: summary
  each: observability.alertmanager.silences_forgotten
  rule:
    expr: "True"
  target: "(item.get('created_by') or 'unknown') + ':' + str(item.get('matchers'))[:50]"
  evidence: "f\"created {item['age_days']} days ago, {item['remaining_days']} days remaining, matchers {item['matchers']}, comment '{item['comment']}'\""
  severity_default: medium
  symptom_linked: false
  why: A silence means "we know, mute it for a while". One alive for more than 7 days or with more than 30 days remaining has been forgotten, and new failures matching it are buried too.
  suggest: Expire the silence and fix the root cause, or delete the rule if it really should be ignored forever.
  verify:
    - "alertmanager/silences.json ; amtool silence query"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          created_by: "ops"
          matchers:
            - "alertname=X"
          age_days: 30.0
          remaining_days: 300.0
          comment: "temp"
          state: "active"
      - expect: "none"

- id: observability.failure-mode-uncovered
  name: Failure modes without an alert
  area: observability
  type: summary
  each: observability.failure_modes.uncovered
  rule:
    expr: "item['importance'] == 'critical'"
    warn_expr: "True"
  target: "item['mode']"
  evidence: "f\"user symptom: {item['symptom']}. No alert rule covers this failure mode\""
  severity_default: high
  symptom_linked: true
  why: >
    A matrix of 16 failure modes (OOMKill, CrashLoop, node NotReady, disk/PVC, inode, certificate expiry, 5xx, p99, backup failure, HPA max, Pending, scheduling failure, image pull, DNS, VPC CNI IPs, node provisioning)
    against whether an alert exists for each. Missing modes are learned from user reports. Matching uses regexes on expr and names, so the LLM reviews the whole matrix and corrects false positives and misses.
  suggest: For each empty mode add the kube-prometheus-stack default rule (most exist) or one per-service rule. Symptom modes (5xx, p99) first.
  verify:
    - "summary.json observability.failure_modes.matrix"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          mode: "OOMKill"
          importance: "critical"
          symptom: "restarts"
      - expect: "warn"
        item:
          mode: "disk"
          importance: "normal"
          symptom: "x"
      - expect: "none"

- id: observability.golden-signals-missing
  name: Ingress backends without latency, traffic or error metrics
  area: observability
  type: summary
  each: observability.golden_signals.missing_lte
  rule:
    # an ALB (EKS) has latency, traffic and errors in CloudWatch, which the ALB collector reads, so until then this is warn. Production ingresses elsewhere fail
    expr: "prod and not (item.get('source') or '').startswith('alb-cloudwatch') and item.get('cluster_ic_metrics') is not False"  # if the cluster has no ingress controller metrics at all there is a single cause (no ServiceMonitor), so ingress-controller-metrics-missing fails and this one warns
    warn_expr: "True"
  target: "item['namespace'] + '/' + item['ingress']"
  evidence: "f\"hosts {item['hosts']}, backends {item['services']}, no app http_* metrics, no ingress controller metrics, source {item['source'] or 'none'}\""
  severity_default: medium
  symptom_linked: true
  why: >
    A service missing three of the 4 Golden Signals (latency, traffic, errors, saturation) learns "it got slow" or "it is erroring" from user reports. If the app does not expose http_*, ingress controller metrics (ingress-nginx, Traefik) or
    EKS ALB CloudWatch (TargetResponseTime, RequestCount, HTTPCode_Target_5XX_Count) can substitute. The ALB collector reads the latter.
  suggest: For ingress-nginx, enable the metrics port and ServiceMonitor. For an ALB, pull CloudWatch metrics into Prometheus (yace, cloudwatch-exporter) or set ALB-based 5xx and p99 alerts as CloudWatch alarms. The real fix is http tools metrics in the app.
  verify:
    - "count by (namespace) ({__name__=~\"http_request_duration_seconds_bucket|http_requests_total\"}) ; nginx_ingress_controller_requests"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          ingress: "web"
          class: "nginx"
          hosts:
            - "a.example.com"
          services:
            - "web"
          source: null
          missing_all_lte: true
      - expect: "warn"
        item:
          namespace: "dev-a"
          ingress: "web"
          class: "nginx"
          hosts:
            - "a"
          services:
            - "web"
          source: null
          missing_all_lte: true
      - expect: "warn"
        item:
          namespace: "prod-a"
          ingress: "web"
          class: "alb"
          hosts:
            - "a"
          services:
            - "web"
          source: "alb-cloudwatch (not collected)"
          missing_all_lte: true

- id: observability.log-volume-change
  name: Namespace log volume changed sharply since the last run (3x surge or vanished)
  area: observability
  type: summary
  each: logs.loki.volume_change
  cluster_level: true
  rule:
    warn_expr: "item.get('prev_snapshot') is not None and (len(item.get('surge') or []) + len(item.get('vanished') or [])) > 0"
  target: "'cluster'"
  evidence: "f\"vs previous snapshot {item.get('prev_snapshot')}: 1h log surge {item.get('surge')}, vanished {item.get('vanished')} — details {[(c['namespace'], c['prev_lines_1h'], c['lines_1h'], c['ratio']) for c in (item.get('changes') or [])][:6]}\""
  severity_default: low
  symptom_linked: true
  why: >
    A sudden 3x in logs means an error loop, a restart loop or debug logging turned on (the input-side cause of Loki cost and OOM); a namespace that produced over 1,000 lines dropping to 0 means the app died or the collector (promtail) lost the pod. A long gap between runs also mixes in time-of-day differences, so this is low and the LLM judges from the run interval.
  suggest: "For a surge, look at the top log patterns of that namespace (summary.logs.unclassified_errors) together with restarts (summary.resilience.restarts). For a vanished namespace, check pod status and promtail targets (observability.log-coverage-gap)."
  verify:
    - "logcli query --since=1h 'sum by (namespace) (count_over_time({namespace=~\".+\"}[1h]))'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          prev_snapshot: "2026-10-25T22-29-21"
          compared_namespaces: 18
          changes:
            - namespace: "prod-a"
              lines_1h: 60000
              prev_lines_1h: 12000
              ratio: 5.0
              kind: "surge"
          surge:
            - "prod-a"
          vanished: []
      - expect: "warn"
        item:
          prev_snapshot: "2026-10-25T22-29-21"
          compared_namespaces: 18
          changes:
            - namespace: "dev-a"
              lines_1h: 0
              prev_lines_1h: 3000
              ratio: 0.0
              kind: "vanished"
          surge: []
          vanished:
            - "dev-a"
      - expect: "pass"
        item:
          prev_snapshot: "2026-10-25T22-29-21"
          compared_namespaces: 18
          changes: []
          surge: []
          vanished: []
      - expect: "pass"
        item:
          prev_snapshot: null
          compared_namespaces: 18
          changes: []
          surge: []
          vanished: []

- id: observability.severity-channels-not-separated
  name: Alerts not routed to different channels by severity (critical and warning share a channel)
  area: observability
  type: summary
  each: observability.alertmanager
  cluster_level: true
  rule:
    warn_expr: "item.get('routes') is not None and not any(any('severity' in (mm or '') for mm in (r.get('matchers') or [])) and r.get('receiver') not in (None, 'null') for r in item['routes'])"
  target: "'cluster'"
  evidence: "f\"routes {[(r.get('receiver'), r.get('matchers')) for r in (item.get('routes') or [])][:6]}, receivers {list((item.get('receivers') or {}).keys())}, default receiver {item.get('default_receiver')}\""
  severity_default: low
  symptom_linked: false
  why: >
    If Alertmanager routes do not split by severity, "wake me now" and "look tomorrow" land in the same channel and both get ignored. This is the first cause of alert fatigue (page only on symptoms).
    Measured: one EKS cluster split routes only by service (env, service, slo) so critical and warning both went to a single Slack channel; a small k3s cluster dropped only info/none to null and sent everything else to a single Discord channel.
  suggest: "Add routes for severity=\"critical\" (or page) -> paging channel and severity=\"warning\" -> ticket or low-priority channel, with a different repeat_interval per severity."
  verify:
    - "amtool config routes show --config.file=<alertmanager.yaml>"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          default_receiver: "slack-system"
          default_is_null: false
          receivers:
            null: []
            slack-sre:
              - "slack"
            slack-system:
              - "slack"
          null_receivers:
            - "null"
          routes:
            - depth: 0
              receiver: "slack-system"
              matchers: null
              continue: false
              group_by:
                - "namespace"
              repeat_interval: "12h"
            - depth: 1
              receiver: "null"
              matchers:
                - "alertname=\"Watchdog\""
              continue: false
              group_by: null
              repeat_interval: null
            - depth: 1
              receiver: "slack-sre"
              matchers:
                - "env=\"prod\""
                - "service=\"image-inference\""
                - "slo=\"img-inference\""
              continue: false
              group_by: null
              repeat_interval: null
            - depth: 1
              receiver: "slack-sre"
              matchers:
                - "env=\"prod\""
                - "service=\"lora-training\""
                - "slo=\"lora-training\""
              continue: false
              group_by: null
              repeat_interval: null
      - expect: "pass"
        item:
          default_receiver: "slack-system"
          default_is_null: false
          receivers:
            null: []
            slack-sre:
              - "slack"
            slack-system:
              - "slack"
          null_receivers:
            - "null"
          routes:
            - depth: 0
              receiver: "slack-system"
              matchers: null
              continue: false
              group_by:
                - "namespace"
              repeat_interval: "12h"
            - depth: 1
              receiver: "null"
              matchers:
                - "alertname=\"Watchdog\""
              continue: false
              group_by: null
              repeat_interval: null
            - depth: 1
              receiver: "slack-sre"
              matchers:
                - "env=\"prod\""
                - "service=\"image-inference\""
                - "slo=\"img-inference\""
              continue: false
              group_by: null
              repeat_interval: null
            - depth: 1
              receiver: "slack-sre"
              matchers:
                - "env=\"prod\""
                - "service=\"lora-training\""
                - "slo=\"lora-training\""
              continue: false
              group_by: null
              repeat_interval: null
            - depth: 1
              receiver: "pagerduty"
              matchers:
                - "severity=\"critical\""
              continue: false
      - expect: "pass"
        item:
          default_receiver: "slack-system"
          default_is_null: false
          receivers:
            null: []
            slack-sre:
              - "slack"
            slack-system:
              - "slack"
          null_receivers:
            - "null"
          routes: null
- id: observability.page-severity-cause-alerts
  name: Many cause alerts at page (critical) severity (wake people at night without user impact)
  area: observability
  type: summary
  each: observability.rules
  cluster_level: true
  rule:
    warn_expr: "len(item.get('page_severity_cause') or []) >= 10"
  target: "'cluster'"
  evidence: "f\"of {item.get('alerting')} alert rules, {len(item.get('page_severity_cause') or [])} are critical/page severity yet look only at cause metrics (container_*, node_*, kube_*) (e.g. {(item.get('page_severity_cause') or [])[:6]}), classes {item.get('by_class')}, severity distribution {item.get('by_severity')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    "CPU 80%" is a cause; users do not know about CPU. Cause alerts at page severity pile up as impact-free night pages until alerts get ignored. observability.no-symptom-alerts only covers the **absence** of symptom alerts; this check is its counterpart.
    The absence of symptom alerts is already a fail from observability.no-symptom-alerts, so this only warns (no double fail).
    Measured on real clusters (EKS and small k3s cluster): about 40 kube-prometheus-stack default rules are critical cause alerts (KubeNodeNotReady and the like; some node and control plane rules deserve a page even though they are causes, so the LLM decides by name).
  suggest: "Lower cause rules to severity warning (ticket, dashboard) and keep critical only on symptom rules (5xx ratio, p99, SLO burn rate). Leave platform rules such as node NotReady and etcd as exceptions."
  verify:
    - "kubectl get prometheusrules -A -o json | jq -r '.items[].spec.groups[].rules[] | select(.alert and .labels.severity==\"critical\") | .alert+\" \"+.expr' | head -40"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          alerting: 157
          by_class:
            symptom: 0
            cause: 60
          by_severity:
            critical: 48
            warning: 97
            page: 2
            high: 3
            none: 2
            info: 5
          page_severity_cause:
            - "R0"
            - "R1"
            - "R2"
            - "R3"
            - "R4"
            - "R5"
            - "R6"
            - "R7"
            - "R8"
            - "R9"
            - "R10"
            - "R11"
            - "R12"
            - "R13"
            - "R14"
            - "R15"
            - "R16"
            - "R17"
            - "R18"
            - "R19"
            - "R20"
            - "R21"
            - "R22"
            - "R23"
            - "R24"
            - "R25"
            - "R26"
            - "R27"
            - "R28"
            - "R29"
            - "R30"
      - expect: "warn"
        item:
          alerting: 157
          by_class:
            app: 19
            cause: 138
          by_severity:
            critical: 48
            warning: 97
            page: 2
            high: 3
            none: 2
            info: 5
          page_severity_cause:
            - "R0"
            - "R1"
            - "R2"
            - "R3"
            - "R4"
            - "R5"
            - "R6"
            - "R7"
            - "R8"
            - "R9"
            - "R10"
            - "R11"
      - expect: "pass"
        item:
          alerting: 157
          by_class:
            app: 19
            cause: 138
          by_severity:
            critical: 48
            warning: 97
            page: 2
            high: 3
            none: 2
            info: 5
          page_severity_cause:
            - "A"
            - "B"
- id: observability.saturation-signal-missing
  name: Traffic-receiving services without a saturation metric (queue, connection pool, thread pool) — the most often missing Golden Signal
  area: observability
  type: summary
  each: observability.golden_signals
  cluster_level: true
  rule:
    warn_expr: "len(item.get('missing_saturation') or []) > 0 and (item.get('ingresses') or 0) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item.get('missing_saturation') or [])} of {item.get('ingresses')} ingress backends have no saturation metric (e.g. {[(r.get('namespace'), r.get('ingress')) for r in (item.get('missing_saturation') or [])][:6]}), namespaces with saturation metrics {item.get('namespaces_with_saturation_metrics')}\""
  severity_default: low
  symptom_linked: false
  why: >
    Latency, traffic and errors are visible from the outside via ingress or ALB metrics, but saturation (queue length, DB connection pool, thread pool, in-flight requests) is visible only if the app exports it. Without it you miss "the moment it starts to slow down" and learn only after errors. observability.golden-signals-missing covers latency, traffic and errors; saturation, the signal most often missing, is counted separately here.
    Measured: 36/36 ingress backends on an EKS cluster and 28/29 on a small k3s cluster had no saturation metric (on EKS only the Kafka namespace and one application namespace exposed queue and pool metrics).
  suggest: "Enable the pool and queue metrics of the app framework (HikariCP, SQLAlchemy pool, uvicorn/gunicorn worker busy, Kafka consumer lag, Redis connected_clients). Failing that, put container CPU throttling and memory working set on a dashboard as saturation proxies."
  verify:
    - "curl -s localhost:9090/api/v1/query --data-urlencode 'query=count by (namespace) ({__name__=~\".*(queue|pool|inflight|in_flight|consumer_lag).*\"})'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          ingresses: 40
          namespaces_with_saturation_metrics:
            - "default"
            - "kube-system"
            - "prod-a"
            - "monitoring"
          missing_lte: []
          missing_saturation:
            - namespace: "argocd"
              ingress: "argocd-server"
              class: "alb"
              hosts:
                - "deploy.example.com"
              services:
                - "argocd-server"
              latency: true
              traffic: true
              errors: true
              saturation: false
              source: "alb-cloudwatch"
              missing_all_lte: false
            - namespace: "dev-b"
              ingress: "b-admin"
              class: "alb"
              hosts:
                - "admin-dev.example.com"
              services:
                - "b-admin"
              latency: true
              traffic: true
              errors: true
              saturation: false
              source: "alb-cloudwatch"
              missing_all_lte: false
            - namespace: "dev-b"
              ingress: "b-api"
              class: "alb"
              hosts:
                - "api-dev.example.com"
              services:
                - "b-api"
              latency: true
              traffic: true
              errors: true
              saturation: false
              source: "alb-cloudwatch"
              missing_all_lte: false
      - expect: "pass"
        item:
          ingresses: 40
          namespaces_with_saturation_metrics:
            - "default"
            - "kube-system"
            - "prod-a"
            - "monitoring"
          missing_lte: []
          missing_saturation: []
      - expect: "pass"
        item:
          ingresses: 0
          namespaces_with_saturation_metrics:
            - "default"
            - "kube-system"
            - "prod-a"
            - "monitoring"
          missing_lte: []
          missing_saturation: []
- id: observability.slo-without-burn-rate
  name: SLO signals exist but no burn rate alert (nobody knows the error budget is burning)
  area: observability
  type: summary
  each: observability.slo
  cluster_level: true
  rule:
    warn_expr: "item.get('any_signal') and not (item.get('burn_rate_alerts') or [])"
  target: "'cluster'"
  evidence: "f\"SLO tools {item.get('tools')}, {len(item.get('sli_recording_rules') or [])} sli/slo recording rules, slo-labelled rules {item.get('slo_labelled_rules')}, {len(item.get('burn_rate_alerts') or [])} burn rate alerts\""
  severity_default: medium
  symptom_linked: false
  why: >
    If there are signs of defined SLOs (Sloth, Pyrra, sli:/slo: recording rules, slo-labelled rules) but no burn rate (error budget consumption speed) alert, the SLO is only a document, and nobody gets paged when the budget burns in a day (burn rate alerts: 14.4 on a 1h/5m window, 6 on a 6h/30m window). observability.no-slo covers the case of **no SLO at all**; this check covers "present but half done".
    Measured on a real EKS cluster: five slo-labelled rules (success rate and duration of inference and training jobs) but zero burn rate alerts.
  suggest: "Creating SLO CRDs with Sloth or Pyrra generates the recording rules and multi-window burn rate alerts together. If writing by hand, use the six-window rules from SRE Workbook chapter 5."
  verify:
    - "kubectl get prometheusrules -A -o json | jq -r '.items[].spec.groups[].rules[] | select(.alert) | select(.expr|test(\"burn|error_budget\")) | .alert'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          tools: []
          sli_recording_rules: []
          burn_rate_alerts: []
          slo_labelled_rules:
            - "ImageInferenceE2ESuccessRateDrop"
            - "ImageInferenceEntitlementFailureSpike"
            - "LoraTrainingSuccessRateDrop"
            - "LoraTrainingDurationP95High"
            - "LoraTrainingCallbackTimeout"
          any_signal: true
      - expect: "pass"
        item:
          tools: []
          sli_recording_rules: []
          burn_rate_alerts:
            - "ApiBurnRateFast"
          slo_labelled_rules:
            - "ImageInferenceE2ESuccessRateDrop"
            - "ImageInferenceEntitlementFailureSpike"
            - "LoraTrainingSuccessRateDrop"
            - "LoraTrainingDurationP95High"
            - "LoraTrainingCallbackTimeout"
          any_signal: true
      - expect: "pass"
        item:
          tools: []
          sli_recording_rules: []
          burn_rate_alerts: []
          slo_labelled_rules: []
          any_signal: false

- id: observability.scrape-targets-down
  name: Jobs with failing scrape targets
  area: observability
  type: metric
  inputs: [scrape_targets_down_by_job]
  rule:
    expr: "value >= 1"
  target: "labels.get('job', 'unknown')"
  evidence: "f\"job {labels.get('job')} has {value:.0f} targets with up==0 (details in prometheus/targets.json)\""
  severity_default: medium
  symptom_linked: false
  why: A ServiceMonitor exists but the targets cannot be scraped, so every metric check for that job runs on empty data. On EKS the kube-controller-manager, kube-scheduler and etcd jobs are an invisible control plane and are down forever; the fix is to disable those rules.
  suggest: Read the target lastError (connection refused, TLS, auth). Disable the control plane jobs on EKS and k3s.
  verify:
    - "health != up ; up == 0 in prometheus/targets.json"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          scrape_targets_down_by_job:
            - labels:
                job: "node-exporter"
              value: 2
      - expect: "pass"
        metric:
          scrape_targets_down_by_job:
            - labels:
                job: "node-exporter"
              value: 0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          scrape_targets_down_by_job:
            - labels:
                job: "node-exporter"
              value: 1

- id: resilience.no-backup
  name: No backup tool
  area: resilience
  type: absence
  family: backup
  rule:
    # no tool (Velero, k8up), but signals of backup activity lower this to warn. Signals = k3s etcd snapshot objects, CronJobs named backup/dump/snapshot, VolumeSnapshots.
    # code cannot tell whether those copies leave the node, so the LLM judges from the CronJob destination storage.
    warn_expr: "backup_signals()['any']"
  evidence: "f\"no backup tool (family backup). Alternative signals: etcd snapshots {backup_signals()['etcd_snapshots']}, backup-like CronJobs {backup_signals()['backup_cronjobs']}, VolumeSnapshots {backup_signals()['volume_snapshots']}. If signals exist, the LLM checks whether copies leave the node\""
  severity_default: critical
  symptom_linked: false
  why: There is no way to recover cluster state (objects) and PV data. Deleting a namespace by mistake or a broken etcd or PV is the end. A CronJob dump without a tool is often "a backup kept on the same node disk", which disappears with the original when the node disk dies.
  suggest: Velero (plus EBS snapshots or PV backup). On EKS at least a DLM snapshot policy. In a small k3s cluster, k3s etcd-snapshot or a state.db copy plus PV directory backup. A backup is not a backup until a restore has been tested.
  verify:
    - "kubectl get crd backups.velero.io ; aws dlm get-lifecycle-policies"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "event-retention"
            - "secrets-manager"
            - "slo"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []
        objects:
          cronjobs.batch: []
          etcdsnapshotfiles.k3s.cattle.io: []
          volumesnapshots.snapshot.storage.k8s.io: []
      - expect: "warn"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "event-retention"
            - "secrets-manager"
            - "slo"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []
        objects:
          cronjobs.batch:
            - metadata:
                namespace: "prod-a"
                name: "pg-backup"
          etcdsnapshotfiles.k3s.cattle.io: []
          volumesnapshots.snapshot.storage.k8s.io: []
      - expect: "pass"
        inventory:
          families_present:
            - "metrics-store"
            - "logs-store"
            - "alert-router"
            - "backup"
            - "event-retention"
            - "secrets-manager"
            - "slo"
            - "certificates"
            - "node-autoscaler"
            - "kube-state-metrics"
            - "node-exporter"
          components_present: []

