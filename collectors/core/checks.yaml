- id: traffic.pod-request-skew
  name: Large traffic skew between pods of the same workload (one pod takes most of it)
  area: traffic
  type: summary
  each: traffic.pod_skew.rows
  rule:
    expr: "(item.get('skew_ratio') or 0) >= 3"
    warn_expr: "(item.get('skew_ratio') or 0) >= 2"
  target: "item['workload']"
  evidence: "f\"{item['pods']} pods, 1h receive mean {item['mean_bytes_s']} B/s, max {item['max_pod']} {item['max_bytes_s']} B/s ({item['skew_ratio']}x the mean), min {item['min_pod']} {item['min_bytes_s']} B/s\""
  severity_default: medium
  symptom_linked: true
  why: >
    HTTP keep-alive, gRPC and WebSockets are balanced per connection, so requests pile onto the pod that long-lived clients are attached to. Adding replicas leaves the new pods idle while the HPA's average utilization looks low. Received bytes approximate request count (the ALB does not give per-target request counts).
    DaemonSets are excluded because node size differences show up as skew.
  suggest: "ALB target group algorithm least_outstanding_requests; for gRPC, client-side load balancing or a service mesh; for WebSockets, a connection cap and periodic reconnects."
  verify:
    - "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"<ns>\",pod=~\"<deploy>-.*\"}[1h]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods: 3
          mean_bytes_s: 50000
          max_pod: "web-1"
          max_bytes_s: 175000
          min_pod: "web-2"
          min_bytes_s: 1000
          skew_ratio: 3.5
          max_over_min: 50.0
          prod: true
      - expect: "warn"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods: 3
          mean_bytes_s: 50000
          max_pod: "web-1"
          max_bytes_s: 110000
          min_pod: "web-2"
          min_bytes_s: 1000
          skew_ratio: 2.2
          max_over_min: 50.0
          prod: true
      - expect: "pass"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods: 3
          mean_bytes_s: 50000
          max_pod: "web-1"
          max_bytes_s: 60000
          min_pod: "web-2"
          min_bytes_s: 1000
          skew_ratio: 1.2
          max_over_min: 50.0
          prod: true

- id: traffic.pod-not-ready
  name: Pod spent a long time not Ready over 24h (dropped from endpoints by readiness failures)
  area: traffic
  type: summary
  each: traffic.readiness.rows
  rule:
    expr: "item.get('min_ready_ratio_24h') is not None and item['min_ready_ratio_24h'] < 0.9 and item['prod']"
    warn_expr: "(item.get('min_ready_ratio_24h') is not None and item['min_ready_ratio_24h'] < 0.99) or (item.get('unhealthy_events') or 0) >= 10"
  target: "item['workload']"
  evidence: "(f\"24h minimum Ready ratio {item.get('min_ready_ratio_24h')} (pod {item.get('worst_pod')}, about {item.get('not_ready_minutes_24h')} min not ready), pods below 0.99 {item['pods_below_99']}, \" if item.get('min_ready_ratio_24h') is not None else 'no Ready ratio metric (kube_pod_status_ready not collected), ') + f\"Unhealthy events {item['unhealthy_events']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    When readiness fails the pod stays alive but is removed from the Service endpoints. If one of 2 replicas drops out the other takes double; if there is only one, it is a 503. A 24h Ready ratio of 0.9 means 2.4 hours out of service that day.
    The cause is either a probe that is too strict (timeoutSeconds 1, DB dependency check) or an app that really stalled (GC, connection pool exhaustion).
  suggest: "Read the Unhealthy event messages in `kubectl describe pod` (which probe, what response) and the CPU throttling and memory at those times. Probe timeout 3s or more; take DB dependency checks out of liveness."
  verify:
    - "avg_over_time(kube_pod_status_ready{condition=\"true\",namespace=\"<ns>\"}[24h])"
    - "kubectl get events -n <ns> --field-selector reason=Unhealthy"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods_below_99: 1
          min_ready_ratio_24h: 0.5
          worst_pod: "web-1"
          not_ready_minutes_24h: 720
          unhealthy_events: 0
          prod: true
      - expect: "warn"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods_below_99: 1
          min_ready_ratio_24h: 0.98
          worst_pod: "web-1"
          not_ready_minutes_24h: 29
          unhealthy_events: 0
          prod: true
      - expect: "warn"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods_below_99: 1
          min_ready_ratio_24h: null
          worst_pod: "web-1"
          not_ready_minutes_24h: null
          unhealthy_events: 15
          prod: true
      - expect: "pass"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods_below_99: 1
          min_ready_ratio_24h: 0.999
          worst_pod: "web-1"
          not_ready_minutes_24h: 1
          unhealthy_events: 0
          prod: true
      - expect: "warn"
        item:
          workload: "prod-a/web"
          namespace: "prod-a"
          pods_below_99: 1
          min_ready_ratio_24h: 0.5
          worst_pod: "web-1"
          not_ready_minutes_24h: 720
          unhealthy_events: 0
          prod: false

- id: traffic.coredns-servfail
  name: CoreDNS SERVFAIL ratio is high
  area: traffic
  type: summary
  each: traffic.coredns
  cluster_level: true
  rule:
    expr: "(item.get('servfail_ratio_1h') or 0) >= 0.01"
    warn_expr: "(item.get('servfail_ratio_1h') or 0) >= 0.001"
  target: "'cluster'"
  evidence: "f\"1h SERVFAIL ratio {item.get('servfail_ratio_1h')}, p99 {item.get('p99_s_1h')}s\""
  severity_default: high
  symptom_linked: true
  why: SERVFAIL means upstream DNS failure, a plugin error or a loop. Apps experience it as connection failures or 5-second retries. It is a shared dependency that affects every external and internal call in the cluster.
  suggest: "CoreDNS logs `kubectl -n kube-system logs deploy/coredns | grep SERVFAIL`, upstream health (the VPC resolver in /etc/resolv.conf), replicas and CPU limit."
  verify:
    - "sum(rate(coredns_dns_responses_total{rcode=\"SERVFAIL\"}[5m])) / sum(rate(coredns_dns_responses_total[5m]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          servfail_ratio_1h: 0.02
          p99_s_1h: 0.01
      - expect: "warn"
        item:
          available: true
          servfail_ratio_1h: 0.005
          p99_s_1h: 0.01
      - expect: "pass"
        item:
          available: true
          servfail_ratio_1h: 0.0
          p99_s_1h: 0.01
      - expect: "pass"
        item:
          available: false
          servfail_ratio_1h: null
          p99_s_1h: null

- id: traffic.coredns-latency
  name: CoreDNS p99 response time is high
  area: traffic
  type: summary
  each: traffic.coredns
  cluster_level: true
  rule:
    expr: "(item.get('p99_s_1h') or 0) >= 0.5"
    warn_expr: "(item.get('p99_s_1h') or 0) >= 0.05"
  target: "'cluster'"
  evidence: "f\"1h DNS request p99 {item.get('p99_s_1h')}s, SERVFAIL ratio {item.get('servfail_ratio_1h')}\""
  severity_default: medium
  symptom_linked: true
  why: >
    DNS sits in front of every service call. If p99 exceeds 50ms, a pod with ndots:5 that issues 4-5 queries per external domain loses hundreds of ms. A spike near 5s is the UDP conntrack race. Measured: 1.1ms on an EKS cluster, 62ms on a small k3s cluster whose CoreDNS runs under a CPU limit.
  suggest: "Remove the CoreDNS CPU limit and run 2 or more replicas, tune cache TTL, use FQDNs (trailing dot) or ndots 2 for external domains, NodeLocal DNSCache."
  verify:
    - "histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket[5m])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          servfail_ratio_1h: 0.0
          p99_s_1h: 0.8
      - expect: "warn"
        item:
          available: true
          servfail_ratio_1h: 0.0
          p99_s_1h: 0.06
      - expect: "pass"
        item:
          available: true
          servfail_ratio_1h: 0.0
          p99_s_1h: 0.001

- id: traffic.lb-external-traffic-local
  name: LoadBalancer Service uses externalTrafficPolicy Local (interacts with node drain)
  area: traffic
  type: summary
  each: traffic.lb_services
  rule:
    warn_expr: "item.get('external_traffic_policy') == 'Local'"
  target: "item['target']"
  evidence: "f\"Service {item['namespace']}/{item['name']}: externalTrafficPolicy Local, ports {item.get('ports')}, addresses {item.get('hosts')}\""
  severity_default: low
  symptom_linked: false
  why: >
    Local preserves the client IP and saves a hop, but if a node has no pod of the Service the LB health check fails and the node drops out. During node drain or Karpenter consolidation, traffic can break for the few seconds while pods move. If intentional, move on.
  suggest: "Use Cluster if IP preservation is not needed. If it is, keep a pod on every node (DaemonSet or topologySpread) and shorten the LB health check interval."
  verify:
    - "kubectl get svc -A --field-selector spec.type=LoadBalancer -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,POLICY:.spec.externalTrafficPolicy"
  profiles: [prod, lab]

# ---------- Scaling. Material is summary.scaling (lib/scaling.py) ----------
  test:
    cases:
      - expect: "warn"
        item:
          type: "loadbalancer"
          namespace: "prod-a"
          name: "lb"
          target: "loadbalancer/prod-a/lb"
          hosts:
            - "admin.example.com"
          ports:
            - 80
          node_ports: []
          scheme: "internet-facing"
          tls: true
          auth_hint: {}
          has_auth_hint: false
          admin_like: true
          db_port: false
          prod: true
          external_traffic_policy: "Local"
          source_ranges: null
          note: null
      - expect: "pass"
        item:
          type: "loadbalancer"
          namespace: "prod-a"
          name: "lb"
          target: "loadbalancer/prod-a/lb"
          hosts:
            - "admin.example.com"
          ports:
            - 80
          node_ports: []
          scheme: "internet-facing"
          tls: true
          auth_hint: {}
          has_auth_hint: false
          admin_like: true
          db_port: false
          prod: true
          external_traffic_policy: "Cluster"
          source_ranges: null
          note: null

- id: scaling.metrics-api-unavailable
  name: Metrics API (metrics-server, external metrics) is not responding (all HPAs stopped)
  area: scaling
  type: summary
  each: scaling.metrics_api.unavailable
  rule:
    expr: "True"
  target: "item['name']"
  evidence: "f\"{item['name']} ({item['role']}): {item.get('reason')} {item.get('message') or ''}\""
  severity_default: critical
  symptom_linked: true
  why: >
    CPU and memory HPAs read the values metrics-server serves at `v1beta1.metrics.k8s.io` every 15 seconds. If this APIService is not Available, every HPA freezes at `unknown` and `kubectl top` fails too.
    With KEDA the same applies to `v1beta1.external.metrics.k8s.io`. It is the quietest reason replicas do not grow when traffic does.
  suggest: "Check the conditions in `kubectl get apiservice v1beta1.metrics.k8s.io -o yaml` and the metrics-server pod logs. Look at certificates, network policies and access to kubelet port 10250."
  verify:
    - "kubectl get apiservices | grep metrics"
    - "kubectl top pods -A | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          name: "v1beta1.metrics.k8s.io"
          role: "metrics-server"
          reason: "FailedDiscoveryCheck"
          message: "no response"
      - expect: "none"

- id: scaling.hpa-scaling-inactive
  name: HPA cannot read its metric, so scaling is off
  area: scaling
  type: summary
  each: scaling.hpa.rows
  rule:
    expr: "item['scaling_inactive']"
  target: "item['target']"
  evidence: "f\"HPA {item['namespace']}/{item['name']}: ScalingActive {item['scaling_active_reason']} — {item['scaling_active_message']}. Metrics {item['metric_types']}, current {item['current']}/{item['min']}~{item['max']}\""
  severity_default: high
  symptom_linked: true
  why: >
    ScalingActive=False means the HPA cannot compute its target metric (FailedGetResourceMetric: missing requests or a metrics-server problem; FailedGetExternalMetric: a KEDA/adapter problem).
    In this state replicas stay frozen at the current value. HPAs created by KEDA (keda-hpa-*) are excluded because ScalingDisabled is normal while the ScaledObject is inactive.
  suggest: "Conditions and Events in `kubectl describe hpa -n <ns> <name>`. Add requests if missing; for external metrics, look at the ScaledObject and TriggerAuthentication."
  verify:
    - "kubectl get hpa -A | grep -i unknown"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/deployment/web"
          target_kind: "Deployment"
          target_name: "web"
          min: 1
          max: 3
          current: 1
          desired: 1
          metric_types:
            - "cpu"
          cpu_only: true
          has_behavior: false
          scale_down_stabilization_s: null
          scale_up_policies: false
          conditions: {}
          scaling_active: false
          scaling_active_reason: "FailedGetResourceMetric"
          scaling_active_message: "missing request for cpu"
          scaling_inactive: true
          keda_owned: false
          prod: true
          current_cpu_utilization: 3
          target_cpu_utilization: 70
          at_max_now: false
          at_min_now: true
          min_eq_max: false
          at_max_ratio_15d: 0.0
          at_min_ratio_15d: 1.0
          desired_changes_7d: 0.0
          never_scaled_15d: true
          last_scale_time: null
          days_since_last_scale: 12.0
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "web"
          target: "prod-a/deployment/web"
          target_kind: "Deployment"
          target_name: "web"
          min: 1
          max: 3
          current: 1
          desired: 1
          metric_types:
            - "cpu"
          cpu_only: true
          has_behavior: false
          scale_down_stabilization_s: null
          scale_up_policies: false
          conditions: {}
          scaling_active: true
          scaling_active_reason: "ValidMetricFound"
          scaling_active_message: "ok"
          scaling_inactive: false
          keda_owned: false
          prod: true
          current_cpu_utilization: 3
          target_cpu_utilization: 70
          at_max_now: false
          at_min_now: true
          min_eq_max: false
          at_max_ratio_15d: 0.0
          at_min_ratio_15d: 1.0
          desired_changes_7d: 0.0
          never_scaled_15d: true
          last_scale_time: null
          days_since_last_scale: 12.0

- id: scaling.hpa-at-max
  name: HPA spent a large share of the last 15 days pinned at max (the ceiling is the bottleneck)
  area: scaling
  type: metric
  inputs: [hpa_at_max_ratio_15d]
  rule:
    expr: "value >= threshold"
    warn_expr: "value >= warn_threshold"
    threshold: { prod: 0.5, lab: 0.5 }
    warn_threshold: { prod: 0.2, lab: 0.2 }
  target: "labels['namespace'] + '/hpa/' + labels['horizontalpodautoscaler']"
  evidence: "f\"Share of the last 15 days spent at max replicas {value:.2f}\""
  severity_default: high
  symptom_linked: true
  why: >
    If it sits at max for long, the HPA cannot scale any further and is effectively off. Check whether latency and errors rose at those times (observability) together with node headroom.
    Before raising max, check the node autoscaler limits (NodePool limits) and the PDB.
  suggest: "Raise maxReplicas or adjust requests (the utilization denominator). For short peaks, a faster behavior.scaleUp policy may be the answer instead."
  verify:
    - "kubectl get hpa -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,MIN:.spec.minReplicas,MAX:.spec.maxReplicas,CUR:.status.currentReplicas"
  notes: PromQL over the HPA status metrics
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        metric:
          hpa_at_max_ratio_15d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 0.7
      - expect: "warn"
        metric:
          hpa_at_max_ratio_15d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 0.3
      - expect: "pass"
        metric:
          hpa_at_max_ratio_15d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 0.0
      # boundary: value exactly at the fail threshold
      - expect: "fail"
        metric:
          hpa_at_max_ratio_15d:
            - labels:
                namespace: "prod-a"
                horizontalpodautoscaler: "web"
              value: 0.5

- id: scaling.hpa-never-scaled
  name: HPA stayed at min for the entire 15 days (wrong target or over-requested)
  area: scaling
  type: summary
  each: scaling.hpa.rows
  rule:
    expr: "bool(item['never_scaled_15d']) and item['prod'] and not item['keda_owned']"
    warn_expr: "bool(item['never_scaled_15d']) and not item['keda_owned']"
  target: "item['target']"
  evidence: "f\"HPA {item['namespace']}/{item['name']}: share of 15 days at min {item['at_min_ratio_15d']:.2f}, min {item['min']} max {item['max']}, current CPU utilization {item['current_cpu_utilization']}% / target {item['target_cpu_utilization']}%, metrics {item['metric_types']}, last scale {item['days_since_last_scale']} days ago\""
  severity_default: low
  symptom_linked: false
  why: >
    The HPA's utilization denominator is the request. If requests far exceed actual usage (resources.cpu-request-overprovisioned), utilization stays in single digits and the HPA never moves. Then it costs money and never catches a peak.
    For I/O-bound apps, RPS or queue length may be the right metric rather than CPU. At min for all 15 days, "we have an HPA" is only a feeling of safety.
  suggest: "Lower requests toward p95 so utilization lands in a meaningful range (30-70%), or switch the target to a custom metric (RPS, queue). If traffic really is flat, deleting the HPA and fixing replicas is also an answer."
