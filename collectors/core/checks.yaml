  test:
    cases:
      - expect: "fail"
        item:
          name: "k8s-alb"
          dns: "x.elb.amazonaws.com"
          type: "application"
          scheme: "internet-facing"
          idle_timeout_s: 300
          deletion_protection: true
          access_logs: true
          drop_invalid_headers: false
