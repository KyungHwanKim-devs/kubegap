- id: tenancy.namespace-dominates-shared-node
  name: One namespace takes more than half of a shared node's CPU (noisy neighbor candidate)
  area: tenancy
  type: summary
  each: tenancy.isolation.nodes
  rule:
    expr: "item['tenant_count'] >= 2 and (item['dominant_share_p95'] or 0) >= 0.5 and (item['cpu_saturated_minutes_7d'] or 0) > 0 and item['dominant_kind'] != 'prod' and item['prod_pods'] > 0"
    warn_expr: "item['tenant_count'] >= 2 and (item['dominant_share_p95'] or 0) >= 0.5"
  target: "item['node']"
  evidence: "f\"Node {item['node']} (pool {item['pool']}): {item['dominant_namespace']} ({item['dominant_kind']}) uses {item['dominant_share_p95']} of the node's allocatable CPU at 7d p95. Minutes above 90% node CPU in 7d {item['cpu_saturated_minutes_7d']}, tenants on this node {item['tenant_kinds']}, share per namespace {item['namespace_share_p95']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    The mechanical precursor of a noisy neighbor: one namespace uses more than half the node's CPU at p95, the node spent time above 90% within 7 days, and production runs on that node. When all three coincide, production latency is likely to line up with that namespace's load.
    Confirming the correlation (did production p99 rise at that time) is done by tenancy.noisy-neighbor (type: llm). If the node was never saturated (0 minutes), dominance alone does no harm, so it is a warning.
    Measured on an EKS cluster and a k3s: 0 saturated minutes, max share 0.06 — no candidates.
  suggest: "ResourceQuota (limits.cpu) or a dedicated pool for the dominant namespace. Keep production Guaranteed (request = limit) so CFS guarantees its share."
  verify:
    - "topk(5, sum by (namespace) (rate(container_cpu_usage_seconds_total{node=\"<node>\",container!=\"\"}[5m])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-a"
          pool: "default"
          pods: 40
          tenants:
            dev: 12
            system: 1
            prod: 27
          tenant_kinds:
            - "dev"
            - "prod"
          tenant_count: 2
          namespaces:
            prod-a: 7
            dev-c: 4
            dev-a: 4
            prod-c: 4
            prod-m: 4
            prod-d: 4
            prod-b: 3
            dev-b: 2
            dev-d: 2
            prod-f: 2
            prod-e: 2
            external-secrets: 1
            prod-g: 1
          prod_pods: 27
          dev_pods: 12
          ci_pods: 0
          prod_namespaces:
            - "prod-f"
            - "prod-c"
            - "prod-a"
            - "prod-m"
            - "prod-d"
            - "prod-g"
            - "prod-b"
            - "prod-e"
