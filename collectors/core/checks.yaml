- id: storage.pvc-usage-high
  name: PVC usage high
  area: storage
  type: summary
  each: storage.pvcs.rows
  rule:
    expr: "item['metrics'] and not item['host_fs'] and (item['used_ratio'] or 0) >= 0.85"
    warn_expr: "item['metrics'] and not item['host_fs'] and (item['used_ratio'] or 0) >= 0.75"
  target: "item['target']"
  evidence: "f\"Usage {item['used_ratio']} (capacity {item['capacity_gb']}GB, inodes {item['inode_ratio']}), growth {item['growth_gb_per_day']}GB/day, {item['days_to_full']} days to full, workloads {item['workloads']}, StorageClass {item['storage_class']}\""
  severity_default: high
  symptom_linked: true
  why: >
    When a DB volume fills up, writes fail and the DB usually drops to read-only or dies. 85% is the line where expansion (allowVolumeExpansion) should start; expansion is online but the filesystem resize takes a few minutes.
    kubelet only reports mounted volumes (kubelet_volume_stats), so PVCs without metrics are not judged, and local-path is excluded because it reports the whole node disk (node.disk-usage covers that).
  suggest: "Raise PVC spec.resources.requests.storage (needs StorageClass allowVolumeExpansion -- storage.no-volume-expansion). For a DB, also clean up old data and logs."
  verify:
    - "kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"<pvc>\"} / kubelet_volume_stats_capacity_bytes"
    - "kubectl -n <ns> exec <pod> -- df -h <mount>"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "gp3"
          requested_gb: 10.0
          capacity_gb: 9.7
          used_ratio: 0.9
          inode_ratio: 0.01
          growth_gb_per_day: 0.01
          days_to_full: 600
          metrics: true
          host_fs: false
          workloads:
            - "statefulset/db"
          db_like: true
          pv: "pvc-x"
          zone: "us-east-1a"
          reclaim_policy: "Delete"
          access_modes:
            - "ReadWriteOnce"
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "gp3"
          requested_gb: 10.0
          capacity_gb: 9.7
          used_ratio: 0.78
          inode_ratio: 0.01
          growth_gb_per_day: 0.01
          days_to_full: 600
          metrics: true
          host_fs: false
          workloads:
            - "statefulset/db"
          db_like: true
          pv: "pvc-x"
          zone: "us-east-1a"
          reclaim_policy: "Delete"
          access_modes:
            - "ReadWriteOnce"
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "gp3"
          requested_gb: 10.0
          capacity_gb: 9.7
          used_ratio: 0.3
          inode_ratio: 0.01
          growth_gb_per_day: 0.01
          days_to_full: 600
          metrics: true
          host_fs: false
          workloads:
            - "statefulset/db"
          db_like: true
          pv: "pvc-x"
          zone: "us-east-1a"
          reclaim_policy: "Delete"
          access_modes:
            - "ReadWriteOnce"
      - expect: "pass"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "local-path"
          requested_gb: 10.0
