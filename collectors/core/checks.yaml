- id: node.cgroup-v1
  name: cgroup v1 node (maintenance mode since Kubernetes 1.31)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['cgroup']['version'] == 'v1'"
  target: "item['node']"
  evidence: "f\"/sys/fs/cgroup filesystem {item['cgroup']['fs']} (cgroup v1). OS {item['meta']['os']}, kernel {item['meta']['kernel']}\""
  severity_default: low
  symptom_linked: false
  why: Kubernetes 1.31 moved cgroup v1 support to maintenance mode, and containerd and systemd default to v2. New features such as memory QoS and PSI work only on v2. Amazon Linux 2 is v1; AL2023 and Ubuntu 22.04 are v2.
