- id: tenancy.ci-no-dedicated-pool
  name: CI runner template has no placement constraint (nodeSelector, toleration) or no dedicated pool (taint)
  area: tenancy
  type: summary
  each: tenancy.isolation.summary
  cluster_level: true
  rule:
    expr: "item['ci_templates'] > 0 and item['prod_present'] and item['separation_possible'] and len(item['ci_unconstrained']) > 0"
    warn_expr: "item['ci_templates'] > 0 and item['prod_present'] and item['separation_possible'] and len(item['ci_without_dedicated_pool']) > 0"
  target: "'cluster'"
  evidence: "f\"Runner templates with placement constraints {item['ci_constrained']} of {item['ci_templates']}, matching a tainted dedicated pool {item['ci_dedicated_pool']} (pools {item['ci_pool_names']}). Unconstrained: {item['ci_unconstrained']}, no dedicated pool: {item['ci_without_dedicated_pool']}. Tainted pools {item['pools_tainted']} of {item['pools']}\""
  severity_default: high
  symptom_linked: false
  why: >
    If runner placement is unconstrained, the scheduler puts runners on whichever production node has room (the cause of tenancy.ci-shares-prod-nodes). With only a nodeSelector and no taint on the pool, production pods land on the build nodes instead.
    Measured on a real EKS cluster: an AutoscalingRunnerSet with nodeSelector workload-type=build + toleration and a tainted build NodePool — fully separated (pass). On a 2-node k3s: a RunnerDeployment without constraints, but separation is impossible with 2 nodes (none).
  suggest: "Taint (NoSchedule) and label the runner pool; nodeSelector + toleration in the runner template. Give the runner pool spot capacity and limits so a build storm does not become a bill."
  verify:
    - "kubectl get autoscalingrunnersets -A -o jsonpath='{.items[*].spec.template.spec.nodeSelector}' ; kubectl get nodepools -o jsonpath='{.items[*].spec.template.spec.taints}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          ci_templates: 1
          ci_constrained: 0
          ci_dedicated_pool: 0
          pools_tainted: 1
          pools: 5
          separation_possible: true
          prod_present: true
          ci_prod_nodes: 0
          dev_prod_nodes: 5
          ci_pool_names:
            - "build-arm64"
          ci_unconstrained:
            - "ci-runners/AutoscalingRunnerSet/r"
          ci_without_dedicated_pool:
            - "ci-runners/AutoscalingRunnerSet/r"
      - expect: "warn"
        item:
          ci_templates: 1
          ci_constrained: 1
          ci_dedicated_pool: 0
          pools_tainted: 1
          pools: 5
          separation_possible: true
          prod_present: true
          ci_prod_nodes: 0
          dev_prod_nodes: 5
          ci_pool_names:
            - "build-arm64"
          ci_unconstrained: []
          ci_without_dedicated_pool:
            - "ci-runners/AutoscalingRunnerSet/r"
      - expect: "pass"
        item:
          ci_templates: 1
          ci_constrained: 1
          ci_dedicated_pool: 1
          pools_tainted: 1
          pools: 5
          separation_possible: true
          prod_present: true
          ci_prod_nodes: 0
          dev_prod_nodes: 5
          ci_pool_names:
            - "build-arm64"
          ci_unconstrained: []
          ci_without_dedicated_pool: []
      - expect: "pass"
        item:
          ci_templates: 1
          ci_constrained: 0
          ci_dedicated_pool: 1
          pools_tainted: 1
          pools: 5
          separation_possible: false
          prod_present: true
          ci_prod_nodes: 0
          dev_prod_nodes: 5
          ci_pool_names:
            - "build-arm64"
          ci_unconstrained:
            - "ci-runners/RunnerDeployment/r"
          ci_without_dedicated_pool:
            - "ci-runners/RunnerDeployment/r"
      - expect: "pass"
        item:
          ci_templates: 0
          ci_constrained: 1
          ci_dedicated_pool: 1
          pools_tainted: 1
          pools: 5
          separation_possible: true
          prod_present: true
          ci_prod_nodes: 0
          dev_prod_nodes: 5
          ci_pool_names:
            - "build-arm64"
          ci_unconstrained: []
          ci_without_dedicated_pool: []
- id: tenancy.shared-node-limit-overcommit
  name: Memory limit total on a node with mixed tenants far exceeds allocatable (neighbor OOM spillover)
  area: tenancy
  type: summary
  each: tenancy.isolation.nodes
  rule:
    expr: "item['tenant_count'] >= 2 and item['prod_pods'] > 0 and (item['memory_limit_overcommit'] or 0) >= 2.0"
    warn_expr: "item['tenant_count'] >= 2 and (item['memory_limit_overcommit'] or 0) >= 1.5"
  target: "item['node']"
  evidence: "f\"Node {item['node']} (pool {item['pool']}): tenant kinds {item['tenant_kinds']}, namespaces {list(item['namespaces'])[:6]}. Memory limit total {item['memory_limits_gb']}GB / allocatable {item['allocatable_memory_gb']}GB = {item['memory_limit_overcommit']}x, request total {item['memory_requests_gb']}GB, containers without a limit {item['containers_without_memory_limit']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Memory cannot be compressed. If the limit total is 2x allocatable, the node is full when every container uses only half its limit, and the kubelet evicts pods that exceed their request first — whoever used the memory, the damage lands on the neighbor tenant that set a small request.
    Nodes with a single tenant are its own responsibility and excluded; only nodes with two or more tenants are checked.
    Measured on a 7-node EKS cluster: 5 of 7 shared nodes at 1.5x or more (max 1.68).
  suggest: "Raise requests to 50% or more of limits (narrow the Burstable gap) to bring overcommit below 1.5x. Block containers without limits with LimitRange defaults."
  verify:
    - "kubectl describe node <node> | sed -n '/Allocated resources/,/Events/p'"
