- id: node.cri-not-ready
  name: Container runtime not RuntimeReady/NetworkReady
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['cri'].get('available') and len(item['cri'].get('not_ready') or []) > 0"
