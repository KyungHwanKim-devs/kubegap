          elb_4xx_24h: 10
          target_5xx_24h: 5
          target_4xx_24h: 100
          target_5xx_ratio_24h: 5e-05
          elb_5xx_ratio_24h: 0.0
          p95_s_max_1h: 0.5
          p95_s_avg: 0.2
          p99_s_max_1h: 1.0
          rejected_connections_24h: 0
          requests_peak_1h: 9000
