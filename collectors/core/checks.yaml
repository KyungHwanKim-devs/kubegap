- id: storage.pvc-filling
  name: PVC will be full within 45 days on the 7-day trend
  area: storage
  type: summary
  each: storage.pvcs.filling
  rule:
    expr: "(item['days_to_full'] or 999) <= 14"
    warn_expr: "True"
  target: "item['target']"
  evidence: "f\"Now {item['used_ratio']} used, growing {item['growth_gb_per_day']}GB/day (7-day linear regression) -> full in about {item['days_to_full']} days. Capacity {item['capacity_gb']}GB, workloads {item['workloads']}\""
  severity_default: high
  symptom_linked: true
  why: Even at low usage, fast growth fills the volume soon. The daily growth comes from deriv over 7 days divided into the remaining capacity, so it can be wrong when the trend changes (weekend or month-end batches). Within two weeks means act now.
  suggest: "Expand the volume or add a retention policy (log rotation, TTL). If the growth is logs or temp files, move them to emptyDir or object storage."
  verify:
    - "kubelet_volume_stats_available_bytes{persistentvolumeclaim=\"<pvc>\"} / (deriv(kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"<pvc>\"}[7d]) * 86400)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "gp3"
          requested_gb: 10.0
          capacity_gb: 9.7
          used_ratio: 0.6
          inode_ratio: 0.01
          growth_gb_per_day: 0.5
          days_to_full: 8
          metrics: true
          host_fs: false
          workloads:
            - "statefulset/db"
          db_like: true
          pv: "pvc-x"
          zone: "us-east-1a"
          reclaim_policy: "Delete"
          access_modes:
            - "ReadWriteOnce"
      - expect: "warn"
        item:
          namespace: "prod-a"
          name: "data-db-0"
          target: "prod-a/data-db-0"
          prod: true
          phase: "Bound"
          storage_class: "gp3"
          requested_gb: 10.0
          capacity_gb: 9.7
          used_ratio: 0.5
          inode_ratio: 0.01
          growth_gb_per_day: 0.1
          days_to_full: 40
          metrics: true
          host_fs: false
          workloads:
            - "statefulset/db"
          db_like: true
          pv: "pvc-x"
          zone: "us-east-1a"
