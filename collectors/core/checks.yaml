- id: resilience.no-pdb
  name: Production Deployments without a PDB (replicas 2 or more)
  area: resilience
  type: object
  inputs: [objects/deployments.json, objects/poddisruptionbudgets.policy.json]
  rule:
    expr: "prod and (spec.get('replicas') or 0) >= 2 and not pdb_covers(obj)"
  evidence: "f\"replicas {spec.get('replicas')}, no PDB selects these pods\""
  severity_default: medium
  symptom_linked: false
  why: A PDB limits how many pods may go down at once during voluntary disruption (node drain, upgrade, Karpenter consolidation). Without one, a drain kills all replicas at the same time.
  suggest: "A PDB with minAvailable: 1 or maxUnavailable: 25%. But minAvailable equal to replicas blocks drains forever."
