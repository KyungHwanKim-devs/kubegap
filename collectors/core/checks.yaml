- id: resilience.db-probe-timeout
  name: DB container liveness timeout is 1s (false failure during fsync/checkpoint → restart → recovery loop)
  area: resilience
  type: summary
  each: resilience.probes.rows
  rule:
    expr: "item['db_probe_timeout_1s'] and item['prod']"
    warn_expr: "item['db_probe_timeout_1s']"
  target: "item['workload'] + ':' + item['container']"
  evidence: "f\"{item['workload']} container {item['container']}: liveness {item['liveness']['type']} timeout {item['liveness']['timeout_s']}s, period {item['liveness']['period_s']}s, failureThreshold {item['liveness']['failure_threshold']}, readiness {(item['readiness'] or {}).get('type')} timeout {(item['readiness'] or {}).get('timeout_s')}s, startupProbe {'present' if item['startup'] else 'absent'}\""
  severity_default: medium
  symptom_linked: true
  why: >
    A DB can stop responding for more than 1s during a checkpoint, VACUUM or a large fsync. If a liveness probe with the default timeoutSeconds 1 fails at that moment, the kubelet kills the DB, and after the restart WAL recovery eats the disk again and it fails again.
    Measured: 4 dev MySQL instances on an EKS cluster and 14 Postgres/Redis containers on a small k3s cluster.
  suggest: "Give DB container liveness a generous timeoutSeconds 5-10 and failureThreshold 6, or drop liveness and keep only readiness. In Bitnami charts this is livenessProbe.timeoutSeconds."
  verify:
    - "kubectl get statefulset -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].livenessProbe}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          workload: "prod-i/deployment/app-k-umami"
          kind: "Deployment"
          namespace: "prod-i"
          name: "app-k-umami"
          container: "umami"
          prod: true
          serves_traffic: true
          liveness:
            type: "httpGet"
            path: "/api/heartbeat"
            port: 3000
            timeout_s: 1
            period_s: 30
            failure_threshold: 3
            initial_delay_s: 30
