- id: node.docker-and-containerd
  name: docker and containerd (k3s) both active on a node
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: nodeos.nodes
  rule:
    expr: "item['runtimes']['docker_and_containerd'] and (item['runtimes']['docker_mb'] or 0) >= 20000"
    warn_expr: "item['runtimes']['docker_and_containerd']"
  target: "item['node']"
  evidence: "f\"Node {item['node']}: active runtimes {item['runtimes']['active']}, kubelet runtime {item['runtimes']['kubelet_runtime']}, /var/lib/docker {item['runtimes']['docker_mb']}MB\""
  severity_default: low
  symptom_linked: false
  why: >
    A docker daemon that Kubernetes does not use, running on the same node, consumes disk (/var/lib/docker images and container logs) and memory without the kubelet knowing, and docker's iptables rules mix with kube-proxy and CNI rules.
    Measured on a k3s k3s: docker, containerd and k3s-agent all active on one node.
  suggest: "Disable docker on the node (systemctl disable --now docker), or if it is really needed, put /var/lib/docker on a separate filesystem and turn off docker's iptables (\"iptables\": false)."
  verify:
    - "systemctl is-active docker containerd k3s k3s-agent ; du -sh /var/lib/docker"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: 25000
            kubelet_runtime: "containerd"
          writable_layers_top: []
          writable_layer_max_mb: null
          permission_gaps: []
      - expect: "warn"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top: []
          writable_layer_max_mb: null
          permission_gaps: []
      - expect: "pass"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "k3s"
            docker_and_containerd: false
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top: []
          writable_layer_max_mb: null
          permission_gaps: []
- id: node.container-writable-layer-large
  name: Container writable layer is large (files accumulating inside the container)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: nodeos.nodes
  rule:
    expr: "(item['writable_layer_max_mb'] or 0) >= 5000"
    warn_expr: "(item['writable_layer_max_mb'] or 0) >= 1000"
  target: "item['node']"
  evidence: "f\"Node {item['node']}: top writable layers {[(l['workload'], l['container'], l['mb']) for l in item['writable_layers_top'][:5]]} MB (max {item['writable_layer_max_mb']}MB)\""
  severity_default: medium
  symptom_linked: false
  why: >
    When a container writes to its own filesystem instead of a volume (cache, logs, uploads), the node's containerd snapshot directory fills up. The data is lost on restart, and it is a common cause of node disk pressure that `kubectl top` does not show.
    On a first real run this number was needed to pin down the cause of a node at 87% disk. The material is the top 10 writableLayer.usedBytes from `crictl stats -a` on the node.
  suggest: "Move the paths that container writes to into an emptyDir (sizeLimit) or a PVC, and send logs to stdout. Enabling readOnlyRootFilesystem prevents it from now on."
  verify:
    - "crictl stats -a -o json | jq -r '.stats[] | [.writableLayer.usedBytes.value, .attributes.labels[\"io.kubernetes.pod.namespace\"], .attributes.labels[\"io.kubernetes.pod.name\"]] | @tsv' | sort -rn | head"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top:
            - namespace: "prod-a"
              pod: "web-1"
              container: "web"
              workload: "prod-a/web"
              mb: 6200
          writable_layer_max_mb: 6200
          permission_gaps: []
      - expect: "warn"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top:
            - namespace: "prod-a"
              pod: "web-1"
              container: "web"
              workload: "prod-a/web"
              mb: 1500
          writable_layer_max_mb: 1500
          permission_gaps: []
      - expect: "pass"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top:
            - namespace: "prod-a"
              pod: "web-1"
              container: "web"
              workload: "prod-a/web"
              mb: 120
          writable_layer_max_mb: 120
          permission_gaps: []
      - expect: "pass"
        item:
          node: "node-a"
          roles: []
          disk:
            mounts: []
            containerd_mb: 40697
            docker_mb: null
          runtimes:
            active:
              - "containerd"
              - "k3s-agent"
              - "docker"
            docker_and_containerd: true
            docker_mb: null
            kubelet_runtime: "containerd"
          writable_layers_top: []
          writable_layer_max_mb: null
          permission_gaps: []

- id: node.large-images
  name: Node has container images of 3 GB or more (pull time, disk, slower scale-out)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: nodeos.nodes
  rule:
    warn_expr: "bool(((item.get('cri') or {}).get('images_over_3gb')) or [])"
  target: "item['node']"
  evidence: "f\"Node {item['node']}: images of 3GB or more {len((item.get('cri') or {}).get('images_over_3gb') or [])} — {', '.join(((item.get('cri') or {}).get('images_over_3gb') or [])[:3])} (largest {(item.get('cri') or {}).get('largest_image_mb')} MB)\""
  severity_default: low
  symptom_linked: false
  why: >
    Large images lengthen the pull when a new node comes up, delaying scale-out and failure recovery (node boot → Ready → pod Running), and fill the node disk (containerd data path) quickly. The 3 GB threshold is a default — machine-learning images (with CUDA) commonly exceed it, so "large" is not itself the problem; this is material for seeing which image is large and why, and whether a multi-stage build, a different base or layer caching (pre-loading images on nodes) can shrink it.
    The material is the top 15 of `crictl images` from the node script (images_top). Without crictl or sudoers the list is empty → that is no data, not a pass (see nodeos.nodes[].gaps).
  suggest: "Check layer sizes per image (`crane manifest`, `dive`), remove build tools with a multi-stage build, switch the base to slim/distroless. Pre-load frequently used large images into the node AMI (on EKS: custom AMI or Bottlerocket image cache) or use a registry pull-through cache."
  verify:
    - "ssh <node> sudo crictl images | sort -k4 -h -r | head"
    - "kubectl get events -A --field-selector reason=Pulled | grep -o 'in [0-9.]*[ms]*s' | sort -h | tail"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          node: "node-a"
          cri:
            available: true
            images_over_3gb:
              - "ghcr.io/x/ml:1"
            largest_image_mb: 5120
      - expect: "pass"
        item:
          node: "node-a"
          cri:
            available: true
            images_over_3gb: []
            largest_image_mb: 900
      - expect: "pass"
        item:
          node: "node-a"
          cri:
            available: false
- id: hygiene.node-label-dependency
  name: Workload bound to a user node label the platform does not guarantee (unschedulable risk on node replacement or upgrade)
  area: hygiene
  type: summary
  each: hygiene.node_labels.rows
  rule:
    expr: "(not item['well_known']) and item['nodes_with_label'] == 0"
    warn_expr: "(not item['well_known']) and (item['prod_workloads'] > 0 or (item['nodes_with_label'] == 1 and item['nodes_total'] > 1))"
  target: "item['key']"
  evidence: "f\"Label {item['key']}: {item['workload_count']} workloads (production {item['prod_workloads']}) depend on it via nodeSelector/affinity, present on {item['nodes_with_label']}/{item['nodes_total']} nodes — e.g. {', '.join(item['workloads'][:3])}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Well-known labels such as kubernetes.io/, topology.kubernetes.io/, karpenter.sh/ and eks.amazonaws.com/ are attached to every node automatically by the platform. Other labels (team=, workload-type=, gpu=true etc.) were added by a person with `kubectl label` or in node group / NodePool settings, so they can disappear when nodes are replaced (Karpenter consolidation, node group update) or moved to another node group — once only unlabeled nodes remain, the workload stops in Pending (Reddit 2023 upgrade thread: unschedulable after node labels changed during an upgrade).
    Verdict: if the user label is on no node at all, fail (already unschedulable now, or the label vanished after scheduling). If a production workload depends on it or the label is on only one node, warn (single-node dependency). Whether the label comes from node group / NodePool settings is something the session confirms from objects/nodepools and aws/nodegroups and writes down — a label from settings is guaranteed, so lower the severity.
  suggest: "Put the label into the node group (labels) or Karpenter NodePool (spec.template.metadata.labels) settings so it follows node replacement. Where possible switch to well-known labels (node.kubernetes.io/instance-type, topology.kubernetes.io/zone, karpenter.sh/capacity-type)."
  verify:
    - "kubectl get nodes -L <label key>"
    - "kubectl get nodepools -o jsonpath='{.items[*].spec.template.metadata.labels}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          key: "team"
          well_known: false
          workloads:
            - "prod/api"
          workload_count: 1
          prod_workloads: 1
          nodes_with_label: 0
          nodes_total: 3
      - expect: "warn"
        item:
          key: "team"
          well_known: false
          workloads:
            - "prod/api"
          workload_count: 1
          prod_workloads: 1
          nodes_with_label: 3
          nodes_total: 3
      - expect: "warn"
        item:
          key: "team"
          well_known: false
          workloads:
            - "prod/api"
          workload_count: 1
          prod_workloads: 0
          nodes_with_label: 1
          nodes_total: 3
      - expect: "pass"
        item:
          key: "team"
          well_known: false
          workloads:
            - "prod/api"
          workload_count: 1
          prod_workloads: 0
          nodes_with_label: 3
          nodes_total: 3
      - expect: "pass"
        item:
          key: "topology.kubernetes.io/zone"
          well_known: true
          workloads:
            - "prod/api"
          workload_count: 1
          prod_workloads: 1
          nodes_with_label: 0
          nodes_total: 3
- id: hygiene.helm-release-pure-defaults
  name: Production Helm release installed with pure chart defaults (resources, replicas and security settings never tuned)
  area: hygiene
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: hygiene.helm.releases
  rule:
    warn_expr: "item.get('pure_defaults') is True and item.get('prod') and item.get('status') == 'deployed'"
  target: "item['target']"
  evidence: "f\"{item['target']}: chart {item['chart']}, no user values (pure chart defaults), revision {item['revision']}, last changed {item.get('age_days')} days ago\""
  severity_default: low
  symptom_linked: false
  why: >
    Chart defaults are tuned to "start anywhere", so they carry settings like minimal resource requests, replicas 1, no PDB and loose security contexts. A release in a production namespace running on pure defaults with no user values means the operator has never adapted that component to the environment. Not an outage in itself, so low. Resources, PDBs and replicas are caught per workload by other checks (resources.*, resilience.*), so this one only reports "no tuning history".
    The material is `helm get values -o json` (tools/helm-values/) — null when there are no user values. On an EKS cluster helm-list was present and values arrived from the next collection on. Releases without a values file (user_values_keys null) are not judged.
  suggest: "Keep a values file per release in Git (helm upgrade -f values.yaml) and set at least resources, replicaCount, podDisruptionBudget and securityContext to environment values. Under Argo CD or Flux the values live in Git, which resolves this naturally."
  verify:
    - "helm get values <release> -n <ns>"
    - "helm show values <chart> | less"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          target: "prod/redis"
          chart: "redis-20.1.0"
          revision: 1
          age_days: 200
          status: "deployed"
          prod: true
          pure_defaults: true
          user_values_keys: []
      - expect: "pass"
        item:
          target: "prod/redis"
          chart: "redis-20.1.0"
          revision: 1
          age_days: 200
          status: "deployed"
          prod: true
          pure_defaults: false
          user_values_keys:
            - "resources"
      - expect: "pass"
        item:
          target: "prod/redis"
          chart: "redis-20.1.0"
          revision: 1
          age_days: 200
          status: "deployed"
          prod: false
          pure_defaults: true
          user_values_keys: []
      - expect: "pass"
        item:
          target: "prod/redis"
          chart: "redis-20.1.0"
          revision: 1
          age_days: 200
          status: "deployed"
          prod: true
          pure_defaults: null
          user_values_keys: null
- id: observability.alert-metric-without-dashboard
  name: Some metrics used by alert rules appear on no Grafana dashboard panel (an alert fires but there is nothing to look at)
  area: observability
  type: summary
  each: observability.grafana.dashboards_json
  cluster_level: true
  rule:
    warn_expr: "item.get('available') and (item.get('alert_metrics') or 0) > 0 and (item.get('alert_metrics_without_panel_count') or 0) / max(item.get('alert_metrics') or 1, 1) >= 0.3"
  target: "'grafana'"
  evidence: "f\"{item.get('read')} dashboards ({item.get('panel_metrics')} panel metrics) — {item.get('alert_metrics_without_panel_count')} of {item.get('alert_metrics')} alert-rule metrics have no panel: {', '.join((item.get('alert_metrics_without_panel') or [])[:6])}\" if item.get('available') else 'no dashboard JSON (grafana_api_token required)'"
  severity_default: low
  symptom_linked: false
  why: >
    An alert says "something is bad"; a dashboard shows how much, since when and together with what. If a metric used in an alert rule is on no dashboard panel, the on-call person has to type PromQL by hand after receiving the alert. If 30% or more of alert metrics are like that, warn (default). The material is the panel expr from dashboard JSON fetched via the Grafana API (/api/dashboards/uid/<uid>) — without a token there is no data and no verdict (value.available false).
    Not yet verified on a real cluster (grafana_api_token was unset). Dashboard variables ($__rate_interval etc.) and Loki panels are excluded from metric-name extraction, so the session re-reads the "no panel" list together with the dashboard titles before writing it up.
  suggest: "Add runbook_url and dashboard_url annotations to every alert rule, and add panels for the uncovered metrics to the component's dashboard (the kube-prometheus-stack default dashboards cover most kube_* and node_* metrics)."
  verify:
    - "curl -s -H 'Authorization: Bearer $TOKEN' $GRAFANA/api/search?type=dash-db | jq length"
    - "curl -s -H 'Authorization: Bearer $TOKEN' $GRAFANA/api/dashboards/uid/<uid> | jq '[.dashboard.panels[].targets[].expr]'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          available: true
          read: 20
          panel_metrics: 300
          alert_metrics: 40
          alert_metrics_without_panel_count: 15
          alert_metrics_without_panel:
            - "x_total"
      - expect: "pass"
        item:
          available: true
          read: 20
          panel_metrics: 300
          alert_metrics: 40
          alert_metrics_without_panel_count: 2
          alert_metrics_without_panel:
            - "x_total"
      - expect: "pass"
        item:
          available: false

- id: observability.ingress-controller-metrics-missing
  name: Ingress controller metrics are missing from Prometheus (latency, traffic and errors of every ingress backend lost at once)
  area: observability
  type: summary
  each: observability.golden_signals
  cluster_level: true
  rule:
    expr: "(item.get('ingresses') or 0) > 0 and (item.get('ingress_controller_metric_series') or 0) == 0 and not item.get('alb_cloudwatch_available') and len(item.get('namespaces_with_app_http_metrics') or []) < (item.get('ingresses') or 0)"
  target: "'ingress-controller'"
  evidence: "f\"{item.get('ingresses')} ingresses, 0 ingress-controller request metric series, namespaces with app http_* metrics {item.get('namespaces_with_app_http_metrics')}, ALB CloudWatch {item.get('alb_cloudwatch_available')} — per-backend gaps are the {len(item.get('missing_lte') or [])} golden-signals-missing (warn) findings\""
  severity_default: medium
  symptom_linked: false
  why: >
    ingress-nginx and Traefik expose request count, latency and response codes per ingress. If those metrics are not in Prometheus (no ServiceMonitor/PodMonitor, or controller.metrics.enabled false), every backend without its own app metrics loses all four golden signals at once. One cause, so one finding — the per-backend list (golden-signals-missing) is supporting material that shows the scope of this finding (on a small k3s cluster, all 20 such fails had this single cause).
  suggest: "ingress-nginx: Helm values controller.metrics.enabled=true and controller.metrics.serviceMonitor.enabled=true (match the kube-prometheus-stack release= label). Traefik: metrics.prometheus plus a ServiceMonitor."
  verify:
    - "kubectl get servicemonitor,podmonitor -A | grep -i -E 'ingress|traefik'"
    - "PromQL: sum(rate(nginx_ingress_controller_requests[5m])) by (ingress)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          ingresses: 29
          rows: []
          namespaces_with_app_http_metrics: []
          namespaces_with_saturation_metrics: []
          ingress_controller_metric_series: 0
          alb_cloudwatch_available: false
          alb_cloudwatch_collected: false
          missing_lte:
            - namespace: "a"
              ingress: "b"
          missing_saturation: []
      - expect: "pass"
        item:
          ingresses: 29
          rows: []
          namespaces_with_app_http_metrics: []
          namespaces_with_saturation_metrics: []
          ingress_controller_metric_series: 120
          alb_cloudwatch_available: false
          alb_cloudwatch_collected: false
          missing_lte:
            - namespace: "a"
              ingress: "b"
          missing_saturation: []
      - expect: "pass"
        item:
          ingresses: 29
          rows: []
          namespaces_with_app_http_metrics: []
          namespaces_with_saturation_metrics: []
          ingress_controller_metric_series: 0
          alb_cloudwatch_available: true
          alb_cloudwatch_collected: false
          missing_lte:
            - namespace: "a"
              ingress: "b"
          missing_saturation: []
      - expect: "pass"
        item:
          ingresses: 0
          rows: []
          namespaces_with_app_http_metrics: []
          namespaces_with_saturation_metrics: []
          ingress_controller_metric_series: 0
          alb_cloudwatch_available: false
          alb_cloudwatch_collected: false
          missing_lte:
            - namespace: "a"
              ingress: "b"
          missing_saturation: []
