- id: tenancy.dev-shares-prod-nodes
  name: dev pods run on the same nodes as production pods
  area: tenancy
  type: summary
  each: tenancy.isolation.nodes
  rule:
    expr: "item['shares_dev_prod'] and item['separation_possible'] and (item['memory_limit_overcommit'] or 0) >= 1.5"
    warn_expr: "item['shares_dev_prod'] and item['separation_possible']"
  target: "item['node']"
  evidence: "f\"Node {item['node']} (pool {item['pool']}): prod pods {item['prod_pods']} ({item['prod_namespaces']}) together with dev pods {item['dev_pods']} ({item['dev_namespaces']}). Memory limit total/allocatable {item['memory_limit_overcommit']}, CPU limit total/allocatable {item['cpu_limit_overcommit']}, containers without a memory limit {item['containers_without_memory_limit']}\""
  severity_default: low
  symptom_linked: false
  why: >
    dev is where experimental deploys, debug tools and containers without limits show up. If the memory limit total on a shared node exceeds 1.5x allocatable, a dev memory leak spreads into production OOMs and evictions.
    Sharing dev and prod nodes is a common cost choice on small clusters, so fail only when overcommit (limit total ≥ 1.5x) coincides.
