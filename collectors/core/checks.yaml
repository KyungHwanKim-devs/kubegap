          separation_possible: true
- id: tenancy.noisy-neighbor
  name: Noisy neighbor — does a tenant's usage spike coincide in time with another tenant's latency or throttling (LLM judgement)
  area: tenancy
  type: llm
  inputs: "summary.json tenancy.noisy (nodes_saturated_7d, dominated_shared_nodes, burst_tenants, throttled_prod, top_cpu_share) · tenancy.isolation.nodes · traffic.ingresses[].metrics(p95) · resources.p95 · metrics/namespace_node_cpu_share_p95_7d.json · metrics/node_cpu_saturated_minutes_7d.json · metrics/namespace_cpu_throttled_ratio_7d.json"
  target: "'cluster'"
  severity_default: medium
  symptom_linked: true
  why: >
    A noisy neighbor cannot be caught by one rule. The code gathers the material: (1) minutes a node spent above 90% CPU (7 days), (2) the namespace that dominates that node and its share, (3) bursty tenants (7-day max/median), (4) CPU throttle ratio of production namespaces, (5) the tenant mix on each node.
    If (1) is 0, the LLM writes "no room for neighbor damage in this window" and stops. If (1) > 0, it notes whether the dominant namespace (2) and the throttling (4) or ingress p95 (traffic section) of production on that node overlap on the same node, and because the material is instant values it writes "insufficient evidence — a range query at that time is needed" for time correlation. It does not assert.
    Measured on an EKS cluster and a k3s: 0 saturated minutes on both. A 17% throttle ratio in one small k3s cluster production namespace is more likely caused by its own limit (resources section) than by a neighbor — write it that way.
  suggest: "If there is a candidate node, put per-namespace CPU on that node (sum by (namespace) rate(...) {node=...}) and production ingress p95 on the same time axis and look for overlap. If they overlap, a limits.cpu quota or a dedicated pool for the dominant tenant."
  verify:
    - "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]) * on (namespace, pod) group_left(node) kube_pod_info{node=\"<node>\"})"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "llm"

# --- Checks added after the first real runs ---
- id: hygiene.failed-pods-lingering
  name: Failed-phase pods pile up without being deleted (Evicted, UnexpectedAdmissionError)
  area: hygiene
  type: summary
  each: hygiene.failed_pods.summary
  cluster_level: true
  rule:
    expr: "item['count'] >= 10 or item['prod'] >= 5"
    warn_expr: "item['count'] >= 1"
  target: "'cluster'"
  evidence: "f\"Failed pods {item['count']} (prod {item['prod']}), reasons {item['by_reason']}, namespaces {item['by_namespace']}, oldest {item['oldest_h']}h. Example: {item['sample']}\""
  severity_default: low
  symptom_linked: false
  why: >
    An Evicted pod's object remains even after the ReplicaSet has created a replacement. Nobody deletes it until kube-controller-manager's terminated-pod-gc-threshold (default 12,500) is reached.
    `kubectl get pods` gets cluttered, and more importantly **why the pod was evicted (node disk or memory pressure)** is buried uninvestigated. Job-owned pods belong to resilience.finished-jobs-accumulating and are excluded.
    Measured on a real EKS cluster: 12 Evicted pods (7 in one production namespace), the oldest 31 days.
  suggest: "Read the reasons with `kubectl get pods -A --field-selector status.phase=Failed` and delete them. If evictions recur, look at that node's DiskPressure/MemoryPressure first (node and events sections)."
  verify:
    - "kubectl get pods -A --field-selector status.phase=Failed -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,REASON:.status.reason,AGE:.metadata.creationTimestamp"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          count: 12
          by_reason:
            Evicted: 12
          by_namespace:
            prod-d: 7
            prod-f: 2
            prod-e: 2
            dev-a: 1
          oldest_h: 751.2
          prod: 11
          sample:
            - "prod-f/app-g-dd59d5f64-mtlw6"
            - "dev-a/app-a-ai-7cdbdc7544-f94b5"
            - "prod-m/app-g-dd59d5f64-65mrp"
            - "prod-e/app-f-frontend-6bcb5c9597-656ft"
            - "prod-n/app-f-backend-fcdc97cc9-dpc8t"
            - "prod-d/app-e-backend-b777fdcd9-297gb"
      - expect: "warn"
        item:
          count: 2
          by_reason:
            Evicted: 2
          by_namespace:
            prod-d: 7
            prod-f: 2
            prod-e: 2
            dev-a: 1
          oldest_h: 751.2
          prod: 0
          sample:
            - "prod-f/app-g-dd59d5f64-mtlw6"
            - "dev-a/app-a-ai-7cdbdc7544-f94b5"
            - "prod-m/app-g-dd59d5f64-65mrp"
            - "prod-e/app-f-frontend-6bcb5c9597-656ft"
            - "prod-n/app-f-backend-fcdc97cc9-dpc8t"
            - "prod-d/app-e-backend-b777fdcd9-297gb"
      - expect: "pass"
        item:
          count: 0
          by_reason: {}
          by_namespace: {}
          oldest_h: null
          prod: 0
          sample: []
- id: hygiene.no-ephemeral-storage-requests
  name: Almost no ephemeral-storage requests (eviction order is arbitrary under node disk pressure)
  area: hygiene
  type: summary
  each: hygiene.ephemeral.summary
  cluster_level: true
  rule:
    expr: "(item['request_ratio'] or 0) < 0.1 and len(item['emptydir_without_sizelimit_prod']) > 0"
    warn_expr: "(item['request_ratio'] or 0) < 0.5 and item['prod_without_request'] > 0"
  target: "'cluster'"
  evidence: "f\"Containers with an ephemeral-storage request {item['with_request']} of {item['containers']} ({item['request_ratio']}), without one in prod {item['prod_without_request']}. emptyDirs without sizeLimit {item['emptydir_without_sizelimit']} (prod: {item['emptydir_without_sizelimit_prod']})\""
  severity_default: low
  symptom_linked: false
  why: >
    When the node disk (logs, emptyDir, writable layer) fills up, the kubelet evicts pods for DiskPressure; without ephemeral-storage requests there is no record of who agreed to use how much, so eviction order is arbitrary and the scheduler ignores disk entirely.
    An emptyDir without sizeLimit lets one pod consume the whole node disk. To pin down the container behind a node at 87% disk (seen on a first real run), read it together with writable_layers_top in the node section.
  suggest: "Set an ephemeral-storage request (e.g. 1Gi) and limit on production containers and a sizeLimit on emptyDirs. Enforce per namespace with LimitRange defaults."
  verify:
    - "kubectl get pods -A -o json | jq '[.items[].spec.containers[] | select(.resources.requests[\"ephemeral-storage\"] == null)] | length'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          containers: 111
          with_request: 1
          request_ratio: 0.009
          prod_without_request: 33
          emptydir_without_sizelimit: 21
          emptydir_without_sizelimit_prod:
            - "prod-a/statefulset/pg"
      - expect: "warn"
        item:
          containers: 111
          with_request: 1
          request_ratio: 0.3
          prod_without_request: 5
          emptydir_without_sizelimit: 21
          emptydir_without_sizelimit_prod: []
      - expect: "pass"
        item:
          containers: 111
          with_request: 1
          request_ratio: 0.9
          prod_without_request: 0
          emptydir_without_sizelimit: 21
          emptydir_without_sizelimit_prod: []
