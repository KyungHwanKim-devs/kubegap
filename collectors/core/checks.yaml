- id: scaling.karpenter-expired-not-replaced
  name: Karpenter node past expireAfter has not been replaced
  area: scaling
  type: summary
  each: scaling.karpenter.expired_not_replaced
  rule:
    expr: "True"
  target: "item['name']"
  evidence: "f\"NodeClaim {item['name']} → node {item['node']} ({item['instance_type']} {item['capacity_type']}): age {item['age_h']}h, {item['hours_past_expiry']}h past expireAfter {item['expire_after_h']}h. Blocking reason (DisruptionBlocked): {item['disruption_blocked']}. do-not-disrupt pods on this node {item.get('do_not_disrupt_pod_count', '?')}: {', '.join(item.get('do_not_disrupt_pods') or []) or 'none (the pods in the event are gone, or a PDB is the cause)'}\""
  severity_default: medium
  symptom_linked: false
  why: >
    expireAfter periodically rotates nodes onto a fresh AMI so they receive security patches. If a node is expired but still there a day later, something is blocking disruption: a pod's `karpenter.sh/do-not-disrupt` annotation, a PDB, or a zero budget (scaling.karpenter-budget-zero).
    Measured on a real EKS cluster: a node stayed more than 31 days because of one pod's do-not-disrupt annotation, and 27 production pods and 87% disk usage piled up on it.
  suggest: "Resolve the cause in the DisruptionBlocked message (remove the annotation, relax the PDB). Spread that node's pods first (topologySpread) before replacing it."
  verify:
    - "kubectl get events -A --field-selector reason=DisruptionBlocked -o custom-columns=OBJ:.involvedObject.name,MSG:.message | sort | uniq -c"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          name: "default-abc"
          pool: "default"
          node: "node-a"
          instance_type: "r7g.large"
          capacity_type: "spot"
          zone: "us-east-1a"
          arch: "arm64"
          created: "2026-10-25T00:00:00Z"
          age_h: 748.0
          launched_s: 5
          registered_s: 50
          initialized_s: 65
          ready: true
          expired: true
          drifted: false
          expire_after_h: 720.0
          hours_past_expiry: 28.0
          disruption_blocked:
            do-not-disrupt pods: 100
          allocatable_cpu: "1930m"
      - expect: "none"

- id: scaling.karpenter-no-interruption-queue
  name: Spot nodes in use but Karpenter has no interruption queue (interruptionQueue)
  area: scaling
  type: summary
  each: scaling.karpenter
  cluster_level: true
  rule:
    expr: "item.get('present') and (item.get('spot_nodeclaims') or 0) > 0 and not item.get('interruption_queue')"
  target: "'cluster'"
  evidence: "f\"Spot NodeClaims {item.get('spot_nodeclaims')} / total {item.get('nodeclaim_count')}, INTERRUPTION_QUEUE {item.get('interruption_queue')}\""
  severity_default: high
  symptom_linked: true
  why: >
    EC2 gives a 2-minute warning before reclaiming a spot instance. If Karpenter receives it through an SQS queue (interruptionQueue) it launches a replacement node and cordons/drains in advance. Without it the node simply disappears after 2 minutes and the pods die.
  suggest: "Karpenter Helm value `settings.interruptionQueue` and an EventBridge rule (EC2 Spot Instance Interruption Warning → SQS)."
  verify:
    - "kubectl -n karpenter get deploy karpenter -o jsonpath='{.spec.template.spec.containers[0].env}' | jq '.[] | select(.name==\"INTERRUPTION_QUEUE\")'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          interruption_queue: null
          nodeclaim_count: 3
          spot_nodeclaims: 2
          spot_ratio: 0.67
          launch_failures_24h: {}
          nodeclaims_launched_24h: 2
          disruptions_24h: {}
      - expect: "pass"
        item:
          present: true
          interruption_queue: "q"
          nodeclaim_count: 3
          spot_nodeclaims: 2
          spot_ratio: 0.67
          launch_failures_24h: {}
          nodeclaims_launched_24h: 2
          disruptions_24h: {}
      - expect: "pass"
        item:
          present: false

- id: scaling.karpenter-nodepool-no-limits
  name: Karpenter NodePool has no limits (no cost ceiling)
  area: scaling
  type: summary
  each: scaling.karpenter.nodepools
  rule:
    expr: "not item['has_limits']"
  target: "item['name']"
  evidence: "f\"NodePool {item['name']}: limits {item['limits']}, NodeClaims {item['nodeclaims']}, consolidation {item['consolidation_policy']}\""
  severity_default: medium
  symptom_linked: false
  why: Without limits, a single bad request (or an endlessly retrying Job) keeps launching nodes. It is the last safety net against a cost incident.
  suggest: "spec.limits: {cpu: <2-3x the current total>, memory: …}."
  verify:
    - "kubectl get nodepools -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.spec.limits}{\"\\n\"}{end}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          name: "default"
          limits: {}
          has_limits: false
          nodeclaims: 2
          consolidation_policy: "WhenUnderutilized"
      - expect: "pass"
        item:
          name: "default"
          limits:
            cpu: 100
          has_limits: true
          nodeclaims: 2
          consolidation_policy: "WhenUnderutilized"

- id: scaling.karpenter-launch-failures
  name: Karpenter node launches keep failing (capacity shortage etc.)
  area: scaling
  type: summary
  each: scaling.karpenter
  cluster_level: true
  rule:
    expr: "sum((item.get('launch_failures_24h') or {}).values()) >= 10"
    warn_expr: "sum((item.get('launch_failures_24h') or {}).values()) >= 1"
  target: "'cluster'"
  evidence: "f\"24h launch failures {item.get('launch_failures_24h')}, launched {item.get('nodeclaims_launched_24h')}, disruptions executed {item.get('disruptions_24h')}\""
  severity_default: medium
  symptom_linked: true
  why: InsufficientInstanceCapacity and MaxSpotInstanceCountExceeded mean there is no spot capacity for that AZ and instance type. With narrow NodePool requirements (one or two types) it repeats. Meanwhile pods stay Pending.
  suggest: "Widen the NodePool requirements (instance-category and generation ranges, several AZs, an on-demand fallback pool with weight)."
  verify:
    - "kubectl -n karpenter logs deploy/karpenter --since=24h | grep -ciE 'insufficient|failed launching'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          interruption_queue: "q"
          nodeclaim_count: 3
          spot_nodeclaims: 2
          spot_ratio: 0.67
          launch_failures_24h:
            InsufficientInstanceCapacity: 12
          nodeclaims_launched_24h: 2
          disruptions_24h: {}
      - expect: "warn"
        item:
          present: true
          interruption_queue: "q"
          nodeclaim_count: 3
          spot_nodeclaims: 2
          spot_ratio: 0.67
          launch_failures_24h:
            insufficient capacity: 1
          nodeclaims_launched_24h: 2
          disruptions_24h: {}
      - expect: "pass"
        item:
          present: true
          interruption_queue: "q"
          nodeclaim_count: 3
          spot_nodeclaims: 2
          spot_ratio: 0.67
          launch_failures_24h: {}
          nodeclaims_launched_24h: 2
          disruptions_24h: {}

- id: scaling.karpenter-budget-zero
  name: Karpenter disruption budget is 0 (node replacement and consolidation permanently blocked)
  area: cost
  type: object
  inputs: [objects/nodepools.karpenter.sh.json]
  profiles: [prod]
  rule:
    expr: "karpenter_pool_nodes(obj['metadata']['name']) > 0 and karpenter_budget_allowed(spec, karpenter_pool_nodes(obj['metadata']['name'])) == 0"
  evidence: "f\"budgets {((spec.get('disruption') or {}).get('budgets'))}, NodeClaims in the pool {karpenter_pool_nodes(obj['metadata']['name'])} → allowed disruptions {karpenter_budget_allowed(spec, karpenter_pool_nodes(obj['metadata']['name']))} (percentages are rounded up). expireAfter {(spec.get('disruption') or {}).get('expireAfter')}, consolidationPolicy {(spec.get('disruption') or {}).get('consolidationPolicy')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Karpenter rounds percentage budgets up (allowed = roundup(nodes × ratio) − deleting − NotReady). So `nodes: "10%"` allows 1 even with a single node,
    and allowed 0 only happens when a budget without a schedule is set to `nodes: "0"` or `"0%"`. Then expiry (expireAfter), drift and consolidation are blocked permanently. A pool with 0 nodes has nothing to delete, so pass.
    Measured on a real EKS cluster: all four pools at 10%, and the `default` pool with 2-4 nodes executed 4 disruptions in a day. An earlier report that said "computed as 0, no disruption" was a floor-rounding bug in this check.
  suggest: "If a permanent block is not the intent, switch to a budget with a schedule or set `nodes: \"1\"` or more. To protect specific nodes only, use the pod annotation `karpenter.sh/do-not-disrupt`."
  verify:
    - "kubectl get nodepool -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.spec.disruption.budgets}{\"\\n\"}{end}'; kubectl get nodeclaims -L karpenter.sh/nodepool"
    - "kubectl logs -n karpenter deploy/karpenter --since=24h | grep -c 'disrupting via'"
  notes: Fixed after a review of a real EKS run (floor → ceil, pool with 0 nodes passes).
  test:
    profile: "eks"
    cases:
      - expect: "fail"
        objects:
          nodepools.karpenter.sh:
            - metadata:
                name: "default"
              spec:
                disruption:
                  budgets:
                    - nodes: "0"
                  expireAfter: "720h"
                  consolidationPolicy: "WhenUnderutilized"
          nodeclaims.karpenter.sh:
            - metadata:
                name: "default-x"
                labels:
                  karpenter.sh/nodepool: "default"
      - expect: "pass"
        objects:
          nodepools.karpenter.sh:
            - metadata:
                name: "default"
              spec:
                disruption:
                  budgets:
                    - nodes: "10%"
                  expireAfter: "720h"
          nodeclaims.karpenter.sh:
            - metadata:
                name: "default-x"
                labels:
                  karpenter.sh/nodepool: "default"
      - expect: "pass"
        objects:
          nodepools.karpenter.sh:
            - metadata:
                name: "empty"
              spec:
                disruption:
                  budgets:
                    - nodes: "0"
          nodeclaims.karpenter.sh: []

