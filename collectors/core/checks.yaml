- id: resilience.no-prestop
  name: Production Deployments without a preStop hook (traffic-receiving)
  area: resilience
  type: object
  inputs: [objects/deployments.json]
  rule:
    # warn-only (no expr): a best-practice gap, so warn rather than fail. The interaction with ALB deregistration is covered by traffic.alb-deregistration-vs-grace
    warn_expr: "prod and serves_traffic(obj) and all(not ((c.get('lifecycle') or {}).get('preStop')) for c in containers(obj))"
  evidence: "f\"no preStop, terminationGracePeriodSeconds {pod_spec(obj).get('terminationGracePeriodSeconds', 30)}\""
  severity_default: low
  symptom_linked: true
  why: >
    On pod deletion SIGTERM and endpoint removal start at the same time, and endpoint removal takes seconds to propagate (longer with an ALB). If the app exits immediately on SIGTERM, requests arriving in that window get 502.
  cases:
    - { who: Ravelin, url: https://syslog.ravelin.com/graceful-shutdown-in-kubernetes-is-not-always-trivial-7a8f6a4f6c7c }
  suggest: "preStop: sleep 5-10 to wait for propagation before shutting down. Set terminationGracePeriodSeconds longer than the in-flight processing time. The app should reject new requests on SIGTERM and finish the ones in progress."
  verify:
    - "kubectl get deploy -n <ns> <name> -o jsonpath='{.spec.template.spec.containers[*].lifecycle}'"
  profiles: [prod, lab]

