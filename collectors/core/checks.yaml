- id: node.sysctl-tuning
  name: sysctl values differ from the Kubernetes node recommendations
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "any(i.startswith('net.ipv4.ip_forward') for i in item['sysctl']['issues'])"
    warn_expr: "len(item['sysctl']['issues']) > 0"
  target: "item['node']"
  evidence: "f\"{item['sysctl']['issues']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The inotify instance limit (default 128) is the most common reason kubectl logs and Promtail stop with 'too many open files' on nodes with many pods and log collectors (k3s docs recommend 8192).
    vm.max_map_count is required by Elasticsearch/OpenSearch (262144), and ip_forward=0 breaks pod networking.
  suggest: "Write them to /etc/sysctl.d/90-kubegap.conf so they survive reboots. On EKS put them in the node group launch template user-data or the Karpenter EC2NodeClass userData."
  notes: "When fs.inotify.max_user_instances or max_user_watches is low, log collectors (promtail, fluent-bit) cannot open files (too many open files). If the same report has promtail.too-many-open-files in logs.signatures (or too many open files in unclassified_errors), the cause of this check is confirmed. Report the two as one item."
  verify:
    - "sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches net.core.somaxconn vm.max_map_count"
  test:
    cases:
      - expect: "fail"
        item:
          node: "node-1"
          roles:
            - "worker"
          collected: true
          meta:
            root: true
            kernel: "5.15.0-100"
            os: "Ubuntu 22.04"
            uptime_days: 30.0
            loadavg: "0.5"
            nproc: 8
            mem_total_gb: 31.0
            containerd_version: "1.7.0"
            zombies: 0
            kubelet_rss_mb: 100
          kernel:
            source: "journalctl -k"
            window: "24h"
            lines: 100
