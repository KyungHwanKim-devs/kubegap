- id: node.zombie-processes
  name: Zombie processes accumulating
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['meta']['zombies'] >= 50"
    warn_expr: "item['meta']['zombies'] >= 10"
  target: "item['node']"
  evidence: "f\"{item['meta']['zombies']} zombie processes (ps stat Z)\""
