- id: resilience.backup-same-node
  name: DB backup (dump) stays only on the same node disk as the source (no off-node copy)
  area: resilience
  type: summary
  each: resilience.backup.rows
  rule:
    expr: "item['same_node_as_source'] and not item['offsite_hint'] and item['prod'] and not item['suspend']"
    warn_expr: "item['local_only'] and not item['suspend']"
  target: "item['target']"
  evidence: "f\"{item['target']}: schedule '{item['schedule']}', dump PVCs {item['dest_pvcs']} → nodes {item['dest_nodes']}, hostPath {item['host_paths']}, source DB {[(s['workload'], s['node']) for s in item['source_db']]}, off-node copy hint (s3, rclone, restic) {item['offsite_hint']}\""
  severity_default: high
  symptom_linked: false
  why: >
    The purpose of a backup is to recover even when the node disk dies. If the dump PVC is local-path on the same node as the source DB, a single disk failure takes source and backup together.
    A network volume such as EBS survives node failure but not an AZ or account incident — so the check still looks for a second copy to another store such as S3 (offsite_hint). The hint is a string match on commands, args and env values, so it is a candidate.
    Measured on a k3s k3s: 5 of 7 backup CronJobs dumped to the same node as the source, and none of the 7 showed any off-node copy.
  suggest: "After the dump, send a copy off the node (S3, B2, NAS) with `rclone copy`, `aws s3 cp` or restic. At minimum put the dump PVC on a different node (nodeSelector) and rehearse a restore once."
  verify:
    - "kubectl get cronjob -n <ns> <name> -o yaml | grep -A3 -E 'command|args|persistentVolumeClaim' ; kubectl get pv -o custom-columns=PV:.metadata.name,CLAIM:.spec.claimRef.name,NODE:.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-h"
          name: "app-i-postgres-backup"
          target: "prod-h/app-i-postgres-backup"
          prod: true
          schedule: "30 3 * * *"
          suspend: false
          dest_pvcs:
            - "app-i-postgres-backup-pvc"
          dest_nodes:
            - "node-b"
          host_paths: []
          offsite_hint: false
          source_db:
            - workload: "prod-h/statefulset/app-i-postgres"
              pvc: "app-i-postgres-data-app-i-postgres-0"
              node: "node-b"
            - workload: "prod-h/statefulset/app-i-postgres-mx"
              pvc: "app-i-postgres-mx-data-app-i-postgres-mx-0"
              node: "node-b"
            - workload: "prod-h/statefulset/app-i-postgres-vn"
              pvc: "app-i-postgres-vn-data-app-i-postgres-vn-0"
              node: "node-b"
            - workload: "prod-h/statefulset/app-i-redis"
              pvc: "app-i-redis-data-app-i-redis-0"
              node: "node-b"
          source_nodes:
            - "node-b"
          same_node_as_source: true
          local_only: true
          note: "offsite_hint records whether the command, args or env values contain a string such as s3, rclone or restic (names only, values are not recorded)"
      - expect: "warn"
        item:
          namespace: "prod-h"
          name: "app-i-postgres-backup"
          target: "prod-h/app-i-postgres-backup"
          prod: true
          schedule: "30 3 * * *"
          suspend: false
          dest_pvcs:
            - "app-i-postgres-backup-pvc"
          dest_nodes:
            - "node-a"
          host_paths: []
          offsite_hint: false
          source_db:
            - workload: "prod-h/statefulset/app-i-postgres"
              pvc: "app-i-postgres-data-app-i-postgres-0"
              node: "node-b"
            - workload: "prod-h/statefulset/app-i-postgres-mx"
              pvc: "app-i-postgres-mx-data-app-i-postgres-mx-0"
              node: "node-b"
            - workload: "prod-h/statefulset/app-i-postgres-vn"
