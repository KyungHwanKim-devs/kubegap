- id: tenancy.burst-tenant-unbounded
  name: Bursty tenant (7-day max at least 5x the median) has no quota
  area: tenancy
  type: summary
  each: tenancy.namespaces.rows
  rule:
    expr: "(item['burst_ratio_7d'] or 0) >= 10 and (item['cpu_max_7d'] or 0) >= 1.0 and not item['has_quota'] and item['shares_nodes_with_prod'] and not item['system']"
    warn_expr: "(item['burst_ratio_7d'] or 0) >= 5 and (item['cpu_max_7d'] or 0) >= 0.5 and not item['has_quota'] and not item['system']"
  target: "item['namespace']"
  evidence: "f\"{item['namespace']} ({item['kind']}): 7d CPU median {item['cpu_median_7d']} cores, p95 {item['cpu_p95_7d']} cores, max {item['cpu_max_7d']} cores = {item['burst_ratio_7d']}x the median. No quota, shares nodes with prod {item['shares_nodes_with_prod']}, nodes {item['nodes']}, CPU limit total {item['cpu_limits']} cores\""
  severity_default: medium
  symptom_linked: false
  why: >
    A tenant that is quiet most of the time and spikes tens of times higher (batch, CronJob, CI, AI inference) is invisible in averages. Without a quota or limits, that peak pushes out neighbors on the same node (noisy neighbor).
    Measured on a real EKS cluster: a production backend namespace went from a median of 0.012 cores to a max of 2.6 cores (227x), no quota, sharing nodes with other production namespaces. On a k3s: 15.6x.
  suggest: "Put a ResourceQuota (limits.cpu) and container CPU limits on that namespace, or for batch workloads a PriorityClass lower than production. To identify the peak (which pod, what time), look up the time of max_over_time in Prometheus."
  verify:
    - "max_over_time(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"<ns>\",container!=\"\"}[5m]))[7d:15m])"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          namespace: "prod-d"
          kind: "prod"
          prod: true
          system: false
          pods: 8
          workloads: 5
          cpu_requests: 0.35
          cpu_limits: 3.6
          memory_requests_gb: 1.62
          memory_limits_gb: 4.62
          containers_without_requests: 0
          containers_without_memory_limit: 0
          has_quota: false
          quota_names: []
          quota_max_ratio: null
          has_limitrange: false
          limitrange_default_request: false
          networkpolicies: 0
          networkpolicy_enforced: false
          psa_enforce: null
          rbac_subjects: []
          rbac_subject_count: 0
          nodes:
            node-a: 4
            node-b: 3
            node-c: 1
          node_count: 3
          pools:
            default: 7
            system-core-ng: 1
          shares_nodes_with_prod: true
          cpu_p95_7d: 0.111
          cpu_max_7d: 2.627
          cpu_median_7d: 0.012
          burst_ratio_7d: 227.1
          cpu_share_of_cluster_p95: 0.127
          memory_p95_7d_gb: 1.9
          throttled_ratio_7d: 0.016
          node_share_p95_max: 0.032
          node_share_p95_max_node: "node-d"
          tenants_total: 13
          separation_possible: true
      - expect: "warn"
