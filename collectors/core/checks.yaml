- id: node.os-updates-pending
  name: OS security updates pending
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "(item['updates'].get('security_updates') or 0) >= 20"
    warn_expr: "(item['updates'].get('security_updates') or 0) >= 1"
  target: "item['node']"
  evidence: "f\"{item['updates'].get('updates_total')} updates pending, {item['updates'].get('security_updates')} of them security (per Ubuntu update-notifier). OS {item['meta']['os']}\""
  severity_default: low
  symptom_linked: false
  why: Node OS patching is the area nobody looks at. On EKS, patching means replacing the AMI (eks.node-os-skew); on a small k3s cluster without unattended-upgrades, updates pile up forever.
  suggest: Enable unattended-upgrades (security only, automatic) and handle reboots with kured or a monthly procedure.
