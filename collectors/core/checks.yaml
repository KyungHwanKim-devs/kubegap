- id: node.kubelet-reserved-missing
  name: kubelet system reservations missing (kubeReserved/systemReserved)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  profiles: [prod, lab]
  each: nodeos.nodes
  rule:
    expr: "item['kubelet'].get('available') and item['kubelet'].get('reserved_missing')"
  target: "item['node']"
  evidence: "f\"configz kubeReserved {item['kubelet'].get('kube_reserved')}, systemReserved {item['kubelet'].get('system_reserved')}, enforceNodeAllocatable {item['kubelet'].get('enforce_node_allocatable')}, maxPods {item['kubelet'].get('max_pods')}. Node memory {item['meta']['mem_total_gb']}GB\""
  severity_default: medium
  symptom_linked: false
  why: Without reservations, pods can use all of the node's memory and kubelet, containerd and sshd become the OOM victims (the typical cause of node.kernel-oom-node-level). EKS bootstrap sets kubeReserved; the k3s default is empty.
  suggest: "k3s: add `kube-reserved=cpu=200m,memory=512Mi` and `system-reserved=cpu=200m,memory=512Mi` to kubelet-arg in /etc/rancher/k3s/config.yaml (scale with node size)."
