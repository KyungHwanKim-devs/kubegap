- id: platform.k3s-datastore-large
  name: k3s datastore DB is large (near the 2GiB etcd quota)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.cluster.datastore
  cluster_level: true
  rule:
    expr: "item['kind'] == 'etcd' and (item['db_ratio'] or 0) >= 0.85"
    warn_expr: "(item['db_mb'] or 0) >= 1024"
  target: "'cluster'"
  evidence: "f\"datastore {item['kind']} DB {item['db_mb']}MB (quota {item['quota_mb']}MB, ratio {item['db_ratio']}), servers {item['servers']}\""
  severity_default: high
  symptom_linked: false
  why: >
    Once etcd exceeds its default 2GiB quota it rejects writes (NOSPACE alarm) and the cluster becomes read-only; compaction and defragmentation are needed before that. k3s compacts automatically every 5 minutes but never defragments, so the du size (file) stays larger than the logical size. Clusters that write many events and CR statuses (Argo CD Applications, cert-manager Orders) grow fast. kine (SQLite) has no quota but slows down past 1GB.
    Measured on a 2-node k3s k3s: 578MB (28%) -> pass.
  suggest: "After k3s etcd-snapshot, run ETCDCTL_API=3 etcdctl --endpoints 127.0.0.1:2379 defrag (certificates in /var/lib/rancher/k3s/server/tls/etcd/). Find large key ranges with etcdctl get --prefix --keys-only /registry/events | wc -l."
  verify:
    - "ssh <server> sudo du -sm /var/lib/rancher/k3s/server/db"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          kind: "etcd"
          servers:
            - "node-b"
          db_mb: 1800
          quota_mb: 2048
