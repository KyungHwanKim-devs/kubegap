  target: "item['node']"
  evidence: "f\"earliest expiry in {(item.get('server') or {}).get('certificates_min_days_left')} days. Expiring within 90 days: {[(c['file'], c['name'], c['days_left']) for c in (item.get('server') or {}).get('certificates_expiring_90d') or []][:6]}\""
