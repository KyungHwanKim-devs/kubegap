- id: node.thermal-high
  name: Node temperature high
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    expr: "(item.get('thermal_max_c') or 0) >= 85"
    warn_expr: "(item.get('thermal_max_c') or 0) >= 75"
  target: "item['node']"
  evidence: "f\"thermal zone {item.get('thermal_c')} ℃\""
  severity_default: medium
  symptom_linked: true
  why: On PC-class nodes thermal throttling looks like CPU throttling. High temperature makes performance erratic and shortens disk life.
