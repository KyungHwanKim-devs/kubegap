- id: platform.k3s-etcd-snapshot-stale
  name: Embedded etcd snapshots missing or stale
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    expr: "item.get('role') == 'server' and (item.get('server') or {}).get('db_kind') == 'etcd' and ((item.get('server') or {}).get('etcd_snapshots') is not None) and (not (item.get('server') or {}).get('etcd_snapshots') or ((item.get('server') or {}).get('snapshot_latest_age_h') or 0) > 26) and 'k3s etcd-snapshot ls (no sudoers entry or no snapshots)' not in item.get('gaps', [])"
    warn_expr: "item.get('role') == 'server' and (item.get('server') or {}).get('db_kind') == 'etcd' and ((item.get('server') or {}).get('snapshot_interval_h') or 0) > 13"
  target: "item['node']"
  evidence: "f\"{len((item.get('server') or {}).get('etcd_snapshots') or [])} snapshots, latest {(item.get('server') or {}).get('snapshot_latest_age_h')}h ago, interval {(item.get('server') or {}).get('snapshot_interval_h')}h, latest size {((item.get('server') or {}).get('etcd_snapshots') or [{}])[-1].get('size_mb')}MB\""
  severity_default: high
  symptom_linked: false
  why: `k3s etcd-snapshot` (default every 12 hours, 5 kept) is the only backup of the embedded etcd. If snapshots stop, a disk failure loses the whole cluster state (every object).
  suggest: "Check `--etcd-snapshot-schedule-cron` and `--etcd-snapshot-retention`, and look in the journal for failing `k3s etcd-snapshot save`."
