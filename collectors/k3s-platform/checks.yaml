- id: platform.k3s-journald-unbounded
  name: No journald size cap (k3s logs fill the disk)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    warn_expr: "item.get('journald') is not None and not item['journald'].get('bounded') and (item['journald'].get('disk_mb') or 0) >= 500"
  target: "item['node']"
  evidence: "f\"journald usage {item['journald'].get('disk_mb')}MB, no journald.conf setting (default: 10% of the filesystem, max 4GB), k3s log lines in 24h {item['journald'].get('k3s_lines_24h')}\""
  severity_default: low
  symptom_linked: false
  why: k3s writes every component's logs into a single journald (measured at tens of thousands of lines a day). Without a cap it grows to the default (10% of the filesystem, max 4GB), which is noticeable on a small root disk. Retention is also undefined, so during an investigation you do not know how much history is left.
