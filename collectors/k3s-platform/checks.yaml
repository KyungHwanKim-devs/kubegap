# k3s platform checks. Input: summary.k3s (lib/k3s.py). All small k3s cluster profile; on EKS the collector itself is disabled.
- id: platform.k3s-secrets-encryption-off
  name: k3s Secret encryption at rest is off (--secrets-encryption)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    expr: "item.get('role') == 'server' and str(((item.get('server') or {}).get('secrets_encryption') or '')).startswith('Disabled')"
  target: "item['node']"
  evidence: "f\"k3s secrets-encrypt status: {(item.get('server') or {}).get('secrets_encryption')}. Datastore {(item.get('server') or {}).get('db_kind')} {(item.get('server') or {}).get('db_mb')}MB\""
  severity_default: medium
  symptom_linked: false
  why: Secrets sit in plaintext in etcd (or SQLite). Anyone who can read the datastore files or snapshots (`db/snapshots/`) can read every Secret. `--secrets-encryption` is the k3s counterpart of EKS KMS envelope encryption.
  suggest: "Add `--secrets-encryption` to the server arguments, restart, then run `k3s secrets-encrypt reencrypt` (re-encrypts existing Secrets). Check snapshot file permissions as well."
  verify:
    - "sudo k3s secrets-encrypt status"
  notes: k3s secrets encryption
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          node: "node-b"
          role: "server"
          collected: true
          version: "v1.33.5+k3s1"
          args: []
          disable: []
          tls_san: []
          node_ip: "192.0.2.102"
          server_url: null
          pod_cidr: "10.42.0.0/24"
          unit:
            restarts: 0
            since: "x"
          check_config:
            missing: []
            status: "pass"
          ports: []
          apiserver_bind: []
          etcd_bind: []
          flannel:
            mtu: 1450
            underlay_mtu: 1500
            underlay_dev: "eth0"
            mtu_ok: true
            rx_errors: 0
            tx_errors: 0
            rx_dropped: 0
            tx_dropped: 0
          journald:
            disk_mb: 100
            conf: ""
            bounded: true
            k3s_lines_24h: 100
          server:
            secrets_encryption: "Disabled"
            db_kind: "etcd"
            db_mb: 500
            etcd_snapshots:
              - name: "s1"
                size_mb: 30
                created: "x"
                age_h: 4.0
                offsite: false
            snapshot_latest_age_h: 4.0
            snapshot_interval_h: 12.0
            snapshots_offsite: true
            certificates: []
            certificates_min_days_left: 300
            certificates_expiring_90d: []
          registries:
            mirrors: []
            auth_configs: []
          containerd: {}
          local_path:
            total_mb: 0
            volumes: []
          disks:
            devices:
              - "sda 500G"
            smart: []
          smartctl: true
          thermal_c:
            x86_pkg_temp: 45.0
          thermal_max_c: 45.0
          gaps: []
      - expect: "pass"
