- id: platform.k3s-apiserver-bind-all
  name: apiserver 6443 is open on all interfaces
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.cluster
  cluster_level: true
  profiles: [lab]
  rule:
    warn_expr: "len((item.get('apiserver') or {}).get('bind_all_nodes') or []) > 0"
  target: "'cluster'"
  evidence: "f\"servers binding 6443 to *: {item['apiserver'].get('bind_all_nodes')}, --tls-san {item['apiserver'].get('tls_san')}, node-external-ip {item['apiserver'].get('external_ips')}\""
  severity_default: low
  symptom_linked: false
  why: k3s binds the apiserver to 0.0.0.0:6443 by default (there is no bind-address option). It is reachable from the LAN and from any overlay network such as Tailscale, and with router port forwarding or a public IP it is exposed to the internet. This is the k3s counterpart of the EKS public endpoint CIDR question.
  suggest: "Make sure the router does not forward 6443; for remote use, only use the overlay (Tailscale) address and block 6443 from outside the LAN with a firewall (ufw). The kubeconfig server address must be in tls-san."
