- id: platform.k3s-server-url-stale
  name: k3s server --server points to an address that is not in the cluster
  area: platform
  type: summary
  each: k3s.cluster.server_url_stale
  profiles: [lab]
  rule:
    expr: "True"
  target: "item['node']"
  evidence: "f\"host {item['host']} of --server {item['server_url']} is not among current node IPs or names\""
  severity_default: low
  symptom_linked: false
  why: The address of another server used when first joining the cluster is still in the systemd unit. It currently comes up with its own etcd, but on reinstall or rejoin it will try the missing address and fail, and readers misunderstand the topology.
  suggest: "Remove `--server` from the unit (single server: keep only `--cluster-init`) and run `systemctl daemon-reload && systemctl restart k3s` in a maintenance window."
  verify:
    - "systemctl cat k3s | grep -A1 -- --server"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          node: "node-b"
          server_url: "https://192.0.2.160:6443"
          host: "192.0.2.160"
      - expect: "none"

- id: platform.k3s-version-skew
  name: k3s version mismatch between nodes
  area: platform
  type: summary
  each: k3s.cluster
  cluster_level: true
  profiles: [lab]
  rule:
    expr: "item.get('version_skew') is True"
  target: "'cluster'"
  evidence: "f\"kubelet version per node {item.get('versions')}\""
  severity_default: medium
  symptom_linked: false
  why: k3s ships server and agent in one binary, so differing versions can break API and CNI behaviour. Unless an upgrade is in progress, one node has simply been left behind.
  suggest: Upgrade k3s on the lagging node to the same version (can be automated with system-upgrade-controller).
  verify:
    - "kubectl get nodes -o wide"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          servers:
            - "node-b"
          agents:
            - "node-a"
          versions:
            v1.33.5+k3s1: 1
            v1.32.0+k3s1: 1
          version_skew: true
          embedded_etcd: true
          apiserver:
            bind_all_nodes: []
            tls_san: []
            external_ips: []
          server_url_stale: []
          disabled_builtins: []
          disabled_without_replacement: []
          builtin_images: {}
          podcidr: []
          metallb:
            present: true
            pools:
              - name: "p"
                addresses:
                  - "192.0.2.200-192.0.2.209"
                size: 10
            total_ips: 10
            used: 1
            free: 9
            pending: []
          local_path:
            pv_count: 0
            by_node: {}
            pinned: []
            over_capacity: []
            node_total_mb: 0
          journald_total_mb: 100
          check_config_missing: []
          gaps: {}
      - expect: "pass"
        item:
          servers:
            - "node-b"
          agents:
            - "node-a"
          versions:
            v1.33.5+k3s1: 2
          version_skew: false
          embedded_etcd: true
          apiserver:
            bind_all_nodes: []
            tls_san: []
            external_ips: []
          server_url_stale: []
          disabled_builtins: []
          disabled_without_replacement: []
          builtin_images: {}
          podcidr: []
          metallb:
            present: true
            pools:
              - name: "p"
                addresses:
                  - "192.0.2.200-192.0.2.209"
                size: 10
            total_ips: 10
            used: 1
            free: 9
            pending: []
          local_path:
            pv_count: 0
            by_node: {}
            pinned: []
            over_capacity: []
            node_total_mb: 0
          journald_total_mb: 100
          check_config_missing: []
          gaps: {}

- id: platform.k3s-check-config-missing
  name: k3s check-config reports missing kernel settings
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.cluster
  cluster_level: true
  profiles: [lab]
  rule:
    warn_expr: "len(item.get('check_config_missing') or []) > 0"
  target: "'cluster'"
  evidence: "f\"missing: {item.get('check_config_missing')}\""
  severity_default: low
  symptom_linked: false
  why: "Most missing items from `k3s check-config` are optional features (realtime scheduling groups and similar), so with STATUS pass nothing is broken. Still, knowing what the stock Ubuntu kernel lacks saves time when investigating cgroup or network problems."
  suggest: "Leave it as is unless you use the feature the item enables (for example RT scheduling)."
  verify:
    - "k3s check-config"
  test:
    profile: "k3s"
    cases:
