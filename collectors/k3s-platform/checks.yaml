- id: platform.k3s-certificate-expiring
  name: k3s internal certificates expiring soon
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    expr: "item.get('role') == 'server' and ((item.get('server') or {}).get('certificates_min_days_left') is not None) and (item.get('server') or {}).get('certificates_min_days_left') < 30"
