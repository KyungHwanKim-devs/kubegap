- id: platform.k3s-etcd-snapshot-local-only
  name: etcd snapshots exist only on the server node disk (no off-site copy)
  area: resilience
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    expr: "item.get('role') == 'server' and bool((item.get('server') or {}).get('etcd_snapshots')) and not (item.get('server') or {}).get('snapshots_offsite')"
  target: "item['node']"
  evidence: "f\"all {len((item.get('server') or {}).get('etcd_snapshots') or [])} snapshots at file:///var/lib/rancher/k3s/server/db/snapshots (same node, same disk). No S3 config (--etcd-s3)\""
  severity_default: medium
  symptom_linked: false
  why: The snapshots live on the same disk as the etcd data. The day that disk dies, data and backup disappear together. This is the most common small k3s cluster form of "we thought we had a backup".
  suggest: "Enable off-site transfer with `--etcd-s3 --etcd-s3-bucket ...` (MinIO works too), or add a cron that rsyncs to another machine."
  verify:
