# --- small k3s cluster variant: MetalLB L2 leader ---
- id: platform.k3s-datastore-slow
  name: k3s datastore (etcd/kine) requests are slow (apply latency, fdatasync, leader changes)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.cluster.datastore
  cluster_level: true
  rule:
    expr: "item['kind'] is not None and ((item['leader_changes'] or 0) > 0 or (item['fdatasync_slow'] or 0) > 0 or (item['apply_over_1s'] or 0) >= 10 or ((item['capped'] or False) and (item['apply_slow'] or 0) >= 100))"
    warn_expr: "item['kind'] is not None and (item['lines_24h'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"datastore {item['kind']} (servers {item['servers']}), warn lines in 24h {item['lines_24h']}{' (hit the 200-line cap - there were more)' if item['capped'] else ''}: slow apply {item['apply_slow']} (max {item['max_apply_ms']}ms, over 1s {item['apply_over_1s']}), slow fdatasync {item['fdatasync_slow']}, leader changes {item['leader_changes']}, request stats {item['request_stats']}, DB {item['db_mb']}MB\""
  severity_default: high
  symptom_linked: true
  why: >
    etcd logs "apply request took too long" when an apply exceeds 100ms. When disk fsync is slow (a SATA SSD competing with other I/O such as Elasticsearch, databases or backups), leader heartbeats are delayed, the apiserver times out, and in bad cases the leader changes (on a single server etcd pauses briefly) or nodes flap to NotReady. It is the first thing to make noise when one small k3s cluster server node carries the datastore, the workloads and the log store all at once.
    Measured on a 2-node k3s k3s: the server node (embedded etcd, DB 578MB) had 200 warn lines in 24h (capped; the real count was higher, about one hour's worth), 95 slow applies (max 1,447ms, 7 over 1s), 2 slow fdatasync -> fail. The same node hosted Elasticsearch (102GiB), a registry and databases.
  suggest: "Move etcd to a different disk (NVMe) via --data-dir, or reduce disk I/O on the same node (move Elasticsearch and backups to another node). If etcd_disk_wal_fsync_duration_seconds p99 exceeds 10ms it is a disk problem. For kine (SQLite): journalctl -u k3s | grep 'slow sql'."
  verify:
    - "ssh <server> sudo journalctl -u k3s --since -1h | grep -cE 'took too long|slow fdatasync|leader changed'"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          kind: "etcd"
          servers:
            - "node-b"
          db_mb: 578
          quota_mb: 2048
          db_ratio: 0.282
          slow_by_node:
            node-b:
              lines_24h: 200
              capped: true
              apply_slow: 95
              max_apply_ms: 1447.6
              apply_over_1s: 7
              fdatasync_slow: 2
              leader_changes: 0
              request_stats: 97
              first: "Oct 25 12:27:30"
              last: "Oct 25 13:37:33"
          slow_log_nodes:
            - "node-b"
          capped: true
          max_apply_ms: 1447.6
          lines_24h: 200
          apply_slow: 95
          apply_over_1s: 7
          fdatasync_slow: 2
          leader_changes: 1
          request_stats: 97
          note: "Slow-request logs are the last 200 warn lines of journalctl -u k3s over 24 h (capped means there were more). etcd expects apply within 100 ms. DB size is the data directory under /var/lib/rancher/k3s/server/db."
      - expect: "fail"
        item:
          kind: "etcd"
