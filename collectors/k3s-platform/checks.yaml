- id: node.smartmontools-missing
  name: smartmontools missing (disk SMART status not visible)
  area: node
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: k3s.nodes
  profiles: [lab]
  rule:
    warn_expr: "item.get('collected') and item.get('smartctl') is False"
  target: "item['node']"
  evidence: "f\"smartctl missing. Disks {(item.get('disks') or {}).get('devices')}\""
  severity_default: low
  symptom_linked: false
  why: For small k3s cluster disks (consumer SSDs), SMART is the only early view of wear and errors. Without it the first signal is kernel I/O errors (node.kernel-io-fs-errors), and by then it is too late.
  suggest: "After `apt install smartmontools`, kubegap reads `smartctl -H` and `-A` (Percentage Used, Media errors); the sudoers template already allows it. Exporting via the node-exporter smartmon textfile collector also enables alerting."
  verify:
    - "sudo smartctl -H /dev/sda"
  test:
    profile: "k3s"
    cases:
      - expect: "warn"
        item:
          node: "node-b"
