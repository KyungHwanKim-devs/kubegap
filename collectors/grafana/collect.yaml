# Grafana HTTP API. /api/health works without authentication, but the datasource and dashboard lists require it (401 otherwise).
# If config.yaml has grafana_api_token (a Viewer service-account token) it is sent as the Authorization header. Without it those items are skipped as "no auth".
- id: health
  type: http
  store: grafana
  path: /api/health
  out: grafana/health.json
  timeout: 30
  source: "grafana/grafana pkg/api/http_server.go:745-762@v10.2.3, :697-700,712-736@v12.2.1, :788-792,804-828@v13.3.0 (GET /api/health without authentication: database ok or failing, and version and commit unless [auth.anonymous] hide_version is set; 13.3.0 adds an apiserver field and may answer 503 on apiserver readiness alone :792,828@v13.3.0; lib/stackhealth.py, lib/observability.py and lib/monitoring.py read database and version)"
- id: datasources
  type: http
  store: grafana
  path: /api/datasources
  out: grafana/datasources.json
  auth: grafana_api_token
  timeout: 30
  source: "grafana/grafana pkg/api/api.go:372@v10.2.3, :393@v12.2.1, :401@v13.3.0, pkg/api/datasources.go:49,62-64@v10.2.3, :42,55-57@v12.2.1, :44,57-59@v13.3.0 (GET /api/datasources needs the datasources:read permission, so a service-account token; a DataSourceListItemDTO pkg/api/dtos/datasource.go:33,37-38,42,46@v10.2.3, :35,39-40,44,48@v12.2.1, :35,39-40,44,48@v13.3.0 carries name, type, url, isDefault; lib/observability.py reads them)"
- id: dashboards
  type: http
  store: grafana
  path: /api/search?type=dash-db&limit=500
  out: grafana/dashboards.json
  auth: grafana_api_token
  timeout: 30
  source: "grafana/grafana pkg/api/api.go:500@v10.2.3, :501@v12.2.1, :499@v13.3.0, pkg/api/search.go:23,89@v10.2.3, :25,101@v12.2.1, :25,101@v13.3.0 (GET /api/search?type=dash-db&limit=500 needs a signed-in token and returns the dashboards it may read; a HitList of Hit with uid pkg/services/search/model/model.go:64-66,83@v10.2.3, :65-67,86@v12.2.1, :36-38,58@v13.3.0; lib/observability.py reads uid)"
- id: dashboards-json
  # Panel JSON per dashboard (which metrics it plots) — input for "metric exists but no panel shows it". Needs the dashboards (list) step first and only runs with a token
  type: http
  store: grafana
  path: /api/dashboards/uid/{item.uid}
  for_each_file: {path: grafana/dashboards.json, key: uid, limit: 300}
  out: grafana/dashboards/{item_safe}.json
  auth: grafana_api_token
  timeout: 30
  source: "grafana/grafana pkg/api/api.go:456@v10.2.3, :454@v12.2.1, :467@v13.3.0, pkg/api/dashboard.go:81,218@v10.2.3, :95,273@v12.2.1, :69,229@v13.3.0 (GET /api/dashboards/uid/{uid}; DashboardFullWithMeta pkg/api/dtos/dashboard.go:50-52@v10.2.3, :41-43@v12.2.1, :40-42@v13.3.0 with meta and dashboard, the dashboard JSON whose panels[].targets[].expr, nested panels, and rows[].panels of the old schema lib/observability.py reads)"
# Grafana self metrics. :3000/metrics is open without authentication. Per-datasource response codes (429, 5xx), API 5xx, alert evaluation failures, build version. Prometheus usually does not scrape Grafana (no up{job=~grafana}) → pod-metrics.
- id: self-metrics
  type: pod-metrics
  namespace: monitoring
  selector: app.kubernetes.io/name=grafana
  port: 3000
  discover: { kind: [deployment, statefulset], name: "*/*grafana", port_names: [grafana] }   # the chart's workload is <fullname>, its image renderer <fullname>-image-renderer
  path: /metrics
  out: metrics/pod/grafana
  keep: '^(grafana_(build_info|datasource_request_total|api_response_status_total|alerting_(active_alerts|rule_evaluation_failures_total|notification_failed_total|active_configurations)|stat_totals_(dashboard|datasource|alert_rules)|stat_total_users|stat_active_users|db_datasource_query_by_id_total|plugin_build_info)|process_(start_time|resident_memory_bytes))'
  source: "names and their definitions per version: collectors/grafana/pod-metrics.yaml. Port 3000 is Grafana's http_port (grafana/grafana conf/defaults.ini:53@v13.3.0) and the chart's service.targetPort as the container port named grafana (grafana-community/helm-charts charts/grafana/templates/_pod.tpl:1610-1611@grafana-14.3.1, values.yaml:276,296); the pod label app.kubernetes.io/name=grafana is the chart's (templates/_helpers.tpl:81-84@grafana-14.3.1, templates/deployment.yaml:23); the chart hard-codes no namespace (templates/_helpers.tpl:56-62@grafana-14.3.1), monitoring is where kube-prometheus-stack put it on the two clusters"
  timeout: 30
