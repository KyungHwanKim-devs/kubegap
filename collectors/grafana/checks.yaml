- id: grafana.alerting-failures
  name: Grafana built-in alerting evaluation or delivery failures
  area: observability
  type: summary
  each: stackhealth.grafana
  cluster_level: true
  rule:
    warn_expr: "item['present'] and item['metrics_available'] and ((item['alert_rule_eval_failures'] or 0) > 0 or (item['alert_notification_failures'] or 0) > 0)"
  target: "item['target']"
  evidence: "f\"Grafana alert rules {(item['stats'] or {}).get('totals_alert_rules')}, evaluation failures {item['alert_rule_eval_failures']}, notification failures {item['alert_notification_failures']}\""
  severity_default: low
  symptom_linked: false
  why: >
    If Grafana alerting (a system separate from Prometheus rules) is in use, evaluation failures (datasource errors) and notification failures (contact point configuration) accumulate here. With 0 rules Grafana alerting is not in use and Alertmanager is the only path.
    Measured on real clusters: 0 Grafana alert rules and 0 failures on both EKS and small k3s cluster.
  suggest: "Look at Error/NoData in Grafana Alerting → rule state. Not splitting into two systems alongside Prometheus rules is easier to manage."
  verify:
    - "curl -s localhost:3000/metrics | grep grafana_alerting_rule_evaluation_failures_total"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "10.2.3"
          major: 10
          database: "ok"
          datasources:
            - datasource: "Loki(loki)"
              requests: 2515
              errors_5xx_429: 302
              error_ratio: 0.1201
