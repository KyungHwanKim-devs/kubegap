- id: grafana.version-old
  name: Grafana major version is end of support (10.x or lower)
  area: observability
  type: summary
  each: stackhealth.grafana
  cluster_level: true
  rule:
    warn_expr: "item['present'] and item['major'] is not None and item['major'] < 11"
  target: "item['target']"
  evidence: "f\"Grafana {item['version']} (database {item['database']}), ingress {item['ingress_hosts']}, dashboards {(item['stats'] or {}).get('totals_dashboard')}\""
  severity_default: low
  symptom_linked: false
  why: >
    Grafana patches only the latest and the previous major. After 12 (2025-05) came out, 10.x stopped receiving security patches — for a UI exposed to the internet, authentication bypass and XSS CVEs remain as they are.
    Measured on real clusters: EKS 10.2.3 → warn, small k3s cluster 12.2.1 → pass.
  suggest: "Bump the grafana subchart version in the kube-prometheus-stack chart (10 → 11 → 12; check the impact of Angular panel removal)."
  verify:
    - "curl -s https://<grafana>/api/health"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "10.2.3"
          major: 10
          database: "ok"
