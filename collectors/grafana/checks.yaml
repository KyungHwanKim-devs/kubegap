- id: grafana.metrics-unreadable
  name: Grafana's own metrics could not be read
  area: observability
  type: summary
  each: stackhealth.grafana
  cluster_level: true
  rule:
    warn_expr: "item['present'] and not item['metrics_available']"
  target: "item['target']"
  evidence: "f\"metrics/pod/grafana/ missing — pod proxy and node access both failed. /api/health says {item['database']}, version {item['version']}\""
