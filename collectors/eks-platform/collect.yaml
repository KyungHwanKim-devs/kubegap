# EKS platform collection. Read-only calls throughout. Results go to the aws/ folder.
# Already fetched and saved by detection (discover): aws/describe-cluster.json, aws/list-addons.json, aws/describe-addon-<name>.json,
# aws/list-nodegroups.json. The rest is collected here.
# Placeholders available in aws item args: {cluster} {region} {account} {k8s_version} {vpc_id}, plus {item} when for_each is set.
# for_each values: eks.nodegroups | eks.addons | eks.subnet_ids (read from cluster.eks in inventory.json)
# A plural placeholder such as `{subnet_ids}` expands the whole list into multiple arguments.
- id: nodegroup
  type: aws
  source: "eks DescribeNodegroup: output DescribeNodegroupResponse awscli/botocore/data/eks/2017-11-01/service-2.json:4388@2.39.3, input DescribeNodegroupRequest :4367; fields in references/sources.md (#125)"
  for_each: eks.nodegroups
  args: [eks, describe-nodegroup, --cluster-name, "{cluster}", --nodegroup-name, "{item}"]
  out: aws/describe-nodegroup-{item}.json
  timeout: 60
- id: addon-versions
  modes: [full]   # skipped by the daily run
  type: aws
  source: "eks DescribeAddonVersions: output DescribeAddonVersionsResponse awscli/botocore/data/eks/2017-11-01/service-2.json:4056@2.39.3, input DescribeAddonVersionsRequest :4003; fields in references/sources.md (#125)"
  for_each: eks.addons
  args: [eks, describe-addon-versions, --addon-name, "{item}", --kubernetes-version, "{k8s_version}", --max-results, "5"]
  out: aws/describe-addon-versions-{item}.json
  timeout: 60
- id: cluster-versions
  modes: [full]   # skipped by the daily run
  type: aws
  source: "eks DescribeClusterVersions: output DescribeClusterVersionsResponse awscli/botocore/data/eks/2017-11-01/service-2.json:4212@2.39.3, input DescribeClusterVersionsRequest :4156; fields in references/sources.md (#125)"
  args: [eks, describe-cluster-versions, --cluster-versions, "{k8s_version}"]
  out: aws/describe-cluster-versions.json
  timeout: 60
- id: insights
  modes: [full]   # skipped by the daily run
  type: aws
  source: "eks ListInsights: output ListInsightsResponse awscli/botocore/data/eks/2017-11-01/service-2.json:5965@2.39.3, input ListInsightsRequest :5941; fields in references/sources.md (#125)"
  args: [eks, list-insights, --cluster-name, "{cluster}"]
  out: aws/list-insights.json
  timeout: 60
- id: subnets
  type: aws
  source: "ec2 DescribeSubnets: output DescribeSubnetsResult awscli/botocore/data/ec2/2016-11-15/service-2.json:32816@2.39.3, input DescribeSubnetsRequest :32788; fields in references/sources.md (#125)"
  args: [ec2, describe-subnets, --subnet-ids, "{subnet_ids}"]
  out: aws/describe-subnets.json
  timeout: 60
- id: route-tables
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ec2 DescribeRouteTables: output DescribeRouteTablesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:31770@2.39.3, input DescribeRouteTablesRequest :31742; fields in references/sources.md (#125)"
  args: [ec2, describe-route-tables, --filters, "Name=vpc-id,Values={vpc_id}"]   # routes to peering, transit gateway and VPN targets decide whether external SNAT matters (vpccni.external-snat-off-with-private-routes)
  out: aws/describe-route-tables.json
  timeout: 60
- id: ssm-instances
  type: aws
  source: "ssm DescribeInstanceInformation: output DescribeInstanceInformationResult awscli/botocore/data/ssm/2014-11-06/service-2.json:6587@2.39.3, input DescribeInstanceInformationRequest :6565; fields in references/sources.md (#125)"
  args: [ssm, describe-instance-information, --max-results, "50"]
  out: aws/ssm-instance-information.json
  timeout: 60
- id: cluster-security-groups
  type: aws
  source: "ec2 DescribeSecurityGroups: output DescribeSecurityGroupsResult awscli/botocore/data/ec2/2016-11-15/service-2.json:32190@2.39.3, input DescribeSecurityGroupsRequest :32157; fields in references/sources.md (#125)"
  args: [ec2, describe-security-groups, --group-ids, "{security_groups}"]
  out: aws/describe-security-groups.json
  timeout: 60
- id: controlplane-logs
  modes: [full]   # skipped by the daily run
  type: cwlogs
  source: "logs StartQuery: output StartQueryResponse awscli/botocore/data/logs/2014-03-28/service-2.json:9143@2.39.3, input StartQueryRequest :9101; logs GetQueryResults: output GetQueryResultsResponse awscli/botocore/data/logs/2014-03-28/service-2.json:5231@2.39.3, input GetQueryResultsRequest :5213; logs StopQuery: output StopQueryResponse awscli/botocore/data/logs/2014-03-28/service-2.json:9172@2.39.3, input StopQueryRequest :9162; fields in references/sources.md (#125)"
  file: cwlogs.yaml
  hours: 24
  timeout: 120
# ---- Node kubelet/containerd journals (signature input). SSM runs as root, so no requires. klog writes everything at journald priority info, so filter by klog level (E, W) and logrus level rather than -p. 3000 lines per node max ----
- id: kubelet-journal
  modes: [full]   # skipped by the daily run
  type: node
  nodes: all
  cmd: journalctl -u kubelet --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E ' [EW][0-9]{4} [0-9:.]+ ' | tail -n 3000; journalctl -u kubelet --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E '"(Eviction manager: |Container runtime network not ready)' | tail -n 200
  # The second pass keeps the two kubelet I lines the signatures kubelet.eviction and kubelet.runtime-network-not-ready (an I line from 1.36) read (#129), capped on their own so a node that repeats one of them cannot push the E/W lines out of the first pass.
  out: logs/node/{node}/kubelet-24h.log
  timeout: 60
- id: containerd-journal
  modes: [full]   # skipped by the daily run
  type: node
  nodes: all
  cmd: journalctl -u containerd --since -24h -o short-iso --no-pager -q 2>/dev/null | grep -E 'level=(warn|error|fatal)' | tail -n 2000
  out: logs/node/{node}/containerd-24h.log
  timeout: 60
# ---- Backup policies (DLM, AWS Backup presence). Both read-only calls ----
- id: dlm-policies
  modes: [full]   # skipped by the daily run
  type: aws
  source: "dlm GetLifecyclePolicies: output GetLifecyclePoliciesResponse awscli/botocore/data/dlm/2018-01-12/service-2.json:697@2.39.3, input GetLifecyclePoliciesRequest :656; fields in references/sources.md (#125)"
  args: [dlm, get-lifecycle-policies]
  out: aws/dlm-lifecycle-policies.json
  timeout: 60
- id: backup-plans
  modes: [full]   # skipped by the daily run
  type: aws
  source: "backup ListBackupPlans: output ListBackupPlansOutput awscli/botocore/data/backup/2018-11-15/service-2.json:6296@2.39.3, input ListBackupPlansInput :6273; fields in references/sources.md (#125)"
  args: [backup, list-backup-plans]
  out: aws/backup-plans.json
  timeout: 60
# ---- ALB/NLB and target groups. describe-* and CloudWatch get-metric-data (24 hours, 1-hour period), all read-only. lib/collection/albmetrics.py ----
# Observed on a real cluster: 1 ALB (40 target groups) and 2 NLBs, about 90 calls (attributes and health per target group), ~300 queries in batches of 100. lib/summaries/traffic.py joins them to Services and Ingresses through TargetGroupBindings.
- id: alb-metrics
  type: alb-metrics
  source: "elbv2 DescribeLoadBalancers: output DescribeLoadBalancersOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2098@2.39.3, input DescribeLoadBalancersInput :2077; elbv2 DescribeTargetGroups: output DescribeTargetGroupsOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2242@2.39.3, input DescribeTargetGroupsInput :2217; elbv2 DescribeTargetHealth: output DescribeTargetHealthOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2280@2.39.3, input DescribeTargetHealthInput :2255; elbv2 DescribeListeners: output DescribeListenersOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2045@2.39.3, input DescribeListenersInput :2024; elbv2 DescribeLoadBalancerAttributes: output DescribeLoadBalancerAttributesOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2068@2.39.3, input DescribeLoadBalancerAttributesInput :2058; elbv2 DescribeTargetGroupAttributes: output DescribeTargetGroupAttributesOutput awscli/botocore/data/elbv2/2015-12-01/service-2.json:2208@2.39.3, input DescribeTargetGroupAttributesInput :2198; cloudwatch GetMetricData: output GetMetricDataOutput awscli/botocore/data/cloudwatch/2010-08-01/service-2.json:2601@2.39.3, input GetMetricDataInput :2561; https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html read 2026-11-06; https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-cloudwatch-metrics.html read 2026-11-06; fields in references/sources.md (#125)"
  out: aws/alb-metrics.json
  hours: 24
  timeout: 300
# ---- EBS volumes and snapshots. Read-only calls. Observed on a real cluster: 28 cluster-tagged volumes (25 gp3, 3 gp2), 0 available, 12 snapshots in 30 days ----
- id: ec2-volumes
  type: aws
  source: "ec2 DescribeVolumes: output DescribeVolumesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:33957@2.39.3, input DescribeVolumesRequest :33923; fields in references/sources.md (#125)"
  args: [ec2, describe-volumes, --filters, "Name=tag:KubernetesCluster,Values={cluster}", --query, "Volumes[].{id:VolumeId,size:Size,type:VolumeType,state:State,iops:Iops,throughput:Throughput,created:CreateTime,az:AvailabilityZone,encrypted:Encrypted,attachments:Attachments[].{instance:InstanceId,state:State},tags:Tags}"]
  out: aws/ec2-volumes.json
  timeout: 60
- id: ec2-volumes-available
  type: aws
  source: "ec2 DescribeVolumes: output DescribeVolumesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:33957@2.39.3, input DescribeVolumesRequest :33923; fields in references/sources.md (#125)"
  args: [ec2, describe-volumes, --filters, "Name=status,Values=available", --query, "Volumes[].{id:VolumeId,size:Size,type:VolumeType,created:CreateTime,az:AvailabilityZone,tags:Tags}"]
  out: aws/ec2-volumes-available.json
  timeout: 60
- id: ec2-snapshots-30d
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ec2 DescribeSnapshots: output DescribeSnapshotsResult awscli/botocore/data/ec2/2016-11-15/service-2.json:32365@2.39.3, input DescribeSnapshotsRequest :32327; fields in references/sources.md (#125)"
  args: [ec2, describe-snapshots, --owner-ids, self, --query, "Snapshots[?StartTime>='{date_30d_ago}'].{id:SnapshotId,volume:VolumeId,size:VolumeSize,start:StartTime,state:State,description:Description,tags:Tags}"]
  out: aws/ec2-snapshots-30d.json
  timeout: 120
# ---- Security. IMDS settings (can a pod steal the node role?) and Pod Identity. Read-only calls ----
- id: ec2-instances-imds
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ec2 DescribeInstances: output DescribeInstancesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:29431@2.39.3, input DescribeInstancesRequest :29397; fields in references/sources.md (#125)"
  args: [ec2, describe-instances, --filters, "Name=tag:kubernetes.io/cluster/{cluster},Values=owned", "Name=instance-state-name,Values=running", --query, "Reservations[].Instances[].{id:InstanceId,type:InstanceType,hop_limit:MetadataOptions.HttpPutResponseHopLimit,tokens:MetadataOptions.HttpTokens,endpoint:MetadataOptions.HttpEndpoint,profile:IamInstanceProfile.Arn,subnet:SubnetId,name:Tags[?Key==`Name`].Value|[0]}"]
  out: aws/ec2-instances-imds.json
  timeout: 60
- id: pod-identity-associations
  modes: [full]   # skipped by the daily run
  type: aws
  source: "eks ListPodIdentityAssociations: output ListPodIdentityAssociationsResponse awscli/botocore/data/eks/2017-11-01/service-2.json:6063@2.39.3, input ListPodIdentityAssociationsRequest :6027; fields in references/sources.md (#125)"
  args: [eks, list-pod-identity-associations, --cluster-name, "{cluster}"]
  out: aws/pod-identity-associations.json
  timeout: 60
# ---- Cost. All read-only. Cost Explorer bills 0.01 USD per request (called once); the Pricing API exists only in us-east-1, so the region is fixed ----
- id: ec2-addresses
  type: aws
  source: "ec2 DescribeAddresses: output DescribeAddressesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:26153@2.39.3, input DescribeAddressesRequest :26128; fields in references/sources.md (#125)"
  args: [ec2, describe-addresses, --query, "Addresses[].{ip:PublicIp,association:AssociationId,instance:InstanceId,eni:NetworkInterfaceId,tags:Tags}"]
  out: aws/ec2-addresses.json
  timeout: 60
- id: ec2-nat-gateways
  type: aws
  source: "ec2 DescribeNatGateways: output DescribeNatGatewaysResult awscli/botocore/data/ec2/2016-11-15/service-2.json:30717@2.39.3, input DescribeNatGatewaysRequest :30691; fields in references/sources.md (#125)"
  args: [ec2, describe-nat-gateways, --filter, "Name=state,Values=available", --query, "NatGateways[].{id:NatGatewayId,subnet:SubnetId,vpc:VpcId,created:CreateTime,tags:Tags}"]
  out: aws/ec2-nat-gateways.json
  timeout: 60
- id: ec2-spot-prices
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ec2 DescribeSpotPriceHistory: output DescribeSpotPriceHistoryResult awscli/botocore/data/ec2/2016-11-15/service-2.json:32673@2.39.3, input DescribeSpotPriceHistoryRequest :32618; fields in references/sources.md (#125)"
  args: [ec2, describe-spot-price-history, --instance-types, "{instance_types}", --product-descriptions, "Linux/UNIX", --start-time, "{date_today}T00:00:00Z", --query, "SpotPriceHistory[].{type:InstanceType,az:AvailabilityZone,price:SpotPrice,ts:Timestamp}"]
  out: aws/ec2-spot-prices.json
  timeout: 60
- id: pricing-ondemand
  modes: [full]   # skipped by the daily run
  type: aws
  source: "pricing GetProducts: output GetProductsResponse awscli/botocore/data/pricing/2017-10-15/service-2.json:359@2.39.3, input GetProductsRequest :333; fields in references/sources.md (#125)"
  region: us-east-1
  for_each: instance_types
  args: [pricing, get-products, --service-code, AmazonEC2, --filters, "Type=TERM_MATCH,Field=instanceType,Value={item}", "Type=TERM_MATCH,Field=regionCode,Value={region}", "Type=TERM_MATCH,Field=operatingSystem,Value=Linux", "Type=TERM_MATCH,Field=tenancy,Value=Shared", "Type=TERM_MATCH,Field=preInstalledSw,Value=NA", "Type=TERM_MATCH,Field=capacitystatus,Value=Used", --max-results, "1"]
  out: aws/pricing-{item}.json
  timeout: 60
- id: ce-cost-30d
  modes: [full]   # skipped by the daily run
  type: aws
  source: "ce GetCostAndUsage: output GetCostAndUsageResponse awscli/botocore/data/ce/2017-10-25/service-2.json:2748@2.39.3, input GetCostAndUsageRequest :2710; fields in references/sources.md (#125)"
  args: [ce, get-cost-and-usage, --time-period, "Start={date_30d_ago},End={date_tomorrow}", --granularity, MONTHLY, --metrics, UnblendedCost, --group-by, "Type=DIMENSION,Key=SERVICE"]
  out: aws/ce-cost-30d.json
  timeout: 60
# ---- ACM certificate expiry, service quota usage (CloudWatch AWS/Usage), EBS volume queue and IOPS (CloudWatch AWS/EBS). All read-only calls ----
- id: acm-certificates
  type: aws
  source: "acm ListCertificates: output ListCertificatesResponse awscli/botocore/data/acm/2015-12-08/service-2.json:3100@2.39.3, input ListCertificatesRequest :3067; fields in references/sources.md (#125)"
  args: [acm, list-certificates, --includes, "keyTypes=RSA_1024,RSA_2048,RSA_3072,RSA_4096,EC_prime256v1,EC_secp384r1,EC_secp521r1"]
  out: aws/acm-certificates.json
  timeout: 60
- id: service-quotas
  modes: [full]   # skipped by the daily run
  type: aws
  source: "servicequotas ListServiceQuotas: output ListServiceQuotasResponse awscli/botocore/data/service-quotas/2019-06-24/service-2.json:1084@2.39.3, input ListServiceQuotasRequest :1058; fields in references/sources.md (#125)"
  for_each: service_codes
  args: [service-quotas, list-service-quotas, --service-code, "{item}", --query, "Quotas[?UsageMetric!=null].{QuotaCode:QuotaCode,QuotaName:QuotaName,Value:Value,Unit:Unit,Adjustable:Adjustable,GlobalQuota:GlobalQuota,ServiceCode:ServiceCode,UsageMetric:UsageMetric}"]
  out: aws/service-quotas-{item}.json
  timeout: 120
- id: quota-usage
  modes: [full]   # skipped by the daily run
  type: cw-metrics
  source: "cloudwatch GetMetricData: output GetMetricDataOutput awscli/botocore/data/cloudwatch/2010-08-01/service-2.json:2601@2.39.3, input GetMetricDataInput :2561; https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Usage-Metrics.html read 2026-11-06; fields in references/sources.md (#125)"
  mode: quotas
  from_files: [aws/service-quotas-ec2.json, aws/service-quotas-vpc.json, aws/service-quotas-elasticloadbalancing.json, aws/service-quotas-ebs.json]
  out: aws/cw-quota-usage.json
  hours: 1
  period: 3600
  timeout: 300
- id: ec2-root-volumes
  modes: [full]   # skipped by the daily run
  # Node root volumes (unlike PVC volumes they carry no KubernetesCluster tag). Instance ids come from the node providerID
  type: aws
  source: "ec2 DescribeVolumes: output DescribeVolumesResult awscli/botocore/data/ec2/2016-11-15/service-2.json:33957@2.39.3, input DescribeVolumesRequest :33923; fields in references/sources.md (#125)"
  args: [ec2, describe-volumes, --filters, "Name=attachment.instance-id,Values={instance_ids}", --query, "Volumes[?Attachments[0].Device==`/dev/xvda` || Attachments[0].Device==`/dev/sda1` || Attachments[0].Device==`/dev/nvme0n1`].{id:VolumeId,size:Size,type:VolumeType,state:State,iops:Iops,throughput:Throughput,az:AvailabilityZone,encrypted:Encrypted,attachments:Attachments[].{instance:InstanceId,state:State,device:Device},root:`true`}"]
  out: aws/ec2-root-volumes.json
  timeout: 60
- id: ebs-volume-metrics
  modes: [full]   # skipped by the daily run
  type: cw-metrics
  source: "cloudwatch GetMetricData: output GetMetricDataOutput awscli/botocore/data/cloudwatch/2010-08-01/service-2.json:2601@2.39.3, input GetMetricDataInput :2561; https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html read 2026-11-06; fields in references/sources.md (#125)"
  namespace: AWS/EBS
  dimension: VolumeId
  from_file: {path: aws/ec2-volumes.json, items: "", key: id}
  from_files: [aws/ec2-root-volumes.json]
  metrics:
    - {name: VolumeQueueLength, stat: Average}
    - {name: VolumeQueueLength, stat: Maximum}
    - {name: VolumeReadOps, stat: Sum}
    - {name: VolumeWriteOps, stat: Sum}
    - {name: BurstBalance, stat: Minimum}
    - {name: VolumeTotalReadTime, stat: Sum}
    - {name: VolumeTotalWriteTime, stat: Sum}
  out: aws/cw-ebs-volumes.json
  hours: 24
  period: 3600
  timeout: 300
