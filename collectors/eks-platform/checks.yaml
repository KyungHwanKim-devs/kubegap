          in_use: 7
          expiring_30d_in_use: []
          expiring_14d_in_use: []
          expired_in_use: []
          not_renewable_in_use:
            - "example.com"
          imported_in_use: []
          expired_unused:
            - "app-b-xl.com"
          min_days_in_use: 71.0
      - expect: "warn"
        item:
          available: true
          certificates: 12
          in_use: 7
          expiring_30d_in_use: []
          expiring_14d_in_use: []
          expired_in_use: []
          not_renewable_in_use: []
          imported_in_use:
            - "legacy.example.com"
          expired_unused:
            - "app-b-xl.com"
