- id: eks.service-quota-near-limit
  name: AWS service quota usage near the limit (at the limit, node, LB and IP creation fail silently)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: eksplatform.quotas
  cluster_level: true
  rule:
    expr: "item.get('available') and len(item.get('near_limit') or []) > 0"
    warn_expr: "item.get('available') and len(item.get('over_60') or []) > 0"
  target: "'aws-account'"
  evidence: "f\"quotas with a usage metric {item.get('with_usage')}/{item.get('quotas')}, at 80% or more {item.get('near_limit')}, at 60% or more {item.get('over_60')}, top operational quotas {item.get('watched_top')[:6]}\""
  severity_default: high
  symptom_linked: false
  why: >
    When the vCPU, ENI, EIP, ALB, target group or listener rule limit is reached, Karpenter node creation, ALB Controller ingress reconciliation and NodePort allocation fail with "InsufficientCapacity/LimitExceeded", which inside Kubernetes shows only as pending and events. Quota increases take a day or more, so request them at 60%. Usage is the 1-hour maximum from CloudWatch AWS/Usage (only quotas with a usage metric; services ec2, vpc, elasticloadbalancing, ebs).
    Measured on a real EKS cluster: 20 of 65 quotas had usage, VPCs 3/5 (60%) → warn; listener rules per ALB 47/100 (a shared ALB — same root as traffic.shared-alb-group), target groups per ALB 40/100.
  suggest: "aws service-quotas request-service-quota-increase --service-code <svc> --quota-code <L-...> --desired-value <n>. For listener rules per ALB, split the ingresses into two ALB groups."
  verify:
    - "aws service-quotas list-service-quotas --service-code ec2 --query 'Quotas[?UsageMetric!=null].[QuotaName,Value]' --output table"
    - "aws cloudwatch get-metric-statistics --namespace AWS/Usage --metric-name ResourceCount --dimensions Name=Service,Value=EC2 Name=Type,Value=Resource Name=Resource,Value=vCPU Name=Class,Value=Standard/OnDemand --statistics Maximum --period 3600 --start-time <1h ago> --end-time <now>"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          quotas: 65
          with_usage: 20
          near_limit:
            - "ALB listener rules per load balancer 85/100"
          over_60:
            - "ALB listener rules per load balancer 0.85"
          watched_top:
            - "['VPC count', 3.0, 5.0, 0.6]"
          max_ratio: 0.6
          max_ratio_name: "VPC count"
      - expect: "warn"
        item:
          available: true
          quotas: 65
          with_usage: 20
          near_limit: []
          over_60:
            - "VPC count 0.6"
          watched_top:
            - "['VPC count', 3.0, 5.0, 0.6]"
          max_ratio: 0.6
          max_ratio_name: "VPC count"
      - expect: "pass"
        item:
          available: true
          quotas: 65
          with_usage: 20
          near_limit: []
          over_60: []
          watched_top:
            - "['VPC count', 3.0, 5.0, 0.6]"
          max_ratio: 0.6
          max_ratio_name: "VPC count"
      - expect: "pass"
        item:
          available: false
          quotas: 65
          with_usage: 20
          near_limit: []
          over_60: []
          watched_top:
            - "['VPC count', 3.0, 5.0, 0.6]"
          max_ratio: 0.6
          max_ratio_name: "VPC count"
- id: storage.ebs-volume-io-saturated
  name: EBS volume I/O saturation (queue length, IOPS limit, burst balance) — root volumes included
  area: storage
  type: summary
  each: eksplatform.ebs
  cluster_level: true
  rule:
    expr: "item.get('available') and (len(item.get('queue_high') or []) > 0 or len(item.get('burst_low') or []) > 0 or (item.get('max_iops_ratio') or 0) >= 0.9)"
    warn_expr: "item.get('available') and ((item.get('max_queue') or 0) >= 0.5 or (item.get('max_iops_ratio') or 0) >= 0.7 or len(item.get('iops_near_limit') or []) > 0)"
  target: "'cluster'"
  evidence: "f\"EBS volumes {item.get('volumes')} (root {item.get('root_volumes')}): max hourly average queue length {item.get('max_queue')}, queue ≥1 {item.get('queue_high')}, busiest-hour IOPS/provisioned max {item.get('max_iops_ratio')}, IOPS at 70% or more {item.get('iops_near_limit')}, burst balance under 20% {item.get('burst_low')}\""
  severity_default: medium
  symptom_linked: true
  why: >
    gp3 defaults to 3,000 IOPS and 125MB/s. A node root volume takes container images, write layers, logs (read by promtail/fluent-bit) and emptyDirs, so it saturates first on nodes with many log collectors, and then kubelet and containerd slow down, causing PLEG delays and slow pod starts. A sustained queue length of 1 or more means the disk cannot keep up. gp2 drops to baseline IOPS when its burst balance (BurstBalance) runs out.
    Measured on a real EKS cluster: 24 volumes (7 root, 17 PVC), max average queue 0.26 (a root volume, momentary peak 2.06), busiest-hour IOPS ratio max 5% → pass.
  suggest: "For root volumes with a high queue, raise iops/throughput in the EC2NodeClass blockDeviceMappings (gp3 can be tuned independently of volume size) or reduce logs and emptyDir use. For PVCs, the StorageClass parameters iops/throughput."
  verify:
    - "aws cloudwatch get-metric-statistics --namespace AWS/EBS --metric-name VolumeQueueLength --dimensions Name=VolumeId,Value=<vol> --statistics Average --period 300 --start-time <24h ago> --end-time <now>"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          volumes: 24
          root_volumes: 7
          queue_high:
            - "vol-1(root ip-10-0-1-1) q=1.4"
          iops_near_limit: []
          burst_low: []
          max_queue: 1.4
          max_iops_ratio: 0.05
      - expect: "fail"
        item:
          available: true
          volumes: 24
          root_volumes: 7
          queue_high: []
          iops_near_limit: []
          burst_low:
            - "vol-2 12%"
          max_queue: 0.26
          max_iops_ratio: 0.05
      - expect: "warn"
        item:
          available: true
          volumes: 24
          root_volumes: 7
          queue_high: []
          iops_near_limit: []
          burst_low: []
          max_queue: 0.6
          max_iops_ratio: 0.05
      - expect: "warn"
        item:
          available: true
          volumes: 24
          root_volumes: 7
          queue_high: []
          iops_near_limit:
            - "vol-3(db/data) 0.75"
          burst_low: []
          max_queue: 0.26
          max_iops_ratio: 0.75
      - expect: "pass"
        item:
          available: true
          volumes: 24
          root_volumes: 7
          queue_high: []
          iops_near_limit: []
          burst_low: []
          max_queue: 0.26
          max_iops_ratio: 0.05
- id: eks.security-group-open-to-world
  name: Cluster security group inbound open to 0.0.0.0/0 (other than 443)
  area: security
  type: summary
  each: eksplatform.security_groups
  cluster_level: true
  rule:
    expr: "item.get('available') and len(item.get('open_all_ports') or []) > 0"
    warn_expr: "item.get('available') and len(item.get('open_non_https') or []) > 0"
  target: "'cluster-security-groups'"
  evidence: "f\"cluster security groups {item.get('groups')}, world-open (0.0.0.0/0, ::/0) inbound rules {item.get('open_to_world_count')}, of which non-443 {item.get('open_non_https')}, all ports {item.get('open_all_ports')}; endpoint public {item.get('public_endpoint')} CIDRs {item.get('public_cidrs')}\""
  severity_default: high
  symptom_linked: false
  why: >
    The EKS cluster security group is attached to the control plane ENIs and the nodes. If 0.0.0.0/0 inbound is open on ports other than 443 (or on all ports), the nodes' kubelet 10250, NodePorts 30000-32767 and SSH 22 are exposed to the internet. Thresholds (defaults, user-adjustable): only 443 open to the world is pass, other ports warn, all ports fail. The endpoint public CIDRs are covered by eks.public-endpoint-open.
    Measured on a real EKS cluster: 2 security groups, 0 world-open inbound rules → pass.
  suggest: "Keep only cluster SG and ALB SG references as node security group inbound and delete CIDR rules. Replace SSH with SSM."
  verify:
    - "aws ec2 describe-security-groups --group-ids <sg> --query 'SecurityGroups[].IpPermissions[?contains(IpRanges[].CidrIp, `0.0.0.0/0`)]'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          groups: 2
          open_to_world_count: 1
          open_non_https:
            - "eks-node-sg: -1 None-None"
          open_all_ports:
            - "eks-node-sg"
          public_endpoint: true
          public_cidrs:
            - "0.0.0.0/0"
      - expect: "warn"
        item:
          available: true
          groups: 2
          open_to_world_count: 1
          open_non_https:
            - "eks-node-sg: tcp 22-22"
          open_all_ports: []
          public_endpoint: true
          public_cidrs:
            - "0.0.0.0/0"
      - expect: "pass"
        item:
          available: true
          groups: 2
          open_to_world_count: 0
          open_non_https: []
          open_all_ports: []
          public_endpoint: true
          public_cidrs:
            - "0.0.0.0/0"
      - expect: "pass"
        item:
          available: true
          groups: 2
          open_to_world_count: 1
          open_non_https: []
          open_all_ports: []
          public_endpoint: true
          public_cidrs:
            - "0.0.0.0/0"
- id: eks.nodegroup-ami-old
  name: Managed node group AMI is old (kernel and containerd patches not applied)
  area: platform
  type: summary
  each: eksplatform.nodegroups
  cluster_level: true
  rule:
    expr: "item.get('available') and len(item.get('ami_old_180d') or []) > 0"
    warn_expr: "item.get('available') and (len(item.get('ami_old_90d') or []) > 0 or len(item.get('unhealthy') or []) > 0)"
  target: "'nodegroups'"
  evidence: "f\"node groups {item.get('nodegroups')}, max AMI age {item.get('max_ami_age_days')} days, over 90 days {item.get('ami_old_90d')}, over 180 days {item.get('ami_old_180d')}, health issues {item.get('unhealthy')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    A managed node group's AMI (the date at the end of releaseVersion) only changes when a node group update is run. EKS-optimized AMIs ship roughly every 2-4 weeks with kernel, containerd and runc security patches. Thresholds (defaults, user-adjustable): 90 days warn, 180 days fail. Karpenter nodes are covered by the EC2NodeClass AMI selection (karpenter.ec2nodeclass-al2, hardening).
    Measured on a real EKS cluster: a managed node group AMI about 320 days old → fail.
  suggest: "aws eks update-nodegroup-version --cluster-name <c> --nodegroup-name <ng> (rolling replacement). Automate with the node group's 'auto update' or a periodic pipeline."
  verify:
    - "aws eks describe-nodegroup --cluster-name <c> --nodegroup-name <ng> --query 'nodegroup.{ami:releaseVersion,status:status,health:health}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          available: true
          nodegroups: 1
          ami_old_90d:
            - "system_core 320d"
          ami_old_180d:
            - "system_core"
          max_ami_age_days: 320
          unhealthy: []
      - expect: "warn"
        item:
          available: true
          nodegroups: 1
          ami_old_90d:
            - "system_core 120d"
          ami_old_180d: []
          max_ami_age_days: 120
          unhealthy: []
      - expect: "warn"
        item:
          available: true
          nodegroups: 1
          ami_old_90d: []
          ami_old_180d: []
          max_ami_age_days: 45
          unhealthy:
            - "system_core"
      - expect: "pass"
        item:
          available: true
          nodegroups: 1
          ami_old_90d: []
          ami_old_180d: []
          max_ami_age_days: 45
          unhealthy: []
