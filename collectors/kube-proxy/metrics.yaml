- id: kubeproxy_restore_failures_24h
  # Full iptables-restore failures only; the partial ones are kubeproxy_partial_restore_failures_24h and lib/summaries/kubeproxy.py adds the two per node. Since 1.33 each counter is a CounterVec whose series appears only after its first failure, and in ipvs mode only this counter is registered, so one PromQL expression adding the two was empty whenever one side had no series (and a rate over a __name__ selector that matches both is refused by Prometheus, since increase() drops __name__ and the label sets collide).
  why: Full iptables-restore failures over 24h per node. Must be 0. On failure that node keeps stale Service routing. Empty when no failure happened (1.33 and later) or in nftables mode
  query: sum by (instance) (increase(kubeproxy_sync_proxy_rules_iptables_restore_failures_total[24h]))
  source:
    - "kubeproxy_sync_proxy_rules_iptables_restore_failures_total: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:146@v1.30.14, :158@v1.31.14, :157@v1.32.0, :157@v1.32.13, :162@v1.33.0, :162@v1.33.5, :162@v1.33.13, :162@v1.34.13, :162@v1.35.10, :162@v1.36.6, :164@v1.37.2 (a Counter without labels up to 1.32, pkg/proxy/metrics/metrics.go:143@v1.30.14, :155@v1.31.14, :154@v1.32.0, :154@v1.32.13, whose series exists from start at 0; a CounterVec with label ip_family since 1.33, pkg/proxy/metrics/metrics.go:159,166@v1.33.0 to v1.36.6, :161,168@v1.37.2, whose series exists only after the first failure, pkg/proxy/iptables/proxier.go:456,483,1555@v1.33.5, pkg/proxy/ipvs/proxier.go:1435@v1.33.5; registered unconditionally at 1.30, pkg/proxy/metrics/metrics.go:253@v1.30.14, and in iptables and ipvs mode only since 1.31, pkg/proxy/metrics/metrics.go:310,316@v1.31.14, :310,316@v1.32.0, :310,316@v1.32.13, :343,351@v1.33.0 to v1.36.6, :425,433@v1.37.2; kubegap reads this name and the partial one in two queries that lib/summaries/kubeproxy.py adds per node, because one PromQL expression adding the two is empty whenever one side has no series)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_partial_restore_failures_24h
  why: Partial iptables-restore failures over 24h per node (a partial sync that fell back to a full one). Added to kubeproxy_restore_failures_24h by lib/summaries/kubeproxy.py. Empty when no failure happened (1.33 and later) and in ipvs and nftables mode, where the counter is not registered
  query: sum by (instance) (increase(kubeproxy_sync_proxy_rules_iptables_partial_restore_failures_total[24h]))
  source:
    - "kubeproxy_sync_proxy_rules_iptables_partial_restore_failures_total: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:157@v1.30.14, :169@v1.31.14, :168@v1.32.0, :168@v1.32.13, :174@v1.33.0, :174@v1.33.5, :174@v1.33.13, :174@v1.34.13, :174@v1.35.10, :174@v1.36.6, :176@v1.37.2 (a Counter without labels up to 1.32 and a CounterVec with label ip_family since 1.33, pkg/proxy/metrics/metrics.go:178@v1.33.0 to v1.36.6, :180@v1.37.2, whose series exists only after the first partial restore failure, pkg/proxy/iptables/proxier.go:823@v1.33.5; registered unconditionally at 1.30, pkg/proxy/metrics/metrics.go:254@v1.30.14, and in iptables mode only since 1.31, pkg/proxy/metrics/metrics.go:311@v1.31.14, :311@v1.32.0, :311@v1.32.13, :344@v1.33.0 to v1.36.6, :426@v1.37.2; absent in ipvs and nftables mode)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_no_local_endpoint_services
  # A gauge of Services, not a packet counter: increase() over it (the former kubeproxy_no_local_endpoints_1h) measured nothing.
  why: Services with a Local traffic policy (internal or external) whose endpoints are all off this node, per node and policy, right now. Traffic for such a Service arriving at that node is dropped. The max over the two IP families (one series each since 1.33) is a lower bound of distinct Services, since a dual-stack Service appears in both
  query: max by (instance, traffic_policy) (kubeproxy_sync_proxy_rules_no_local_endpoints_total)
  source:
    - "kubeproxy_sync_proxy_rules_no_local_endpoints_total: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:229@v1.30.14, :263@v1.31.14, :262@v1.32.0, :262@v1.32.13, :272@v1.33.0, :272@v1.33.5, :272@v1.33.13, :272@v1.34.13, :272@v1.35.10, :272@v1.36.6, :274@v1.37.2 (a gauge, NewGaugeVec pkg/proxy/metrics/metrics.go:226@v1.30.14, :260@v1.31.14, :259@v1.32.0, :259@v1.32.13, :269@v1.33.0 to v1.36.6, :271@v1.37.2, of the number of Services with a Local traffic policy and no endpoint on this node, not a packet counter, so the query reads its current value and never increase(); label traffic_policy pkg/proxy/metrics/metrics.go:233@v1.30.14, :267@v1.31.14, :266@v1.32.0, :266@v1.32.13, labels traffic_policy, ip_family :276@v1.33.0 to v1.36.6, :278@v1.37.2; registered in every proxy mode, pkg/proxy/metrics/metrics.go:256@v1.30.14, :298@v1.31.14, :296@v1.32.0, :296@v1.32.13, :329@v1.33.0 to v1.36.6, :411@v1.37.2)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_ct_invalid_dropped_1h
  why: Packets dropped in conntrack INVALID state (1h). A sign of asymmetric routing or conntrack table trouble
  query: sum by (instance) (increase(kubeproxy_iptables_ct_state_invalid_dropped_packets_total[1h]))
  source:
    - "kubeproxy_iptables_ct_state_invalid_dropped_packets_total: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:147@v1.31.14, :147@v1.32.0, :147@v1.32.13, :152@v1.33.0, :152@v1.33.5, :152@v1.33.13, :152@v1.34.13, :152@v1.35.10, :152@v1.36.6, :154@v1.37.2 (absent at v1.30.14; a NewDesc read by a custom collector from the nfacct counter ct_state_invalid_dropped_pkts, registered only in iptables mode and only when nfacct is available on the node, pkg/proxy/metrics/metrics.go:303@v1.31.14, :302@v1.32.0, :302@v1.32.13, :335@v1.33.0 to v1.36.6, :417@v1.37.2 inside the ProxyModeIPTables case; the rule that counts the packets pkg/proxy/iptables/proxier.go:1489-1491@v1.33.5; an empty result is also 1.30, another proxy mode or a kernel without nfacct, not only zero drops)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_targets
  why: Scrape target status for job=kube-proxy (EKS). Empty on k3s, which has no such job
  query: up{job=~".*kube-proxy.*"}
  source:
    - "up: prometheus/prometheus scrape/scrape.go:1726,1746@v2.49.1, :2055,2131@v3.7.3 (written by Prometheus for every scrape target, 1 when the scrape succeeded and 0 when it failed; it carries the target's job and instance labels, never an exporter label)"
    - "label job on kube-proxy series: prometheus-community/helm-charts charts/kube-prometheus-stack/templates/exporters/kube-proxy/service.yaml:8@kube-prometheus-stack-56.0.0, :8@kube-prometheus-stack-79.5.0 (the Service label jobLabel: kube-proxy that the ServiceMonitor's jobLabel names, templates/exporters/kube-proxy/servicemonitor.yaml:18@kube-prometheus-stack-56.0.0, :18@kube-prometheus-stack-79.5.0, charts/kube-prometheus-stack/values.yaml:2419@kube-prometheus-stack-79.5.0, on by default, values.yaml:1824@kube-prometheus-stack-56.0.0, :2361@kube-prometheus-stack-79.5.0; the prometheus-operator turns it into the job label, prometheus-operator/prometheus-operator pkg/prometheus/promcfg.go:1373-1376@v0.71.0, :2063-2066@v0.86.2; on k3s kube-proxy runs inside the k3s process, k3s-io/k3s pkg/daemons/executor/embed.go:99-101@v1.33.5+k3s1, there is no kube-proxy Service, and its series arrive through the kubelet and apiserver scrapes with their instance values, one per scrape port of the same node)"
