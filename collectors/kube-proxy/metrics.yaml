# kube-proxy PromQL. On EKS the series come from job=kube-proxy; on k3s they are mixed into the kubelet/apiserver scrapes (kube-proxy runs inside the k3s process). No job filter.
# source: per name, read in kubernetes/kubernetes pkg/proxy/metrics/metrics.go at v1.30.14, v1.31.14, v1.32.0 (the EKS kube-proxy image), v1.32.13, v1.33.0, v1.33.5 (k3s), v1.33.13, v1.34.13,
# v1.35.10, v1.36.6, v1.37.2; the format is the one of #121 (core/metrics.yaml header). Since 1.31 the metrics are registered per proxy mode: the iptables-named ones exist in iptables mode only
# (the full-restore failure counter also in ipvs mode), the conntrack INVALID counter only with nfacct, and nothing of them in nftables mode; the sync, timestamp, programming and
# no-local-endpoints series exist in every mode. Since 1.33 the iptables counters carry ip_family and the restore-failure counters have a series only after their first failure.
- id: kubeproxy_sync_p99_1h
  why: p99 seconds of a rule sync (one iptables-restore). Above 1s Service/Endpoint changes reach nodes slowly; above 5s the iptables rule count is at its limit
  query: histogram_quantile(0.99, sum by (le) (rate(kubeproxy_sync_proxy_rules_duration_seconds_bucket[1h])))
  source:
    - "kubeproxy_sync_proxy_rules_duration_seconds_bucket: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:35@v1.30.14, :38@v1.31.14, :38@v1.32.0, :38@v1.32.13, :38@v1.33.0, :38@v1.33.5, :38@v1.33.13, :38@v1.34.13, :38@v1.35.10, :38@v1.36.6, :40@v1.37.2 (histogram kubeproxy_sync_proxy_rules_duration_seconds without labels; subsystem kubeproxy pkg/proxy/metrics/metrics.go:27@v1.30.14, :30@v1.31.14 to v1.36.6, :32@v1.37.2; registered in every proxy mode, pkg/proxy/metrics/metrics.go:242@v1.30.14, :286@v1.31.14, :284@v1.32.0, :284@v1.32.13, :317@v1.33.0 to v1.36.6, :399@v1.37.2; the query reads _bucket with le)"
- id: kubeproxy_sync_p99_by_instance_1h
  why: Sync p99 per node. If only one node is slow it is that node's rule count or CPU
  query: histogram_quantile(0.99, sum by (instance, le) (rate(kubeproxy_sync_proxy_rules_duration_seconds_bucket[1h])))
  source:
    - "kubeproxy_sync_proxy_rules_duration_seconds_bucket: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:35@v1.30.14, :38@v1.31.14, :38@v1.32.0, :38@v1.32.13, :38@v1.33.0, :38@v1.33.5, :38@v1.33.13, :38@v1.34.13, :38@v1.35.10, :38@v1.36.6, :40@v1.37.2 (histogram kubeproxy_sync_proxy_rules_duration_seconds without labels; subsystem kubeproxy pkg/proxy/metrics/metrics.go:27@v1.30.14, :30@v1.31.14 to v1.36.6, :32@v1.37.2; registered in every proxy mode, pkg/proxy/metrics/metrics.go:242@v1.30.14, :286@v1.31.14, :284@v1.32.0, :284@v1.32.13, :317@v1.33.0 to v1.36.6, :399@v1.37.2; the query reads _bucket with le)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_syncs_1h
  why: Sync count per node over 1h. Runs on every change and every syncPeriod
  query: sum by (instance) (increase(kubeproxy_sync_proxy_rules_duration_seconds_count[1h]))
  source:
    - "kubeproxy_sync_proxy_rules_duration_seconds_count: kubernetes/kubernetes pkg/proxy/metrics/metrics.go:35@v1.30.14, :38@v1.31.14, :38@v1.32.0, :38@v1.32.13, :38@v1.33.0, :38@v1.33.5, :38@v1.33.13, :38@v1.34.13, :38@v1.35.10, :38@v1.36.6, :40@v1.37.2 (the _count series of the histogram above, registered in every proxy mode)"
    - "label instance on kube-proxy series: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none: <node IP>:10249 under the kube-prometheus-stack kube-proxy Service, <node IP>:10250 and <node IP>:6443 on k3s where the kubelet and apiserver scrapes serve the same embedded kube-proxy; lib/summaries/kubeproxy.py maps each instance to a node by IP and keeps the max over the ports)"
- id: kubeproxy_rules_pending_s
  why: Last queued change time minus last sync time (seconds). Positive and above 60s means a change has not reached the node yet (stale rules)
  query: max by (instance) (kubeproxy_sync_proxy_rules_last_queued_timestamp_seconds - kubeproxy_sync_proxy_rules_last_timestamp_seconds)
