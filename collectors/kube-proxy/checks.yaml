- id: kubeproxy.conntrack-invalid-drops
  name: Many packets dropped in conntrack INVALID state (asymmetric routing, tangled NAT)
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['ct_invalid_dropped_1h'] or 0) >= 10000"
    warn_expr: "item['metrics_available'] and (item['ct_invalid_dropped_1h'] or 0) >= 500"
  target: "'cluster'"
  evidence: "f\"conntrack INVALID drops over 1 hour {item['ct_invalid_dropped_1h']} packets (sum over nodes), services with externalTrafficPolicy Local {item['external_traffic_local']}, no-local-endpoints drops {item['no_local_endpoints_1h']}\""
  severity_default: low
  symptom_linked: false
  why: >
    kube-proxy drops packets that conntrack judges INVALID (default since 1.29). A high count points to asymmetric routing (the reply leaves via another node), conntrack expiry of long-lived connections (tcpEstablishedTimeout), or NAT overlapping with the CNI. Apps see it as intermittent connection resets.
    Measured on a real EKS cluster: 1,038 packets in one hour on a single node.
  suggest: "On that node, use conntrack -L to see the peers of the INVALID flows; for long-lived connections, set the app keep-alive interval shorter than the conntrack timeout. Also check NLB/ALB preserve-client-ip and asymmetric paths."
  verify:
    - "sum by (instance) (increase(kubeproxy_iptables_ct_state_invalid_dropped_packets_total[1h]))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          embedded: false
          platform: "eks"
          mode: "iptables"
          modes_seen: []
          mode_mismatch: false
          metrics_bind_address: "0.0.0.0:10249"
          metrics_loopback_only: false
          metrics_available: true
          metrics_source: "job=kube-proxy"
