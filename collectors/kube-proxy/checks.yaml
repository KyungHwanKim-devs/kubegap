- id: kubeproxy.sync-slow
  name: iptables rule sync is slow (p99)
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['sync_p99_max_s'] or 0) >= 5"
    warn_expr: "item['metrics_available'] and (item['sync_p99_max_s'] or 0) >= 1"
  target: "'cluster'"
  evidence: "f\"sync p99 cluster-wide {item['sync_p99_s']}s, slowest node {item['sync_p99_max_node']} {item['sync_p99_max_s']}s, nat rules max {item['nat_rules_max']}, Services {item['services']}, endpoints {item['endpoints']}, mode {item['mode']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    One sync = rewriting the whole (or part of the) rule set via iptables-restore. When it is slow, a new pod is Ready but node routing only reflects it seconds later, causing 5xx and connection refused during rolling deployments. It scales with the rule count (services × endpoints) and node CPU.
    Measured on a real EKS cluster: p99 0.13s (two m5.large nodes); a small k3s cluster node: 0.51s.
  suggest: "Above 1s in iptables mode, move to ipvs or nftables mode (GA in 1.31+). As a stopgap, set minSyncPeriod to 1-2s to batch bursts."
  verify:
    - "histogram_quantile(0.99, sum by (instance, le) (rate(kubeproxy_sync_proxy_rules_duration_seconds_bucket[1h])))"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          embedded: false
          platform: "eks"
          mode: "iptables"
          modes_seen: []
          mode_mismatch: false
          metrics_bind_address: "0.0.0.0:10249"
          metrics_loopback_only: false
          metrics_available: true
          metrics_source: "job=kube-proxy"
