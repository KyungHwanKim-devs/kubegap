- id: kubeproxy.daemonset-not-ready
  name: kube-proxy pods are not Ready on every node
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    expr: "not item['embedded'] and item['daemonset_desired'] is not None and (item['daemonset_ready'] or 0) < item['daemonset_desired']"
    warn_expr: "len(item['healthz_failing_nodes']) > 0 or item['mode_mismatch']"
  target: "'cluster'"
  evidence: "f\"DaemonSet ready {item['daemonset_ready']}/{item['daemonset_desired']}, nodes failing healthz {item['healthz_failing_nodes']}, modes per node {item['modes_seen']} (mismatch {item['mode_mismatch']}), version {item['version']} (add-on {item['addon_version']})\""
