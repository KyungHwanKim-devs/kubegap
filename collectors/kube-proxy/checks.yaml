  symptom_linked: true
  why: >
    A node without kube-proxy cannot send any traffic to Service ClusterIPs — only the pods on that node see "connection failed to every service". healthz other than 200 means sync has stopped; different modes across nodes means a rollout in progress or diverged configuration.
