- id: kubeproxy.restore-failures
  name: iptables-restore failures (service routing on that node is stale)
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['restore_failures_24h'] or 0) > 0"
  target: "'cluster'"
  evidence: "f\"iptables-restore failures over 24 hours (full+partial) {item['restore_failures_24h']}, nodes {item['restore_failure_nodes']}\""
  severity_default: high
  symptom_linked: true
  why: >
    When iptables-restore fails, that sync's rules are not applied. Causes: another process (docker, CNI, firewall) holding the iptables lock, rule syntax conflicts, or a missing kernel module. This is the same event as the log signature kube-proxy.iptables-restore-failed.
  suggest: "Read the iptables-restore error lines in the kube-proxy log and check other daemons using iptables on the same node (docker — node.docker-and-containerd, ufw/firewalld)."
  verify:
    - "sum by (instance) (increase(kubeproxy_sync_proxy_rules_iptables_restore_failures_total[24h]))"
