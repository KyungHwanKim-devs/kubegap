- id: kubeproxy.iptables-scale
  name: iptables mode with many rules and services (grounds for moving to ipvs/nftables)
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    warn_expr: "(item['mode'] or 'iptables').startswith('iptables') and ((item['nat_rules_max'] or 0) >= 10000 or item['services'] >= 1000 or item['endpoints'] >= 5000)"
  target: "'cluster'"
  evidence: "f\"mode {item['mode']}, nat rules max {item['nat_rules_max']} (per node {item['nat_rules_by_node']}), Services {item['services']}, endpoints {item['endpoints']}, sync p99 {item['sync_p99_s']}s\""
  severity_default: low
  symptom_linked: false
  why: >
    iptables mode evaluates rules linearly and rewrites all of them on every sync. With thousands of services and tens of thousands of endpoints, sync slows to seconds and per-packet latency grows. ipvs (hashing) or nftables (GA in 1.31, recommended from 1.33) is the fix. Small clusters (measured: 105 services on an EKS cluster, 80 on a small k3s cluster) are not affected.
  suggest: "kube-proxy mode nftables (recommended on 1.33+) or ipvs. On EKS, mode in the add-on configurationValues."
  verify:
    - "max by (instance, table) (kubeproxy_sync_proxy_rules_iptables_total) ; kubectl get svc -A | wc -l"
  profiles: [prod, lab]
  test:
