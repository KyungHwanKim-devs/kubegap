# kube-proxy checks. summary.kubeproxy.summary — lib/kubeproxy.py. conntrack table saturation is handled by core node.conntrack-*.
- id: kubeproxy.metrics-not-scraped
  name: kube-proxy metrics missing from Prometheus or targets down (rule sync state cannot be observed)
  area: observability
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    warn_expr: "(not item['metrics_available']) or item['targets_down'] > 0 or item['metrics_loopback_only']"
  target: "'cluster'"
  evidence: "f\"metrics {item['metrics_available']} (source {item['metrics_source']}), targets up {item['targets_up']}/down {item['targets_down']} {item['targets_down_nodes']}, metricsBindAddress {item['metrics_bind_address']} (loopback only {item['metrics_loopback_only']}), nodes {item['nodes_total']}\""
  severity_default: low
  symptom_linked: false
  why: >
    The default kube-proxy metricsBindAddress is 127.0.0.1:10249, so Prometheus cannot scrape it from outside the node — all kube-proxy targets down in kube-prometheus-stack is the most common "red target". The EKS add-on changes it to 0.0.0.0 (measured: 7/7 up on a 7-node EKS cluster); on k3s the kube-proxy metrics are mixed into the kubelet scrape and are visible without a job.
  suggest: "EKS: set metricsBindAddress 0.0.0.0:10249 via the add-on configurationValues or the kube-proxy-config ConfigMap. kubeadm: edit the kube-proxy ConfigMap and restart."
  verify:
    - "up{job=~\".*kube-proxy.*\"} ; kubectl get cm -n kube-system kube-proxy-config -o yaml | grep metricsBindAddress"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          embedded: false
          platform: "eks"
          mode: "iptables"
          modes_seen: []
          mode_mismatch: false
          metrics_bind_address: "0.0.0.0:10249"
          metrics_loopback_only: false
          metrics_available: false
          metrics_source: null
          targets_up: 0
          targets_down: 0
          targets_down_nodes: []
          nodes_total: 7
          daemonset_desired: 7
          daemonset_ready: 7
          version: "1.32.0"
          addon_version: "v1.32.0-eksbuild.2"
          services: 105
          endpoints: 135
          external_traffic_local: 0
          nat_rules_max: 5
          nat_rules_by_node:
            ip-10-0-1-117.us-east-1.compute.internal: 5
            ip-10-0-1-139.us-east-1.compute.internal: 5
            ip-10-0-1-241.us-east-1.compute.internal: 5
