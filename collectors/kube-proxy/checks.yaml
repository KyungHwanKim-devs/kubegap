- id: kubeproxy.rules-pending
  name: Service/endpoint changes not yet applied to node rules
  area: traffic
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['rules_pending_max_s'] or 0) >= 300"
    warn_expr: "item['metrics_available'] and (item['rules_pending_max_s'] or 0) >= 60"
  target: "'cluster'"
  evidence: "f\"queue time − last sync time max {item['rules_pending_max_s']}s, nodes over 60s {item['rules_pending_nodes']}, change → applied p99 {item['programming_p99_s']}s\""
  severity_default: high
  symptom_linked: true
  why: >
    kube-proxy runs a sync when a change enters the queue. If the queue time is more than a minute ahead of the sync time, that node is sending traffic with stale rules (connections to dead pod IPs → timeouts). Causes: iptables-restore failures, a stuck kube-proxy, or a broken apiserver watch.
  suggest: "Check that node's kube-proxy log (logs/pods/kube-proxy/, the journal on k3s) for iptables-restore and sync errors and restart the pod. If it recurs, look at it together with kubeproxy.restore-failures."
  verify:
    - "max by (instance) (kubeproxy_sync_proxy_rules_last_queued_timestamp_seconds - kubeproxy_sync_proxy_rules_last_timestamp_seconds)"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          embedded: false
          platform: "eks"
          mode: "iptables"
          modes_seen: []
