- id: kubeproxy.node-cmd-unavailable
  name: kube-proxy mode and healthz could not be checked from inside the nodes
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: kubeproxy.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['node_cmd_unavailable']) == item['nodes_total'] and item['nodes_total'] > 0"
  target: "'cluster'"
  evidence: "f\"{len(item['node_cmd_unavailable'])} of {item['nodes_total']} nodes could not read /proxyMode or /healthz. Mode from the config file: {item['mode']}\""
  severity_default: low
  symptom_linked: false
  why: >
    The mode (iptables, ipvs, nftables) and healthz can only be read inside the node at 127.0.0.1:10249 and 10256. If none could be read, node access (SSM, SSH) was unavailable, so the mode in the kube-proxy section is the ConfigMap value (EKS) or unknown (k3s).
  suggest: "Set up node access (eks.ssm-unregistered, deploy/node-access/README.md)."
  verify:
    - "on the node: curl -s localhost:10249/proxyMode"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          embedded: false
          platform: "eks"
          mode: "iptables"
          modes_seen: []
          mode_mismatch: false
          metrics_bind_address: "0.0.0.0:10249"
