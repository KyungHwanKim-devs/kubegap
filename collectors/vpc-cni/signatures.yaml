# ---------------- vpc-cni (collectors/vpc-cni/signatures.yaml) ----------------
# All three vpc-cni signatures read the aws-node pod log, which holds only the logrus lines of the Go entrypoint (cmd/aws-vpc-cni/main.go). ipamd writes its zap JSON to
# AWS_VPC_K8S_CNI_LOG_FILE, default /host/var/log/aws-routed-eni/ipamd.log (pkg/utils/logger/config.go:9), to stdout only when that env is "stdout" (zaplogger.go:136@v1.19.0);
# the CNI plugin writes to AWS_VPC_K8S_PLUGIN_LOG_FILE (/var/log/aws-routed-eni/plugin.log). So on the default add-on configuration these patterns can only match
# the entrypoint lines, and silence is not evidence of health.
# Wording fixed to the source: "DataStore has no available IP/Prefix addresses" (capital D and S, "/Prefix"), "Failed to allocate %d IP addresses", "Failed to assign IPs from network card %d".
# The plugin's "Failed to assign an IP address to container %s" (cmd/routed-eni-cni-plugin/cni.go:183@v1.19.0, :219@v1.23.2) is matched by the first alternative when plugin.log is read.
- id: vpc-cni.ip-assign-failed
  name: Pod IP assignment failed (subnet or ENI exhausted)
  component: vpc-cni
  area: traffic
  severity: high
  sources: ["logs/pods/vpc-cni/*.log"]
  pattern: '[Ff]ailed to (assign|allocate) (an |\d+ )?IP|InsufficientFreeAddressesInSubnet|Unable to attach IPs/Prefixes for the ENI|DataStore has no available IP|no available IP(/Prefix)? addresses'
  meaning: New pods cannot get an IP and stay in ContainerCreating. The subnet's free IPs or the instance ENI/IP limit are used up. These are ipamd lines; they reach the aws-node pod log only when AWS_VPC_K8S_CNI_LOG_FILE=stdout (the default writes them to /var/log/aws-routed-eni/ipamd.log on the node), so a count of zero is not evidence of health.
  cause: Small subnet, ENI limit of the node type, WARM_IP_TARGET setting, prefix delegation not used.
  verify: "aws ec2 describe-subnets --query 'Subnets[].{id:SubnetId,free:AvailableIpAddressCount}'; kubectl get events -A | grep -i 'failed to assign'"
  source:
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/ipamd.go:182,314,867,869,872@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/ipamd.go:185,376,1079,1081,1084@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/awsutils/awsutils.go:1726@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/rpc_handler.go:233@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/datastore/data_store.go:664,734,735@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/datastore/data_store.go:83,858@v1.23.2"
    - "aws/amazon-vpc-cni-k8s cmd/routed-eni-cni-plugin/cni.go:183@v1.19.0"
    - "aws/amazon-vpc-cni-k8s cmd/routed-eni-cni-plugin/cni.go:219@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/config.go:21@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/config.go:21@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/zaplogger.go:136@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/zaplogger.go:145@v1.23.2"
    - "aws/amazon-vpc-cni-k8s cmd/aws-vpc-cni/main.go:435@v1.19.0"
    - "aws/amazon-vpc-cni-k8s cmd/aws-vpc-cni/main.go:437@v1.23.2"
# ipamd does not spell the throttle codes; the SDK retries them and a request that still fails is relayed in the %v of an ipamd log.Errorf line (e.g. "Failed to CreateNetworkInterface %v for subnet %s").
- id: vpc-cni.ec2-throttled
  name: aws-node throttled by the EC2 API
  component: vpc-cni
  area: platform
  severity: medium
  sources: ["logs/pods/vpc-cni/*.log"]
  pattern: 'RequestLimitExceeded|Throttling|Rate exceeded'
  meaning: ENI/IP allocation API calls slow down, delaying pod startup. The code appears only in an ipamd error line after the SDK's retries failed, and ipamd lines reach the pod log only with AWS_VPC_K8S_CNI_LOG_FILE=stdout (default is /var/log/aws-routed-eni/ipamd.log on the node), so a count of zero is not evidence of health.
  cause: Many nodes launching at once (scale-out, deployment), API quota shared with other controllers.
  verify: "kubectl logs -n kube-system -l k8s-app=aws-node --since=24h | grep -c RequestLimitExceeded"
  warn_at: 5
  fail_at: 100
  source:
    - "aws/aws-sdk-go aws/request/retryer.go:87,89@v1.55.5"
    - "aws/aws-sdk-go-v2 aws/retry/standard.go:70,77@v1.47.0"
    - "aws/aws-sdk-go aws/awserr/types.go:13@v1.55.5"
    - "aws/smithy-go errors.go:37@v1.28.1"
    - "aws/amazon-vpc-cni-k8s pkg/awsutils/awsutils.go:1025@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/awsutils/awsutils.go:1452@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/config.go:21@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/config.go:21@v1.23.2"
# `level=error` is the logrus text spelling of the entrypoint (the only lines in the pod log by default); ipamd's zap JSON spells "level":"error" and names its caller "ipamd/...",
# so the second alternative is anchored on both (ipamd runs at level DEBUG by default and its debug/info lines also contain "failed"). "failed to create ENI" is lowercase in source
# (a wrapped error) and the ENI-create log line is "Failed to CreateNetworkInterface %v for subnet %s".
- id: vpc-cni.ipamd-error
  name: ipamd errors
  component: vpc-cni
  area: traffic
  severity: medium
  sources: ["logs/pods/vpc-cni/*.log"]
  pattern: 'level=error|"level":"error".*"caller":"ipamd/|[Ff]ailed to (create|attach|delete) ENI|Failed to CreateNetworkInterface'
  meaning: The aws-node entrypoint (level=error) or the IP management daemon ipamd ("level":"error" JSON) logged errors. Check the samples to tell ENI-related from API-related. ipamd lines reach the pod log only with AWS_VPC_K8S_CNI_LOG_FILE=stdout (default is /var/log/aws-routed-eni/ipamd.log on the node), so a count of zero is not evidence of health.
  cause: IAM permissions (AmazonEKS_CNI_Policy on the node role), security groups, subnet configuration.
  verify: "kubectl logs -n kube-system -l k8s-app=aws-node --since=24h | grep -E 'level=error|\"level\":\"error\"' | head"
  warn_at: 10
  fail_at: 200
  source:
    - "aws/amazon-vpc-cni-k8s cmd/aws-vpc-cni/main.go:46,447@v1.19.0"
    - "aws/amazon-vpc-cni-k8s cmd/aws-vpc-cni/main.go:46,449@v1.23.2"
    - "sirupsen/logrus text_formatter.go:150@v1.9.3"
    - "sirupsen/logrus text_formatter.go:150@v1.9.4"
    - "sirupsen/logrus logrus.go:69@v1.9.3"
    - "sirupsen/logrus logrus.go:71@v1.9.4"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/zaplogger.go:101,118@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/utils/logger/zaplogger.go:103,121@v1.23.2"
    - "uber-go/zap config.go:127,129,134@v1.26.0"
    - "uber-go/zap config.go:127,129,134@v1.28.0"
    - "uber-go/zap zapcore/level.go:122@v1.26.0"
    - "uber-go/zap zapcore/level.go:122@v1.28.0"
    - "aws/amazon-vpc-cni-k8s pkg/awsutils/awsutils.go:797,860,1025@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/awsutils/awsutils.go:1046,1114,1452@v1.23.2"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/ipamd.go:1442@v1.19.0"
    - "aws/amazon-vpc-cni-k8s pkg/ipamd/ipamd.go:1728@v1.23.2"
