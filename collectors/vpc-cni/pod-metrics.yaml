- key: force_removed_enis
  names:
    - name: awscni_force_removed_enis
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:139@v1.19.0, :153@v1.23.2"
- key: force_removed_ips
  names:
    - name: awscni_force_removed_ips
