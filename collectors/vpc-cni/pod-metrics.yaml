# Metric names kubegap reads from the ipamd /metrics of aws-node (step vpc-cni.ipamd-metrics, a node step that curls 127.0.0.1:61678 from
# inside the node; parsed by lib/vpccni.py through lib/podmetrics.py). Read in aws/amazon-vpc-cni-k8s at v1.19.0 and v1.23.2 (#127).
- key: assigned_ips
  names:
    - name: awscni_assigned_ip_addresses
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:133@v1.19.0, :147@v1.23.2"
- key: total_ips
  names:
    - name: awscni_total_ip_addresses
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:127@v1.19.0, :141@v1.23.2"
- key: eni_allocated
  names:
    - name: awscni_eni_allocated
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:121@v1.19.0, :135@v1.23.2"
- key: eni_max
  names:
    - name: awscni_eni_max
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:47@v1.19.0, :47@v1.23.2"
- key: ip_max
  names:
    - name: awscni_ip_max
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:53@v1.19.0, :53@v1.23.2"
- key: total_ipv4_prefixes
  names:
    - name: awscni_total_ipv4_prefixes
      source: "aws/amazon-vpc-cni-k8s utils/prometheusmetrics/prometheusmetrics.go:151@v1.19.0, :165@v1.23.2"
- key: no_available_ips
  names:
    - name: awscni_no_available_ip_addresses
