- id: vpccni.max-pods-exceeds-ip-capacity
  name: Node max-pods is larger than the number of IPs the CNI can hand out
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.nodes
  rule:
    expr: "item['max_pods_exceeds_ip_capacity'] and item['pods_with_ip'] >= (item['ip_max'] or 0) * 0.5"
    warn_expr: "item['max_pods_exceeds_ip_capacity']"
  target: "item['node']"
  evidence: "f\"node {item['node']} ({item['instance_type']}): max-pods {item['max_pods']} > IP limit {item['ip_max']}+2 (ENI {item['max_eni']} x ({item['ipv4_per_eni']} per ENI - 1), over by {item['max_pods_over_ip']}). pods using an IP now {item['pods_with_ip']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    kubelet's max-pods is the number of slots the scheduler sees; the CNI's IP limit is what can actually be handed out. If the former is larger, the scheduler sends pods, the CNI refuses, and pods stall in ContainerCreating (a difference equal to the hostNetwork pods that use no IP is fine).
    The EKS-optimized AMI formula for max-pods is ENI x (IP - 1) + 2. The +2 is for aws-node and kube-proxy, which are hostNetwork and use no IP, and is normal (measured: every node was exactly +2); anything larger means Karpenter set `maxPods` separately, or prefix delegation was turned on and then off.
  suggest: "Set kubelet.maxPods in the Karpenter EC2NodeClass to the IP limit (x16 with prefix delegation), or enable prefix delegation to raise the IP limit."
  verify:
    - "kubectl get node <node> -o jsonpath='{.status.allocatable.pods}' ; aws ec2 describe-instance-types --instance-types <type> --query 'InstanceTypes[].NetworkInfo.[MaximumNetworkInterfaces,Ipv4AddressesPerInterface]'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: 4
          ipv4_per_eni: 15
          ip_capacity_calc: null
          max_pods: 58
          pods_with_ip: 42
          prod_pods: 27
          metrics:
            available: false
          ip_max: 56
          ip_used: 42
          ip_usage_ratio: null
          eni_at_max: false
          max_pods_exceeds_ip_capacity: true
          max_pods_over_ip: 6
          ip_headroom: null
          no_available_ip_events: null
          ec2_api_errors: null
          metrics_available: false
          prefix_delegation: false
          hypervisor: null
      - expect: "warn"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: 4
          ipv4_per_eni: 15
          ip_capacity_calc: null
          max_pods: 58
          pods_with_ip: 10
          prod_pods: 27
          metrics:
            available: false
          ip_max: 56
          ip_used: 42
          ip_usage_ratio: null
          eni_at_max: false
          max_pods_exceeds_ip_capacity: true
          max_pods_over_ip: 6
          ip_headroom: null
          no_available_ip_events: null
          ec2_api_errors: null
          metrics_available: false
          prefix_delegation: false
          hypervisor: null
      - expect: "pass"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: 3
          ipv4_per_eni: 10
          ip_capacity_calc: null
          max_pods: 29
          pods_with_ip: 15
          prod_pods: 27
          metrics:
            available: false
          ip_max: 27
          ip_used: 42
          ip_usage_ratio: null
          eni_at_max: false
          max_pods_exceeds_ip_capacity: false
          max_pods_over_ip: 2
          ip_headroom: null
          no_available_ip_events: null
          ec2_api_errors: null
          metrics_available: false
          prefix_delegation: false
          hypervisor: null
- id: vpccni.prefix-delegation-off
  name: nitro nodes but prefix delegation is off (IP limit is 16x smaller)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.warm.summary
  cluster_level: true
  rule:
    expr: "not item['prefix_delegation'] and item['nitro_nodes'] > 0 and len(item['nodes_no_available_ip']) > 0"
    warn_expr: "not item['prefix_delegation'] and item['nitro_nodes'] > 0 and len(item['nodes_near_ip_limit']) > 0"
  target: "'cluster'"
  evidence: "f\"ENABLE_PREFIX_DELEGATION false, nitro nodes {item['nitro_nodes']}/{item['nodes']}. nodes above 50% IP usage {item['nodes_near_ip_limit']}, nodes that saw 'no available IP' {item['nodes_no_available_ip']}. warm policy {item['policy']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Prefix delegation attaches a /28 prefix (16 IPs) to one ENI secondary IP slot, raising pod IPs per node 16x. On nitro instances (all recent generations) it is a single setting, and the subnet needs contiguous /28 space.
    If node IPs are more than half used or 'no available IP' has occurred, this setting is the cheapest fix. Note that it reserves the subnet in /28 units per node, so small subnets (/24) run out faster — read together with subnet free IPs (vpccni.subnet-ips-low).
  suggest: "Set ENABLE_PREFIX_DELEGATION=true and WARM_PREFIX_TARGET=1 on aws-node (via add-on configurationValues). It applies to new nodes only, so it takes effect as Karpenter replaces nodes. Raise max-pods as well."
  verify:
    - "kubectl get ds -n kube-system aws-node -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\\n' | grep -A1 PREFIX"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 7
          nodes_near_ip_limit:
            - "n1"
          nodes_no_available_ip:
            - "n1"
          metrics_unavailable_nodes:
            - "ip-10-0-1-117.us-east-1.compute.internal"
            - "ip-10-0-1-139.us-east-1.compute.internal"
            - "ip-10-0-1-241.us-east-1.compute.internal"
            - "ip-10-0-2-135.us-east-1.compute.internal"
            - "ip-10-0-2-218.us-east-1.compute.internal"
            - "ip-10-0-2-60.us-east-1.compute.internal"
            - "ip-10-0-2-83.us-east-1.compute.internal"
      - expect: "warn"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 7
          nodes_near_ip_limit:
            - "n1"
          nodes_no_available_ip: []
          metrics_unavailable_nodes:
            - "ip-10-0-1-117.us-east-1.compute.internal"
            - "ip-10-0-1-139.us-east-1.compute.internal"
            - "ip-10-0-1-241.us-east-1.compute.internal"
            - "ip-10-0-2-135.us-east-1.compute.internal"
            - "ip-10-0-2-218.us-east-1.compute.internal"
            - "ip-10-0-2-60.us-east-1.compute.internal"
            - "ip-10-0-2-83.us-east-1.compute.internal"
      - expect: "pass"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
