- id: vpccni.metrics-unreadable
  name: Nodes whose ipamd metrics could not be read (IP usage is an estimate only)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.warm.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['metrics_unavailable_nodes']) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item['metrics_unavailable_nodes'])} of {item['nodes']} nodes without readable ipamd metrics (localhost:61678): {item['metrics_unavailable_nodes'][:6]}\""
  severity_default: low
  symptom_linked: false
  why: >
    aws-node exposes metrics on 61678 via hostNetwork. When the node security group blocks the apiserver pod proxy, it is read with curl from inside the node — nodes not registered in SSM or without SSH cannot be read, and their IP usage is the estimate "pods using an IP / computed limit".
  measured: >
    Measured on an EKS cluster: the pod proxy timed out.
  suggest: "Register with SSM (eks.ssm-unregistered) or install cni-metrics-helper (awscni_* to CloudWatch or Prometheus)."
  verify:
    - "kubectl get pods -n kube-system -l k8s-app=aws-node -o wide"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
