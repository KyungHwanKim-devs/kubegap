            prefixes: 0
            no_available_ip_events: 4
            force_removed_enis: 0
            force_removed_ips: 0
            ec2_api_errors: 120
            ec2_api_errors_by_api:
              CreateNetworkInterface: 120
            per_eni:
              eni-a: 14
          ip_max: null
          ip_used: 42
          ip_usage_ratio: null
          eni_at_max: false
          max_pods_exceeds_ip_capacity: false
          max_pods_over_ip: 2
          ip_headroom: null
          no_available_ip_events: null
          ec2_api_errors: 120
          metrics_available: true
          prefix_delegation: false
          hypervisor: null
      - expect: "warn"
