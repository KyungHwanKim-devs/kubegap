            eni_allocated: 4
            eni_max: 4
            ip_max: 56
            prefixes: 0
            no_available_ip_events: 0
            force_removed_enis: 0
            force_removed_ips: 0
            ec2_api_errors: 0
            ec2_api_errors_by_api: {}
            per_eni:
              eni-a: 14
          ip_max: 56
          ip_used: 52
          ip_usage_ratio: 0.929
          eni_at_max: true
