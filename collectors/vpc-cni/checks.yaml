- id: vpccni.snat-port-randomization-off
  name: Node SNAT does not use --random-fully for source ports: pods leaving the VPC race on conntrack inserts and connection setup shows 1 s and 3 s delays
  area: traffic
  type: summary
  each: vpccni.summary
  cluster_level: true
  rule:
    warn_expr: "'snat_port_mode' in item and item['snat_port_mode'] in ('sequential', 'random', 'unknown')"
  target: "'cluster'"
  evidence: "f\"VPC CNI {item.get('cni_version') or 'version unknown'}, AWS_VPC_K8S_CNI_RANDOMIZESNAT {item.get('randomize_snat') or 'unset'}, external SNAT {item.get('external_snat')}; SNAT source ports: {item.get('snat_port_mode')}\""
  severity_default: medium
  symptom_linked: false
  why: >
    With external SNAT off, every pod connection that leaves the VPC is rewritten by an iptables SNAT rule on the node to the node's IP and a source port. When several pods open connections at the same moment and the rule hands out ports in a predictable order, they race to insert the same conntrack entry and the loser's SYN is dropped. TCP retransmits it after 1 s, then 3 s, so connection setup to anything outside the VPC shows exact 1 s and 3 s steps in the latency distribution while the service itself answers fast. The race needs load, so it appears first in the busiest paths.
    VPC CNI 1.4.0 added AWS_VPC_K8S_CNI_RANDOMIZESNAT with the default hashrandom, iptables --random, and 1.7.0 changed the default to prng, iptables --random-fully. The incident Prezi described in 2019 was this race on EKS; the fix they wanted, prng, was unavailable because their node image's iptables could not do --random-fully, so they turned external SNAT on instead and the delays stopped. The three states this check tells apart from the image version and the setting: sequential (none, or a CNI below 1.4.0), random (hashrandom, or the 1.4.0 to 1.6.x default) and random-fully (prng on 1.4.0 or newer, the default from 1.7.0). Only random-fully passes. The image version cannot show whether the node's iptables actually supports --random-fully; the CNI falls back to --random when it does not, so the node-side verify command is the final word. With external SNAT on there is no SNAT rule and this does not apply.
  cases:
    - { who: Prezi 2019, url: https://engineering.prezi.com/https-engineering-prezi-com-a-kubernetes-crime-story-2e8d75a77630 }
  suggest: "Upgrade the VPC CNI add-on to a current version on a current node image and leave AWS_VPC_K8S_CNI_RANDOMIZESNAT at its default prng; then confirm --random-fully on a node with the verify command. If the value was set to none because a NACL filters on the ephemeral port range, widen the NACL: hashrandom has the same effect on ports as prng. Turning external SNAT on also removes the race, but that changes the egress path and needs a NAT gateway route in every node subnet; see vpccni.external-snat-off-with-private-routes."
  verify:
    - "kubectl get ds -n kube-system aws-node -o jsonpath='{.spec.template.spec.containers[0].image}{\"\\n\"}{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{\"\\n\"}{end}' | grep -E 'amazon-k8s-cni|SNAT'"
    - "on a node: sudo iptables -t nat -S | grep -- '-j SNAT'   # expect --random-fully on the SNAT rule"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          nodes: 3
          external_snat: false
          randomize_snat: "none"
          cni_version: "1.19.0-eksbuild.1"
          snat_port_mode: "sequential"
      - expect: "warn"
        item:
          present: true
          nodes: 3
          external_snat: false
          randomize_snat: null
          cni_version: "1.6.3"
          snat_port_mode: "random"
      - expect: "warn"
        item:
          present: true
          nodes: 3
          external_snat: false
          randomize_snat: "hashrandom"
          cni_version: "1.19.0-eksbuild.1"
          snat_port_mode: "random"
      - expect: "warn"
        item:
          present: true
          nodes: 3
          external_snat: false
          randomize_snat: null
          cni_version: null
          snat_port_mode: "unknown"
      - expect: "pass"
        item:
          present: true
          nodes: 3
          external_snat: false
          randomize_snat: "prng"
          cni_version: "1.19.0-eksbuild.1"
          snat_port_mode: "random-fully"
      - expect: "pass"
        item:
          present: true
          nodes: 3
          external_snat: true
          randomize_snat: "prng"
          cni_version: "1.6.3"
          snat_port_mode: "not-applicable"
      - expect: "pass"
        item:
          present: true
          nodes: 3
          external_snat: false

- id: vpccni.external-snat-off-with-private-routes
  name: Pod traffic to peered networks is SNATed to the node IP (external SNAT off while the VPC has peering, transit gateway or VPN routes)
  area: traffic
  modes: [full]   # the VPC route tables are collected in the full run only
  type: summary
  each: vpccni.snat
  cluster_level: true
  rule:
    warn_expr: "not item['external_snat'] and len(item['private_destinations']) > 0"
  target: "'cluster'"
  evidence: "f\"AWS_VPC_K8S_CNI_EXTERNALSNAT false; private routes {'in the node subnets' if item.get('scoped_to_node_subnets') else 'in the cluster VPC'}: peering {item['peering_routes']}, transit gateway {item['transit_gateway_routes']}, VPN {item['vpn_routes']}, Outposts local gateway {item['local_gateway_routes']}, appliance {item.get('appliance_routes', 0)}; destinations still SNATed {item['private_destinations'][:6]}{'; exempted by AWS_VPC_K8S_CNI_EXCLUDE_SNAT_CIDRS ' + str(item.get('excluded_destinations')) if item.get('excluded_destinations') else ''}\""
  severity_default: medium
  symptom_linked: false
  why: >
    By default the VPC CNI rewrites the source of pod traffic that leaves the VPC to the node's primary IP (SNAT). The default exists for internet traffic: a pod IP is a secondary IP with no public mapping, so packets through an internet gateway would be dropped without it. The same rule applies to every destination outside the VPC CIDR, so when the VPC has routes to a peered VPC, a transit gateway, a VPN or an Outposts local gateway, traffic to those private networks is SNATed too. The other side then sees the node IP, not the pod IP: security groups and allowlists keyed on pod IPs fail, NLB client IP preservation shows the node, and many pods share one source IP, which brings the SNAT conntrack insert race and its 1 s and 3 s connection delays under load.
    This is not a misconfiguration by itself. It becomes one when pods must be seen by their own IP across those routes. The incident below is exactly that: a month of intermittently lost packets from pods to an NLB in a peered VPC, fixed by turning SNAT off.
  cases:
    - { who: MindTickle 2020, url: https://yashmehrotra.com/post/2020-03-16-case-of-missing-packet/ }
  suggest: "If pods talk to the peered VPC, transit gateway or VPN networks, set AWS_VPC_K8S_CNI_EXTERNALSNAT=true on aws-node (add-on configurationValues env). Before that, confirm every node subnet's route table reaches the internet through a NAT gateway: with external SNAT on, pod traffic leaves with the pod IP and relies on that route, so a subnet without it loses internet access for pods. Alternatively list the private CIDRs in AWS_VPC_K8S_CNI_EXCLUDE_SNAT_CIDRS to exempt only them."
  verify:
    - "kubectl get ds -n kube-system aws-node -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\\n' | grep -A1 SNAT"
    - "aws ec2 describe-route-tables --filters Name=vpc-id,Values=<vpc id> --query 'RouteTables[].Routes[?VpcPeeringConnectionId != null || TransitGatewayId != null || CoreNetworkArn != null || LocalGatewayId != null || (GatewayId && starts_with(GatewayId, `vgw-`))]'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          external_snat: false
          peering_routes: 1
          transit_gateway_routes: 0
          vpn_routes: 0
          local_gateway_routes: 0
          private_destinations: ["10.20.0.0/16"]
      - expect: "warn"
        item:
          external_snat: false
          peering_routes: 0
          transit_gateway_routes: 2
          vpn_routes: 1
          local_gateway_routes: 0
          private_destinations: ["10.30.0.0/16", "192.168.0.0/16"]
      - expect: "pass"
        item:
          external_snat: false
          peering_routes: 0
          transit_gateway_routes: 0
          vpn_routes: 0
          local_gateway_routes: 0
          private_destinations: []
      - expect: "pass"
        item:
          external_snat: true
          peering_routes: 1
          transit_gateway_routes: 0
          vpn_routes: 0
          local_gateway_routes: 0
          private_destinations: ["10.20.0.0/16"]
