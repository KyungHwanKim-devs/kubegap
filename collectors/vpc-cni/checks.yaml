- id: vpccni.ec2-api-errors
  name: aws-node accumulating EC2 API call failures (IAM, throttling, subnet)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.nodes
  rule:
    expr: "item['metrics_available'] and (item['ec2_api_errors'] or 0) >= 50"
    warn_expr: "item['metrics_available'] and (item['ec2_api_errors'] or 0) > 0"
  target: "item['node']"
  evidence: "f\"node {item['node']}: EC2 API failures {item['ec2_api_errors']} (by API {item['metrics'].get('ec2_api_errors_by_api')}), force-removed ENIs {item['metrics'].get('force_removed_enis')} / IPs {item['metrics'].get('force_removed_ips')} (cumulative since ipamd start, IMDS 404 excluded)\""
  severity_default: medium
  symptom_linked: false
  why: >
    ipamd creates and attaches ENIs and allocates IPs through the EC2 API. As failures pile up, the warm pool cannot be refilled, so pods start slowly or get no IP. Causes are a missing AmazonEKS_CNI_Policy on the node role, API throttling (RequestLimitExceeded), and subnet or security group configuration. Read together with the log signatures vpc-cni.ec2-throttled and ipamd-error.
  suggest: "Find the failing API name in the aws-node logs (logs/pods/vpc-cni/); for IAM fix the node role policy, for throttling reduce the concurrent scale-out burst."
  verify:
    - "kubectl logs -n kube-system -l k8s-app=aws-node --since=24h | grep -iE 'error|throttl' | head"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: null
          ipv4_per_eni: null
          ip_capacity_calc: null
          max_pods: 58
          pods_with_ip: 42
          prod_pods: 27
