- id: vpccni.subnet-ips-low
  name: Node subnet has few free IPs
  area: traffic
  type: summary
  each: vpccni.subnets
  rule:
    expr: "(item['available'] or 0) < 32 or (item['available_ratio'] or 1) < 0.1"
    warn_expr: "(item['available_ratio'] or 1) < 0.25"
  target: "item['subnet_id']"
  evidence: "f\"subnet {item['subnet_id']} ({item['name']}, {item['az']}, {item['cidr']}): free IPs {item['available']}/{item['usable']} (used {item['used_ratio']}), {item['nodes']} nodes in this AZ\""
  severity_default: high
  symptom_linked: true
  why: >
    Nodes, pods, ENIs and LBs all draw from the same subnet IPs. When the subnet is empty, new nodes cannot start (Karpenter InsufficientFreeAddressesInSubnet) and existing nodes cannot refill their warm pool. A /24 has 251 usable addresses, which a few nodes exhaust.
  measured: >
    Measured on a 7-node EKS cluster: two /24 subnets with 148 and 151 free (40% used) — still fine.
  cases:
    - { who: loveholidays 2020, url: https://deploy.live/blog/when-gke-ran-out-of-ip-addresses/ }
    - { who: Neon 2025, url: https://neon.com/blog/aws-cni-lessons-from-a-production-outage }
    - { who: Adevinta 2024, url: https://adevinta.com/techblog/how-we-avoided-an-outage-caused-by-running-out-of-ips-in-eks/ }
  suggest: "A subnet cannot be widened; instead attach a secondary CIDR to the VPC and use custom networking (ENIConfig) to place only pods there. Or tidy per-node reservations with prefix delegation."
  verify:
    - "aws ec2 describe-subnets --subnet-ids <id> --query 'Subnets[].AvailableIpAddressCount'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          subnet_id: "subnet-01e43688f4ab26b0e"
          name: "acme-vpc-eks-private-us-east-1a"
          az: "us-east-1a"
          cidr: "10.0.1.0/24"
          usable: 251
          available: 20
          used_ratio: 0.92
          available_ratio: 0.08
          nodes: 3
      - expect: "warn"
        item:
          subnet_id: "subnet-01e43688f4ab26b0e"
          name: "acme-vpc-eks-private-us-east-1a"
          az: "us-east-1a"
          cidr: "10.0.1.0/24"
          usable: 251
          available: 50
          used_ratio: 0.8
          available_ratio: 0.199
          nodes: 3
      - expect: "pass"
        item:
          subnet_id: "subnet-01e43688f4ab26b0e"
          name: "acme-vpc-eks-private-us-east-1a"
          az: "us-east-1a"
          cidr: "10.0.1.0/24"
          usable: 251
          available: 148
          used_ratio: 0.41
          available_ratio: 0.59
          nodes: 3
- id: vpccni.warm-pool-whole-eni
  name: ENI-sized warm pool without WARM_IP_TARGET (each node keeps one ENI's worth of IPs idle)
  area: platform
  type: summary
  each: vpccni.warm.summary
  cluster_level: true
  rule:
    warn_expr: "item['policy'] == 'whole_eni' and (len(item['subnets_low']) > 0 or (item['min_subnet_available'] or 10**9) < 64)"
  target: "'cluster'"
  evidence: "f\"warm policy {item['policy']} (WARM_ENI_TARGET {item['warm_eni_target']}, WARM_IP_TARGET {item['warm_ip_target']}), idle reserved IPs total {item['idle_ips_total']}, min subnet free {item['min_subnet_available']}, subnets below 25% free {item['subnets_low']}\""
  severity_default: low
  symptom_linked: false
  why: >
    The default (WARM_ENI_TARGET=1) pre-allocates one ENI's worth of IPs per node (e.g. 9 on m5.large, 14 on r8gd.xlarge). Pod startup is fast, but the subnet loses nodes x ENI-size IPs to reservations. Fine if the subnet is roomy; if not, reduce reservations with WARM_IP_TARGET and MINIMUM_IP_TARGET.
  measured: >
    Measured on a 7-node EKS cluster: 148 and 151 free in the subnets, so no warning.
  cases:
    - { who: Neon 2025, url: https://neon.com/blog/aws-cni-lessons-from-a-production-outage }
  suggest: "Only when the subnet is tight: WARM_IP_TARGET=5, MINIMUM_IP_TARGET=10 or so. With prefix delegation, WARM_PREFIX_TARGET=1 is the default and these settings are ignored."
  verify:
    - "kubectl get ds -n kube-system aws-node -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\\n' | grep -A1 -E 'WARM|MINIMUM'"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low:
            - "subnet-a"
          min_subnet_available: 40
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 0
          nodes_near_ip_limit: []
          nodes_no_available_ip: []
          metrics_unavailable_nodes:
            - "ip-10-0-1-117.us-east-1.compute.internal"
            - "ip-10-0-1-139.us-east-1.compute.internal"
            - "ip-10-0-1-241.us-east-1.compute.internal"
            - "ip-10-0-2-135.us-east-1.compute.internal"
            - "ip-10-0-2-218.us-east-1.compute.internal"
            - "ip-10-0-2-60.us-east-1.compute.internal"
            - "ip-10-0-2-83.us-east-1.compute.internal"
      - expect: "pass"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 0
          nodes_near_ip_limit: []
          nodes_no_available_ip: []
