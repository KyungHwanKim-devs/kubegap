# VPC CNI (aws-node) checks. summary.vpccni — lib/vpccni.py. Network policy enforcement and add-on versions are covered by the core security and eks-platform checks.
- id: vpccni.node-ip-exhaustion
  name: Node pod IPs near the limit or "no available IP" has already occurred
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.nodes
  rule:
    expr: "item['metrics_available'] and ((item['no_available_ip_events'] or 0) > 0 or (item['ip_usage_ratio'] or 0) >= 0.9)"
    warn_expr: "(item['ip_usage_ratio'] or 0) >= 0.75 or (item['ip_headroom'] is not None and item['ip_headroom'] <= 4)"
  target: "item['node']"
  evidence: "f\"node {item['node']} ({item['instance_type']}, pool {item['pool']}): pod IPs {item['ip_used']}/{item['ip_max']} ({item['ip_usage_ratio']}), ENI {item['metrics'].get('eni_allocated')}/{item['metrics'].get('eni_max')} (at limit {item['eni_at_max']}), 'no available IP' events {item['no_available_ip_events']}, max-pods {item['max_pods']}, prod pods {item['prod_pods']}. prefix delegation {item['prefix_delegation']}\""
  severity_default: high
  symptom_linked: true
  why: >
    VPC CNI gives each pod a VPC IP as a secondary IP on an ENI. The instance type decides how many IPs a node can hold (ENIs x (IPv4 per ENI - 1)). Once they are used up, new pods stall in ContainerCreating with "failed to assign an IP address" — the most common EKS trap.
    `no_available_ip_events` is how many times ipamd answered "no IP to give" (cumulative since the process started), so any non-zero value means it has already happened at least once. ENIs attached up to the limit (eni_at_max) is normal with WARM_ENI_TARGET=1, so it is not a judgement axis — 4 or fewer remaining IPs (ip_headroom) or 75% usage is warn. max-pods exceeding the IP limit by 2 is normal: that is the hostNetwork pods' share.
  measured: >
    Measured on a 7-node EKS cluster: an r8gd.xlarge node at ENI 4/4 and IP 42/56 had 4 'no available IP' events. Its max-pods was 58 while IPs stop at 56, so kubelet sees room and the CNI refuses.
  cases:
    - { who: Neon 2025, url: https://neon.com/blog/aws-cni-lessons-from-a-production-outage }
    - { who: Adevinta 2024, url: https://adevinta.com/techblog/how-we-avoided-an-outage-caused-by-running-out-of-ips-in-eks/ }
    - { who: UK Ministry of Justice 2023, url: https://runbooks.cloud-platform.service.justice.gov.uk/incidents/2023-07-21-vpc-cni-not-allocating-ip-addresses.html }
  suggest: "(1) prefix delegation (ENABLE_PREFIX_DELEGATION=true, /28 prefixes give 16x the IPs) — works immediately on nitro instances. (2) Or spread pods across nodes (topologySpread) and tune the Karpenter consolidation that packs them onto one large node. (3) Set max-pods below the IP limit."
  verify:
    - "on the node: curl -s localhost:61678/metrics | grep -E 'awscni_(assigned_ip_addresses|total_ip_addresses|eni_max|no_available_ip_addresses)'"
    - "kubectl get events -A --field-selector reason=FailedCreatePodSandBox | grep -i 'assign'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: null
          ipv4_per_eni: null
          ip_capacity_calc: null
          max_pods: 58
          pods_with_ip: 42
          prod_pods: 27
          metrics:
            available: true
            assigned: 42
            total: 56
            eni_allocated: 4
            eni_max: 4
            ip_max: 56
            prefixes: 0
            no_available_ip_events: 4
            force_removed_enis: 0
            force_removed_ips: 0
            ec2_api_errors: 0
            ec2_api_errors_by_api: {}
            per_eni:
              eni-a: 14
          ip_max: 56
          ip_used: 42
          ip_usage_ratio: 0.75
          eni_at_max: true
          max_pods_exceeds_ip_capacity: false
          max_pods_over_ip: 2
          ip_headroom: null
          no_available_ip_events: 4
          ec2_api_errors: 0
          metrics_available: true
          prefix_delegation: false
          hypervisor: null
      - expect: "fail"
        item:
          node: "ip-10-0-1-139.us-east-1.compute.internal"
          instance_type: "r8gd.xlarge"
          pool: "default"
          max_eni: null
          ipv4_per_eni: null
          ip_capacity_calc: null
          max_pods: 58
          pods_with_ip: 42
          prod_pods: 27
          metrics:
            available: true
            assigned: 52
