- id: vpccni.ec2-api-errors
  name: aws-node accumulating EC2 API call failures (IAM, throttling, subnet)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.nodes
  rule:
    expr: "item['metrics_available'] and (item['ec2_api_errors'] or 0) >= 50"
    warn_expr: "item['metrics_available'] and (item['ec2_api_errors'] or 0) > 0"
  target: "item['node']"
  evidence: "f\"node {item['node']}: EC2 API failures {item['ec2_api_errors']} (by API {item['metrics'].get('ec2_api_errors_by_api')}), force-removed ENIs {item['metrics'].get('force_removed_enis')} / IPs {item['metrics'].get('force_removed_ips')} (cumulative since ipamd start, IMDS 404 excluded)\""
