- id: vpccni.metrics-unreadable
  name: Nodes whose ipamd metrics could not be read (IP usage is an estimate only)
  area: platform
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: vpccni.warm.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['metrics_unavailable_nodes']) > 0"
  target: "'cluster'"
  evidence: "f\"{len(item['metrics_unavailable_nodes'])} of {item['nodes']} nodes without readable ipamd metrics (localhost:61678): {item['metrics_unavailable_nodes'][:6]}\""
  severity_default: low
  symptom_linked: false
  why: >
    aws-node exposes metrics on 61678 via hostNetwork, but the apiserver pod proxy is blocked by the node security group (measured: timeout). So it is read with curl from inside the node — nodes not registered in SSM or without SSH cannot be read, and their IP usage is the estimate "pods using an IP / computed limit".
  suggest: "Register with SSM (eks.ssm-unregistered) or install cni-metrics-helper (awscni_* to CloudWatch or Prometheus)."
  verify:
    - "kubectl get pods -n kube-system -l k8s-app=aws-node -o wide"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 0
          nodes_near_ip_limit: []
          nodes_no_available_ip: []
          metrics_unavailable_nodes:
            - "ip-10-0-1-117"
            - "ip-10-0-2-60"
      - expect: "pass"
        item:
          policy: "whole_eni"
          warm_eni_target: 1
          warm_ip_target: null
          idle_ips_total: 0
          subnets_low: []
          min_subnet_available: 148
          nodes: 7
          prefix_delegation: false
          nitro_nodes: 0
          nodes_near_ip_limit: []
          nodes_no_available_ip: []
          metrics_unavailable_nodes: []
