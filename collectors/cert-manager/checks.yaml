# cert-manager checks (on EKS this is enabled when cert-manager is used instead of ACM). summary.certmanager.summary — lib/certmanager.py. Secret values are never read. Ingress exposure and authentication are covered by core traffic and security.
- id: certmanager.certificate-not-ready
  name: Certificate not Ready (issuance or renewal is stuck)
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['not_ready_prod']) > 0 or len(item['expired']) > 0"
    warn_expr: "len(item['not_ready']) > 0 or len(item['issuing_stuck']) > 0"
  target: "'cluster'"
  evidence: "f\"Certificates {item['certificates']} (prod {item['certificates_prod']}), not Ready {item['not_ready']} (prod {item['not_ready_prod']}), expired {item['expired']}, stuck in Issuing {item['issuing_stuck']}, failed CertificateRequests {item['certificaterequests_failed']}\""
  severity_default: high
  symptom_linked: true
  why: >
    A Certificate with Ready False either has no Secret (first issuance failed → the ingress answers with its default certificate, browser warning) or is frozen on an old certificate (renewal failed → the service breaks on the expiry date). The reason is in the Issuing condition message and in the CertificateRequest, Order and Challenge.
    Measured on a real k3s: all 31 Ready, 114 CertificateRequests and 110 Orders all valid → pass.
  suggest: "Walk down from the Conditions/Events of kubectl describe certificate <name> → certificaterequest → order → challenge (cmctl status certificate <name>)."
  verify:
    - "kubectl get certificates -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,NOTAFTER:.status.notAfter"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.14.4"
          components:
            controller: "1/1"
            cainjector: "1/1"
            webhook: "1/1"
          components_not_ready: []
          components_single_replica:
            - "controller"
            - "cainjector"
            - "webhook"
          certificates: 31
          certificates_prod: 22
          not_ready:
            - "p/certificate/x(Failed)"
          not_ready_prod:
            - "p/certificate/x"
          expiring_30d: []
          expiring_14d: []
          expired: []
          min_days_to_expiry: 31.0
          renewal_overdue: []
          issuing_stuck: []
          staging_certs: []
          staging_certs_prod: []
          issuers: 3
          issuers_not_ready: []
          issuers_unused:
            - "ClusterIssuer/letsencrypt-staging"
          issuer_types:
            acme: 2
            selfSigned: 1
          solvers:
            - "http01"
          certificaterequests: 114
          certificaterequests_failed: []
          certificaterequests_denied: []
          orders: 110
          orders_by_state:
            valid: 110
          orders_bad: []
          orders_pending_old: []
          challenges: 0
          challenges_bad: []
          ingress_tls: 34
          ingress_tls_unmanaged: []
          ingress_tls_unmanaged_prod: []
          ingress_no_tls: []
          webhooks_fail:
            - "webhook.cert-manager.io"
            - "webhook.cert-manager.io"
          webhook_replicas: 1
          metrics_available: true
