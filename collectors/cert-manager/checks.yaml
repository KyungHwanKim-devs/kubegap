- id: certmanager.staging-issuer-in-prod
  name: prod certificate issued by the Let's Encrypt staging issuer (browsers do not trust it)
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['staging_certs_prod']) > 0"
    warn_expr: "len(item['staging_certs']) > 0"
  target: "'cluster'"
  evidence: "f\"certificates from a staging issuer {item['staging_certs']} (prod {item['staging_certs_prod']})\""
