- id: certmanager.issuer-not-ready
  name: Issuer/ClusterIssuer not Ready
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['issuers_not_ready']) > 0"
  target: "'cluster'"
  evidence: "f\"issuers {item['issuers']} ({item['issuer_types']}, solvers {item['solvers']}), not Ready {item['issuers_not_ready']}, issuers with no certificates {item['issuers_unused']}\""
