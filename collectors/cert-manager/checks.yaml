- id: certmanager.ingress-tls-unmanaged
  name: Ingress TLS Secret not managed by cert-manager (nobody watches expiry), or Ingress without TLS
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['ingress_tls_unmanaged_prod']) > 0"
    warn_expr: "len(item['ingress_tls_unmanaged']) > 0 or len(item['ingress_no_tls']) > 0"
  target: "'cluster'"
  evidence: "f\"Ingress TLS entries {item['ingress_tls']}, Secrets not managed by cert-manager {item['ingress_tls_unmanaged']} (prod {item['ingress_tls_unmanaged_prod']}), Ingresses without TLS {item['ingress_no_tls']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    Hand-placed TLS Secrets (a copied wildcard certificate, an external CA) have no expiry tracking — they break in the middle of the night a year later. When cert-manager manages them there is a Certificate object and a metric (expiration_timestamp). An Ingress without TLS is plain HTTP (ALB is the exception, since it does TLS through the certificate-arn annotation).
    Measured on a real k3s: all 34 TLS entries managed by cert-manager, 0 Ingresses without TLS → pass.
  suggest: "Add the cert-manager.io/cluster-issuer annotation to the Ingress so ingress-shim creates the Certificate. For external CA certificates that are not a Certificate, at least monitor expiry (blackbox exporter probe_ssl_earliest_cert_expiry)."
  verify:
    - "kubectl get ingress -A -o json | jq -r '.items[] | .metadata.namespace+\"/\"+.metadata.name+\" \"+((.spec.tls//[])|map(.secretName)|join(\",\"))'"
