- id: certmanager.acme-challenge-failing
  name: ACME Order or Challenge failed or pending for more than 1 hour
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['orders_bad']) > 0 or any(c['state'] in ('invalid', 'errored') for c in item['challenges_bad'])"
    warn_expr: "len(item['challenges_bad']) > 0 or len(item['orders_pending_old']) > 0 or len(item['certificaterequests_denied']) > 0"
  target: "'cluster'"
  evidence: "f\"Orders {item['orders']} by state {item['orders_by_state']}, failed {item['orders_bad']}, pending over 1 hour {item['orders_pending_old']}, Challenges {item['challenges']} with problems {item['challenges_bad']}, denied CertificateRequests {item['certificaterequests_denied']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    A Challenge that stays pending means Let's Encrypt cannot validate the domain — HTTP-01 needs the solver pod and temporary ingress to be reachable from outside (ingress controller LoadBalancer IP, port 80, firewall), DNS-01 needs correct DNS provider credentials. invalid is a validation failure (the Let's Encrypt response is in reason — 403 unauthorized, connection refused), errored is an error on the cert-manager side. Accumulating failed Orders hits the rate limit (5 failures per account and hostname per week) and blocks issuance for a week.
    Measured on a real k3s: 110 Orders all valid, 0 Challenges → pass.
  suggest: "Read the Reason in kubectl describe challenge -A. For HTTP-01, run curl -v http://<host>/.well-known/acme-challenge/x from outside."
  verify:
    - "kubectl get orders,challenges -A"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.14.4"
