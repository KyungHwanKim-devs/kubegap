- id: certmanager.certificate-expiring
  name: Certificate expiring soon, or renewal time passed without renewal
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "len(item['expiring_14d']) > 0 or len(item['renewal_overdue']) > 0"
    warn_expr: "len(item['expiring_30d']) > 0"
  target: "'cluster'"
  evidence: "f\"expiring within 30 days {item['expiring_30d']}, within 14 days {item['expiring_14d']}, renewalTime passed by more than 24h without renewal {item['renewal_overdue']}, nearest expiry {item['min_days_to_expiry']} days (metric {item['min_days_to_expiry_metric']})\""
  severity_default: high
  symptom_linked: false
  why: >
    Let's Encrypt certificates last 90 days and cert-manager renews them 30 days before expiry (renewBefore defaults to 1/3 of duration). So "expiring within 30 days" is the tail of a normal cycle, and "renewalTime passed but not renewed" is the real signal — caused by ACME challenge failures (HTTP-01 breaks when the ingress path or DNS changes), rate limits (50 per week) or account key problems.
    Measured on a real k3s: nearest expiry 31 days (two certificates due for renewal the next day) → pass. Whether those two were renewed is the thing to confirm on the next run.
  suggest: "Try a manual renewal with cmctl renew <name> and watch the Challenge state. For HTTP-01, check that http://<host>/.well-known/acme-challenge/ is reachable from outside."
  verify:
    - "kubectl get certificates -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,RENEW:.status.renewalTime,NOTAFTER:.status.notAfter | sort -k3"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
