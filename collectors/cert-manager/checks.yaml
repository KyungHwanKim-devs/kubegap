- id: certmanager.version-old
  name: cert-manager version is end of life
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    warn_expr: "item['version'] is not None and (int(str(item['version']).split('.')[0]) < 1 or int(str(item['version']).split('.')[1]) < 16)"
  target: "'cluster'"
  evidence: "f\"cert-manager {item['version']} (components {item['components']}), webhooks with Fail {len(item['webhooks_fail'])} / webhook replicas {item['webhook_replicas']}\""
  severity_default: low
  symptom_linked: false
  why: >
    cert-manager supports only the two latest minors (at 1.17/1.18, 1.14 is out of support). Old versions cannot follow ACME protocol changes (Let's Encrypt ending OCSP, ARI renewal info, short-lived certificates). If the webhook has failurePolicy Fail with 1 replica, Certificate and Ingress creation is rejected while the webhook pod restarts (same structure as ESO).
    Measured on a real k3s: 1.14.4 (2024-03) → warn.
  suggest: "Upgrade the cert-manager Helm chart one minor at a time (including the CRD upgrade: --set crds.enabled=true or kubectl apply cert-manager.crds.yaml)."
  verify:
    - "kubectl -n cert-manager get deploy -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.spec.template.spec.containers[0].image}{\"\\n\"}{end}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "1.14.4"
          components:
            controller: "1/1"
            cainjector: "1/1"
