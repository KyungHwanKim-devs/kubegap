- id: certmanager.controller-errors
  name: cert-manager controller sync errors and ACME client errors accumulating
  area: security
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and ((item['acme_error_ratio'] or 0) >= 0.2 and (item['acme_errors'] or 0) >= 20)"
    warn_expr: "item['metrics_available'] and ((item['sync_errors'] or 0) >= 100 or (item['acme_errors'] or 0) > 0)"
  target: "'cluster'"
  evidence: "f\"sync calls since controller start {item['sync_calls']} / errors {item['sync_errors']}, ACME requests {item['acme_requests']} by status {item['acme_by_status']} (4xx/5xx {item['acme_errors']}, ratio {item['acme_error_ratio']}), Ready False metric {item['not_ready_metric']}\""
  severity_default: low
  symptom_linked: false
  why: >
    Sync errors count how often the controller failed while reconciling some object (permissions, webhook, transient errors included), so a high number is not an outage by itself, but a steady climb means some Certificate is not progressing. ACME 4xx is rate limiting (429), bad requests (400) or account problems (403); 5xx is on the Let's Encrypt side.
    Measured on a real k3s: 216 errors out of 1,574 syncs (13.7%), one 400 out of 49 ACME requests → warn (low). Every Certificate was Ready, so the errors were most likely past transient failures — confirm in the logs.
  suggest: "kubectl -n cert-manager logs deploy/cert-manager --since=24h | grep -iE 'error|failed' | sort | uniq -c | sort -rn | head"
  verify:
    - "kubectl get --raw /api/v1/namespaces/cert-manager/pods/<controller-pod>:9402/proxy/metrics | grep -E 'certmanager_controller_sync_error_count|certmanager_http_acme_client_request_count'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "1.14.4"
