- id: certmanager.metrics-unreadable
  name: cert-manager controller metrics could not be read
  area: observability
  type: summary
  each: certmanager.summary
  cluster_level: true
  rule:
    warn_expr: "not item['metrics_available']"
  target: "'cluster'"
  evidence: "f\"no metrics/pod/cert-manager/ — Prometheus does not scrape certmanager_* (no ServiceMonitor) and neither the proxy nor node access could read them. {item['certificates']} Certificates were read as objects\""
  severity_default: low
  symptom_linked: false
  why: >
    Without the controller's :9402, ACME response codes and sync errors are invisible. Expiry and Ready are read from objects, so those checks still work. If Prometheus scrapes it, Alertmanager rules (CertManagerCertExpirySoon) become possible too.
  suggest: "Helm values prometheus.servicemonitor.enabled true. Otherwise node access (SSM or SSH)."
  verify:
