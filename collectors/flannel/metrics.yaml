# flannel overlay interface (flannel.1) and bridge (cni0) counters. Uses node-exporter's node_network_* (flannel has no metrics of its own — k3s built-in flannel is not a pod). Read by lib/flannelctl.py.
- id: flannel_if_errors_1d
  why: RX/TX errors that increased on flannel.1 and cni0 over 24 hours (by node and device). Non-zero means overlay packets are being corrupted (MTU, underlay NIC)
  query: sum by (instance, device) (increase(node_network_receive_errs_total{device=~"flannel.*|cni0"}[1d]) + increase(node_network_transmit_errs_total{device=~"flannel.*|cni0"}[1d]))
  source:
    - "node_network_receive_errs_total: prometheus/node_exporter collector/netdev_linux.go:112,168@v1.7.0, :113,169@v1.10.2, :112,168@v1.12.1 (reader key receive_errors; legacy() renames it to receive_errs at collector/netdev_common.go:194-195@v1.7.0, :209-210@v1.10.2, :211-212@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "node_network_transmit_errs_total: prometheus/node_exporter collector/netdev_linux.go:113,176@v1.7.0, :114,177@v1.10.2, :113,176@v1.12.1 (reader key transmit_errors; legacy() renames it to transmit_errs at collector/netdev_common.go:209-210@v1.7.0, :224-225@v1.10.2, :226-227@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "label instance: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none, so on node-exporter series it is <node IP>:9100, which lib/evaluate.py and the summaries map to the node by IP; a scrape config that relabels instance changes this)"
- id: flannel_if_drops_1d
  why: RX/TX drops that increased over 24 hours. Unlike the cumulative-since-boot node script, this shows "is it still increasing now"
  query: sum by (instance, device) (increase(node_network_receive_drop_total{device=~"flannel.*|cni0"}[1d]) + increase(node_network_transmit_drop_total{device=~"flannel.*|cni0"}[1d]))
  source:
    - "node_network_receive_drop_total: prometheus/node_exporter collector/netdev_linux.go:114,169@v1.7.0, :115,170@v1.10.2, :114,169@v1.12.1 (reader key receive_dropped; legacy() renames it to receive_drop at collector/netdev_common.go:197-198@v1.7.0, :212-213@v1.10.2, :214-215@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "node_network_transmit_drop_total: prometheus/node_exporter collector/netdev_linux.go:115,177@v1.7.0, :116,178@v1.10.2, :115,177@v1.12.1 (reader key transmit_dropped; legacy() renames it to transmit_drop at collector/netdev_common.go:212-213@v1.7.0, :227-228@v1.10.2, :229-230@v1.12.1 unless --collector.netdev.enable-detailed-metrics is set, :39,118-120@v1.7.0, :38,123-125@v1.10.2, :36,121-123@v1.12.1; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "label instance: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none, so on node-exporter series it is <node IP>:9100, which lib/evaluate.py and the summaries map to the node by IP; a scrape config that relabels instance changes this)"
- id: flannel_if_up
  why: Whether the flannel.1 interface is up (by node). 0 means that node's pods cannot talk to other nodes
  query: node_network_up{device=~"flannel.*"}
  source:
    - "node_network_up: prometheus/node_exporter collector/netclass_linux.go:85@v1.7.0, :86@v1.10.2, :85@v1.12.1 (netclass collector, on by default: collector/netclass_linux.go:48@v1.7.0, :49@v1.10.2, :48@v1.12.1)"
- id: flannel_if_mtu
  why: flannel.1 MTU as seen by node-exporter (cross-check with the node script)
  query: node_network_mtu_bytes{device=~"flannel.*"}
  source:
    - "node_network_mtu_bytes: prometheus/node_exporter collector/netclass_linux.go:118@v1.7.0, :119@v1.10.2, :118@v1.12.1 (netclass collector, on by default: collector/netclass_linux.go:48@v1.7.0, :49@v1.10.2, :48@v1.12.1)"
- id: flannel_overlay_bytes_1d
  why: Overlay bytes sent and received in 24 hours (by node). Scale of inter-node traffic — a large value means pods are crossing nodes to reach databases and caches
  query: sum by (instance) (increase(node_network_receive_bytes_total{device=~"flannel.*"}[1d]) + increase(node_network_transmit_bytes_total{device=~"flannel.*"}[1d]))
  source:
    - "node_network_receive_bytes_total: prometheus/node_exporter collector/netdev_linux.go:110,166@v1.7.0, :111,167@v1.10.2, :110,166@v1.12.1 (reader key receive_bytes, netlink and /proc/net/dev readers; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "node_network_transmit_bytes_total: prometheus/node_exporter collector/netdev_linux.go:111,174@v1.7.0, :112,175@v1.10.2, :111,174@v1.12.1 (reader key transmit_bytes; collector/netdev_common.go:102@v1.7.0, :101@v1.10.2, :99@v1.12.1 builds node_network_<key>_total from the per-device counter map; netdev collector, on by default: collector/netdev_common.go:53@v1.7.0, :52@v1.10.2, :50@v1.12.1)"
    - "label instance: prometheus/prometheus scrape/target.go:507-510@v2.49.1, :519-522@v3.7.3 (Prometheus sets instance to the scrape target address when the target has none, so on node-exporter series it is <node IP>:9100, which lib/evaluate.py and the summaries map to the node by IP; a scrape config that relabels instance changes this)"
