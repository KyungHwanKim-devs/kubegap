- id: traffic.flannel-node-data-missing
  name: Some nodes' flannel data could not be read
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['nodes_missing_data']) > 0 or (item['nodes'] or 0) > len(item['nodes_with_data'])"
  target: "'cluster'"
  evidence: "f\"nodes {item['nodes']}, nodes with the flannel section read {item['nodes_with_data']}, nodes not read {item['nodes_missing_data']}, node-exporter metrics {item['metrics_available']}\""
  severity_default: low
  symptom_linked: false
  why: >
    Nodes without node access (SSH) or without a flannel.1 device cannot report MTU, errors or sysctl. The missing device itself (k3s running another backend, or flannel dead) can be a finding.
  suggest: "ssh <node> ip -d link show flannel.1. If absent, journalctl -u k3s | grep -i flannel."
  verify:
    - "ssh <node> ip -d link show flannel.1"
  profiles: [lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
          nodes_missing_data:
            - "node-b"
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
      - expect: "pass"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
