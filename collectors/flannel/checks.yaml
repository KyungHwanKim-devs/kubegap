- id: traffic.podcidr-near-full
  name: Node pod CIDR nearly full
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.podcidr
  profiles: [lab]
  rule:
    expr: "(item.get('ratio') or 0) >= 0.8"
    warn_expr: "(item.get('ratio') or 0) >= 0.6"
  target: "item['node']"
  evidence: "f\"podCIDR {item['cidr']}: {item['pods']} pods of {item['usable']} usable ({item['ratio']})\""
  severity_default: medium
  symptom_linked: true
  why: flannel gives every node a /24 (254 addresses). That is more than kubelet maxPods 110, so it normally does not fill up, but if maxPods was raised or the CIDR was made narrow, IPs run out first and pods stall in ContainerCreating. The EKS equivalent is remaining subnet IPs.
  suggest: "Widening --cluster-cidr is a reinstall. Reduce the pod count or add nodes."
  verify:
    - "kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'; kubectl get pods -A -o wide --field-selector spec.nodeName=<node> | wc -l"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          node: "node-b"
          cidr: "10.42.0.0/24"
          usable: 253
          pods: 210
          ratio: 0.83
      - expect: "warn"
        item:
          node: "node-b"
          cidr: "10.42.0.0/24"
          usable: 253
          pods: 160
          ratio: 0.63
      - expect: "pass"
        item:
          node: "node-b"
          cidr: "10.42.0.0/24"
          usable: 253
          pods: 40
          ratio: 0.16
- id: traffic.flannel-sysctl-off
  name: ip_forward or bridge-nf-call-iptables disabled on a flannel node (same-node Service traffic breaks)
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.summary
  cluster_level: true
  rule:
    expr: "len(item['sysctl_off']) > 0"
  target: "'cluster'"
  evidence: "f\"nodes where the sysctl is not 1 {item['sysctl_off']} (nodes with data {item['nodes_with_data']}), backend {item['backend']}\""
  severity_default: high
  symptom_linked: true
  why: >
    flannel connects pods across nodes with vxlan (flannel.1) and within a node with a Linux bridge (cni0). With net.ipv4.ip_forward=0 all pod traffic leaving the node stops; with net.bridge.bridge-nf-call-iptables=0 traffic between two pods on the same node bypasses iptables (kube-proxy Service rules, NetworkPolicy), producing the intermittent failure "works to a pod on another node, fails on the same node". It happens when sysctl.d is lost after a reboot.
    Measured on a real k3s: 1 on both nodes → pass.
  suggest: "sysctl -w net.ipv4.ip_forward=1 net.bridge.bridge-nf-call-iptables=1 and persist in /etc/sysctl.d/99-kubernetes.conf (br_netfilter module in /etc/modules-load.d). k3s sets these at startup, but other tools can revert them."
  verify:
    - "sysctl net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off:
            - "node-b"
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
      - expect: "pass"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
- id: traffic.flannel-vxlan-cross-subnet
  name: Nodes in different subnets connected over flannel vxlan (unencrypted)
  area: security
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.summary
  cluster_level: true
  rule:
    warn_expr: "item['backend'] == 'vxlan' and item['cross_subnet']"
  target: "'cluster'"
  evidence: "f\"node underlay IP subnets {item['node_subnets']}, backend {item['backend']}, overlay traffic in 24h (GiB) {item['overlay_gib_1d']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    vxlan only encapsulates; it does not encrypt. When the nodes share one L2 switch (the same /24) the LAN trust model is enough, but across subnets, a VPN (Tailscale) or a public network, pod-to-pod traffic (DB passwords and tokens included) travels in plain text. k3s turns on node-to-node encryption with a single `--flannel-backend=wireguard-native`.
    Measured on a real k3s: both nodes in one private /24 subnet → pass (Tailscale was for node access, not the flannel underlay).
  suggest: "If nodes span subnets, use the k3s server argument --flannel-backend=wireguard-native (all nodes must restart) or run the flannel underlay over a node-to-node VPN."
  verify:
    - "kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.metadata.annotations.flannel\\.alpha\\.coreos\\.com/backend-type}{\" \"}{.metadata.annotations.flannel\\.alpha\\.coreos\\.com/public-ip}{\"\\n\"}{end}'"
  profiles: [lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
            - "10.0.0.0/24"
          cross_subnet: true
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
      - expect: "pass"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
            node-b: 80.42
          podcidr_max_ratio: 0.193
          podcidr_nodes: 2
          metrics_available: true
      - expect: "pass"
        item:
          present: true
          backend: "wireguard-native"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 0
