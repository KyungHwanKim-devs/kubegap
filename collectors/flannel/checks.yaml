- id: traffic.flannel-drops-growing
  name: Errors and drops on flannel.1/cni0 increasing over 24 hours
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['errors_1d_total'] or 0) > 0"
    warn_expr: "item['metrics_available'] and (item['drops_1d_total'] or 0) >= 100"
  target: "'cluster'"
  evidence: "f\"errors in 24h {item['errors_1d_total']} / drops {item['drops_1d_total']} (by node and device {item['drops_1d_by_node']}), cumulative since boot errors {item['errors_boot_total']} / drops {item['drops_boot_total']}, overlay traffic (GiB/day) {item['overlay_gib_1d']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    The node script counters are cumulative since boot, so they cannot separate "old" from "now" (traffic.flannel-errors). If node-exporter's 24-hour increase is non-zero, overlay packets are being corrupted or dropped right now — causes are MTU mismatch (only large packets fail), the underlay NIC driver or conntrack saturation, and the symptoms are intermittent timeouts and slow DB queries. vxlan devices report operstate UNKNOWN, so node_network_up reads 0 and is not used.
    Measured on a real k3s: 0 errors and 0 drops in 24h (12 cumulative drops), overlay traffic about 80GiB/day per node — the volume of pods crossing nodes to reach Elasticsearch and databases.
  suggest: "Run ip -s link show flannel.1 twice 10 minutes apart to see which direction, and check MTU with ping -M do -s 1400 <pod IP on another node>. Together with ethtool -S errors on the underlay NIC."
  verify:
    - "curl -s localhost:9090/api/v1/query --data-urlencode 'query=increase(node_network_transmit_drop_total{device=\"flannel.1\"}[1d])'"
  profiles: [lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          backend: "vxlan"
          nodes: 2
          nodes_with_data:
            - "node-a"
            - "node-b"
          nodes_missing_data: []
          mtu_mismatch: []
          mtu:
            node-a: 1450
            node-b: 1450
          sysctl_off: []
          if_down:
            - "node-a"
            - "node-b"
          errors_1d_total: 3
          drops_1d_total: 0
          drops_1d_by_node: {}
          errors_boot_total: 0
          drops_boot_total: 12
          node_subnets:
            - "192.0.2.0/24"
          cross_subnet: false
          overlay_gib_1d:
            node-a: 80.08
