# flannel checks. summary.flannel — lib/flannelctl.py (node data from the flannel section of the k3s-platform node script, counters from node-exporter). The first three were moved from k3s-platform with their ids unchanged (history.csv continuity).
- id: traffic.flannel-mtu-mismatch
  name: flannel vxlan MTU is not the underlay interface MTU − 50
  area: traffic
  modes: [full]   # needs inputs the daily run does not collect
  type: summary
  each: flannel.nodes
  profiles: [lab]
  rule:
    expr: "item.get('flannel') is not None and item['flannel'].get('mtu_ok') is False"
  target: "item['node']"
  evidence: "f\"flannel.1 mtu {item['flannel'].get('mtu')}, underlay {item['flannel'].get('underlay_dev')} mtu {item['flannel'].get('underlay_mtu')}\""
  severity_default: medium
  symptom_linked: true
  why: Without subtracting the 50-byte vxlan header, large packets are fragmented or dropped, so small requests work while only large responses stall.
  suggest: Check the underlay interface MTU and align the flannel configuration (--flannel-iface).
  verify:
    - "ip -d link show flannel.1 | grep mtu; ping -M do -s 1400 <pod IP on another node>"
  test:
    profile: "k3s"
    cases:
      - expect: "fail"
        item:
          node: "node-b"
          role: "server"
          collected: true
          version: "v1.33.5+k3s1"
          args: []
          disable: []
          tls_san: []
          node_ip: "192.0.2.102"
          server_url: null
          pod_cidr: "10.42.0.0/24"
          unit:
            restarts: 0
            since: "x"
          check_config:
            missing: []
            status: "pass"
          ports: []
          apiserver_bind: []
          etcd_bind: []
          flannel:
            mtu: 1500
            underlay_mtu: 1500
            underlay_dev: "eth0"
            mtu_ok: false
            rx_errors: 0
            tx_errors: 0
            rx_dropped: 0
            tx_dropped: 0
          journald:
            disk_mb: 100
            conf: ""
            bounded: true
            k3s_lines_24h: 100
          server:
            secrets_encryption: "Enabled"
            db_kind: "etcd"
            db_mb: 500
