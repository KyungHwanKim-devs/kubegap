- id: argocd.notifications-not-configured
  name: No notifications configured for sync failures or Degraded (argocd-notifications)
  area: observability
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    warn_expr: "not item['notifications_configured'] and item['applications_prod'] > 0"
  target: "'cluster'"
  evidence: "f\"service.* in argocd-notifications-cm {item['notifications_configured']} (triggers {item['notifications_triggers']}), prod apps {item['applications_prod']}, and no Argo CD metrics flow to Alertmanager either (no ServiceMonitor)\""
  severity_default: low
  symptom_linked: false
  why: >
    Prod apps with auto-sync deploy without a human in the loop, so without a channel reporting failures and Degraded, users find out first. notifications-controller runs (default install) but sends nothing unless argocd-notifications-cm has a service (Slack, email) and a trigger. The alternative is Prometheus scraping argocd_app_info{sync_status,health_status} with Alertmanager rules; this check looks for neither being present.
    Measured on real clusters: the notifications cm was empty and there was no ServiceMonitor on both EKS and the small k3s cluster.
  suggest: "Add service.slack (or webhook) and trigger.on-sync-failed / on-health-degraded to argocd-notifications-cm, then the notifications.argoproj.io/subscribe annotation on Applications (or defaultTriggers). Or enable the ServiceMonitor and use the official Argo CD Prometheus rules."
  verify:
    - "kubectl -n argocd get cm argocd-notifications-cm -o yaml"
