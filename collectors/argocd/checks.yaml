- id: argocd.default-project-wildcard
  name: Application bound to the unbounded default AppProject (any repository, any destination)
  area: security
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "'default' in item['wildcard_projects'] and item['default_project_apps'] > 0 and item['applications_prod'] > 0 and item['projects'] == 1"
    warn_expr: "len(item['wildcard_projects']) > 0 and item['default_project_apps'] > 0"
  target: "'cluster'"
  evidence: "f\"AppProjects {item['projects']}, projects whose sourceRepos and destinations are all * {item['wildcard_projects']}, apps bound to the default project {item['default_project_apps']}/{item['applications']} (prod {item['applications_prod']})\""
  severity_default: medium
  symptom_linked: false
  why: >
    An AppProject is the boundary of "which repositories this app may deploy from, into which namespaces and clusters". The default project is all *, so anyone who can edit an Application manifest (or has write access to the repository) can deploy any manifest from any repository anywhere, kube-system included — the Argo CD controller is cluster-admin.
    With a single project there is also no team or environment (prod/dev) boundary. Measured on real clusters: EKS had all 12 apps in the single default project; the small k3s cluster had default plus one team project (4 apps in default).
  suggest: "Create an AppProject per environment and team, narrow sourceRepos (organization repositories only), destinations (that environment's namespaces only) and clusterResourceWhitelist, then move the apps. Leave the default project empty."
  verify:
    - "kubectl get appprojects.argoproj.io -n argocd -o custom-columns=NAME:.metadata.name,REPOS:.spec.sourceRepos,DEST:.spec.destinations"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
            notifications-controller: "1/1"
            redis: "1/1"
            repo-server: "1/1"
            server: "1/1"
            application-controller: "1/1"
          components_not_ready: []
          applications: 12
          applications_prod: 8
          applicationsets: 12
          out_of_sync: []
          out_of_sync_prod: []
          unhealthy: []
          unhealthy_prod: []
          progressing: []
          degraded: []
          last_op_failed: []
          conditions: []
          apps_with_conditions: []
          prod_not_automated: []
          prod_no_self_heal: []
          prune_with_namespace_or_crd: []
          prod_tracking_moving_ref:
            - "argocd/application/app-f-prod"
