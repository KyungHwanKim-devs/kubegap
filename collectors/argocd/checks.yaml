# Argo CD checks. summary.argocdctl.summary — lib/argocdctl.py. The Application Sync/Health list is also in the core hygiene section (argocd_apps). Git credentials and Secret values are never read.
- id: argocd.app-out-of-sync-or-unhealthy
  name: Application is OutOfSync or not Healthy (Git and the cluster differ)
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "len(item['out_of_sync_prod']) + len(item['unhealthy_prod']) > 0 or len(item['degraded']) > 0"
    warn_expr: "len(item['out_of_sync']) + len(item['unhealthy']) + len(item['apps_with_conditions']) > 0"
  target: "'cluster'"
  evidence: "f\"Applications {item['applications']} (prod {item['applications_prod']}), OutOfSync {item['out_of_sync']} (prod {item['out_of_sync_prod']}), Degraded/Missing/Unknown {item['unhealthy']} (prod {item['unhealthy_prod']}), Progressing (rolling out, not abnormal) {item['progressing']}, apps with conditions {item['conditions']}: {item['apps_with_conditions']}, last operation failed {item['last_op_failed']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    In GitOps, OutOfSync means "Git is not the truth" — someone changed things with kubectl (drift), auto-sync is off, or the sync failed. Degraded means the deployed workload is not ready, and conditions (ComparisonError, SyncError, ExcludedResourceWarning) signal that the comparison itself failed or some resources were left out.
    Sync/Health is also in the argocd_apps list of the core hygiene section. This check separates prod from non-prod and bundles conditions and the last operation result. Progressing (rollout in progress) and Suspended are not counted as abnormal.
    Measured on real clusters: EKS had all 12 Synced/Healthy; the small k3s cluster had the root App-of-Apps OutOfSync, one app Progressing and one with ExcludedResourceWarning (a resource matched by resource.exclusions present in the manifests) → warn.
  suggest: "Use argocd app diff <app> to see the difference, then fix Git (or add ignoreDifferences if the drift is intended) and sync. For Degraded, read that workload's events and logs. For conditions, follow the CONDITIONS message in argocd app get <app>."
  verify:
    - "kubectl get applications.argoproj.io -A -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,COND:.status.conditions[*].type"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
            notifications-controller: "1/1"
            redis: "1/1"
            repo-server: "1/1"
            server: "1/1"
            application-controller: "1/1"
          components_not_ready: []
          applications: 12
          applications_prod: 8
          applicationsets: 12
          out_of_sync:
            - "argocd/application/x-prod"
          out_of_sync_prod:
            - "argocd/application/x-prod"
          unhealthy: []
          unhealthy_prod: []
          progressing: []
          degraded: []
          last_op_failed: []
          conditions: []
          apps_with_conditions: []
          prod_not_automated: []
          prod_no_self_heal: []
          prune_with_namespace_or_crd: []
          prod_tracking_moving_ref:
            - "argocd/application/app-f-prod"
            - "argocd/application/app-e-prod"
