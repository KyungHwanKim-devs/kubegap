- id: argocd.metrics-unreadable
  name: Argo CD metrics could not be read (not scraped by Prometheus, no node access)
  area: observability
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    warn_expr: "item['present'] and not item['metrics_available']"
  target: "'cluster'"
  evidence: "f\"no metrics under metrics/pod/argocd-*/ — Prometheus does not scrape argocd_* (no ServiceMonitor) and neither the pod proxy nor node access could read them. {item['applications']} Applications were read as objects\""
  severity_default: low
  symptom_linked: false
  why: >
    Without the controller (:8082), repo-server (:8084) and server (:8083) metrics, sync failure accumulation, Git failures, k8s API errors and Redis failures are visible only through log signatures. Application state (Sync/Health/policy) is read from objects, so those checks still work.
  suggest: "Helm values controller.metrics.serviceMonitor.enabled, repoServer.metrics.serviceMonitor.enabled and server.metrics.serviceMonitor.enabled true. Otherwise node access (SSM or SSH)."
  verify:
    - "kubectl get --raw /api/v1/namespaces/argocd/pods/argocd-application-controller-0:8082/proxy/metrics | head"
