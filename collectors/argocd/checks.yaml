- id: argocd.admin-account-no-sso
  name: Only the built-in admin account is used; no SSO or RBAC policy
  area: security
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "item['anonymous_enabled'] or ('role:admin' in str(item['rbac_policy_default']))"
    warn_expr: "(item['admin_enabled'] and not item['sso_configured']) or item['exec_enabled']"
  target: "'cluster'"
  evidence: "f\"admin.enabled {item['admin_enabled']}, SSO (dex/oidc) {item['sso_configured']}, anonymous {item['anonymous_enabled']}, RBAC policy.default '{item['rbac_policy_default']}' / policy.csv {item['rbac_policy_csv_lines']} lines, exec.enabled {item['exec_enabled']}, URL {item['url']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    The Argo CD admin is a cluster-admin-grade account that handles every project, app and cluster credential, shared through a single password — the audit log does not say who did what, and it cannot be revoked when someone leaves. The official recommendation is to attach SSO and disable admin. If policy.default is role:admin or anonymous access is on, anyone who logs in (or does not) has full power.
    exec.enabled opens pod shells from the web UI, so when it is on Argo CD is effectively a shell gateway. Measured on real clusters: both EKS and the small k3s cluster had admin only, no SSO, no policy.csv, exec off. The EKS server gRPC had 945 PermissionDenied responses accumulated (RBAC rejections — someone keeps making calls without permission).
  suggest: "Attach SSO (Google Workspace, GitHub, Okta) via dex or oidc.config, split roles with policy.csv, then set admin.enabled: 'false' in argocd-cm. Leave policy.default empty or role:readonly."
  verify:
    - "kubectl -n argocd get cm argocd-cm -o jsonpath='{.data.admin\\.enabled}{\"\\n\"}{.data.dex\\.config}{.data.oidc\\.config}'"
    - "kubectl -n argocd get cm argocd-rbac-cm -o yaml"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
            notifications-controller: "1/1"
