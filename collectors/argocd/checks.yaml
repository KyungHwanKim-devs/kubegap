- id: argocd.version-eol
  name: Argo CD version is end of life (2.x)
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    warn_expr: "item['version_major'] is not None and item['version_major'] < 3"
  target: "'cluster'"
  evidence: "f\"Argo CD {item['version']} (components {item['components']}) — 3.0 was released 2025-05, only the three latest minors are supported (N-2)\""
  severity_default: low
  symptom_linked: false
  why: >
    Argo CD patches only the three latest minors. Since 3.0 (2025-05), 3.1 and 3.2 shipped, 2.x no longer receives security patches — Argo CD runs as cluster-admin and its UI is often open to the internet, so a server vulnerability (several UI XSS, SSRF and RBAC-bypass CVEs in 2024-2025) is full cluster control right away.
    Measured on real clusters: EKS ran 2.13.0 (2024-11), the small k3s cluster 3.2.0.
  suggest: "Upgrade 2.14 → 3.0 → 3.x following the upgrade notes (RBAC default policy change, log format, fine-grained RBAC). With Helm, use the argo-cd chart 8.x."
  verify:
    - "kubectl -n argocd get deploy argocd-server -o jsonpath='{.spec.template.spec.containers[0].image}'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
