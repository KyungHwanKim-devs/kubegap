- id: argocd.sync-failures
  name: Sync failures accumulating (sync Failed/Error)
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['sync_failure_ratio'] or 0) >= 0.05 and (item['sync_failed'] or 0) >= 20"
    warn_expr: "(item['metrics_available'] and ((item['sync_failed'] or 0) >= 20 or (item['sync_failure_ratio'] or 0) >= 0.01)) or len(item['last_op_failed']) > 0"  # 10 of 1,304 (0.8%) is noise — warn from 20 failures or 1%
  target: "'cluster'"
  evidence: "f\"syncs since controller start {item['sync_total']}, failed {item['sync_failed']} (ratio {item['sync_failure_ratio']}), apps whose last operation failed {item['last_op_failed']}, k8s API 4xx {item['k8s_api_4xx']} / 5xx+429 {item['k8s_api_errors']}\""
  severity_default: medium
  symptom_linked: true
  why: >
    An app with auto-sync retries after a failure — if the same manifest error (validating webhook rejection, missing CRD, immutable field) fails every few minutes, that app's deployments have effectively stopped and only argocd_app_sync_total{phase="Failed"} keeps climbing.
    Prometheus does not scrape these metrics (no ServiceMonitor), so the controller's :8082 is read from inside a node. Measured on a real EKS cluster: Failed 9 and Error 1 out of 1,304 (0.77%).
  suggest: "Use argocd app history <app> and operationState.message to find the failure cause. For repeated failures, fix the manifest or review syncOptions (Replace=true, ServerSideApply=true)."
  verify:
    - "kubectl get applications.argoproj.io -A -o json | jq -r '.items[] | select(.status.operationState.phase!=\"Succeeded\") | .metadata.name+\" \"+.status.operationState.phase+\" \"+(.status.operationState.message//\"\")'"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
            notifications-controller: "1/1"
            redis: "1/1"
            repo-server: "1/1"
            server: "1/1"
