- id: argocd.prod-sync-policy
  name: prod Application has auto-sync or selfHeal disabled
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_not_automated']) + len(item['prod_no_self_heal']) > 0"
  target: "'cluster'"
  evidence: "f\"prod apps {item['applications_prod']}, auto-sync disabled {item['prod_not_automated']}, automated but selfHeal disabled {item['prod_no_self_heal']}\""
  severity_default: low
  symptom_linked: false
  why: >
    A prod app without auto-sync is deployed only when a human clicks Sync even after merging to Git — this may be an intentional approval step, but it is why OutOfSync lingers. With selfHeal off, Argo CD does not revert direct changes to the cluster (drift) and only shows OutOfSync.
    Neither is "wrong"; both mean "confirm the policy". Measured on real clusters: all prod apps on both EKS and the small k3s cluster had automated+prune+selfHeal.
  suggest: "If manual approval is intended, leave it and note it in the report. Otherwise set syncPolicy.automated: {prune: true, selfHeal: true}."
