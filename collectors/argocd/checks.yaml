- id: argocd.backend-errors
  name: Argo CD backend errors (cluster connection, Git, Redis, k8s API 5xx)
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['cluster_connection_ok'] is False or (item['k8s_api_errors'] or 0) >= 100 or (item['git_failure_ratio'] or 0) >= 0.1)"
    warn_expr: "item['metrics_available'] and ((item['k8s_api_errors'] or 0) > 0 or (item['git_failure_ratio'] or 0) >= 0.01 or (item['redis_failure_ratio'] or 0) >= 0.01 or (item['grpc_errors'] or 0) > 0 or (item['repo_pending_requests'] or 0) > 10)"
  target: "'cluster'"
  evidence: "f\"cluster connection {item['cluster_connection_ok']}, cache age {item['cluster_cache_age_s']}s, k8s API 5xx/429 {item['k8s_api_errors']}, git requests {item['git_requests']} / failures {item['git_failures']} ({item['git_failure_ratio']}), redis failures {item['redis_failed']}/{item['redis_total']}, repo-server pending {item['repo_pending_requests']}, gRPC errors {item['grpc_errors']} (PermissionDenied {item['grpc_permission_denied']} and Unauthenticated {item['grpc_unauthenticated']} counted separately)\""
  severity_default: medium
  symptom_linked: true
  why: >
    When Argo CD is slow or apps flicker to Unknown, the cause is usually behind it — cluster cache resync failing (connection_status 0), k8s API 429 (the controller lists and watches too much), Git access failures (expired token, rate limit — argocd_git_lsremote_fail_total), Redis cache failures (manifests re-rendered every time), or a repo-server queue. Each pairs with a log signature (argocd.repo-access, argocd.rate-limit).
    Measured on a real EKS cluster: 25 failures out of 7,958 git requests (0.3%), 32 redis failures (ratio 0), k8s API 5xx/429 0 — pass.
  suggest: "If argocd_git_lsremote_fail_total rises, check the repo credentials (expiry) and the GitHub rate limit. For k8s API 429, lower controller.status.processors or reduce watched resources with resource.exclusions. For redis failures, check redis pod restarts and memory."
  verify:
    - "kubectl -n argocd logs deploy/argocd-repo-server --since=1h | grep -i 'rate limit\\|authentication\\|failed to' | tail"
  profiles: [prod, lab]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "2.13.0"
          components:
            applicationset-controller: "1/1"
            dex-server: "1/1"
            notifications-controller: "1/1"
            redis: "1/1"
            repo-server: "1/1"
            server: "1/1"
            application-controller: "1/1"
          components_not_ready: []
          applications: 12
          applications_prod: 8
          applicationsets: 12
