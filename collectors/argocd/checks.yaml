- id: argocd.prune-manages-namespace-or-crd
  name: Application with prune enabled manages a Namespace or CRD (removed from Git = deleted wholesale)
  area: resilience
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "len(item['prune_with_namespace_or_crd']) > 0 and item['applications_prod'] > 0"
    warn_expr: "len(item['prune_with_namespace_or_crd']) > 0"
  target: "'cluster'"
  evidence: "f\"apps with prune enabled that manage a Namespace or CRD as a resource {item['prune_with_namespace_or_crd']} (namespaces created by the CreateNamespace option are not managed resources and are not counted here)\""
  severity_default: high
  symptom_linked: false
  why: >
    prune: true means "resources that disappear from Git are deleted from the cluster too". If a Namespace is among the managed resources, the moment its manifest leaves Git (directory move, rename, ApplicationSet generator change) Argo CD deletes the Namespace and everything inside it, PVCs included. The same applies to CRDs — deleting a CRD deletes all of its CRs.
    The Skyscanner 2021 incident had this shape (ApplicationSet generator change → apps removed → prune deleted everything). Measured on a real k3s: 7 apps managed a Namespace as a resource. The EKS cluster used CreateNamespace=true and did not manage Namespaces.
  suggest: "Annotate Namespaces with argocd.argoproj.io/sync-options: Prune=false, or create namespaces via syncOptions CreateNamespace=true and remove them from the manifests. Move CRDs into a separate Application with prune off. Also review the Application finalizer in Argo CD 2.6+ and preservedResourcesOnDeletion on ApplicationSets."
  verify:
    - "kubectl get applications.argoproj.io -A -o json | jq -r '.items[] | select(.spec.syncPolicy.automated.prune==true) | .metadata.name as $n | .status.resources[]? | select(.kind==\"Namespace\" or .kind==\"CustomResourceDefinition\") | $n+\" \"+.kind+\"/\"+.name'"
