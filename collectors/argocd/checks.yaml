- id: argocd.components-not-ha
  name: Argo CD component not ready or running a single replica
  area: resilience
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "len(item['components_not_ready']) > 0"
    warn_expr: "len(item['components_single_replica']) > 0 and item['applications_prod'] >= 5"
  target: "'cluster'"
  evidence: "f\"components (ready/replicas) {item['components']}, not ready {item['components_not_ready']}, single replica (server, repo-server) {item['components_single_replica']}, version {item['version']}\""
  severity_default: medium
  symptom_linked: false
  why: >
    If application-controller dies, deployments stop (and so does drift recovery); if repo-server dies, manifests cannot be rendered and every app becomes Unknown; if server dies, the UI, CLI and webhooks are cut off. On a single-node small k3s cluster more replicas are pointless, so this warns only with 5 or more prod apps.
    The official Argo CD HA manifests use server 2, repo-server 2 and redis-ha 3 (the controller is sharded). Measured on real clusters: every component ran 1 replica on both EKS and the small k3s cluster.
  suggest: "Use the HA manifests (install/ha) or Helm values server.replicas 2, repoServer.replicas 2, redis-ha.enabled true, and add PDBs. On a small k3s cluster leave it and note it in the report."
  verify:
    - "kubectl -n argocd get deploy,sts -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,REPLICAS:.spec.replicas"
