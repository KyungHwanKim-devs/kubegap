- id: argocd.prod-tracks-moving-ref
  name: prod Application tracks a branch (main/HEAD) (every push deploys immediately)
  area: hygiene
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    warn_expr: "len(item['prod_tracking_moving_ref']) > 0 and len(item['prod_tracking_moving_ref']) >= item['applications_prod']"
  target: "'cluster'"
  evidence: "f\"prod apps {item['applications_prod']}, apps whose targetRevision is a branch or HEAD {len(item['prod_tracking_moving_ref'])} {item['prod_tracking_moving_ref'][:8]}, apps using ignoreDifferences {item['ignore_differences_apps']}\""
  severity_default: low
  symptom_linked: false
  why: >
    targetRevision: main means "merged to main → in prod within 3 minutes". It is the most common GitOps setup and not a defect by itself, but without repository protection rules (required review, passing CI) write access to the repository is prod deploy access. Tags or pinned commits make promotion (dev→prod) explicit.
    This check warns only when every prod app tracks a branch, and the severity is low — the report should read "confirm the repository has branch protection". Measured on real clusters: all 8 EKS prod apps tracked main, all 10 small k3s cluster prod apps tracked HEAD/main.
  suggest: "Confirm branch protection on the repository (1 reviewer, required CI). To make promotion explicit, have prod track a tag or an environment branch (release)."
