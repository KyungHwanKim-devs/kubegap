- id: argocd.ingress-no-tls
  name: Argo CD server exposed without TLS (no ingress TLS, or server.insecure)
  area: security
  type: summary
  each: argocdctl.summary
  cluster_level: true
  rule:
    expr: "item['ingress_tls'] is False"
    warn_expr: "item['server_insecure'] and item['ingress_tls'] is None"
  target: "'cluster'"
  evidence: "f\"ingress hosts {item['ingress_hosts']}, ingress TLS {item['ingress_tls']}, server.insecure {item['server_insecure']}, url {item['url']}\""
  severity_default: high
  symptom_linked: false
  why: >
    If the Argo CD login (admin password, SSO token) and API tokens travel in plain text, interception means full cluster control immediately. server.insecure by itself is a common setup where TLS terminates at the ingress, so it is fine when the ingress has TLS; without an ingress (port-forward, NodePort) it needs checking.
    Measured on real clusters: EKS used an ALB on 443 (certificate ARN), the small k3s cluster used Ingress TLS. Both pass.
  suggest: "Add Ingress spec.tls or ALB certificate-arn + listen-ports 443 and redirect 80→443. Keep server.insecure only when the ingress has TLS."
  verify:
    - "kubectl -n argocd get ingress -o yaml | grep -A3 'tls:\\|certificate-arn\\|listen-ports'"
