- id: argocd.repo-access
  name: Argo CD repository access failed
  component: argocd
  area: hygiene
  severity: medium
  sources: ["logs/pods/argocd/*.log"]
  # `repository not accessible` is an InvalidSpecError condition (util/argo/argo.go), never logged. `Unable to resolve` is lowercase in source. The repo-server's own
  # status errors use codes.Internal, so `code = Unknown` alone missed them; the `rpc error:` prefix exists only where a client (controller, argocd-server) prints the
  # status error. `authentication required` is go-git's text on HTTP 401 (ls-remote path); the git CLI prints `fatal: Authentication failed for '<url>'`, carried in the CmdError text.
  pattern: 'failed to get git client for repo|unable to resolve git revision|unable to resolve ''[^'']*'' to a commit SHA|failed to list refs|authentication required|Authentication failed for|rpc error: code = (Unknown|Internal) desc = .*(git|helm)'
  meaning: The Git or Helm repository cannot be read, so new commits are not deployed. The lines are the repo-server's failed-RPC lines (go-grpc-middleware, level error, the error in the error= or grpc.error field) and the controller's or API server's error lines that carry the repo-server status error.
  cause: Expired token or SSH key, changed repository URL, rate limit.
  verify: "argocd repo list; kubectl logs -n argocd deploy/argocd-repo-server --since=1h | grep -i auth"
  source:
    - "argoproj/argo-cd reposerver/repository/repository.go:505,757,2609,2693,2785@v2.13.0"
    - "argoproj/argo-cd reposerver/repository/repository.go:576,828,2869,2951,3043@v3.2.0"
    - "argoproj/argo-cd reposerver/repository/repository.go:624,914,3320,3392,3457@v3.6.1"
    - "argoproj/argo-cd util/git/client.go:627,682@v2.13.0"
    - "argoproj/argo-cd util/git/client.go:706,761@v3.2.0"
    - "argoproj/argo-cd util/git/client.go:968,1026@v3.6.1"
    - "go-git/go-git plumbing/transport/common.go:34@v5.12.0"
    - "go-git/go-git plumbing/transport/http/common.go:433@v5.12.0"
    - "go-git/go-git plumbing/transport/common.go:35@v5.14.0"
    - "go-git/go-git plumbing/transport/http/common.go:434@v5.14.0"
    - "go-git/go-git plumbing/transport/common.go:35@v5.19.2"
