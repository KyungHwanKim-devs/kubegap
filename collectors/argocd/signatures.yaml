# Group G: Argo CD, External Secrets Operator, KEDA, cert-manager (+ catalog cert-manager.orphan-tls-secret). Every phrase was read in the source at the versions
# named in references/sources.md (#129): Argo CD v2.13.0 (EKS), v3.2.0 (k3s), v3.6.1; ESO v0.9.13 (EKS), v2.1.0 (k3s), v2.14.0; KEDA v2.17.2 (EKS), v2.19.0 (k3s), v2.21.0;
# cert-manager v1.14.4 (k3s), v1.21.3. `source:` names the logging call (or the library format string) at each version.
# Argo CD prints logrus text (`time="…" level=error msg="…"`) up to v2.14.x and logrus JSON (`{"level":"error","msg":"…","time":"…"}`) from v3.0.0 by default
# (util/log/logrus.go:45@v2.14.0 vs :48@v3.0.0); the argo-helm chart still sets global.logging.format: text, so both forms exist and every level-based alternative spells both.
- id: argocd.sync-failed
  name: Argo CD sync failed
  component: argocd
  area: hygiene
  severity: medium
  sources: ["logs/pods/argocd/*.log"]
  # `sync failed` was never printed (only `waitSync failed: timed out`, capital S). `ComparisonError`, `Failed to load live state`, `error synchronizing cache state` and
  # `failed to sync cluster <host>` are Application condition texts (controller/state.go, controller/cache/cache.go), never log lines; the error line on that path is
  # gitops-engine's `Failed to sync cluster`. The failed-sync message reaches the log twice at info: gitops-engine `Updating operation state. phase: Running -> Failed,
  # message: '' -> 'one or more objects failed to apply, …'` and the audit line `Sync operation to <rev> failed: <message>` (reason=OperationCompleted).
  pattern: 'one or more objects failed to apply|Sync operation to \S+ failed:|Failed to sync cluster|Failed to initiate auto-sync to|(level=error|"level":"error").*(sync|apply)'
  meaning: Git and the cluster differ and Argo CD cannot reconcile them. Deployments have stopped or manual changes are not being reverted. The lines are the controller's info-level operation-state and audit lines on a failed sync, gitops-engine's error line when the cluster cache cannot sync, and any error-level controller line about a sync or apply (text or JSON format). Comparison errors (ComparisonError) are only in the Application conditions, not in the log; the verify command reads them.
  cause: Manifest errors (missing CRD, field mismatch), RBAC, resource hook failures, repository unreachable.
  verify: "kubectl get applications -A -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status | grep -v Synced"
  warn_at: 1
  fail_at: 50
  source:
    - "argoproj/gitops-engine pkg/sync/sync_context.go:411,541,592,921@bd7681ae3f8b"
    - "argoproj/gitops-engine pkg/sync/sync_context.go:456,595,732,1068@b89b0871b414"
    - "argoproj/argo-cd gitops-engine/pkg/sync/sync_context.go:553,709,716,938,953,964,1293@v3.6.1"
    - "argoproj/argo-cd controller/sync.go:309@v3.2.0"
    - "argoproj/argo-cd controller/appcontroller.go:1502,1512,1514@v2.13.0"
    - "argoproj/argo-cd controller/appcontroller.go:1579,1589,1591@v3.2.0"
    - "argoproj/argo-cd controller/appcontroller.go:1847,1863,1865@v3.6.1"
    - "argoproj/argo-cd util/argo/audit_logger.go:90@v2.13.0"
    - "argoproj/argo-cd util/argo/audit_logger.go:90@v3.2.0"
    - "argoproj/argo-cd util/argo/audit_logger.go:105@v3.6.1"
    - "argoproj/gitops-engine pkg/cache/cluster.go:921@bd7681ae3f8b"
