- id: argocd.rate-limit
  name: Argo CD hit the Git hosting rate limit
  component: argocd
  area: hygiene
  severity: low
  sources: ["logs/pods/argocd/*.log"]
  # `rate limit` alone matched the start-up info line `Using default workqueue rate limiter config` (controller/appcontroller.go:183@v2.13.0, :189@v3.2.0, :201@v3.6.1).
  # `too many requests` and `status 429` are printed by nothing: git prints `RPC failed; HTTP 429 curl 22 The requested URL returned error: 429`, go-github prints
  # `API rate limit of N still exceeded until …` / `API secondary rate limit exceeded until …`; GitHub's own `API rate limit exceeded` body is server side (unverified).
  pattern: 'rate limit (exceeded|of \d+ still exceeded)|secondary rate limit|HTTP 429|returned error: 429'
  meaning: Polling is too frequent and the Git host refuses requests. Syncs are delayed. The lines are the applicationset controller's error line that carries the go-github error text (GitHub generators) and the repo-server's failed-RPC line that carries git's stderr on an HTTP 429.
  cause: Many apps with a short polling interval (default 3 minutes), no webhook configured.
  verify: "kubectl get cm -n argocd argocd-cm -o jsonpath='{.data.timeout\\.reconciliation}'"
  warn_at: 5
  fail_at: 200
  source:
    - "google/go-github github/github.go:978,1006,1126,1180,1294@v63.0.0"
    - "google/go-github github/github.go:1079,1107,1228,1282,1431@v69.2.0"
    - "git/git remote-curl.c:846@v2.43.0"
    - "git/git http.c:1732@v2.43.0"
    - "argoproj/pkg exec/exec.go:31,33@d56162821bd1"
    - "argoproj/argo-cd util/exec/exec.go:111,113@v3.2.0"
    - "argoproj/argo-cd util/exec/exec.go:112,114@v3.6.1"
    - "argoproj/argo-cd applicationset/controllers/applicationset_controller.go:181@v3.2.0"
    - "argoproj/argo-cd applicationset/controllers/applicationset_controller.go:201@v3.6.1"
    - "argoproj/argo-cd controller/appcontroller.go:183@v2.13.0"
    - "argoproj/argo-cd controller/appcontroller.go:189@v3.2.0"
    - "argoproj/argo-cd controller/appcontroller.go:201@v3.6.1"
