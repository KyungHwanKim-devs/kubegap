    - "argoproj/argo-cd gitops-engine/pkg/cache/cluster.go:1137@v3.6.1"
    - "argoproj/argo-cd controller/appcontroller.go:2053@v2.13.0"
    - "argoproj/argo-cd controller/appcontroller.go:2237@v3.2.0"
    - "argoproj/argo-cd controller/appcontroller.go:2764@v3.6.1"
    - "argoproj/argo-cd util/log/logrus.go:45@v2.13.0"
    - "argoproj/argo-cd util/log/logrus.go:45@v2.14.0"
    - "argoproj/argo-cd util/log/logrus.go:48@v3.0.0"
