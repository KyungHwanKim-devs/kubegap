      since: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/metrics/metrics.go:46@v1.0.0 (labels nodepool, capacity_type), :50@v1.15.1 (labels nodepool, capacity_type, zone); no reason label since 1.0"
    - name: karpenter_nodeclaims_terminated
      before: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/metrics/metrics.go:44@v0.37.0 (labels reason, nodepool, capacity_type)"
