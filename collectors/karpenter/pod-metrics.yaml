  names:
    - name: karpenter_nodepools_limit
      since: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/controllers/metrics/nodepool/controller.go:48@v1.0.0, :47@v1.15.1"
    - name: karpenter_nodepool_limit
      before: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/controllers/metrics/nodepool/controller.go:49@v0.37.0"
- key: nodeclaims_created
  labels: [reason, nodepool]
  names:
    - name: karpenter_nodeclaims_created_total
      since: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/metrics/metrics.go:33@v1.0.0 (labels reason, nodepool, capacity_type), :35@v1.15.1 (labels reason, nodepool, min_values_relaxed)"
    - name: karpenter_nodeclaims_created
      before: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/metrics/metrics.go:31@v0.37.0 (labels reason, nodepool, capacity_type)"
- key: nodeclaims_terminated
  labels: [reason, nodepool]
