# Metric names kubegap reads from Karpenter's /metrics (step karpenter.controller-metrics, parsed by lib/summaries/karpenterctl.py through lib/foundations/podmetrics.py).
# names: newest spelling first. since = first release that emits the name (inclusive), before = first release that no longer does (exclusive).
# Karpenter v1.0.0 renamed or removed most of its metrics in one step, with no release emitting both spellings: counters got a _total suffix,
# the nodepool subsystem became nodepools, disruption became voluntary_disruption, provisioner_scheduling became scheduler, *_time_seconds
# became *_duration_seconds; interruption actions and consistency errors have no successor. Read in kubernetes-sigs/karpenter (core) and
# aws/karpenter-provider-aws (interruption) at v0.37.0, v1.0.0, v1.1.0 and v1.15.1. Lines are the Opts block of each definition.
- key: leader
  labels: [name]
  names:
    - name: leader_election_master_status
      source: "kubernetes-sigs/controller-runtime pkg/metrics/leaderelection.go:13@v0.18.2 and @v0.24.1 (karpenter go.mod)"
- key: process_start
  names:
    - name: process_start_time_seconds
      source: "prometheus/client_golang prometheus/process_collector.go:99@v1.19.1"
- key: rss
  names:
    - name: process_resident_memory_bytes
      source: "prometheus/client_golang prometheus/process_collector.go:94@v1.19.1"
- key: reconcile_errors
  labels: [controller]
  names:
    - name: controller_runtime_reconcile_errors_total
      source: "kubernetes-sigs/controller-runtime pkg/internal/controller/metrics/metrics.go:37@v0.14.6, :39@v0.24.1"
- key: nodepool_usage
  labels: [nodepool, resource_type]
  names:
    - name: karpenter_nodepools_usage
      since: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/controllers/metrics/nodepool/controller.go:60@v1.0.0, :61@v1.15.1"
    - name: karpenter_nodepool_usage
      before: "1.0.0"
      source: "kubernetes-sigs/karpenter pkg/controllers/metrics/nodepool/controller.go:61@v0.37.0"
- key: nodepool_limit
