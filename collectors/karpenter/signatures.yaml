# ---------------- karpenter (collectors/karpenter/signatures.yaml) ----------------
# `no instance type satisfied` and `incompatible with nodepool` were dropped: both live inside the error of the same "could not schedule pod" line (and the first changed to
# "no instance type satisfies/met/has ..." by v1.15.1, the second is gone there), so the message alternative counts that line once at every version.
- id: karpenter.insufficient-capacity
  name: Karpenter insufficient instance capacity
  component: karpenter
  area: scaling
  severity: medium
  sources: ["logs/pods/karpenter/*.log"]
  pattern: 'InsufficientInstanceCapacity|insufficient capacity, |could not schedule pod'
  meaning: EC2 has no capacity for the requested instance type/AZ ("failed launching nodeclaim" with error "insufficient capacity, with fleet error(s), InsufficientInstanceCapacity ..."), or no NodePool satisfies the pod's requirements ("could not schedule pod", the reason in its error field). Pods stay Pending.
  cause: Allowed instance types too narrow, spot capacity exhausted, node selector/taint mismatch.
  verify: "kubectl logs -n karpenter -l app.kubernetes.io/name=karpenter --since=24h | grep -iE 'insufficient|could not schedule'"
  source:
    - "aws/karpenter-provider-aws pkg/errors/errors.go:45@v0.37.0"
    - "aws/karpenter-provider-aws pkg/errors/errors.go:45@v1.0.0"
    - "aws/karpenter-provider-aws pkg/errors/errors.go:59@v1.15.1"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:499,507@v0.37.0"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:499,507@v1.0.0"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:871,881@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/cloudprovider/types.go:309@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/cloudprovider/types.go:341@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/cloudprovider/types.go:780@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:86@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:79@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:99@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/scheduler.go:108,284@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/scheduler.go:110,286@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/scheduler.go:331@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/nodeclaim.go:108@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/nodeclaim.go:109@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/provisioning/scheduling/nodeclaim.go:251,551,567,570@v1.15.1"
# `unsupported kubernetes version` and `kubernetes version .* is not supported` were dropped: no version prints them. The provider logs "failed validating kubernetes version" only up to v1.0.x;
# from v1.1.0 the validation error "validating kubernetes version, karpenter version is not compatible with K8s version X" is returned and logged by controller-runtime as "Reconciler error";
# v1.15.1 words it "karpenter is not compatible with kubernetes version (version=X)".
- id: karpenter.version-unsupported
  name: Karpenter does not support the cluster Kubernetes version
  component: karpenter
  area: platform
  severity: high
  sources: ["logs/pods/karpenter/*.log"]
  pattern: 'failed validating kubernetes version|validating kubernetes version, karpenter( version)? is not compatible with (K8s|kubernetes) version'
  meaning: The Karpenter controller considers the EKS Kubernetes version outside its supported range (MinK8sVersion..MaxK8sVersion of the provider). Up to v1.0.x this is the "failed validating kubernetes version" error line; from v1.1.0 it is the error field of the version controller's "Reconciler error". The nodeclass.status controller stops resolving AMIs, so new nodes do not launch or launch only with old AMIs.
  cause: EKS was upgraded without upgrading the Karpenter chart (or vice versa), or 1.x version validation is on and the patch version is outside the support table.
  verify: "kubectl logs -n karpenter -l app.kubernetes.io/name=karpenter --since=24h | grep -c 'validating kubernetes version'; helm list -n karpenter"
  warn_at: 1
  fail_at: 10
  source:
    - "aws/karpenter-provider-aws pkg/providers/version/version.go:36,72,85@v0.37.0"
    - "aws/karpenter-provider-aws pkg/providers/version/version.go:38,74,100@v1.0.0"
    - "aws/karpenter-provider-aws pkg/providers/version/version.go:78,116@v1.1.0"
    - "aws/karpenter-provider-aws pkg/providers/version/version.go:44,79,99,125@v1.15.1"
    - "aws/karpenter-provider-aws pkg/controllers/providers/version/controller.go:45@v1.1.0"
    - "aws/karpenter-provider-aws pkg/controllers/providers/version/controller.go:49@v1.15.1"
    - "awslabs/operatorpkg serrors/serrors.go:33@5e8ed3699dea"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:494@v0.24.1"
# "failed launching nodeclaim" is logged only for insufficient-capacity (and, from v1.0.0, NodeClass-not-ready) errors; every other launch error is returned as "launching nodeclaim, %w"
# and logged by controller-runtime as "Reconciler error" with the error field "launching nodeclaim, creating instance, ..." (v1.15.1: "creating nodeclaim, ..."), so that prefix is matched.
# `creating instance.*(error|failed)` and `launching.*error` were replaced by it: they needed a trailing "error"/"failed" word that EC2 messages do not contain.
- id: karpenter.launch-failed
  name: Karpenter node launch failed
  component: karpenter
  area: scaling
  severity: high
  sources: ["logs/pods/karpenter/*.log"]
  pattern: 'failed launching nodeclaim|"error":"launching nodeclaim, |VcpuLimitExceeded|UnauthorizedOperation|AccessDenied|InvalidParameter'
  meaning: A NodeClaim was created but the EC2 instance did not launch, so scale-out is stuck. Capacity errors are the "failed launching nodeclaim" line; IAM and parameter errors are the "Reconciler error" line whose error field starts "launching nodeclaim, creating instance" (EC2 code in the text).
  cause: Account vCPU limit, IAM permissions (Karpenter controller role, instance profile), AMI/subnet/security-group selectors matching nothing.
  verify: "kubectl get nodeclaims; kubectl logs -n karpenter -l app.kubernetes.io/name=karpenter --since=24h | grep -i 'launching nodeclaim'"
  source:
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:86,100,103@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:79,91,103@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/nodeclaim/lifecycle/launch.go:99,113,132@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/cloudprovider/types.go:838@v1.15.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:324@v0.18.2"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:324@v0.18.4"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:494@v0.24.1"
    - "go-logr/zapr zapr.go:207,254@v1.3.0"
    - "aws/karpenter-provider-aws pkg/cloudprovider/cloudprovider.go:101@v0.37.0"
    - "aws/karpenter-provider-aws pkg/cloudprovider/cloudprovider.go:120@v1.0.0"
    - "aws/karpenter-provider-aws pkg/cloudprovider/cloudprovider.go:170,176@v1.15.1"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:499,507,509@v0.37.0"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:499,507,509@v1.0.0"
    - "aws/karpenter-provider-aws pkg/providers/instance/instance.go:871,881@v1.15.1"
    - "aws/karpenter-provider-aws pkg/errors/errors.go:47@v0.37.0"
    - "aws/karpenter-provider-aws pkg/errors/errors.go:47@v1.0.0"
    - "aws/karpenter-provider-aws pkg/errors/errors.go:28,30,61,243,255@v1.15.1"
    - "aws/aws-sdk-go aws/awserr/types.go:13@v1.53.6"
    - "aws/aws-sdk-go aws/awserr/types.go:13@v1.55.5"
    - "aws/smithy-go errors.go:37@v1.28.2"
# karpenter.disruption-blocked is removed: DisruptionBlocked, "Cannot disrupt ...", "pdb prevents pod evictions" and the do-not-disrupt texts are Event messages or condition errors only
# (pkg/controllers/disruption/events/events.go:110-128@v0.37.0, pkg/controllers/state/statenode.go:344@v1.15.1); Karpenter's recorder never logs (pkg/events/recorder.go:86) and the
# controller-runtime event logger is wrapped by logging.IgnoreDebugEvents. "disruption budget" matched only "detected disruption budget errors" (an invalid budget spec). lib/summaries/events.py TRACKED covers DisruptionBlocked.
# `cannot evict pod` and `Cannot evict pod as it would violate the pod's disruption budget` were dropped: the first exists nowhere, the second is the apiserver's text, which Karpenter
# catches with IsTooManyRequests and turns into the FailedDraining Event (never logged). `eviction.*(failed|blocked)` matched nothing in that order.
# "failed evicting pod" (non-PDB eviction API error, ERROR) exists up to v1.5.x; from v1.6.0 the error is returned and reaches controller-runtime's "Reconciler error".
- id: karpenter.drain-failed
  name: Karpenter node drain failed
  component: karpenter
  area: resilience
  severity: medium
  sources: ["logs/pods/karpenter/*.log"]
  pattern: 'failed evicting pod|"error":"draining node, '
  meaning: The node is being drained but the eviction API or the pod listing failed ("failed evicting pod" up to v1.5.x; "Reconciler error" with error "draining node, ..." at every version). A PDB that blocks eviction is not in the log at all: it is the FailedDraining Event. Node replacement drags on and pods get force-killed on spot reclaim.
  cause: Eviction API errors, long pod terminationGracePeriod, pods stuck in Terminating. For PDB blocks read the FailedDraining events.
  verify: "kubectl get events -A --field-selector reason=FailedDraining | tail; kubectl get pdb -A; kubectl get pods -A | grep Terminating"
  warn_at: 5
  fail_at: 100
  source:
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/terminator/eviction.go:182@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/terminator/eviction.go:195@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/terminator/eviction.go:209@v1.5.0"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/terminator/eviction.go:303,317@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/controller.go:89@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/controller.go:108@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/controllers/node/termination/controller.go:209@v1.15.1"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:324@v0.18.2"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:324@v0.18.4"
    - "kubernetes-sigs/controller-runtime pkg/internal/controller/controller.go:494@v0.24.1"
    - "go-logr/zapr zapr.go:207,254@v1.3.0"
# The lowercase phrases `spot interruption`, `interruption (warning|notice)`, `rebalance recommendation` occur only in Event messages ("Spot interruption warning was triggered"), and
# `instance terminating` nowhere. The log line is "initiating delete from interruption message" with the queue message kind in the messageKind field: SpotInterruptionKind (0.37.x),
# spot_interrupted (from 1.0.0), capacity_reservation_interrupted (1.15.1). A rebalance recommendation is NoAction at every version (no delete line, Event only).
- id: karpenter.spot-interruption
  name: Spot or capacity-reservation interruption notice
  component: karpenter
  area: resilience
  severity: low
  sources: ["logs/pods/karpenter/*.log"]
  pattern: '"message":"initiating delete from interruption message".*"messageKind":"(SpotInterruptionKind|spot_interrupted|CapacityReservationInterruptionKind|capacity_reservation_interrupted)"'
  meaning: EC2 announced it will reclaim a spot node in 2 minutes and Karpenter deleted the NodeClaim ("initiating delete from interruption message" with messageKind spot_interrupted, SpotInterruptionKind on 0.37.x). Its pods get rescheduled. If frequent, widen the spot pool selection. Rebalance recommendations are Events only.
  cause: Spot market fluctuation. The narrower the instance types, the more frequent.
  verify: "kubectl get events -A | grep -i interrupt"
  warn_at: 3
  fail_at: 50
  source:
    - "aws/karpenter-provider-aws pkg/controllers/interruption/controller.go:148,219,297@v0.37.0"
    - "aws/karpenter-provider-aws pkg/controllers/interruption/controller.go:151,216@v1.0.0"
    - "aws/karpenter-provider-aws pkg/controllers/interruption/utils.go:63,164,219@v1.15.1"
    - "aws/karpenter-provider-aws pkg/controllers/interruption/messages/types.go:40@v0.37.0"
    - "aws/karpenter-provider-aws pkg/controllers/interruption/messages/types.go:40@v1.0.0"
    - "aws/karpenter-provider-aws pkg/controllers/interruption/messages/types.go:40,43@v1.15.1"
    - "kubernetes-sigs/karpenter pkg/operator/logging/logging.go:65@v0.37.0"
    - "kubernetes-sigs/karpenter pkg/operator/logging/logging.go:57@v1.0.0"
    - "kubernetes-sigs/karpenter pkg/operator/logging/logging.go:60@v1.15.1"
    - "uber-go/zap zapcore/json_encoder.go:365@v1.24.0"
    - "uber-go/zap zapcore/json_encoder.go:361@v1.27.0"
    - "uber-go/zap zapcore/json_encoder.go:361@v1.28.0"
