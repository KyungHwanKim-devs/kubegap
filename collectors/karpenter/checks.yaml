- id: karpenter.metrics-unreadable
  name: Karpenter controller metrics (:8000/metrics) could not be read
  area: observability
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    warn_expr: "not item['metrics_available'] or not item['leader_found']"
  target: "'cluster'"
  evidence: "f\"controller metrics read {item['metrics_available']}, leader identified {item['leader_found']}. Prometheus does not scrape Karpenter (no ServiceMonitor)\""
  severity_default: low
  symptom_linked: false
  why: >
    Karpenter exposes pool usage, interruption messages, cloud API errors and pod startup time on :8000. kube-prometheus-stack does not scrape it by default, so kubegap reads it via pod proxy → curl inside the node. If neither works, every metrics check in this collector looks like a pass.
  suggest: "Helm values serviceMonitor.enabled true. Then it accumulates in Prometheus and trends become visible."
  verify:
    - "kubectl get servicemonitor -A | grep -i karpenter"
  profiles: [prod]
  test:
    cases:
      - expect: "warn"
        item:
          present: true
          version: "0.37.0"
          k8s_supported: false
          replicas: 2
          ready: 2
          all_same_node: false
          on_karpenter_node: []
