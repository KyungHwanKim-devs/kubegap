- id: karpenter.ec2nodeclass-hardening
  name: EC2NodeClass IMDS hop limit, tokens and root volume encryption
  area: security
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "len(item['classes_imds_tokens_optional']) > 0"  # only allowing IMDSv1 fails; hop 2 is warn (same criterion as security.imds-hop-limit)
    warn_expr: "len(item['classes_imds_hop_gt1']) > 0 or len(item['classes_root_unencrypted']) > 0"
  target: "'cluster'"
  evidence: "f\"IMDS hop limit 2 or more {item['classes_imds_hop_gt1']}, tokens optional {item['classes_imds_tokens_optional']}, root volume encrypted not set {item['classes_root_unencrypted']} (size {item['root_volume_gb']}GB)\""
  severity_default: high
  symptom_linked: false
  why: >
    security.imds-hop-limit looks at the value on instances running now. This check looks at the **cause** — EC2NodeClass metadataOptions.httpPutResponseHopLimit is 2, so every new node also comes up with hop 2. With hop 1, pods (one hop behind the bridge) cannot obtain the node role credentials. httpTokens required enforces IMDSv2. Without root volume encrypted, the node disk (container images, logs, emptyDir) is plaintext.
    Measured on a real EKS cluster: hop 2 (fail), tokens required, 50Gi gp3 root volume without encryption (warn).
  suggest: "EC2NodeClass metadataOptions.httpPutResponseHopLimit 1 (pods using IRSA or Pod Identity are unaffected), blockDeviceMappings.ebs.encrypted true. Nodes are replaced through drift."
  verify:
    - "kubectl get ec2nodeclass default -o jsonpath='{.spec.metadataOptions}{\"\\n\"}{.spec.blockDeviceMappings}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.37.0"
          k8s_supported: false
          replicas: 2
          ready: 2
          all_same_node: false
          on_karpenter_node: []
