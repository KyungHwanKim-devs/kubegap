- id: karpenter.interruption-handling
  name: Spot interruption and rebalance message handling (interruption queue and actual handling counts)
  area: resilience
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "not item['interruption_queue']"
    warn_expr: "item['metrics_available'] and (((item['interruption_messages_by_type'] or {}).get('SpotInterruptionKind', 0) / max(item.get('leader_uptime_days') or 1, 1)) >= 10 or (item['cloudprovider_errors_total'] or 0) >= 100)"  # cumulative since the leader started, so judged as a daily average — 252 over 58 days (4/day) is normal
  target: "'cluster'"
  evidence: "f\"INTERRUPTION_QUEUE {item['interruption_queue']}, messages received since leader start ({item.get('leader_uptime_days')} days ago) {item['interruption_messages_by_type']}, actions {item['interruption_actions']}, cloud API errors {item['cloudprovider_errors']}, NodeClaim termination reasons {item['nodeclaims_terminated_by_reason']}\""
  severity_default: high
  symptom_linked: true
  why: >
    Without an interruption queue (SQS + EventBridge) the 2-minute spot reclaim warning is never received and pods are cut off without a drain (same premise as scaling.karpenter-no-interruption-queue — this check adds "how many were received and actually handled"). SpotInterruptionKind in the hundreds means a pool with frequent spot reclaims, so prod must not sit on a single spot type (resilience.prod-concentration).
    Measured on a real EKS cluster: queue present; since leader start 252 spot interruptions, 313 rebalance recommendations, 1,005 CordonAndDrain actions, 251 NodeClaims terminated for interruption — warn. 33 cloud API errors (NodeClaimNotFound — re-reading an already deleted node, harmless).
  suggest: "Mix on-demand into the prod NodePool (capacity-type spot,on-demand + weights) or widen the instance types to lower the reclaim probability. If CordonAndDrain is low compared to interruption messages, check the queue permissions."
  verify:
    - "karpenter_interruption_received_messages from the pod /metrics (metrics/pod/karpenter/)"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.37.0"
          k8s_supported: false
          replicas: 2
          ready: 2
          all_same_node: false
          on_karpenter_node: []
