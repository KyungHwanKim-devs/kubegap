          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/KarpenterControllerRole-my-cluster-eks"
          interruption_queue: null
          drift_enabled: true
          spot_to_spot_consolidation: false
          feature_gates:
            Drift: "true"
            SpotToSpotConsolidation: "false"
          ec2nodeclasses: 1
          ami_families:
            - "AL2"
          classes_al2:
            - "default"
          classes_ami_unpinned:
            - "default"
          classes_imds_hop_gt1:
            - "default"
          classes_imds_tokens_optional: []
          classes_root_small: []
          classes_root_unencrypted:
            - "default"
