- id: karpenter.nodepool-usage-near-limit
  name: NodePool usage is close to its limits (at the limit no nodes come up for Pending pods)
  area: scaling
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and (item['nodepool_usage_max'] or 0) >= 0.9"
    warn_expr: "item['metrics_available'] and (item['nodepool_usage_max'] or 0) >= 0.75"
  target: "'cluster'"
  evidence: "f\"usage/limit per pool and resource {item['nodepool_usage_ratio']}, pools without limits {item['nodepools_without_limits']}\""
  severity_default: medium
  symptom_linked: true
  why: >
