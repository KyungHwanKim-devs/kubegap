- id: karpenter.spot-to-spot-consolidation-off
  name: SpotToSpotConsolidation is off, so spot nodes are not replaced by cheaper spot
  area: cost
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    warn_expr: "item['spot_to_spot_consolidation'] is False and (item['nodeclaims_terminated_by_reason'] or {}).get('interruption', 0) > 0"
  target: "'cluster'"
  evidence: "f\"FEATURE_GATES {item['feature_gates']}, NodeClaims terminated by spot interruption {(item['nodeclaims_terminated_by_reason'] or {}).get('interruption', 0)}, drift {item['drift_enabled']}\""
  severity_default: low
  symptom_linked: false
  why: >
    By default spot-to-spot consolidation is off (to avoid churn), so while a spot node is running it is not replaced even when a cheaper or safer spot type appears. When enabled it only acts with 15 or more candidate instance types, and the Unconsolidatable events disappear. Measured on a real EKS cluster: off, 42 Unconsolidatable events.
  suggest: "FEATURE_GATES=SpotToSpotConsolidation=true plus a wide instance type list in the NodePool. Turn it off again if churn appears."
