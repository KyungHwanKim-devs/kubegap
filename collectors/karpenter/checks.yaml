          drift_enabled: true
          spot_to_spot_consolidation: false
          feature_gates:
            Drift: "true"
            SpotToSpotConsolidation: "false"
          ec2nodeclasses: 1
          ami_families:
            - "AL2"
          classes_al2:
            - "default"
          classes_ami_unpinned:
            - "default"
          classes_imds_hop_gt1:
            - "default"
          classes_imds_tokens_optional:
            - "default"
          classes_root_small: []
          classes_root_unencrypted:
            - "default"
          classes_not_ready: []
          root_volume_gb:
            default: 50.0
          metrics_available: true
          leader_found: true
          nodepool_usage_ratio:
            default/cpu: 0.006
            default/memory: 0.046
            system-ondemand/cpu: 0.03
            system-ondemand/memory: 0.033
          nodepool_usage_max: 0.046
          nodeclaims_created_by_reason:
            provisioning: 726
            expiration/replace: 4
          nodeclaims_terminated_by_reason:
