- id: karpenter.ec2nodeclass-al2
  name: EC2NodeClass uses the AL2 AMI family (end of support — no AMI from 1.33 on)
  area: platform
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "len(item['classes_al2']) > 0"
  target: "'cluster'"
  evidence: "f\"EC2NodeClass {item['ec2nodeclasses']} total, amiFamily AL2 {item['classes_al2']}, AMI families {item['ami_families']}, AMI not pinned (auto-tracks latest) {item['classes_ami_unpinned']}\""
  severity_default: high
  symptom_linked: false
  why: >
    End of support for the Amazon Linux 2 EKS AMI was announced in 2024-11 and no AL2 AMI is published from Kubernetes 1.33 on. After an EKS upgrade Karpenter cannot find an AMI for new nodes and scale-out stops (eks.node-os-skew looks at the OS of current nodes; this check looks at the configuration of nodes yet to come).
    If the AMI is not pinned (no amiSelectorTerms, or @latest), every new AMI release replaces nodes through drift — fine if intended, but business-hours replacement must be blocked with budgets.
    Measured on a real EKS cluster: the default class was AL2 with no selector → fail.
  suggest: "Switch amiFamily to AL2023 and set amiSelectorTerms alias al2023@v2026… (pinned version). Drift is on (Drift=true), so nodes are replaced in sequence — set budgets first. Karpenter 0.37 should be upgraded to 1.x first (platform.karpenter-version-compat)."
  verify:
    - "kubectl get ec2nodeclass -o jsonpath='{.items[*].spec.amiFamily}' ; kubectl get ec2nodeclass -o jsonpath='{.items[*].spec.amiSelectorTerms}'"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.37.0"
          k8s_supported: false
          replicas: 2
          ready: 2
          all_same_node: false
          on_karpenter_node: []
          has_pdb: true
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/KarpenterControllerRole-my-cluster-eks"
          interruption_queue: "my-cluster-eks-karpenter"
          drift_enabled: true
          spot_to_spot_consolidation: false
          feature_gates:
            Drift: "true"
            SpotToSpotConsolidation: "false"
          ec2nodeclasses: 1
          ami_families:
            - "AL2"
          classes_al2:
            - "default"
          classes_ami_unpinned:
            - "default"
          classes_imds_hop_gt1:
            - "default"
          classes_imds_tokens_optional: []
          classes_root_small: []
          classes_root_unencrypted:
            - "default"
          classes_not_ready: []
          root_volume_gb:
            default: 50.0
          metrics_available: true
          leader_found: true
          nodepool_usage_ratio:
            default/cpu: 0.006
            default/memory: 0.046
            system-ondemand/cpu: 0.03
            system-ondemand/memory: 0.033
          nodepool_usage_max: 0.046
          nodeclaims_created_by_reason:
            provisioning: 726
            expiration/replace: 4
