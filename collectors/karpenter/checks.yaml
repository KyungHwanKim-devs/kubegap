- id: karpenter.consistency-errors
  name: Karpenter consistency errors and cluster state not synced
  area: scaling
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "item['metrics_available'] and item['cluster_state_synced'] is False"
    warn_expr: "item['metrics_available'] and ((item['consistency_errors'] or 0) > 0 or (item['reconcile_errors_total'] or 0) > 0)"
  target: "'cluster'"
  evidence: "f\"cluster state synced {item['cluster_state_synced']}, consistency errors {item['consistency_errors']}, reconcile errors {item['reconcile_errors']}, pod startup average {item['pods_startup_avg_s']}s ({item['pods_startup_count']} pods), node termination average {item['node_termination_avg_s']}s\""
  severity_default: medium
  symptom_linked: false
  why: >
    With cluster_state_synced 0 Karpenter has not read the full node and pod state and stops making scheduling decisions (normal briefly after startup). Consistency errors (check=Termination etc.) mean a NodeClaim and the real instance disagree — a node whose termination never finished may be left behind.
    Measured on a real EKS cluster: synced, 3 consistency errors (Termination), 0 reconcile errors — warn.
  suggest: "Compare non-Ready entries in kubectl get nodeclaims with instances shutting down in the EC2 console."
  verify:
    - "kubectl get nodeclaims ; karpenter_consistency_errors from the pod /metrics"
