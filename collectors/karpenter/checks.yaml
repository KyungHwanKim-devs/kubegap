# Karpenter controller checks. summary.karpenterctl.summary — lib/karpenterctl.py. NodePool/NodeClaim status, latency, budgets and version compatibility are covered by core scaling.karpenter-* and eks-platform platform.karpenter-version-compat.
- id: karpenter.controller-availability
  name: Karpenter controller replicas, spread, PDB and own node (if the controller dies, scale-out and spot interruption handling stop)
  area: scaling
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "(item['ready'] or 0) < (item['replicas'] or 0) or (item['replicas'] or 0) < 2 or item['all_same_node'] or len(item['on_karpenter_node']) > 0"
    warn_expr: "not item['has_pdb']"
  target: "'cluster'"
  evidence: "f\"karpenter v{item['version']}: replicas {item['replicas']} / ready {item['ready']}, all on one node {item['all_same_node']}, running on a Karpenter-made node {item['on_karpenter_node']}, PDB {item['has_pdb']}, leader identified {item['leader_found']}\""
  severity_default: high
  symptom_linked: true
  why: >
    Without the controller, no nodes come up for Pending pods and nobody handles the 2-minute spot interruption warning (interruption queue), so pods are cut off without a drain. If the controller runs on a node it created, consolidating that node removes its own footing — the Karpenter docs say to put it on a managed node group or Fargate.
    Measured on a real EKS cluster: 2/2 on two managed node group nodes with a PDB — pass.
  suggest: "Keep replicas 2 + PDB and pin it to a managed node group with a nodeSelector."
  verify:
    - "kubectl get pods -n karpenter -o wide ; kubectl get pdb -n karpenter"
  profiles: [prod]
  test:
    cases:
      - expect: "fail"
        item:
          present: true
          version: "0.37.0"
          k8s_supported: false
          replicas: 2
          ready: 1
          all_same_node: false
          on_karpenter_node: []
          has_pdb: true
          has_dedicated_role: true
          irsa_role: "arn:aws:iam::<account>:role/KarpenterControllerRole-my-cluster-eks"
          interruption_queue: "my-cluster-eks-karpenter"
          drift_enabled: true
          spot_to_spot_consolidation: false
          feature_gates:
            Drift: "true"
            SpotToSpotConsolidation: "false"
          ec2nodeclasses: 1
          ami_families:
            - "AL2"
          classes_al2:
            - "default"
          classes_ami_unpinned:
            - "default"
          classes_imds_hop_gt1:
            - "default"
          classes_imds_tokens_optional: []
          classes_root_small: []
          classes_root_unencrypted:
            - "default"
          classes_not_ready: []
          root_volume_gb:
            default: 50.0
          metrics_available: true
          leader_found: true
          nodepool_usage_ratio:
            default/cpu: 0.006
            default/memory: 0.046
