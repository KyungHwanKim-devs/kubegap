- id: karpenter.no-dedicated-role
  name: Karpenter controller ServiceAccount has no IRSA or Pod Identity role
  area: security
  type: summary
  each: karpenterctl.summary
  cluster_level: true
  rule:
    expr: "not item['has_dedicated_role']"
  target: "'cluster'"
  evidence: "f\"ServiceAccount karpenter: IRSA role {item['irsa_role']}\""
  severity_default: high
  symptom_linked: false
  why: >
    Karpenter needs EC2 RunInstances, TerminateInstances, CreateFleet and IAM PassRole permissions. Without a dedicated role those permissions end up in the node role, and every pod on the node can create and delete instances. Measured on a real EKS cluster: a dedicated controller role was present — pass.
  suggest: "A dedicated role with KarpenterControllerPolicy via IRSA or Pod Identity."
  verify:
    - "kubectl get sa -n karpenter karpenter -o jsonpath='{.metadata.annotations}'"
