# Karpenter collection. All read-only.
# NodePool/NodeClaim status, provisioning latency, expired-but-not-replaced nodes, DisruptionBlocked and budgets are covered by the scaling section (summary.scaling.karpenter) from objects, events and logs. Here: the controller itself and its metrics:
# EC2NodeClass settings (AMI family, IMDS, root volume), controller replicas/IRSA/feature gates, and from :8000/metrics pool usage vs limits, NodeClaim create/terminate/disruption reasons, spot interruption messages, cloud API errors, cluster state sync, pod startup time.
# Prometheus usually does not scrape these metrics. pod-metrics reads them via the API proxy first, then curl from inside the node. instance_type_offering_* is ~6,000 series, so keep filters it out.
- id: controller-metrics
  unit: metrics
  type: pod-metrics
  namespace: karpenter
  selector: app.kubernetes.io/name=karpenter
  port: 8000
  discover: { kind: deployment, name: "*/*karpenter", port_names: [http-metrics] }
  path: /metrics
  out: metrics/pod/karpenter
  # Both spellings, before and since Karpenter 1.0 (collectors/karpenter/pod-metrics.yaml): nodepool_/nodepools_, disruption_/voluntary_disruption_, provisioner_scheduling_/scheduler_, *_time_seconds/*_duration_seconds
  keep: '^(karpenter_(nodepools?_|nodeclaims_|nodes_(created|terminated|eviction_requests_total|termination_(time|duration)_seconds_(sum|count))|interruption_|cloudprovider_(errors_total|duration_seconds_(sum|count))|cluster_state_synced|consistency_errors|pods_startup_(time|duration)_seconds_(sum|count)|pods_eviction_requests_total|disruption_(eligible_nodes|budgets_allowed_disruptions|nodes_disrupted_total|pods_disrupted_total|actions_performed_total|queue_depth)|voluntary_disruption_(eligible_nodes|decisions_total|queue_failures_total)|provisioner_scheduling_(queue_depth|duration_seconds_(sum|count))|scheduler_(queue_depth|scheduling_duration_seconds_(sum|count))|nodes_eviction_queue_depth)|controller_runtime_reconcile_errors_total|leader_election|process_(start_time|resident_memory_bytes))'
  source: "names and their definitions per version: collectors/karpenter/pod-metrics.yaml. The default --metrics-port is 8000 through v0.37 and 8080 from v1.0.0 (kubernetes-sigs/karpenter pkg/operator/options/options.go:88@v0.37.0, :89@v1.0.0, :216@v1.15.1), the chart's controller.metrics.port, container port http-metrics (aws/karpenter-provider-aws charts/karpenter/values.yaml:165-167@v1.15.1, templates/deployment.yaml:109-110,221-224@v1.15.1): discovery reads the port from the container, so the 8000 here is the pre-1.0 fallback only. The pod label app.kubernetes.io/name=karpenter is the chart's (templates/_helpers.tpl:51-54@v1.15.1, deployment.yaml:23-26); namespace karpenter is the chart README's (README.md:16@v1.15.1), the website moved to kube-system at v0.33 (website/content/en/preview/getting-started/getting-started-with-karpenter/_index.md:47@v0.33.0)"
  timeout: 30
