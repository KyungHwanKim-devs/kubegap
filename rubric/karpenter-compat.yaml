# Kubernetes minors each Karpenter version supports (check platform.karpenter-version-compat, lib/summaries/scaling.py:_karpenter). Read in source (#130): the
# table the Karpenter documentation's compatibility matrix is generated from, `aws/karpenter-provider-aws hack/docs/compatibilitymatrix_gen/compatibility.yaml`
# at v1.15.1 (the matrix itself: website/content/en/docs/upgrading/compatibility.md:18-20@v1.15.1). Cited per row.
# `karpenter` is a minor ("1.4", every 1.4.x) or a patch ("1.0.5": that patch and the later ones of its minor); the row with the highest version not
# above the installed one applies. `min_k8s` and `max_k8s` are both judged. Outside the table the check reports "cannot verify (warn)"; a new Karpenter
# minor is one row. v1.15.x is not in the generated table at v1.15.1, so it has no row until a later tag lists it. On 1.x a version outside the table
# makes the nodeclass.status controller report 'failed validating kubernetes version'. The rows start at 0.21, the oldest the generated table lists.
