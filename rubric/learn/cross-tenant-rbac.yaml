  - { title: "Kubernetes: Using RBAC Authorization", url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/", why: "The table of user-facing roles says exactly what admin, edit and view allow." }
  - { title: "Kubernetes: Multi-tenancy", url: "https://kubernetes.io/docs/concepts/security/multi-tenancy/", why: "Where RBAC sits among namespaces, quotas, network policy and node isolation, for teams and for customers." }
  - { title: "Kubernetes: Auditing", url: "https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/", why: "How an audit policy is written and what each level records." }
  - { title: "Amazon EKS: Grant IAM users access to Kubernetes with EKS access entries", url: "https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html", why: "How an IAM identity is tied to a Kubernetes group or an access policy on EKS." }
