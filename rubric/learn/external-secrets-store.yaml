# What a report teaches when a SecretStore or ClusterSecretStore of External Secrets Operator is not Ready. Every page below was opened and read
# (2026-11-14).
topic: external-secrets-store
checks: [eso.store-not-ready]
mechanism: >
  External Secrets Operator copies values from an external secret store into ordinary Kubernetes Secrets. Two resources divide the work. An
  ExternalSecret declares what to fetch and what the resulting Secret looks like. A SecretStore says how to reach the external API: the provider,
  the region, the credentials. A SecretStore is namespaced and cannot be referenced from another namespace; a ClusterSecretStore is the
  cluster-wide variant that ExternalSecrets in every namespace can reference.


  The controller keeps a Ready condition on each store, which says that the store is able to be referenced by ExternalSecrets. When validation
  fails, for example because the credentials are no longer accepted, the condition turns False with the reason ValidationFailed, and while it is
  False the ExternalSecret controllers do not attempt to fetch through that store. Each ExternalSecret that uses it then reports Ready False as
  well, because its last refresh was not successful.


  What stops is the flow from the external store into the cluster: a value rotated there no longer arrives, and an ExternalSecret added after the
  failure has nothing fetched for it. The pages read do not say what the operator does with Secrets it created before the store failed, so this
  topic claims nothing about them; the state to act on is that rotation is not applied at all while the store is not Ready.


  The reach of one failing store follows from its kind. A not-Ready SecretStore affects one namespace. A not-Ready ClusterSecretStore, which is
  usually the single gateway to the provider, stops every ExternalSecret in the cluster that points at it.
sources:
  - { title: "External Secrets Operator: overview", url: "https://external-secrets.io/latest/introduction/overview/" }
  - { title: "External Secrets Operator: SecretStore", url: "https://external-secrets.io/latest/api/secretstore/" }
  - { title: "External Secrets Operator: ExternalSecret", url: "https://external-secrets.io/latest/api/externalsecret/" }
  - { title: "External Secrets Operator: Metrics", url: "https://external-secrets.io/latest/api/metrics/" }
detect:
  - kind: alert
    what: >
      Syncs that fail. The operator counts every ExternalSecret sync in externalsecret_sync_calls_total and the failed ones in
      externalsecret_sync_calls_error; a rule on the error counter fires shortly after a store stops working.
    example: |
      - alert: ExternalSecretSyncErrors
        expr: increase(externalsecret_sync_calls_error[15m]) > 0
        for: 15m
  - kind: metric
    what: >
      The Ready condition as a time series. The operator exports secretstore_status_condition and clustersecretstore_status_condition for the
      stores and externalsecret_status_condition for each ExternalSecret, and externalsecret_provider_api_calls_count with the labels provider,
      call and status for the calls to the provider.
    example: 'sum by (provider, call, status) (rate(externalsecret_provider_api_calls_count[5m]))'
  - kind: dashboard
    what: The Grafana dashboard the project publishes with its metrics documentation, an overview of the operator's syncs and reconciles.
    example: 'External Secrets Operator dashboard (linked from the metrics page)'
  - kind: command
    what: The condition message of the store, which names the cause (authentication, permission, region).
    example: 'kubectl describe clustersecretstore <name>'
solutions:
  - scale: [small]
    approach: >
      Scrape the operator and keep one alert, on the sync error counter. When it fires, read the condition message of the store.
    tools: ["External Secrets Operator", Prometheus]
    tradeoff: >
      A broken store is known soon after it breaks instead of at the next rotation, for one rule. The alert says that syncs fail, and the reason
      still has to be read from the store's condition.
  - scale: [medium, large]
    approach: >
      Alert on the status condition of each store and each ExternalSecret separately, import the project's dashboard, and set retrySettings on the
      store (a maximum number of retries and an interval between them, supported for AWS, HashiCorp Vault, IBM and Doppler). Treat the
      ClusterSecretStore as a shared dependency: one owner, and the reconcile and workqueue indicators from the metrics page as its service levels.
    tools: ["External Secrets Operator", Grafana, Prometheus]
    tradeoff: >
      A failing store is told apart from a single failing secret, and the calls to the provider are visible by status. More rules to tune, and
      retries hide brief failures that would otherwise have been noticed.
cases: []
reading:
  - { title: "External Secrets Operator: SecretStore", url: "https://external-secrets.io/latest/api/secretstore/", why: "The fields of a store, its Ready condition and the retry settings." }
  - { title: "External Secrets Operator: ExternalSecret", url: "https://external-secrets.io/latest/api/externalsecret/", why: "Refresh interval, creation and deletion policies, and what the Ready condition of a secret means." }
  - { title: "External Secrets Operator: Metrics", url: "https://external-secrets.io/latest/api/metrics/", why: "Every metric the operator exports, suggested service level indicators and the dashboard." }
