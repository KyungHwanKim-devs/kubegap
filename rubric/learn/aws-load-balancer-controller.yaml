  - { title: "Elastic Load Balancing: Health checks for Application Load Balancer target groups", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html", why: "The health check settings, the fail-open rule and the reason codes a target reports." }
  - { title: "Elastic Load Balancing: CloudWatch metrics for your Application Load Balancer", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html", why: "Which statistic of UnHealthyHostCount to alarm on and what the target group health metrics count." }
  - { title: "AWS Load Balancer Controller: Subnet auto-discovery", url: "https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/deploy/subnet_discovery/", why: "The tags and the filters that decide whether an ALB can be placed at all." }
