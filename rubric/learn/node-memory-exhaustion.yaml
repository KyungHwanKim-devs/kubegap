  - { title: "Kubernetes: Reserve Compute Resources for System Daemons", url: "https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/", why: "What kubeReserved and systemReserved are for, a worked example, and the order in which to start enforcing them." }
  - { title: "Kubernetes: Limit Ranges", url: "https://kubernetes.io/docs/concepts/policy/limit-range/", why: "How namespace defaults are applied at admission and the one inconsistency they do not check." }
  - { title: "Learning from Kubernetes cluster failure (Tibo Beijen)", url: "https://www.tibobeijen.nl/2019/02/01/learning-from-kubernetes-cluster-failure/", why: "A node memory failure told as a chain of contributing causes, including monitoring that lived in the failing cluster." }
