  - { title: "CNCF blog: Kubelet watches inodes. Just not until it's an emergency", url: "https://www.cncf.io/blog/2026/10/05/kubelet-watches-inodes-just-not-until-its-an-emergency/", why: "Why inodes run out before bytes, with the alert rule and the dashboard query to add." }
  - { title: "Kubernetes: Kubelet Configuration (v1beta1)", url: "https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/", why: "The image garbage collection, log rotation and eviction fields with their defaults." }
  - { title: "node_exporter mixin alerts", url: "https://raw.githubusercontent.com/prometheus/node_exporter/master/docs/node-mixin/alerts/alerts.libsonnet", why: "The filesystem rules most clusters already have, to see what they fire on and what they miss." }
