  - { title: "Loki: deployment modes", url: "https://grafana.com/docs/loki/latest/get-started/deployment-modes/", why: "Which mode fits which log volume, and what changes when one process is not enough." }
  - { title: "Grafana Alloy: loki.source.kubernetes_events", url: "https://grafana.com/docs/alloy/latest/reference/components/loki/loki.source.kubernetes_events/", why: "How events become log lines, and what happens to them across restarts." }
  - { title: "kubernetes-event-exporter", url: "https://github.com/resmoio/kubernetes-event-exporter", why: "Routing and filtering of events to the stores and chat tools it supports." }
