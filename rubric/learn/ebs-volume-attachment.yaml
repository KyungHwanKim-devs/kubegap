  - { title: "Amazon EBS: volume limits for Amazon EC2 instances", url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/volume_limits.html", why: "How the shared limit is calculated and which instance families have a dedicated one." }
  - { title: "Kubernetes: Node Shutdowns", url: "https://kubernetes.io/docs/concepts/cluster-administration/node-shutdown/", why: "What happens to StatefulSet pods and their volumes when a node dies, and how the out-of-service taint shortens it." }
