  - { title: "Kubernetes: Node-pressure Eviction", url: "https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/", why: "The order in which the kubelet picks pods to evict, which decides who pays when a build fills a node." }
  - { title: "Kubernetes: Multi-tenancy", url: "https://kubernetes.io/docs/concepts/security/multi-tenancy/", why: "Node isolation next to the other isolation tools, with what each does and does not protect." }
