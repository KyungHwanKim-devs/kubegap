  - { title: "KEDA: ScaledObject specification", url: "https://keda.sh/docs/2.17/reference/scaledobject-spec/", why: "Every default, and the fallback section with the trigger types it does and does not cover." }
  - { title: "KEDA: Authentication", url: "https://keda.sh/docs/2.17/concepts/authentication/", why: "All the places a TriggerAuthentication can take a credential from, and the namespace rules." }
