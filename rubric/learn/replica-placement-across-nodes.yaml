  - { title: "Kubernetes: Assigning Pods to Nodes", url: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/", why: "Required against preferred affinity, and how nodeSelector and affinity combine to narrow the eligible nodes." }
  - { title: "Descheduler README", url: "https://github.com/kubernetes-sigs/descheduler", why: "Why scheduling decisions go stale and which strategies correct them." }
  - { title: "Moonlight: Outage Post-Mortem", url: "https://updates.moonlightwork.com/outage-post-mortem-87370", why: "A short account of three replicas on one node." }
