  - { title: "Prometheus Operator: Storage", url: "https://prometheus-operator.dev/docs/platform/storage/", why: "How to give Prometheus a volume claim and what resizing one involves." }
  - { title: "Prometheus Operator: High Availability", url: "https://prometheus-operator.dev/docs/platform/high-availability/", why: "What two replicas do and do not give, and where a query layer comes in." }
  - { title: "Saifeddine Rajhi: Prometheus memory overload", url: "https://seifrajhi.github.io/blog/prometheus-manage-memory-overload/", why: "A walk through a Prometheus that could not restart, and how to find the metrics responsible." }
