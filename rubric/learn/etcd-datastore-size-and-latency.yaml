# What a report teaches when the cluster datastore (etcd, or k3s's kine) is large or slow. Every page below was opened and read (2026-11-14).
topic: etcd-datastore-size-and-latency
checks: [controlplane.etcd-db-size, platform.k3s-datastore-large, platform.k3s-datastore-slow]
mechanism: >
  Every Kubernetes object lives in one datastore, and that datastore has two ways to stop the cluster: it fills up, or its disk is too slow.


  Size. etcd keeps the history of every key, so its database grows with updates as well as with new objects: an object patched again and again
  leaves many revisions. Compaction drops the superseded revisions (the API server asks for one every 5 minutes by default), but it only leaves
  gaps inside the database file; the file shrinks when a defragmentation hands the space back to the filesystem, and a defragmentation blocks the
  member from reading and writing while it runs. etcd guards itself with a space quota, 2 GB by default with 8 GB as the suggested maximum. When
  the database passes the quota, etcd raises a cluster-wide NOSPACE alarm and accepts only reads and deletes. For Kubernetes that means no pod can
  be created and no Deployment scaled until someone compacts, defragments and disarms the alarm. EKS sets the quota to 8 GB and runs compaction
  and defragmentation itself; what remains for the operator is the number of live objects.


  What fills it is rarely the workloads. It is objects that accumulate with nothing deleting them: finished Jobs, events, status-heavy custom
  resources, or one component that creates records with a very long lifetime.


  Latency. etcd persists every proposal to its log with an fsync before it answers, and the leader sends a heartbeat every 100 ms; followers
  start an election after 1000 ms without one. Disk activity of other processes makes fsync slow, etcd misses heartbeats, requests time out and
  the leader is lost for a moment. etcd warns when applying a request takes more than 100 ms; the reference values are a 99th percentile below
  10 ms for the WAL fsync and below 25 ms for the backend commit. This is the usual trouble of a small k3s server whose disk also carries
  databases and a log store: k3s documents etcd as write intensive and recommends an SSD. A single-server k3s uses SQLite through kine by default
  and logs slow SQL statements instead.
