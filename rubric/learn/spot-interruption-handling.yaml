  - { title: "Amazon EC2: Spot Instance interruption notices", url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html", why: "The notice itself: two minutes, best effort, and the two places it is delivered." }
  - { title: "Amazon EKS best practices: Karpenter", url: "https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html", why: "Why narrow instance type lists hurt on spot, and the advice against running Node Termination Handler next to Karpenter's own handling." }
  - { title: "Karpenter: Scheduling", url: "https://karpenter.sh/docs/concepts/scheduling/", why: "The capacity-spread example for a fixed spot to on-demand ratio." }
