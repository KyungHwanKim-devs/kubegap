# What a report teaches when credentials sit in pod specs or ConfigMaps as literal values, or the question is how Secrets are stored on EKS. Every
# page below was opened and read (2026-11-14).
topic: secrets-in-plain-text
checks: [security.plaintext-secret-env, security.plaintext-configmap-secret, security.eks-secrets-encryption-off]
mechanism: >
  Kubernetes has two objects that look alike. A ConfigMap is an API object for non-confidential data in key-value pairs. A Secret is similar but
  specifically intended to hold confidential data, which lets the cluster treat it differently: access is granted separately in RBAC, and
  encryption at rest can be configured for it.


  A password written as a literal env value in a Deployment, or as a line in a ConfigMap, gets none of that. It is part of an object that everyone
  with read access to workloads or ConfigMaps can see, and it appears wherever the manifest goes: the Git repository, the output of kubectl
  describe, the Argo CD UI.


  A Secret is not safe by itself either. The value is base64 encoded, and base64 is not encryption; a Secret manifest checked into a repository is
  readable by everyone who can read the repository. Inside the cluster, list and watch on Secrets reveal the contents just as get does, and anyone
  who may create a pod in a namespace can read any Secret of that namespace by mounting it. By default Secrets are stored unencrypted in etcd.


  On EKS the last point depends on the version. All etcd data is encrypted at the disk level on every EKS cluster. On Kubernetes 1.28 and later EKS
  also envelope-encrypts all Kubernetes API data by default, with KMS v2 and a key owned by AWS, with no action and no extra cost; a customer
  managed key is optional. The older, separately enabled Secret encryption with a KMS key applies to 1.27 and lower and cannot be disabled once on.
  A customer managed key adds control and a failure mode: if it is disabled the API server can no longer decrypt what is in etcd and the cluster
  becomes degraded, and if it is deleted the cluster cannot be recovered.


  The check names of this topic are guesses by name (PASSWORD, SECRET, TOKEN, API_KEY); values are never recorded, and a hit is a candidate to look
  at, not a proof.
sources:
  - { title: "Kubernetes: Secrets", url: "https://kubernetes.io/docs/concepts/configuration/secret/" }
  - { title: "Kubernetes: Good practices for Kubernetes Secrets", url: "https://kubernetes.io/docs/concepts/security/secrets-good-practices/" }
  - { title: "EKS: Default envelope encryption for all Kubernetes API Data", url: "https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html" }
  - { title: "EKS: Encrypt Kubernetes secrets with KMS on existing clusters", url: "https://docs.aws.amazon.com/eks/latest/userguide/enable-kms.html" }
  - { title: "AWS Config: eks-secrets-encrypted", url: "https://docs.aws.amazon.com/config/latest/developerguide/eks-secrets-encrypted.html" }
  - { title: "Kubernetes: Auditing", url: "https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/" }
detect:
  - kind: alert
    what: >
      Whether an EKS cluster has an encryption configuration for Secrets. The AWS Config managed rule eks-secrets-encrypted is evaluated
      periodically and is NON_COMPLIANT when the cluster has no encryptionConfig with secrets among its resources. It looks at the configuration
      with a customer key, so a 1.28 cluster that relies on the default AWS-owned key is also reported.
    example: 'EKS_SECRETS_ENCRYPTED'
  - kind: alert
    what: >
      Unusual reading of Secrets. The Kubernetes good practices recommend audit rules that alert on events such as one user reading many Secrets
      at once; the API server audit log at the Metadata level carries who read which Secret.
    example: |
      - level: Metadata
        resources:
          - group: ""
            resources: ["secrets", "configmaps"]
  - kind: command
    what: >
      Literal secrets in manifests before they are merged. kube-linter enables the check env-var-secret by default; its remedy is to mount the
      secret as a file or use a secretKeyRef.
    example: 'env-var-secret'
solutions:
  - scale: [small]
    approach: >
      Move each value into a Secret and reference it with secretKeyRef (or mount it as a file), then rotate the value, because the old one has been
      readable in manifests. Keep the Secret manifest out of Git, or commit it sealed: Sealed Secrets encrypts it with a key only the controller in
      the cluster holds, and the result is safe to store in a repository. On EKS 1.28 or later, leave storage encryption at the default.
    tools: ["Kubernetes Secret", "Sealed Secrets"]
    tradeoff: >
      The value leaves the manifests and gets its own RBAC, for one small controller. Sealed Secrets renews its sealing key every 30 days and keeps
      the old ones in the cluster only; without a backup of those keys a lost cluster means new credentials and resealing everything.
    example: |
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
  - scale: [medium, large]
    approach: >
      Keep the values in a secret store outside the cluster and let External Secrets Operator create the Kubernetes Secrets from it, so that
      rotation happens in one place and Git holds only references. Restrict get, list and watch on Secrets to the components that need them, and
      turn on audit logging for Secrets. Bring a customer managed KMS key to EKS only when control over the key is required, and protect it against
      being disabled.
    tools: ["External Secrets Operator", "AWS KMS"]
    tradeoff: >
      One source of truth and rotation without touching manifests. The operator and the store become dependencies of every deployment, and a
      customer managed key that is disabled degrades the whole cluster.
cases: []
reading:
  - { title: "Kubernetes: Good practices for Kubernetes Secrets", url: "https://kubernetes.io/docs/concepts/security/secrets-good-practices/", why: "What administrators and developers each have to do so that a Secret is more than a renamed ConfigMap." }
  - { title: "EKS: Default envelope encryption for all Kubernetes API Data", url: "https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html", why: "What EKS encrypts by default since 1.28 and what happens when a customer key is disabled or deleted." }
  - { title: "Sealed Secrets", url: "https://github.com/bitnami-labs/sealed-secrets", why: "How a Secret can live in Git encrypted, and why the sealing keys need a backup." }
  - { title: "External Secrets Operator: overview", url: "https://external-secrets.io/latest/introduction/overview/", why: "How Secrets are synchronised from an external store and who owns which resource." }
  - { title: "kube-linter: checks", url: "https://raw.githubusercontent.com/stackrox/kube-linter/main/docs/generated/checks.md", why: "The manifest checks for secrets in environment variables and which of them run by default." }
