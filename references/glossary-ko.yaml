# 한국어 리포트의 용어집. 용어마다 리포트에 쓰는 표기(`use`)와 쓰지 않는 표기(`avoid`)를 적는다.
# 글쓴이는 이 목록을 받아서 쓰고, 코드(lib/output/glossary.py)가 다 쓰인 글에서 `avoid` 표기를 찾아 고치게 한다.
# 기준: 현업에서 쓰는 말을 그대로 쓴다. 영어로 부르는 것은 영어로, 한국어로 굳은 것은 한국어로. 풀어쓴 말을 새로 만들지 않는다.
# `avoid` 는 글에 그대로 나오는 글자다. 코드 블록과 백틱 안은 검사하지 않는다.
# 새 항목은 실제 리포트에서 어색한 표기가 나왔을 때 그 표기 그대로 넣는다. 아래는 2026-11-14 리포트에서 나온 것이다.
terms:
  - { use: "스케줄링 (파드가 노드에 배치되는 것)", avoid: ["파드를 놓", "놓였어요", "놓여요", "놓아요", "다시 놓", "놓는 순간", "놓을 때"] }
  - { use: "etcd 쓰기 지연, apply 지연", avoid: ["쓰기 반영"] }
  - { use: "group_by, 알림 그룹 기준", avoid: ["묶음 기준"] }
  - { use: "rate limit", avoid: ["받는 쪽 한도"] }
  - { use: "PVC 요청 용량", avoid: ["신청한 것보다", "신청에 "] }
  - { use: "silence", avoid: ["알림 침묵"] }
  - { use: "노드에 고정된 (nodeSelector, 로컬 볼륨 때문에 한 노드에서만 뜨는)", avoid: ["에 묶인 워크로드", "에 묶여 "] }
  - { use: "헤더", avoid: ["머리글"] }
  - { use: "HDD", avoid: ["회전 디스크"] }
  - { use: "샘플", avoid: ["표본"] }
  - { use: "eviction", avoid: ["퇴거"] }
  - { use: "롤아웃", avoid: ["펼쳐"] }
  - { use: "추천 해결 방안", avoid: ["권하는 조치"] }
  - { use: "문장으로 쓴다 (영향 범위를 라벨 목록으로 쓰지 않는다)", avoid: ["영향 있음:", "확인했고 멀쩡", "다른 이유로 바뀜:", "안 봄:"] }
  - { use: "문장으로 쓴다 (확실한 정도를 꼬리표로 붙이지 않는다)", avoid: [" 확인됨.", " 추정.", " 모름."] }
  # 아래는 처음 쓰는 사용자의 실행(2026-11-14)에서 나온 것이다.
  - { use: "값이 그대로 남아 있습니다, 마스킹되지 않았습니다", avoid: ["가려지지 않"] }
  - { use: "두 Application이 같은 리소스를 관리한다", avoid: ["두 주인", "주인이 둘"] }
  - { use: "같은 심각도로 본다", avoid: ["같은 무게로"] }
  - { use: "덤프 일곱 개, 사본 하나 (물건을 '벌'로 세지 않는다)", avoid: ["한 벌", "두 벌", "세 벌", "네 벌", "다섯 벌", "여섯 벌", "일곱 벌", "여덟 벌"] }
  - { use: "바로 설명한다 ('짚겠습니다' 같은 예고를 쓰지 않는다)", avoid: ["짚겠습니다", "하나씩 짚"] }
