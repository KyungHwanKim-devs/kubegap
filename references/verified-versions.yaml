    eks: "v1.32.13 (EKS 1.32)"
    k3s: "v1.33.5 (v1.33.5+k3s1)"
    newest: "v1.37.2"
    assumes: "the apiserver series are read under the job label kube-prometheus-stack gives them (`apiserver`), else a detected one"
    outside: "an older minor is read as is; a metric name that moved is caught by the series-presence record and the check skips naming it; the apiserver job comes from config key `apiserver_job` when detection fails"
